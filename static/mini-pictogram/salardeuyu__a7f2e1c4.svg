<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="salt-flat-title">
  <defs>
    <title id="salt-flat-title">Salar de Uyuni Salt Flat</title>
    <desc>Stylized depiction of hexagonal salt flat with mirror reflection</desc>
  </defs>
  <!-- Background: charcoal sky -->
  <rect width="120" height="120" fill="#1C1C1E"/>

  <!-- Mirror reflection (upper half, sky blue) -->
  <rect width="120" height="60" fill="#87CEEB" opacity="0.3"/>

  <!-- Salt flat (lower half, champagne/off-white) -->
  <rect y="60" width="120" height="60" fill="#D9C7A3"/>

  <!-- Hexagon tile pattern -->
  <g stroke="#3C3C3E" stroke-width="1.5" fill="none">
    <!-- Row 1 -->
    <polygon points="20,75 28,70 36,75 36,85 28,90 20,85" opacity="0.6"/>
    <polygon points="42,75 50,70 58,75 58,85 50,90 42,85" opacity="0.8"/>
    <polygon points="64,75 72,70 80,75 80,85 72,90 64,85"/>
    <polygon points="86,75 94,70 102,75 102,85 94,90 86,85" opacity="0.7"/>

    <!-- Row 2 -->
    <polygon points="31,95 39,90 47,95 47,105 39,110 31,105" opacity="0.7"/>
    <polygon points="53,95 61,90 69,95 69,105 61,110 53,105" opacity="0.9"/>
    <polygon points="75,95 83,90 91,95 91,105 83,110 75,105" opacity="0.65"/>
  </g>

  <!-- Reflection highlight (subtle water shimmer) -->
  <circle cx="60" cy="30" r="8" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="40" cy="40" rx="12" ry="4" fill="#FFFFFF" opacity="0.1"/>
</svg>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="huacachina-title huacachina-desc">
  <title id="huacachina-title">Huacachina Oasis</title>
  <desc id="huacachina-desc">A green teal oasis lagoon surrounded by champagne sand dunes in a desert</desc>
  <!-- Background (dark sky/desert) - charcoal neutral -->
  <rect width="64" height="64" fill="#3C3C3E"/>
  <!-- Dunes (champagne sand) -->
  <polygon points="8,48 16,24 24,48" fill="#D9C7A3"/>
  <polygon points="24,48 32,20 40,48" fill="#D9C7A3"/>
  <polygon points="40,48 48,26 56,48" fill="#D9C7A3"/>
  <!-- Sand base -->
  <ellipse cx="32" cy="52" rx="28" ry="12" fill="#D9C7A3"/>
  <!-- Oasis lagoon (teal primary) -->
  <circle cx="32" cy="32" r="10" fill="#7DAFA3" stroke="#FFFFFF" stroke-width="0.5"/>
  <!-- Water highlight (white) -->
  <ellipse cx="30" cy="30" rx="3" ry="2" fill="#FFFFFF" opacity="0.6"/>
</svg>

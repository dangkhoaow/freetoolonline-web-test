<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A373;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  <!-- Dunes (tan/brown triangles/curved shapes) -->
  <polygon points="8,48 16,24 24,48" fill="url(#duneGrad)" stroke="#6B5438" stroke-width="0.5"/>
  <polygon points="24,48 32,20 40,48" fill="#C19A6B" stroke="#6B5438" stroke-width="0.5"/>
  <polygon points="40,48 48,26 56,48" fill="url(#duneGrad)" stroke="#6B5438" stroke-width="0.5"/>
  <!-- Sand base -->
  <ellipse cx="32" cy="52" rx="28" ry="12" fill="#D2B48C" opacity="0.6"/>
  <!-- Oasis lagoon (green water) -->
  <circle cx="32" cy="32" r="10" fill="#2D8A3D" stroke="#1A5A2A" stroke-width="1"/>
  <!-- Water shimmer highlight -->
  <ellipse cx="30" cy="30" rx="3" ry="2" fill="#4FD978" opacity="0.6"/>
  <!-- Label -->
  <text x="32" y="60" font-size="8" text-anchor="middle" fill="#1C1C1E" font-weight="bold">OASIS</text>
</svg>

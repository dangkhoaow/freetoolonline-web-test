<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-fuji desc-fuji">
  <title id="title-fuji">Mount Fuji</title>
  <desc id="desc-fuji">3,776m volcanic cone with snow cap and forest slopes</desc>
  
  <!-- Sky background (ultramarine) -->
  <rect width="100" height="100" fill="#5B73AE"/>
  
  <!-- Mountain cone (dark volcanic rock - ink) -->
  <polygon points="50,15 85,85 15,85" fill="#1C1C1E"/>
  
  <!-- Snow cap (white triangle) -->
  <polygon points="50,15 62,45 38,45" fill="#FFFFFF"/>
  
  <!-- Forest band (teal) -->
  <polygon points="45,50 70,85 30,85" fill="#7DAFA3"/>
</svg>

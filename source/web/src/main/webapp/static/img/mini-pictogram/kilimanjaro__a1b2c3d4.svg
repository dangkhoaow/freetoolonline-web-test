<svg role="img" aria-labelledby="kilimanjaro-title kilimanjaro-desc" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <title id="kilimanjaro-title">Mount Kilimanjaro</title>
  <desc id="kilimanjaro-desc">Mountain cone with snow peaks</desc>
  <!-- Background -->
  <rect width="64" height="64" fill="#FFFFFF"/>
  <!-- Savanna -->
  <rect y="32" width="64" height="32" fill="#7DAFA3"/>
  <!-- Mountain lower slopes -->
  <path d="M 32 12 L 50 44 L 14 44 Z" fill="#3C3C3E"/>
  <!-- Mountain upper slopes + snowcap -->
  <path d="M 32 12 L 40 32 L 24 32 Z" fill="#1C1C1E"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#3C3C3E"/>
  <!-- Water -->
  <rect y="40" width="64" height="24" fill="#1a5f6f"/>
  <!-- Left cliff -->
  <polygon points="8,20 8,40 20,40" fill="#5a7a42"/>
  <!-- Right cliff -->
  <polygon points="44,20 56,20 56,40 44,40" fill="#5a7a42"/>
  <!-- Narrow pass between cliffs -->
  <rect x="20" y="28" width="24" height="12" fill="#1a5f6f"/>
  <!-- Waterfall -->
  <line x1="24" y1="20" x2="24" y2="40" stroke="#b3e5e0" stroke-width="2"/>
  <line x1="40" y1="22" x2="40" y2="40" stroke="#b3e5e0" stroke-width="2"/>
</svg>

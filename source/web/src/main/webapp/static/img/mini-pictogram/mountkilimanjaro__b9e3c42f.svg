<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kmj-title kmj-desc">
  <title id="kmj-title">Mount Kilimanjaro 3D Explorer</title>
  <desc id="kmj-desc">Mountain volcano with snow cap at the summit</desc>
  <!-- Sky background -->
  <rect width="100" height="100" fill="#3C3C3E"/>
  <!-- Base terrain -->
  <polygon points="0,70 100,70 100,100 0,100" fill="#7DAFA3"/>
  <!-- Mountain cone -->
  <polygon points="50,20 25,70 75,70" fill="#1C1C1E"/>
  <!-- Snow cap -->
  <polygon points="50,20 45,40 55,40" fill="#FFFFFF"/>
</svg>

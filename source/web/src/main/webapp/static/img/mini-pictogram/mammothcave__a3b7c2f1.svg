<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mammothcave-title mammothcave-desc">
  <title id="mammothcave-title">Mammoth Cave 3D</title>
  <desc id="mammothcave-desc">3D visualization of the world's longest cave system with formations and underground river</desc>
  
  <!-- Background: cave interior -->
  <rect width="128" height="128" fill="#1C1C1E"/>
  
  <!-- Ceiling rock formation (domed) -->
  <path d="M 10 40 Q 64 10 118 40 L 118 50 Q 64 30 10 50 Z" fill="#3C3C3E" stroke="none"/>
  
  <!-- Floor rock formation -->
  <rect x="10" y="85" width="108" height="33" fill="#3C3C3E"/>
  
  <!-- Stalactites hanging down -->
  <polygon points="32,50 28,75 36,75" fill="#B3C5B0"/>
  <polygon points="64,45 60,78 68,78" fill="#B3C5B0"/>
  <polygon points="96,52 92,76 100,76" fill="#B3C5B0"/>
  
  <!-- Stalagmites rising up -->
  <polygon points="40,85 36,65 44,65" fill="#B3C5B0"/>
  <polygon points="72,85 68,72 76,72" fill="#B3C5B0"/>
  <polygon points="104,85 100,70 108,70" fill="#B3C5B0"/>
  
  <!-- Echo River waterway (teal ribbon at bottom) -->
  <ellipse cx="64" cy="95" rx="22" ry="8" fill="#7DAFA3" opacity="0.9"/>
  <path d="M 45 95 Q 64 98 83 95" stroke="#7DAFA3" stroke-width="2" fill="none" opacity="1"/>
</svg>

<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-pamirplateau-title svg-minipictogram-pamirplateau-desc">
  <title id="svg-minipictogram-pamirplateau-title">Pamir Plateau 3D Explorer - roof of the world</title>
  <desc id="svg-minipictogram-pamirplateau-desc">High plateau flanked by converging mountain peaks with snow caps, the knot of world mountain ranges.</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <!-- left peak -->
  <path d="M6 44 L18 24 L30 44 Z" fill="none" stroke="#D9C7A3" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M16 28 Q18 24 20 28 Z" fill="#FFFFFF"/>
  <!-- tall center peak -->
  <path d="M20 44 L32 10 L44 44 Z" fill="none" stroke="#D9C7A3" stroke-width="3" stroke-linejoin="round"/>
  <path d="M29.5 15 Q32 10 34.5 15 L32 12 Z" fill="#FFFFFF"/>
  <!-- right peak -->
  <path d="M34 44 L46 26 L58 44 Z" fill="none" stroke="#D9C7A3" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44 30 Q46 26 48 30 Z" fill="#FFFFFF"/>
  <!-- plateau ground line -->
  <line x1="6" y1="44" x2="58" y2="44" stroke="#7DAFA3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- plateau fill band -->
  <path d="M6 44 H58 L58 49 H6 Z" fill="#7DAFA3" opacity="0.4"/>
</svg>

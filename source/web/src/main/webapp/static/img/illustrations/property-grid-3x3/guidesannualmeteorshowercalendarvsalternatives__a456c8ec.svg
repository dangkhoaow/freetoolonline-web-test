<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-propertygrid3x3-171d02-title svg-propertygrid3x3-171d02-desc">
  <title id="svg-propertygrid3x3-171d02-title">Radiant explorer vs Calendar explorer, compared side by side</title>
  <desc id="svg-propertygrid3x3-171d02-desc">Compare the two free in-browser meteor tools: the Radiant explorer shows one showers geometry, the Calendar explorer lists all 12 showers with peak date, ZHR, and activity window.</desc>
  <rect x="20" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Showers</text>
  <text x="90" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">covered</text>
  <rect x="170" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="240" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Key figures</text>
  <text x="240" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">per shower</text>
  <rect x="320" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="390" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Runs in</text>
  <text x="390" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">the browser</text>
  <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Radiant explorer</text>
  <text x="90" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1 at a time</text>
  <text x="240" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">geometry</text>
  <text x="390" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">yes, USD 0</text>
  <text x="20" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Calendar explorer</text>
  <text x="90" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">all 12</text>
  <text x="240" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">peak, ZHR, window</text>
  <text x="390" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">yes, USD 0</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-checklistcard-d8fe6e-title svg-checklistcard-d8fe6e-desc">
  <title id="svg-checklistcard-d8fe6e-title">A quick checklist for fast, throwaway lists</title>
  <desc id="svg-checklistcard-d8fe6e-desc">Best for a list you will use once and forget, with a live count of what is left. Not for reminders, due dates, or synced across devices.</desc>
  <rect x="16" y="16" width="388" height="188" rx="12" fill="#F0F0F2" aria-hidden="true"/>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1C1C1E">When this checklist fits</text>
  <path d="M 38 92 L 47 101 L 62 83" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="76" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#1C1C1E">Quick, one-off checklist</text>
  <path d="M 38 132 L 47 141 L 62 123" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="76" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#1C1C1E">No reminders or due dates</text>
  <path d="M 38 172 L 47 181 L 62 163" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="76" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#1C1C1E">No account or device sync</text>
</svg>

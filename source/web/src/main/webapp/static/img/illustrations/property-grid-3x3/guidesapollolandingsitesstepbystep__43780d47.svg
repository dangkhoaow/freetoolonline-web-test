<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-propertygrid3x3-004b44-title svg-propertygrid3x3-004b44-desc">
  <title id="svg-propertygrid3x3-004b44-title">Compare the six Apollo landings side by side, first to last mission</title>
  <desc id="svg-propertygrid3x3-004b44-desc">See all six crewed Apollo landings grouped side by side - Apollo 11 first on 1969-07-20, four missions from 1969 to 1972, then Apollo 17 last on 1972-12-11.</desc>
  <rect x="20" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">First</text>
  <text x="90" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">Apollo 11</text>
  <rect x="170" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="240" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Middle</text>
  <text x="240" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">Apollo 12-16</text>
  <rect x="320" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="390" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Last</text>
  <text x="390" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">Apollo 17</text>
  <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Landing date</text>
  <text x="90" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1969-07-20</text>
  <text x="240" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1969 to 1972</text>
  <text x="390" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1972-12-11</text>
  <text x="20" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Missions in group</text>
  <text x="90" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1</text>
  <text x="240" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">4</text>
  <text x="390" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1</text>
</svg>

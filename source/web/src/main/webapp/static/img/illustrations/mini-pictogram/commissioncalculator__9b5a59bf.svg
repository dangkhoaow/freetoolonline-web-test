  <circle cx="49" cy="46" r="2.2" fill="none" stroke="#E8C5C9" stroke-width="2"/>
  <line x1="50" y1="38" x2="41" y2="47" stroke="#E8C5C9" stroke-width="2.5" stroke-linecap="round"/>
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">COMM</text>

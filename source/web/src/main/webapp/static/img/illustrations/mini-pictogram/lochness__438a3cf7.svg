<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-lochness-title svg-minipictogram-lochness-desc">
  <title id="svg-minipictogram-lochness-title">Loch Ness - a straight fault-line loch</title>
  <desc id="svg-minipictogram-lochness-desc">A long, narrow, straight teal loch on a diagonal, with a dashed champagne fault line running the full diagonal and a small ink marker at the deepest point.</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#3C3C3E" aria-hidden="true"/>
  <g transform="rotate(-35 32 32)">
    <line x1="0" y1="32" x2="64" y2="32" stroke="#D9C7A3" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="10" y="27" width="44" height="10" rx="5" fill="#7DAFA3"/>
    <circle cx="32" cy="32" r="2.6" fill="#1C1C1E"/>
  </g>
</svg>

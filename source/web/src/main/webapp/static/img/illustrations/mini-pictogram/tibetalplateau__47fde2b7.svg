<svg viewBox="0 0 64 64" role="img" aria-labelledby="tibetan-title tibetan-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="tibetan-title">Tibetan Plateau</title>
  <desc id="tibetan-desc">High-altitude plateau with sparse peaks and thin mountain air</desc>
  <!-- Palette: ultramarine (sky), sage (plateau), charcoal (peaks), champagne (snow) -->
  <!-- Background: sky (ultramarine) -->
  <rect width="64" height="40" fill="#5B73AE"/>
  <!-- Plateau ground (sage) -->
  <rect y="40" width="64" height="24" fill="#B3C5B0"/>
  <!-- Rim peak silhouettes (charcoal) -->
  <polygon points="8,38 12,22 16,38" fill="#3C3C3E"/>
  <polygon points="24,40 28,18 32,40" fill="#3C3C3E"/>
  <polygon points="40,39 45,24 50,39" fill="#3C3C3E"/>
  <!-- Snow caps on peaks (champagne) -->
  <polygon points="12,24 11,28 13,28" fill="#D9C7A3"/>
  <polygon points="28,20 27,24 29,24" fill="#D9C7A3"/>
  <polygon points="45,26 44,30 46,30" fill="#D9C7A3"/>
</svg>

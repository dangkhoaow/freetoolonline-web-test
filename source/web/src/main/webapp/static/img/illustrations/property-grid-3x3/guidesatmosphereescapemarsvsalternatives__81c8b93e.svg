  <rect x="320" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="390" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Slider + worlds</text>

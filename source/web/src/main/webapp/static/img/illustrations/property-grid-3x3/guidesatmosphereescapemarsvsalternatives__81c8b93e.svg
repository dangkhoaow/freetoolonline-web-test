  <title id="svg-propertygrid3x3-0df5a0-title">Mars atmosphere explorers compared side by side: cost, key figure, sliders</title>
  <desc id="svg-propertygrid3x3-0df5a0-desc">Both cost USD 0, run at 0 MB. Mars explorer: about 100 g/s present-day loss, time slider, Mars only. Scale Heights: 11.1 km scale height, altitude slider, five worlds.</desc>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-decisiontree2branch-6dfbb6-title svg-decisiontree2branch-6dfbb6-desc">
  <title id="svg-decisiontree2branch-6dfbb6-title">Decide if the Parker Solar Probe explorer fits</title>
  <desc id="svg-decisiontree2branch-6dfbb6-desc">Choose this explorer for the real gravity-assist trajectory and heat-shield survival story behind how close Parker Solar Probe got to the Sun, or go to the Sun structure explorer instead.</desc>
  <path d="M 200 82 L 120 158 M 131.7 155.2 L 120 158 L 123.4 146.5" stroke="#5B73AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"/>
  <path d="M 280 82 L 360 158 M 348.3 155.2 L 360 158 L 356.6 146.5" stroke="#5B73AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" aria-hidden="true"/>
  <rect x="120" y="20" width="240" height="60" rx="10" fill="#3C3C3E" aria-hidden="true"/>
  <rect x="120" y="20" width="240" height="8" rx="4" fill="#5B73AE" aria-hidden="true"/>
  <text x="240" y="53" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="240" dy="0">Want the Parker</tspan><tspan x="240" dy="18">close-Sun story?</tspan></text>
  <rect x="20" y="170" width="200" height="80" rx="10" fill="#1C1C1E" stroke="#5B73AE" stroke-width="2" aria-hidden="true"/>
  <text x="120" y="205" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF"><tspan x="120" dy="0">Yes - open the</tspan><tspan x="120" dy="18">explorer</tspan></text>
  <rect x="260" y="170" width="200" height="80" rx="10" fill="#1C1C1E" stroke="#5B73AE" stroke-width="2" aria-hidden="true"/>
  <text x="360" y="205" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF"><tspan x="360" dy="0">No - try Sun</tspan><tspan x="360" dy="18">structure</tspan></text>
</svg>

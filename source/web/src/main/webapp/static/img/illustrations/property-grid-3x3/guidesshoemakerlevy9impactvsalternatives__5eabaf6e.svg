<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-propertygrid3x3-ee4dec-title svg-propertygrid3x3-ee4dec-desc">
  <title id="svg-propertygrid3x3-ee4dec-title">Compare Shoemaker-Levy 9 and DART impacts side by side</title>
  <desc id="svg-propertygrid3x3-ee4dec-desc">See the natural 1994 Shoemaker-Levy 9 comet impact set next to the deliberate 2022 DART spacecraft test, so you can pick the explorer that fits your question.</desc>
  <rect x="20" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Type</text>
  <text x="90" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">how it happened</text>
  <rect x="170" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="240" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">When</text>
  <text x="240" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">impact year</text>
  <rect x="320" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="390" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Body struck</text>
  <text x="390" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">target</text>
  <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Shoemaker-Levy 9</text>
  <text x="90" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">Natural comet</text>
  <text x="240" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1994</text>
  <text x="390" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">Jupiter</text>
  <text x="20" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">DART deflection</text>
  <text x="90" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">Human-made</text>
  <text x="240" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">2022</text>
  <text x="390" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">Dimorphos</text>
</svg>

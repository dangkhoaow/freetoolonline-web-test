<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-1205c5-title svg-featurebadge-1205c5-desc">
  <title id="svg-featurebadge-1205c5-title">Extract the text layer from a PDF and copy or download it</title>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-b323a0-title svg-featurebadge-b323a0-desc">
  <title id="svg-featurebadge-b323a0-title">Run ImageMagick commands online without a local install</title>
  <desc id="svg-featurebadge-b323a0-desc">Upload an image, supply the ImageMagick command flags you would type locally, and the server runs the command and returns the output image plus a full console log.</desc>
  <rect x="2" y="2" width="196" height="44" rx="22" ry="22" fill="#1C1C1E" stroke="#5B73AE" stroke-width="2.5" aria-hidden="true"/>
  <circle cx="22" cy="24" r="6" fill="#5B73AE" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38">no install</tspan></text>
</svg>

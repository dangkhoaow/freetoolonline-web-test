<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-97ae0b-title svg-featurebadge-97ae0b-desc">
  <title id="svg-featurebadge-97ae0b-title">Crop a JPG, PNG, or WebP in the browser - never uploaded to a server</title>
  <desc id="svg-featurebadge-97ae0b-desc">The crop runs inside the browser on a canvas; the picture is never sent to a backend and never persists past reload - good for a face or a personal document.</desc>
  <rect x="2" y="2" width="196" height="44" rx="22" ry="22" fill="#1C1C1E" stroke="#B3C5B0" stroke-width="2.5" aria-hidden="true"/>
  <circle cx="22" cy="24" r="6" fill="#B3C5B0" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38">no upload</tspan></text>
</svg>

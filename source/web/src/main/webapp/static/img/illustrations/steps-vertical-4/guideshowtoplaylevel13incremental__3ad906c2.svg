<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-stepsvertical4-f9f10a-title svg-stepsvertical4-f9f10a-desc">
  <title id="svg-stepsvertical4-f9f10a-title">Four steps to play Level 13 in your browser</title>
  <desc id="svg-stepsvertical4-f9f10a-desc">Press Play to load the game, explore the ruined city sector by sector, build up your camp, and let each run autosave - click-driven, no install and no account.</desc>
  <line x1="44" y1="50" x2="44" y2="260" stroke="#5B73AE" stroke-width="3" aria-hidden="true"/>
  <circle cx="44" cy="50" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">1</text>
  <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Press Play to load the game</text>
  <circle cx="44" cy="120" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">2</text>
  <text x="84" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Explore sector by sector</text>
  <circle cx="44" cy="190" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">3</text>
  <text x="84" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Build up your camp</text>
  <circle cx="44" cy="260" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">4</text>
  <text x="84" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Let each run autosave</text>
</svg>

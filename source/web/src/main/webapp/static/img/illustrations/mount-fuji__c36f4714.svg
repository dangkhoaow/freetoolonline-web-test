<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mount Fuji 3D Explorer icon</title>
  <desc id="desc">Stylized Mount Fuji mountain with snow-capped peak and forested slopes</desc>

  <!-- Define palette (4 colors only: charcoal, white, sage, dark-gray) -->
  <defs>
    <style>
      .bg { fill: #1C1C1E; }
      .peak { fill: #E8E8E8; }
      .slope { fill: #7DAFA3; }
      .stroke { stroke: #3C3C3E; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" class="bg" />

  <!-- Snow-capped peak (pale fill, palette-approved gray) -->
  <polygon points="50,20 70,60 30,60" class="peak" />

  <!-- Forested slopes (sage-green, palette-approved) -->
  <polygon points="70,60 85,85 15,85" class="slope" />

  <!-- Outline stroke for definition -->
  <polygon points="50,20 70,60 30,60" class="stroke" fill="none" />
  <polygon points="70,60 85,85 15,85" class="stroke" fill="none" />
</svg>

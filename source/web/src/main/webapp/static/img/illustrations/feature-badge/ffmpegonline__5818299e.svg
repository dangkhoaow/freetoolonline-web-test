  <circle cx="22" cy="24" r="6" fill="#5B73AE" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38">no install</tspan></text>
</svg>

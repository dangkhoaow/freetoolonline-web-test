<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-prosconslist-8773c0-title svg-prosconslist-8773c0-desc">
  <title id="svg-prosconslist-8773c0-title">Level 13 tradeoffs vs two other free browser games</title>
  <desc id="svg-prosconslist-8773c0-desc">Level 13 trades a larger ~8 MB download for autosaved progress and simple click-only controls, unlike the two smaller keyboard-driven games beside it.</desc>
  <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1C1C1E">Level 13 pros</text>
  <path d="M 26 92 L 35 101 L 50 83" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="64" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">Autosave every ~2 min</text>
  <path d="M 26 132 L 35 141 L 50 123" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="64" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">No keyboard needed</text>
  <line x1="240" y1="28" x2="240" y2="212" stroke="#3C3C3E" stroke-width="1" aria-hidden="true"/>
  <text x="264" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1C1C1E">Level 13 cons</text>
  <path d="M 268 84 L 284 100 M 284 84 L 268 100" stroke="#3C3C3E" stroke-width="4" fill="none" stroke-linecap="round" aria-hidden="true"/>
  <text x="300" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">Larger ~8 MB download</text>
  <path d="M 268 124 L 284 140 M 284 124 L 268 140" stroke="#3C3C3E" stroke-width="4" fill="none" stroke-linecap="round" aria-hidden="true"/>
  <text x="300" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">Click/tap only controls</text>
</svg>

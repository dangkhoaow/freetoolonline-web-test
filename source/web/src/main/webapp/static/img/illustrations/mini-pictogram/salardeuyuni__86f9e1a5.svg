<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-salardeuyuni-title svg-minipictogram-salardeuyuni-desc">
  <title id="svg-minipictogram-salardeuyuni-title">Salar de Uyuni 3D Explorer - World's Largest Salt Flat</title>
  <desc id="svg-minipictogram-salardeuyuni-desc">White hexagonal salt tiles stretching to a flat horizon under an Andean sky</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <!-- Andean horizon -->
  <path d="M4 26 L16 20 L26 26 L40 18 L52 25 L60 22 L60 30 L4 30 Z" fill="#3C3C3E"/>
  <!-- white salt flat -->
  <rect x="4" y="30" width="56" height="30" fill="#FFFFFF"/>
  <!-- hexagonal salt-tile ridges -->
  <g fill="none" stroke="#B3C5B0" stroke-width="1.6" aria-hidden="true">
    <path d="M14 38 L20 35 L26 38 L26 45 L20 48 L14 45 Z"/>
    <path d="M26 38 L32 35 L38 38 L38 45 L32 48 L26 45 Z"/>
    <path d="M38 38 L44 35 L50 38 L50 45 L44 48 L38 45 Z"/>
    <path d="M20 48 L26 45 L32 48 L32 55 L26 58 L20 55 Z"/>
    <path d="M32 48 L38 45 L44 48 L44 55 L38 58 L32 55 Z"/>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-checklistcard-f95233-title svg-checklistcard-f95233-desc">
  <title id="svg-checklistcard-f95233-title">Paste a numbered list or bold line into your message</title>
  <desc id="svg-checklistcard-f95233-desc">The message box is a rich-text editor - paste a numbered list, bold a subject line, or add an inline screenshot link, with formatting kept up to a 2,000-character cap.</desc>
  <rect x="16" y="16" width="388" height="188" rx="12" fill="#F0F0F2" aria-hidden="true"/>
  <text x="36" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1C1C1E">Message editor checklist</text>
  <path d="M 38 92 L 47 101 L 62 83" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="76" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#1C1C1E">Paste a numbered list of requirements</text>
  <path d="M 38 132 L 47 141 L 62 123" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="76" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#1C1C1E">Bold a subject line for emphasis</text>
  <path d="M 38 172 L 47 181 L 62 163" stroke="#5B73AE" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"/>
  <text x="76" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#1C1C1E">Add an inline link to a screenshot</text>
</svg>

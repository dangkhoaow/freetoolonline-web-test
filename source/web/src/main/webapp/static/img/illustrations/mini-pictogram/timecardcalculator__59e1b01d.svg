  <line x1="17" y1="17.5" x2="35" y2="17.5" stroke="#7DAFA3" stroke-width="3" stroke-linecap="round"/>
  <line x1="17" y1="25" x2="33" y2="25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="31" x2="35" y2="31" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="37" x2="30" y2="37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

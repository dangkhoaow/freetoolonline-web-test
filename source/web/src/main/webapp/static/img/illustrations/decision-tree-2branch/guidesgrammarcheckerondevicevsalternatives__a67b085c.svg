  <title id="svg-decisiontree2branch-23f61a-title">Choose the checker that fits your job: cloud or on-device</title>
  <desc id="svg-decisiontree2branch-23f61a-desc">Pick the cloud checker for public, long, non-English, or tone-rewrite text; pick the on-device checker for a private, reviewable pass where every change is spelled out.</desc>

  <circle cx="22" cy="24" r="6" fill="#B3C5B0" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38" textLength="148" lengthAdjust="spacingAndGlyphs">Unlock, no prompt</tspan></text>
</svg>

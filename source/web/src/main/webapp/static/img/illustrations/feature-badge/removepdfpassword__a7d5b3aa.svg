<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-ef280e-title svg-featurebadge-ef280e-desc">
  <title id="svg-featurebadge-ef280e-title">Unlock with the password you know</title>

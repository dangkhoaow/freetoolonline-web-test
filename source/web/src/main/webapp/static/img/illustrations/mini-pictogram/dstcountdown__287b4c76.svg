  <circle cx="32" cy="28" r="16" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="32" y1="28" x2="32" y2="17.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="40" y2="31" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 13 A22 22 0 0 1 50 22" fill="none" stroke="#FF4D00" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 22 L51 15.5 L44.5 18.5 Z" fill="#FF4D00"/>
  <circle cx="32" cy="28" r="2" fill="#7DAFA3"/>
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">+1 HOUR</text>

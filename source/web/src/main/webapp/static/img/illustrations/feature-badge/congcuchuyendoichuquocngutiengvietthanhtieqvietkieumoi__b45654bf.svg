<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-c1cf4f-title svg-featurebadge-c1cf4f-desc">
  <title id="svg-featurebadge-c1cf4f-title">Chuyển đổi chạy trong trình duyệt, không tải lên máy chủ</title>
  <desc id="svg-featurebadge-c1cf4f-desc">Câu tiếng Việt được chuyển sang Tiếq Việt ngay trong trình duyệt; nội dung không tải lên máy chủ và không lưu lại.</desc>
  <rect x="2" y="2" width="196" height="44" rx="22" ry="22" fill="#1C1C1E" stroke="#B3C5B0" stroke-width="2.5" aria-hidden="true"/>
  <circle cx="22" cy="24" r="6" fill="#B3C5B0" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38">Không tải lên</tspan></text>
</svg>

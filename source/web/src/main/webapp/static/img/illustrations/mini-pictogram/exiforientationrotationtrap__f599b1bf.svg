<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-exiforientationrotationtrap-title svg-minipictogram-exiforientationrotationtrap-desc">
  <title id="svg-minipictogram-exiforientationrotationtrap-title">EXIF Orientation Tags - Why Photos Look Rotated After Upload</title>
  <desc id="svg-minipictogram-exiforientationrotationtrap-desc">A photo's EXIF Orientation tag tells a viewer how to rotate it, and not every tool reads that tag. Check yours before assuming a file is broken.</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <polygon points="22.3,16.8 48.6,26.4 41.7,45.2 15.4,35.6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="26.5" cy="24.5" r="2" fill="#7DAFA3"/>
  <path d="M47.3 18.1 A 20 20 0 1 1 47.3 43.9" fill="none" stroke="#7DAFA3" stroke-width="3" stroke-linecap="round"/>
  <polygon points="47.3 43.9 41.5 41.8 43.2 47.9" fill="#7DAFA3"/>
</svg>

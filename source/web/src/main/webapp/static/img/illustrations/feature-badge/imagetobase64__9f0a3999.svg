  <title id="svg-featurebadge-18dafd-title">Base64 is best for small images</title>
  <desc id="svg-featurebadge-18dafd-desc">Base64 adds about 33% byte overhead, so use it for small icons under a few KB.</desc>
  <rect x="2" y="2" width="196" height="44" rx="22" ry="22" fill="#1C1C1E" stroke="#B3C5B0" stroke-width="2.5" aria-hidden="true"/>
  <circle cx="22" cy="24" r="6" fill="#B3C5B0" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38">small images</tspan></text>
</svg>

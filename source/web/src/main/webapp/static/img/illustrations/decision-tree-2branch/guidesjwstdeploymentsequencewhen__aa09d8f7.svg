  <rect x="260" y="170" width="200" height="80" rx="10" fill="#1C1C1E" stroke="#5B73AE" stroke-width="2" aria-hidden="true"/>
  <text x="360" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF"><tspan x="360" dy="0">No - later science</tspan></text>

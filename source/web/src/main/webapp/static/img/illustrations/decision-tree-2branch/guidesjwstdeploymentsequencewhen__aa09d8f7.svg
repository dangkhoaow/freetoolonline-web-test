  <rect x="120" y="20" width="240" height="8" rx="4" fill="#5B73AE" aria-hidden="true"/>
  <text x="240" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#FFFFFF"><tspan x="240" dy="0">Want how JWST unfolded?</tspan></text>

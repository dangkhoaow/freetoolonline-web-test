<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-d8412f-title svg-featurebadge-d8412f-desc">
  <title id="svg-featurebadge-d8412f-title">Pick PNG or WebP to keep transparency; JPG flattens it</title>
  <desc id="svg-featurebadge-d8412f-desc">Pick PNG or WebP to preserve a transparent background, or JPG to flatten it onto a solid colour and shrink the file.</desc>
  <rect x="2" y="2" width="196" height="44" rx="22" ry="22" fill="#1C1C1E" stroke="#7DAFA3" stroke-width="2.5" aria-hidden="true"/>
  <circle cx="22" cy="24" r="6" fill="#7DAFA3" aria-hidden="true"/>
  <text x="38" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF"><tspan x="38" textLength="148" lengthAdjust="spacingAndGlyphs">transparency kept</tspan></text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-stepsvertical4-b567ba-title svg-stepsvertical4-b567ba-desc">
  <title id="svg-stepsvertical4-b567ba-title">Four steps to use the live wildfire map</title>
  <desc id="svg-stepsvertical4-b567ba-desc">Open the map, read the dots by size and containment color, filter by state, size, and type, then sort by distance from you.</desc>
  <line x1="44" y1="50" x2="44" y2="260" stroke="#5B73AE" stroke-width="3" aria-hidden="true"/>
  <circle cx="44" cy="50" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">1</text>
  <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Open the map and let it load</text>
  <circle cx="44" cy="120" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">2</text>
  <text x="84" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Read the dots</text>
  <circle cx="44" cy="190" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">3</text>
  <text x="84" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Filter by state, size, and type</text>
  <circle cx="44" cy="260" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">4</text>
  <text x="84" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Sort by distance from you</text>
</svg>

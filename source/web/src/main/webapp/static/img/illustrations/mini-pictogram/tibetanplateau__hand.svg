<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-tibetanplateau-title svg-minipictogram-tibetanplateau-desc">
  <title id="svg-minipictogram-tibetanplateau-title">Tibetan Plateau 3D Explorer</title>
  <desc id="svg-minipictogram-tibetanplateau-desc">Vast elevated plateau at 4500m with distant snowcapped Himalayan peaks and a glacial lake</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <!-- Himalayan peaks with snow caps -->
  <path d="M4 32 L14 18 L20 24 L30 12 L36 20 L44 14 L52 22 L60 16 L60 32 Z" fill="#3C3C3E"/>
  <path d="M27 16 L30 12 L33 17 Z" fill="#FFFFFF"/>
  <path d="M41 17 L44 14 L47 19 Z" fill="#FFFFFF"/>
  <!-- Vast plateau -->
  <rect x="4" y="32" width="56" height="28" fill="#B3C5B0"/>
  <!-- Glacial lake - use white outline on sage for 4-color compliance -->
  <ellipse cx="26" cy="46" rx="11" ry="6" fill="#FFFFFF" opacity="0.6"/>
</svg>

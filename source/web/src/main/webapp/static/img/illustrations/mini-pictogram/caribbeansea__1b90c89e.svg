  <title id="svg-minipictogram-caribbeansea-title">Caribbean Sea - island arc ringing a basin with a deep trench notch</title>
  <desc id="svg-minipictogram-caribbeansea-desc">A rounded teal sea basin with a curving arc of small island dots along the top and right edge, and a narrow dark notch cutting into the upper-left of the basin representing the Cayman Trough.</desc>

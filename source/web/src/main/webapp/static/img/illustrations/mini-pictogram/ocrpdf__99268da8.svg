  <path d="M20 12 L38 12 L44 18 L44 50 L20 50 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 12 L38 18 L44 18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M25 22 L39 22 M25 28 L39 28 M25 34 L31 34" fill="none" stroke="#7DAFA3" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="36" cy="38" r="7" fill="none" stroke="#FF4D00" stroke-width="3"/>
  <path d="M41 43 L47 49" fill="none" stroke="#FF4D00" stroke-width="3.5" stroke-linecap="round"/>
  <text x="32" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">OCR</text>
</svg>

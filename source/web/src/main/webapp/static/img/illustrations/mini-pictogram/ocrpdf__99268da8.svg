<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-ocrpdf-title svg-minipictogram-ocrpdf-desc">
  <title id="svg-minipictogram-ocrpdf-title">OCR PDF - Make a Scanned PDF Searchable in Your Browser</title>
  <desc id="svg-minipictogram-ocrpdf-desc">A scanned page whose text lines are being read by a magnifier, turning the scan into searchable text on your device.</desc>

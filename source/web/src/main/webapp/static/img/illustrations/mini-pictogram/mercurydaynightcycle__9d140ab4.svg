<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-mercury-title svg-mercury-desc">
  <title id="svg-mercury-title">Mercury Day-Night Cycle 3D</title>
  <desc id="svg-mercury-desc">Mercury 3:2 spin-orbit resonance explorer: day hemisphere lit, night hemisphere dark</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <!-- Orbit ellipse -->
  <ellipse cx="32" cy="40" rx="20" ry="7" fill="none" stroke="#5B73AE" stroke-width="1.5" stroke-dasharray="3,2" aria-hidden="true"/>
  <!-- Sun dot -->
  <circle cx="32" cy="40" r="4" fill="#FF4D00" aria-hidden="true"/>
  <!-- Mercury planet night side -->
  <circle cx="32" cy="20" r="9" fill="#5B73AE" aria-hidden="true"/>
  <!-- Mercury day hemisphere: lit half -->
  <path d="M32,11 A9,9,0,0,1,32,29 Z" fill="#7DAFA3" aria-hidden="true"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-propertygrid3x3-627733-title svg-propertygrid3x3-627733-desc">
  <title id="svg-propertygrid3x3-627733-title">Compare the Parker Solar Probe and Cassini Grand Finale explorers side by side</title>
  <desc id="svg-propertygrid3x3-627733-desc">Compare two in-browser 3D explorers by body approached, mission span shown, and gravity-assist flybys, so you pick the right one for your question.</desc>
  <rect x="20" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Body</text>
  <text x="90" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">approached</text>
  <rect x="170" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="240" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Mission span</text>
  <text x="240" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">shown</text>
  <rect x="320" y="20" width="140" height="60" rx="8" fill="#5B73AE" aria-hidden="true"/>
  <text x="390" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Flybys</text>
  <text x="390" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#FFFFFF">shown</text>
  <text x="20" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Parker Solar Probe</text>
  <text x="90" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">the Sun</text>
  <text x="240" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">about 6 years</text>
  <text x="390" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">7 Venus flybys</text>
  <text x="20" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#1C1C1E">Cassini Grand Finale</text>
  <text x="90" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">Saturn</text>
  <text x="240" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">about 1 year</text>
  <text x="390" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#1C1C1E">1 Titan flyby</text>
</svg>

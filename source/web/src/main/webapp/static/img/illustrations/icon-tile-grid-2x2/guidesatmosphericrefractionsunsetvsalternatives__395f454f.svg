<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-icontilegrid2x2-71a3e3-title svg-icontilegrid2x2-71a3e3-desc">
  <title id="svg-icontilegrid2x2-71a3e3-title">See which sky effect each 3D explorer shows</title>
  <desc id="svg-icontilegrid2x2-71a3e3-desc">The refraction explorer shows the Sun disk bending and the green flash; the twilight explorer shows the sky brightness bands and summer white nights.</desc>
  <rect x="40" y="36" width="120" height="120" rx="16" fill="#5B73AE" aria-hidden="true"/>
  <text x="100" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" aria-hidden="true">☀</text>
  <text x="100" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">Sun disk bend</text>
  <rect x="200" y="36" width="120" height="120" rx="16" fill="#5B73AE" aria-hidden="true"/>
  <text x="260" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" aria-hidden="true">✦</text>
  <text x="260" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">Green flash</text>
  <rect x="40" y="204" width="120" height="120" rx="16" fill="#5B73AE" aria-hidden="true"/>
  <text x="100" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" aria-hidden="true">◑</text>
  <text x="100" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">Twilight bands</text>
  <rect x="200" y="204" width="120" height="120" rx="16" fill="#5B73AE" aria-hidden="true"/>
  <text x="260" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" aria-hidden="true">☾</text>
  <text x="260" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1C1C1E">White nights</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-atacama desc-atacama">
  <defs>
    <style>
      .bg { fill: #3C3C3E; }
      .dunes { fill: #B3C5B0; }
      .salt { fill: #D9C7A3; }
      .highlight { fill: #7DAFA3; }
    </style>
  </defs>
  
  <title id="title-atacama">Atacama Desert 3D Explorer icon</title>
  <desc id="desc-atacama">A minimalist representation of the Atacama Desert showing white salt flat surrounded by tan-colored sand dunes against a dark background.</desc>
  
  <!-- Background -->
  <rect width="64" height="64" class="bg"/>
  
  <!-- Dune hills (sage tone) -->
  <ellipse cx="32" cy="50" rx="26" ry="18" class="dunes"/>
  
  <!-- Salt flat (champagne) -->
  <ellipse cx="32" cy="28" rx="16" ry="12" class="salt"/>
  
  <!-- Salt reflection highlight (teal) -->
  <ellipse cx="30" cy="26" rx="8" ry="5" class="highlight" opacity="0.6"/>
</svg>

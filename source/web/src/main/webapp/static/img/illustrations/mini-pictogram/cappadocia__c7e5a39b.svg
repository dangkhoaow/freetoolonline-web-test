<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title-capad desc-capad">
  <title id="title-capad">Cappadocia 3D Explorer</title>
  <desc id="desc-capad">Fairy chimneys - tall cone-shaped rock pillars with rounded caps in the Cappadocia landscape</desc>
  <!-- Background -->
  <rect width="64" height="64" fill="#3C3C3E"/>
  <!-- Fairy chimney left - tall pillar with cap -->
  <rect x="8" y="30" width="8" height="24" fill="#D9C7A3"/>
  <ellipse cx="12" cy="30" rx="7" ry="5" fill="#7DAFA3"/>
  <!-- Fairy chimney center - tallest -->
  <rect x="27" y="18" width="10" height="36" fill="#D9C7A3"/>
  <ellipse cx="32" cy="18" rx="8" ry="6" fill="#7DAFA3"/>
  <!-- Fairy chimney right -->
  <rect x="47" y="26" width="8" height="28" fill="#D9C7A3"/>
  <ellipse cx="51" cy="26" rx="6" ry="4" fill="#7DAFA3"/>
  <!-- Hot air balloon -->
  <ellipse cx="19" cy="9" rx="5" ry="6" fill="#5B73AE"/>
  <rect x="17" y="15" width="4" height="2" fill="#5B73AE"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-statcallout-03aa6a-title svg-statcallout-03aa6a-desc">
  <title id="svg-statcallout-03aa6a-title">Six Apollo crews landed on the Moon from 1969 to 1972</title>
  <desc id="svg-statcallout-03aa6a-desc">The key-figures table lists all six crewed landings side by side, from Apollo 11 on 1969-07-20 to Apollo 17 on 1972-12-11.</desc>
  <rect x="20" y="20" width="320" height="160" rx="12" fill="#F0F0F2" aria-hidden="true"/>
  <rect x="20" y="20" width="10" height="160" rx="5" fill="#5B73AE" aria-hidden="true"/>
  <text x="184" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="700" fill="#5B73AE">6</text>
  <text x="184" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#1C1C1E">crewed Apollo landings</text>
  <text x="184" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#3C3C3E">Apollo 11 to Apollo 17, 1969-1972</text>
</svg>

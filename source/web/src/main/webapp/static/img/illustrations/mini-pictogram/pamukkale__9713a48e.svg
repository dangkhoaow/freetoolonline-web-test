  <title id="svg-minipictogram-pamukkale-title">Pamukkale - cascading white terraces with pooled water</title>
  <desc id="svg-minipictogram-pamukkale-desc">A staircase of white travertine terraces steps down a hillside from upper left to lower right, each tread carrying a thin turquoise band of pooled water near its front edge, on a teal background.</desc>

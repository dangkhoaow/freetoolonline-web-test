<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-redactpdf-title svg-minipictogram-redactpdf-desc">
  <title id="svg-minipictogram-redactpdf-title">Redact PDF - Black Out Text Permanently, No Upload</title>
  <desc id="svg-minipictogram-redactpdf-desc">A document page whose sensitive lines are replaced by solid black redaction bars while the other lines stay readable.</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <rect x="18" y="9" width="28" height="40" rx="2" fill="#FFFFFF"/>
  <line x1="22" y1="16" x2="42" y2="16" stroke="#7DAFA3" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="21" y="21" width="21" height="6" fill="#1C1C1E"/>
  <line x1="22" y1="33" x2="40" y2="33" stroke="#7DAFA3" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="21" y="38" width="17" height="6" fill="#1C1C1E"/>
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">PDF</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-stepsvertical4-2b8467-title svg-stepsvertical4-2b8467-desc">
  <title id="svg-stepsvertical4-2b8467-title">Explore the Bennu OSIRIS-REx TAG sample return in four steps</title>
  <desc id="svg-stepsvertical4-2b8467-desc">Open the 3D explorer, click Simulate TAG, watch the touchdown, and read the returned-sample figures.</desc>
  <line x1="44" y1="50" x2="44" y2="260" stroke="#5B73AE" stroke-width="3" aria-hidden="true"/>
  <circle cx="44" cy="50" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">1</text>
  <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Open the 3D explorer</text>
  <circle cx="44" cy="120" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">2</text>
  <text x="84" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Click Simulate TAG</text>
  <circle cx="44" cy="190" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">3</text>
  <text x="84" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Watch the touchdown</text>
  <circle cx="44" cy="260" r="22" fill="#5B73AE" aria-hidden="true"/>
  <text x="44" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" aria-hidden="true">4</text>
  <text x="84" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#1C1C1E">Read the sample figures</text>
</svg>

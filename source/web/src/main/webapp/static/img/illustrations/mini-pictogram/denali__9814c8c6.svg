  <title id="svg-minipictogram-denali-title">Denali - a snow-capped peak with a glacier tongue</title>
  <desc id="svg-minipictogram-denali-desc">A single triangular mountain peak with a light snow cap, a champagne-toned glacier tongue flowing down one side, and a thin champagne vertical band marking its rise from base to summit.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">Amazon River Explorer</title>
  <desc id="desc">Winding river with tributaries and sediment plume at the Atlantic</desc>
  <!-- Background -->
  <rect width="64" height="64" fill="#3C3C3E"/>
  <!-- River main channel -->
  <path d="M 8 8 Q 16 12, 20 18 T 28 30 T 34 42 T 40 54"
        stroke="#1E5A7A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Tributary left -->
  <path d="M 20 18 Q 12 20, 8 26"
        stroke="#0F3A4A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Tributary right -->
  <path d="M 28 30 Q 38 28, 42 22"
        stroke="#0F3A4A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Sediment plume at mouth -->
  <circle cx="42" cy="56" r="6" fill="#2E7A9E" opacity="0.7"/>
  <circle cx="47" cy="58" r="4" fill="#2E7A9E" opacity="0.5"/>
  <!-- Source marker -->
  <circle cx="8" cy="8" r="3" fill="#FFAA00"/>
</svg>

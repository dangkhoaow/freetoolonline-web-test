<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-minipictogram-atacamadesert-title svg-minipictogram-atacamadesert-desc">
  <title id="svg-minipictogram-atacamadesert-title">Atacama Desert 3D Explorer</title>
  <desc id="svg-minipictogram-atacamadesert-desc">Arid desert floor with distant Andes mountain ridge and ALMA radio telescope dish silhouette</desc>
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="#1C1C1E" aria-hidden="true"/>
  <!-- Distant Andes ridge -->
  <path d="M4 36 L14 24 L20 30 L28 18 L34 26 L42 16 L50 24 L60 20 L60 36 Z" fill="#3C3C3E"/>
  <!-- Desert floor -->
  <rect x="4" y="36" width="56" height="24" fill="#D9C7A3"/>
  <!-- Salt flat cracks -->
  <line x1="8" y1="42" x2="20" y2="50" stroke="#1C1C1E" stroke-width="0.8"/>
  <line x1="26" y1="40" x2="16" y2="54" stroke="#1C1C1E" stroke-width="0.8"/>
  <line x1="36" y1="39" x2="48" y2="50" stroke="#1C1C1E" stroke-width="0.8"/>
  <!-- ALMA telescope dish (ellipse + stem) -->
  <ellipse cx="46" cy="31" rx="6" ry="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="46" y1="34" x2="46" y2="38" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="42" y1="38" x2="50" y2="38" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>

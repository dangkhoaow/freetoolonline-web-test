<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-labelledby="title desc">
  <title id="title">Pamir Plateau - Mountain Range Convergence</title>
  <desc id="desc">Five mountain peaks representing the Pamir Plateau convergence, with snow caps on the tallest summits</desc>
  
  <!-- Base plateau -->
  <polygon points="0,140 200,140 200,160 0,160" fill="#1C1C1E"/>
  
  <!-- Mountain peaks (5 peaks using palette colors only) -->
  <!-- Center peak (Ismail Samani - tallest) -->
  <polygon points="100,20 85,80 115,80" fill="#1C1C1E"/>
  <!-- Left peak 1 -->
  <polygon points="70,55 55,100 85,100" fill="#3C3C3E"/>
  <!-- Left peak 2 -->
  <polygon points="40,75 25,120 55,120" fill="#3C3C3E"/>
  <!-- Right peak 1 -->
  <polygon points="130,65 115,105 145,105" fill="#3C3C3E"/>
  <!-- Right peak 2 -->
  <polygon points="160,85 145,125 175,125" fill="#3C3C3E"/>
  
  <!-- Snow caps on the tallest peaks (white triangles at summits) -->
  <polygon points="100,20 95,40 105,40" fill="#FFFFFF"/>
  <polygon points="70,55 63,70 77,70" fill="#FFFFFF"/>
  <polygon points="130,65 123,80 137,80" fill="#FFFFFF"/>
</svg>

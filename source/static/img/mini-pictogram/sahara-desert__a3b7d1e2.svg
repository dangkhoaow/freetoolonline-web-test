<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-sd desc-sd">
  <title id="title-sd">Sahara Desert sand dunes with camel silhouettes</title>
  <desc id="desc-sd">Pictorial representation of the Sahara Desert with rolling sand dunes and a camel caravan silhouette</desc>
  
  <!-- Base background (dark charcoal) -->
  <rect width="200" height="200" fill="#3C3C3E"/>
  
  <!-- Sand layer -->
  <rect y="110" width="200" height="90" fill="#7DAFA3"/>
  
  <!-- Dune 1 (left) -->
  <path d="M 20 120 Q 40 70, 60 120 L 60 200 L 20 200 Z" fill="#D9C7A3" stroke="none"/>
  
  <!-- Dune 2 (center, tallest) -->
  <path d="M 50 100 Q 85 35, 120 100 L 120 200 L 50 200 Z" fill="#D9C7A3" stroke="none"/>
  
  <!-- Dune 3 (right) -->
  <path d="M 110 130 Q 140 80, 170 130 L 170 200 L 110 200 Z" fill="#D9C7A3" stroke="none"/>
  
  <!-- Camel silhouette accent (ink) -->
  <ellipse cx="88" cy="105" rx="5" ry="8" fill="#1C1C1E"/>
  <circle cx="92" cy="97" r="3" fill="#1C1C1E"/>
</svg>

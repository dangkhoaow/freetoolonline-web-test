<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="kili-title kili-desc">
  <title id="kili-title">Mount Kilimanjaro</title>
  <desc id="kili-desc">A snow-capped volcanic peak rising from green slopes</desc>
  <defs>
    <style>
      .kili-base { fill: #1C1C1E; }
      .kili-slope { fill: #7DAFA3; }
      .kili-snow { fill: #FFFFFF; }
      .kili-accent { fill: #3C3C3E; }
    </style>
  </defs>
  <!-- Sky background -->
  <rect width="64" height="64" class="kili-base"/>
  <!-- Distant cloud -->
  <ellipse cx="48" cy="16" rx="8" ry="4" class="kili-accent" opacity="0.3"/>
  <!-- Mountain base slopes (lower flanks) -->
  <polygon points="8,50 24,28 32,50" class="kili-accent"/>
  <polygon points="32,50 40,28 56,50" class="kili-accent"/>
  <!-- Main cone slopes (medium) -->
  <polygon points="20,32 28,18 36,32" class="kili-slope"/>
  <!-- Snow cap (upper cone) -->
  <polygon points="24,20 32,8 40,20" class="kili-snow"/>
  <!-- Peak point -->
  <circle cx="32" cy="6" r="2" class="kili-snow"/>
  <!-- Altitude band indicator (faint horizontal line at snowline) -->
  <line x1="22" y1="21" x2="42" y2="21" stroke="#3C3C3E" stroke-width="0.5" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="plateau-title-id">
  <defs>
    <style>
      .plateau-bg { fill: #FFFFFF; }
      .plateau-peak { fill: #1C1C1E; }
      .plateau-base { fill: #D9C7A3; }
      .plateau-snow { fill: #F5F5F5; stroke: #FFFFFF; stroke-width: 0.5; }
    </style>
  </defs>
  <title id="plateau-title-id">Tibetan Plateau icon</title>
  <rect class="plateau-bg" width="64" height="64"/>
  
  <!-- Plateau base layer (wide, elevated) -->
  <path class="plateau-base" d="M 8 48 L 12 32 L 20 28 L 32 26 L 44 28 L 52 32 L 56 48 Z"/>
  
  <!-- Central peaks (snow-capped mountains) -->
  <path class="plateau-peak" d="M 32 26 L 26 18 L 30 15 L 32 10 L 34 15 L 38 18 L 32 26 Z"/>
  <path class="plateau-peak" d="M 20 28 L 16 22 L 19 20 L 20 16 L 22 20 L 24 22 L 20 28 Z"/>
  <path class="plateau-peak" d="M 44 28 L 40 22 L 43 20 L 44 16 L 46 20 L 48 22 L 44 28 Z"/>
  
  <!-- Snow caps on peaks -->
  <polygon class="plateau-snow" points="32,10 30,16 34,16"/>
  <polygon class="plateau-snow" points="20,16 19,20 21,20"/>
  <polygon class="plateau-snow" points="44,16 43,20 45,20"/>
  
  <!-- Horizontal lines suggesting stratification / altitude zones -->
  <line x1="10" y1="40" x2="54" y2="40" stroke="#D9C7A3" stroke-width="1" opacity="0.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#7DAFA3" stroke-width="1" opacity="0.5"/>
</svg>

<div id="t3dCanvasHost" class="canvas-container"></div>
<div id="t3dInfoPanel" class="info-panel">
  <div id="t3dStatus" class="status"></div>
</div>
<div id="t3dFullscreenBtn" class="fullscreen-btn" title="Enter fullscreen">⛶</div>
<div id="t3dP${slug}Controls" class="controls-row">
  <label><input type="checkbox" id="toggle-formations" checked> Stalactites & Stalagmites</label>
  <label><input type="checkbox" id="toggle-bioluminescence"> Bioluminescence</label>
</div>
<script type="module">
  import { buildSonDoongScene, SOL_DATA_SONDOONG } from '../../../../../script/places-3d-scenes.js';
  
  window.renderPlace3D({
    scene: buildSonDoongScene,
    data: SOL_DATA_SONDOONG,
    slug: 'sondoong',
    cameraRadius: 180,
    cameraTheta: 0.9,   // 3/4 view
    cameraPhi: 0.7,
    toggleHandlers: {
      'toggle-formations': (el, on) => window.t3dSceneRoot.userData.toggleFormation(on),
      'toggle-bioluminescence': (el, on) => window.t3dSceneRoot.userData.toggleBioluminescence(on),
    }
  });
</script>

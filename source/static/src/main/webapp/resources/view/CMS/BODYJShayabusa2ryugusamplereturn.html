<script>
    // 3D scene archetype skeleton (Hayabusa2 Ryugu Sample Return) - vendored
    // three.js (ESM, dynamic import from /vendor/three/, NO CDN), fully
    // client-side. Forked from the curiosity-rover-traverse shape - ONE scene
    // only (a mission-milestone route explorer). All geometry is procedural
    // (a lathe-profile "spinning top" body standing in for asteroid Ryugu +
    // a small boxy spacecraft marker + a route curve + waypoint markers +
    // a crater marker that appears once created).
    //
    // EDUCATIONAL APPROXIMATION, not a shape-accurate reconstruction of Ryugu
    // or a physically simulated trajectory. A teaching scene: JAXA's real
    // Hayabusa2 mission-milestone sequence, replayed as discrete waypoints
    // along a procedural route - not a continuous, real-time position feed.
    //
    // Published figures (cross-checked via WebSearch 2026-07-26; sources:
    // JAXA Hayabusa2 mission page (hayabusa2.jaxa.jp/en), Watanabe et al. 2019
    // Science, Yada et al. 2022 Nature Astronomy):
    //   - Launched 2014-12-03 (JST) on an H-IIA rocket from Tanegashima Space
    //     Center.
    //   - Arrived at asteroid Ryugu 2018-06-27.
    //   - Ryugu is a C-type near-Earth asteroid, diamond/"spinning-top"
    //     shaped: equatorial diameter about 1,004 m, polar diameter about
    //     875 m, rotation period about 7.63 hours.
    //   - First touchdown sample collection: 2019-02-22.
    //   - Small Carry-on Impactor (SCI) created an artificial crater about
    //     14.5 m in diameter: 2019-04-05.
    //   - Second touchdown collected sub-surface material from the crater
    //     site: 2019-07-11.
    //   - Sample-return capsule landed near Woomera, South Australia:
    //     2020-12-06, delivering about 5.4 g of asteroid material.
    //   - Distinct from dart-asteroid-deflection.html (a kinetic-impact
    //     deflection test on Dimorphos, no sample return) and
    //     curiosity-rover-traverse.html (a different real-mission-trajectory
    //     page, on Mars, not an asteroid) - THIS page is specifically the
    //     Ryugu approach-touchdown-impactor-return timeline.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'hayabusa2ryugusamplereturn';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'hayabusa2ryugusamplereturn'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published Hayabusa2 mission-milestone figures (JAXA / Watanabe et
    // al. 2019 Science / Yada et al. 2022 Nature Astronomy, cross-checked via
    // WebSearch 2026-07-26). Each waypoint is a discrete, citable milestone -
    // never an interpolated "current position" claim.
    var T3D_HAYABUSA_WAYPOINTS = [
        { date: '2014-12-03', name: 'Launch from Tanegashima', craterShown: false,
          fact: 'Hayabusa2 launched on an H-IIA rocket from JAXA\'s Tanegashima Space Center, beginning its cruise to near-Earth asteroid Ryugu.' },
        { date: '2018-06-27', name: 'Arrival at Ryugu', craterShown: false,
          fact: 'Arrived at Ryugu, a C-type near-Earth asteroid with a diamond ("spinning-top") shape: equatorial diameter about 1,004 m, polar diameter about 875 m, rotation period about 7.63 hours.' },
        { date: '2019-02-22', name: 'First Touchdown - Sample Collection', craterShown: false,
          fact: 'Briefly touched Ryugu\'s surface and fired a small tantalum projectile to collect surface material into a sampler horn.' },
        { date: '2019-04-05', name: 'SCI Artificial Crater Created', craterShown: true,
          fact: 'The Small Carry-on Impactor (SCI) released a copper projectile that struck the surface, creating an artificial crater about 14.5 m in diameter - the mark on the surface below is that crater.' },
        { date: '2019-07-11', name: 'Second Touchdown - Sub-surface Sample', craterShown: true,
          fact: 'Touched down again near the SCI crater site to collect sub-surface material excavated by the impact, material never before exposed to space weathering.' },
        { date: '2020-12-06', name: 'Sample-Return Capsule Lands on Earth', craterShown: true,
          fact: 'The return capsule separated and landed near Woomera, South Australia, delivering about 5.4 g of asteroid material - the spacecraft itself continued on an extended mission past Earth.' }
    ];

    function t3dHayabusaRyugu(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x05060a, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var sunLight = new THREE.DirectionalLight(0xfff2df, 1.2);
        sunLight.position.set(14, 9, 7);
        scene.add(sunLight);

        // Deep-space starfield backdrop.
        var starN = shell.low ? 200 : 420;
        var starPos = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r = 70 + Math.random() * 60;
            var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r * Math.sin(ph) * Math.cos(th);
            starPos[s * 3 + 1] = r * Math.cos(ph);
            starPos[s * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xdfe6ff, size: 0.3, sizeAttenuation: true, transparent: true, opacity: 0.55 })));

        // Ryugu - a lathe-revolved "spinning top" / diamond profile (real
        // shape category, on-screen size compressed for readability; the
        // equatorial-to-polar diameter RATIO of about 1004:875 is kept
        // roughly true - never claimed to be a precise shape model).
        var profilePoints = [];
        var ryuguEquatorR = 5.0;
        var ryuguPolarR = ryuguEquatorR * (875 / 1004);
        profilePoints.push(new THREE.Vector2(0.0, ryuguPolarR));
        profilePoints.push(new THREE.Vector2(ryuguEquatorR * 0.55, ryuguPolarR * 0.55));
        profilePoints.push(new THREE.Vector2(ryuguEquatorR * 0.95, ryuguPolarR * 0.08));
        profilePoints.push(new THREE.Vector2(ryuguEquatorR, 0.0));
        profilePoints.push(new THREE.Vector2(ryuguEquatorR * 0.95, -ryuguPolarR * 0.08));
        profilePoints.push(new THREE.Vector2(ryuguEquatorR * 0.55, -ryuguPolarR * 0.55));
        profilePoints.push(new THREE.Vector2(0.0, -ryuguPolarR));
        var ryuguGeo = new THREE.LatheGeometry(profilePoints, 40);
        var ryuguGroup = new THREE.Group();
        var ryugu = new THREE.Mesh(ryuguGeo, new THREE.MeshStandardMaterial({ color: 0x3a352f, roughness: 0.97, metalness: 0.02, flatShading: true }));
        ryuguGroup.add(ryugu);
        scene.add(ryuguGroup);

        // Crater marker on the equator (appears once the SCI event happens).
        var craterMarker = new THREE.Mesh(
            new THREE.CircleGeometry(0.55, 16),
            new THREE.MeshBasicMaterial({ color: 0xff7043, side: THREE.DoubleSide, transparent: true, opacity: 0.0 })
        );
        craterMarker.position.set(ryuguEquatorR * 0.85, ryuguPolarR * 0.05, 1.2);
        craterMarker.lookAt(craterMarker.position.clone().multiplyScalar(2));
        ryuguGroup.add(craterMarker);

        // Route: cruise-in from Earth's direction, hover above Ryugu,
        // descend for each touchdown/SCI event, then depart back toward
        // Earth for the capsule landing - one continuous procedural path;
        // waypoint markers sit at fixed points along it.
        var routePoints = [
            new THREE.Vector3(-42, 20, -30),   // launch / cruise
            new THREE.Vector3(0, 14, 0),        // arrival, hovering above Ryugu
            new THREE.Vector3(1.6, ryuguPolarR + 0.9, 4.6),   // first touchdown
            new THREE.Vector3(0, 9, 2),         // SCI - retreat to safe distance
            new THREE.Vector3(1.9, ryuguPolarR + 0.9, 3.3),   // second touchdown near crater
            new THREE.Vector3(30, 18, 22)       // depart toward Earth for capsule return
        ];
        var routeCurve = new THREE.CatmullRomCurve3(routePoints);
        var routeGeo = new THREE.BufferGeometry().setFromPoints(routeCurve.getPoints(140));
        scene.add(new THREE.Line(routeGeo, new THREE.LineBasicMaterial({ color: 0x64b5f6, transparent: true, opacity: 0.75 })));

        var waypointMarkers = [];
        for (var w = 0; w < routePoints.length; w++) {
            var m = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), new THREE.MeshBasicMaterial({ color: 0x546e7a }));
            m.position.copy(routePoints[w]);
            scene.add(m);
            waypointMarkers.push(m);
        }

        // Spacecraft marker (small procedural body: bus + two solar-panel
        // wings, standing in for Hayabusa2).
        var craftGroup = new THREE.Group();
        var bus = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0.4, metalness: 0.35 }));
        craftGroup.add(bus);
        var panelMat = new THREE.MeshStandardMaterial({ color: 0x1a237e, roughness: 0.5, metalness: 0.2 });
        var panelL = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.5), panelMat);
        panelL.position.x = -1.1;
        craftGroup.add(panelL);
        var panelR = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.05, 0.5), panelMat);
        panelR.position.x = 1.1;
        craftGroup.add(panelR);
        scene.add(craftGroup);

        var beacon = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), new THREE.MeshBasicMaterial({ color: 0x64b5f6, transparent: true, opacity: 0.22 }));
        scene.add(beacon);

        var waypointIndex = 0; // 0..T3D_HAYABUSA_WAYPOINTS.length-1

        function panelHtml() {
            var wp = T3D_HAYABUSA_WAYPOINTS[waypointIndex];
            var rows = '';
            for (var i = 0; i < T3D_HAYABUSA_WAYPOINTS.length; i++) {
                var w2 = T3D_HAYABUSA_WAYPOINTS[i];
                rows += '<tr' + (i === waypointIndex ? ' style="background:#fff3cd;"' : '') + '>' +
                    '<td>' + w2.date + '</td>' +
                    '<td>' + w2.name + '</td>' +
                    '</tr>';
            }
            return '<h3>Mission milestone ' + (waypointIndex + 1) + ' of ' + T3D_HAYABUSA_WAYPOINTS.length + '</h3>' +
                '<p><b>' + wp.name + '</b> (' + wp.date + ')</p>' +
                '<p>' + wp.fact + '</p>' +
                '<div class="w3-responsive"><table class="w3-table w3-bordered w3-small">' +
                '<tr><th>Date</th><th>Milestone</th></tr>' + rows + '</table></div>' +
                '<p class="t3d-note">Educational approximation - Ryugu\'s body and the spacecraft trajectory are procedural shapes, not a precise shape model or a physically simulated flight path. Every date and figure cited is real and independently published (JAXA / Watanabe et al. 2019, Science / Yada et al. 2022, Nature Astronomy); this scene never claims a live or real-time spacecraft position.</p>';
        }

        var idxEl = document.getElementById('t3dHayabusaScrub');
        var idxLab = document.getElementById('t3dHayabusaLabel');

        function apply() {
            var wp = T3D_HAYABUSA_WAYPOINTS[waypointIndex];
            var pos = routePoints[waypointIndex];
            craftGroup.position.copy(pos);
            beacon.position.copy(pos);
            craterMarker.material.opacity = wp.craterShown ? 0.85 : 0.0;
            for (var i = 0; i < waypointMarkers.length; i++) {
                waypointMarkers[i].material.color.setHex(i <= waypointIndex ? 0x64b5f6 : 0x546e7a);
            }
            if (idxLab) idxLab.textContent = wp.name + ' (' + wp.date + ')';
            t3dInfo(panelHtml());
            try { t3dSaveStore({ waypointIndex: waypointIndex }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.waypointIndex === 'number' && store.waypointIndex >= 0 && store.waypointIndex < T3D_HAYABUSA_WAYPOINTS.length) {
            waypointIndex = store.waypointIndex;
        }
        if (idxEl) idxEl.value = String(waypointIndex);
        apply();

        if (idxEl) idxEl.addEventListener('input', function () {
            waypointIndex = Math.max(0, Math.min(T3D_HAYABUSA_WAYPOINTS.length - 1, parseInt(idxEl.value || '0', 10)));
            apply();
        });

        t3dStatus('Drag to orbit, scroll to zoom. Scrub the mission-milestone slider to move the spacecraft along its real trajectory.');
        return function animate(dt) {
            ryuguGroup.rotation.y += dt * 0.00012; // stands in for Ryugu's ~7.63h rotation, sped up for a visible spin
            beacon.scale.setScalar(1 + 0.08 * Math.sin(performance.now() * 0.0025));
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { hayabusa2ryugusamplereturn: 't3dHayabusaControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { hayabusa2ryugusamplereturn: { radius: 34, maxR: 110, minR: 6, phi: 1.05, theta: 0.6, targetY: 4 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dHayabusaRyugu(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

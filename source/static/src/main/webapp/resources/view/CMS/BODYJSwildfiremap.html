<script>
    // Wildfire-map archetype skeleton (wildfire-map) - live-data class, no
    // upload, no backend, no vendored lib. Registry Gate-H entry:
    // live_wildfire_incidents_wfigs. One keyless, CORS-enabled, US-official
    // API: NIFC WFIGS current incident locations (services3.arcgis.com,
    // GeoJSON). Mirrors the earthquake-tracker.template.html shape (fire703):
    // filter selects + on-load default lookup as the no-permission path,
    // optional browser geolocation adds a distance-from-me column via
    // client-side haversine. The "map" is a canvas dot-plot of incident
    // lon/lat coordinates (equirectangular) - NOT a tile basemap; zero
    // external tiles keeps the page lib-free and the claim honest.
    //
    // Framework contract: bootstrap in doAfterPageRendered() (called for
    // EVERY page after base-script load). Do NOT touch the DOM at top
    // level. In-browser tool => no upload widget.

    web.localUpload = false;

    var WF_QUERY_URL = 'https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Current/FeatureServer/0/query'
        + '?where=1%3D1'
        + '&outFields=' + encodeURIComponent('IncidentName,POOState,POOCounty,IncidentSize,PercentContained,FireDiscoveryDateTime,IncidentTypeCategory')
        + '&f=geojson&resultRecordCount=2000';

    var WF_SIZE_FLOORS = [
        [0, 'Any size'],
        [100, '100+ acres'],
        [1000, '1,000+ acres'],
        [10000, '10,000+ acres']
    ];
    var WF_TABLE_ROW_CAP = 150;
    // Continental-US default frame when a filter matches nothing.
    var WF_DEFAULT_BBOX = { minLon: -125, maxLon: -66, minLat: 24, maxLat: 50 };

    var wfAllFeatures = null;
    var wfUserPos = null;
    var wfHitPoints = [];

    function wfEsc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    function wfAcres(p) {
        // IncidentSize is the queryable acreage field. DailyAcres appears in
        // outFields=* responses but the layer REJECTS it as an explicit
        // outFields name (HTTP 200 + {error:{code:400}}) - do not request it.
        if (typeof p.IncidentSize === 'number') return p.IncidentSize;
        return null;
    }

    function wfStateOf(p) {
        var st = String(p.POOState || '');
        return st.indexOf('US-') === 0 ? st.slice(3) : (st || '?');
    }

    // Normalize the few east-hemisphere US longitudes (Aleutian wrap, Guam)
    // onto the western frame so one outlier cannot blow up the auto-fit box.
    function wfLon(coords) {
        var lon = coords[0];
        return lon > 20 ? lon - 360 : lon;
    }

    function wfContainColor(pct, isRx) {
        if (isRx) return '#8d8d8d';
        if (typeof pct !== 'number') return '#d32f2f';
        if (pct >= 90) return '#2e7d32';
        if (pct >= 50) return '#f9a825';
        if (pct >= 1) return '#ef6c00';
        return '#d32f2f';
    }

    function wfFormatAgo(ms) {
        try {
            var mins = Math.round((Date.now() - ms) / 60000);
            if (mins < 60) return 'today';
            var hrs = Math.round(mins / 60);
            if (hrs < 48) return hrs + ' hr ago';
            var days = Math.round(hrs / 24);
            return days + ' day' + (days === 1 ? '' : 's') + ' ago';
        } catch (e) {
            return '';
        }
    }

    function wfDistanceKm(lat1, lon1, lat2, lon2) {
        var R = 6371;
        var dLat = (lat2 - lat1) * Math.PI / 180;
        var dLon = (lon2 - lon1) * Math.PI / 180;
        var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function wfFetchIncidents() {
        return fetch(WF_QUERY_URL, { headers: { 'Accept': 'application/geo+json' } }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }).then(function (data) {
            // ArcGIS reports bad requests as HTTP 200 + {error:{...}} JSON.
            if (data && data.error) throw new Error('API error ' + (data.error.code || ''));
            var feats = (data && data.features ? data.features : []).filter(function (f) {
                return f && f.geometry && f.geometry.coordinates &&
                    typeof f.geometry.coordinates[0] === 'number' &&
                    typeof f.geometry.coordinates[1] === 'number';
            });
            return feats;
        });
    }

    function wfCurrentFilter(root) {
        var stateSel = root.querySelector('#wfStateSelect');
        var sizeSel = root.querySelector('#wfSizeSelect');
        var rxToggle = root.querySelector('#wfRxToggle');
        return {
            state: stateSel ? stateSel.value : '',
            minAcres: sizeSel ? parseFloat(sizeSel.value) || 0 : 0,
            includeRx: !!(rxToggle && rxToggle.checked)
        };
    }

    function wfApplyFilter(features, opts) {
        return (features || []).filter(function (f) {
            var p = f.properties || {};
            if (!opts.includeRx && p.IncidentTypeCategory !== 'WF') return false;
            if (opts.includeRx && p.IncidentTypeCategory !== 'WF' && p.IncidentTypeCategory !== 'RX') return false;
            if (opts.state && wfStateOf(p) !== opts.state) return false;
            if (opts.minAcres > 0) {
                var acres = wfAcres(p);
                if (!(typeof acres === 'number' && acres >= opts.minAcres)) return false;
            }
            return true;
        });
    }

    function wfPopulateStateSelect(root, features) {
        var sel = root.querySelector('#wfStateSelect');
        if (!sel) return;
        var counts = {};
        for (var i = 0; i < features.length; i++) {
            var st = wfStateOf(features[i].properties || {});
            counts[st] = (counts[st] || 0) + 1;
        }
        var states = Object.keys(counts).sort();
        var html = '<option value="">All states</option>';
        for (var j = 0; j < states.length; j++) {
            html += '<option value="' + wfEsc(states[j]) + '">' + wfEsc(states[j]) + ' (' + counts[states[j]] + ')</option>';
        }
        sel.innerHTML = html;
    }

    function wfDrawMap(root, feats) {
        var canvas = root.querySelector('#wfCanvas');
        var host = root.querySelector('#wfCanvasHost');
        if (!canvas || !host) return;
        var cssW = Math.max(280, host.clientWidth || 280);
        var cssH = Math.max(240, Math.min(440, Math.round(cssW * 0.55)));
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        canvas.style.height = cssH + 'px';
        var ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssW, cssH);
        ctx.fillStyle = '#f7f9fb';
        ctx.fillRect(0, 0, cssW, cssH);

        var minLon, maxLon, minLat, maxLat;
        if (feats.length) {
            minLon = Infinity; maxLon = -Infinity; minLat = Infinity; maxLat = -Infinity;
            for (var i = 0; i < feats.length; i++) {
                var c = feats[i].geometry.coordinates;
                var lon = wfLon(c), lat = c[1];
                if (lon < minLon) minLon = lon;
                if (lon > maxLon) maxLon = lon;
                if (lat < minLat) minLat = lat;
                if (lat > maxLat) maxLat = lat;
            }
            var padLon = Math.max(1.5, (maxLon - minLon) * 0.08);
            var padLat = Math.max(1.0, (maxLat - minLat) * 0.08);
            minLon -= padLon; maxLon += padLon; minLat -= padLat; maxLat += padLat;
        } else {
            minLon = WF_DEFAULT_BBOX.minLon; maxLon = WF_DEFAULT_BBOX.maxLon;
            minLat = WF_DEFAULT_BBOX.minLat; maxLat = WF_DEFAULT_BBOX.maxLat;
        }

        // Fit the lon/lat box into the canvas, preserving geographic aspect
        // (equirectangular with a mid-latitude cosine correction).
        var midLat = (minLat + maxLat) / 2;
        var lonScaleFactor = Math.max(0.2, Math.cos(midLat * Math.PI / 180));
        var geoW = (maxLon - minLon) * lonScaleFactor;
        var geoH = maxLat - minLat;
        var margin = 26;
        var scale = Math.min((cssW - margin * 2) / geoW, (cssH - margin * 2) / geoH);
        var originX = (cssW - geoW * scale) / 2;
        var originY = (cssH - geoH * scale) / 2;
        function px(lon) { return originX + (lon - minLon) * lonScaleFactor * scale; }
        function py(lat) { return originY + (maxLat - lat) * scale; }

        // Graticule + edge labels.
        var lonSpan = maxLon - minLon;
        var step = lonSpan > 40 ? 10 : (lonSpan > 12 ? 5 : 2);
        ctx.strokeStyle = '#e2e8ee';
        ctx.fillStyle = '#8a97a3';
        ctx.lineWidth = 1;
        ctx.font = '10px sans-serif';
        var g;
        for (g = Math.ceil(minLon / step) * step; g <= maxLon; g += step) {
            ctx.beginPath(); ctx.moveTo(px(g), 0); ctx.lineTo(px(g), cssH); ctx.stroke();
            ctx.fillText(g + '°', px(g) + 2, cssH - 4);
        }
        for (g = Math.ceil(minLat / step) * step; g <= maxLat; g += step) {
            ctx.beginPath(); ctx.moveTo(0, py(g)); ctx.lineTo(cssW, py(g)); ctx.stroke();
            ctx.fillText(g + '°', 3, py(g) - 2);
        }

        wfHitPoints = [];
        for (var k = 0; k < feats.length; k++) {
            var p = feats[k].properties || {};
            var coords = feats[k].geometry.coordinates;
            var x = px(wfLon(coords)), y = py(coords[1]);
            var acres = wfAcres(p);
            var r = 2.5 + Math.min(11, Math.sqrt(Math.max(0, acres || 0)) / 16);
            var color = wfContainColor(p.PercentContained, p.IncidentTypeCategory === 'RX');
            ctx.globalAlpha = 0.72;
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.8;
            ctx.stroke();
            wfHitPoints.push({ x: x, y: y, r: r, p: p });
        }

        if (!feats.length) {
            ctx.fillStyle = '#667';
            ctx.font = '13px sans-serif';
            ctx.fillText('No incidents match the current filters.', margin, cssH / 2);
        }
    }

    function wfRenderTable(root, feats) {
        var listEl = root.querySelector('#wfList');
        if (!listEl) return;
        var sorted = feats.slice();
        if (wfUserPos) {
            sorted.sort(function (a, b) {
                var ca = a.geometry.coordinates, cb = b.geometry.coordinates;
                return wfDistanceKm(wfUserPos.lat, wfUserPos.lon, ca[1], wfLon(ca)) -
                    wfDistanceKm(wfUserPos.lat, wfUserPos.lon, cb[1], wfLon(cb));
            });
        } else {
            sorted.sort(function (a, b) { return (wfAcres(b.properties || {}) || 0) - (wfAcres(a.properties || {}) || 0); });
        }
        var shown = sorted.slice(0, WF_TABLE_ROW_CAP);
        var html = '<table style="border-collapse:collapse;width:100%;font-size:0.92em;margin-top:10px;">' +
            '<thead><tr>' +
            '<th style="text-align:left;padding:4px 8px;">Incident</th>' +
            '<th style="text-align:left;padding:4px 8px;">State</th>' +
            '<th style="text-align:left;padding:4px 8px;">County</th>' +
            '<th style="text-align:right;padding:4px 8px;">Acres</th>' +
            '<th style="text-align:right;padding:4px 8px;">Contained</th>' +
            '<th style="text-align:left;padding:4px 8px;">Discovered</th>' +
            (wfUserPos ? '<th style="text-align:right;padding:4px 8px;">Distance</th>' : '') +
            '</tr></thead><tbody>';
        for (var i = 0; i < shown.length; i++) {
            var p = shown[i].properties || {};
            var coords = shown[i].geometry.coordinates;
            var isRx = p.IncidentTypeCategory === 'RX';
            var color = wfContainColor(p.PercentContained, isRx);
            var acres = wfAcres(p);
            html += '<tr style="border-left:4px solid ' + color + ';">';
            html += '<td style="padding:4px 8px;font-weight:600;">' + wfEsc(p.IncidentName || 'Unnamed') + (isRx ? ' <span style="color:#777;font-weight:400;">(prescribed burn)</span>' : '') + '</td>';
            html += '<td style="padding:4px 8px;">' + wfEsc(wfStateOf(p)) + '</td>';
            html += '<td style="padding:4px 8px;color:#555;">' + wfEsc(p.POOCounty || '-') + '</td>';
            html += '<td style="padding:4px 8px;text-align:right;">' + (typeof acres === 'number' ? Math.round(acres).toLocaleString() : '-') + '</td>';
            html += '<td style="padding:4px 8px;text-align:right;color:' + color + ';font-weight:600;">' + (typeof p.PercentContained === 'number' ? Math.round(p.PercentContained) + '%' : '-') + '</td>';
            html += '<td style="padding:4px 8px;color:#555;">' + wfEsc(wfFormatAgo(p.FireDiscoveryDateTime)) + '</td>';
            if (wfUserPos) {
                var dKm = wfDistanceKm(wfUserPos.lat, wfUserPos.lon, coords[1], wfLon(coords));
                html += '<td style="padding:4px 8px;text-align:right;color:#555;">' + Math.round(dKm) + ' km (' + Math.round(dKm * 0.621371) + ' mi)</td>';
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        if (sorted.length > shown.length) {
            html += '<p style="color:#777;font-size:0.9em;">Showing the ' + (wfUserPos ? 'nearest' : 'largest') + ' ' + shown.length + ' of ' + sorted.length + ' matching incidents - narrow the filters to see the rest.</p>';
        }
        listEl.innerHTML = html;
    }

    function wfRender(root) {
        if (!wfAllFeatures) return;
        var opts = wfCurrentFilter(root);
        var feats = wfApplyFilter(wfAllFeatures, opts);
        var statusEl = root.querySelector('#wfStatus');
        var wfCount = 0, rxCount = 0;
        for (var i = 0; i < feats.length; i++) {
            if ((feats[i].properties || {}).IncidentTypeCategory === 'RX') rxCount++; else wfCount++;
        }
        var stamp = 'Last checked: ' + new Date().toLocaleString();
        statusEl.innerHTML = '<div style="font-weight:600;">' + feats.length + ' incident' + (feats.length === 1 ? '' : 's') +
            ' match (' + wfCount + ' wildfire' + (wfCount === 1 ? '' : 's') + (opts.includeRx ? ', ' + rxCount + ' prescribed burn' + (rxCount === 1 ? '' : 's') : '') + ')' +
            (wfUserPos ? ' - sorted nearest first' : ' - sorted largest first') +
            '</div><div style="color:#777;font-size:0.9em;">' + stamp + '</div>';
        wfDrawMap(root, feats);
        wfRenderTable(root, feats);
    }

    function wfLoad(root) {
        var statusEl = root.querySelector('#wfStatus');
        statusEl.textContent = 'Loading current wildfire incidents...';
        root.querySelector('#wfList').innerHTML = '';
        wfFetchIncidents().then(function (feats) {
            wfAllFeatures = feats;
            wfPopulateStateSelect(root, feats);
            wfRender(root);
        }).catch(function (e) {
            statusEl.textContent = 'Could not load wildfire data: ' + (e && e.message ? e.message : String(e));
        });
    }

    function wfRenderSizeClassTable() {
        var rows = [
            ['A', 'Under 0.25 acre', 'Spot fire; a single engine crew handles it.'],
            ['B', '0.26 - 9 acres', 'Small fire, usually contained on initial attack.'],
            ['C', '10 - 99 acres', 'Needs multiple crews; smoke visible for miles.'],
            ['D', '100 - 299 acres', 'Extended attack; local evacuations possible.'],
            ['E', '300 - 999 acres', 'Large fire; incident-management team assigned.'],
            ['F', '1,000 - 4,999 acres', 'Major fire; regional resources committed.'],
            ['G', '5,000+ acres', 'The largest class; campaign fires lasting weeks.']
        ];
        var out = '<table style="border-collapse:collapse;margin-top:8px;font-size:0.92em;"><thead><tr><th style="text-align:left;padding:4px 8px;">Class</th><th style="text-align:left;padding:4px 8px;">Size</th><th style="text-align:left;padding:4px 8px;">What it typically means</th></tr></thead><tbody>';
        for (var i = 0; i < rows.length; i++) {
            out += '<tr><td style="padding:4px 8px;font-weight:600;vertical-align:top;">' + rows[i][0] + '</td><td style="padding:4px 8px;vertical-align:top;white-space:nowrap;">' + rows[i][1] + '</td><td style="padding:4px 8px;">' + rows[i][2] + '</td></tr>';
        }
        out += '</tbody></table>' +
            '<p style="font-size:0.92em;color:#555;">"Percent contained" measures how much of the fire\'s edge has a completed control line around it. 100% contained means fully surrounded - not extinguished; hot spots can burn inside the line for weeks.</p>';
        return out;
    }

    function wfPopulateSelect(select, options, defaultIndex) {
        var html = '';
        for (var i = 0; i < options.length; i++) {
            html += '<option value="' + options[i][0] + '"' + (i === defaultIndex ? ' selected' : '') + '>' + options[i][1] + '</option>';
        }
        select.innerHTML = html;
    }

    function wfWireTooltip(root) {
        var canvas = root.querySelector('#wfCanvas');
        var tip = root.querySelector('#wfTip');
        if (!canvas || !tip) return;
        canvas.addEventListener('mousemove', function (ev) {
            var rect = canvas.getBoundingClientRect();
            var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
            var best = null, bestD = 12;
            for (var i = 0; i < wfHitPoints.length; i++) {
                var h = wfHitPoints[i];
                var d = Math.sqrt((h.x - mx) * (h.x - mx) + (h.y - my) * (h.y - my)) - h.r;
                if (d < bestD) { bestD = d; best = h; }
            }
            if (!best) { tip.style.display = 'none'; return; }
            var p = best.p;
            var acres = wfAcres(p);
            tip.innerHTML = '<b>' + wfEsc(p.IncidentName || 'Unnamed') + '</b><br>' +
                wfEsc(wfStateOf(p)) + (p.POOCounty ? ' - ' + wfEsc(p.POOCounty) : '') + '<br>' +
                (typeof acres === 'number' ? Math.round(acres).toLocaleString() + ' acres' : 'Size unknown') +
                (typeof p.PercentContained === 'number' ? ' - ' + Math.round(p.PercentContained) + '% contained' : '');
            tip.style.display = 'block';
            tip.style.left = Math.min(best.x + 12, (canvas.clientWidth || 300) - 200) + 'px';
            tip.style.top = Math.max(4, best.y - 10) + 'px';
        });
        canvas.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    }

    function doAfterPageRendered() {
        var root = document.getElementById('wildfireMapTool');
        if (!root) return; // not a wildfire-map page
        try {
            var sizeSelect = root.querySelector('#wfSizeSelect');
            var stateSelect = root.querySelector('#wfStateSelect');
            var rxToggle = root.querySelector('#wfRxToggle');
            var refreshBtn = root.querySelector('#wfRefreshBtn');
            var locBtn = root.querySelector('#wfLocBtn');
            var scaleBox = root.querySelector('#wfScaleTable');

            if (scaleBox) scaleBox.innerHTML = wfRenderSizeClassTable();
            if (sizeSelect) wfPopulateSelect(sizeSelect, WF_SIZE_FLOORS, 0);

            function rerender() { wfRender(root); }
            if (stateSelect) stateSelect.addEventListener('change', rerender);
            if (sizeSelect) sizeSelect.addEventListener('change', rerender);
            if (rxToggle) rxToggle.addEventListener('change', rerender);
            if (refreshBtn) refreshBtn.addEventListener('click', function () { wfLoad(root); });

            if (locBtn) {
                locBtn.addEventListener('click', function () {
                    if (!navigator.geolocation) {
                        root.querySelector('#wfStatus').textContent = 'Location is not available in this browser; the list stays sorted by size.';
                        return;
                    }
                    root.querySelector('#wfStatus').textContent = 'Requesting your location...';
                    navigator.geolocation.getCurrentPosition(function (pos) {
                        wfUserPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        wfRender(root);
                    }, function () {
                        root.querySelector('#wfStatus').textContent = 'Location permission denied; the list stays sorted by size.';
                    }, { timeout: 8000 });
                });
            }

            wfWireTooltip(root);

            // Redraw the canvas when the host resizes (late CSS / ad-rail
            // layout shifts - the render-quality contract's observer rule).
            if (typeof ResizeObserver !== 'undefined') {
                var host = root.querySelector('#wfCanvasHost');
                var pending = false;
                if (host) {
                    new ResizeObserver(function () {
                        if (pending) return;
                        pending = true;
                        requestAnimationFrame(function () { pending = false; wfRender(root); });
                    }).observe(host);
                }
            }

            // Always render SOMETHING visible on load (G16) - the default
            // "all states, wildfires only" lookup, so the page never shows a
            // blank panel before the reader interacts.
            wfLoad(root);
        } catch (e) {
            root.innerHTML = '<p style="color:#b00020;">Could not start the tool: ' + wfEsc(e && e.message ? e.message : String(e)) + '</p>';
        }
    }
</script>

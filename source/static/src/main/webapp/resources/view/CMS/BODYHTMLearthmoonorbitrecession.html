<div class="threeSceneTool">
  <div id="t3dWrapper" style="display: flex; flex-direction: column; gap: 0.5rem; padding: 0.5rem;">
    <div id="t3dCanvasHost" style="position: relative; width: 100%; background: #1a1a2e;"></div>
    <div id="t3dStatus" style="font-size: 0.9rem; color: #999; height: 1.5rem; padding: 0 0.5rem;"></div>
    <div id="t3dInfoPanel" style="background: #f5f5f5; border-radius: 4px; padding: 1rem; font-size: 0.95rem;"></div>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; padding: 0 0.5rem;">
      <span style="font-weight: 600; font-size: 0.9rem;">Time (billion years ago):</span>
      <input type="range" id="t3dTimeSlider" style="flex: 1; min-width: 150px;" title="Scrub through orbital evolution">
      <span id="t3dTimeValue" style="font-size: 0.9rem; min-width: 80px;">Today</span>
      <button id="t3dFullscreenBtn" class="w3-button w3-border w3-small" title="Fullscreen">Fullscreen</button>
    </div>
    <div id="t3dMoonRecessionControls" style="display: none; padding: 0.5rem; background: #f9f9f9; border-radius: 4px; font-size: 0.9rem;">
      <p style="margin: 0 0 0.5rem 0;">Drag the 3D view to rotate, scroll to zoom. Use the time slider to move forward or backward 1 billion years and see the Moon's orbit expand as it recedes from Earth.</p>
    </div>
  </div>
</div>

<script>
// Update time value display as slider moves
var timeSlider = document.getElementById('t3dTimeSlider');
var timeValue = document.getElementById('t3dTimeValue');
if (timeSlider && timeValue) {
  function updateTimeDisplay() {
    var v = parseFloat(timeSlider.value);
    if (v === 0) {
      timeValue.textContent = 'Today';
    } else if (v < 10) {
      timeValue.textContent = Math.round(v * 100) + ' million years';
    } else if (v < 1000) {
      timeValue.textContent = (v / 1e3).toFixed(2) + ' billion years';
    } else {
      timeValue.textContent = (v / 1e3).toFixed(1) + ' billion years';
    }
  }
  timeSlider.addEventListener('input', updateTimeDisplay);
  updateTimeDisplay();
}
</script>

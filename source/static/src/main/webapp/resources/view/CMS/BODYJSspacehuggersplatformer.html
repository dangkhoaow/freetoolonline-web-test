<script>
  function doAfterPageRendered() {
    const playBtn = document.getElementById('playBtn');
    if (playBtn) {
      playBtn.addEventListener('click', function() {
        // Hide the button after click
        this.style.display = 'none';

        // Create the game iframe
        const iframeContainer = document.createElement('div');
        iframeContainer.style.position = 'relative';
        iframeContainer.style.width = '100%';
        iframeContainer.style.paddingBottom = '66.67%'; // 3:2 aspect ratio
        iframeContainer.style.background = '#000';
        iframeContainer.style.borderRadius = '8px';
        iframeContainer.style.overflow = 'hidden';
        iframeContainer.style.margin = '20px 0';

        const iframe = document.createElement('iframe');
        iframe.src = 'https://gh-static.freetool.online/games/space-huggers-platformer/index.html';
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        iframe.style.left = '0';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allow = 'fullscreen; pointer-lock; gamepad; autoplay';

        iframeContainer.appendChild(iframe);

        // Insert after the button container
        const buttonDiv = playBtn.parentElement.parentElement;
        buttonDiv.parentNode.insertBefore(iframeContainer, buttonDiv.nextSibling);

        // Focus the iframe
        iframe.onload = function() {
          try {
            iframe.contentWindow.focus();
          } catch (e) {
            // Cross-origin, silently fail
          }
        };
      });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', doAfterPageRendered);
  } else {
    doAfterPageRendered();
  }
</script>

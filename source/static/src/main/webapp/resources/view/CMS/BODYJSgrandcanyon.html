<script>
    // 3D scene archetype skeleton (grand-canyon) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (grand-canyon).
    // places-3d cluster seed 2026-07-27; DETAILED-TERRAIN migration 2026-08-28
    // (prompts/places-3d-detailed-terrain-runbook.md): the procedural relief
    // below renders FIRST (unchanged, G16 render-only pass + CDN-outage
    // fallback), then async fetches real Terrarium DEM elevation + Sentinel-2
    // true-color imagery from the ftol-vm-assets CDN, IndexedDB-caches it, and
    // swaps it in in-place once ready. A CDN failure or slow network leaves the
    // procedural relief on screen - it never blanks.
    //
    // EDUCATIONAL APPROXIMATION, not survey geology.
    // Published figures (NPS / USGS consensus, cross-checked 2026-07-27):
    //   - Length 446 km (277 mi); width up to 29 km; depth about 1.86 km
    //   - Carved by the Colorado River; main incision over the last 5-6 My
    //   - Oldest rock: Vishnu Basement, about 1.7-1.8 billion years
    //   - Grand Canyon National Park, Arizona, USA - established 1919
    //   - Layer stack simplified to 7 major units for teaching
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'grand-canyon';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesgrandcanyon'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    // ---- Real-terrain CDN + IndexedDB cache (mirrors BODYJSmarsterrain.html's
    // t3dMarsIdb* pattern) - heights.bin (Int16 LE meters) + texture.jpg
    // (Sentinel-2 true-color), sha256-verified, cached once per manifest version.
    var T3D_PLACES_CDN = 'https://gh-static.freetool.online/places-3d';
    var T3D_PLACES_DB = 'ftol-places3d-assets';
    function t3dPlacesIdbOpen() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(T3D_PLACES_DB, 1);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('assets')) {
                    req.result.createObjectStore('assets', { keyPath: 'key' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        });
    }
    function t3dPlacesIdbGet(key) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readonly');
                var rq = tx.objectStore('assets').get(key);
                rq.onsuccess = function () { resolve(rq.result ? rq.result.blob : null); };
                rq.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }
    function t3dPlacesIdbPut(key, blob) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put({ key: key, blob: blob });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function () { resolve(false); };
            });
        }).catch(function () { return false; });
    }
    function t3dPlacesSha256Hex(buf) {
        return crypto.subtle.digest('SHA-256', buf).then(function (hash) {
            var b = new Uint8Array(hash), hex = '';
            for (var i = 0; i < b.length; i++) hex += b[i].toString(16).padStart(2, '0');
            return hex;
        });
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x110906, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        var key = new THREE.DirectionalLight(0xffe9c9, 1.0);
        key.position.set(-12, 18, 9);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
        }

        // Canyon relief, 1 unit = ~200 m vertical. A meandering main gorge
        // with dendritic side canyons carved into a high plateau - the DEM
        // look: terraced red walls, cream rim, dark inner gorge, river below.
        var RIM = 2.0, DEPTH = 1.86 * 5 / 5; // ~1.86 km at 1u=1km/... visual scale
        DEPTH = 1.86;
        function chan(z) { return 1.6 * Math.sin(z * 0.30) + 0.8 * Math.sin(z * 0.11 + 1.7); }
        function segDist(px, pz, ax, az, bx, bz) {
            var dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
            var t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / L2));
            var qx = ax + t * dx, qz = az + t * dz;
            return Math.hypot(px - qx, pz - qz);
        }
        var TRIBS = [];
        for (var k = 0; k < 7; k++) {
            var zc = -8 + k * 2.7, side = (k % 2 ? 1 : -1);
            TRIBS.push([chan(zc), zc, chan(zc) + side * (3.2 + 1.2 * hash2(k, 3)), zc + (hash2(k, 7) - 0.5) * 3.2]);
        }
        function carve(d, w, depth) {
            if (d >= w) return 0;
            var t = 1 - d / w;
            var steps = Math.floor(t * 6) / 6;      // terraced profile
            return depth * Math.pow(0.5 * t + 0.5 * steps, 1.2);
        }
        function height(x, z) {
            var h = RIM + 0.35 * (fbm(x * 0.28 + 8, z * 0.28 + 3, 4) - 0.5);
            h -= carve(Math.abs(x - chan(z)), 4.6, DEPTH + 0.12);
            for (var i = 0; i < TRIBS.length; i++) {
                var t2 = TRIBS[i];
                h -= carve(segDist(x, z, t2[0], t2[1], t2[2], t2[3]), 1.5, DEPTH * 0.55);
            }
            // micro-relief on the walls (the crinkled DEM texture)
            h -= 0.12 * (1 - Math.min(1, Math.abs(x - chan(z)) / 4.6)) * fbm(x * 1.6 + 2, z * 1.6 + 5, 4);
            return Math.max(h, RIM - DEPTH - 0.1);
        }
        var LAYERS = [
            [0.00, 0xd9cfae], // Kaibab rim cream
            [0.12, 0xd8c193], // Coconino sandstone
            [0.27, 0xb0563c], // Hermit shale red
            [0.45, 0xa64f38], // Supai
            [0.62, 0x99402e], // Redwall
            [0.80, 0x8a6a4c], // Tonto
            [0.92, 0x4a4048]  // Vishnu basement
        ];
        var normColors = null, accentColors = null, terrain;
        function bandColor(c, h, x, z, accent) {
            var n = 0.9 + 0.2 * fbm(x * 1.4 + 11, z * 1.4 + 7, 3);
            var u = Math.max(0, Math.min(1, (RIM - h) / DEPTH));
            if (u < 0.02) { // plateau surface: pale rim with sparse green
                var g = fbm(x * 0.9 + 20, z * 0.9 + 14, 3);
                c.setHex(g > 0.62 ? 0x7d8f6a : 0xd9cfae).multiplyScalar(n);
                return;
            }
            var hex = LAYERS[LAYERS.length - 1][1];
            for (var i = LAYERS.length - 1; i >= 0; i--) { if (u >= LAYERS[i][0]) { hex = LAYERS[i][1]; break; } }
            c.setHex(hex);
            if (accent) c.offsetHSL(0.0, 0.18, 0.06);
            c.multiplyScalar(n);
        }
        function build(accent) {
            var pos = terrain.geometry.attributes.position, col = new THREE.Color();
            var arr = new Float32Array(pos.count * 3);
            for (var i = 0; i < pos.count; i++) {
                bandColor(col, pos.getY(i), pos.getX(i), pos.getZ(i), accent);
                arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b;
            }
            return arr;
        }
        terrain = makeTerrain(22, 20, shell.low ? 120 : 190, shell.low ? 110 : 175, height, function (c, h, x, z) { bandColor(c, h, x, z, false); });
        scene.add(terrain);
        normColors = terrain.geometry.attributes.color.array.slice();
        accentColors = build(true);

        // Colorado River: a teal ribbon following the gorge floor.
        var riverPts = [];
        for (var i2 = 0; i2 <= 60; i2++) {
            var z3 = -9.6 + (19.2 * i2) / 60;
            riverPts.push(new THREE.Vector3(chan(z3), RIM - DEPTH + 0.06, z3));
        }
        var river = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(riverPts), 90, 0.14, 6, false),
            new THREE.MeshStandardMaterial({ color: 0x2f8f7a, roughness: 0.25 })
        );
        scene.add(river);

        var accentOn = false, riverOn = true;

        // ---- Real-terrain progressive upgrade state (filled once loaded) ----
        var realMesh = null, realReady = false, realLoading = false;
        // 2026-08-29: handles so apply() can switch the real mesh between the
        // satellite view and the layer-accent view. Turning vertexColors off (the
        // fix for the black-terrain multiplication) would otherwise make this
        // page's colour toggle a silent no-op once the texture lands.
        var realMat = null, realTex = null;
        var realWhiteCol = null, realTintCol = null, realMinH = 0, realMaxH = 0;

        function panelHtml() {
            if (realReady) {
                return '<h3>Grand Canyon: real elevation + satellite imagery</h3>' +
                    '<p>This relief now shows the actual measured terrain of the South Rim and river core - the meanders, terraces, and side canyons here are real elevation data, not a procedural approximation.</p>' +
                    '<table class="w3-table w3-bordered">' +
                    '<tr><td>Length</td><td>446 km (277 miles)</td></tr>' +
                    '<tr><td>Width</td><td>up to 29 km (18 miles)</td></tr>' +
                    '<tr><td>Depth</td><td>about 1.86 km - over a mile</td></tr>' +
                    '<tr><td>Elevation in this view</td><td>' + Math.round(realMinH) + ' m to ' + Math.round(realMaxH) + ' m</td></tr>' +
                    '<tr><td>Carved by</td><td>the Colorado River, main incision over the last 5-6 million years</td></tr>' +
                    '<tr><td>Oldest rock</td><td>Vishnu Basement, about 1.7-1.8 billion years old</td></tr>' +
                    '<tr><td>Protected</td><td>Grand Canyon National Park, Arizona, USA - established 1919</td></tr>' +
                    '</table>' +
                    '<p class="t3d-note">Terrain: Mapzen/AWS Open Data terrain tiles (NASA/USGS DEMs). Imagery: contains modified Copernicus Sentinel data 2026. Relief is shown at true 1:1 scale relative to the mapped width - no vertical exaggeration. Educational approximation - not survey-grade geology.</p>';
            }
            return '<h3>Grand Canyon: a mile of rock layers</h3>' +
                '<p>A relief of the gorge: the meandering main canyon, dendritic side canyons, terraced walls from the cream Kaibab rim to the dark Vishnu basement, and the Colorado River below.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Length</td><td>446 km (277 miles)</td></tr>' +
                '<tr><td>Width</td><td>up to 29 km (18 miles)</td></tr>' +
                '<tr><td>Depth</td><td>about 1.86 km - over a mile</td></tr>' +
                '<tr><td>Carved by</td><td>the Colorado River, main incision over the last 5-6 million years</td></tr>' +
                '<tr><td>Oldest rock</td><td>Vishnu Basement, about 1.7-1.8 billion years old</td></tr>' +
                '<tr><td>Protected</td><td>Grand Canyon National Park, Arizona, USA - established 1919</td></tr>' +
                '</table>' +
                '<p class="t3d-note">' + (realLoading
                    ? 'Loading real elevation and satellite imagery now (one time, then cached) - this procedural relief is a teaching placeholder while it downloads.'
                    : 'Educational relief approximation - the meanders, tributaries, and layer bands are procedural teaching cues, not survey geology.') + '</p>';
        }

        function apply() {
            if (realReady && realMesh) {
                realMesh.geometry.attributes.color.array.set(accentOn ? realTintCol : realWhiteCol);
                // With real imagery loaded the two views are mutually exclusive:
                // multiplying accents into the texture is what produced dark terrain.
                if (realMat && realTex) {
                    realMat.map = accentOn ? null : realTex;
                    realMat.vertexColors = !!accentOn;
                    realMat.needsUpdate = true;
                }
                realMesh.geometry.attributes.color.needsUpdate = true;
            } else {
                terrain.geometry.attributes.color.array.set(accentOn ? accentColors : normColors);
                terrain.geometry.attributes.color.needsUpdate = true;
                river.visible = riverOn;
            }
            var lb = document.getElementById('t3dPgcLayersBtn');
            if (lb) lb.textContent = (realReady && realTex)
                ? ('View: ' + (accentOn ? 'Layer accents' : 'Satellite view'))
                : ('Layer accents: ' + (accentOn ? 'On' : 'Off'));
            var rb = document.getElementById('t3dPgcRiverBtn');
            if (rb) rb.textContent = 'River: ' + (riverOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ accentOn: accentOn, riverOn: riverOn }); } catch (e) {}
        }

        // Decimate a row-major Int16 grid to at most maxDim x maxDim cells,
        // keeping the MAX value per cell (per the runbook: preserve summits,
        // never average them away).
        function decimateMax(view, w, h, maxDim) {
            var stepX = Math.max(1, Math.ceil(w / maxDim));
            var stepZ = Math.max(1, Math.ceil(h / maxDim));
            var ow = Math.floor((w - 1) / stepX) + 1;
            var oh = Math.floor((h - 1) / stepZ) + 1;
            var out = new Int16Array(ow * oh);
            for (var oz = 0; oz < oh; oz++) {
                var z0 = oz * stepZ;
                for (var ox = 0; ox < ow; ox++) {
                    var x0 = ox * stepX, best = -32768;
                    for (var dz = 0; dz < stepZ && z0 + dz < h; dz++) {
                        var rowBase = (z0 + dz) * w;
                        for (var dx = 0; dx < stepX && x0 + dx < w; dx++) {
                            var v = view[rowBase + x0 + dx];
                            if (v > best) best = v;
                        }
                    }
                    out[oz * ow + ox] = best;
                }
            }
            return { data: out, w: ow, h: oh };
        }

        function buildRealMesh(view, grid, texBlob) {
            var dec = decimateMax(view, grid.width_px, grid.height_px, 220);
            var W = 22, D = 20; // same footprint as the procedural terrain above
            var geo2 = new THREE.PlaneGeometry(W, D, dec.w - 1, dec.h - 1);
            geo2.rotateX(-Math.PI / 2);
            // Isotropic meters -> scene-unit scale so relief keeps TRUE 1:1
            // vertical proportion relative to the mapped width (no exaggeration).
            var vertScale = W / (grid.width_px * grid.meters_per_px);
            var minH = grid.min_h_m, maxH = grid.max_h_m, span = Math.max(1, maxH - minH);
            var pos2 = geo2.attributes.position;
            var whiteCol = new Float32Array(pos2.count * 3);
            var tintCol = new Float32Array(pos2.count * 3);
            var c = new THREE.Color();
            for (var i = 0; i < pos2.count; i++) {
                var ix = i % dec.w, iz = Math.floor(i / dec.w);
                var hRaw = dec.data[iz * dec.w + ix];
                pos2.setY(i, (hRaw - minH) * vertScale);
                var u = Math.max(0, Math.min(1, (hRaw - minH) / span));
                whiteCol[i * 3] = 1; whiteCol[i * 3 + 1] = 1; whiteCol[i * 3 + 2] = 1;
                bandColor(c, RIM - u * DEPTH, 0, 0, false);
                tintCol[i * 3] = c.r; tintCol[i * 3 + 1] = c.g; tintCol[i * 3 + 2] = c.b;
            }
            geo2.setAttribute('color', new THREE.BufferAttribute(accentOn ? tintCol : whiteCol, 3));
            geo2.computeVertexNormals();
            var mat2 = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });
            var mesh2 = new THREE.Mesh(geo2, mat2);
            scene.add(mesh2);
            terrain.visible = false;
            river.visible = false;
            realMat = mat2;
            realMesh = mesh2; realWhiteCol = whiteCol; realTintCol = tintCol;
            realMinH = minH; realMaxH = maxH;
            realLoading = false; realReady = true;
            apply();
            t3dStatus('Real terrain loaded (Terrarium DEM + Sentinel-2 imagery). Drag to orbit, scroll to zoom.');
            if (texBlob) {
                var url = URL.createObjectURL(texBlob);
                new THREE.TextureLoader().load(url, function (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    // 2026-08-29 DEFECT FIX. MeshStandardMaterial MULTIPLIES
                    // vertexColors by map. Measured on the shipped pages: hypsometric
                    // vertex luminance 0.39-0.48 x Sentinel-2 TCI 0.09-0.19 = 11-18/255,
                    // i.e. black - this is the reported "renders bright, then switches to
                    // dark" moment. Once real imagery is the colour source the
                    // hypsometric bands must stop multiplying into it.
                    mat2.map = tex;
                    mat2.vertexColors = false;
                    mat2.color.setScalar(1);
                    realTex = tex;
                    mat2.needsUpdate = true;
                    apply();
                    URL.revokeObjectURL(url);
                }, undefined, function () { URL.revokeObjectURL(url); });
            }
        }

        function fetchPlacesAsset(file, mimeType, verKey) {
            var key = verKey + ':' + file.file;
            return t3dPlacesIdbGet(key).then(function (cached) {
                if (cached) return cached;
                return fetch(T3D_PLACES_CDN + '/' + file.file).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + file.file);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    return t3dPlacesSha256Hex(buf).then(function (hex) {
                        if (file.sha256 && hex !== file.sha256) { throw new Error('sha256 mismatch on ' + file.file); }
                        var blob = new Blob([buf], { type: mimeType });
                        t3dPlacesIdbPut(key, blob);
                        return blob;
                    });
                });
            });
        }

        function loadRealTerrain() {
            realLoading = true;
            apply();
            fetch(T3D_PLACES_CDN + '/manifest.json').then(function (r) { return r.json(); })
                .then(function (manifest) {
                    var asset = manifest && manifest.assets && manifest.assets['grand-canyon'];
                    if (!asset) throw new Error('manifest missing the grand-canyon asset');
                    var heightsFile = null, texFile = null;
                    (asset.files || []).forEach(function (f) {
                        if (f.role === 'heightfield') heightsFile = f;
                        if (f.role === 'satellite-texture') texFile = f;
                    });
                    if (!heightsFile) throw new Error('manifest missing the heightfield file');
                    var verKey = 'grand-canyon@' + manifest.version;
                    var jobs = [fetchPlacesAsset(heightsFile, 'application/octet-stream', verKey)];
                    if (texFile) jobs.push(fetchPlacesAsset(texFile, 'image/jpeg', verKey));
                    return Promise.all(jobs).then(function (blobs) {
                        return blobs[0].arrayBuffer().then(function (buf) {
                            buildRealMesh(new Int16Array(buf), asset.grid, blobs[1] || null);
                        });
                    });
                })
                .catch(function (err) {
                    realLoading = false;
                    apply();
                    t3dStatus('Could not load real terrain data (' + (err && err.message ? err.message : err) + ') - showing the procedural relief instead.');
                });
        }

        var store = t3dLoadStore();
        if (typeof store.accentOn === 'boolean') accentOn = store.accentOn;
        if (typeof store.riverOn === 'boolean') riverOn = store.riverOn;
        apply();

        var layersBtn = document.getElementById('t3dPgcLayersBtn');
        if (layersBtn) layersBtn.addEventListener('click', function () { accentOn = !accentOn; apply(); });
        var riverBtn = document.getElementById('t3dPgcRiverBtn');
        if (riverBtn) riverBtn.addEventListener('click', function () { riverOn = !riverOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle layer accents or the river.');
        if ('requestIdleCallback' in window) { requestIdleCallback(loadRealTerrain, { timeout: 4000 }); }
        else { setTimeout(loadRealTerrain, 800); }
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesgrandcanyon: 't3dPgcControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesgrandcanyon: { radius: 22, maxR: 50, minR: 7, phi: 0.95, theta: 0.6, targetY: 0.8 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

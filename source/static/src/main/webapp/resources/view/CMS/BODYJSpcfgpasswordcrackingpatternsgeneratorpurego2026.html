<script>
    // PCFG password-pattern generator (pcfg-password-cracking-patterns-generator-pure-go-2026)
    // 100% client-side. All randomness comes from crypto.getRandomValues (Web Crypto),
    // the same unbiased-random primitive as the registry's password_generator_webcrypto
    // / generator_purejs pattern. No fetch, no library, no backend, no hashes, no attack.
    //
    // What it is: an educational / password-policy tool. A PCFG (probabilistic
    // context-free grammar) describes a password as a "base structure" - a sequence
    // of character-class segments (L = letters, D = digits, S = symbols) with lengths,
    // e.g. "monkey99!" has the base structure L6D2S1. Password-guessing models learn
    // which base structures and which digit/symbol fillers are most common in real
    // leaked password sets, then enumerate guesses in that order. This tool makes that
    // visible: it generates example strings that follow the common base structures and
    // shows the structure notation for each, so you can see why human-chosen passwords
    // are guessable, and it includes a uniform-random strong mode for real use.
    //
    // Framework contract: doAfterPageRendered(); renders a batch on load so the e2e
    // visible-output gate passes with zero interaction.

    web.localUpload = false;

    var PCFG_LOWER = 'abcdefghijklmnopqrstuvwxyz';
    var PCFG_UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var PCFG_DIGITS_ALL = '0123456789';
    // ambiguous-free sets for the strong uniform-random mode (no l/o/0/1/I/O)
    var PCFG_STRONG_LOWER = 'abcdefghijkmnpqrstuvwxyz';
    var PCFG_STRONG_UPPER = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    var PCFG_STRONG_DIGITS = '23456789';
    var PCFG_SYMBOLS = '!@#$%^&*-_=+?';

    function pcfgRandInt(max) {
        // Unbiased integer in [0, max) via rejection sampling on Web Crypto.
        if (max <= 0) return 0;
        var limit = Math.floor(0xFFFFFFFF / max) * max;
        var buf = new Uint32Array(1), x;
        do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
        return x % max;
    }
    function pcfgPickChar(str) { return str.charAt(pcfgRandInt(str.length)); }
    function pcfgRandRange(min, max) { return min + pcfgRandInt(max - min + 1); }
    function pcfgWeightedPick(items) {
        // items: [{v, w}] -> returns one v with probability proportional to w.
        var total = 0, i;
        for (i = 0; i < items.length; i++) total += items[i].w;
        var r = pcfgRandInt(total), acc = 0;
        for (i = 0; i < items.length; i++) { acc += items[i].w; if (r < acc) return items[i].v; }
        return items[items.length - 1].v;
    }

    // Common base structures. The ordering and the approximate share mirror widely
    // published analyses of leaked password corpora (e.g. the RockYou set): letters,
    // letters-then-digits, and digits-only dominate. The shares are illustrative
    // (rounded, drawn from public research) - this tool does not measure a live set.
    var PCFG_STRUCTURES = [
        { id: 'L',    label: 'Letters only',                 share: 34, segs: [{ c: 'L', min: 5, max: 9 }],                                      eg: 'sunshine' },
        { id: 'LD',   label: 'Letters then digits',          share: 24, segs: [{ c: 'L', min: 4, max: 8 }, { c: 'D', min: 1, max: 4 }],            eg: 'letmein123' },
        { id: 'D',    label: 'Digits only',                  share: 16, segs: [{ c: 'D', min: 4, max: 8 }],                                      eg: '12345678' },
        { id: 'LDS',  label: 'Letters, digits, then symbol', share: 7,  segs: [{ c: 'L', min: 4, max: 7 }, { c: 'D', min: 1, max: 3 }, { c: 'S', min: 1, max: 1 }], eg: 'monkey99!' },
        { id: 'LS',   label: 'Letters then symbol',          share: 5,  segs: [{ c: 'L', min: 5, max: 8 }, { c: 'S', min: 1, max: 1 }],            eg: 'dragon!' },
        { id: 'DL',   label: 'Digits then letters',          share: 4,  segs: [{ c: 'D', min: 1, max: 3 }, { c: 'L', min: 4, max: 7 }],            eg: '1qwerty' },
        { id: 'LDL',  label: 'Word, digits, word',           share: 3,  segs: [{ c: 'L', min: 3, max: 5 }, { c: 'D', min: 1, max: 2 }, { c: 'L', min: 3, max: 5 }], eg: 'red7car' },
        { id: 'SLDS', label: 'Symbol wrap (symbol, word, digits, symbol)', share: 2, segs: [{ c: 'S', min: 1, max: 1 }, { c: 'L', min: 4, max: 6 }, { c: 'D', min: 1, max: 2 }, { c: 'S', min: 1, max: 1 }], eg: '!tiger9#' }
    ];

    // Common digit fillers people actually append (sequences, single digits, recent
    // years). A length-matched common filler is preferred; otherwise random digits.
    var PCFG_DIGIT_COMMON = {
        1: [{ v: '1', w: 50 }, { v: '2', w: 12 }, { v: '7', w: 8 }, { v: '9', w: 8 }, { v: '0', w: 6 }, { v: '5', w: 6 }],
        2: [{ v: '12', w: 24 }, { v: '69', w: 8 }, { v: '11', w: 8 }, { v: '21', w: 6 }, { v: '99', w: 6 }, { v: '07', w: 5 }],
        3: [{ v: '123', w: 40 }, { v: '007', w: 8 }, { v: '666', w: 6 }, { v: '420', w: 6 }, { v: '321', w: 5 }],
        4: [{ v: '1234', w: 30 }, { v: '2024', w: 12 }, { v: '2025', w: 12 }, { v: '2026', w: 10 }, { v: '1111', w: 8 }, { v: '2000', w: 6 }]
    };
    var PCFG_SYMBOL_COMMON = [{ v: '!', w: 48 }, { v: '@', w: 16 }, { v: '#', w: 10 }, { v: '$', w: 8 }, { v: '.', w: 7 }, { v: '*', w: 5 }, { v: '-', w: 4 }, { v: '_', w: 4 }];

    function pcfgFillSegment(seg, capFirst) {
        var len = pcfgRandRange(seg.min, seg.max), out = '', i;
        if (seg.c === 'L') {
            for (i = 0; i < len; i++) out += pcfgPickChar(PCFG_LOWER);
            if (capFirst) out = out.charAt(0).toUpperCase() + out.slice(1);
            return { text: out, note: 'L' + len };
        }
        if (seg.c === 'D') {
            var common = PCFG_DIGIT_COMMON[len];
            // 70% of the time use a common human filler of this length; else random.
            if (common && pcfgRandInt(10) < 7) { out = pcfgWeightedPick(common); }
            else { for (i = 0; i < len; i++) out += pcfgPickChar(PCFG_DIGITS_ALL); }
            return { text: out, note: 'D' + len };
        }
        // symbol
        for (i = 0; i < len; i++) out += pcfgWeightedPick(PCFG_SYMBOL_COMMON);
        return { text: out, note: 'S' + len };
    }

    function pcfgGenerateFromStructure(struct, capFirst) {
        var text = '', notation = '', k, part;
        for (k = 0; k < struct.segs.length; k++) {
            // capitalize only the first letter of the first L segment (common habit)
            part = pcfgFillSegment(struct.segs[k], capFirst && k === 0 && struct.segs[k].c === 'L');
            text += part.text;
            notation += part.note;
        }
        return { password: text, structure: notation, structureId: struct.id };
    }

    function pcfgStrongRandom(length) {
        var pool = PCFG_STRONG_LOWER + PCFG_STRONG_UPPER + PCFG_STRONG_DIGITS + PCFG_SYMBOLS;
        var n = Math.max(8, Math.min(64, length | 0)), out = '', i;
        for (i = 0; i < n; i++) out += pcfgPickChar(pool);
        var poolSize = pool.length;
        var bits = Math.round(n * (Math.log(poolSize) / Math.log(2)));
        return { password: out, bits: bits };
    }

    function pcfgEscape(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function doAfterPageRendered() {
        var root = document.getElementById('passwordGeneratorTool');
        if (!root) return; // not this tool's page

        var structOptions = PCFG_STRUCTURES.map(function (s) {
            return '<option value="' + s.id + '">' + s.id + ' - ' + s.label + ' (e.g. ' + s.eg + ')</option>';
        }).join('');

        var refRows = PCFG_STRUCTURES.map(function (s) {
            var barW = Math.max(3, s.share);
            return '<tr>' +
                '<td style="font-family:monospace;"><b>' + s.id + '</b></td>' +
                '<td>' + s.label + '</td>' +
                '<td style="font-family:monospace;color:#555;">' + pcfgEscape(s.eg) + '</td>' +
                '<td style="white-space:nowrap;"><span style="display:inline-block;height:10px;width:' + (barW * 2) + 'px;background:#1a73e8;vertical-align:middle;"></span> ~' + s.share + '%</td>' +
                '</tr>';
        }).join('');

        root.innerHTML =
            '<div class="w3-row" style="margin-bottom:10px;">' +
            '<label><b>Mode</b></label><br>' +
            '<select id="pcfgMode" class="w3-select w3-border" style="max-width:420px;">' +
            '<option value="sample">Sample common patterns by real-world frequency</option>' +
            '<option value="pick">Generate from one specific base structure</option>' +
            '<option value="strong">Strong uniform-random password (for real use)</option>' +
            '</select></div>' +
            '<div id="pcfgStructWrap" class="w3-row" style="margin-bottom:10px;display:none;">' +
            '<label><b>Base structure</b></label><br>' +
            '<select id="pcfgStruct" class="w3-select w3-border" style="max-width:420px;">' + structOptions + '</select></div>' +
            '<div id="pcfgCountWrap" class="w3-row" style="margin-bottom:10px;">' +
            '<label>How many examples: <span id="pcfgCountVal">6</span></label><br>' +
            '<input id="pcfgCount" type="range" min="1" max="12" value="6" style="width:220px;vertical-align:middle;"></div>' +
            '<div id="pcfgLenWrap" class="w3-row" style="margin-bottom:10px;display:none;">' +
            '<label>Length: <span id="pcfgLenVal">16</span></label><br>' +
            '<input id="pcfgLen" type="range" min="8" max="48" value="16" style="width:220px;vertical-align:middle;"></div>' +
            '<div id="pcfgCapWrap" class="w3-row" style="margin-bottom:10px;">' +
            '<label><input id="pcfgCap" type="checkbox" checked> Capitalize the first letter (a common human habit)</label></div>' +
            '<div class="w3-row" style="margin-bottom:10px;">' +
            '<button id="pcfgGen" type="button" class="w3-button w3-green">Generate</button> ' +
            '<button id="pcfgCopy" type="button" class="w3-button w3-blue">Copy all</button></div>' +
            '<pre id="pcfgOut" class="outputImgs w3-padding w3-light-grey" style="visibility:visible !important;white-space:pre-wrap;word-break:break-all;min-height:2em;font-size:1.05em;"></pre>' +
            '<div id="pcfgStatus" style="min-height:1.2em;color:#555;margin-bottom:12px;">Everything is generated locally in your browser with the Web Crypto secure random generator. Nothing is uploaded, logged, or sent to a server.</div>' +
            '<h3 style="margin-bottom:4px;">Common base-structure patterns</h3>' +
            '<p style="color:#555;margin-top:0;">L = letters, D = digits, S = symbols; the subscript is the segment length. Shares are approximate, drawn from public analyses of leaked password sets (illustrative, not a live measurement).</p>' +
            '<div style="overflow-x:auto;"><table class="w3-table w3-bordered w3-small">' +
            '<thead><tr><th>Structure</th><th>Meaning</th><th>Example</th><th>Approx. share</th></tr></thead>' +
            '<tbody>' + refRows + '</tbody></table></div>';

        var q = function (sel) { return root.querySelector(sel); };

        function syncControls() {
            var mode = q('#pcfgMode').value;
            q('#pcfgStructWrap').style.display = (mode === 'pick') ? '' : 'none';
            q('#pcfgCountWrap').style.display = (mode === 'strong') ? 'none' : '';
            q('#pcfgCapWrap').style.display = (mode === 'strong') ? 'none' : '';
            q('#pcfgLenWrap').style.display = (mode === 'strong') ? '' : 'none';
        }

        function structById(id) {
            for (var i = 0; i < PCFG_STRUCTURES.length; i++) if (PCFG_STRUCTURES[i].id === id) return PCFG_STRUCTURES[i];
            return PCFG_STRUCTURES[0];
        }
        function sampleStructureByFrequency() {
            return pcfgWeightedPick(PCFG_STRUCTURES.map(function (s) { return { v: s, w: s.share }; }));
        }

        function generate() {
            var mode = q('#pcfgMode').value, lines = [], i, r;
            var cap = q('#pcfgCap').checked;
            if (mode === 'strong') {
                r = pcfgStrongRandom(parseInt(q('#pcfgLen').value, 10));
                q('#pcfgOut').textContent = r.password + '\n';
                q('#pcfgStatus').textContent = 'Uniform-random, about ' + r.bits + ' bits of entropy - this does NOT follow a guessable human pattern. Use a password manager to store it.';
                return;
            }
            var count = parseInt(q('#pcfgCount').value, 10);
            for (i = 0; i < count; i++) {
                var struct = (mode === 'pick') ? structById(q('#pcfgStruct').value) : sampleStructureByFrequency();
                r = pcfgGenerateFromStructure(struct, cap);
                // pad the password column so the structure notation lines up
                var pw = r.password;
                var padded = pw + new Array(Math.max(1, 22 - pw.length)).join(' ');
                lines.push(padded + '[' + r.structure + ']  predictable pattern');
            }
            q('#pcfgOut').textContent = lines.join('\n') + '\n';
            q('#pcfgStatus').textContent = 'These example strings follow common human patterns, so a guessing model reaches them quickly - they are for policy testing and awareness, not for protecting a real account.';
        }

        q('#pcfgMode').addEventListener('change', function () { syncControls(); generate(); });
        q('#pcfgStruct').addEventListener('change', generate);
        q('#pcfgCount').addEventListener('input', function () { q('#pcfgCountVal').textContent = this.value; generate(); });
        q('#pcfgLen').addEventListener('input', function () { q('#pcfgLenVal').textContent = this.value; generate(); });
        q('#pcfgCap').addEventListener('change', generate);
        q('#pcfgGen').addEventListener('click', generate);
        q('#pcfgCopy').addEventListener('click', function () {
            var v = q('#pcfgOut').textContent;
            if (v && navigator.clipboard) navigator.clipboard.writeText(v);
            q('#pcfgStatus').textContent = v ? 'Copied all generated examples to the clipboard.' : 'Generate some examples first.';
        });

        syncControls();
        generate(); // render a batch on load (visible output for the e2e gate)
    }
</script>

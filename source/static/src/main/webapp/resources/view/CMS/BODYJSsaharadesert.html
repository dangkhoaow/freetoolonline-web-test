<script type="module">
import * as THREE from '/vendor/three/build/three.module.js';

const SCENE_CONFIG = {
  DUNE_SEA_SIZE: 80,
  DUNE_SEGMENTS: 140,
  DUNE_HEIGHT_SCALE: 0.9,
};

// Terrain helpers
function hash2(p) {
  let x = Math.sin(p.x * 12.9898 + p.y * 78.233) * 43758.5453;
  let y = Math.sin(p.x * 73.1812 + p.y * 19.273) * 23456.1234;
  return [x - Math.floor(x), y - Math.floor(y)];
}

function vnoise(p) {
  let i = [Math.floor(p.x), Math.floor(p.y)];
  let f = [p.x - i[0], p.y - i[1]];
  let u = [f[0] * f[0] * (3 - 2 * f[0]), f[1] * f[1] * (3 - 2 * f[1])];
  let n00 = hash2([i[0], i[1]])[0] * 2 - 1;
  let n10 = hash2([i[0] + 1, i[1]])[0] * 2 - 1;
  let n01 = hash2([i[0], i[1] + 1])[0] * 2 - 1;
  let n11 = hash2([i[0] + 1, i[1] + 1])[0] * 2 - 1;
  let nx0 = n00 * (1 - u[0]) + n10 * u[0];
  let nx1 = n01 * (1 - u[0]) + n11 * u[0];
  return nx0 * (1 - u[1]) + nx1 * u[1];
}

function fbm(p, octaves) {
  let value = 0, amp = 1, freq = 1;
  for (let i = 0; i < octaves; i++) {
    value += amp * vnoise([p.x * freq, p.y * freq]);
    amp *= 0.5;
    freq *= 2;
  }
  return value;
}

function makeDuneGeometry(size, segs, heightScale) {
  let geo = new THREE.PlaneGeometry(size, size, segs, segs);
  let pos = geo.attributes.position;
  let DUNE_WAVE = 0.18;
  let WAVE_FREQ = 2.8;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i);
    let y = pos.getY(i);
    let z = 0;
    z += fbm({x: x * 0.35, y: y * 0.35}, 4) * heightScale * 0.5;
    z += Math.sin(x * WAVE_FREQ) * DUNE_WAVE * Math.abs(fbm({x: y * 0.5, y: x * 0.5}, 2)) * heightScale;
    z += Math.max(0, vnoise({x: x * 0.65, y: y * 0.65}) - 0.3) * heightScale * 0.6;
    pos.setZ(i, z);
  }
  geo.computeVertexNormals();
  let colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    let z = pos.getZ(i);
    let norm = Math.max(0, Math.min(1, (z + 2) / 4));
    let r = 0.8 + norm * 0.2;
    let g = 0.5 + norm * 0.15;
    let b = 0.15 + norm * 0.05;
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}

function makeDuneGeometryAlt(size, segs, heightScale) {
  let geo = makeDuneGeometry(size, segs, heightScale);
  let pos = geo.attributes.position;
  let colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    let z = pos.getZ(i);
    let norm = Math.max(0, Math.min(1, (z + 2) / 4));
    let r = 0.9 - norm * 0.1;
    let g = 0.3 + norm * 0.3;
    let b = 0.1 + norm * 0.4;
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
  }
  geo.setAttribute('colorAlt', new THREE.BufferAttribute(colors, 3));
  return geo;
}

async function runScene() {
  const canvas = document.getElementById('t3dCanvasHost');
  if (!canvas) return;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2c2c2c);
  const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 500);
  camera.position.set(35, 32, 45);
  camera.lookAt(0, 0, 8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  canvas.replaceChildren(renderer.domElement);

  const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
  light1.position.set(15, 25, 20);
  scene.add(light1);

  const light2 = new THREE.AmbientLight(0xcccccc, 0.6);
  scene.add(light2);

  const terrainGeo = makeDuneGeometry(SCENE_CONFIG.DUNE_SEA_SIZE, SCENE_CONFIG.DUNE_SEGMENTS, SCENE_CONFIG.DUNE_HEIGHT_SCALE);
  const terrainGeoAlt = makeDuneGeometryAlt(SCENE_CONFIG.DUNE_SEA_SIZE, SCENE_CONFIG.DUNE_SEGMENTS, SCENE_CONFIG.DUNE_HEIGHT_SCALE);

  const mat = new THREE.MeshPhongMaterial({ vertexColors: true, emissive: 0x000000 });
  const mesh = new THREE.Mesh(terrainGeo, mat);
  scene.add(mesh);

  const meshAlt = new THREE.Mesh(terrainGeoAlt, mat);
  meshAlt.visible = false;
  scene.add(meshAlt);

  // Caravan markers
  const caravanGroup = new THREE.Group();
  const caravanPositions = [
    [-20, -15, 0], [8, 12, 0], [-10, 25, 0], [18, -20, 0], [5, 5, 0]
  ];
  for (let pos of caravanPositions) {
    const coneGeo = new THREE.ConeGeometry(0.8, 3.5, 16);
    const coneMat = new THREE.MeshPhongMaterial({ color: 0xd4a574 });
    const cone = new THREE.Mesh(coneGeo, coneMat);
    cone.position.set(pos[0], pos[1], pos[2] + 2.2);
    caravanGroup.add(cone);

    const ringGeo = new THREE.TorusGeometry(2.5, 0.15, 8, 32);
    const ringMat = new THREE.MeshPhongMaterial({ color: 0x8b6f47 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.set(pos[0], pos[1], pos[2] + 0.5);
    ring.rotateX(Math.PI / 2.4);
    caravanGroup.add(ring);
  }
  scene.add(caravanGroup);
  caravanGroup.visible = true;

  // Event listeners
  document.getElementById('t3dToggleTempColor')?.addEventListener('change', (e) => {
    mesh.visible = !e.target.checked;
    meshAlt.visible = e.target.checked;
  });

  document.getElementById('t3dToggleCaravans')?.addEventListener('change', (e) => {
    caravanGroup.visible = e.target.checked;
  });

  // Camera orbit
  let targetY = 8, theta = 0.8, phi = 0.75, radius = 50;
  function updateCameraOrbit() {
    let x = radius * Math.sin(theta) * Math.cos(phi);
    let y = radius * Math.sin(phi) + targetY;
    let z = radius * Math.cos(theta) * Math.cos(phi);
    camera.position.set(x, y, z);
    camera.lookAt(0, targetY, 0);
  }

  // Window resize + ResizeObserver
  const observer = new ResizeObserver(() => {
    let w = canvas.clientWidth, h = canvas.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  observer.observe(canvas);

  window.addEventListener('resize', updateCameraOrbit);

  // Auto-rotate
  (function animate() {
    theta += 0.0003;
    updateCameraOrbit();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  })();
}

runScene().catch(e => {
  console.error('Scene error:', e);
  const status = document.getElementById('t3dStatus');
  if (status) status.textContent = 'Scene load failed: ' + (e.message || 'unknown error');
});
</script>

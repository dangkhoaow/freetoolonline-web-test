<div class="w3-container">
    <p>Pick a category, choose the units to convert between, and type a value. The result updates as you type - everything runs in your browser.</p>
</div>

<style>
    #ucTool .uc-row { margin-bottom: 12px; }
    #ucTool label.uc-label { font-weight: bold; display: block; margin-bottom: 4px; }
    #ucTool select.w3-select, #ucTool input.w3-input { max-width: 440px; }
    #ucError { color: #b00020; font-weight: bold; margin-top: 6px; min-height: 1em; }
    #ucFormula { color: #555; margin-top: 8px; font-style: italic; min-height: 1em; }
    #ucHistory { list-style: none; margin: 8px 0 0; padding: 0; }
    #ucHistory .uc-history-item { padding: 6px 4px; border-bottom: 1px solid #eeeeee; word-break: break-word; }
    #ucHistoryEmpty { color: #777777; padding: 8px 4px; }
    .uc-grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .uc-grid .uc-col { flex: 1 1 280px; }
</style>

<div id="ucTool" class="w3-container">
    <div class="uc-row">
        <label class="uc-label" for="ucCategory">Category</label>
        <select id="ucCategory" class="w3-select w3-border"></select>
    </div>

    <div class="uc-grid">
        <div class="uc-col">
            <div class="uc-row">
                <label class="uc-label" for="ucFrom">From</label>
                <select id="ucFrom" class="w3-select w3-border"></select>
            </div>
            <div class="uc-row">
                <label class="uc-label" for="ucValue">Value</label>
                <input type="text" id="ucValue" class="w3-input w3-border" value="1"
                       placeholder="Enter a number" inputmode="decimal" autocomplete="off" />
                <div id="ucError" aria-live="polite"></div>
            </div>
        </div>
        <div class="uc-col">
            <div class="uc-row">
                <label class="uc-label" for="ucTo">To</label>
                <select id="ucTo" class="w3-select w3-border"></select>
            </div>
            <div class="uc-row">
                <label class="uc-label" for="ucResult">Result</label>
                <input type="text" id="ucResult" class="w3-input w3-border w3-light-grey" readonly aria-live="polite" />
            </div>
        </div>
    </div>

    <div class="uc-row">
        <button type="button" id="ucSwap" class="w3-button w3-light-grey">Swap units</button>
    </div>

    <div id="ucFormula" aria-live="polite"></div>

    <div class="uc-row" style="margin-top: 18px;">
        <label class="uc-label">Recent conversions</label>
        <button type="button" id="ucClearHistory" class="w3-button w3-small w3-light-grey w3-right">Clear</button>
        <ul id="ucHistory" aria-live="polite"></ul>
        <div id="ucHistoryEmpty">No conversions yet. Type a value above.</div>
    </div>
</div>

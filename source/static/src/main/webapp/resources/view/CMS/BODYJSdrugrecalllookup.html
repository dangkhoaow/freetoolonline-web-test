<script>
    // Drug-recall-lookup - live-data class, no upload, no backend, no vendored
    // lib. Registry Gate-H entry: drug_recall_lookup_openfda. Keyless,
    // CORS-`*` US-government openFDA drug enforcement API only. Reuses the
    // food-recall-lookup architecture verbatim (fire731): on-load default
    // example lookup as the zero-interaction G16 path, then reader-driven
    // lookups by medicine/brand keyword with an optional recalling-firm-state
    // filter. Drug-specific extension: the search also checks the openFDA
    // brand_name and generic_name fields, and each card renders a
    // brand/generic line when openFDA enrichment is present. HONESTY NOTE:
    // the search query IS sent to the official US government openFDA API
    // (never to this site's servers) - the page states that plainly and
    // never claims "never leaves your browser".
    //
    // Framework contract: bootstrap in doAfterPageRendered() (called for
    // EVERY page after base-script load). Do NOT touch the DOM at top
    // level. In-browser tool => no upload widget.

    web.localUpload = false;

    var DR_API_URL = 'https://api.fda.gov/drug/enforcement.json';
    var DR_EXAMPLE_LIMIT = 8;
    var DR_SEARCH_LIMIT = 25;

    var DR_STATES = [
        'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DC', 'DE', 'FL', 'GA',
        'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD', 'MA',
        'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ', 'NM', 'NY',
        'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'PR', 'RI', 'SC', 'SD', 'TN',
        'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
    ];

    // FDA recall classification definitions - wording paraphrase-locked to
    // fda.gov (never invented; Class I phrase kept verbatim-close).
    var DR_CLASS_DEFS = {
        'Class I': 'Most serious: reasonable probability that use of or exposure to the product will cause serious adverse health consequences or death.',
        'Class II': 'Use of or exposure to the product may cause temporary or medically reversible adverse health consequences; the probability of serious harm is remote.',
        'Class III': 'Use of or exposure to the product is not likely to cause adverse health consequences.'
    };

    function drEsc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }

    function drStatus(root, msg, isError) {
        var el = root.querySelector('#drStatus');
        if (!el) return;
        el.style.color = isError ? '#b00020' : '#555';
        el.textContent = msg;
    }

    // openFDA returns HTTP 404 + {error:{code:'NOT_FOUND'}} for an empty
    // result set - that is "no recalls found", never a failure.
    function drFetchJson(url) {
        return fetch(url, { headers: { 'Accept': 'application/json' } }).then(function (r) {
            return r.json().then(function (data) {
                if (data && data.error && data.error.code === 'NOT_FOUND') return { results: [] };
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return data;
            });
        });
    }

    function drFmtDate(yyyymmdd) {
        var m = String(yyyymmdd || '').match(/^(\d{4})(\d{2})(\d{2})$/);
        return m ? (m[1] + '-' + m[2] + '-' + m[3]) : String(yyyymmdd || '');
    }

    function drClassBadge(cls) {
        var c = String(cls || '').trim();
        var bg = c === 'Class I' ? '#b00020' : (c === 'Class II' ? '#ef6c00' : '#546e7a');
        return '<span style="display:inline-block;background:' + bg + ';color:#fff;border-radius:3px;padding:1px 8px;margin:2px 6px 2px 0;font-size:0.85em;font-weight:600;">' + drEsc(c || 'Unclassified') + (c === 'Class I' ? ' (health hazard)' : '') + '</span>';
    }

    // Drug search checks four fields: product description, recalling firm,
    // and the openFDA brand/generic name enrichment - so "tylenol" and
    // "acetaminophen" both match the same reports. Verified live 2026-09-12:
    // (product_description:X recalling_firm:X openfda.brand_name:X
    // openfda.generic_name:X) AND state:YY composes correctly.
    function drBuildSearch(kw, state) {
        var k = String(kw || '').trim().replace(/"/g, '');
        var clauses = '';
        if (k) {
            var q = /\s/.test(k) ? '"' + k + '"' : k;
            clauses = 'product_description:' + q + ' recalling_firm:' + q + ' openfda.brand_name:' + q + ' openfda.generic_name:' + q;
        }
        var st = String(state || '').trim().toUpperCase();
        if (st) {
            clauses = clauses ? '(' + clauses + ') AND state:' + st : 'state:' + st;
        }
        return clauses;
    }

    function drBrandGenericLine(r) {
        var of = r && r.openfda ? r.openfda : null;
        if (!of) return '';
        var brand = (of.brand_name && of.brand_name.length) ? of.brand_name.slice(0, 3).join(', ') : '';
        var gen = (of.generic_name && of.generic_name.length) ? of.generic_name.slice(0, 3).join(', ') : '';
        if (!brand && !gen) return '';
        var bits = [];
        if (brand) bits.push('<b>Brand:</b> ' + drEsc(brand));
        if (gen) bits.push('<b>Generic:</b> ' + drEsc(gen));
        return '<p style="margin:6px 0 0;">' + bits.join(' &nbsp; ') + '</p>';
    }

    function drRenderResults(root, data, queryLabel, isExample) {
        var listEl = root.querySelector('#drResults');
        if (!listEl) return;
        var recs = (data && data.results) ? data.results : [];
        var head = '';
        if (isExample) {
            head += '<p style="color:#777;font-size:0.9em;margin:8px 0 2px;">Latest US drug recall enforcement reports (newest first) so you can see what results look like - run your own search above.</p>';
        }
        if (!recs.length) {
            listEl.innerHTML = head +
                '<div style="border:1px solid #c8e6c9;background:#f1f8e9;border-radius:4px;padding:10px 14px;margin-top:8px;">' +
                '<b>No recalls found for ' + drEsc(queryLabel) + '.</b> ' +
                'The openFDA enforcement database has no report matching that query. Try the generic name instead of the brand (or the brand instead of the generic), and remember enforcement reports lag public announcements by days to weeks - for breaking recalls check <a href="https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts" target="_blank" rel="noopener">fda.gov/safety/recalls</a>.' +
                '</div>';
            return;
        }
        var hasClassI = false;
        for (var j = 0; j < recs.length; j++) {
            if (String(recs[j].classification || '').trim() === 'Class I') { hasClassI = true; break; }
        }
        var html = head + '<p style="margin:10px 0 4px;"><b>' + recs.length + ' enforcement report' + (recs.length === 1 ? '' : 's') + '</b> for ' + drEsc(queryLabel) + ', newest first:</p>';
        if (hasClassI) {
            html += '<div style="border:1px solid #b00020;background:#fdecea;border-radius:4px;padding:8px 14px;margin:8px 0;color:#b00020;font-weight:600;">Class I recalls below - FDA\'s most serious category: reasonable probability that use of or exposure to the product will cause serious adverse health consequences or death. Check your lot numbers, and talk to your pharmacist before stopping a prescription medicine.</div>';
        }
        for (var i = 0; i < recs.length; i++) {
            var r = recs[i];
            var cls = String(r.classification || '').trim();
            html += '<div style="border:1px solid #e0e0e0;border-left:4px solid ' + (cls === 'Class I' ? '#b00020' : (cls === 'Class II' ? '#ef6c00' : '#1a73e8')) + ';border-radius:4px;padding:10px 14px;margin-top:10px;">';
            html += '<div style="font-weight:600;">' + drEsc(r.product_description || 'Product not stated') + '</div>';
            html += '<div style="color:#777;font-size:0.88em;margin:2px 0 4px;">' + drEsc(r.recalling_firm || 'Firm not stated') + (r.city || r.state ? ' - ' + drEsc([r.city, r.state].filter(Boolean).join(', ')) : '') + (r.recall_initiation_date ? ' - initiated ' + drFmtDate(r.recall_initiation_date) : '') + '</div>';
            html += '<div>' + drClassBadge(cls) + (r.status ? '<span style="display:inline-block;background:#eceff1;color:#37474f;border-radius:3px;padding:1px 8px;margin:2px 6px 2px 0;font-size:0.85em;">' + drEsc(r.status) + '</span>' : '') + (r.voluntary_mandated ? '<span style="display:inline-block;background:#eceff1;color:#37474f;border-radius:3px;padding:1px 8px;margin:2px 6px 2px 0;font-size:0.85em;">' + drEsc(r.voluntary_mandated) + '</span>' : '') + '</div>';
            html += drBrandGenericLine(r);
            if (r.reason_for_recall) html += '<p style="margin:6px 0 0;"><b>Reason:</b> ' + drEsc(r.reason_for_recall) + '</p>';
            if (r.code_info) html += '<p style="margin:6px 0 0;"><b>Lot codes:</b> ' + drEsc(r.code_info) + '</p>';
            if (r.distribution_pattern) html += '<p style="margin:6px 0 0;"><b>Distribution:</b> ' + drEsc(r.distribution_pattern) + '</p>';
            html += '</div>';
        }
        html += '<p style="color:#777;font-size:0.9em;margin-top:8px;">Data source: openFDA drug enforcement reports (human drugs, US market). Medical device, animal-drug, and dietary-supplement recalls are separate systems - supplements are FDA-regulated foods, so use the <a href="/utility-tools/food-recall-lookup.html">food recall lookup</a> for those.</p>';
        listEl.innerHTML = html;
    }

    function drLookup(root, kw, state, isExample) {
        var search = drBuildSearch(kw, state);
        var label;
        if (isExample) {
            label = 'the latest US drug recalls';
        } else if (kw && state) {
            label = '"' + kw + '" (firm state ' + state + ')';
        } else if (kw) {
            label = '"' + kw + '"';
        } else if (state) {
            label = 'recalling firms in ' + state;
        } else {
            drStatus(root, 'Type a medicine, brand, or active-ingredient keyword (or pick a state), then press Search recalls.', true);
            return;
        }
        drStatus(root, 'Checking openFDA enforcement reports for ' + label + '...');
        root.querySelector('#drResults').innerHTML = '';
        var url = DR_API_URL + '?limit=' + (isExample ? DR_EXAMPLE_LIMIT : DR_SEARCH_LIMIT) + '&sort=report_date:desc';
        if (search) url += '&search=' + encodeURIComponent(search);
        drFetchJson(url).then(function (data) {
            drStatus(root, 'Last checked: ' + new Date().toLocaleString() + ' (source: api.fda.gov)');
            drRenderResults(root, data, label, !!isExample);
        }).catch(function (e) {
            drStatus(root, 'Could not reach the openFDA service: ' + (e && e.message ? e.message : String(e)) + '. Try again in a moment.', true);
        });
    }

    function drPopulateStates(root) {
        var sel = root.querySelector('#drStateSelect');
        if (!sel) return;
        var html = '<option value="">Any state</option>';
        for (var i = 0; i < DR_STATES.length; i++) {
            html += '<option value="' + DR_STATES[i] + '">' + DR_STATES[i] + '</option>';
        }
        sel.innerHTML = html;
    }

    function drRenderExplainer() {
        var out = '<table style="border-collapse:collapse;margin-top:8px;font-size:0.92em;"><thead><tr><th style="text-align:left;padding:4px 8px;">Classification</th><th style="text-align:left;padding:4px 8px;">What it means for you</th></tr></thead><tbody>';
        var order = ['Class I', 'Class II', 'Class III'];
        for (var i = 0; i < order.length; i++) {
            out += '<tr><td style="padding:4px 8px;font-weight:600;vertical-align:top;white-space:nowrap;">' + order[i] + '</td><td style="padding:4px 8px;">' + DR_CLASS_DEFS[order[i]] + '</td></tr>';
        }
        out += '</tbody></table>';
        out += '<div style="font-weight:bold;margin-top:12px;">If a medicine in your cabinet is recalled</div>' +
            '<ol style="margin:6px 0 0 18px;padding:0;">' +
            '<li>Compare the lot number and NDC printed on your package or pharmacy label against the lot codes in the report - a recall usually covers specific lots, not every package.</li>' +
            '<li>Do not abruptly stop a prescription medicine on your own - for some conditions stopping is riskier than the recall issue. Ask your pharmacist or prescriber what to do and whether a replacement lot or alternative is available.</li>' +
            '<li>For an over-the-counter product in a recalled lot, stop using it and follow the recall notice: return it to the store or pharmacy, or dispose of it as the notice instructs.</li>' +
            '<li>If you feel unwell after taking a recalled medicine, contact a doctor, and report side effects to FDA MedWatch at fda.gov/medwatch.</li>' +
            '</ol>' +
            '<p style="font-size:0.92em;color:#555;margin-top:8px;">This page checks human-drug enforcement reports in the openFDA database (US market) - prescription and over-the-counter medicines. Medical device and animal-drug recalls are separate FDA systems and are NOT included, and dietary supplements are FDA-regulated foods - check the <a href="/utility-tools/food-recall-lookup.html">food recall lookup</a> for those. Enforcement reports lag public announcements by days to weeks, so a recall you just saw in the news may not be listed yet - for breaking recalls check <a href="https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts" target="_blank" rel="noopener">fda.gov/safety/recalls</a>. The state filter matches the recalling firm\'s home state, not where the medicine was sold - the Distribution line on each report shows where it went. Your search query goes only to the official US-government openFDA API, never to this site\'s servers, and this page does not store it. This tool is informational - it is not medical advice.</p>';
        return out;
    }

    function doAfterPageRendered() {
        var root = document.getElementById('drugRecallTool');
        if (!root) return; // not a drug-recall page
        try {
            drPopulateStates(root);

            var explainBox = root.querySelector('#drExplainer');
            if (explainBox) explainBox.innerHTML = drRenderExplainer();

            var kwInput = root.querySelector('#drKeywordInput');
            var stateSel = root.querySelector('#drStateSelect');
            var searchBtn = root.querySelector('#drSearchBtn');

            if (searchBtn) {
                searchBtn.addEventListener('click', function () {
                    drLookup(root,
                        kwInput ? kwInput.value : '',
                        stateSel ? stateSel.value : '',
                        false);
                });
            }
            if (kwInput) {
                kwInput.addEventListener('keydown', function (ev) {
                    if (ev.key === 'Enter') {
                        ev.preventDefault();
                        drLookup(root, kwInput.value, stateSel ? stateSel.value : '', false);
                    }
                });
            }

            // Always render SOMETHING visible on load (G16) - the labeled
            // newest-recalls example lookup, so the page never shows a blank
            // panel before the reader interacts.
            drLookup(root, '', '', true);
        } catch (e) {
            root.innerHTML = '<p style="color:#b00020;">Could not start the tool: ' + drEsc(e && e.message ? e.message : String(e)) + '</p>';
        }
    }
</script>

<div class="w3-container">
    <p>The page answers "today is/is not a scheduled observance" on load, plus a countdown to the next one and a full list table.</p>
</div>

<div id="dateLookupTool" class="w3-container outputImgs" style="visibility:visible !important; min-height:160px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>
    <div id="dlTodayView" aria-live="polite" style="min-height:1.4em;font-size:1.05em;"></div>
    <div id="dlHolidayControls" style="margin-top:10px;">
        <div class="w3-row" style="margin-bottom:8px;">
            <select id="dlCountrySelect" class="w3-select w3-border" style="display:inline-block;width:180px;"></select>
        </div>
        <div class="w3-row" style="margin-bottom:8px;">
            <select id="dlHolidaySelect" class="w3-select w3-border" style="display:inline-block;width:320px;"></select>
        </div>
        <div style="margin-bottom:8px;">
            <span style="color:#555;">Countdown: </span><span id="dlCountdown" style="font-weight:600;font-family:monospace;"></span>
        </div>
        <div class="w3-row">
            <input id="dlShareLink" type="text" readonly class="w3-input w3-border" style="display:inline-block;width:60%;max-width:420px;font-size:0.85em;" />
            <button type="button" id="dlShareBtn" class="w3-button w3-light-grey">Copy link</button>
        </div>
    </div>
    <div id="dlDisclaimer"></div>
    <div id="dlTable"></div>
</div>

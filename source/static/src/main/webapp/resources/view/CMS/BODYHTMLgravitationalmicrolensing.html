<div id="t3dWrapper" class="outputImgs" style="position:relative;background:#0a0e27;margin:0 auto;">
  <div id="threeSceneTool" class="outputImgs" style="width:100%;max-width:100%;border-radius:8px;overflow:hidden;">
    <div id="t3dCanvasHost" style="position:relative;width:100%;height:auto;background:#000;min-height:260px;display:flex;align-items:center;justify-content:center;">
      <span id="t3dStatus" style="color:#ccc;font-family:monospace;font-size:14px;text-align:center;">Preparing the 3D scene...</span>
    </div>
    <div id="t3dInfoPanel" style="background:#111;color:#aaa;padding:12px;font-size:13px;line-height:1.6;border-top:1px solid #333;">
      <strong>Gravitational Microlensing:</strong> A distant star's light is magnified and bent by a nearby star's gravity. Exoplanets orbiting the nearby star can create additional brightening spikes, revealing their presence.
    </div>
  </div>
  <div style="margin-top:12px;text-align:center;">
    <button id="t3dFullscreenBtn" style="padding:6px 12px;background:#1a5f7a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Fullscreen</button>
  </div>
</div>

<script>
    // 3D scene archetype (yosemite-falls) - vendored three.js (ESM,
    // dynamic import from /vendor/three/, NO CDN engine), fully client-side.
    // places-3d cluster, places-3d-discovery-loop-runbook, 2026-08-27.
    //
    // EDUCATIONAL APPROXIMATION, not a survey-grade hydrological model.
    // Published figures (cross-checked 2026-08-27):
    //   - Total height (all three sections) about 739 m (2,425 ft) -
    //     North America's tallest waterfall
    //   - Upper Yosemite Fall: about 436 m (1,430 ft) single free-fall drop
    //   - Middle Cascades: about 206 m (675 ft)
    //   - Lower Yosemite Fall: about 98 m (320 ft)
    //   - Fed by Yosemite Creek, sourced from high-country snowmelt
    //   - Drops off a sheer granite cliff in Yosemite Valley, Yosemite
    //     National Park, California, USA (a UNESCO World Heritage Site
    //     since 1984)
    //   - Highly seasonal: flow typically peaks in May-June from snowmelt
    //     and can shrink to a trickle - sometimes running nearly dry - by
    //     late summer (August-September)
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'yosemite-falls';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesyosemitefalls'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0xaecbe0, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        var key = new THREE.DirectionalLight(0xffffff, 1.0);
        key.position.set(-9, 22, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0 }));
        }

        // The signature figure is a SHEER GRANITE CLIFF cut in THREE
        // stepped tiers (unlike Angel Falls' single continuous plateau
        // edge): a rounded granite dome rim at the top (Yosemite Point),
        // a tall upper wall, a short mid-bench (the Middle Cascades
        // ledge), a second wall, a small lower bench, then the valley
        // floor forest. A narrow notch carries Yosemite Creek down all
        // three tiers.
        // Explicit flat plateaus + narrow ramps in between, so the three
        // steps read as a visible STAIRCASE rather than one continuous
        // slope (a narrow WALL_BAND with non-overlapping ramp centers -
        // the first attempt used overlapping smoothstep bands, which
        // blended the whole cliff into a single wall with no visible
        // benches; fixed 2026-08-28 after the render probe screenshot
        // failed the terrain-relief eyeball check).
        // Zone edges are actual terrain z-units (the plane spans z in
        // about [-13, 13] for D=26 below) - NOT normalized fractions. The
        // first attempt used fraction-scale values (~0.1-0.6) which
        // squeezed all three ramps into a sliver near z=0, leaving the
        // rest of the plane as two giant flat blocks (looked like one
        // solid box, not a staircase); fixed 2026-08-28 after the render
        // probe screenshot failed the terrain-relief eyeball check.
        var NOTCH_HALF = 1.35, RAMP = 1.0;
        var Z_RAMP1 = -6, Z_RAMP2 = -1.5, Z_RAMP3 = 3;
        var Y_RIM = 3.1, Y_MIDBENCH = 0.4, Y_LOWERBENCH = -1.3, Y_VALLEY = -3.6;

        function inNotch(x) { return Math.abs(x) < NOTCH_HALF; }
        function channelEdge(x) { return inNotch(x) ? (1 - Math.abs(x) / NOTCH_HALF) : 0; }
        function height(x, z) {
            var n = fbm(x * 0.34 + 6, z * 0.34 + 6, 3) - 0.5;
            var edge = channelEdge(x);
            var domeH = Y_RIM + n * 0.15 - Math.abs(x) * 0.03 - edge * 0.35;
            var midBenchH = Y_MIDBENCH + n * 0.18 - edge * 0.5;
            var lowerBenchH = Y_LOWERBENCH + n * 0.16 - edge * 0.45;
            var valleyH = Y_VALLEY + n * 0.4 - edge * 0.9;
            var t1 = smooth(Z_RAMP1 - RAMP, Z_RAMP1 + RAMP, z);
            var t2 = smooth(Z_RAMP2 - RAMP, Z_RAMP2 + RAMP, z);
            var t3 = smooth(Z_RAMP3 - RAMP, Z_RAMP3 + RAMP, z);
            var h1 = domeH + (midBenchH - domeH) * t1;
            var h2 = h1 + (lowerBenchH - h1) * t2;
            var h3 = h2 + (valleyH - h2) * t3;
            return h3;
        }

        function colorAt(c, x, z) {
            var edge = channelEdge(x);
            if (z < Z_RAMP1 - RAMP) {
                // granite dome rim: pale rock with sparse pine cover
                c.setHex(edge > 0.4 ? 0x53694a : 0xa8a29a);
                return;
            }
            if (z > Z_RAMP3 + RAMP) {
                // valley floor: dense conifer forest with the creek/pool
                // where the falls lands
                var d = z - (Z_RAMP3 + RAMP);
                if (edge > 0.35 && d < 0.18) { c.setHex(0x36688a); return; } // plunge pool
                c.setHex(0x2e4a30); // forest floor
                return;
            }
            var onRamp = (Math.abs(z - Z_RAMP1) < RAMP) || (Math.abs(z - Z_RAMP2) < RAMP) || (Math.abs(z - Z_RAMP3) < RAMP);
            if (onRamp) {
                // sheer granite wall segment: wet dark rock in the notch,
                // dry pale granite elsewhere
                c.setHex(edge > 0.3 ? 0x4f544f : 0x9a958c);
                return;
            }
            // flat bench tread: slightly greener pale granite with a
            // narrow wet-rock streak in the notch
            c.setHex(edge > 0.3 ? 0x5f6a54 : 0xaba590);
        }

        var terrain = makeTerrain(18, 26, shell.low ? 130 : 180, shell.low ? 150 : 210, height, function (c, h, x, z) { colorAt(c, x, z); });
        scene.add(terrain);

        // Three-tier water column: three independent falling segments,
        // each with its own gradient cylinder stack, separated at the
        // two bench elevations. mist particle bursts sit at each break.
        var seg1Top = Y_RIM - 0.1, seg1Bot = Y_MIDBENCH + 0.05;
        var seg2Top = Y_MIDBENCH - 0.05, seg2Bot = Y_LOWERBENCH + 0.05;
        var seg3Top = Y_LOWERBENCH - 0.05, seg3Bot = Y_VALLEY + 0.3;

        function gradientColumn(y0, y1, z, r0, r1, hex0, hex1, segs) {
            var g = new THREE.Group();
            var c0 = new THREE.Color(hex0), c1 = new THREE.Color(hex1);
            for (var i = 0; i < segs; i++) {
                var f0 = i / segs, f1 = (i + 1) / segs;
                var segY0 = y0 + (y1 - y0) * f0, segY1 = y0 + (y1 - y0) * f1;
                var segR0 = r0 + (r1 - r0) * f0, segR1 = r0 + (r1 - r0) * f1;
                var col = c0.clone().lerp(c1, (f0 + f1) / 2);
                var geo = new THREE.CylinderGeometry(segR1, segR0, Math.abs(segY1 - segY0), 10, 1, true);
                var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, transparent: true, opacity: 0.88 }));
                mesh.position.set(0, (segY0 + segY1) / 2, z);
                g.add(mesh);
            }
            return g;
        }

        function mistBurst(y, z, spread, count) {
            var geo = new THREE.BufferGeometry();
            var arr = new Float32Array(count * 3);
            for (var i = 0; i < count; i++) {
                var ang = Math.random() * Math.PI * 2;
                var r = Math.random() * spread;
                arr[i * 3] = Math.cos(ang) * r;
                arr[i * 3 + 1] = y + (Math.random() - 0.5) * 0.15;
                arr[i * 3 + 2] = z + Math.sin(ang) * r * 0.5;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.14, transparent: true, opacity: 0.6, sizeAttenuation: true }));
        }

        var peakGroup = new THREE.Group();
        peakGroup.add(gradientColumn(seg1Top, seg1Bot, Z_RAMP1, 0.34, 0.28, 0x3a6ea5, 0xe8f0f5, 5));
        peakGroup.add(gradientColumn(seg2Top, seg2Bot, Z_RAMP2, 0.24, 0.2, 0xd9e8ef, 0xe8f0f5, 3));
        peakGroup.add(gradientColumn(seg3Top, seg3Bot, Z_RAMP3, 0.2, 0.16, 0xd9e8ef, 0xd0e2ea, 3));
        peakGroup.add(mistBurst(seg1Bot, Z_RAMP1, 0.55, shell.low ? 70 : 140));
        peakGroup.add(mistBurst(seg2Bot, Z_RAMP2, 0.42, shell.low ? 50 : 100));
        peakGroup.add(mistBurst(seg3Bot, Z_RAMP3, 0.4, shell.low ? 50 : 100));
        scene.add(peakGroup);

        // Late-summer trickle version: much thinner, lower-opacity threads
        // with no mist bursts - Yosemite Creek is snowmelt-fed and can run
        // nearly dry by August-September.
        var trickleGroup = new THREE.Group();
        trickleGroup.add(gradientColumn(seg1Top, seg1Bot, Z_RAMP1, 0.09, 0.07, 0x6a94bd, 0xdfe9ee, 4));
        trickleGroup.add(gradientColumn(seg2Top, seg2Bot, Z_RAMP2, 0.07, 0.06, 0xdfe9ee, 0xdfe9ee, 2));
        trickleGroup.add(gradientColumn(seg3Top, seg3Bot, Z_RAMP3, 0.06, 0.05, 0xdfe9ee, 0xd6e2e8, 2));
        trickleGroup.children.forEach(function (g) { g.children.forEach(function (m) { m.material.opacity = 0.55; }); });
        scene.add(trickleGroup);

        // Tier-boundary markers: three rings at the Upper Fall base, the
        // Middle Cascades base, and the Lower Fall base.
        var markerGroup = new THREE.Group();
        [[seg1Bot, Z_RAMP1, 0.5], [seg2Bot, Z_RAMP2, 0.4], [seg3Bot, Z_RAMP3, 0.35]].forEach(function (m) {
            var ring = new THREE.Mesh(new THREE.TorusGeometry(m[2], 0.035, 8, 36), new THREE.MeshStandardMaterial({ color: 0xffe08a }));
            ring.rotation.x = Math.PI / 2;
            ring.position.set(0, m[0], m[1]);
            markerGroup.add(ring);
        });
        scene.add(markerGroup);

        var peakFlow = true, markersOn = true;

        function panelHtml() {
            return '<h3>Yosemite Falls: North America\'s tallest waterfall</h3>' +
                '<p>Yosemite Creek drops down a sheer granite cliff in three tiers - Upper Yosemite Fall, the Middle Cascades, and Lower Yosemite Fall - for a combined total height that makes it the tallest waterfall in North America.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Total height (all three tiers)</td><td>about 739 m (2,425 ft)</td></tr>' +
                '<tr><td>Upper Yosemite Fall</td><td>about 436 m (1,430 ft) single drop</td></tr>' +
                '<tr><td>Middle Cascades</td><td>about 206 m (675 ft)</td></tr>' +
                '<tr><td>Lower Yosemite Fall</td><td>about 98 m (320 ft)</td></tr>' +
                '<tr><td>Source</td><td>Yosemite Creek (snowmelt-fed)</td></tr>' +
                '<tr><td>Location</td><td>Yosemite Valley, Yosemite National Park, California, USA</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the cliff shape, bench profile, and water columns are procedural teaching cues, not a survey-grade hydrological model.</p>';
        }

        function apply() {
            peakGroup.visible = peakFlow;
            trickleGroup.visible = !peakFlow;
            markerGroup.visible = markersOn;
            var fb = document.getElementById('t3dYosFlowBtn');
            if (fb) fb.textContent = 'Flow: ' + (peakFlow ? 'Peak snowmelt' : 'Late-summer trickle');
            var mb = document.getElementById('t3dYosMarkerBtn');
            if (mb) mb.textContent = 'Tier markers: ' + (markersOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ peakFlow: peakFlow, markersOn: markersOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.peakFlow === 'boolean') peakFlow = store.peakFlow;
        if (typeof store.markersOn === 'boolean') markersOn = store.markersOn;
        apply();

        var flowBtn = document.getElementById('t3dYosFlowBtn');
        if (flowBtn) flowBtn.addEventListener('click', function () { peakFlow = !peakFlow; apply(); });
        var markerBtn = document.getElementById('t3dYosMarkerBtn');
        if (markerBtn) markerBtn.addEventListener('click', function () { markersOn = !markersOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the seasonal flow or the tier-boundary markers.');
        return function animate(dt) {
            peakGroup.children.forEach(function (g) { if (g.rotation) g.rotation.y += dt * 0.00006; });
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesyosemitefalls: 't3dYosControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesyosemitefalls: { radius: 34, maxR: 70, minR: 10, phi: 1.05, theta: 1.3, targetY: -0.5 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

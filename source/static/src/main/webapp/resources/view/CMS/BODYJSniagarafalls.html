<script>
    // 3D scene archetype (niagara-falls) - vendored three.js (ESM,
    // dynamic import from /vendor/three/, NO CDN engine), fully client-side.
    // places-3d cluster, places-3d-discovery-loop-runbook, 2026-08-01.
    // DETAILED-TERRAIN migration 2026-08-30 (prompts/places-3d-detailed-terrain-runbook.md):
    // the procedural crestline scene below renders FIRST (unchanged, CDN-outage
    // fallback), then async fetches real Terrarium DEM elevation + Sentinel-2
    // true-color imagery from the ftol-vm-assets CDN, IndexedDB-caches it, and
    // swaps it in in-place once ready. A CDN failure or slow network leaves the
    // procedural scene on screen - it never blanks.
    //
    // EDUCATIONAL APPROXIMATION, not a survey-grade hydrological model.
    // Published figures (cross-checked 2026-08-01):
    //   - Combined average flow about 2,832 cubic meters per second
    //     (about 168,000 cubic meters per minute)
    //   - Horseshoe Falls carries about 90% of that flow, American Falls
    //     about 10% (Horseshoe has a longer curved crestline)
    //   - Horseshoe Falls height about 57 m (188 ft), crestline about 670 m
    //     (2,200 ft)
    //   - American Falls height about 21-34 m (70-110 ft, varies with the
    //     talus rock pile at its base), width about 320 m (1,060 ft)
    //   - Niagara Gorge runs about 11 km (7 mi) downstream to the Niagara
    //     Whirlpool, about 4.5 km (2.8 mi) below the falls, at a sharp bend
    //     in the river
    //   - Border of Ontario, Canada, and New York, USA
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'niagara-falls';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesniagarafalls'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    // ---- Real-terrain CDN + IndexedDB cache (mirrors BODYJSgrandcanyon.html /
    // BODYJSmountfuji.html's t3dPlaces* pattern) - heights.bin (Int16 LE
    // meters) + texture.jpg (Sentinel-2 true-color), sha256-verified, cached
    // once per manifest version.
    var T3D_PLACES_CDN = 'https://gh-static.freetool.online/places-3d';
    var T3D_PLACES_DB = 'ftol-places3d-assets';
    function t3dPlacesIdbOpen() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(T3D_PLACES_DB, 1);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('assets')) {
                    req.result.createObjectStore('assets', { keyPath: 'key' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        });
    }
    function t3dPlacesIdbGet(key) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readonly');
                var rq = tx.objectStore('assets').get(key);
                rq.onsuccess = function () { resolve(rq.result ? rq.result.blob : null); };
                rq.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }
    function t3dPlacesIdbPut(key, blob) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put({ key: key, blob: blob });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function () { resolve(false); };
            });
        }).catch(function () { return false; });
    }
    function t3dPlacesSha256Hex(buf) {
        return crypto.subtle.digest('SHA-256', buf).then(function (hash) {
            var b = new Uint8Array(hash), hex = '';
            for (var i = 0; i < b.length; i++) hex += b[i].toString(16).padStart(2, '0');
            return hex;
        });
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x9fc6d8, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        var key = new THREE.DirectionalLight(0xffffff, 1.0);
        key.position.set(-8, 18, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, metalness: 0 }));
        }

        // Lateral (x) zones across the crestline: Canadian bank, the curved
        // Horseshoe Falls (bows downstream in the middle - the signature
        // crescent shape), Goat Island (no drop), the straight American
        // Falls, then the US bank. Depth (z<0 upstream plateau, z>0
        // downstream gorge) drives the drop at each zone's own crest line.
        var X_HS0 = -11, X_HS1 = -3, X_GI1 = -0.6, X_AF1 = 3.6;
        var Y_TOP = 1.6, Y_BANK = 2.6, Y_GORGE = -3.0, WALL_BAND = 1.0;

        function zoneOf(x) {
            if (x < X_HS0) return 'bankL';
            if (x < X_HS1) return 'horseshoe';
            if (x < X_GI1) return 'island';
            if (x < X_AF1) return 'american';
            return 'bankR';
        }
        function crestZ(zone, x) {
            if (zone === 'horseshoe') {
                var u = Math.max(0, Math.min(1, (x - X_HS0) / (X_HS1 - X_HS0)));
                return 0.4 + 1.6 * Math.sin(Math.PI * u); // bows downstream mid-curve
            }
            return 0.4; // American Falls: straight crestline
        }
        function height(x, z) {
            var zone = zoneOf(x);
            var n = fbm(x * 0.3 + 5, z * 0.3 + 5, 3) - 0.5;
            if (zone === 'bankL' || zone === 'bankR') { return Y_BANK + n * 0.3; }
            if (zone === 'island') { return Y_TOP + 0.15 + n * 0.2; }
            var cz = crestZ(zone, x);
            var t = smooth(cz - WALL_BAND, cz + WALL_BAND, z); // 0 upstream, 1 in the gorge
            var upstreamH = Y_TOP + n * 0.15;
            var gorgeBase = Y_GORGE + Math.max(0, z - cz - WALL_BAND) * 0.12;
            var downstreamH = gorgeBase + n * 0.25;
            var h = upstreamH + (downstreamH - upstreamH) * t;
            if (t > 0.85 && t < 0.98) { h += (1 - Math.abs(t - 0.915) / 0.065) * 0.2; } // mist/foam lip at the brink
            return h;
        }

        var normColors = null, flowColors = null, terrain;
        function baseColor(c, zone, t) {
            if (zone === 'bankL' || zone === 'bankR') { c.setHex(0x6b8e5a); return; }
            if (zone === 'island') { c.setHex(0x7fae63); return; }
            if (t < 0.3) { c.setHex(0x3a6ea5); return; } // upstream river
            if (t < 0.75) { c.setHex(0xe8f0f5); return; } // whitewater/mist at the brink
            c.setHex(0x1c3d52); // gorge below
        }
        function colorAt(c, x, z, flowMode) {
            var zone = zoneOf(x);
            if (zone === 'bankL' || zone === 'bankR' || zone === 'island') { baseColor(c, zone, 0); return; }
            var cz = crestZ(zone, x);
            var t = smooth(cz - WALL_BAND, cz + WALL_BAND, z);
            baseColor(c, zone, t);
            if (flowMode && t > 0.75) {
                // Flow-split emphasis in the gorge only (keeps the upstream
                // river blue and the whitewater/mist band at the brink
                // visible): Horseshoe (about 90% of flow) tints toward a
                // deep saturated blue; American (about 10%) toward cyan.
                var tint = new THREE.Color(zone === 'horseshoe' ? 0x0d3f7a : 0x4fa8c9);
                c.lerp(tint, 0.65);
            }
        }
        function build(flowMode) {
            var pos = terrain.geometry.attributes.position, col = new THREE.Color();
            var arr = new Float32Array(pos.count * 3);
            for (var i = 0; i < pos.count; i++) {
                colorAt(col, pos.getX(i), pos.getZ(i), flowMode);
                arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b;
            }
            return arr;
        }
        terrain = makeTerrain(26, 26, shell.low ? 140 : 190, shell.low ? 140 : 190, height, function (c, h, x, z) { colorAt(c, x, z, false); });
        scene.add(terrain);
        normColors = terrain.geometry.attributes.color.array.slice();
        flowColors = build(true);

        // Whirlpool marker: about 4.5 km downstream in the real gorge, a
        // sharp bend where the river doubles back on itself - shown here as
        // a spiral ring in the gorge channel, compressed to scene scale.
        var whirlZ = 8.6, whirlY = height(0, whirlZ) + 0.25;
        var whirlGroup = new THREE.Group();
        var spiralPts = [];
        for (var si = 0; si <= 60; si++) {
            var a = si * 0.55, r = 0.15 + si * 0.028;
            spiralPts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
        }
        var spiralGeo = new THREE.BufferGeometry().setFromPoints(spiralPts);
        var spiral = new THREE.Line(spiralGeo, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
        whirlGroup.add(spiral);
        var whirlRing = new THREE.Mesh(new THREE.TorusGeometry(1.9, 0.06, 8, 40), new THREE.MeshStandardMaterial({ color: 0xffe08a }));
        whirlRing.rotation.x = Math.PI / 2;
        whirlGroup.add(whirlRing);
        whirlGroup.position.set(0, whirlY, whirlZ);
        scene.add(whirlGroup);

        var flowOn = true, whirlOn = true;

        // ---- Real-terrain progressive upgrade state (filled once loaded) ----
        var realMesh = null, realReady = false, realLoading = false;
        var realMat = null, realTex = null;
        var realNormCol = null, realFlowCol = null, realMinH = 0, realMaxH = 0;
        var realWhirlGroup = null;

        function panelHtml() {
            if (realReady) {
                return '<h3>Niagara Falls: real elevation' + (realTex ? ' + satellite imagery' : '') + '</h3>' +
                    '<p>This relief now shows the actual measured shape of the Niagara Escarpment: the plateau on both banks, the gorge the river has cut below the falls, and the real bend in the river at the Whirlpool downstream.</p>' +
                    '<table class="w3-table w3-bordered">' +
                    '<tr><td>Combined flow</td><td>about 2,832 m3/s (168,000 m3/min)</td></tr>' +
                    '<tr><td>Flow split</td><td>Horseshoe about 90%, American about 10%</td></tr>' +
                    '<tr><td>Horseshoe height</td><td>about 57 m (188 ft)</td></tr>' +
                    '<tr><td>American height</td><td>about 21-34 m (70-110 ft)</td></tr>' +
                    '<tr><td>Whirlpool</td><td>about 4.5 km (2.8 mi) downstream</td></tr>' +
                    '<tr><td>Location</td><td>Ontario, Canada / New York, USA border</td></tr>' +
                    '</table>' +
                    '<p class="t3d-note">Terrain: Mapzen/AWS Open Data terrain tiles (NASA/USGS DEMs). Imagery: contains modified Copernicus Sentinel data 2026. Relief is shown at true 1:1 scale relative to the mapped width - no vertical exaggeration. Educational approximation - the whirlpool marker and flow-split tinting are teaching cues layered on the real relief, not a survey-grade hydrological model.</p>';
            }
            return '<h3>Niagara Falls: two falls, one crestline</h3>' +
                '<p>A view of the shared crestline: the curved Horseshoe Falls, Goat Island splitting the flow, and the straighter American Falls, dropping into the gorge below.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Combined flow</td><td>about 2,832 m3/s (168,000 m3/min)</td></tr>' +
                '<tr><td>Flow split</td><td>Horseshoe about 90%, American about 10%</td></tr>' +
                '<tr><td>Horseshoe height</td><td>about 57 m (188 ft)</td></tr>' +
                '<tr><td>American height</td><td>about 21-34 m (70-110 ft)</td></tr>' +
                '<tr><td>Whirlpool</td><td>about 4.5 km (2.8 mi) downstream</td></tr>' +
                '<tr><td>Location</td><td>Ontario, Canada / New York, USA border</td></tr>' +
                '</table>' +
                '<p class="t3d-note">' + (realLoading
                    ? 'Loading real elevation and satellite imagery now (one time, then cached) - this procedural crestline is a teaching placeholder while it downloads.'
                    : 'Educational relief approximation - the crestline curve, gorge profile, and whirlpool placement are procedural teaching cues, not a survey-grade hydrological model.') + '</p>';
        }

        function apply() {
            if (realReady && realMesh) {
                realMesh.geometry.attributes.color.array.set(flowOn ? realFlowCol : realNormCol);
                // With real imagery loaded the two views are mutually exclusive:
                // multiplying vertex colors into the texture is what produces
                // black terrain (2026-08-29 defect fix - see mount-fuji/mount-everest).
                if (realMat && realTex) {
                    realMat.map = flowOn ? null : realTex;
                    realMat.vertexColors = !!flowOn;
                    realMat.needsUpdate = true;
                }
                realMesh.geometry.attributes.color.needsUpdate = true;
                if (realWhirlGroup) realWhirlGroup.visible = whirlOn;
            } else {
                terrain.geometry.attributes.color.array.set(flowOn ? flowColors : normColors);
                terrain.geometry.attributes.color.needsUpdate = true;
                whirlGroup.visible = whirlOn;
            }
            var fb = document.getElementById('t3dNiaFlowBtn');
            if (fb) fb.textContent = (realReady && realTex)
                ? ('View: ' + (flowOn ? 'Flow-split colors' : 'Satellite view'))
                : ('Flow split: ' + (flowOn ? 'On' : 'Off'));
            var wb = document.getElementById('t3dNiaWhirlBtn');
            if (wb) wb.textContent = 'Whirlpool marker: ' + (whirlOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ flowOn: flowOn, whirlOn: whirlOn }); } catch (e) {}
        }

        // Decimate a row-major Int16 grid to at most maxDim x maxDim cells,
        // keeping the MAX value per cell (per the runbook: preserve sharp
        // features like the falls brink, never average them away).
        function decimateMax(view, w, h, maxDim) {
            var stepX = Math.max(1, Math.ceil(w / maxDim));
            var stepZ = Math.max(1, Math.ceil(h / maxDim));
            var ow = Math.floor((w - 1) / stepX) + 1;
            var oh = Math.floor((h - 1) / stepZ) + 1;
            var out = new Int16Array(ow * oh);
            for (var oz = 0; oz < oh; oz++) {
                var z0 = oz * stepZ;
                for (var ox = 0; ox < ow; ox++) {
                    var x0 = ox * stepX, best = -32768;
                    for (var dz2 = 0; dz2 < stepZ && z0 + dz2 < h; dz2++) {
                        var rowBase = (z0 + dz2) * w;
                        for (var dx = 0; dx < stepX && x0 + dx < w; dx++) {
                            var v = view[rowBase + x0 + dx];
                            if (v > best) best = v;
                        }
                    }
                    out[oz * ow + ox] = best;
                }
            }
            return { data: out, w: ow, h: oh };
        }

        // Real-world fractional position of the Niagara Whirlpool (0..1 across
        // the DEM window, west-to-east / north-to-south) and of the Goat Island
        // longitude that separates the two cataracts - precomputed offline from
        // this asset's own bbox/mercator window (ftol-vm-assets/places-3d/out/
        // niagara-falls/fractions_niagara.mjs), not guessed at runtime.
        var WHIRL_FX = 0.507, WHIRL_FZ = 0.576;
        var GOAT_ISLAND_FX = 0.42;
        var FALLS_FZ_MIN = 0.74, FALLS_FZ_MAX = 0.94;
        var GORGE_MAX_M = 115; // real elevation below this = river/gorge channel, not plateau

        function buildRealMesh(view, grid, texBlob) {
            var dec = decimateMax(view, grid.width_px, grid.height_px, 220);
            // Aspect-correct footprint: this window is not square (elongated
            // north-south to cover the falls + gorge down to the Whirlpool and
            // the Queenston/Lewiston escarpment mouth), so size D to the taller
            // (north-south) axis and derive W from the real pixel aspect ratio.
            var D = 20, W = D * (grid.width_px / grid.height_px);
            var geo2 = new THREE.PlaneGeometry(W, D, dec.w - 1, dec.h - 1);
            geo2.rotateX(-Math.PI / 2);
            // Isotropic meters -> scene-unit scale so relief keeps TRUE 1:1
            // vertical proportion relative to the mapped extent (no exaggeration).
            var vertScale = D / (grid.height_px * grid.meters_per_px);
            var minH = grid.min_h_m, maxH = grid.max_h_m;
            var pos2 = geo2.attributes.position;
            var normCol = new Float32Array(pos2.count * 3);
            var flowCol = new Float32Array(pos2.count * 3);
            var c = new THREE.Color(), band = new THREE.Color();
            var colPlateauLow = new THREE.Color(0x6b8e5a), colPlateauHigh = new THREE.Color(0x8a7256);
            var colGorge = new THREE.Color(0x2a5a78);
            var tintHorseshoe = new THREE.Color(0x0d3f7a), tintAmerican = new THREE.Color(0x4fa8c9);
            for (var i = 0; i < pos2.count; i++) {
                var ix = i % dec.w, iz = Math.floor(i / dec.w);
                var hRaw = dec.data[iz * dec.w + ix];
                pos2.setY(i, (hRaw - minH) * vertScale);
                var fx = ix / (dec.w - 1), fz = iz / (dec.h - 1);
                var isGorge = hRaw < GORGE_MAX_M;
                if (isGorge) { band.copy(colGorge); }
                else {
                    var t = Math.max(0, Math.min(1, (hRaw - GORGE_MAX_M) / Math.max(1, maxH - GORGE_MAX_M)));
                    band.copy(colPlateauLow).lerp(colPlateauHigh, t);
                }
                normCol[i * 3] = band.r; normCol[i * 3 + 1] = band.g; normCol[i * 3 + 2] = band.b;
                if (isGorge && fz >= FALLS_FZ_MIN && fz <= FALLS_FZ_MAX) {
                    c.copy(colGorge).lerp(fx < GOAT_ISLAND_FX ? tintHorseshoe : tintAmerican, 0.75);
                } else { c.copy(band); }
                flowCol[i * 3] = c.r; flowCol[i * 3 + 1] = c.g; flowCol[i * 3 + 2] = c.b;
            }
            geo2.setAttribute('color', new THREE.BufferAttribute(flowOn ? flowCol : normCol, 3));
            geo2.computeVertexNormals();
            var mat2 = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0 });
            var mesh2 = new THREE.Mesh(geo2, mat2);
            scene.add(mesh2);
            terrain.visible = false;
            whirlGroup.visible = false;
            realMat = mat2;
            realMesh = mesh2; realNormCol = normCol; realFlowCol = flowCol;
            realMinH = minH; realMaxH = maxH;

            // Real whirlpool marker: same spiral+ring visual as the procedural
            // scene, repositioned to the Whirlpool's real-world location and
            // scaled to this mesh's footprint (never rebuilt per click).
            var markerScale = D / 26;
            var wix = Math.round(WHIRL_FX * (dec.w - 1)), wiz = Math.round(WHIRL_FZ * (dec.h - 1));
            var wH = dec.data[Math.max(0, Math.min(dec.h - 1, wiz)) * dec.w + Math.max(0, Math.min(dec.w - 1, wix))];
            var worldX = (WHIRL_FX - 0.5) * W, worldZ = (WHIRL_FZ - 0.5) * D;
            var worldY = (wH - minH) * vertScale + 0.25 * markerScale;
            var wg = new THREE.Group();
            var spiralPts = [];
            for (var si = 0; si <= 60; si++) {
                var a = si * 0.55, r = (0.15 + si * 0.028) * markerScale;
                spiralPts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
            }
            var spiralGeo = new THREE.BufferGeometry().setFromPoints(spiralPts);
            wg.add(new THREE.Line(spiralGeo, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 })));
            var ring = new THREE.Mesh(new THREE.TorusGeometry(1.9 * markerScale, 0.06 * markerScale, 8, 40), new THREE.MeshStandardMaterial({ color: 0xffe08a }));
            ring.rotation.x = Math.PI / 2;
            wg.add(ring);
            wg.position.set(worldX, worldY, worldZ);
            scene.add(wg);
            realWhirlGroup = wg;

            realLoading = false; realReady = true;
            apply();
            t3dStatus('Real terrain loaded (Terrarium DEM + Sentinel-2 imagery). Drag to orbit, scroll to zoom.');
            if (texBlob) {
                var url = URL.createObjectURL(texBlob);
                new THREE.TextureLoader().load(url, function (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    mat2.map = tex;
                    mat2.vertexColors = false;
                    mat2.color.setScalar(1);
                    realTex = tex;
                    mat2.needsUpdate = true;
                    apply();
                    URL.revokeObjectURL(url);
                }, undefined, function () { URL.revokeObjectURL(url); });
            }
        }

        function fetchPlacesAsset(file, mimeType, verKey) {
            var key = verKey + ':' + file.file;
            return t3dPlacesIdbGet(key).then(function (cached) {
                if (cached) return cached;
                return fetch(T3D_PLACES_CDN + '/' + file.file).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + file.file);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    return t3dPlacesSha256Hex(buf).then(function (hex) {
                        if (file.sha256 && hex !== file.sha256) { throw new Error('sha256 mismatch on ' + file.file); }
                        var blob = new Blob([buf], { type: mimeType });
                        t3dPlacesIdbPut(key, blob);
                        return blob;
                    });
                });
            });
        }

        function loadRealTerrain() {
            realLoading = true;
            apply();
            fetch(T3D_PLACES_CDN + '/manifest.json').then(function (r) { return r.json(); })
                .then(function (manifest) {
                    var asset = manifest && manifest.assets && manifest.assets['niagara-falls'];
                    if (!asset) throw new Error('manifest missing the niagara-falls asset');
                    var heightsFile = null, texFile = null;
                    (asset.files || []).forEach(function (f) {
                        if (f.role === 'heightfield') heightsFile = f;
                        if (f.role === 'satellite-texture') texFile = f;
                    });
                    if (!heightsFile) throw new Error('manifest missing the heightfield file');
                    var verKey = 'niagara-falls@' + manifest.version;
                    var jobs = [fetchPlacesAsset(heightsFile, 'application/octet-stream', verKey)];
                    if (texFile) jobs.push(fetchPlacesAsset(texFile, 'image/jpeg', verKey));
                    return Promise.all(jobs).then(function (blobs) {
                        return blobs[0].arrayBuffer().then(function (buf) {
                            buildRealMesh(new Int16Array(buf), asset.grid, blobs[1] || null);
                        });
                    });
                })
                .catch(function (err) {
                    realLoading = false;
                    apply();
                    t3dStatus('Could not load real terrain data (' + (err && err.message ? err.message : err) + ') - showing the procedural crestline instead.');
                });
        }

        var store = t3dLoadStore();
        if (typeof store.flowOn === 'boolean') flowOn = store.flowOn;
        if (typeof store.whirlOn === 'boolean') whirlOn = store.whirlOn;
        apply();

        var flowBtn = document.getElementById('t3dNiaFlowBtn');
        if (flowBtn) flowBtn.addEventListener('click', function () { flowOn = !flowOn; apply(); });
        var whirlBtn = document.getElementById('t3dNiaWhirlBtn');
        if (whirlBtn) whirlBtn.addEventListener('click', function () { whirlOn = !whirlOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the flow split or the whirlpool marker.');
        if ('requestIdleCallback' in window) { requestIdleCallback(loadRealTerrain, { timeout: 4000 }); }
        else { setTimeout(loadRealTerrain, 800); }
        return function animate(dt) {
            whirlGroup.rotation.y += dt * 0.0006;
            if (realWhirlGroup) realWhirlGroup.rotation.y += dt * 0.0006;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesniagarafalls: 't3dNiaControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesniagarafalls: { radius: 32, maxR: 60, minR: 8, phi: 0.78, theta: 0.35, targetY: -0.8 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

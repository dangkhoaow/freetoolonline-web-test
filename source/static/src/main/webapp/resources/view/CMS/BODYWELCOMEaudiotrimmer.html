<time itemprop="dateUpdated" datetime="2026-07-05T00:00:00"><b>Last reviewed: 2026-07-05</b></time>

<p>Trim a audio to the time range you need, right in the browser.</p>
<p>Trimming does not re-encode - the original quality and format are kept.</p>
<p>The file is processed in this browser tab and is never uploaded to a server.</p>

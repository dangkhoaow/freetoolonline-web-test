<script>
    // 3D scene archetype skeleton (tibetan-plateau) - vendored three.js
    // High-altitude plateau terrain: rolling subtle relief on a 4,500m+ floor,
    // sparse vegetation patches, rim peaks at edges. Educational approximation.
    // Published figures (encyclopedic consensus, cross-checked 2026-07-31):
    //   - Average elevation about 5,000 m (5,492 m per Chinese surveys)
    //   - Area about 2.5 million sq km across China, Tibet, Bhutan, Nepal, India
    //   - Called "Roof of the World" - third-largest elevated plateau (after Antarctic, Greenland ice sheets)
    //   - Southern rim: Mount Everest (8,849 m), Kanchenjunga, Himalayan chain
    //   - Northern rim: Kunlun Mountains
    //   - Atmosphere about 40-50% of sea-level pressure
    //   - Sparse alpine tundra vegetation (sedges, mosses)
    //   - Multiple river sources: Yangtze, Yellow River, Brahmaputra, Salween, Mekong

    web.localUpload = false;

    var T3D_SLUG = 'tibetan-plateau';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placestibetalplateau'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x1a2844, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xfff5e1, 1.0);
        key.position.set(12, 18, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0 }));
        }

        // High-altitude plateau: 1 unit = ~200 m vertical
        // Floor at y = 22.5 (representing ~4,500 m average elevation)
        var FLOOR = 22.5, SUBTLE_ROLL = 0.4;
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }

        // Rim peaks: low Worley pillars at edges
        function rimPeaks(x, z, dist) {
            var edge = Math.min(Math.abs(x) / 7, Math.abs(z) / 10);
            var nearEdge = 1 - Math.pow(Math.max(0, 1 - edge * 1.3), 2);
            return nearEdge * 2.0 * (1 + 0.5 * fbm(x * 0.3, z * 0.3, 3));
        }

        function height(x, z) {
            var base = FLOOR;
            // Subtle rolling: low-amplitude fbm
            var roll = SUBTLE_ROLL * fbm(x * 0.4 + 100, z * 0.4 + 200, 3);
            var h = base + roll;
            // Rim peaks higher
            h += rimPeaks(x, z, 0);
            return h;
        }

        var col = { tundra: new THREE.Color(0x8b9d6b), rock: new THREE.Color(0x7a7d82), snow: new THREE.Color(0xe8e8f0) };
        function color(c, h, x, z) {
            var noise = 0.85 + 0.2 * fbm(x * 1.2 + 11, z * 1.2 + 7, 3);
            // Sparse vegetation tundra at lower elevations
            if (h > FLOOR - 0.1 && h < FLOOR + 1.0) {
                c.copy(col.tundra).multiplyScalar(noise);
            }
            // Higher rocky areas
            else if (h < FLOOR + 2.0) {
                c.copy(col.rock).lerp(col.tundra, 0.3).multiplyScalar(noise);
            }
            // Rim peaks with some snow patches
            else {
                c.copy(col.snow).multiplyScalar(0.9 + 0.15 * noise);
            }
        }

        var terrain = makeTerrain(28, 40, shell.low ? 80 : 140, shell.low ? 120 : 200, height, color);
        scene.add(terrain);

        // Sparse vegetation patches (small green cones scattered on the plateau)
        var vegGroup = new THREE.Group();
        for (var vi = 0; vi < (shell.low ? 12 : 20); vi++) {
            var vx = -12 + Math.random() * 24;
            var vz = -18 + Math.random() * 36;
            var vh = height(vx, vz) + 0.15;
            var veg = new THREE.Mesh(
                new THREE.ConeGeometry(0.25, 0.6, 8),
                new THREE.MeshStandardMaterial({ color: 0x6b8e4e, roughness: 0.8 })
            );
            veg.position.set(vx, vh, vz);
            vegGroup.add(veg);
        }
        scene.add(vegGroup);

        // Rim peaks silhouette cones (low-poly, distinct from vegetation)
        var rimGroup = new THREE.Group();
        var rimPts = [[−10, −15], [5, −18], [10, 8], [−8, 15], [12, 10]];
        for (var ri = 0; ri < rimPts.length; ri++) {
            var rx = rimPts[ri][0], rz = rimPts[ri][1];
            var rh = height(rx, rz) + 1.5;
            var rim = new THREE.Mesh(
                new THREE.ConeGeometry(0.8, 2.2, 12),
                new THREE.MeshStandardMaterial({ color: 0x5a6370, roughness: 0.9 })
            );
            rim.position.set(rx, rh, rz);
            rimGroup.add(rim);
        }
        scene.add(rimGroup);

        // Atmospheric haze plane at the horizon
        var haze = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 60),
            new THREE.MeshBasicMaterial({ color: 0x9ab3d4, transparent: true, opacity: 0.25, depthWrite: false, side: THREE.DoubleSide })
        );
        haze.rotation.x = -Math.PI / 2;
        haze.position.y = FLOOR + 3.5;
        scene.add(haze);

        var vegOn = true, rimOn = true;

        function panelHtml() {
            return '<h3>Tibetan Plateau: the Roof of the World</h3>' +
                '<p>A vast high-altitude plateau averaging over 5,000 meters, with sparse tundra vegetation at lower elevations and rim peaks rising from Kunlun (north) and Himalayan (south) mountain chains.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Average elevation</td><td>about 5,000 m (5,492 m per Chinese surveys) - the third-largest elevated plateau</td></tr>' +
                '<tr><td>Area</td><td>about 2.5 million sq km across China, Tibet, Bhutan, Nepal, and India</td></tr>' +
                '<tr><td>Name</td><td>"Roof of the World" - the highest major plateau</td></tr>' +
                '<tr><td>Southern rim</td><td>Mount Everest (8,849 m), Kanchenjunga, and the Himalayan chain</td></tr>' +
                '<tr><td>Northern rim</td><td>Kunlun Mountains and Tian Shan ranges</td></tr>' +
                '<tr><td>Atmosphere</td><td>about 40-50% of sea-level pressure - thin air, extreme conditions</td></tr>' +
                '<tr><td>Vegetation</td><td>sparse alpine tundra - sedges, mosses, hardy shrubs adapted to extreme altitude</td></tr>' +
                '<tr><td>Rivers</td><td>source region for major Asian rivers: Yangtze, Yellow, Brahmaputra, Salween, Mekong</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the plateau surface, vegetation scatter, and rim peak positions are schematic teaching cues, not survey data.</p>';
        }

        function apply() {
            vegGroup.visible = vegOn;
            rimGroup.visible = rimOn;
            var vb = document.getElementById('t3dPtpVegBtn');
            if (vb) vb.textContent = 'Vegetation: ' + (vegOn ? 'On' : 'Off');
            var rb = document.getElementById('t3dPtpRimBtn');
            if (rb) rb.textContent = 'Rim peaks: ' + (rimOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ vegOn: vegOn, rimOn: rimOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.vegOn === 'boolean') vegOn = store.vegOn;
        if (typeof store.rimOn === 'boolean') rimOn = store.rimOn;
        apply();

        var vegBtn = document.getElementById('t3dPtpVegBtn');
        if (vegBtn) vegBtn.addEventListener('click', function () { vegOn = !vegOn; apply(); });
        var rimBtn = document.getElementById('t3dPtpRimBtn');
        if (rimBtn) rimBtn.addEventListener('click', function () { rimOn = !rimOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle vegetation and rim peaks.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00003;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placestibetalplateau: 't3dPtpControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placestibetalplateau: { radius: 28, maxR: 70, minR: 10, phi: 0.75, theta: 0.4, targetY: 23 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

<div class="w3-container">
    <p>The VIN mode decodes the year, make, and model with the official NHTSA vPIC service first, then pulls the matching recall campaigns; the vehicle mode offers a model-year dropdown plus make and model suggestion lists.</p>
</div>

<div id="vehicleRecallTool" class="w3-container outputImgs" style="visibility:visible !important; min-height:200px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>
    <div class="w3-row" style="margin-bottom:10px;">
        <button type="button" id="vrModeVehicle" class="w3-button w3-blue">By year, make &amp; model</button>
        <button type="button" id="vrModeVin" class="w3-button w3-light-grey">By VIN</button>
    </div>
    <div id="vrVehiclePanel" class="w3-row" style="margin-bottom:10px;">
        <select id="vrYearSelect" class="w3-select w3-border" style="display:inline-block;width:110px;" aria-label="Model year"></select>
        <input id="vrMakeInput" list="vrMakeList" class="w3-input w3-border" style="display:inline-block;width:180px;" placeholder="Make (e.g. Toyota)" aria-label="Make">
        <datalist id="vrMakeList"></datalist>
        <input id="vrModelInput" list="vrModelList" class="w3-input w3-border" style="display:inline-block;width:180px;" placeholder="Model (e.g. Camry)" aria-label="Model">
        <datalist id="vrModelList"></datalist>
        <button type="button" id="vrLookupBtn" class="w3-button w3-red">Look up recalls</button>
    </div>
    <div id="vrVinPanel" class="w3-row" style="display:none;margin-bottom:10px;">
        <input id="vrVinInput" class="w3-input w3-border" style="display:inline-block;width:260px;text-transform:uppercase;" maxlength="17" placeholder="17-character VIN" aria-label="Vehicle identification number">
        <button type="button" id="vrVinBtn" class="w3-button w3-red">Decode VIN &amp; check recalls</button>
        <div id="vrVinDecoded" style="margin-top:6px;color:#555;"></div>
    </div>
    <div id="vrStatus" aria-live="polite" style="min-height:1.2em;color:#555;"></div>
    <div id="vrResults"></div>
    <div style="margin-top:16px;">
        <div style="font-weight:bold;">Recall severity flags (NHTSA)</div>
        <div id="vrExplainer"></div>
    </div>
</div>

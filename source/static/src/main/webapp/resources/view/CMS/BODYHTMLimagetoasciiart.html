<div class="w3-container">
    <p>Upload your IMAGE file, pick the output option, and download the ASCII ART result.</p>
</div>

<style>
    #imageToAsciiTool .i2a-row { margin-bottom: 12px; }
    #imageToAsciiTool .i2a-controls {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: center; margin: 12px 0;
    }
    #imageToAsciiTool .i2a-field { display: flex; flex-direction: column; min-width: 130px; }
    #imageToAsciiTool .i2a-field label { font-size: 0.85em; margin-bottom: 4px; }
    #imageToAsciiTool pre#i2aOut {
        display: block; max-width: 100%; overflow-x: auto; margin: 12px auto;
        border: 1px solid #ccc; padding: 8px; text-align: left;
        font-family: "Courier New", Courier, monospace; white-space: pre;
        min-height: 80px;
    }
    #imageToAsciiTool .i2a-status {
        font-family: monospace; min-height: 1.4em; margin-top: 8px; text-align: center;
    }
</style>

<div id="imageToAsciiTool" class="w3-container outputImgs" style="text-align:center; visibility:visible !important; min-height:220px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>
    <div class="i2a-row">
        <label class="w3-label" for="i2aFile"><b>Source image</b></label>
        <input type="file" id="i2aFile" accept="image/*" class="w3-input w3-border" style="max-width:420px;margin:0 auto;">
    </div>
    <div class="i2a-controls">
        <div class="i2a-field">
            <label for="i2aMode">Output mode</label>
            <select id="i2aMode" class="w3-select w3-border">
                <option value="mono" selected>Plain text (copyable)</option>
                <option value="color">Colored HTML</option>
            </select>
        </div>
        <div class="i2a-field">
            <label for="i2aCols">Width (columns)</label>
            <select id="i2aCols" class="w3-select w3-border">
                <option value="40">40 columns</option>
                <option value="80" selected>80 columns</option>
                <option value="120">120 columns</option>
                <option value="240">240 columns</option>
            </select>
        </div>
        <div class="i2a-field">
            <label for="i2aPalette">Character palette</label>
            <select id="i2aPalette" class="w3-select w3-border">
                <option value="dense" selected>Dense (@%#*+=-:. )</option>
                <option value="light">Light (@8&amp;%#*+,.- )</option>
                <option value="numeric">Numeric (0123456789.)</option>
                <option value="blocks">Unicode blocks</option>
            </select>
        </div>
        <div class="i2a-field">
            <label for="i2aInvert">Invert (terminal style)</label>
            <input type="checkbox" id="i2aInvert">
        </div>
    </div>
    <pre id="i2aOut" aria-live="polite"></pre>
    <div class="i2a-row">
        <button id="i2aCopy" class="w3-button w3-blue-grey">Copy text</button>
        <button id="i2aDownloadTxt" class="w3-button w3-green">Download .txt</button>
        <button id="i2aDownloadPng" class="w3-button w3-green">Download PNG</button>
    </div>
    <p id="i2aStatus" class="i2a-status" aria-live="polite">Choose an image to turn it into ASCII art. Everything runs in this tab - nothing is uploaded.</p>
</div>

<script>
    // Neon Crime City launcher. The full game runs on a dedicated host that
    // serves the WebAssembly build plus /vcsky + /vcbr asset routes (FastAPI
    // or PHP as documented in reVCDOS). The game is loaded on demand inside an
    // isolated iframe so the page stays light until Play is pressed.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var NCC_DEFAULT_URL = (typeof BASE_PATH === 'string' && BASE_PATH ? BASE_PATH : '') + '/revcdos/';
    var NCC_GAME_URL = '';

    function nccLog(label, payload) {
        if (typeof console === 'undefined' || !console.log) return;
        if (payload !== undefined) { console.log('[ncc]', label, payload); }
        else { console.log('[ncc]', label); }
    }

    function nccStatus(text) {
        var el = document.getElementById('nccStatus');
        if (el) { el.textContent = text; }
        nccLog('status', text);
    }

    function nccResolveGameUrl(stage) {
        var attr = '';
        if (stage && stage.getAttribute) { attr = (stage.getAttribute('data-game-url') || '').trim(); }
        var override = '';
        if (typeof window !== 'undefined' && typeof window.NCC_GAME_URL === 'string') {
            override = window.NCC_GAME_URL.trim();
        }
        NCC_GAME_URL = override || attr || NCC_DEFAULT_URL;
        nccLog('game url resolved', { url: NCC_GAME_URL, override: override || null, attribute: attr || null });
        return NCC_GAME_URL;
    }

    function nccInjectFrame(stage) {
        var url = NCC_GAME_URL || NCC_DEFAULT_URL;
        nccLog('injecting frame', { url: url });
        var frame = document.createElement('iframe');
        frame.id = 'nccFrame';
        frame.src = url;
        frame.title = 'Neon Crime City game';
        frame.setAttribute('allow', 'fullscreen; gamepad; autoplay');
        frame.setAttribute('allowfullscreen', '');
        frame.addEventListener('load', function () {
            nccStatus('Game loaded. Use the in-game menu to start a new session; ESC opens options.');
            nccLog('frame loaded');
            try { frame.contentWindow.focus(); } catch (e) { nccLog('frame focus failed', e); }
        });
        var launch = document.getElementById('nccLaunch');
        if (launch && launch.parentNode === stage) {
            stage.removeChild(launch);
            nccLog('launch overlay removed');
        }
        stage.appendChild(frame);
        nccLog('frame appended');
        return frame;
    }

    function doAfterPageRendered() {
        var stage = document.getElementById('nccStage');
        var playBtn = document.getElementById('nccPlayBtn');
        if (!stage || !playBtn) return; // not this page

        nccResolveGameUrl(stage);

        var fsBtn = document.getElementById('nccFullscreenBtn');
        nccLog('page ready', { fullscreen: !!fsBtn });

        playBtn.addEventListener('click', function () {
            nccStatus('Loading the game (this can take a moment on first run)...');
            nccLog('play clicked');
            nccInjectFrame(stage);
            if (fsBtn) {
                fsBtn.disabled = false;
                nccLog('fullscreen enabled');
            }
        });

        if (fsBtn) {
            fsBtn.addEventListener('click', function () {
                nccLog('fullscreen requested');
                if (stage.requestFullscreen) { stage.requestFullscreen(); }
                else if (stage.webkitRequestFullscreen) { stage.webkitRequestFullscreen(); }
                var frame = document.getElementById('nccFrame');
                if (frame) { try { frame.contentWindow.focus(); } catch (e) { nccLog('frame focus failed', e); } }
            });
        }
    }
</script>

<div class="w3-container step1">
    <div class="w3-row w3-margin-bottom">
        <label class="w3-text-grey w3-small" for="mtgInput"><b>Paste your rows (CSV, TSV, or pipe-delimited)</b></label>
        <textarea id="mtgInput" class="w3-input w3-border w3-round" spellcheck="false" style="min-height:150px;font-family:monospace" placeholder="Name,Age,City
Alice,30,London
Bob,25,New York">Name,Age,City
Alice,30,London
Bob,25,New York</textarea>
    </div>
    <div class="w3-row w3-margin-bottom">
        <div class="w3-col m6" style="padding-right:8px">
            <label class="w3-text-grey w3-small" for="mtgAlign"><b>Column alignment</b></label>
            <select id="mtgAlign" class="w3-input w3-border w3-round">
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
            </select>
        </div>
        <div class="w3-col m6" style="padding-top:22px">
            <input id="mtgHeader" class="w3-check" type="checkbox" checked>
            <label for="mtgHeader"><b>First row is the header</b></label>
        </div>
    </div>
    <button id="generateBtn" class="w3-button w3-green w3-round">Generate Markdown Table</button>
</div>

<div class="w3-container" style="margin-top:12px">
    <div class="outputImgs"></div>
</div>

<div class="w3-container w3-padding-small" style="margin-top:8px">
    <p>The delimiter is auto-detected from your first row - a tab, a pipe, or a comma. Literal pipe characters inside a cell are escaped so they do not break the table. Everything runs in your browser; nothing is uploaded.</p>
</div>

<script>
    // 3D scene archetype skeleton (dong-van-plateau) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (dong-van-plateau). All geometry is procedural. places-3d cluster.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus, preserved from the original
    // scene):
    //   - Dong Van Karst Plateau, Ha Giang Province, northern Vietnam
    //   - UNESCO Global Geopark since 2010 (Vietnam's first)
    //   - Area about 2,432 sq km; elevation 800 - 1,600 m above sea level
    //   - Oldest limestone about 500 million years old (Ordovician)
    //   - Paleozoic karst limestone formations, tropical stone landscape
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'dong-van-plateau';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 50, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        // Preserve the status overlay that lives inside the host, then let the
        // shell own the canvas (create its own, replacing any placeholder).
        var statusEl = document.getElementById('t3dStatus');
        var keepStatus = statusEl && host.contains(statusEl);
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        renderer.domElement.style.display = 'block';
        renderer.domElement.style.width = '100%';
        if (keepStatus) { host.appendChild(statusEl); }
        function resize() {
            var w = host.clientWidth || 320, h = host.clientHeight || Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        scene.background = new THREE.Color(0x1a1a1e);

        // Lighting (preserved from the original scene)
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(30, 50, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.far = 200;
        scene.add(directionalLight);

        // Terrain - Worley-based karst pillars (similar to Stone Forest)
        var CELL = 2.0, PRESENCE = 0.68, REACH = 2.8;
        var terrainGeom = new THREE.BufferGeometry();
        var gridSize = 60, segSize = gridSize / 12;
        var vertices = [], indices = [];
        for (var z = 0; z <= gridSize; z += segSize) {
            for (var x = 0; x <= gridSize; x += segSize) {
                var cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
                var height = 0;
                for (var dz = -2; dz <= 2; dz++) {
                    for (var dx = -2; dx <= 2; dx++) {
                        var hash = Math.sin((cx + dx) * 73.1 + (cz + dz) * 157.3) * 43758.5453;
                        if (hash - Math.floor(hash) < PRESENCE) {
                            var px = (cx + dx) * CELL + Math.sin(hash * 7.3) * 0.3 * CELL;
                            var pz = (cz + dz) * CELL + Math.cos(hash * 11.2) * 0.3 * CELL;
                            var dist = Math.sqrt((x - px) * (x - px) + (z - pz) * (z - pz));
                            if (dist < REACH) {
                                var rnd = Math.sin((cx + dx) * 97 + (cz + dz) * 193) * 43758.5453;
                                var h = 18 * (1 - dist / REACH) * (0.7 + 0.3 * rnd);
                                height = Math.max(height, h);
                            }
                        }
                    }
                }
                vertices.push(x - gridSize / 2, height, z - gridSize / 2);
            }
        }
        for (var zi = 0; zi < gridSize / segSize; zi++) {
            for (var xi = 0; xi < gridSize / segSize; xi++) {
                var a = zi * (gridSize / segSize + 1) + xi;
                var b = a + 1, c = a + (gridSize / segSize + 1), d = c + 1;
                indices.push(a, c, b, b, c, d);
            }
        }
        terrainGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
        terrainGeom.setIndex(new THREE.BufferAttribute(new Uint32Array(indices), 1));
        terrainGeom.computeVertexNormals();

        // Color buffers for the geological visualization toggles
        var vertexCount = vertices.length / 3;
        var colorArray1 = new Float32Array(vertexCount * 3);
        var colorArray2 = new Float32Array(vertexCount * 3);
        for (var i = 0; i < vertexCount; i++) {
            var vh = vertices[i * 3 + 1];
            var hNorm = Math.min(vh / 18, 1);
            // Time bands (Ordovician/Silurian/Devonian approximation)
            if (hNorm < 0.3) {
                colorArray1[i * 3] = 0.8; colorArray1[i * 3 + 1] = 0.6; colorArray1[i * 3 + 2] = 0.3;
            } else if (hNorm < 0.7) {
                colorArray1[i * 3] = 0.6; colorArray1[i * 3 + 1] = 0.7; colorArray1[i * 3 + 2] = 0.5;
            } else {
                colorArray1[i * 3] = 0.4; colorArray1[i * 3 + 1] = 0.8; colorArray1[i * 3 + 2] = 0.7;
            }
            // Rock types (limestone/dolomite approximation)
            if (hNorm < 0.4) {
                colorArray2[i * 3] = 0.7; colorArray2[i * 3 + 1] = 0.7; colorArray2[i * 3 + 2] = 0.6;
            } else if (hNorm < 0.7) {
                colorArray2[i * 3] = 0.85; colorArray2[i * 3 + 1] = 0.8; colorArray2[i * 3 + 2] = 0.6;
            } else {
                colorArray2[i * 3] = 0.9; colorArray2[i * 3 + 1] = 0.85; colorArray2[i * 3 + 2] = 0.7;
            }
        }
        terrainGeom.setAttribute('colorTime', new THREE.BufferAttribute(colorArray1, 3));
        terrainGeom.setAttribute('colorRock', new THREE.BufferAttribute(colorArray2, 3));
        var terrainMat = new THREE.MeshPhongMaterial({ color: 0xdddddd, vertexColors: true, flatShading: false, shininess: 10 });
        var terrain = new THREE.Mesh(terrainGeom, terrainMat);
        terrain.castShadow = true;
        terrain.receiveShadow = true;
        scene.add(terrain);

        // Toggles (checkboxes rendered in BODYHTML)
        var timeBox = document.getElementById('t3dP01Toggle_TimeShow');
        var rockBox = document.getElementById('t3dP01Toggle_RockTypes');
        var showTime = timeBox ? !!timeBox.checked : true;
        var showRock = rockBox ? !!rockBox.checked : false;

        function updateTerrain() {
            if (showTime && !showRock) {
                terrainGeom.setAttribute('color', terrainGeom.getAttribute('colorTime'));
            } else if (showRock && !showTime) {
                terrainGeom.setAttribute('color', terrainGeom.getAttribute('colorRock'));
            } else if (showTime && showRock) {
                var mixed = new Float32Array(vertexCount * 3);
                for (var j = 0; j < vertexCount; j++) {
                    mixed[j * 3] = (colorArray1[j * 3] + colorArray2[j * 3]) / 2;
                    mixed[j * 3 + 1] = (colorArray1[j * 3 + 1] + colorArray2[j * 3 + 1]) / 2;
                    mixed[j * 3 + 2] = (colorArray1[j * 3 + 2] + colorArray2[j * 3 + 2]) / 2;
                }
                terrainGeom.setAttribute('color', new THREE.BufferAttribute(mixed, 3));
            }
            var attr = terrainGeom.getAttribute('color');
            if (attr) attr.needsUpdate = true;
        }
        if (timeBox) timeBox.addEventListener('change', function (e) { showTime = e.target.checked; updateTerrain(); });
        if (rockBox) rockBox.addEventListener('change', function (e) { showRock = e.target.checked; updateTerrain(); });
        updateTerrain();
        if (!terrainGeom.getAttribute('color')) {
            terrainGeom.setAttribute('color', terrainGeom.getAttribute('colorTime'));
        }

        t3dStatus('Dong Van Plateau | Karst plateau: 2,432 sq km | Elevation: 800-1,600 m | Drag to orbit, scroll to zoom.');
        return function animate(dt) { /* static terrain; camera easing handled by shell */ };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        if (!host) return;
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    // Matches the original fixed camera at (35, 32, 45) looking at origin.
                    var shell = t3dShell(THREE, host, { radius: 65, minR: 12, maxR: 200, phi: 1.06, theta: 0.66, targetY: 0, fov: 50 });
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep cave darkness -->
  <rect width="64" height="64" fill="#1C1C1E"/>

  <!-- Cave entrance arch (dark limestone) -->
  <path d="M 12 32 Q 12 16 32 12 Q 52 16 52 32" stroke="#3C3C3E" stroke-width="2" fill="none"/>

  <!-- Stalactites hanging from top -->
  <polygon points="20,12 18,20 22,20" fill="#505050"/>
  <polygon points="32,10 30,18 34,18" fill="#505050"/>
  <polygon points="44,12 42,21 46,21" fill="#505050"/>

  <!-- Cave floor (lighter limestone foundation) -->
  <path d="M 12 32 L 52 32 L 50 40 Q 32 45 14 40 Z" fill="#504030"/>

  <!-- Underground river (deep blue stripe) -->
  <ellipse cx="32" cy="36" rx="14" ry="3" fill="#2A4A7A"/>

  <!-- Light ray entering through roof hole (golden sunlight) -->
  <polygon points="32,14 28,28 36,28" fill="#D4A859" opacity="0.6"/>

  <!-- Cave opening depth indicator (receding lines) -->
  <line x1="16" y1="20" x2="28" y2="28" stroke="#7DAFA3" stroke-width="1" opacity="0.4"/>
  <line x1="48" y1="20" x2="36" y2="28" stroke="#7DAFA3" stroke-width="1" opacity="0.4"/>
</svg>

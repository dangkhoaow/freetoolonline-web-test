<script>
    // 3D scene archetype skeleton (ha-long-bay) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (ha-long-bay). All geometry is procedural. places-3d cluster,
    // authored 2026-07-28.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (UNESCO World Heritage nomination / encyclopedic
    // consensus, cross-checked 2026-07-28):
    //   - Gulf of Tonkin, Quang Ninh province, northeastern Vietnam
    //   - Core UNESCO World Heritage zone area about 1,553 sq km
    //   - An estimated 1,600-2,000 limestone karst islands and islets,
    //     about 775 of them named
    //   - UNESCO World Heritage Site since 1994
    //   - Karst towers shaped over roughly the last 20 million years of
    //     tropical weathering and wave erosion
    //   - "Ha Long" translates to "descending dragon", tied to a folk
    //     legend of dragons defending the coast
    //   - Sung Sot (Surprise) Cave is one of the largest caves in the bay
    //   - Many limestone towers rise about 50-100 m above the water
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'ha-long-bay';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placeshalongbay'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0a1c22, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.62));
        var key = new THREE.DirectionalLight(0xfff2da, 1.05);
        key.position.set(-10, 18, -7);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return { mesh: new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 })), geo: geo, pos: pos };
        }

        // Karst island field: a dense cellular (Worley-style) field of steep
        // limestone towers rising straight from the water, sitting BELOW a
        // still emerald water plane at y=0 wherever no tower reaches the
        // surface (so the field reads as a bay, not dry ground). 1 unit is
        // about 20 m vertical, so towers up to about 4.2 units read as
        // roughly 50-100 m against the published figure.
        var CELL = 1.9, PRESENCE = 0.74;
        function towerHeight(x, z) {
            var cellX = Math.floor(x / CELL), cellZ = Math.floor(z / CELL);
            var maxH = 0;
            for (var dx = -1; dx <= 1; dx++) {
                for (var dz = -1; dz <= 1; dz++) {
                    var gx = cellX + dx, gz = cellZ + dz;
                    var presence = hash2(gx * 3.1 + 0.7, gz * 5.7 + 1.3);
                    if (presence < PRESENCE) continue;
                    var jx = hash2(gx + 0.11, gz + 7.77) - 0.5;
                    var jz = hash2(gx + 9.31, gz + 2.02) - 0.5;
                    var cx = (gx + 0.5 + jx * 0.6) * CELL;
                    var cz = (gz + 0.5 + jz * 0.6) * CELL;
                    var dist = Math.sqrt((x - cx) * (x - cx) + (z - cz) * (z - cz));
                    var footprint = 0.42 + 0.22 * hash2(gx + 21.4, gz + 13.9);
                    var peak = 1.5 + 2.4 * hash2(gx + 51.2, gz + 31.6);
                    var reach = footprint * 2.0;
                    if (dist < reach) {
                        var t = 1 - dist / reach;
                        var shaped = Math.pow(Math.max(0, t), 0.85);
                        var h = peak * shaped;
                        if (h > maxH) maxH = h;
                    }
                }
            }
            return maxH;
        }
        // WATER_Y is the still-water datum; land only where towerHeight > 0.
        var WATER_Y = 0;
        function height(x, z) {
            var h = towerHeight(x, z);
            if (h > 0.02) return h;
            return WATER_Y - 0.02 - 0.015 * fbm(x * 0.5 + 3, z * 0.5 + 9, 3);
        }

        var col = {
            water: new THREE.Color(0x1a6b6a), cliffLow: new THREE.Color(0x8a8272),
            cliffMid: new THREE.Color(0x746a5c), vegCap: new THREE.Color(0x3c6b3a),
            vegHigh: new THREE.Color(0x2a4f2a), bareTop: new THREE.Color(0xb9b09a)
        };
        var vegOn = true, caveOn = true;
        function color(c, h, x, z) {
            var n = 0.9 + 0.16 * fbm(x * 1.4 + 5, z * 1.4 + 2, 3);
            if (h <= WATER_Y - 0.01) { c.copy(col.water).multiplyScalar(0.92 + 0.08 * n); return; }
            var t = smooth(0.02, 3.4, h);
            if (t < 0.55) { c.copy(col.cliffLow).lerp(col.cliffMid, t / 0.55); }
            else if (vegOn) { c.copy(col.cliffMid).lerp(col.vegCap, (t - 0.55) / 0.45); if (t > 0.85) c.lerp(col.vegHigh, (t - 0.85) / 0.15); }
            else { c.copy(col.cliffMid).lerp(col.bareTop, (t - 0.55) / 0.45); }
            c.multiplyScalar(n);
        }
        var terrainInfo = makeTerrain(22, 15, shell.low ? 130 : 170, shell.low ? 90 : 116, height, color);
        scene.add(terrainInfo.mesh);

        // Sung Sot (Surprise) Cave marker: found by sampling for the tallest
        // island near the scene center, standing in for the bay's largest
        // named cave (real caves sit inside islands, not visible from
        // outside - the marker is a schematic locator, not a cave model).
        var markerX = 0, markerZ = 0, markerY = 0;
        (function findCaveIsland() {
            var best = -1;
            for (var sx = -6; sx <= 6; sx += 0.5) {
                for (var sz = -4; sz <= 4; sz += 0.5) {
                    var hh = height(sx, sz);
                    if (hh > best) { best = hh; markerX = sx; markerZ = sz; }
                }
            }
            markerY = best;
        })();

        var caveMarker = new THREE.Mesh(
            new THREE.ConeGeometry(0.22, 0.7, 14),
            new THREE.MeshStandardMaterial({ color: 0xd08a3f, emissive: 0x2a1704, roughness: 0.35 })
        );
        caveMarker.position.set(markerX, markerY + 0.55, markerZ);
        scene.add(caveMarker);
        var caveRing = new THREE.Mesh(
            new THREE.RingGeometry(0.38, 0.55, 32),
            new THREE.MeshBasicMaterial({ color: 0xe0b378, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
        );
        caveRing.rotation.x = -Math.PI / 2;
        caveRing.position.set(markerX, markerY + 0.03, markerZ);
        scene.add(caveRing);

        function recolor() {
            var pos = terrainInfo.pos, geo = terrainInfo.geo, colors = geo.attributes.color, col2 = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                color(col2, pos.getY(i), pos.getX(i), pos.getZ(i));
                colors.setXYZ(i, col2.r, col2.g, col2.b);
            }
            colors.needsUpdate = true;
        }

        function panelHtml() {
            return '<h3>Ha Long Bay: a drowned karst archipelago</h3>' +
                '<p>An estimated 1,600-2,000 limestone islands and islets rise straight out of the emerald water of the Gulf of Tonkin - most too steep to hold more than a cap of tropical vegetation. The marker sits on the bay\'s tallest island in the scene, standing in for Sung Sot (Surprise) Cave.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Location</td><td>Gulf of Tonkin, Quang Ninh province, Vietnam</td></tr>' +
                '<tr><td>Core UNESCO zone</td><td>about 1,553 sq km</td></tr>' +
                '<tr><td>Islands/islets</td><td>estimated 1,600-2,000, about 775 named</td></tr>' +
                '<tr><td>Karst age</td><td>shaped over roughly the last 20 million years</td></tr>' +
                '<tr><td>UNESCO status</td><td>World Heritage Site since 1994</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the island field, spacing, and vertical scale are schematic teaching cues, not survey terrain.</p>';
        }

        function apply() {
            caveMarker.visible = caveOn; caveRing.visible = caveOn;
            var vb = document.getElementById('t3dHlbVegBtn');
            if (vb) vb.textContent = 'Vegetation cap highlight: ' + (vegOn ? 'On' : 'Off');
            var cb = document.getElementById('t3dHlbCaveBtn');
            if (cb) cb.textContent = 'Sung Sot Cave marker: ' + (caveOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ vegOn: vegOn, caveOn: caveOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.vegOn === 'boolean') vegOn = store.vegOn;
        if (typeof store.caveOn === 'boolean') caveOn = store.caveOn;
        recolor();
        apply();

        var vegBtn = document.getElementById('t3dHlbVegBtn');
        if (vegBtn) vegBtn.addEventListener('click', function () { vegOn = !vegOn; recolor(); apply(); });
        var caveBtn = document.getElementById('t3dHlbCaveBtn');
        if (caveBtn) caveBtn.addEventListener('click', function () { caveOn = !caveOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the vegetation cap highlight or the Sung Sot Cave marker.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placeshalongbay: 't3dHlbControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placeshalongbay: { radius: 28, maxR: 62, minR: 7, phi: 0.92, theta: 0.7, targetY: 0.7 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

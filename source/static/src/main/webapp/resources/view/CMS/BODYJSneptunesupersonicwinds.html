<script>
    // 3D scene archetype skeleton (Neptune Supersonic Winds) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side.
    // Built LEAN, forked from the great-red-spot-jupiter shape - ONE scene
    // only (a wind-speed + storm-lifecycle explorer). All geometry is
    // procedural (a sphere with a canvas-drawn band texture + a canvas-drawn
    // oval storm redrawn per era + a small orbiting wind-ring marker).
    //
    // EDUCATIONAL APPROXIMATION, not a photographic or physics simulation.
    // Neptune's cloud bands are drawn as flat artistic color stripes, not a
    // real photographic texture. The storm's oval SHAPE is an artistic
    // approximation and its on-screen presence/absence per era is real
    // (it was observed in 1989, then confirmed gone by Hubble in the
    // mid-1990s) - but the exact drawn width is illustrative, not a
    // published storm-diameter figure.
    //
    // Published figures (cross-checked via WebSearch 2026-07-25; sources:
    // NASA Science Neptune Facts (science.nasa.gov/neptune/neptune-facts/),
    // NASA NSSDC Planetary Fact Sheet (nssdc.gsfc.nasa.gov/planetary/factsheet/),
    // NASA/JPL "Neptune - Changes in Great Dark Spot" image sequence PIA00045,
    // NASA Science "Hubble Tracks the Lifecycle of Giant Storms on Neptune",
    // NASA Science Saturn Facts (science.nasa.gov/saturn/facts/) for the wind
    // comparison figures):
    //   - Neptune's equatorial diameter is about 49,528 km.
    //   - Neptune's average rotation period is about 16.1 hours; because
    //     Neptune is not a rigid body, different latitudes rotate at
    //     different rates - about 18 hours at the equator and about 12
    //     hours near the poles (Voyager 2 data).
    //   - Neptune receives about 900 times less sunlight than Earth (it
    //     orbits roughly 30 times farther from the Sun) - yet it has the
    //     strongest winds ever measured on a planet in the solar system,
    //     an open research question tied to internal heat, fast rotation,
    //     and low atmospheric drag.
    //   - Peak measured winds near Neptune's Great Dark Spot reached
    //     roughly 2,000-2,400 km/h (about 1,200-1,500 mph) - the fastest
    //     winds recorded on any planet in the solar system.
    //   - Voyager 2 (NASA, 1989 flyby) discovered the Great Dark Spot, an
    //     anticyclonic storm roughly the size of Earth, in Neptune's
    //     southern hemisphere centered around 20 degrees south latitude.
    //   - Consecutive Voyager 2 images in the NASA/JPL "Changes in Great
    //     Dark Spot" sequence (PIA00045) captured full rotations of the
    //     storm system about 18 hours apart.
    //   - Unlike Jupiter's Great Red Spot (continuously observed since at
    //     least 1831), the Great Dark Spot was not permanent - Hubble Space
    //     Telescope observations in the mid-1990s found no trace of it.
    //   - Wind-speed comparison (peak measured, real published figures):
    //     Saturn's equatorial jet reaches about 1,800 km/h (NASA Saturn
    //     Facts); Jupiter's winds typically run 320-640 km/h with polar
    //     jets recorded up to about 1,450 km/h; NASA's own Saturn Facts
    //     page compares these to Earth's fastest measured winds, which top
    //     out at about 396 km/h (110 meters per second).
    //   - Earth's average diameter is about 12,742 km, used only for the
    //     on-screen size comparison.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'neptunesupersonicwinds';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'neptunewinds'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published Great Dark Spot lifecycle eras (cross-checked via
    // WebSearch 2026-07-25; sources in the header comment above). Never
    // interpolated between eras - each is a discrete, independently
    // documented observation.
    var T3D_GDS_ERAS = [
        { label: '1989', sub: 'Voyager 2 discovers the Great Dark Spot (NASA flyby)', present: true, note: 'Anticyclonic storm roughly Earth-sized, centered near 20 deg south latitude. Consecutive Voyager 2 images (NASA/JPL PIA00045) captured full storm rotations about 18 hours apart.' },
        { label: 'Mid-1990s', sub: 'Hubble Space Telescope observation', present: false, note: 'Hubble found no trace of the Great Dark Spot - unlike Jupiter\'s Great Red Spot (observed continuously since at least 1831), it was not a permanent feature.' },
        { label: 'Today', sub: 'no successor at this location', present: false, note: 'The original Great Dark Spot has not reappeared at this latitude. Neptune has since produced other, separate transient dark storms spotted by Hubble monitoring - not shown on this page.' }
    ];

    var T3D_NEPTUNE_DIAMETER_KM = 49528;
    var T3D_EARTH_DIAMETER_KM = 12742;

    // Peak measured wind speeds (real published figures, km/h) for the
    // comparison bars. Never a live measurement - each is a historical
    // peak figure from the cited NASA sources.
    var T3D_WIND_COMPARISON = [
        { label: 'Neptune (this page)', kmh: 2200, range: '2,000-2,400 km/h', source: 'NASA - fastest measured winds of any planet in the solar system' },
        { label: 'Saturn', kmh: 1800, range: 'about 1,800 km/h', source: 'NASA Saturn Facts - equatorial jet stream' },
        { label: 'Jupiter', kmh: 1450, range: 'typically 320-640 km/h; polar jets up to about 1,450 km/h', source: 'NASA/Voyager and Juno data' },
        { label: 'Earth', kmh: 396, range: 'about 396 km/h (110 m/s)', source: 'NASA Saturn Facts - fastest winds ever measured on Earth' }
    ];

    var T3D_BAND_PALETTE = ['#3a5f9e', '#5b73ae', '#4a6bab', '#6c85c2', '#3f5f9c', '#5670a8', '#4f6bb0', '#6480bc', '#456aa5', '#5d78b5'];

    function t3dBuildNeptuneTexture(THREE, eraIndex) {
        var w = 1024, h = 512;
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        var bandCount = 14;
        var bandH = h / bandCount;
        for (var i = 0; i < bandCount; i++) {
            ctx.fillStyle = T3D_BAND_PALETTE[i % T3D_BAND_PALETTE.length];
            ctx.fillRect(0, i * bandH, w, bandH + 1);
        }
        // High-speed wind streak lines - purely illustrative direction cues,
        // not a wind-field simulation.
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 2;
        for (var s = 0; s < 40; s++) {
            var sy = Math.random() * h;
            var sx = Math.random() * w;
            var len = 40 + Math.random() * 90;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + len, sy);
            ctx.stroke();
        }
        var era = T3D_GDS_ERAS[eraIndex];
        if (era.present) {
            // The Great Dark Spot - drawn near 20 degrees south latitude.
            // v = 0 is the north pole, v = 1 is the south pole on a
            // standard equirectangular sphere map.
            var spotV = (90 + 20) / 180;
            var spotY = spotV * h;
            var spotWpx = w * 0.16; // artistic width, not a published storm-diameter figure
            var spotHpx = spotWpx / 1.7;
            var spotX = w * 0.5;
            ctx.save();
            ctx.translate(spotX, spotY);
            var grad = ctx.createRadialGradient(0, 0, spotWpx * 0.1, 0, 0, spotWpx * 0.5);
            grad.addColorStop(0, '#1c1c1e');
            grad.addColorStop(0.6, '#2a2f45');
            grad.addColorStop(1, '#3c3c3e');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, 0, spotWpx * 0.5, spotHpx * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        var tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
    }

    function t3dLatLonToLocal(radius, latDeg, lonDeg) {
        var phi = (90 - latDeg) * Math.PI / 180;
        var theta = lonDeg * Math.PI / 180;
        return {
            x: radius * Math.sin(phi) * Math.cos(theta),
            y: radius * Math.cos(phi),
            z: radius * Math.sin(phi) * Math.sin(theta)
        };
    }

    function t3dNeptuneWinds(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x05070d, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var sunLight = new THREE.DirectionalLight(0xdfe8ff, 1.3);
        sunLight.position.set(14, 6, 10);
        scene.add(sunLight);

        var starN = shell.low ? 220 : 460;
        var starPos = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r = 70 + Math.random() * 60;
            var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r * Math.sin(ph) * Math.cos(th);
            starPos[s * 3 + 1] = r * Math.cos(ph);
            starPos[s * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.28, sizeAttenuation: true, transparent: true, opacity: 0.55 })));

        var neptuneRadius = 10;
        var neptuneGeo = new THREE.SphereGeometry(neptuneRadius, 64, 48);
        var neptuneMat = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05 });
        var neptune = new THREE.Mesh(neptuneGeo, neptuneMat);
        scene.add(neptune);

        // Wind-ring marker at the storm's fixed lat/lon position, parented
        // to Neptune so it rotates with the planet. Direction is
        // illustrative (anticyclonic, as described in the facts panel) -
        // not a wind-field simulation.
        var spotLocal = t3dLatLonToLocal(neptuneRadius * 1.03, -20, 0);
        var windGroup = new THREE.Group();
        windGroup.position.set(spotLocal.x, spotLocal.y, spotLocal.z);
        windGroup.lookAt(0, 0, 0);
        neptune.add(windGroup);
        var windDots = [];
        var windN = 10;
        for (var wd = 0; wd < windN; wd++) {
            var dot = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshBasicMaterial({ color: 0xbcd4ff }));
            windGroup.add(dot);
            windDots.push(dot);
        }
        windGroup.visible = true;

        function applyEra(idx) {
            neptuneMat.map = t3dBuildNeptuneTexture(THREE, idx);
            neptuneMat.needsUpdate = true;
            windGroup.visible = !!T3D_GDS_ERAS[idx].present;
        }

        function windTableHtml() {
            var rows = '';
            for (var i = 0; i < T3D_WIND_COMPARISON.length; i++) {
                var wc = T3D_WIND_COMPARISON[i];
                var pct = Math.round((wc.kmh / T3D_WIND_COMPARISON[0].kmh) * 100);
                rows += '<tr' + (i === 0 ? ' style="background:#e3f2fd;"' : '') + '>' +
                    '<td>' + wc.label + '</td>' +
                    '<td>' + wc.range + '</td>' +
                    '<td><div style="background:#5B73AE; height:10px; width:' + pct + '%; border-radius:3px;"></div></td>' +
                    '</tr>';
            }
            return '<div class="w3-responsive"><table class="w3-table w3-bordered w3-small">' +
                '<tr><th>Body</th><th>Peak measured wind</th><th>Relative</th></tr>' + rows + '</table></div>';
        }

        var eraIndex = 0; // default: 1989 discovery era
        var idxEl = document.getElementById('t3dNwScrub');
        var idxLab = document.getElementById('t3dNwLabel');

        function panelHtml() {
            var era = T3D_GDS_ERAS[eraIndex];
            var rows = '';
            for (var i = 0; i < T3D_GDS_ERAS.length; i++) {
                var e = T3D_GDS_ERAS[i];
                rows += '<tr' + (i === eraIndex ? ' style="background:#fff3cd;"' : '') + '>' +
                    '<td>' + e.label + '</td>' +
                    '<td>' + e.sub + '</td>' +
                    '<td>' + (e.present ? 'Storm visible' : 'Not observed') + '</td>' +
                    '</tr>';
            }
            return '<h3>Era ' + (eraIndex + 1) + ' of ' + T3D_GDS_ERAS.length + ': ' + era.label + '</h3>' +
                '<p><b>' + era.sub + '</b></p>' +
                '<p>' + era.note + '</p>' +
                '<div class="w3-responsive"><table class="w3-table w3-bordered w3-small">' +
                '<tr><th>Era</th><th>Observation</th><th>Storm</th></tr>' + rows + '</table></div>' +
                '<p class="t3d-note">Educational approximation - Neptune\'s cloud bands are artistic color stripes, not a photographic texture, and the storm\'s oval shape and size on screen are stylized. Whether the storm appears at all in each era, and its approximate 20 degree south location, reflect the real published observations cited above.</p>' +
                windTableHtml();
        }

        function apply() {
            applyEra(eraIndex);
            var era = T3D_GDS_ERAS[eraIndex];
            if (idxLab) idxLab.textContent = era.label + ' (' + (era.present ? 'storm visible' : 'not observed') + ')';
            t3dInfo(panelHtml());
            try { t3dSaveStore({ eraIndex: eraIndex }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.eraIndex === 'number' && store.eraIndex >= 0 && store.eraIndex < T3D_GDS_ERAS.length) {
            eraIndex = store.eraIndex;
        }
        if (idxEl) idxEl.value = String(eraIndex);
        apply();

        if (idxEl) idxEl.addEventListener('input', function () {
            eraIndex = Math.max(0, Math.min(T3D_GDS_ERAS.length - 1, parseInt(idxEl.value || '0', 10)));
            apply();
        });

        t3dStatus('Drag to orbit, scroll to zoom. Scrub the era slider to see when the Great Dark Spot was observed - and when it was not.');
        return function animate(dt) {
            // Neptune's real average rotation period is about 16.1 hours
            // (differential: about 18h at the equator, about 12h near the
            // poles). On-screen speed is sped up for visibility, never
            // claimed to be real-time.
            neptune.rotation.y += dt * 0.00022;
            for (var i = 0; i < windDots.length; i++) {
                var a = (performance.now() * 0.0022) + (i / windDots.length) * Math.PI * 2;
                windDots[i].position.set(Math.cos(a) * 0.9, Math.sin(a) * 0.9, 0);
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { neptunewinds: 't3dNwControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { neptunewinds: { radius: 22, maxR: 60, minR: 8, phi: 1.2, theta: 0.6, targetY: 0 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dNeptuneWinds(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

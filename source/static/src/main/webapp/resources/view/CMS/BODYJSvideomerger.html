    /* Video Merger (rebuilt 2026-10-02) - joins video clips into one file, entirely in the
     * visitor's browser. Nothing is uploaded: the only network requests are same-origin
     * downloads of the code libraries below, loaded lazily on first use.
     *
     * Three engines share ONE timeline model (vmTimeline) so trims, transitions, frame shape and
     * music render the same way whichever engine runs:
     *   1. Lossless join  - Mediabunny copies encoded packets (no decode, no re-encode). Used only
     *                       when every clip has the same codec, byte-identical decoder config,
     *                       same rotation and same audio format, and no edit needs new pixels or
     *                       samples (no trim / mute / transition / music / new frame shape).
     *   2. Browser encode - Mediabunny demux + WebCodecs decode, every output frame composited on
     *                       a canvas (fit, letterbox/crop, crossfade, fade through black), encoded
     *                       with WebCodecs (H.264 -> MP4 first, else VP9/AV1/VP8 -> WebM). Audio
     *                       is mixed at 48 kHz stereo in short chunks rendered by
     *                       OfflineAudioContext (native resampling, pre-roll pad to avoid seams)
     *                       and encoded as AAC (WebCodecs, else the vendored AAC WASM encoder)
     *                       or Opus.
     *   3. Compatibility  - FFmpeg.wasm (single-thread, vendored). Clips are mounted read-only
     *                       with WORKERFS (no copy into wasm memory); one filtergraph does trim,
     *                       scale + pad/crop, fps, fades, xfade/acrossfade and music (amix).
     *                       Used when WebCodecs is missing, a clip cannot be decoded by WebCodecs
     *                       or read by Mediabunny, or after a WebCodecs encoder failure.
     *
     * Vendored libs (both site repos, static/vendor/):
     *   mediabunny/1.61.0/mediabunny.min.mjs  (MPL-2.0)
     *   mediabunny/1.61.0/aac-encoder.min.mjs (MPL-2.0 + FFmpeg AAC encoder, LGPL; its bare
     *                                          "mediabunny" import is rewritten to a relative
     *                                          path - see that folder's README)
     *   ffmpeg/ (@ffmpeg/ffmpeg 0.12.10 + @ffmpeg/core 0.12.6, single-thread)
     *
     * Framework contract: doAfterPageRendered(); no top-level DOM access. Feature contract and
     * truth source: .agent/skills/tool-videomerger/SKILL.md (every reader claim traces there).
     * Typography: this file is a CMS fragment, so it stays ASCII-only.
     */

                var c1 = Math.min(tl.total, audioUntil + VM_AUDIO_CHUNK_S);
                var chunk = await vmRenderAudioChunk(tl, audioUntil, c1, job);
                await vmWithTimeout(aSrc.add(chunk), VM_ENCODER_STALL_MS, 'The audio encoder stopped responding.');
                audioUntil = c1;
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);
            for (var i = 0; i < tl.items.length; i++) {
                var it = tl.items[i], fr = frames[i];
                if (k < fr.ks || k > fr.ke || fr.done) continue;
                if (!fr.gen) {
                    var sink = new mb.CanvasSink(it.clip.vTrack, fr.opts);
                    fr.gen = sink.canvasesAtTimestamps(fr.ts)[Symbol.asyncIterator]();
                }
                var r = await fr.gen.next();
                if (r.done) { fr.done = true; } else if (r.value && r.value.canvas) { fr.last = r.value.canvas; }
                var alpha = vmVideoAlpha(it, T - it.start);
                if (fr.last && alpha > 0) {
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(fr.last, fr.dx, fr.dy);
                }
                if (k === fr.ke && fr.gen) { try { await fr.gen.return(); } catch (e) { /* ignore */ } fr.done = true; fr.last = null; }
            }
            ctx.globalAlpha = 1;
            var snap = canvas.transferToImageBitmap ? canvas.transferToImageBitmap() : await createImageBitmap(canvas);
            var sample = new mb.VideoSample(snap, { timestamp: T, duration: 1 / F });
            try {
                await vmWithTimeout(vSrc.add(sample), VM_ENCODER_STALL_MS, 'The video encoder stopped responding.');
            } finally {
                sample.close(); snap.close();
            }
            // An encoder that accepts frames but never emits any (seen with some Safari H.264
            // settings) is caught here without slowing healthy encoders down.
            if (packets === 0 && k > 120 && performance.now() - started > VM_ENCODER_STALL_MS) {
                throw new Error('The video encoder produced no output.');
            }
            if (k % 5 === 0) vmProgress(job, (k + 1) / N, 'Encoding frame ' + (k + 1) + ' of ' + N, started);
        }
        while (aSrc && audioUntil < tl.total) {
            var c2 = Math.min(tl.total, audioUntil + VM_AUDIO_CHUNK_S);
            await aSrc.add(await vmRenderAudioChunk(tl, audioUntil, c2, job));
            audioUntil = c2;
        }
        tl.items.forEach(function (it) { it.clip.fullPcm = null; it.clip.audioSink = null; });
        vmProgress(job, 1, 'Finishing the file...');
        await vmWithTimeout(output.finalize(), 6 * VM_ENCODER_STALL_MS, 'The encoder did not finish the file.');
        return { blob: new Blob([output.target.buffer], { type: plan.container === 'mp4' ? 'video/mp4' : 'video/webm' }), ext: plan.container, W: W, H: H, durationS: tl.total };
    }

    // ------------------------------------------------------------------ engine 3: compatibility (FFmpeg.wasm)

    function vmNum(x) { return (Math.round(x * 1000) / 1000).toFixed(3); }

    function vmBuildFfArgs(tl, plan, names, musicName) {
        var W = plan.W, H = plan.H, F = plan.F, graph = [], args = ['-hide_banner'];
        names.forEach(function (n) { args.push('-i', '/vmin/' + n); });
        if (musicName) { if (vm.musicLoop) args.push('-stream_loop', '-1'); args.push('-i', '/vmin/' + musicName); }
        var level = vmClipLevel();
        var scale = vm.fit === 'cover'
            ? 'scale=' + W + ':' + H + ':force_original_aspect_ratio=increase,crop=' + W + ':' + H
            : 'scale=' + W + ':' + H + ':force_original_aspect_ratio=decrease,pad=' + W + ':' + H + ':(ow-iw)/2:(oh-ih)/2:color=black';
        tl.items.forEach(function (it, i) {
            var c = it.clip, d = vmNum(it.dur);
            // FFmpeg already turns each input upright for its rotation metadata; the reader's
            // rotation is added before scaling so letterbox / crop see the turned shape.
            var v = '[' + i + ':v:0]setpts=PTS-STARTPTS,trim=start=' + vmNum(c.trimStart) + ':end=' + vmNum(c.trimEnd) +
                ',setpts=PTS-STARTPTS,' + vmFfTurn(vmRotOf(c)) + scale + ',setsar=1,fps=' + F + ',format=yuv420p' +
                ',tpad=stop_mode=clone:stop_duration=1,trim=duration=' + d;
            if (it.inType === 'fade') v += ',fade=t=in:st=0:d=' + vmNum(it.inLen / 2);
            if (it.outType === 'fade') v += ',fade=t=out:st=' + vmNum(it.dur - it.outLen / 2) + ':d=' + vmNum(it.outLen / 2);
            graph.push(v + ',settb=AVTB[v' + i + ']');
            if (!plan.needAudio) return;
            var a;
            if (c.info.hasAudio && !c.muted && level > 0) {
                a = '[' + i + ':a:0]asetpts=PTS-STARTPTS,atrim=start=' + vmNum(c.trimStart) + ':end=' + vmNum(c.trimEnd) +
                    ',asetpts=PTS-STARTPTS,aresample=' + VM_SR + ',aformat=sample_fmts=fltp:channel_layouts=stereo,volume=' + level +
                    ',apad=whole_dur=' + d + ',atrim=duration=' + d;
            } else {
                a = 'anullsrc=r=' + VM_SR + ':cl=stereo,aformat=sample_fmts=fltp:channel_layouts=stereo,atrim=duration=' + d;
            }
            if (it.inType === 'fade') a += ',afade=t=in:st=0:d=' + vmNum(it.inLen / 2);
            if (it.outType === 'fade') a += ',afade=t=out:st=' + vmNum(it.dur - it.outLen / 2) + ':d=' + vmNum(it.outLen / 2);
            graph.push(a + '[a' + i + ']');
        });
        var accV = 'v0', accA = 'a0', accDur = tl.items[0].dur;
        for (var g = 0; g < tl.items.length - 1; g++) {
            var nxt = tl.items[g + 1];
            if (tl.items[g].outType === 'crossfade') {
                var L = tl.items[g].outLen;
                graph.push('[' + accV + '][v' + (g + 1) + ']xfade=transition=fade:duration=' + vmNum(L) + ':offset=' + vmNum(accDur - L) + '[xv' + g + ']');
                if (plan.needAudio) graph.push('[' + accA + '][a' + (g + 1) + ']acrossfade=d=' + vmNum(L) + ':c1=qsin:c2=qsin[xa' + g + ']');
                accV = 'xv' + g; accA = 'xa' + g; accDur += nxt.dur - L;
            } else if (plan.needAudio) {
                graph.push('[' + accV + '][' + accA + '][v' + (g + 1) + '][a' + (g + 1) + ']concat=n=2:v=1:a=1[cv' + g + '][ca' + g + ']');
                accV = 'cv' + g; accA = 'ca' + g; accDur += nxt.dur;
            } else {
                graph.push('[' + accV + '][v' + (g + 1) + ']concat=n=2:v=1:a=0[cv' + g + ']');
                accV = 'cv' + g; accDur += nxt.dur;
            }
        }
        if (plan.needAudio && musicName) {
            var mi = names.length, total = tl.total;
            var mus = '[' + mi + ':a:0]aresample=' + VM_SR + ',aformat=sample_fmts=fltp:channel_layouts=stereo,atrim=duration=' + vmNum(total) + ',volume=' + vm.musicVolume.toFixed(2);
            if (vm.musicFade && total > 0.5) mus += ',afade=t=out:st=' + vmNum(Math.max(0, total - VM_MUSIC_FADE_S)) + ':d=' + vmNum(Math.min(VM_MUSIC_FADE_S, total));
            graph.push(mus + '[mus]');
            graph.push('[' + accA + '][mus]amix=inputs=2:duration=first:dropout_transition=0:normalize=0[amx]');
            accA = 'amx';
        }
        args.push('-filter_complex', graph.join(';'), '-map', '[' + accV + ']');
        if (plan.needAudio) args.push('-map', '[' + accA + ']', '-c:a', 'aac', '-b:a', '160k');
        else args.push('-an');
        args.push('-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-pix_fmt', 'yuv420p', '-r', String(F), '-movflags', '+faststart', '/vmout.mp4');
        return args;
    }

    async function vmRunFfmpeg(plan, job) {
        var ff = await vmLoadFfmpeg(function (m) { vmProgress(job, 0, m); });
        if (job.cancelled) throw vmCancelErr();
        var clips = vm.clips.slice();
        var names = clips.map(function (c, i) { return 'c' + i + vmExtOf(c.name); });
        var musicName = vm.music ? 'music' + vmExtOf(vm.music.name) : null;
        var blobs = clips.map(function (c, i) { return { name: names[i], data: c.file }; });
        if (musicName) blobs.push({ name: musicName, data: vm.music.file });
        try { await ff.createDir('/vmin'); } catch (e) { /* exists */ }
        await ff.mount('WORKERFS', { blobs: blobs }, '/vmin');
        var onLog = null;
        try {
            for (var i = 0; i < clips.length; i++) {
                var c = clips[i];
                if (c.info.hasAudio === null || !c.info.mbReadable) {
                    vmProgress(job, 0, 'Reading clip ' + (i + 1) + ' of ' + clips.length + '...');
                    var r = await vmFfProbe(ff, '/vmin/' + names[i]);
                    c.info.hasAudio = r.hasAudio;
                    if (r.fps) c.info.fps = r.fps;
                }
            }
            plan.needAudio = vmNeedAudio();
            var geo = vmGeometry(true);
            plan.W = geo.W; plan.H = geo.H; plan.F = geo.F;
            var tl = vmTimeline();
            var args = vmBuildFfArgs(tl, plan, names, musicName);
            var started = performance.now(), lastErr = '';
            onLog = function (ev) {
                var m = ev && ev.message ? ev.message : '';
                var tm = /time=(\d+):(\d+):(\d+(?:\.\d+)?)/.exec(m);
                if (tm) {
                    var sec = +tm[1] * 3600 + +tm[2] * 60 + parseFloat(tm[3]);
                    vmProgress(job, Math.min(0.99, sec / Math.max(0.1, tl.total)), 'Encoding in compatibility mode...', started);
                } else if (/error|invalid|failed/i.test(m)) lastErr = m;
            };
            ff.on('log', onLog);
            var rc = await ff.exec(args);
            if (job.cancelled) throw vmCancelErr();
            if (rc !== 0) throw new Error('The compatibility engine could not merge these clips' + (lastErr ? ' (' + lastErr.trim().slice(0, 160) + ')' : '') + '.');
            var data = await ff.readFile('/vmout.mp4');
            try { await ff.deleteFile('/vmout.mp4'); } catch (e2) { /* ignore */ }
            return { blob: new Blob([data.buffer], { type: 'video/mp4' }), ext: 'mp4', W: plan.W, H: plan.H, durationS: tl.total };
        } finally {
            if (onLog && vmFf) { try { vmFf.off('log', onLog); } catch (e3) { /* ignore */ } }
            if (vmFf) { try { await vmFf.unmount('/vmin'); } catch (e4) { /* ignore */ } }
        }
    }

    // ------------------------------------------------------------------ merge orchestration

    function vmProgress(job, frac, text, started) {
        if (!job || job !== vm.job) return;
        var pct = Math.round(vmClamp(frac, 0, 1) * 100);
        var fill = vmEl('vmBarFill');
        if (fill) fill.style.width = pct + '%';
        var eta = '';
        if (started && frac > 0.03 && frac < 1) {
            var el = (performance.now() - started) / 1000;
            var left = el * (1 - frac) / frac;
            eta = ' - about ' + vmFmtTime(left).replace(/\.\d$/, '') + ' left';
        }
        var t = vmEl('vmProgressTxt');
        if (t) t.textContent = pct + '%' + eta + (text ? ' - ' + text : '');
    }

    async function vmEstimateOk(plan) {
        if (plan.engine === 'remux') return true;
        var tl = vmTimeline();
        if (plan.engine === 'webcodecs') {
            var bytes = plan.W * plan.H * plan.F * 0.1 / 8 * tl.total;
            if (bytes > 1.5 * 1073741824) {
                return window.confirm('The merged video may be about ' + vmFmtBytes(bytes) + ', which can be more than this device has memory for. Continue anyway? (A lower Quality setting makes the file smaller.)');
            }
            return true;
        }
        var input = vm.clips.reduce(function (s, c) { return s + (c.size || 0); }, 0);
        var limit = vmIsCoarse() ? 150 * 1048576 : 500 * 1048576;
        if (input > limit) {
            return window.confirm('These clips total ' + vmFmtBytes(input) + '. Compatibility mode keeps the work in this tab\'s memory and may run out of space on this device. Continue anyway?');
        }
        return true;
    }

    async function vmStartMerge() {
        if (vm.job) return;
        vmHideError();
        var job = { cancelled: false, hidden: false, output: null };
        // Claim the job before the first await: planning reads the trims and settings, and the
        // engines keep reading them, so edits (or a second click) must be locked out from here.
        vm.job = job;
        vmSetBusy(true, null);
        var plan;
        try {
            plan = await vmPlan(false);
            if (!(await vmEstimateOk(plan))) { vm.job = null; vmSetBusy(false); return; }
        } catch (e) { vm.job = null; vmSetBusy(false); vmShowError(job.cancelled ? 'Merge cancelled.' : (e && e.message ? e.message : String(e))); return; }
        if (job.cancelled) { vm.job = null; vmSetBusy(false); vmShowError('Merge cancelled.'); return; }
        vmClearResult();
        vmSetBusy(true, plan.engine);
        vmWakeLock();
        try {
            var res;
            if (plan.engine === 'remux') res = await vmRunRemux(plan, job);
            else if (plan.engine === 'webcodecs') {
                try {
                    res = await vmRunWebCodecs(plan, job);
                } catch (e) {
                    if (job.cancelled || (e && (e.vmUser || e.vmCancel))) throw e;
                    try { if (job.output) await job.output.cancel(); } catch (e2) { /* ignore */ }
                    console.warn('video-merger: browser encode failed, switching to compatibility mode', e);
                    plan = vmPlanCompat(plan.edited, plan.remuxPossible);
                    plan.reason = 'the browser encoder failed (' + (e && e.message ? e.message : 'unknown error') + ')';
                    vmSetBusy(true, 'ffmpeg');
                    res = await vmRunFfmpeg(plan, job);
                }
            } else res = await vmRunFfmpeg(plan, job);
            if (job.cancelled) throw vmCancelErr();
            vmShowResult(res, plan);
        } catch (e) {
            try { if (job.output && job.output.state !== 'finalized' && job.output.state !== 'canceled') await job.output.cancel(); } catch (e3) { /* ignore */ }
            if (!(e && (e.vmUser || e.vmCancel)) && !job.cancelled) console.error('video-merger:', e);
            vmShowError(job.cancelled || (e && e.vmCancel) ? 'Merge cancelled.' : vmFriendly(e));
        } finally {
            vm.job = null;
            vmWakeRelease();
            vmSetBusy(false);
        }
    }

    function vmFriendly(e) {
        var m = e && e.message ? e.message : String(e);
        if (e && e.vmUser) return m;
        if (/memory|allocation|RangeError|out of bounds/i.test(m)) return 'This device ran out of memory while merging. Try a lower Quality setting, fewer or shorter clips, or a desktop browser.';
        return 'The merge failed: ' + m;
    }

    function vmCancelMerge() {
        var job = vm.job;
        if (!job) return;
        job.cancelled = true;
        try { if (job.output) job.output.cancel(); } catch (e) { /* ignore */ }
        if (vmFf) vmKillFfmpeg(); // terminate() is the only way to stop a running FFmpeg command
        var t = vmEl('vmProgressTxt');
        if (t) t.textContent = 'Cancelling...';
    }

    async function vmWakeLock() {
        try { if (navigator.wakeLock && navigator.wakeLock.request) vm.wake = await navigator.wakeLock.request('screen'); } catch (e) { vm.wake = null; }
    }
    function vmWakeRelease() {
        try { if (vm.wake) vm.wake.release(); } catch (e) { /* ignore */ }
        vm.wake = null;
    }

    // ------------------------------------------------------------------ music

    async function vmSetMusic(file) {
        if (!file) return;
        var label = vmEl('vmMusicName');
        if (label) label.textContent = 'Reading ' + file.name + '...';
        try {
            var ab = await file.arrayBuffer();
            var buf = await new OfflineAudioContext(2, 1, VM_SR).decodeAudioData(ab);
            vm.music = { file: file, name: file.name, duration: buf.duration, buffer: buf };
            if (!vm.clipAudioTouched) vm.clipAudio = 'lower';
        } catch (e) {
            vm.music = null;
            vmFlash('This browser could not read "' + file.name + '" as audio. Try an MP3, M4A or WAV file.');
        }
        vmClearResult();
        vmRenderMusic();
        vmScheduleOutputLine();
    }

    function vmRemoveMusic() {
        vm.music = null;
        vmClearResult();
        vmRenderMusic();
        vmScheduleOutputLine();
    }

    // ------------------------------------------------------------------ rendering

    function vmCardMeta(c) {
        if (c.kind === 'probing') return c.status || 'Waiting...';
        if (c.kind === 'error') return c.error || 'Could not be read';
        var info = c.info, ds = vmDispOf(c);
        var trimmed = c.trimStart > 0.001 || c.trimEnd < info.durationS - 0.001;
        var m = (trimmed ? 'Keeps ' + vmFmtTime(c.trimEnd - c.trimStart) + ' of ' + vmFmtTime(info.durationS) : vmFmtTime(info.durationS)) +
            ' - ' + (ds.w && ds.h ? ds.w + 'x' + ds.h + ' ' + vmOrientation(ds.w, ds.h) : 'size unknown');
        if (info.hasAudio === false) m += ' - no sound';
        return m;
    }

    function vmCardHtml(c, i) {
        var cls = 'vm-card' + (vm.selectedId === c.id ? ' vm-selected' : '') + (c.kind === 'error' ? ' vm-err' : '');
        var thumb;
        if (c.thumb) thumb = '<img src="' + c.thumb + '" alt="" draggable="false">';
        else if (c.kind === 'probing') thumb = '<span class="vm-spin" aria-hidden="true"></span>';
        else thumb = '<span class="vm-film" aria-hidden="true">&#9654;</span>';
        // Kept part of the clip at a glance; tapping it opens the trim editor.
        var range = c.kind === 'ready' ? '<div class="vm-range" data-act="trim" title="Choose the part of this clip to keep">' +
            '<span class="vm-range-kept" style="left:' + vmPct(c.trimStart, c.info.durationS) + ';width:' + vmPct(c.trimEnd - c.trimStart, c.info.durationS) + '"></span></div>' : '';
        var dis = vm.job ? ' disabled' : '';
        var n = vm.clips.length;
        return '<div class="' + cls + '" data-id="' + c.id + '" role="listitem">' +
            '<div class="vm-thumb" title="' + (c.kind === 'ready' ? 'Tap to trim or rotate, drag to reorder' : 'Drag to reorder') + '">' + thumb + '<span class="vm-idx">' + (i + 1) + '</span>' +
                (vmRotOf(c) ? '<span class="vm-rottag">rotated ' + vmRotOf(c) + '&deg;</span>' : '') + (c.muted ? '<span class="vm-mutedtag">muted</span>' : '') + '</div>' +
            '<div class="vm-name" title="' + vmEsc(c.name) + '">' + vmEsc(c.name) + '</div>' +
            '<div class="vm-meta">' + vmEsc(vmCardMeta(c)) + '</div>' + range +
            '<div class="vm-btns">' +
                '<button type="button" data-act="left" aria-label="Move left" title="Move left"' + (i === 0 ? ' disabled' : dis) + '>&#9664;</button>' +
                '<button type="button" data-act="right" aria-label="Move right" title="Move right"' + (i === n - 1 ? ' disabled' : dis) + '>&#9654;</button>' +
                (c.kind === 'ready' ? '<button type="button" data-act="trim"' + dis + '>Trim</button>' +
                    '<button type="button" data-act="mute"' + dis + '>' + (c.muted ? 'Unmute' : 'Mute') + '</button>' +
                    '<button type="button" data-act="preview">Preview</button>' : '') +
                '<button type="button" data-act="remove"' + dis + '>Remove</button>' +
            '</div></div>';
    }

    function vmGapHtml(g) {
        var cur = vm.gaps[g] || 'none';
        var opts = VM_TRANSITIONS.map(function (t) { return '<option value="' + t.v + '"' + (t.v === cur ? ' selected' : '') + '>' + t.label + '</option>'; }).join('');
        return '<div class="vm-gap"><select data-gap="' + g + '" aria-label="Transition between clip ' + (g + 1) + ' and clip ' + (g + 2) + '"' + (vm.job ? ' disabled' : '') + '>' + opts + '</select></div>';
    }

    function vmRenderStrip() {
        var strip = vmEl('vmStrip');
        if (!strip) return;
        if (!vm.clips.length) {
            strip.innerHTML = '<p class="vm-empty">No clips yet. Add two or more videos - they play in the order shown here.</p>';
        } else {
            var html = '';
            vm.clips.forEach(function (c, i) { if (i > 0) html += vmGapHtml(i - 1); html += vmCardHtml(c, i); });
            strip.innerHTML = html;
        }
        var pn = vmEl('vmPanelName'), sel = vmClipById(vm.selectedId);
        if (pn && sel) pn.textContent = (vmIndexOf(sel.id) + 1) + '. ' + sel.name;
        vmRenderCount();
        vmUpdateButtons();
    }

    function vmRenderCount() {
        var count = vmEl('vmCount');
        if (!count) return;
        var ready = vm.clips.filter(function (c) { return c.kind === 'ready'; });
        var total = 0;
        if (ready.length === vm.clips.length && vm.clips.length) total = vmTimeline().total;
        count.textContent = vm.clips.length ? (vm.clips.length + ' clip' + (vm.clips.length > 1 ? 's' : '') + (total ? ' - merged length about ' + vmFmtTime(total) : '')) : '';
    }

    function vmRenderMusic() {
        var name = vmEl('vmMusicName'), rm = vmEl('vmRemoveMusic'), opts = vmEl('vmMusicOpts');
        if (!name) return;
        if (vm.music) {
            name.textContent = vm.music.name + ' (' + vmFmtTime(vm.music.duration) + ')';
            rm.hidden = false; opts.hidden = false;
            var radios = document.querySelectorAll('input[name="vmClipAudio"]');
            for (var i = 0; i < radios.length; i++) radios[i].checked = radios[i].value === vm.clipAudio;
        } else {
            name.textContent = 'No music added.';
            rm.hidden = true; opts.hidden = true;
        }
    }

    function vmUpdateButtons() {
        var btn = vmEl('vmMerge');
        if (!btn) return;
        var ready = vm.clips.length >= 2 && vm.clips.every(function (c) { return c.kind === 'ready'; });
        btn.disabled = !ready || !!vm.job;
        var hint = vmEl('vmMergeHint');
        if (hint) {
            if (vm.job) hint.textContent = '';
            else if (vm.clips.length < 2) hint.textContent = 'Add at least 2 clips to merge.';
            else if (vm.clips.some(function (c) { return c.kind === 'probing'; })) hint.textContent = 'Reading clips...';
            else if (vm.clips.some(function (c) { return c.kind === 'error'; })) hint.textContent = 'Remove the clips marked with an error to continue.';
            else hint.textContent = '';
        }
    }

    function vmRenderAll() {
        vmRenderStrip();
        vmRenderMusic();
        vmScheduleOutputLine();
    }

    var vmOutTimer = null;
    function vmScheduleOutputLine() {
        clearTimeout(vmOutTimer);
        vmOutTimer = setTimeout(vmUpdateOutputLine, 250);
    }
    async function vmUpdateOutputLine() {
        var el = vmEl('vmOutputLine');
        if (!el) return;
        var token = ++vm.planToken;
        if (vm.clips.length < 2 || vm.clips.some(function (c) { return c.kind !== 'ready'; })) { el.textContent = ''; return; }
        try {
            var plan = await vmPlan(true);
            if (token === vm.planToken) el.textContent = vmDescribePlan(plan);
        } catch (e) {
            if (token === vm.planToken) el.textContent = e && e.vmUser ? e.message : '';
        }
    }

    function vmSetBusy(busy, engine) {
        var prog = vmEl('vmProgress'), badge = vmEl('vmEngineBadge');
        if (busy) {
            prog.hidden = false;
            vmEl('vmBarFill').style.width = '0%';
            vmEl('vmProgressTxt').textContent = 'Starting...';
            vmEl('vmHiddenWarn').hidden = true;
            badge.textContent = vmEngineLabel(engine);

            if (document.hidden && vm.job) { vm.job.hidden = true; var w = vmEl('vmHiddenWarn'); if (w) w.hidden = false; }
            if (!document.hidden && vm.job && !vm.wake) vmWakeLock();
        });
        window.addEventListener('pagehide', function () { vm.clips.forEach(vmReleaseClip); vmClearResult(); });

        vmRenderAll();
    }
</script>

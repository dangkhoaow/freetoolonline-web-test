<script>
    // 3D scene archetype skeleton (Strong Gravitational Lensing 3D Explorer) -
    // vendored three.js (ESM, dynamic import from /vendor/three/, NO CDN),
    // fully client-side. Built LEAN, forked from the borisov-interstellar-comet
    // shape - ONE scene only (a case-selectable multi-image/arc lensing
    // illustration). All geometry is procedural (spheres for the lens core and
    // lensed images, a RingGeometry for the critical curve, BufferGeometry+Line
    // for the Abell-2218-style arcs). No mass-distribution equation is solved;
    // image positions/opacities and arc stretch are parametric functions of an
    // alignment-offset slider chosen to illustrate the qualitative behavior.
    //
    // EDUCATIONAL APPROXIMATION, not a physics simulation or a numerically
    // solved lens equation. The 4 image markers and the 3 arc lines are
    // stylized illustrations of how image count/arc stretch changes with
    // source-lens alignment - not a ray-traced reconstruction of either real
    // object's exact measured mass distribution.
    //
    // Published figures (cross-checked via WebSearch 2026-07-25; sources:
    // Huchra et al. 1985, ApJ, "2237+0305: A New and Unusual Gravitational
    // Lens" - discovery of the Einstein Cross quasar Q2237+0305; NASA/ESA
    // Hubble Space Telescope Abell 2218 imaging + published group/arc
    // redshift figures):
    //   - Einstein Cross (Q2237+0305): a quasar at redshift about 1.695,
    //     lensed by a foreground galaxy at redshift about 0.0394 into 4
    //     separate point images arranged around the lens. Discovered by
    //     Huchra et al. in 1985.
    //   - Abell 2218: a massive group of galaxies at redshift about 0.171 whose
    //     combined gravity stretches dozens of background galaxies, some out
    //     to redshift about 2.5, into long thin arcs - one of the most famous
    //     strong-lensing images captured by the Hubble Space Telescope.
    //   - General rule illustrated: near-perfect source-lens alignment along
    //     the line of sight produces more images or longer arcs; moving away
    //     from that alignment fades the extra images toward a single
    //     dominant, only mildly distorted image.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'stronglensingmultipleimages';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'stronglensing'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published case figures (cross-checked via WebSearch 2026-07-25;
    // sources in the header comment above).
    var T3D_LENS_CASES = {
        cross: {
            label: 'Einstein Cross (Q2237+0305)',
            lensZ: '0.0394',
            sourceZ: '1.695',
            imageCount: '4 point images',
            discovery: 'Huchra et al., 1985',
            note: 'A single quasar behind one foreground galaxy, split into 4 point images arranged around the lens.'
        },
        abell: {
            label: 'Abell 2218 galaxy group',
            lensZ: '0.171',
            sourceZ: 'up to about 2.5',
            imageCount: 'Dozens of arcs',
            discovery: 'Hubble Space Telescope imaging',
            note: 'A massive group of galaxies whose combined gravity stretches many background galaxies into long thin arcs.'
        }
    };

    function t3dLensBuildArc(line, angleDeg, radius, stretchDeg) {
        var pos = line.geometry.attributes.position.array;
        var n = pos.length / 3;
        var a0 = (angleDeg - stretchDeg / 2) * Math.PI / 180;
        var a1 = (angleDeg + stretchDeg / 2) * Math.PI / 180;
        for (var k = 0; k < n; k++) {
            var t = a0 + (a1 - a0) * (k / (n - 1));
            pos[k * 3] = radius * Math.cos(t);
            pos[k * 3 + 1] = 0.12;
            pos[k * 3 + 2] = radius * Math.sin(t);
        }
        line.geometry.attributes.position.needsUpdate = true;
    }

    function t3dStrongLensing(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x05070d, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        var starN = shell.low ? 320 : 650;
        var starPos = new Float32Array(starN * 3);
        var starCol = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r = 40 + Math.random() * 60;
            var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r * Math.sin(ph) * Math.cos(th);
            starPos[s * 3 + 1] = r * Math.cos(ph);
            starPos[s * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
            var tint = 0.75 + Math.random() * 0.25;
            var warmth = Math.random();
            starCol[s * 3] = tint;
            starCol[s * 3 + 1] = tint * (0.9 + warmth * 0.1);
            starCol[s * 3 + 2] = tint * (0.85 + (1 - warmth) * 0.15);
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ vertexColors: true, size: 0.34, sizeAttenuation: true, transparent: true, opacity: 0.85 })));

        // Foreground lens: invisible mass, marked by a bright halo + dark core.
        var lensGlow = new THREE.Mesh(new THREE.SphereGeometry(1.7, 24, 18), new THREE.MeshBasicMaterial({ color: 0x5f86c4, transparent: true, opacity: 0.55 }));
        scene.add(lensGlow);
        var lensCore = new THREE.Mesh(new THREE.SphereGeometry(0.75, 20, 16), new THREE.MeshBasicMaterial({ color: 0x24304a }));
        scene.add(lensCore);

        // Critical-curve ring (illustrative radius, not a solved Einstein radius for either object).
        var RE = 3.4;
        var ring = new THREE.Mesh(
            new THREE.RingGeometry(RE - 0.28, RE + 0.28, 64),
            new THREE.MeshBasicMaterial({ color: 0xcdeeff, transparent: true, opacity: 0.75, side: THREE.DoubleSide })
        );
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // Background source (quasar/galaxy).
        var source = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14), new THREE.MeshBasicMaterial({ color: 0xffe066 }));
        scene.add(source);
        var sourceLight = new THREE.PointLight(0xfff2cc, 2.2, 60);
        scene.add(sourceLight);

        // 4 point-image markers (Einstein Cross case).
        var imgMeshes = [];
        for (var i = 0; i < 4; i++) {
            var m = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), new THREE.MeshBasicMaterial({ color: 0x9fe3ff, transparent: true, opacity: 1 }));
            scene.add(m);
            imgMeshes.push(m);
        }

        // 3 arc lines (Abell 2218 case).
        var arcLines = [];
        for (var a = 0; a < 3; a++) {
            var geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(33 * 3), 3));
            var line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffb37a, transparent: true, opacity: 0.9, linewidth: 3 }));
            scene.add(line);
            arcLines.push(line);
        }

        var state = { caseId: 'cross', offset: 0 };

        function panelHtml(off, visibleCount, shapeWord) {
            var c = T3D_LENS_CASES[state.caseId];
            return '<h3>' + c.label + '</h3>' +
                '<p>' + c.note + '</p>' +
                '<table class="w3-table w3-small" style="margin-bottom:8px;">' +
                '<tr><td><b>Lens redshift</b></td><td>' + c.lensZ + '</td></tr>' +
                '<tr><td><b>Source redshift</b></td><td>' + c.sourceZ + '</td></tr>' +
                '<tr><td><b>Image count</b></td><td>' + c.imageCount + '</td></tr>' +
                '<tr><td><b>Discovery</b></td><td>' + c.discovery + '</td></tr>' +
                '</table>' +
                '<p>Alignment offset: ' + Math.round(off * 100) + '%. Visible ' + shapeWord + ' right now: ' + visibleCount + '.</p>' +
                '<p class="t3d-note">Educational approximation - image count, spacing, and arc stretch are stylized to show how alignment changes the lensing pattern, not a numerically-solved lens equation for either object.</p>';
        }

        function apply() {
            var off = state.offset / 100; // 0..1
            var sx = off * 9;
            source.position.set(sx, 0.25, -RE * 1.7);
            sourceLight.position.copy(source.position);

            var visibleCount, shapeWord;
            if (state.caseId === 'cross') {
                arcLines.forEach(function (l) { l.visible = false; });
                imgMeshes.forEach(function (m) { m.visible = true; });
                var majorR = RE * (1 + off * 0.35);
                var minorR = Math.max(0.15, RE * (1 - off * 0.85));
                var perpR = RE * (1 - off * 0.1);
                var perpOpacity = Math.max(0, 1 - off / 0.5);
                var minorOpacity = Math.max(0.06, 1 - off * 0.9);
                var positions = [
                    { ang: 0, r: majorR, op: 0.95 },
                    { ang: 90, r: perpR, op: perpOpacity },
                    { ang: 180, r: minorR, op: minorOpacity },
                    { ang: 270, r: perpR, op: perpOpacity }
                ];
                for (var pI = 0; pI < 4; pI++) {
                    var p = positions[pI];
                    var rad = p.ang * Math.PI / 180;
                    imgMeshes[pI].position.set(p.r * Math.cos(rad), 0.15, p.r * Math.sin(rad));
                    imgMeshes[pI].material.opacity = p.op;
                }
                visibleCount = 1 + (perpOpacity > 0.08 ? 2 : 0) + (minorOpacity > 0.12 ? 1 : 0);
                shapeWord = 'images';
            } else {
                imgMeshes.forEach(function (m) { m.visible = false; });
                arcLines.forEach(function (l) { l.visible = true; });
                var stretch = 70 - off * 55;
                var baseAngles = [20, 140, 250];
                for (var j = 0; j < 3; j++) {
                    t3dLensBuildArc(arcLines[j], baseAngles[j], RE * (1.35 + j * 0.28), Math.max(10, stretch - j * 6));
                    arcLines[j].material.opacity = 0.95 - off * 0.35;
                }
                visibleCount = 3;
                shapeWord = 'arcs';
            }
            ring.material.opacity = 0.4 + (1 - off) * 0.4;

            t3dInfo(panelHtml(off, visibleCount, shapeWord));
            try { t3dSaveStore({ caseId: state.caseId, offset: state.offset }); } catch (e) {}
        }

        var btnCross = document.getElementById('t3dLensCaseCross');
        var btnAbell = document.getElementById('t3dLensCaseAbell');
        var scrub = document.getElementById('t3dLensScrub');

        var store = t3dLoadStore();
        if (store.caseId === 'cross' || store.caseId === 'abell') { state.caseId = store.caseId; }
        if (typeof store.offset === 'number') { state.offset = Math.max(0, Math.min(100, store.offset)); }
        if (scrub) { scrub.value = String(state.offset); }
        apply();

        if (btnCross) { btnCross.addEventListener('click', function () { state.caseId = 'cross'; apply(); }); }
        if (btnAbell) { btnAbell.addEventListener('click', function () { state.caseId = 'abell'; apply(); }); }
        if (scrub) { scrub.addEventListener('input', function () { state.offset = parseInt(scrub.value || '0', 10); apply(); }); }

        t3dStatus('Drag to orbit, scroll to zoom. Pick a case and drag the alignment slider to see the images or arcs change.');
        return function animate(dt) {
            lensGlow.rotation.y += dt * 0.0003;
            ring.rotation.z += dt * 0.00015;
            var t = Date.now() * 0.002;
            for (var k = 0; k < imgMeshes.length; k++) {
                imgMeshes[k].scale.setScalar(1 + 0.05 * Math.sin(t + k));
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { stronglensing: 't3dLensControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { stronglensing: { radius: 13, maxR: 70, minR: 5, phi: 1.05, theta: 0.5, targetY: 0.3 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dStrongLensing(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

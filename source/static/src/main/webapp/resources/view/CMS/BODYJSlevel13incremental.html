<script>
    // Level 13 launcher. The game is the open-source Level 13 engine
    // (nroutasuo/level13, Apache-2.0 - full analysis in
    // tool-level13incremental/SKILL.md), vendored as static files on the
    // ftol-vm-assets CDN in an isolated same-origin iframe: jQuery/Require.js/
    // Ash.js, ~8 MB total. GoatCounter + GlitchTip external CDN scripts
    // stripped; localStorage keys namespaced under ftol:level13:*. The
    // iframe loads only when the reader presses Play.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var L13_GAME_URL = 'https://gh-static.freetool.online/games/level-13-incremental/index.html';

    function l13Status(text) {
        var el = document.getElementById('l13Status');
        if (el) el.textContent = text;
    }

    function l13InjectFrame(stage) {
        var frame = document.createElement('iframe');
        frame.id = 'l13Frame';
        frame.src = L13_GAME_URL;
        frame.title = 'Level 13 game';
        frame.setAttribute('allow', 'fullscreen');
        frame.setAttribute('allowfullscreen', '');
        frame.addEventListener('load', function () {
            l13Status('Game loaded.');
            try { frame.contentWindow.focus(); } catch (e) { /* focus is best-effort */ }
        });
        var launch = document.getElementById('l13Launch');
        if (launch && launch.parentNode === stage) { stage.removeChild(launch); }
        stage.appendChild(frame);
        return frame;
    }

    function doAfterPageRendered() {
        var stage = document.getElementById('l13Stage');
        var playBtn = document.getElementById('l13PlayBtn');
        if (!stage || !playBtn) return; // not this page

        var fsBtn = document.getElementById('l13FullscreenBtn');
        playBtn.addEventListener('click', function () {
            l13Status('Loading the game (about 8 MB, one time - then cached)...');
            l13InjectFrame(stage);
            if (fsBtn) fsBtn.disabled = false;
        });

        if (fsBtn) fsBtn.addEventListener('click', function () {
            if (stage.requestFullscreen) { stage.requestFullscreen(); }
            else if (stage.webkitRequestFullscreen) { stage.webkitRequestFullscreen(); }
            var frame = document.getElementById('l13Frame');
            if (frame) { try { frame.contentWindow.focus(); } catch (e) { } }
        });
    }
</script>

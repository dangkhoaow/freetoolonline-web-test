    // Registry Gate-H entry: video_thumbnail_extractor (operator-verified
    // 2026-05-18). 100% client-side: the picked video opens as an object URL
    // on a muted <video> element; a frame is captured by drawing the video
    // onto a canvas sized to videoWidth x videoHeight and exported with
    // canvas.toBlob() as PNG or JPEG. No upload, no FFmpeg, no network.
    // Framework contract: doAfterPageRendered(); no top-level DOM.

    // NOTE (fire755): this skeleton exists because the generic media-converter
    // guard used to steal `video-*-extractor` slugs and emit an FFmpeg.wasm

    // A thumbnail extractor is a seek-and-draw job - no re-encode, no wasm.

    // EMBEDDED tiny VP8/WebM clip (data: URL - no fetch) and extracts a real
    // frame from it into .outputImgs with a working PNG download link -
    // proving the whole seek -> drawImage -> toBlob pipeline runs before the
    // reader picks a file. WebM/VP8 is used because open Chromium builds
    // (headless e2e) ship without proprietary H.264 decoders.

    function vteFmtTime(t) {
        if (!isFinite(t)) return '0.0s';
        return (Math.round(t * 10) / 10).toFixed(1) + 's';
    }

    function vteCodecMessage(videoEl, fallback) {
        var err = videoEl && videoEl.error;
        if (err && (err.code === 3 || err.code === 4)) {
            return 'Your browser cannot decode this video (unsupported codec or container). Try an MP4 (H.264) or WebM file, or open this page in Chrome, Edge or Safari.';
        }
        return fallback || 'Could not read this video file.';
    }

    // Seek the video element and resolve when the frame is actually ready
    // (`seeked` event), per the video_thumbnail_extractor registry acceptance
    // criteria. A timeout guards against codecs that never finish seeking -
    // the reader gets a clear error, never a silent black canvas.
    function vteSeek(videoEl, time) {
        return new Promise(function (resolve, reject) {
            var done = false;
            function onSeeked() { if (done) return; done = true; cleanup(); resolve(); }
            function onError() { if (done) return; done = true; cleanup(); reject(new Error(vteCodecMessage(videoEl))); }
            function cleanup() {
                videoEl.removeEventListener('seeked', onSeeked);
                videoEl.removeEventListener('error', onError);
                clearTimeout(timer);
            }
            var timer = setTimeout(function () {
                if (done) return; done = true; cleanup();
                reject(new Error('The video did not finish seeking - the codec may be unsupported by this browser.'));
            }, 6000);
            videoEl.addEventListener('seeked', onSeeked);
            videoEl.addEventListener('error', onError);
            if (Math.abs(videoEl.currentTime - time) < 0.01 && videoEl.readyState >= 2) {
                done = true; cleanup(); resolve(); return;
            }
            try { videoEl.currentTime = time; } catch (e) { done = true; cleanup(); reject(e); }
        });
    }

    // Draw the current frame to a canvas and export it as a Blob.
    function vteGrabFrame(videoEl, mime, quality) {
        return new Promise(function (resolve, reject) {
            var w = videoEl.videoWidth, h = videoEl.videoHeight;
            if (!w || !h) {
                reject(new Error('No decodable video track found (the file may be audio-only, or the codec is unsupported).'));
                return;
            }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, w, h);
            canvas.toBlob(function (blob) {
                if (!blob) { reject(new Error('Could not encode the frame as an image.')); return; }
                resolve({ blob: blob, w: w, h: h });
            }, mime, quality);
        });
    }

        var root = document.getElementById('videoThumbnailTool');
        if (!root) return; // not a video-thumbnail page

            '<div class="w3-row" style="margin-bottom:8px;"><input type="file" id="vteFile" accept="video/*,.mp4,.webm,.mov,.m4v,.ogv,.mkv,.avi" class="w3-input w3-border" style="max-width:420px;margin:0 auto;"></div>' +

            '<div id="vtePlayerWrap" style="display:none;max-width:520px;margin:0 auto;">' +
              '<video id="vteVideo" muted playsinline preload="metadata" style="max-width:100%;max-height:260px;background:#000;border-radius:4px;"></video>' +
              '<div style="margin:6px 0;"><input type="range" id="vteScrub" min="0" max="0" step="0.01" value="0" style="width:70%;vertical-align:middle;"> <span id="vteTimeLabel" style="font-variant-numeric:tabular-nums;">0.0s</span></div>' +

                '<label>Format <select id="vteFormat" class="w3-border"><option value="image/png" selected>PNG (lossless)</option><option value="image/jpeg">JPEG (smaller)</option></select></label> ' +

              '</div>' +
              '<div style="margin:8px 0;">' +
                '<button id="vteCaptureBtn" class="w3-button w3-blue">Capture this frame</button> ' +
                '<button id="vteGridBtn" class="w3-button w3-light-grey w3-border" style="margin-left:8px;">Grab 6 evenly spaced frames</button>' +
              '</div>' +
            '</div>' +
            '<div class="w3-row outputImgs" id="vteOut" style="visibility:visible !important;text-align:center;max-width:640px;margin:0 auto;"></div>';

        var fileEl = root.querySelector('#vteFile');
        var statusEl = root.querySelector('#vteStatus');
        var playerWrap = root.querySelector('#vtePlayerWrap');
        var videoEl = root.querySelector('#vteVideo');
        var scrubEl = root.querySelector('#vteScrub');
        var timeEl = root.querySelector('#vteTimeLabel');
        var formatEl = root.querySelector('#vteFormat');
        var qualityEl = root.querySelector('#vteQuality');
        var captureBtn = root.querySelector('#vteCaptureBtn');
        var gridBtn = root.querySelector('#vteGridBtn');
        var outEl = root.querySelector('#vteOut');
        var currentUrl = null;
        var currentBase = 'video';
        var thumbUrls = [];

        function setStatus(m) { statusEl.textContent = m; }

        function clearThumbs() {
            for (var i = 0; i < thumbUrls.length; i++) URL.revokeObjectURL(thumbUrls[i]);
            thumbUrls = []; vteThumbCount = 0; outEl.innerHTML = '';
        }

        function pickedMime() { return formatEl.value; }
        function pickedQuality() { return pickedMime() === 'image/jpeg' ? parseFloat(qualityEl.value) : undefined; }
        function extFor(mime) { return mime === 'image/jpeg' ? 'jpg' : 'png'; }

        function renderThumb(res, time, mime, linkId) {
            if (vteThumbCount >= VTE_MAX_THUMBS) { setStatus('Thumbnail limit reached - download or reload the page to grab more.'); return; }
            vteThumbCount++;
            var url = URL.createObjectURL(res.blob);
            thumbUrls.push(url);
            var name = currentBase + '-t' + (Math.round(time * 10) / 10) + 's.' + extFor(mime);
            var card = document.createElement('div');
            card.style.cssText = 'display:inline-block;vertical-align:top;margin:6px;max-width:180px;';
            card.innerHTML =
                '<img src="' + url + '" alt="Extracted frame at ' + vteFmtTime(time) + '" style="max-width:170px;border:1px solid #e0e0e0;border-radius:4px;display:block;margin:0 auto;">' +
                '<div style="font-size:0.85em;color:#555;margin:2px 0;">' + vteFmtTime(time) + ' - ' + res.w + 'x' + res.h + '</div>' +
                '<a class="w3-button w3-blue w3-small"' + (linkId ? ' id="' + linkId + '"' : '') + ' href="' + url + '" download="' + name + '">Download ' + extFor(mime).toUpperCase() + '</a>';
            outEl.appendChild(card);
        }

        function captureAt(time, mime, quality, linkId) {
            return vteSeek(videoEl, time).then(function () {
                return vteGrabFrame(videoEl, mime, quality);
            }).then(function (res) {
                renderThumb(res, videoEl.currentTime, mime, linkId);
                return res;
            });
        }

        // ---- On-load demo (G16): extract a real frame from the embedded clip.
        (function runDemo() {
            var demo = document.createElement('video');
            demo.muted = true; demo.playsInline = true; demo.preload = 'auto';
            demo.addEventListener('loadedmetadata', function () {
                var t = Math.min(0.5, (demo.duration || 1) / 2);
                vteSeek(demo, t).then(function () {
                    return vteGrabFrame(demo, 'image/png');
                }).then(function (res) {
                    var url = URL.createObjectURL(res.blob);
                    thumbUrls.push(url);
                    var card = document.createElement('div');
                    card.style.cssText = 'display:inline-block;vertical-align:top;margin:6px;max-width:200px;';
                    card.innerHTML =
                        '<img src="' + url + '" alt="Demo frame extracted from the embedded sample clip" style="max-width:190px;border:1px solid #e0e0e0;border-radius:4px;display:block;margin:0 auto;">' +
                        '<div style="font-size:0.85em;color:#555;margin:2px 0;">Sample clip frame - ' + res.w + 'x' + res.h + '</div>' +
                        '<a id="vteDl" class="w3-button w3-blue w3-small" href="' + url + '" download="sample-frame.png">Download PNG</a>';
                    outEl.appendChild(card);
                    setStatus('Demo frame extracted locally from an embedded sample clip. Pick your own video above - it never leaves your browser.');
                }).catch(function (e) {
                    setStatus('Ready. Pick a video above to extract thumbnails (demo skipped: ' + e.message + ')');
                });
            });
            demo.addEventListener('error', function () {
                setStatus('Ready. Pick a video above to extract thumbnails - frames are captured entirely in your browser.');
            });
            demo.src = 'data:video/webm;base64,' + VTE_DEMO_WEBM_B64;
        })();

        // ---- Reader path: local file -> object URL -> scrub -> capture.
        fileEl.addEventListener('change', function () {
            var f = fileEl.files && fileEl.files[0];
            if (!f) return;
            if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
            clearThumbs();
            currentBase = String(f.name || 'video').replace(/\.[a-z0-9]+$/i, '') || 'video';
            currentUrl = URL.createObjectURL(f);
            setStatus('Opening ' + f.name + '...');
            videoEl.src = currentUrl;
        });

        videoEl.addEventListener('loadedmetadata', function () {
            playerWrap.style.display = 'block';
            var d = videoEl.duration;
            scrubEl.max = isFinite(d) ? d.toFixed(2) : 0;
            scrubEl.value = 0;
            timeEl.textContent = vteFmtTime(0);
            setStatus('Loaded ' + (videoEl.videoWidth || '?') + 'x' + (videoEl.videoHeight || '?') + ', ' + vteFmtTime(d) + '. Scrub to a frame, then capture it.');
        });

        videoEl.addEventListener('error', function () {
            playerWrap.style.display = 'none';
            setStatus(vteCodecMessage(videoEl));
        });

        // Live preview: seeking the visible <video> shows the frame instantly.
        scrubEl.addEventListener('input', function () {
            var t = parseFloat(scrubEl.value) || 0;
            timeEl.textContent = vteFmtTime(t);
            try { videoEl.currentTime = t; } catch (e) { /* not seekable yet */ }
        });

        captureBtn.addEventListener('click', function () {
            captureBtn.disabled = true;
            var t = parseFloat(scrubEl.value) || videoEl.currentTime || 0;
            setStatus('Capturing frame at ' + vteFmtTime(t) + '...');
            captureAt(t, pickedMime(), pickedQuality()).then(function () {
                setStatus('Frame captured at ' + vteFmtTime(t) + ' - nothing was uploaded.');
            }).catch(function (e) {
                setStatus(e.message);
            }).then(function () { captureBtn.disabled = false; });
        });

        gridBtn.addEventListener('click', function () {
            var d = videoEl.duration;
            if (!isFinite(d) || d <= 0) { setStatus('Load a video first.'); return; }
            gridBtn.disabled = true; captureBtn.disabled = true;
            setStatus('Grabbing 6 evenly spaced frames...');
            var mime = pickedMime(), q = pickedQuality();
            var chain = Promise.resolve();
            for (var i = 0; i < 6; i++) {
                (function (idx) {
                    chain = chain.then(function () {
                        return captureAt(d * (idx + 0.5) / 6, mime, q);
                    });
                })(i);
            }
            chain.then(function () {
                setStatus('6 frames extracted - use the download links under each thumbnail.');
            }).catch(function (e) {
                setStatus(e.message);
            }).then(function () { gridBtn.disabled = false; captureBtn.disabled = false; });
        });
    }
</script>

<div class="w3-container">
    <p>Type a top caption, a bottom caption, or both - the text auto-shrinks and wraps so it never spills past the edges of the image.</p>
</div>

<style>
    #memeMakerTool .mm-row { margin-bottom: 12px; }
    #memeMakerTool .mm-controls {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: center; margin: 12px 0;
    }
    #memeMakerTool .mm-field { display: flex; flex-direction: column; min-width: 160px; }
    #memeMakerTool .mm-field label { font-size: 0.85em; margin-bottom: 4px; }
    #memeMakerTool canvas {
        display: block; max-width: 100%; height: auto; margin: 12px auto;
        border: 1px solid #ccc;
        background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 16px 16px;
    }
    #memeMakerTool .mm-status {
        font-family: monospace; min-height: 1.4em; margin-top: 8px; text-align: center;
    }
</style>

<div id="memeMakerTool" class="w3-container outputImgs" style="text-align:center; visibility:visible !important; min-height:220px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>
    <div class="mm-row">
        <label class="w3-label" for="mmFile"><b>Source image</b></label>
        <input type="file" id="mmFile" accept="image/*" class="w3-input w3-border" style="max-width:420px;margin:0 auto;">
    </div>
    <div class="mm-controls">
        <div class="mm-field">
            <label for="mmTop">Top caption</label>
            <input type="text" id="mmTop" class="w3-input w3-border" placeholder="TOP TEXT">
        </div>
        <div class="mm-field">
            <label for="mmBottom">Bottom caption</label>
            <input type="text" id="mmBottom" class="w3-input w3-border" placeholder="BOTTOM TEXT">
        </div>
        <div class="mm-field">
            <label for="mmSize">Font size (<span id="mmSizeVal">auto</span>)</label>
            <input type="range" id="mmSize" min="0" max="200" value="0" oninput="document.getElementById('mmSizeVal').textContent=(this.value==='0'?'auto':this.value+'px')">
        </div>
        <div class="mm-field">
            <label for="mmUppercase">ALL CAPS</label>
            <input type="checkbox" id="mmUppercase" checked>
        </div>
    </div>
    <canvas id="mmCanvas" width="480" height="360"></canvas>
    <div class="mm-row">
        <button id="mmDownload" class="w3-button w3-green" style="display:none;">Download meme</button>
    </div>
    <p id="mmStatus" class="mm-status" aria-live="polite">Choose an image, then type a top and/or bottom caption. Everything runs in this tab - nothing is uploaded.</p>
</div>

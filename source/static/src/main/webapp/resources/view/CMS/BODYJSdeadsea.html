<script>
    // 3D scene archetype skeleton (dead-sea) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (dead-sea).
    // All geometry is procedural. places-3d cluster seed 2026-07-27.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus, cross-checked 2026-07-27):
    //   - Surface about 430 m below sea level - lowest land elevation on Earth
    //   - Salinity about 34% (roughly 9-10x ocean); density about 1.24 kg/L
    //   - Maximum depth about 300 m; length about 50 km
    //   - Terminal lake fed by the Jordan River, no outlet; level drops ~1 m/yr
    //   - Between Jordan (east) and Israel / the West Bank (west)
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'dead-sea';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesdeadsea'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0a1220, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var key = new THREE.DirectionalLight(0xfff2d0, 0.95);
        key.position.set(-10, 16, 8);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
        }

        // Rift-valley relief, 1 unit = 100 m vertical. North-south trough
        // (the Jordan Rift) between the Judean hills (west, ~ +500 m) and the
        // Moab plateau (east, ~ +800 m); valley floor near -460 m; lake
        // surface at about -430 m. Plane: x = east-west, z = north-south.
        var FLOOR = -4.6, LAKE_Y = -4.3;
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        // North basin outline: elongated blob; southern evaporation ponds zone.
        function inNorthBasin(x, z) {
            if (z > 2.4) return false;
            var cz = Math.max(-8.5, Math.min(2.4, z));
            var half = 2.2 * (1 - Math.pow(Math.abs(z + 3) / 6.4, 2.4)) + 0.35 * (vnoise(z * 0.5 + 3, 7) - 0.5);
            return half > 0.2 && Math.abs(x - 0.35 * Math.sin(z * 0.35)) < half;
        }
        function inPondZone(x, z) { return z > 3.0 && z < 8.2 && Math.abs(x) < 2.1; }
        function height(x, z) {
            var west = smooth(-2.6, -6.5, x) * (5.0 + 1.5 * fbm(x * 0.5 + 2, z * 0.32, 4));
            var east = smooth(2.6, 6.8, x) * (8.0 + 2.0 * fbm(x * 0.5 + 9, z * 0.3 + 4, 4));
            var h = FLOOR + west + east + 0.5 * (fbm(x * 0.7 + 5, z * 0.45 + 1, 4) - 0.5);
            if (inNorthBasin(x, z)) h = Math.min(h, LAKE_Y - 0.5);   // basin below water
            if (inPondZone(x, z)) h = Math.min(h, LAKE_Y - 0.05);    // flat pond flats
            return h;
        }
        var col = { desert: new THREE.Color(0xc9b08a), rock: new THREE.Color(0x9a825f), salt: new THREE.Color(0xf2f5f4), deep: new THREE.Color(0x6e5f49) };
        function color(c, h, x, z) {
            var n = 0.9 + 0.2 * fbm(x * 1.3 + 11, z * 1.3 + 7, 3);
            if (h > 0.5) c.copy(col.rock).lerp(col.desert, smooth(6, 1, h)).multiplyScalar(n);
            else if (h < LAKE_Y + 0.15) c.copy(col.deep).multiplyScalar(n);
            else c.copy(col.desert).multiplyScalar(n);
            // salt fringe just above the shoreline
            if (h > LAKE_Y - 0.02 && h < LAKE_Y + 0.35 && (inNearShore(x, z))) c.copy(col.salt).multiplyScalar(0.95 + 0.1 * n);
        }
        function inNearShore(x, z) {
            for (var dx = -0.45; dx <= 0.45; dx += 0.45) for (var dz = -0.45; dz <= 0.45; dz += 0.45)
                if (inNorthBasin(x + dx, z + dz) || inPondZone(x + dx, z + dz)) return true;
            return false;
        }
        var terrain = makeTerrain(14, 20, shell.low ? 90 : 150, shell.low ? 130 : 210, height, color);
        scene.add(terrain);

        // North-basin water: dark, near-black navy like the satellite view.
        var north = new THREE.Group();
        (function () {
            var shape = new THREE.Shape();
            var pts = [];
            for (var z = -8.4; z <= 2.4; z += 0.4) {
                var half = 2.2 * (1 - Math.pow(Math.abs(z + 3) / 6.4, 2.4));
                if (half < 0.22) continue;
                pts.push([0.35 * Math.sin(z * 0.35) - half, z]);
            }
            for (var z2 = 2.4; z2 >= -8.4; z2 -= 0.4) {
                var half2 = 2.2 * (1 - Math.pow(Math.abs(z2 + 3) / 6.4, 2.4));
                if (half2 < 0.22) continue;
                pts.push([0.35 * Math.sin(z2 * 0.35) + half2, z2]);
            }
            shape.moveTo(pts[0][0], pts[0][1]);
            for (var i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
            var geo = new THREE.ShapeGeometry(shape);
            geo.rotateX(-Math.PI / 2);
            var m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x0c2233, roughness: 0.1, metalness: 0.15 }));
            m.position.y = LAKE_Y;
            north.add(m);
        })();
        scene.add(north);

        // Southern evaporation ponds: the striped turquoise/green pans the
        // satellite view is famous for (industrial salt evaporation).
        var ponds = new THREE.Group();
        var pondCols = [0x2aa6a0, 0x7DAFA3, 0x36b3a8, 0x8fc7b8];
        for (var r = 0; r < 6; r++) {
            var pz = 3.35 + r * 0.8;
            var pond = new THREE.Mesh(
                new THREE.BoxGeometry(3.9 - Math.abs(r - 2.5) * 0.35, 0.05, 0.68),
                new THREE.MeshStandardMaterial({ color: pondCols[r % pondCols.length], roughness: 0.2 })
            );
            pond.position.set(0.1 * Math.sin(r * 1.7), LAKE_Y - 0.02, pz);
            ponds.add(pond);
            var dike = new THREE.Mesh(
                new THREE.BoxGeometry(4.0 - Math.abs(r - 2.5) * 0.35, 0.07, 0.09),
                new THREE.MeshStandardMaterial({ color: 0xf2f5f4, roughness: 0.7 })
            );
            dike.position.set(0.1 * Math.sin(r * 1.7), LAKE_Y, pz + 0.38);
            ponds.add(dike);
        }
        scene.add(ponds);

        // Sea-level datum plane at y=0 - what "-430 m" is measured against.
        var datum = new THREE.Mesh(
            new THREE.PlaneGeometry(15, 21),
            new THREE.MeshBasicMaterial({ color: 0x59c2ff, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide })
        );
        datum.rotation.x = -Math.PI / 2;
        datum.position.y = 0;
        scene.add(datum);
        var datumEdge = new THREE.Mesh(
            new THREE.TorusGeometry(8.4, 0.05, 8, 48),
            new THREE.MeshBasicMaterial({ color: 0x8fd6ff })
        );
        datumEdge.rotation.x = Math.PI / 2;
        scene.add(datumEdge);

        var datumOn = true, saltOn = true;

        function panelHtml() {
            return '<h3>Dead Sea: the lowest place on Earth</h3>' +
                '<p>A north-south rift valley: the dark north basin, the striped evaporation ponds of the shallow south basin, and a translucent plane marking sea level about 430 m above the water.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Surface elevation</td><td>about 430 m below sea level - the lowest land elevation on Earth</td></tr>' +
                '<tr><td>Salinity</td><td>about 34% - roughly 9-10x typical ocean water</td></tr>' +
                '<tr><td>Water density</td><td>about 1.24 kg/L - swimmers float without effort</td></tr>' +
                '<tr><td>Maximum depth</td><td>about 300 m (deepest hypersaline lake on Earth)</td></tr>' +
                '<tr><td>Length</td><td>about 50 km, between Jordan and Israel / the West Bank</td></tr>' +
                '<tr><td>South basin</td><td>shallow evaporation ponds worked for potash and salt - the striped pans in satellite views</td></tr>' +
                '<tr><td>Water balance</td><td>terminal lake - fed by the Jordan River, no outlet; the level drops about 1 m per year</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the valley profile, shoreline, and pond grid are schematic teaching cues, not survey data.</p>';
        }

        function apply() {
            datum.visible = datumOn; datumEdge.visible = datumOn;
            var db = document.getElementById('t3dPdsDatumBtn');
            if (db) db.textContent = 'Sea-level plane: ' + (datumOn ? 'On' : 'Off');
            var sb = document.getElementById('t3dPdsSaltBtn');
            if (sb) sb.textContent = 'Salt ponds: ' + (saltOn ? 'On' : 'Off');
            ponds.visible = saltOn;
            t3dInfo(panelHtml());
            try { t3dSaveStore({ datumOn: datumOn, saltOn: saltOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.datumOn === 'boolean') datumOn = store.datumOn;
        if (typeof store.saltOn === 'boolean') saltOn = store.saltOn;
        apply();

        var datumBtn = document.getElementById('t3dPdsDatumBtn');
        if (datumBtn) datumBtn.addEventListener('click', function () { datumOn = !datumOn; apply(); });
        var saltBtn = document.getElementById('t3dPdsSaltBtn');
        if (saltBtn) saltBtn.addEventListener('click', function () { saltOn = !saltOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the sea-level plane or the salt ponds.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesdeadsea: 't3dPdsControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesdeadsea: { radius: 22, maxR: 55, minR: 7, phi: 0.95, theta: 0.5, targetY: -2 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

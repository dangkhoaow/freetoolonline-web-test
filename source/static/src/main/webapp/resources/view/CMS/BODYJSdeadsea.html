<script>
    // 3D scene archetype skeleton (dead-sea) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (dead-sea).
    // All geometry is procedural. places-3d cluster seed 2026-07-27.
    // DETAILED-TERRAIN migration 2026-08-30 (prompts/places-3d-detailed-terrain-runbook.md,
    // Lake/inland-sea class per runbook 2b, water-surface-datum sub-case per
    // guard 9): the rift-valley basin scene below is the ORIGINAL schematic
    // scene, unchanged, and stays the first-paint default view (needs no
    // network, can never render blank). A NEW Shoreline view fetches real
    // Terrarium DEM elevation + Sentinel-2 true-color imagery of the Ein Gedi
    // Nature Reserve shore (west/Judean Desert bank) from the ftol-vm-assets
    // CDN, IndexedDB-caches it, and becomes selectable via the View button
    // once ready. A CDN failure leaves the View button on "Rift-valley basin"
    // and the page works exactly as before - it never blocks on the network.
    // Terrarium gives real ASL surface elevation, so the real view DOES show
    // the true -430 m lake-surface figure and the real escarpment relief -
    // but it cannot see underwater bathymetry, so the 300 m max-depth story
    // stays exclusively in the schematic basin view.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus, cross-checked 2026-07-27):
    //   - Surface about 430 m below sea level - lowest land elevation on Earth
    //   - Salinity about 34% (roughly 9-10x ocean); density about 1.24 kg/L
    //   - Maximum depth about 300 m; length about 50 km
    //   - Terminal lake fed by the Jordan River, no outlet; level drops ~1 m/yr
    //   - Between Jordan (east) and Israel / the West Bank (west)
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'dead-sea';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesdeadsea'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    // ---- Real-terrain CDN + IndexedDB cache (mirrors BODYJSblacksea.html's
    // t3dPlaces* pattern) - heights.bin (Int16 LE meters) + texture.jpg
    // (Sentinel-2 true-color), sha256-verified, cached once per manifest version.
    var T3D_PLACES_CDN = 'https://gh-static.freetool.online/places-3d';
    var T3D_PLACES_DB = 'ftol-places3d-assets';
    function t3dPlacesIdbOpen() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(T3D_PLACES_DB, 1);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('assets')) {
                    req.result.createObjectStore('assets', { keyPath: 'key' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        });
    }
    function t3dPlacesIdbGet(key) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readonly');
                var rq = tx.objectStore('assets').get(key);
                rq.onsuccess = function () { resolve(rq.result ? rq.result.blob : null); };
                rq.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }
    function t3dPlacesIdbPut(key, blob) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put({ key: key, blob: blob });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function () { resolve(false); };
            });
        }).catch(function () { return false; });
    }
    function t3dPlacesSha256Hex(buf) {
        return crypto.subtle.digest('SHA-256', buf).then(function (hash) {
            var b = new Uint8Array(hash), hex = '';
            for (var i = 0; i < b.length; i++) hex += b[i].toString(16).padStart(2, '0');
            return hex;
        });
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0a1220, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var key = new THREE.DirectionalLight(0xfff2d0, 0.95);
        key.position.set(-10, 16, 8);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
        }

        // Rift-valley relief, 1 unit = 100 m vertical. North-south trough
        // (the Jordan Rift) between the Judean hills (west, ~ +500 m) and the
        // Moab plateau (east, ~ +800 m); valley floor near -460 m; lake
        // surface at about -430 m. Plane: x = east-west, z = north-south.
        var FLOOR = -4.6, LAKE_Y = -4.3;
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        // North basin outline: elongated blob; southern evaporation ponds zone.
        function inNorthBasin(x, z) {
            if (z > 2.4) return false;
            var cz = Math.max(-8.5, Math.min(2.4, z));
            var half = 2.2 * (1 - Math.pow(Math.abs(z + 3) / 6.4, 2.4)) + 0.35 * (vnoise(z * 0.5 + 3, 7) - 0.5);
            return half > 0.2 && Math.abs(x - 0.35 * Math.sin(z * 0.35)) < half;
        }
        function inPondZone(x, z) { return z > 3.0 && z < 8.2 && Math.abs(x) < 2.1; }
        function height(x, z) {
            var west = smooth(-2.6, -6.5, x) * (5.0 + 1.5 * fbm(x * 0.5 + 2, z * 0.32, 4));
            var east = smooth(2.6, 6.8, x) * (8.0 + 2.0 * fbm(x * 0.5 + 9, z * 0.3 + 4, 4));
            var h = FLOOR + west + east + 0.5 * (fbm(x * 0.7 + 5, z * 0.45 + 1, 4) - 0.5);
            if (inNorthBasin(x, z)) h = Math.min(h, LAKE_Y - 0.5);   // basin below water
            if (inPondZone(x, z)) h = Math.min(h, LAKE_Y - 0.05);    // flat pond flats
            return h;
        }
        var col = { desert: new THREE.Color(0xc9b08a), rock: new THREE.Color(0x9a825f), salt: new THREE.Color(0xf2f5f4), deep: new THREE.Color(0x6e5f49) };
        function color(c, h, x, z) {
            var n = 0.9 + 0.2 * fbm(x * 1.3 + 11, z * 1.3 + 7, 3);
            if (h > 0.5) c.copy(col.rock).lerp(col.desert, smooth(6, 1, h)).multiplyScalar(n);
            else if (h < LAKE_Y + 0.15) c.copy(col.deep).multiplyScalar(n);
            else c.copy(col.desert).multiplyScalar(n);
            // salt fringe just above the shoreline
            if (h > LAKE_Y - 0.02 && h < LAKE_Y + 0.35 && (inNearShore(x, z))) c.copy(col.salt).multiplyScalar(0.95 + 0.1 * n);
        }
        function inNearShore(x, z) {
            for (var dx = -0.45; dx <= 0.45; dx += 0.45) for (var dz = -0.45; dz <= 0.45; dz += 0.45)
                if (inNorthBasin(x + dx, z + dz) || inPondZone(x + dx, z + dz)) return true;
            return false;
        }
        // Basin scene lives in its own group so the Shoreline view (real
        // terrain, added below) can hide it without tearing it down - it is
        // the CDN-independent fallback per the render-quality contract.
        var basinGroup = new THREE.Group();
        scene.add(basinGroup);

        var terrain = makeTerrain(14, 20, shell.low ? 90 : 150, shell.low ? 130 : 210, height, color);
        basinGroup.add(terrain);

        // North-basin water: dark, near-black navy like the satellite view.
        var north = new THREE.Group();
        (function () {
            var shape = new THREE.Shape();
            var pts = [];
            for (var z = -8.4; z <= 2.4; z += 0.4) {
                var half = 2.2 * (1 - Math.pow(Math.abs(z + 3) / 6.4, 2.4));
                if (half < 0.22) continue;
                pts.push([0.35 * Math.sin(z * 0.35) - half, z]);
            }
            for (var z2 = 2.4; z2 >= -8.4; z2 -= 0.4) {
                var half2 = 2.2 * (1 - Math.pow(Math.abs(z2 + 3) / 6.4, 2.4));
                if (half2 < 0.22) continue;
                pts.push([0.35 * Math.sin(z2 * 0.35) + half2, z2]);
            }
            shape.moveTo(pts[0][0], pts[0][1]);
            for (var i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
            var geo = new THREE.ShapeGeometry(shape);
            geo.rotateX(-Math.PI / 2);
            var m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x0c2233, roughness: 0.1, metalness: 0.15 }));
            m.position.y = LAKE_Y;
            north.add(m);
        })();
        basinGroup.add(north);

        // Southern evaporation ponds: the striped turquoise/green pans the
        // satellite view is famous for (industrial salt evaporation).
        var ponds = new THREE.Group();
        var pondCols = [0x2aa6a0, 0x7DAFA3, 0x36b3a8, 0x8fc7b8];
        for (var r = 0; r < 6; r++) {
            var pz = 3.35 + r * 0.8;
            var pond = new THREE.Mesh(
                new THREE.BoxGeometry(3.9 - Math.abs(r - 2.5) * 0.35, 0.05, 0.68),
                new THREE.MeshStandardMaterial({ color: pondCols[r % pondCols.length], roughness: 0.2 })
            );
            pond.position.set(0.1 * Math.sin(r * 1.7), LAKE_Y - 0.02, pz);
            ponds.add(pond);
            var dike = new THREE.Mesh(
                new THREE.BoxGeometry(4.0 - Math.abs(r - 2.5) * 0.35, 0.07, 0.09),
                new THREE.MeshStandardMaterial({ color: 0xf2f5f4, roughness: 0.7 })
            );
            dike.position.set(0.1 * Math.sin(r * 1.7), LAKE_Y, pz + 0.38);
            ponds.add(dike);
        }
        basinGroup.add(ponds);

        // Sea-level datum plane at y=0 - what "-430 m" is measured against.
        var datum = new THREE.Mesh(
            new THREE.PlaneGeometry(15, 21),
            new THREE.MeshBasicMaterial({ color: 0x59c2ff, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide })
        );
        datum.rotation.x = -Math.PI / 2;
        datum.position.y = 0;
        basinGroup.add(datum);
        var datumEdge = new THREE.Mesh(
            new THREE.TorusGeometry(8.4, 0.05, 8, 48),
            new THREE.MeshBasicMaterial({ color: 0x8fd6ff })
        );
        datumEdge.rotation.x = Math.PI / 2;
        basinGroup.add(datumEdge);

        var datumOn = true, saltOn = true;

        function basinPanelHtml() {
            return '<h3>Dead Sea: the lowest place on Earth</h3>' +
                '<p>A north-south rift valley: the dark north basin, the striped evaporation ponds of the shallow south basin, and a translucent plane marking sea level about 430 m above the water.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Surface elevation</td><td>about 430 m below sea level - the lowest land elevation on Earth</td></tr>' +
                '<tr><td>Salinity</td><td>about 34% - roughly 9-10x typical ocean water</td></tr>' +
                '<tr><td>Water density</td><td>about 1.24 kg/L - swimmers float without effort</td></tr>' +
                '<tr><td>Maximum depth</td><td>about 300 m (deepest hypersaline lake on Earth)</td></tr>' +
                '<tr><td>Length</td><td>about 50 km, between Jordan and Israel / the West Bank</td></tr>' +
                '<tr><td>South basin</td><td>shallow evaporation ponds worked for potash and salt - the striped pans in satellite views</td></tr>' +
                '<tr><td>Water balance</td><td>terminal lake - fed by the Jordan River, no outlet; the level drops about 1 m per year</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the valley profile, shoreline, and pond grid are schematic teaching cues, not survey data. Switch to the Shoreline view for real measured terrain at Ein Gedi.</p>';
        }

        // ---- Shoreline view (real terrain, Ein Gedi Nature Reserve shore -
        // west/Judean Desert bank, already named in this page's BODYWELCOME) ----
        var shoreGroup = new THREE.Group();
        shoreGroup.visible = false;
        scene.add(shoreGroup);
        var view = 'basin'; // default first paint - CDN-independent
        var shoreReady = false, shoreLoading = false;
        var shoreMinH = 0, shoreMaxH = 0;
        var VIEW_CAMERA = {
            basin: { radius: 22, phi: 0.95, theta: 0.5, targetY: -2, minR: 7, maxR: 55 },
            shore: { radius: 16, phi: 1.0, theta: 0.5, targetY: 0, minR: 4, maxR: 45 }
        };
        function setCamera(preset) {
            shell.orbit.goalRadius = preset.radius; shell.orbit.goalPhi = preset.phi; shell.orbit.goalTheta = preset.theta;
            shell.orbit.target.y = preset.targetY; shell.orbit.minR = preset.minR; shell.orbit.maxR = preset.maxR;
        }

        function shorePanelHtml() {
            if (!shoreReady) {
                return '<h3>Dead Sea: Ein Gedi shore</h3>' +
                    '<p>' + (shoreLoading ? 'Loading real elevation and satellite imagery of the Ein Gedi shore now (one time, then cached).' : 'Real terrain not loaded yet.') + '</p>';
            }
            return '<h3>Dead Sea: Ein Gedi shore (real terrain)</h3>' +
                '<p>This is the Ein Gedi Nature Reserve shore on the western (Judean Desert) bank - real measured elevation and satellite imagery, not a procedural surface. The escarpment rises steeply from the shoreline within a few kilometres. Terrarium elevation data can see this real above-sea-level relief, including the true lake-surface figure below - but it cannot see underwater bathymetry, so it does not show the 300 m maximum depth; that story stays in the Rift-valley basin view.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Elevation in this view</td><td>' + Math.round(shoreMinH) + ' m to ' + Math.round(shoreMaxH) + ' m (relative to sea level)</td></tr>' +
                '<tr><td>Lake surface (measured here)</td><td>about ' + Math.round(shoreMinH) + ' m - close to the published ~-430 m figure</td></tr>' +
                '<tr><td>Signature feature</td><td>Ein Gedi Nature Reserve escarpment, western (Judean Desert) shore</td></tr>' +
                '<tr><td>Location</td><td>Israel / West Bank, western Dead Sea shore</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Terrain: Mapzen/AWS Open Data terrain tiles (NASA/USGS DEMs). Imagery: contains modified Copernicus Sentinel data 2026. Relief is shown at true 1:1 scale relative to the mapped width - no vertical exaggeration. Educational approximation - not survey-grade geodesy.</p>';
        }

        function panelHtml() { return view === 'shore' ? shorePanelHtml() : basinPanelHtml(); }

        function apply() {
            datum.visible = datumOn; datumEdge.visible = datumOn;
            var db = document.getElementById('t3dPdsDatumBtn');
            if (db) db.textContent = 'Sea-level plane: ' + (datumOn ? 'On' : 'Off');
            var sb = document.getElementById('t3dPdsSaltBtn');
            if (sb) sb.textContent = 'Salt ponds: ' + (saltOn ? 'On' : 'Off');
            ponds.visible = saltOn;
            var vb = document.getElementById('t3dPdsViewBtn');
            if (vb) vb.textContent = 'View: ' + (view === 'shore' ? 'Ein Gedi shore (real terrain)' : (shoreLoading ? 'Rift-valley basin (loading shore...)' : 'Rift-valley basin (schematic)'));
            basinGroup.visible = (view === 'basin');
            shoreGroup.visible = (view === 'shore');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ datumOn: datumOn, saltOn: saltOn, view: view }); } catch (e) {}
        }

        function setView(next) {
            if (next === 'shore' && !shoreReady) return; // ignore clicks before real terrain has loaded
            view = next;
            setCamera(VIEW_CAMERA[view]);
            apply();
        }

        // Decimate a row-major Int16 grid to at most maxDim x maxDim cells,
        // keeping the MAX value per cell (per the runbook: preserve relief
        // detail, never average it flat - the escarpment is the story here).
        function decimateMax(view2, w, h, maxDim) {
            var stepX = Math.max(1, Math.ceil(w / maxDim));
            var stepZ = Math.max(1, Math.ceil(h / maxDim));
            var ow = Math.floor((w - 1) / stepX) + 1;
            var oh = Math.floor((h - 1) / stepZ) + 1;
            var out = new Int16Array(ow * oh);
            for (var oz = 0; oz < oh; oz++) {
                var z0 = oz * stepZ;
                for (var ox = 0; ox < ow; ox++) {
                    var x0 = ox * stepX, best = -32768;
                    for (var dz2 = 0; dz2 < stepZ && z0 + dz2 < h; dz2++) {
                        var rowBase = (z0 + dz2) * w;
                        for (var dx = 0; dx < stepX && x0 + dx < w; dx++) {
                            var v = view2[rowBase + x0 + dx];
                            if (v > best) best = v;
                        }
                    }
                    out[oz * ow + ox] = best;
                }
            }
            return { data: out, w: ow, h: oh };
        }

        function buildShoreMesh(heightsView, grid, texBlob) {
            var dec = decimateMax(heightsView, grid.width_px, grid.height_px, 220);
            var W = 20, D = 20;
            var geo = new THREE.PlaneGeometry(W, D, dec.w - 1, dec.h - 1);
            geo.rotateX(-Math.PI / 2);
            // Isotropic meters -> scene-unit scale so relief keeps TRUE 1:1
            // vertical proportion relative to the mapped width (no exaggeration).
            var vertScale = W / (grid.width_px * grid.meters_per_px);
            var minH = grid.min_h_m, maxH = grid.max_h_m;
            var pos = geo.attributes.position;
            var colors = new Float32Array(pos.count * 3), c = new THREE.Color();
            var deep = new THREE.Color(0x0c2233), lakeShore = new THREE.Color(0xf2f5f4), desert = new THREE.Color(0xc9b08a), rock = new THREE.Color(0x9a825f);
            for (var i = 0; i < pos.count; i++) {
                var ix = i % dec.w, iz = Math.floor(i / dec.w);
                var hRaw = dec.data[iz * dec.w + ix];
                pos.setY(i, (hRaw - minH) * vertScale);
                var t = (hRaw - minH) / Math.max(1, maxH - minH);
                if (hRaw <= minH + 8) { c.copy(deep); }
                else if (hRaw <= minH + 25) { c.copy(lakeShore); }
                else { c.copy(desert).lerp(rock, Math.min(1, t)); }
                colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            var mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.94, metalness: 0 });
            var mesh = new THREE.Mesh(geo, mat);
            shoreGroup.add(mesh);
            shoreMinH = minH; shoreMaxH = maxH;
            shoreLoading = false; shoreReady = true;
            setView('shore');
            t3dStatus('Real Ein Gedi shore terrain loaded (Terrarium DEM + Sentinel-2 imagery). Drag to orbit, scroll to zoom.');
            if (texBlob) {
                var texUrl = URL.createObjectURL(texBlob);
                new THREE.TextureLoader().load(texUrl, function (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    // 2026-08-29 DEFECT FIX. MeshStandardMaterial MULTIPLIES
                    // vertexColors by map. Once real imagery is the colour
                    // source the hypsometric bands must stop multiplying into it.
                    mat.map = tex;
                    mat.vertexColors = false;
                    mat.color.setScalar(1);
                    mat.needsUpdate = true;
                    URL.revokeObjectURL(texUrl);
                }, undefined, function () { URL.revokeObjectURL(texUrl); });
            }
        }

        function fetchPlacesAsset(file, mimeType, verKey) {
            var key = verKey + ':' + file.file;
            return t3dPlacesIdbGet(key).then(function (cached) {
                if (cached) return cached;
                return fetch(T3D_PLACES_CDN + '/' + file.file).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + file.file);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    return t3dPlacesSha256Hex(buf).then(function (hex) {
                        if (file.sha256 && hex !== file.sha256) { throw new Error('sha256 mismatch on ' + file.file); }
                        var blob = new Blob([buf], { type: mimeType });
                        t3dPlacesIdbPut(key, blob);
                        return blob;
                    });
                });
            });
        }

        function loadRealShore() {
            shoreLoading = true;
            apply();
            fetch(T3D_PLACES_CDN + '/manifest.json').then(function (r) { return r.json(); })
                .then(function (manifest) {
                    var asset = manifest && manifest.assets && manifest.assets['dead-sea'];
                    if (!asset) throw new Error('manifest missing the dead-sea asset');
                    var heightsFile = null, texFile = null;
                    (asset.files || []).forEach(function (f) {
                        if (f.role === 'heightfield') heightsFile = f;
                        if (f.role === 'satellite-texture') texFile = f;
                    });
                    if (!heightsFile) throw new Error('manifest missing the heightfield file');
                    var verKey = 'dead-sea@' + manifest.version;
                    var jobs = [fetchPlacesAsset(heightsFile, 'application/octet-stream', verKey)];
                    if (texFile) jobs.push(fetchPlacesAsset(texFile, 'image/jpeg', verKey));
                    return Promise.all(jobs).then(function (blobs) {
                        return blobs[0].arrayBuffer().then(function (buf) {
                            buildShoreMesh(new Int16Array(buf), asset.grid, blobs[1] || null);
                        });
                    });
                })
                .catch(function (err) {
                    shoreLoading = false;
                    apply();
                    t3dStatus('Could not load real Ein Gedi shore terrain (' + (err && err.message ? err.message : err) + ') - showing the rift-valley basin view instead.');
                });
        }

        var store = t3dLoadStore();
        if (typeof store.datumOn === 'boolean') datumOn = store.datumOn;
        if (typeof store.saltOn === 'boolean') saltOn = store.saltOn;
        setCamera(VIEW_CAMERA.basin);
        apply();

        var datumBtn = document.getElementById('t3dPdsDatumBtn');
        if (datumBtn) datumBtn.addEventListener('click', function () { datumOn = !datumOn; apply(); });
        var saltBtn = document.getElementById('t3dPdsSaltBtn');
        if (saltBtn) saltBtn.addEventListener('click', function () { saltOn = !saltOn; apply(); });
        var viewBtn = document.getElementById('t3dPdsViewBtn');
        if (viewBtn) viewBtn.addEventListener('click', function () { setView(view === 'shore' ? 'basin' : 'shore'); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the sea-level plane or the salt ponds.');
        if ('requestIdleCallback' in window) { requestIdleCallback(loadRealShore, { timeout: 4000 }); }
        else { setTimeout(loadRealShore, 800); }
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesdeadsea: 't3dPdsControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesdeadsea: { radius: 22, maxR: 55, minR: 7, phi: 0.95, theta: 0.5, targetY: -2 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

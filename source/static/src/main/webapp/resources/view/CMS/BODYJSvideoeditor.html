<script>
    // Video Editor - the full OpenCut in-browser editor (multi-track timeline,
    // WebCodecs export, in-browser Whisper captions, effects, keyframes,
    // stickers), self-hosted as a static build on our asset CDN and embedded
    // here. Everything a visitor edits stays in their browser: projects live
    // in IndexedDB + OPFS on the editor origin, export runs on WebCodecs in a
    // worker, captions run Whisper in the tab, and the ADDED AI copilot runs
    // a language model on WebGPU locally.
    //
    // 2026-08-31 operator request: "create a new video editing tool under
    // /video-tools/ based on opencut-app/opencut - clone full, remove their
    // analytics; all processing local with webllm, workers and browser
    // storage". The repo the operator linked is a Rust REWRITE with no usable
    // editor yet; the working editor is opencut-app/opencut-classic (MIT),
    // which is ALREADY fully client-side. Build pipeline + full patch:
    // ftol-vm-assets/opencut/ (pinned rev cf5e79e9; databuddy/BotId analytics
    // removed, backend surface removed, /editor/?project= static route,
    // Freesound proxy on service.freetool.online, AI copilot ADDED).
    //
    // Framework contract: doAfterPageRendered(); no top-level DOM. The
    // embedded editor is the visible output (G16); if the CDN is unreachable
    // the page says so honestly instead of showing a dead frame.

    web.localUpload = false;

    var VE_APP = 'https://gh-static.freetool.online/opencut/projects/';

    function veBuild(root) {
        var wrap = document.createElement('div');
        wrap.className = 'w3-container';
        wrap.innerHTML =
            '<h3 class="w3-text-blue-grey">Video editor</h3>' +
            '<div style="margin:6px 0;">' +
            '<a id="veFull" class="w3-button w3-blue" href="' + VE_APP + '" target="_blank" rel="noopener">Open the editor full screen</a> ' +
            '<span style="color:#666;font-size:0.9em;margin-left:8px;">Best on a computer in Chrome or Edge - the editor needs a big screen and WebCodecs.</span>' +
            '</div>' +
            '<div id="veStatus" role="status" style="margin:6px 0;color:#555;">Loading the editor...</div>' +
            '<iframe id="veFrame" src="' + VE_APP + '" title="OpenCut video editor" allow="clipboard-read; clipboard-write; display-capture" style="width:100%;height:78vh;min-height:560px;border:1px solid #ccc;background:#111;border-radius:4px;"></iframe>';
        root.appendChild(wrap);

        // The iframe load event fires even on an error page, so the honest
        // signal is a CORS fetch of the app shell (the asset host sends
        // Access-Control-Allow-Origin: *).
        fetch(VE_APP, { mode: 'cors' }).then(function (r) {
            if (r.ok) {
                document.getElementById('veStatus').textContent =
                    'The editor runs inside this frame - your files, projects and exports never leave this browser. Projects are saved automatically in the browser and will be here when you come back.';
            } else { throw new Error('HTTP ' + r.status); }
        }).catch(function (e) {
            document.getElementById('veStatus').innerHTML =
                'The editor did not answer from our asset host (' + mnSafe(e && e.message) + '). Try again in a few minutes, or open ' +
                '<a href="' + VE_APP + '" target="_blank" rel="noopener">gh-static.freetool.online/opencut</a> directly.';
        });
        function mnSafe(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
    }

    function doAfterPageRendered() {
        var root = document.getElementById('videoEditorTool');
        if (!root) return;
        veBuild(root);
    }
</script>

<script>
    // 3D scene archetype skeleton (mount-fuji) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (mount-fuji).
    // All geometry is procedural. places-3d-discovery-loop, 2026-07-28.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus, cross-checked 2026-07-28):
    //   - Summit 3,776.24 m (Kengamine, crater rim)
    //   - Honshu, Japan - Shizuoka / Yamanashi border, ~100 km SW of Tokyo
    //   - Active stratovolcano; last eruption 1707-1708 (Hoei eruption)
    //   - Fuji Five Lakes at the base: Kawaguchiko, Yamanakako, Saiko,
    //     Shojiko, Motosuko
    //   - UNESCO World Heritage cultural site since 2013
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'mount-fuji';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesmountfuji'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0b1526, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        var key = new THREE.DirectionalLight(0xfff6e0, 1.05);
        key.position.set(14, 20, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
        }

        // A solitary symmetric stratovolcano: one radial cone with a flat
        // summit crater dimple, textured with light fbm ridging (lava-flow
        // channels), rising sharply from a broad flat plain - the reader's
        // mental image of Fuji's near-perfect silhouette. 1 unit ~ 400 m
        // vertical, x/z ~ km/1.3. Summit ~3.776 -> scaled to 9.4 units.
        var SUMMIT_H = 9.4, BASE_R = 8.5, CRATER_R = 0.9, CRATER_DEPTH = 0.55;
        function smoothv(v, a, b) { var t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); }
        function coneProfile(d) {
            // Slightly concave-then-convex classic stratovolcano profile.
            var t = Math.max(0, 1 - d / BASE_R);
            return Math.pow(t, 1.35);
        }
        function height(x, z) {
            var d = Math.hypot(x, z);
            var ridge = fbm(x * 0.55 + 4, z * 0.55 + 9, 4);
            var h = SUMMIT_H * coneProfile(d) + (ridge - 0.5) * 0.35 * smoothv(d, 0.5, BASE_R);
            if (h < 0.12) h = 0.12 + (fbm(x * 0.2 + 2, z * 0.2 + 3, 3) - 0.5) * 0.1; // gentle plain
            if (d < CRATER_R) {
                var ct = 1 - smoothv(d, 0, CRATER_R);
                h -= CRATER_DEPTH * ct;
            }
            return h;
        }
        var SNOWLINE = 6.6;
        var cGreen = new THREE.Color(0x5c7a52), cGreenLight = new THREE.Color(0x7d9a6a),
            cRock = new THREE.Color(0x6f665e), cSnow = new THREE.Color(0xf4f8fb),
            cPlain = new THREE.Color(0x93a582);
        var snowOnColors = null, snowOffColors = null, terrain;
        function baseColor(c, h, x, z, d) {
            var n = 0.9 + 0.2 * fbm(x * 1.1 + 4, z * 1.1 + 6, 3);
            if (h < 0.25) { c.copy(cPlain).multiplyScalar(n); return; }
            var t = smoothv(h, 0.6, 4.5);
            c.copy(cGreen).lerp(cRock, t).multiplyScalar(n);
            if (t > 0.55) c.lerp(cGreenLight, 0); // keep upper slopes rocky, no extra branch needed
        }
        function colorSnow(c, h, x, z) {
            var d = Math.hypot(x, z);
            baseColor(c, h, x, z, d);
            if (h > SNOWLINE) {
                var st = smoothv(h, SNOWLINE, SNOWLINE + 1.4);
                c.lerp(cSnow, Math.min(1, 0.55 + st * 0.5));
            }
        }
        function colorBare(c, h, x, z) {
            var d = Math.hypot(x, z);
            baseColor(c, h, x, z, d);
        }
        terrain = makeTerrain(20, 20, shell.low ? 110 : 170, shell.low ? 110 : 170, height, colorSnow);
        scene.add(terrain);
        snowOnColors = terrain.geometry.attributes.color.array.slice();
        (function () {
            var pos = terrain.geometry.attributes.position, col = new THREE.Color();
            var arr = new Float32Array(pos.count * 3);
            for (var i = 0; i < pos.count; i++) {
                colorBare(col, pos.getY(i), pos.getX(i), pos.getZ(i));
                arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b;
            }
            snowOffColors = arr;
        })();

        // Fuji Five Lakes markers - small teal discs at the northern base,
        // spaced along an arc, standing in for Kawaguchiko / Yamanakako /
        // Saiko / Shojiko / Motosuko.
        var LAKES = [
            { a: -0.55, r: 7.3, name: 'Kawaguchiko' },
            { a: -0.30, r: 7.9, name: 'Yamanakako' },
            { a: -0.80, r: 7.6, name: 'Saiko' },
            { a: -1.05, r: 7.3, name: 'Shojiko' },
            { a: -1.30, r: 7.0, name: 'Motosuko' }
        ];
        var lakeGroup = new THREE.Group();
        var lakeMat = new THREE.MeshStandardMaterial({ color: 0x3f8f9c, roughness: 0.35, metalness: 0.05 });
        for (var li = 0; li < LAKES.length; li++) {
            var lk = LAKES[li];
            var lx = Math.sin(lk.a) * lk.r, lz = Math.cos(lk.a) * lk.r;
            var disc = new THREE.Mesh(new THREE.CircleGeometry(0.42, 20), lakeMat);
            disc.rotation.x = -Math.PI / 2;
            disc.position.set(lx, height(lx, lz) + 0.03, lz);
            lakeGroup.add(disc);
        }
        scene.add(lakeGroup);

        var snowOn = true, lakesOn = true;

        function panelHtml() {
            return '<h3>Mount Fuji: Japan\'s sacred stratovolcano</h3>' +
                '<p>A relief of the solitary Fuji cone: the 3,776 m summit crater, the schematic snowline, and the Fuji Five Lakes ringing the northern base.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Summit elevation</td><td>3,776.24 m (Kengamine, crater rim)</td></tr>' +
                '<tr><td>Location</td><td>Honshu, Japan - Shizuoka / Yamanashi border, ~100 km SW of Tokyo</td></tr>' +
                '<tr><td>Type</td><td>Active stratovolcano (composite cone)</td></tr>' +
                '<tr><td>Last eruption</td><td>1707-1708 (Hoei eruption)</td></tr>' +
                '<tr><td>Base lakes</td><td>Fuji Five Lakes: Kawaguchiko, Yamanakako, Saiko, Shojiko, Motosuko</td></tr>' +
                '<tr><td>Heritage status</td><td>UNESCO World Heritage cultural site since 2013</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the cone shape, snowline, and lake positions are procedural teaching cues, not survey terrain.</p>';
        }

        function apply() {
            terrain.geometry.attributes.color.array.set(snowOn ? snowOnColors : snowOffColors);
            terrain.geometry.attributes.color.needsUpdate = true;
            lakeGroup.visible = lakesOn;
            var sb = document.getElementById('t3dPfjSnowBtn');
            if (sb) sb.textContent = 'Snow cap: ' + (snowOn ? 'On' : 'Off');
            var lb = document.getElementById('t3dPfjLakesBtn');
            if (lb) lb.textContent = 'Five Lakes: ' + (lakesOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ snowOn: snowOn, lakesOn: lakesOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.snowOn === 'boolean') snowOn = store.snowOn;
        if (typeof store.lakesOn === 'boolean') lakesOn = store.lakesOn;
        apply();

        var snowBtn = document.getElementById('t3dPfjSnowBtn');
        if (snowBtn) snowBtn.addEventListener('click', function () { snowOn = !snowOn; apply(); });
        var lakesBtn = document.getElementById('t3dPfjLakesBtn');
        if (lakesBtn) lakesBtn.addEventListener('click', function () { lakesOn = !lakesOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the snow cap or the Five Lakes markers.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00005;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesmountfuji: 't3dPfjControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesmountfuji: { radius: 24, maxR: 60, minR: 8, phi: 1.05, theta: 0.7, targetY: 3.2 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

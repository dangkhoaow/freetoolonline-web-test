<script>
    // 3D scene archetype skeleton (mount-fuji) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (mount-fuji). places-3d cluster seed 2026-07-31; DETAILED-TERRAIN
    // migration 2026-08-28 (prompts/places-3d-detailed-terrain-runbook.md):
    // the procedural cone below renders FIRST (unchanged, G16 render-only
    // pass + CDN-outage fallback), then async fetches real Terrarium DEM
    // elevation + Sentinel-2 true-color imagery from the ftol-vm-assets CDN,
    // IndexedDB-caches it, and swaps it in in-place once ready. A CDN
    // failure or slow network leaves the procedural cone on screen - it
    // never blanks.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus, cross-checked 2026-07-31):
    //   - Peak elevation 3,776 m (3,775.63 m, 2014 survey) - Japan's highest
    //   - Near-symmetric stratovolcano cone, base circumference about 125 km
    //   - Last eruption 1707-1708 (Hoei era, about 49 days)
    //   - Visible from Tokyo (100-130 km away) on clear days
    //   - UNESCO World Heritage Site since 2013
    //   - Snow cap visible roughly November through May (about 6 months)
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'mount-fuji';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesmountfuji'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    // ---- Real-terrain CDN + IndexedDB cache (mirrors BODYJSgrandcanyon.html /
    // BODYJSmounteverest.html's t3dPlaces* pattern) - heights.bin (Int16 LE
    // meters) + texture.jpg (Sentinel-2 true-color), sha256-verified, cached
    // once per manifest version.
    var T3D_PLACES_CDN = 'https://gh-static.freetool.online/places-3d';
    var T3D_PLACES_DB = 'ftol-places3d-assets';
    function t3dPlacesIdbOpen() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(T3D_PLACES_DB, 1);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('assets')) {
                    req.result.createObjectStore('assets', { keyPath: 'key' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        });
    }
    function t3dPlacesIdbGet(key) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readonly');
                var rq = tx.objectStore('assets').get(key);
                rq.onsuccess = function () { resolve(rq.result ? rq.result.blob : null); };
                rq.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }
    function t3dPlacesIdbPut(key, blob) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put({ key: key, blob: blob });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function () { resolve(false); };
            });
        }).catch(function () { return false; });
    }
    function t3dPlacesSha256Hex(buf) {
        return crypto.subtle.digest('SHA-256', buf).then(function (hash) {
            var b = new Uint8Array(hash), hex = '';
            for (var i = 0; i < b.length; i++) hex += b[i].toString(16).padStart(2, '0');
            return hex;
        });
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x87ceeb, 1); // clear-day sky
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xfff2d8, 1.05);
        key.position.set(-12, 20, -9);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return { mesh: new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 })), geo: geo, pos: pos };
        }

        // Near-symmetric stratovolcano cone with the classic concave "Fuji
        // curve": an exponent > 1 on the radial falloff so the slopes flare
        // gently at the base and steepen toward the summit, plus a small
        // crater dip at the very top. 1 unit = about 500 m vertical, so the
        // cone's about 5.5 units above the surrounding plain reads as the
        // roughly 2,725 m net rise (3,776 m peak over an about 1,050 m base).
        var CONE_R = 7.2, CONE_H = 5.5, CRATER_R = 0.55, CRATER_DEPTH = 0.35;
        function height(x, z) {
            var R = Math.sqrt(x * x + z * z);
            var t = Math.max(0, 1 - R / CONE_R);
            var cone = CONE_H * Math.pow(t, 1.7);
            var crater = -CRATER_DEPTH * (1 - smooth(0, CRATER_R, R));
            var rough = (fbm(x * 0.9 + 5, z * 0.9 + 2, 4) - 0.5) * 0.28 * smooth(0.05, 0.6, t) * (1 - smooth(0.85, 1, t));
            var plain = (fbm(x * 0.4 + 9, z * 0.4 + 7, 3) - 0.5) * 0.1;
            return cone + crater + rough + plain;
        }

        // Elevation bands (heights in scene units above the plain):
        //   forest belt low, rock/scoria mid, snow cap above the snow line.
        var SNOW_LINE = 3.4, ROCK_LINE = 1.5;
        var col = {
            plain: new THREE.Color(0x6f9b52), forest: new THREE.Color(0x2d5016),
            rock: new THREE.Color(0x6e5a4e), scoria: new THREE.Color(0x8b7355),
            snow: new THREE.Color(0xf4f8ff)
        };
        var snowOn = true, cloudOn = true;
        function color(c, h, x, z) {
            var n = 0.92 + 0.14 * fbm(x * 1.4 + 3, z * 1.4 + 8, 3);
            if (h < 0.25) { c.copy(col.plain); }
            else if (h < ROCK_LINE) { c.copy(col.plain).lerp(col.forest, smooth(0.25, ROCK_LINE, h)); }
            else if (h < SNOW_LINE || !snowOn) {
                var t = smooth(ROCK_LINE, snowOn ? SNOW_LINE : CONE_H, h);
                c.copy(col.scoria).lerp(col.rock, t);
            } else {
                // Ragged snow line: nudge the boundary with noise so the cap
                // edge reads as fingers of snow, not a hard ring.
                var edge = SNOW_LINE + (fbm(x * 1.1 + 21, z * 1.1 + 13, 3) - 0.5) * 0.5;
                if (h < edge) { c.copy(col.rock); } else { c.copy(col.snow); n = 0.97 + 0.05 * fbm(x * 2 + 1, z * 2 + 4, 2); }
            }
            c.multiplyScalar(n);
        }
        var terrainInfo = makeTerrain(20, 20, shell.low ? 140 : 180, shell.low ? 140 : 180, height, color);
        scene.add(terrainInfo.mesh);

        // Cloud layer: a band of flattened translucent puffs ringing the
        // lower slopes - the classic "cloud collar" seen in photos of Fuji.
        var CLOUD_Y = 1.9, CLOUD_R = 4.6, CLOUD_COUNT = shell.low ? 14 : 22;
        var cloudGroup = new THREE.Group();
        var cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.82, roughness: 1, metalness: 0 });
        for (var i = 0; i < CLOUD_COUNT; i++) {
            var ang = (i / CLOUD_COUNT) * Math.PI * 2;
            var rr = CLOUD_R + (hash2(i, 7) - 0.5) * 1.4;
            var puff = new THREE.Mesh(new THREE.SphereGeometry(0.55 + hash2(i, 3) * 0.5, 10, 8), cloudMat);
            puff.scale.y = 0.35;
            puff.position.set(Math.cos(ang) * rr, CLOUD_Y + (hash2(i, 11) - 0.5) * 0.4, Math.sin(ang) * rr);
            cloudGroup.add(puff);
        }
        scene.add(cloudGroup);

        function recolor() {
            var pos = terrainInfo.pos, geo = terrainInfo.geo, colors = geo.attributes.color, col2 = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                color(col2, pos.getY(i), pos.getX(i), pos.getZ(i));
                colors.setXYZ(i, col2.r, col2.g, col2.b);
            }
            colors.needsUpdate = true;
        }

        // ---- Real-terrain progressive upgrade state (filled once loaded) ----
        var realMesh = null, realReady = false, realLoading = false;
        var realSnowCol = null, realBareCol = null, realMinH = 0, realMaxH = 0;
        // Real snowline placed at the same fractional height (0.618 of the
        // base-to-summit rise) as the procedural SNOW_LINE/CONE_H ratio, so
        // the toggle keeps its visual meaning once real elevation replaces
        // the stylized cone.
        var REAL_SNOWLINE_M = 2470;

        function panelHtml() {
            if (realReady) {
                return '<h3>Mount Fuji: real elevation + satellite imagery</h3>' +
                    '<p>This relief now shows the actual measured shape of the volcano - the near-perfect radial symmetry, the summit crater rim, and the surrounding foothills here are real elevation data, not a procedural cone.</p>' +
                    '<table class="w3-table w3-bordered">' +
                    '<tr><td>Peak elevation</td><td>3,776 m (3,775.63 m, 2014 survey)</td></tr>' +
                    '<tr><td>Elevation in this view</td><td>' + Math.round(realMinH) + ' m to ' + Math.round(realMaxH) + ' m</td></tr>' +
                    '<tr><td>Net cone height</td><td>about 2,725 m above the roughly 1,050 m base</td></tr>' +
                    '<tr><td>Last eruption</td><td>1707-1708 (Hoei era, about 49 days)</td></tr>' +
                    '<tr><td>Base circumference</td><td>about 125 km</td></tr>' +
                    '<tr><td>Visible from Tokyo</td><td>100-130 km away on clear days</td></tr>' +
                    '<tr><td>UNESCO World Heritage</td><td>since 2013</td></tr>' +
                    '</table>' +
                    '<p class="t3d-note">Terrain: Mapzen/AWS Open Data terrain tiles (NASA/USGS DEMs). Imagery: contains modified Copernicus Sentinel data 2026. Relief is shown at true 1:1 scale relative to the mapped width - no vertical exaggeration. Educational approximation - not survey-grade geodesy.</p>';
            }
            return '<h3>Mount Fuji: Japan\'s highest peak</h3>' +
                '<p>A near-symmetric stratovolcano and a UNESCO World Heritage Site, visible from Tokyo on clear days. The snow cap crowns the summit for about six months each year.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Peak elevation</td><td>3,776 m (3,775.63 m, 2014 survey)</td></tr>' +
                '<tr><td>Net cone height</td><td>about 2,725 m above the roughly 1,050 m base</td></tr>' +
                '<tr><td>Last eruption</td><td>1707-1708 (Hoei era, about 49 days)</td></tr>' +
                '<tr><td>Base circumference</td><td>about 125 km</td></tr>' +
                '<tr><td>Visible from Tokyo</td><td>100-130 km away on clear days</td></tr>' +
                '<tr><td>UNESCO World Heritage</td><td>since 2013</td></tr>' +
                '</table>' +
                '<p class="t3d-note">' + (realLoading
                    ? 'Loading real elevation and satellite imagery now (one time, then cached) - this procedural cone is a teaching placeholder while it downloads.'
                    : 'Educational relief approximation - the cone profile, snow line, and cloud band are schematic teaching cues, not survey terrain.') + '</p>';
        }

        function apply() {
            cloudGroup.visible = cloudOn;
            if (realReady && realMesh) {
                realMesh.geometry.attributes.color.array.set(snowOn ? realSnowCol : realBareCol);
                realMesh.geometry.attributes.color.needsUpdate = true;
            } else {
                recolor();
            }
            var sb = document.getElementById('t3dFujiSnowBtn');
            if (sb) sb.textContent = 'Snow cover: ' + (snowOn ? 'On' : 'Off');
            var cb = document.getElementById('t3dFujiCloudBtn');
            if (cb) cb.textContent = 'Cloud layer: ' + (cloudOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ snowOn: snowOn, cloudOn: cloudOn }); } catch (e) {}
        }

        // Decimate a row-major Int16 grid to at most maxDim x maxDim cells,
        // keeping the MAX value per cell (per the runbook: preserve the
        // summit, never average it away).
        function decimateMax(view, w, h, maxDim) {
            var stepX = Math.max(1, Math.ceil(w / maxDim));
            var stepZ = Math.max(1, Math.ceil(h / maxDim));
            var ow = Math.floor((w - 1) / stepX) + 1;
            var oh = Math.floor((h - 1) / stepZ) + 1;
            var out = new Int16Array(ow * oh);
            for (var oz = 0; oz < oh; oz++) {
                var z0 = oz * stepZ;
                for (var ox = 0; ox < ow; ox++) {
                    var x0 = ox * stepX, best = -32768;
                    for (var dz2 = 0; dz2 < stepZ && z0 + dz2 < h; dz2++) {
                        var rowBase = (z0 + dz2) * w;
                        for (var dx = 0; dx < stepX && x0 + dx < w; dx++) {
                            var v = view[rowBase + x0 + dx];
                            if (v > best) best = v;
                        }
                    }
                    out[oz * ow + ox] = best;
                }
            }
            return { data: out, w: ow, h: oh };
        }

        function buildRealMesh(view, grid, texBlob) {
            var dec = decimateMax(view, grid.width_px, grid.height_px, 220);
            var W = 20, D = 20; // same footprint as the procedural cone above
            var geo2 = new THREE.PlaneGeometry(W, D, dec.w - 1, dec.h - 1);
            geo2.rotateX(-Math.PI / 2);
            // Isotropic meters -> scene-unit scale so relief keeps TRUE 1:1
            // vertical proportion relative to the mapped width (no exaggeration).
            var vertScale = W / (grid.width_px * grid.meters_per_px);
            var minH = grid.min_h_m, maxH = grid.max_h_m;
            var pos2 = geo2.attributes.position;
            var snowCol = new Float32Array(pos2.count * 3);
            var bareCol = new Float32Array(pos2.count * 3);
            var c = new THREE.Color();
            for (var i = 0; i < pos2.count; i++) {
                var ix = i % dec.w, iz = Math.floor(i / dec.w);
                var hRaw = dec.data[iz * dec.w + ix];
                pos2.setY(i, (hRaw - minH) * vertScale);
                // Real-elevation hypsometric banding (metres): reuse the
                // fractional snowline computed above so the toggle stays
                // meaningful once real elevation replaces the cone.
                if (hRaw > REAL_SNOWLINE_M + 300) { c.copy(col.snow); }
                else if (hRaw > REAL_SNOWLINE_M) { c.copy(col.rock).lerp(col.snow, (hRaw - REAL_SNOWLINE_M) / 300); }
                else if (hRaw > minH + (maxH - minH) * 0.15) { c.copy(col.scoria).lerp(col.rock, Math.min(1, (hRaw - minH) / Math.max(1, REAL_SNOWLINE_M - minH))); }
                else { c.copy(col.plain).lerp(col.forest, Math.min(1, (hRaw - minH) / Math.max(1, (maxH - minH) * 0.15))); }
                snowCol[i * 3] = c.r; snowCol[i * 3 + 1] = c.g; snowCol[i * 3 + 2] = c.b;
                c.copy(col.scoria).lerp(col.rock, Math.max(0, Math.min(1, (hRaw - minH) / Math.max(1, maxH - minH))));
                bareCol[i * 3] = c.r; bareCol[i * 3 + 1] = c.g; bareCol[i * 3 + 2] = c.b;
            }
            geo2.setAttribute('color', new THREE.BufferAttribute(snowOn ? snowCol : bareCol, 3));
            geo2.computeVertexNormals();
            var mat2 = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });
            var mesh2 = new THREE.Mesh(geo2, mat2);
            scene.add(mesh2);
            terrainInfo.mesh.visible = false;
            realMesh = mesh2; realSnowCol = snowCol; realBareCol = bareCol;
            realMinH = minH; realMaxH = maxH;
            realLoading = false; realReady = true;
            apply();
            t3dStatus('Real terrain loaded (Terrarium DEM + Sentinel-2 imagery). Drag to orbit, scroll to zoom.');
            if (texBlob) {
                var url = URL.createObjectURL(texBlob);
                new THREE.TextureLoader().load(url, function (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    mat2.map = tex;
                    mat2.needsUpdate = true;
                    URL.revokeObjectURL(url);
                }, undefined, function () { URL.revokeObjectURL(url); });
            }
        }

        function fetchPlacesAsset(file, mimeType, verKey) {
            var key = verKey + ':' + file.file;
            return t3dPlacesIdbGet(key).then(function (cached) {
                if (cached) return cached;
                return fetch(T3D_PLACES_CDN + '/' + file.file).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + file.file);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    return t3dPlacesSha256Hex(buf).then(function (hex) {
                        if (file.sha256 && hex !== file.sha256) { throw new Error('sha256 mismatch on ' + file.file); }
                        var blob = new Blob([buf], { type: mimeType });
                        t3dPlacesIdbPut(key, blob);
                        return blob;
                    });
                });
            });
        }

        function loadRealTerrain() {
            realLoading = true;
            apply();
            fetch(T3D_PLACES_CDN + '/manifest.json').then(function (r) { return r.json(); })
                .then(function (manifest) {
                    var asset = manifest && manifest.assets && manifest.assets['mount-fuji'];
                    if (!asset) throw new Error('manifest missing the mount-fuji asset');
                    var heightsFile = null, texFile = null;
                    (asset.files || []).forEach(function (f) {
                        if (f.role === 'heightfield') heightsFile = f;
                        if (f.role === 'satellite-texture') texFile = f;
                    });
                    if (!heightsFile) throw new Error('manifest missing the heightfield file');
                    var verKey = 'mount-fuji@' + manifest.version;
                    var jobs = [fetchPlacesAsset(heightsFile, 'application/octet-stream', verKey)];
                    if (texFile) jobs.push(fetchPlacesAsset(texFile, 'image/jpeg', verKey));
                    return Promise.all(jobs).then(function (blobs) {
                        return blobs[0].arrayBuffer().then(function (buf) {
                            buildRealMesh(new Int16Array(buf), asset.grid, blobs[1] || null);
                        });
                    });
                })
                .catch(function (err) {
                    realLoading = false;
                    apply();
                    t3dStatus('Could not load real terrain data (' + (err && err.message ? err.message : err) + ') - showing the procedural cone instead.');
                });
        }

        var store = t3dLoadStore();
        if (typeof store.snowOn === 'boolean') snowOn = store.snowOn;
        if (typeof store.cloudOn === 'boolean') cloudOn = store.cloudOn;
        recolor();
        apply();

        var snowBtn = document.getElementById('t3dFujiSnowBtn');
        if (snowBtn) snowBtn.addEventListener('click', function () { snowOn = !snowOn; apply(); });
        var cloudBtn = document.getElementById('t3dFujiCloudBtn');
        if (cloudBtn) cloudBtn.addEventListener('click', function () { cloudOn = !cloudOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the snow cover or the cloud layer.');
        if ('requestIdleCallback' in window) { requestIdleCallback(loadRealTerrain, { timeout: 4000 }); }
        else { setTimeout(loadRealTerrain, 800); }
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
            cloudGroup.rotation.y += dt * 0.00002;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesmountfuji: 't3dFujiControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesmountfuji: { radius: 18, maxR: 45, minR: 5, phi: 1.18, theta: 0.65, targetY: 2.2 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

     *                       `process` hook, which draws it whole on a canvas and copies the crop
     *                       rectangle, scaled to the output size, onto the output canvas (WebKit
     *                       ignores the source offset when a VideoFrame is drawn with a source
     *                       rectangle, so the crop is always taken from a canvas). The sound is
     *                       copied unchanged when the output container can carry it, otherwise
     *                       re-encoded (AAC for MP4 - WebCodecs, else the vendored AAC WASM
     *                       encoder - or Opus for WebM).
     *   2. Compatibility  - FFmpeg.wasm (single-thread, vendored), when WebCodecs is missing, the
     *                       browser cannot decode the file, or the browser encode fails. One
     *                       filter chain: transpose / hflip, crop, scale; H.264 + AAC in MP4.
     * The crop rectangle UI is the shared /script/crop-box.js (FtolCropBox).

     * Vendored libs (both site repos, static/vendor/): mediabunny/1.61.0 (MPL-2.0, plus the AAC

    function vcEl(id) { return document.getElementById(id); }
    function vcEsc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

    function vcFmtTime(t) {
        if (!isFinite(t) || t < 0) t = 0;

    function vcFmtBytes(b) {
        if (!isFinite(b) || b <= 0) return '0 KB';
        if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
        if (b < 1024 * 1024 * 1024) return (b / 1048576).toFixed(1) + ' MB';

    }

    // ------------------------------------------------------------------ planning

    function vcOutSize(compat) {

    function vcIsEdited() { return !vcIsFullCrop() || vc.rot !== 0 || vc.flip; }

    function vcPlanCompat(reason) {

    }

    function vcDescribePlan(p) {

        var codecs = vcCodecLabel(p.vcodec) + (p.acodec ? ' + ' + vcCodecLabel(p.acodec) : '');

        if (!p.keepSound) s += ', no sound';

    function vcEngineLabel(e) {

    async function vcStart() {

    var vcOutTimer = null;

            var plan = await vcPlan();
            if (token === vc.planToken) el.textContent = vcDescribePlan(plan);

    function vcStartOver() {

            '<div class="vc-drop" id="vcDrop" tabindex="0" role="button" aria-label="Choose a video">' +
                '<div class="vc-drop-title">Drop a video here</div>' +
                '<button type="button" id="vcChoose" class="w3-button w3-blue vc-lockable">Choose video</button>' +
                '<input type="file" id="vcFile" class="vc-file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv,.avi,.3gp,.mts,.m2ts,.ts,.ogv,.wmv,.flv">' +
                '<div class="vc-drop-sub">MP4, MOV, WebM, MKV and more - the file stays on your device. <a href="#" id="vcSample">Try a sample clip</a></div>' +
            '</div>' +
            '<div id="vcFlash" class="vc-flash" hidden></div>' +
            '<div id="vcEditor" class="vc-editor" hidden>' +
                '<div class="vc-file-row"><b id="vcFileName"></b> <span id="vcFileMeta" class="vc-muted"></span></div>' +
                '<div id="vcStageWrap" class="vc-stage-wrap"><div id="vcStage" class="vc-stage">' +
                    '<video id="vcVideo" class="vc-media" playsinline preload="auto"></video>' +
                    '<img id="vcStill" class="vc-media" alt="" hidden>' +
                '</div></div>' +
                '<div id="vcPreviewNote" class="vc-muted vc-note"></div>' +
                '<div class="vc-scrub">' +
                    '<button type="button" id="vcPlay" class="vc-play" aria-label="Play">&#9654;</button>' +
                    '<input type="range" id="vcSeek" min="0" max="1" step="0.01" value="0" aria-label="Preview position">' +
                    '<span id="vcTime" class="vc-time">0:00.0 / 0:00.0</span>' +
                '</div>' +
                '<div id="vcRatios" class="vc-ratios" role="radiogroup" aria-label="Crop shape"><span class="vc-label">Shape</span>' + ratios + '</div>' +
                '<div class="vc-tools">' +
                    '<button type="button" id="vcRotL" class="w3-button w3-small w3-light-grey vc-lockable" title="Turn the picture 90 degrees counter-clockwise">&#8634; Rotate left</button>' +
                    '<button type="button" id="vcRotR" class="w3-button w3-small w3-light-grey vc-lockable" title="Turn the picture 90 degrees clockwise">&#8635; Rotate right</button>' +
                    '<button type="button" id="vcFlipBtn" class="w3-button w3-small w3-light-grey vc-lockable" aria-pressed="false" title="Mirror the picture left to right">&#8646; Flip</button>' +
                    '<button type="button" id="vcReset" class="w3-button w3-small w3-light-grey vc-lockable">Reset</button>' +
                '</div>' +
                '<div class="vc-exact">' + num('vcW', 'Width') + num('vcH', 'Height') + num('vcX', 'Left') + num('vcY', 'Top') + '<span class="vc-muted">pixels</span></div>' +
                '<div id="vcCropTxt" class="vc-crop-txt"></div>' +
                '<div class="vc-settings">' +
                    '<label>Format <select id="vcFormat" class="vc-lockable">' + Object.keys(VC_FORMATS).map(function (k) { return '<option value="' + k + '"' + (k === 'auto' ? ' selected' : '') + '>' + VC_FORMATS[k].label + '</option>'; }).join('') + '</select></label>' +
                    '<label>Size <select id="vcSize" class="vc-lockable">' + VC_SIZES.map(function (s) { return '<option value="' + s.v + '"' + (s.v === 'crop' ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') + '</select></label>' +
                    '<label>Sound <select id="vcSound" class="vc-lockable"><option value="keep" selected>Keep the sound</option><option value="remove">Remove the sound</option></select></label>' +
                '</div>' +
            '</div>' +
            '<div id="vcOutputLine" class="vc-output-line" aria-live="polite"></div>' +
            '<div class="vc-actions">' +
                '<button type="button" id="vcRun" class="w3-button w3-blue vc-run" disabled>Crop video</button> ' +
                '<span id="vcHint" class="vc-muted">Choose a video to start.</span>' +
                '<span id="vcEngineBadge" class="vc-badge" hidden></span>' +
            '</div>' +
            '<div id="vcProgress" class="vc-progress" hidden>' +
                '<div class="vc-bar"><div id="vcBarFill" class="vc-bar-fill"></div></div>' +
                '<div id="vcProgressTxt" class="vc-progress-txt" aria-live="polite"></div>' +
                '<button type="button" id="vcCancel" class="w3-button w3-small w3-light-grey">Cancel</button> ' +
                '<span class="vc-muted">Keep this tab open until the crop finishes.</span>' +
            '</div>' +
            '<div id="vcError" class="w3-panel w3-pale-red vc-error" hidden></div>' +
            '<div id="vcResult" class="w3-row outputImgs" style="visibility:visible !important;"></div>';
    }

    function doAfterPageRendered() {
        var root = document.getElementById('videoCropperTool');
        if (!root || root.getAttribute('data-vc-ready')) return;
        root.setAttribute('data-vc-ready', '1');
        root.innerHTML = vcToolHtml();
        vcLoadCropBox().catch(function () { /* retried when a file is chosen */ });

        var fileEl = vcEl('vcFile'), drop = vcEl('vcDrop');
        vcEl('vcChoose').addEventListener('click', function (e) { e.stopPropagation(); fileEl.click(); });
        drop.addEventListener('click', function (e) { if (e.target === drop || e.target.className === 'vc-drop-title') fileEl.click(); });
        drop.addEventListener('keydown', function (e) { if (e.target !== drop) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); } });
        fileEl.addEventListener('change', function () { if (fileEl.files && fileEl.files[0]) vcLoadFile(fileEl.files[0]); fileEl.value = ''; });
        ['dragenter', 'dragover'].forEach(function (t) {
            root.addEventListener(t, function (e) {
                if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
                e.preventDefault(); drop.classList.add('vc-over');
            });
        });
        root.addEventListener('dragleave', function (e) { if (e.target === drop) drop.classList.remove('vc-over'); });
        root.addEventListener('drop', function (e) {
            if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
            e.preventDefault(); drop.classList.remove('vc-over');
            if (!vc.job) vcLoadFile(e.dataTransfer.files[0]);
        });
        vcEl('vcSample').addEventListener('click', function (e) {
            e.preventDefault();
            if (vc.job) return;
            vcLoadFile(vcB64ToFile(VC_DEMO_B64, 'sample-landscape.webm'));
        });

        vcEl('vcRatios').addEventListener('change', function (e) { if (e.target.name === 'vcRatio') vcSetRatio(e.target.value); });
        vcEl('vcRotL').addEventListener('click', function () { vcRotate(-1); });
        vcEl('vcRotR').addEventListener('click', function () { vcRotate(1); });
        vcEl('vcFlipBtn').addEventListener('click', vcFlip);
        vcEl('vcReset').addEventListener('click', vcResetCrop);
        ['vcW', 'vcH', 'vcX', 'vcY'].forEach(function (id) {
            vcEl(id).addEventListener('change', function () { vcInputChanged(id); });
        });
        vcEl('vcPlay').addEventListener('click', vcPlayToggle);
        vcEl('vcSeek').addEventListener('input', function () { vcSeekTo(parseFloat(vcEl('vcSeek').value) || 0); });
        root.addEventListener('change', function (e) {
            var t = e.target;
            if (t.id === 'vcFormat') vc.format = t.value;
            else if (t.id === 'vcSize') vc.size = t.value;
            else if (t.id === 'vcSound') vc.sound = t.value;
            else return;
            vcSyncInputs();
            vcClearResult();
            vcScheduleOutputLine();
        });
        vcEl('vcRun').addEventListener('click', vcStart);
        vcEl('vcCancel').addEventListener('click', vcCancel);
        if (window.ResizeObserver) new ResizeObserver(function () { vcLayout(); }).observe(vcEl('vcStageWrap'));
        else window.addEventListener('resize', vcLayout);
        document.addEventListener('visibilitychange', function () { if (!document.hidden && vc.job && !vc.wake) vcWakeLock(); });
        // A page kept in the back-forward cache comes back as it was; only a real unload frees the file.
        window.addEventListener('pagehide', function (e) { if (e && e.persisted) return; vcClearResult(); vcReleaseFile(); });
        vcUpdateButtons();
    }
</script>

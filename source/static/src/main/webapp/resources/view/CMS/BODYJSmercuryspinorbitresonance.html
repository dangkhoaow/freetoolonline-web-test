<script>
    // 3D scene archetype skeleton (Mercury Spin-Orbit Resonance) - vendored
    // three.js (ESM, dynamic import from /vendor/three/, NO CDN), fully
    // client-side. Built LEAN, forked from the voyager-interstellar-position
    // shape - ONE scene only (a resonance explorer). All geometry is
    // procedural.
    //
    // EDUCATIONAL APPROXIMATION, not an ephemeris or orbital-dynamics
    // simulation. Mercury advances around its real-eccentricity ellipse at a
    // CONSTANT angular rate (not the real Kepler's-second-law speedup near
    // perihelion) so the shape and the two real periods stay accurate while
    // the motion itself is simplified. Two raised "hot pole" markers 180
    // degrees apart on Mercury's equator spin at the real sidereal-rotation
    // rate so the viewer can see them swap which one faces the Sun at
    // successive perihelion passes - the real, citable consequence of the
    // 3:2 (not 1:1) resonance.
    //
    // Published figures (cross-checked via WebSearch 2026-07-25):
    //   - Sidereal rotation period: 58.646 Earth days.
    //   - Sidereal orbital period: 87.969 Earth days (87.969216879, per
    //     Margot et al. spin-state analysis).
    //   - Ratio: exactly 3:2 (3 rotations for every 2 orbits).
    //   - Solar day (sunrise to sunrise): 176 Earth days = 2 orbital periods
    //     = 3 rotation periods - one Mercury "day" is two Mercury "years".
    //   - Orbital eccentricity: 0.206, the highest of the Solar System's
    //     eight planets.
    //   - Discovered by radar observation (Pettengill and Dyce, 1965), which
    //     disproved the pre-1965 assumption that Mercury was tidally locked
    //     1:1 (always showing the same face to the Sun, like the Moon to
    //     Earth). Confirmed to high precision by NASA's MESSENGER mission
    //     (orbited Mercury 2011-2015).
    //   - Consequence: because the resonance is 3:2 and not 1:1, the same
    //     hot longitude only faces the Sun at every OTHER perihelion; the
    //     two hot-pole longitudes (roughly 0 degrees and 180 degrees) run
    //     noticeably hotter at their own perihelion pass than in between.
    //   - Cause (brief, non-overclaiming): a circular orbit would have
    //     settled into 1:1 tidal lock; Mercury's high eccentricity opened a
    //     stable capture into the higher 3:2 resonance instead during its
    //     tidal despinning.
    //
    // Distinct from venus-retrograde-rotation.html (a DIFFERENT planet's
    // retrograde, near-1:1-resonant rotation) and orbital-resonance.html
    // (a general multi-body mean-motion resonance explorer) - this page is
    // specifically Mercury's single-planet 3:2 spin-orbit lock and its
    // alternating-hot-pole consequence.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'mercuryspinorbitresonance';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'mercuryspinorbitresonance'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published figures (verified via WebSearch 2026-07-25).
    var T3D_ROT_DAYS = 58.646;   // sidereal rotation period
    var T3D_ORB_DAYS = 87.969;   // sidereal orbital period
    var T3D_SOLAR_DAY = 176;     // sunrise-to-sunrise, = 2 orbits = 3 rotations
    var T3D_ECC = 0.206;         // orbital eccentricity - highest of the 8 planets
    var T3D_SEMI_MAJOR = 2.4;    // scene units, arbitrary scale anchor

    function t3dEllipsePoint(trueAnomaly) {
        var a = T3D_SEMI_MAJOR, e = T3D_ECC;
        var r = a * (1 - e * e) / (1 + e * Math.cos(trueAnomaly));
        return { x: r * Math.cos(trueAnomaly), z: r * Math.sin(trueAnomaly), r: r };
    }

    function t3dMercurySpinOrbitResonance(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x03040a, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));

        var starN = shell.low ? 260 : 520;
        var starPos = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r0 = 20 + Math.random() * 20;
            var th0 = Math.random() * Math.PI * 2, ph0 = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r0 * Math.sin(ph0) * Math.cos(th0);
            starPos[s * 3 + 1] = r0 * Math.cos(ph0) * 0.5;
            starPos[s * 3 + 2] = r0 * Math.sin(ph0) * Math.sin(th0);
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaad4ff, size: 0.25, sizeAttenuation: true, transparent: true, opacity: 0.6 }));
        scene.add(stars);

        // Sun (procedural glowing sphere + point light), placed at the ellipse focus (origin).
        var sun = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 18), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
        scene.add(sun);
        var sunGlow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.26 }));
        scene.add(sunGlow);
        scene.add(new THREE.PointLight(0xfff2cc, 1.3, 40));

        // Orbit ellipse (real eccentricity 0.206) as a thin line loop.
        var orbPts = [];
        for (var i = 0; i <= 128; i++) {
            var ta = (i / 128) * Math.PI * 2;
            var p = t3dEllipsePoint(ta);
            orbPts.push(new THREE.Vector3(p.x, 0, p.z));
        }
        var orbLine = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(orbPts), new THREE.LineBasicMaterial({ color: 0x8899aa, transparent: true, opacity: 0.55 }));
        scene.add(orbLine);

        // Perihelion / aphelion markers.
        var periP = t3dEllipsePoint(0), apheP = t3dEllipsePoint(Math.PI);
        var periDot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff5252 }));
        periDot.position.set(periP.x, 0, periP.z);
        scene.add(periDot);
        var apheDot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x64b5f6 }));
        apheDot.position.set(apheP.x, 0, apheP.z);
        scene.add(apheDot);

        // Mercury group: a small grey sphere plus two "hot pole" markers 180 degrees apart on the equator.
        var mercuryGroup = new THREE.Group();
        var mercuryBody = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 18), new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.9, metalness: 0.05 }));
        mercuryGroup.add(mercuryBody);
        function hotPole(localAngle) {
            var m = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), new THREE.MeshBasicMaterial({ color: 0xff7043 }));
            m.position.set(0.16 * Math.sin(localAngle), 0, 0.16 * Math.cos(localAngle));
            return m;
        }
        var hotA = hotPole(-Math.PI / 2);       // faces -X (the Sun's perihelion direction) when spin=0
        var hotB = hotPole(-Math.PI / 2 + Math.PI); // 180 degrees opposite
        mercuryGroup.add(hotA);
        mercuryGroup.add(hotB);
        scene.add(mercuryGroup);

        var day = 0; // elapsed Earth days since a perihelion where hot pole A faces the Sun
        var playing = false;
        var selectedKey = 'resonance';

        function apply() {
            var trueAnomaly = (2 * Math.PI * day / T3D_ORB_DAYS) % (2 * Math.PI);
            var pos = t3dEllipsePoint(trueAnomaly);
            mercuryGroup.position.set(pos.x, 0, pos.z);
            mercuryGroup.rotation.y = (2 * Math.PI * day / T3D_ROT_DAYS) % (2 * Math.PI);
            var rotations = day / T3D_ROT_DAYS;
            var orbits = day / T3D_ORB_DAYS;
            t3dInfo(panelHtml(rotations, orbits));
            try { t3dSaveStore({ day: day, sel: selectedKey }); } catch (e) {}
        }

        function fmt(n) { return n.toFixed(2); }

        function panelHtml(rotations, orbits) {
            var progressLine = '<p class="t3d-note">Day ' + Math.round(day) + ' of 176 - ' + fmt(rotations) + ' rotations completed, ' + fmt(orbits) + ' orbits completed.</p>';
            if (selectedKey === 'sun') {
                return '<h3>The Sun</h3><p>Sits at one focus of Mercury\'s ellipse, not the center - a direct visual consequence of the 0.206 eccentricity.</p>' + progressLine;
            }
            if (selectedKey === 'orbit') {
                return '<h3>Mercury\'s orbit</h3><p>Orbital eccentricity 0.206 - the highest of the Solar System\'s eight planets - so the ellipse is visibly stretched and the Sun sits off-center. Sidereal orbital period: 87.969 Earth days.</p>' +
                    '<p class="t3d-note">Red dot marks perihelion (closest approach); blue dot marks aphelion (farthest point). This scene advances Mercury at a constant angular rate around the real ellipse shape, not the real Kepler\'s-second-law speedup near perihelion.</p>' + progressLine;
            }
            if (selectedKey === 'mercury') {
                return '<h3>Mercury\'s rotation</h3><p>Sidereal rotation period: 58.646 Earth days. The two orange markers are 180 degrees apart on the equator ("hot poles") - watch which one points toward the Sun at each perihelion pass.</p>' + progressLine;
            }
            return '<h3>The 3:2 spin-orbit resonance</h3>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Rotation period</td><td>58.646 Earth days</td></tr>' +
                '<tr><td>Orbital period</td><td>87.969 Earth days</td></tr>' +
                '<tr><td>Ratio</td><td>3 rotations : 2 orbits</td></tr>' +
                '<tr><td>Solar day (sunrise to sunrise)</td><td>176 Earth days</td></tr>' +
                '</table>' +
                '<p>Discovered by radar observation in 1965 (Pettengill and Dyce), disproving the earlier assumption that Mercury was tidally locked 1:1 like the Moon is to Earth. Confirmed to high precision by NASA\'s MESSENGER mission (2011-2015).</p>' +
                '<p class="t3d-note">Because the lock is 3:2 and not 1:1, the same hot pole only faces the Sun at every OTHER perihelion - scrub to day 0 and day 88 and compare which orange marker points toward the Sun.</p>' + progressLine;
        }

        var selEl = document.getElementById('t3dMercuryObject');
        var scrubEl = document.getElementById('t3dMercuryScrub');
        var scrubLab = document.getElementById('t3dMercuryScrubLabel');

        var store = t3dLoadStore();
        if (typeof store.day === 'number' && store.day >= 0 && store.day <= T3D_SOLAR_DAY) day = store.day;
        if (store.sel && (store.sel === 'mercury' || store.sel === 'orbit' || store.sel === 'sun' || store.sel === 'resonance')) selectedKey = store.sel;
        if (selEl) selEl.value = selectedKey;
        if (scrubEl) scrubEl.value = String(Math.round(day));
        if (scrubLab) scrubLab.textContent = Math.round(day) + ' / 176';
        apply();

        if (selEl) selEl.addEventListener('change', function () {
            selectedKey = selEl.value || selectedKey;
            apply();
        });
        var playBtn = document.getElementById('t3dMercuryPlayBtn');
        if (playBtn) playBtn.addEventListener('click', function () {
            if (day >= T3D_SOLAR_DAY) day = 0;
            playing = !playing;
        });
        if (scrubEl) scrubEl.addEventListener('input', function () {
            day = Math.max(0, Math.min(T3D_SOLAR_DAY, parseInt(scrubEl.value || '0', 10)));
            playing = false;
            if (scrubLab) scrubLab.textContent = Math.round(day) + ' / 176';
            apply();
        });

        t3dStatus('Drag to orbit, scroll to zoom. Scrub the day count or pick an object below.');
        return function animate(dt) {
            stars.rotation.y += dt * 0.00002;
            sun.rotation.y += dt * 0.0003;
            sunGlow.scale.setScalar(1 + 0.04 * Math.sin(performance.now() * 0.0015));

            if (playing) {
                day += dt * 0.00006 * T3D_SOLAR_DAY / 10;
                if (day >= T3D_SOLAR_DAY) { day = T3D_SOLAR_DAY; playing = false; }
                if (scrubEl) scrubEl.value = String(Math.round(day));
                if (scrubLab) scrubLab.textContent = Math.round(day) + ' / 176';
                var trueAnomaly = (2 * Math.PI * day / T3D_ORB_DAYS) % (2 * Math.PI);
                var pos = t3dEllipsePoint(trueAnomaly);
                mercuryGroup.position.set(pos.x, 0, pos.z);
                mercuryGroup.rotation.y = (2 * Math.PI * day / T3D_ROT_DAYS) % (2 * Math.PI);
                if (Math.round(day) % 4 === 0) { t3dInfo(panelHtml(day / T3D_ROT_DAYS, day / T3D_ORB_DAYS)); }
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { mercuryspinorbitresonance: 't3dMercuryControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { mercuryspinorbitresonance: { radius: 8, maxR: 24, minR: 2, phi: 1.05, theta: 0.5, targetY: 0 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dMercurySpinOrbitResonance(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

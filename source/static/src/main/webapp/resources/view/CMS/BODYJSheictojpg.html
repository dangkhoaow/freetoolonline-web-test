<style>
    /* cycle160 P160.A — force imgOutDownBtn visible regardless of hover.
       Same root-cause class as cycle97 P97.A (svgtopng) and cycle159
       P159.A (resizeimage): default cloudfront CSS sets
       `.imgOutDownBtn { visibility: hidden }` and only flips to `visible`
       on `.imageOut:hover`, which silently breaks mobile/touch UX (no
       hover) AND blocks Playwright's `state: visible` check used by the
       qa-e2e-test G16 gate on `expect_visible: a.imageDownloadBtn`. This
       override makes the Download CTA reachable on touch and on headless
       audits. */
    .imageOut .imgOutDownBtn,
    .imageOut.retouch .imgOutDownBtn { visibility: visible !important; opacity: 1 !important; }
</style>

<script>
    function loadUploadHandlersByPage(){
        web.includesProcess = true;
        var onFileCompleteOrigin = onFileComplete;
        onFileComplete = function(e, file, response) {
            var response = onFileCompleteOrigin.call(this, e, file, response);
            try{
                generateImgThumbs(response);
            } catch(e){}
        };
        
        var onCompleteOrigin = onComplete;
        onComplete = function(e) {
            onCompleteOrigin.call(this, e);
            try{
                if(web.fileInfoResult.length > 1){
                    web.fileInfoResult[0]["pageName"] = "combine-output";
                    web.fileInfoResult[0]["outPutfileType"] = !isPdfOut() ? ".zip" : ".pdf";
                    web.fileInfoResult[0]['customInputString'] = $('#dimensionOpts').val().split('x')[0];
                    web.fileInfoResult[0]['customInputString2'] = $('#dimensionOpts').val().split('x')[1];
                    getStatus(web.fileInfoResult[0]);
                } else if(web.fileInfoResult.length == 0){
                    $('.errorMsgAction').text('Error has occured').show();
                }
            } catch(e){
                $('.errorMsgAction').text('Error has occured').show();
            }
        };

        function isPdfOut() {
            return $('#outputFormat').val() === 'pdf';
        };
        
        buildInputObjBeforeSend = function(fileBase) {
            fileBase["hasExifData"] = $('#exifData').is(':checked') + "";
            fileBase["customInputString3"] = $('#autoOptimizeQuality').is(':checked') + "";
            fileBase["quality"] = parseInt($('#quality').val());
            fileBase["pageName"] = $('#outputFormat').val() === 'jpg' ? pageName : pageName.replace('jpg', $('#outputFormat').val());
            fileBase["inputFolder"] = "input";
            fileBase["includeProcess"] = "true";
            fileBase["outputFolder"] = "output";
            fileBase["outPutfileType"] = !isPdfOut() ? ".zip" : ".pdf";
            fileBase['customInputString'] = $('#dimensionOpts').val().split('x')[0];
            fileBase['customInputString2'] = $('#dimensionOpts').val().split('x')[1];
            $('.downloadBtnContainer').hide();
            return fileBase;
        };
        
        function getStatus(fileBase){
            callAjax(fileBase, 
                function(result){
                    generateDownloadZip(result);			
                },
                function(){}
            );
        };
        
        function generateDownloadZip(result){
            if (result && result.downloadUrl && result.downloadUrl !== '') {
                $('.downloadBtnContainer').show().find('#downloadLink').attr('href', setOutputUrl(result, false));
                $('.downloadBtnContainer').show().find('#downloadLink').text(!isPdfOut() ? 'Download all '+$('#outputFormat').val()+' images' : 'Download combined pdf file');
            } 
        };
        
        var recentCol = 0,
            tempPdf = "<div title='Click here to download' id='imgOut-{0}' class='imageOut'><img loading='lazy' src='{1}'><div class='imgOutDownBtn'><a class='w3-button imageDownloadBtn' target='_blank' href='{2}'><span>Download<br/><i class='fa fa-photo'></i> {3}</span></button></div></div>",
            temp = '<div title="Click here to download" id="{0}" class="imageOut retouch"><img loading="lazy" src="{1}"><div class="imgOutDownBtn"><a class="w3-button imageDownloadBtn" target="_blank" href="{2}"><span>Download<br> {3}</span></a></div><a title="Click here to retouch with photo editor" target="_blank" href="https://freetoolonline.com/photo-editor.html?img-url={4}"><span><i class="fa fa-photo"></i> Retouch</span></a></div>';
               
        function generateImgThumbs(result){
            var imgsOut = '',
                imgName = result.name,
                viewUrl = result.thumbUrl + "";
            
            if (!isPdfOut()){
                imgsOut = imgsOut + String.format(temp, imgName, result.thumbUrl, result.downloadUrl, result.name, result.downloadUrl);
            } else {
                viewUrl = viewUrl.substring(0, viewUrl.lastIndexOf(".pdf")) + '.png';
                imgsOut = imgsOut + String.format(tempPdf, imgName, viewUrl, result.downloadUrl.replace('output', 'thumb'), imgName);
            }
            
            if (imgsOut !== '') {
                if (recentCol < $('.outputImgs .w3-col').length){
                    recentCol = recentCol + 1;
                } else {
                    recentCol = 1;
                }
                $('.col' + recentCol).append(imgsOut);
            }
        };
        
        var slider = document.getElementById("quality");
        var output = document.getElementById("qualityValue");
        slider.value = slider.max;
        output.innerHTML = slider.value + "-<b>max</b>";
        slider.oninput = function() {
          output.innerHTML = this.value;
          if(parseInt(this.value) == slider.max){
              output.innerHTML = output.innerHTML + "-<b>max</b>";
          }
        };
        $('#outputFormat').change(function(){
            if ($('#outputFormat').val() === 'jpg') {
                $('#exifData').prop('checked', true);
            }
        });
        
        $('#autoOptimizeQuality').change(function(){
            var isChecked = $(this).is(':checked');
            $('#quality').attr('disabled', isChecked);
            $('.qualityC').css('opacity', isChecked ? 0.4 : 1);
        });
    };

    function doAfterPageRendered(){
        loadDeferredStyle('https://dkbg1jftzfsd2.cloudfront.net/style/convert/heic-to-jpg.css');
        $('.downloadBtnContainer').hide();
        $('#outputFormat').change(function(e){
            if ($(this).val() === "pdf"){
                $('.dimensionOptsC').show();
            } else {
                $('.dimensionOptsC').hide();
            }
        })
    };
    
    function getInfosHook(){
        if (heathyHost && ($('#autoOptimizeQuality').attr('data-default-check-from-status') == true || $('#autoOptimizeQuality').attr('data-default-check-from-status') === 'true')) {
            $('#autoOptimizeQuality').prop('checked', true);
            $('#quality').attr('disabled', true);
            $('.qualityC').css('opacity', 0.4);
        } else {
            $('#quality').attr('disabled', false);
            $('.qualityC').css('opacity', 1);
        }
    };
</script>

<!-- E4 freetool-migration: ADDITIVE in-browser HEIC->JPG/PNG/WebP path (heic-to, zero upload).
     The server multi-file convert path above (upload -> callAjax) is UNTOUCHED. This client
     path decodes HEIC entirely on the device (libheif WASM). Activates only when the
     client-mode controls (added in ui_and_skill) are present. -->
<script>
    // Idempotent lazy-loader for the self-hosted heic-to IIFE (window.HeicTo; libheif WASM inlined).
    function ftoLoadHeicTo() {
        if (window.HeicTo) { return Promise.resolve(); }
        if (window.__ftoHeicToPromise) { return window.__ftoHeicToPromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/heic-to';
        window.__ftoHeicToPromise = new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = base + '/heic-to.js'; s.async = true;
            s.onload = function () { window.HeicTo ? resolve() : reject(new Error('heic-to loaded but HeicTo global is missing')); };
            s.onerror = function () { reject(new Error('failed to load heic-to from ' + base)); };
            document.head.appendChild(s);
        });
        return window.__ftoHeicToPromise;
    }

    // Real client-side HEIC decode. opts: { format:'jpg'|'png'|'webp', quality:1-100 }.
    // Mirrors the source convertHeicInBrowser: HeicTo({blob,type,quality/100}) with a 60s
    // timeout race. Returns { blob, ext }. Zero backend calls (libheif WASM in-browser).
    function ftoClientHeicConvert(file, opts, onProgress) {
        opts = opts || {};
        var fmt = (opts.format === 'png') ? 'png' : (opts.format === 'webp') ? 'webp' : 'jpg';
        var mime = fmt === 'png' ? 'image/png' : fmt === 'webp' ? 'image/webp' : 'image/jpeg';
        var quality = Math.min(100, Math.max(1, parseInt(opts.quality, 10) || 80)) / 100;
        return ftoLoadHeicTo().then(function () {
            if (typeof onProgress === 'function') { onProgress(0.2); }
            var conv = window.HeicTo({ blob: file, type: mime, quality: quality });
            var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('Conversion timed out after 60s')); }, 60000); });
            return Promise.race([conv, timeout]).then(function (blob) {
                if (typeof onProgress === 'function') { onProgress(1); }
                return { blob: blob, ext: fmt };
            });
        });
    }

    /* ----------------------------------------------------------------------
     * BATCH in-browser convert (2026-08-15, operator ask).
     *
     * Was: one file per click, one #hjDownload anchor, no preview. The panel
     * accepted a single file while the SERVER path above it has always taken a
     * batch - so a reader with 30 iPhone photos had to either upload them or
     * click through the panel 30 times, and the page's own copy ("Upload one
     * photo or a batch") only held for the server path.
     *
     * Now: N files converted sequentially (sequential, not parallel - libheif
     * WASM decode is memory-heavy and a 30-photo parallel fan-out is how you
     * OOM a phone), one preview card + its own download per photo, plus
     * "Download all as ZIP" for the whole run. Mirrors the shape already proven
     * on extract-gif-to-image-frames (#gfZipBtn / gfRenderFrames / gfZipAll)
     * rather than inventing a fourth output affordance.
     *
     * A per-file failure does NOT abort the run - it is counted and reported,
     * and the photos that did convert stay downloadable.
     *
     * Backwards-compatible on purpose: with exactly ONE file picked the legacy
     * #hjDownload anchor is still populated, so the tool-heictojpg E2E flow
     * (expect_visible #hjDownload[href]) keeps passing unchanged.
     * -------------------------------------------------------------------- */
    var hjResults = [];
    var hjJszipLoading = false;

    function hjId(id) { return document.getElementById(id); }
    function hjVal(id, d) { var el = hjId(id); return el ? el.value : d; }
    function hjSetStatus(m) { var el = hjId('hjStatus'); if (el) { el.textContent = m; } }
    function hjEscape(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function hjSetProgress(pct, label) {
        var wrap = hjId('hjProgressWrap'); if (wrap) { wrap.style.display = (pct == null) ? 'none' : ''; }
        var bar = hjId('hjProgress'); if (bar && pct != null) { bar.value = pct; }
        var txt = hjId('hjProgressVal');
        if (txt) { txt.textContent = (pct == null) ? '' : ((label ? label + ' ' : '') + Math.round(pct) + '%'); }
    }

    function hjEnsureJszip(cb) {
        if (typeof JSZip !== 'undefined') { cb(); return; }
        if (hjJszipLoading) { setTimeout(function () { hjEnsureJszip(cb); }, 150); return; }
        hjJszipLoading = true;
        var url = 'https://dkbg1jftzfsd2.cloudfront.net/script/lib/jszip.min.js';
        if (typeof loadScript === 'function') {
            loadScript(url, function () { hjJszipLoading = false; cb(); });
        } else {
            var s = document.createElement('script');
            s.src = url; s.async = true;
            s.onload = function () { hjJszipLoading = false; cb(); };
            s.onerror = function () { hjJszipLoading = false; cb(); };
            document.head.appendChild(s);
        }
    }

    function hjClearResults() {
        for (var i = 0; i < hjResults.length; i++) {
            try { URL.revokeObjectURL(hjResults[i].url); } catch (e) {}
        }
        hjResults = [];
        var out = hjId('hjOut'); if (out) { out.innerHTML = ''; }
        var zip = hjId('hjZipBtn'); if (zip) { zip.style.display = 'none'; }
        var dl = hjId('hjDownload');
        if (dl) { dl.style.display = 'none'; dl.removeAttribute('href'); dl.removeAttribute('download'); }
    }

    function hjRenderCards(list) {
        var out = hjId('hjOut'); if (!out) { return; }
        var html = '';
        for (var i = 0; i < list.length; i++) {
            html += '<div class="ftol-ct-card">'
                 + '<img loading="lazy" alt="" src="' + list[i].url + '">'
                 + '<span class="ftol-ct-card-name">' + hjEscape(list[i].name) + '</span>'
                 + '<a class="w3-button w3-small w3-light-grey" href="' + list[i].url + '" download="' + hjEscape(list[i].name) + '">Download</a>'
                 + '</div>';
        }
        out.innerHTML = html;
    }

    function hjZipAll() {
        if (!hjResults.length) { return; }
        var btn = hjId('hjZipBtn');
        if (btn) { btn.disabled = true; }
        hjEnsureJszip(function () {
            if (typeof JSZip === 'undefined') {
                hjSetStatus('Could not load the zip library in this browser. Use the per-photo Download buttons below.');
                if (btn) { btn.disabled = false; }
                return;
            }
            var zip = new JSZip();
            for (var i = 0; i < hjResults.length; i++) { zip.file(hjResults[i].name, hjResults[i].blob); }
            zip.generateAsync({ type: 'blob' }).then(function (blob) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'heic-converted-' + (typeof getCurrentDateTime === 'function' ? getCurrentDateTime() : 'export') + '.zip';
                a.click();
                setTimeout(function () { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 30000);
            }).catch(function () {
                hjSetStatus('Could not build the zip file. Use the per-photo Download buttons below.');
            }).then(function () { if (btn) { btn.disabled = false; } });
        });
    }

    // Guarded wiring to the client-mode controls (added in ui_and_skill). No-op until then.
    function ftoWireClientHeicToJpg() {
        var input = document.getElementById('hjClientFile');
        var btn = document.getElementById('hjClientBtn');
        if (!input || !btn) { return; }
        // E4 verify-fix: relocate this client panel out of any hidden server-flow .step
        // so the in-browser (no-upload) tool is visible without uploading. No-op when not nested.
        var __ftoRow = btn.closest ? btn.closest('.w3-row') : null;
        var __ftoStep = __ftoRow && __ftoRow.closest ? __ftoRow.closest('.step') : null;
        if (__ftoStep && __ftoStep.parentNode) { __ftoStep.parentNode.insertBefore(__ftoRow, __ftoStep.nextSibling); }
        var dl = document.getElementById('hjDownload');
        var zipBtn = document.getElementById('hjZipBtn');

        hjSetProgress(null);
        if (zipBtn) {
            zipBtn.addEventListener('click', function () { hjZipAll(); });
        }
        input.addEventListener('change', function () { hjClearResults(); hjSetStatus(''); hjSetProgress(null); });

        btn.addEventListener('click', function () {
            var files = (input.files && input.files.length) ? Array.prototype.slice.call(input.files) : [];
            if (!files.length) { hjSetStatus('Select one or more HEIC files to convert.'); return; }
            btn.disabled = true;
            hjClearResults();
            var fmt = hjVal('hjFormat', 'jpg');
            var quality = hjVal('hjQuality', '80');
            var done = [], failed = 0, index = 0;
            hjSetStatus(files.length === 1
                ? 'Converting in your browser ...'
                : 'Converting ' + files.length + ' photos in your browser, one at a time ...');
            hjSetProgress(0, 'photos');

            function finish() {
                hjResults = done;
                hjRenderCards(done);
                hjSetProgress(100, 'done');
                setTimeout(function () { hjSetProgress(null); }, 800);
                if (done.length > 1 && zipBtn) { zipBtn.style.display = ''; }
                if (done.length === 1 && dl) {
                    // legacy single-file affordance - keeps the E2E flow green
                    dl.href = done[0].url; dl.download = done[0].name;
                    dl.style.display = ''; dl.textContent = 'Download .' + fmt;
                }
                var kb = 0;
                for (var i = 0; i < done.length; i++) { kb += done[i].blob.size / 1024; }
                if (!done.length) {
                    hjSetStatus('Could not convert any of those files in the browser. The server convert above still works.');
                } else {
                    hjSetStatus('Done in your browser - no upload. '
                        + done.length + (done.length === 1 ? ' photo' : ' photos') + ' converted to ' + fmt.toUpperCase()
                        + ' (' + kb.toFixed(0) + ' KB total)'
                        + (failed ? '. ' + failed + (failed === 1 ? ' file' : ' files') + ' could not be read and were skipped.' : '.'));
                }
                btn.disabled = false;
            }

            function next() {
                if (index >= files.length) { finish(); return; }
                var file = files[index];
                var base = index * (100 / files.length);
                ftoClientHeicConvert(file, { format: fmt, quality: quality }, function (frac) {
                    hjSetProgress(base + (frac * 100 / files.length), 'photo ' + (index + 1) + ' of ' + files.length);
                }).then(function (res) {
                    var name = ((file.name || 'image').replace(/\.[^.]+$/, '') || 'image') + '.' + res.ext;
                    done.push({ name: name, blob: res.blob, url: URL.createObjectURL(res.blob) });
                }).catch(function () {
                    failed += 1;
                }).then(function () {
                    index += 1;
                    hjSetProgress(index * (100 / files.length), 'photos');
                    next();
                });
            }

            // Optional pre-check on the first file: warn (do not block) if it does not look like HEIC.
            ftoLoadHeicTo().then(function () {
                return (window.HeicTo && window.HeicTo.isHeic) ? window.HeicTo.isHeic(files[0]).catch(function () { return true; }) : true;
            }).then(function (isH) {
                if (isH === false) { hjSetStatus('That file does not look like HEIC; trying anyway ...'); }
                next();
            }).catch(function (err) {
                hjSetProgress(null);
                hjSetStatus('Could not convert in the browser: ' + (err && err.message ? err.message : 'unknown error') + '. The server convert above still works.');
                btn.disabled = false;
            });
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ftoWireClientHeicToJpg);
    } else {
        ftoWireClientHeicToJpg();
    }
</script>

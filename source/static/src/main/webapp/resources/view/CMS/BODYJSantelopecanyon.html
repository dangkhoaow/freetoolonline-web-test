<script>
    // 3D scene archetype skeleton (antelope-canyon) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (antelope-canyon).
    // All geometry is procedural. places-3d cluster, authored 2026-07-27.
    //
    // EDUCATIONAL APPROXIMATION, not survey geology.
    // Published figures (NPS/Navajo Parks & Recreation consensus, cross-checked 2026-07-27):
    //   - Upper Antelope Canyon walls up to about 37 m (120 ft) high
    //   - Lower Antelope Canyon about 400 m (1,335 ft) long
    //   - Carved into Navajo Sandstone, deposited about 190 million years ago
    //     (Early Jurassic) as wind-blown dune sand
    //   - Canyon shape carved by flash-flood erosion, still actively changing
    //   - Light-beam effect roughly late May to early September, near midday
    //   - Navajo Nation land near Page, Arizona, USA - guided access only
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'antelope-canyon';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesantelopecanyon'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0d0a12, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var key = new THREE.DirectionalLight(0xffe0b0, 0.9);
        key.position.set(-8, 14, 6);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return { mesh: new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0 })), geo: geo, pos: pos };
        }

        // Narrow winding slot cut into a low plateau. 1 unit = 3 m vertical,
        // so the 37 m Upper-Antelope wall height is about 12.3 units. The
        // channel winds (chan) AND its half-width pinches/widens along z
        // (halfWidth) - the alternating narrow pinch-points and wider
        // alcoves are the defining "wave" shape of a slot canyon, distinct
        // from the wide meandering gorge used for Grand Canyon.
        var RIM = 0.0, DEPTH = 12.3;
        function chan(z) { return 1.9 * Math.sin(z * 0.42 + 0.6) + 0.8 * Math.sin(z * 0.17 - 0.4); }
        function halfWidth(z) { return Math.max(0.4, 1.05 + 0.55 * Math.sin(z * 0.75 + 1.1) + 0.25 * Math.sin(z * 0.31 - 0.8)); }
        function carveWave(d, w, depth) {
            if (d >= w) return 0;
            var t = 1 - d / w; // 0 at wall, 1 at channel center
            var s = t * t * (3 - 2 * t); // smoothstep -> flowing wall, not terraced
            return depth * Math.pow(s, 0.82);
        }
        function height(x, z) {
            var h = RIM + 0.12 * (fbm(x * 0.5 + 4, z * 0.5 + 9, 3) - 0.5);
            var cx = chan(z), w = halfWidth(z), d = Math.abs(x - cx);
            h -= carveWave(d, w, DEPTH + 0.4 * fbm(z * 0.6 + 2, x * 0.6 + 5, 3));
            // wave-ripple micro-texture on the walls - the sandstone "flow lines"
            if (d < w * 1.3) {
                var wallFrac = 1 - Math.min(1, d / w);
                h -= 0.10 * wallFrac * fbm(x * 2.6 + 3, z * 1.1 + 7, 3);
            }
            return Math.max(h, RIM - DEPTH - 0.3);
        }
        // Warm sandstone gradient: deep shadow (purple/blue) at the channel
        // floor, rising through orange/gold mid-wall, to a pale cream rim -
        // approximating how reflected light warms the walls near the top of
        // a slot canyon. bandsOn overlays finer cross-bedding stripes (the
        // real aeolian dune layering preserved in Navajo Sandstone).
        var col = {
            shadow: new THREE.Color(0x2c1f45), mid: new THREE.Color(0xb0522a),
            warm: new THREE.Color(0xe08a3c), rim: new THREE.Color(0xdccBA0)
        };
        var bandsOn = false, beamOn = true;
        function baseColor(c, u, x, z) {
            if (u < 0.55) { c.copy(col.rim).lerp(col.warm, smooth(0, 0.55, u)); }
            else if (u < 0.85) { c.copy(col.warm).lerp(col.mid, smooth(0.55, 0.85, u)); }
            else { c.copy(col.mid).lerp(col.shadow, smooth(0.85, 1.0, u)); }
        }
        function color(c, h, x, z) {
            var u = smooth(RIM - DEPTH, RIM, h);
            u = 1 - u; // 0 at rim, 1 at floor
            baseColor(c, u, x, z);
            var n = 0.92 + 0.16 * fbm(x * 1.6 + 5, z * 1.6 + 11, 3);
            if (bandsOn) {
                // Cross-bedding stripes: thin sinusoidal bands following the
                // ancient dune slip-faces, angled across the wall height.
                var stripe = 0.5 + 0.5 * Math.sin((u * 26 + x * 1.4) * Math.PI);
                n *= 0.82 + 0.28 * smooth(0.3, 0.7, stripe);
            }
            c.multiplyScalar(n);
        }
        var terrainInfo = makeTerrain(9, 15, shell.low ? 130 : 190, shell.low ? 150 : 220, height, color);
        scene.add(terrainInfo.mesh);

        // Midday light-beam marker: a soft cone of light shining down into
        // the slot at one opening point along the canyon, plus a warm glow
        // disc where it hits the floor - the effect the canyon is famous for.
        var BEAM_Z = 2.2, BEAM_X = chan(BEAM_Z);
        var beamGroup = new THREE.Group();
        var beamCone = new THREE.Mesh(
            new THREE.ConeGeometry(1.5, 9.5, 24, 1, true),
            new THREE.MeshBasicMaterial({ color: 0xfff2c2, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false })
        );
        beamCone.position.set(BEAM_X, RIM + 4.6, BEAM_Z);
        beamGroup.add(beamCone);
        var beamGlow = new THREE.Mesh(
            new THREE.CircleGeometry(0.9, 24),
            new THREE.MeshBasicMaterial({ color: 0xffdf8a, transparent: true, opacity: 0.55, depthWrite: false })
        );
        beamGlow.rotation.x = -Math.PI / 2;
        beamGlow.position.set(BEAM_X, RIM - DEPTH + 0.55, BEAM_Z);
        beamGroup.add(beamGlow);
        scene.add(beamGroup);

        function recolor() {
            var pos = terrainInfo.pos, geo = terrainInfo.geo, colors = geo.attributes.color, c2 = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                color(c2, pos.getY(i), pos.getX(i), pos.getZ(i));
                colors.setXYZ(i, c2.r, c2.g, c2.b);
            }
            colors.needsUpdate = true;
        }

        function panelHtml() {
            return '<h3>Antelope Canyon: a narrow wave-carved slot</h3>' +
                '<p>The channel here winds and pinches along its length - alternating narrow slots and wider alcoves - the signature shape flash floods carve into Navajo Sandstone.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Wall height (Upper)</td><td>about 37 m (120 ft)</td></tr>' +
                '<tr><td>Length (Lower)</td><td>about 400 m (1,335 ft)</td></tr>' +
                '<tr><td>Rock type</td><td>Navajo Sandstone, wind-blown dunes</td></tr>' +
                '<tr><td>Sandstone age</td><td>about 190 million years</td></tr>' +
                '<tr><td>Carved by</td><td>flash-flood erosion, still ongoing</td></tr>' +
                '<tr><td>Location</td><td>Navajo Nation, near Page, Arizona</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the wall shapes, light beam, and cross-bedding bands are schematic teaching cues, not survey geology.</p>';
        }

        function apply() {
            beamGroup.visible = beamOn;
            var bb = document.getElementById('t3dPacBeamBtn');
            if (bb) bb.textContent = 'Light beam: ' + (beamOn ? 'On' : 'Off');
            var nb = document.getElementById('t3dPacBandsBtn');
            if (nb) nb.textContent = 'Cross-bedding bands: ' + (bandsOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ beamOn: beamOn, bandsOn: bandsOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.beamOn === 'boolean') beamOn = store.beamOn;
        if (typeof store.bandsOn === 'boolean') bandsOn = store.bandsOn;
        recolor();
        apply();

        var beamBtn = document.getElementById('t3dPacBeamBtn');
        if (beamBtn) beamBtn.addEventListener('click', function () { beamOn = !beamOn; apply(); });
        var bandsBtn = document.getElementById('t3dPacBandsBtn');
        if (bandsBtn) bandsBtn.addEventListener('click', function () { bandsOn = !bandsOn; recolor(); apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the light beam or the cross-bedding bands.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
            if (beamOn) { beamCone.material.opacity = 0.13 + 0.05 * Math.sin(performance.now() * 0.0006); }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesantelopecanyon: 't3dPacControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesantelopecanyon: { radius: 15.5, maxR: 40, minR: 5, phi: 1.08, theta: 0.75, targetY: -5.5 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

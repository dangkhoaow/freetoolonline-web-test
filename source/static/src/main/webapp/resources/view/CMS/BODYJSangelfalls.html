<script>
    // 3D scene archetype (angel-falls) - vendored three.js (ESM,
    // dynamic import from /vendor/three/, NO CDN engine), fully client-side.
    // places-3d cluster, places-3d-discovery-loop-runbook, 2026-08-27.
    //
    // EDUCATIONAL APPROXIMATION, not a survey-grade hydrological model.
    // Published figures (cross-checked 2026-08-27):
    //   - Total height about 979 m (3,212 ft) - the world's tallest
    //     waterfall
    //   - Longest single, uninterrupted free-fall drop about 807 m
    //     (2,648 ft), before the water reaches the lower cascades
    //   - Sits on the edge of Auyan-tepui (summit about 2,535 m / 8,320 ft),
    //     a table mountain in Canaima National Park, Bolivar State,
    //     Venezuela
    //   - Fed by the Churun River, which plunges off the tepui's sheer
    //     sandstone edge
    //   - Indigenous Pemon name Kerepakupai Vena ("waterfall of the
    //     deepest place"); the common name honors US aviator Jimmie
    //     Angel, who flew over it in 1933 and helped publicize it
    //   - During the dry season (roughly December-March) the flow can
    //     drop sharply, sometimes reducing the falls to a fine mist
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'angel-falls';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesangelfalls'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0xa7c9dc, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.78));
        var key = new THREE.DirectionalLight(0xffffff, 1.0);
        key.position.set(-8, 20, 12);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.7, metalness: 0 }));
        }

        // The signature figure is the SHEER DROP itself: a flat tepui
        // summit plateau, a steep near-vertical sandstone wall, and a
        // jungle valley floor far below - the total elevation change (not
        // any lateral spread) is what makes this the world's tallest
        // waterfall. A narrow notch in the wall carries the Churun
        // River's plunge; everywhere else is dry cliff face.
        var NOTCH_HALF = 1.5, CREST_Z = 0.3, WALL_BAND = 0.55;
        var Y_TOP = 3.0, Y_VALLEY = -7.6;

        function inNotch(x) { return Math.abs(x) < NOTCH_HALF; }
        function channelEdge(x) { return inNotch(x) ? (1 - Math.abs(x) / NOTCH_HALF) : 0; }
        function height(x, z) {
            var n = fbm(x * 0.32 + 4, z * 0.32 + 4, 3) - 0.5;
            var t = smooth(CREST_Z - WALL_BAND, CREST_Z + WALL_BAND, z);
            var edge = channelEdge(x);
            var plateauH = Y_TOP + n * 0.22 - edge * 0.4; // shallow river groove approaching the rim
            var valleyH = Y_VALLEY + n * 0.7 - edge * 1.1; // plunge pool + outflow groove
            return plateauH + (valleyH - plateauH) * t;
        }

        function colorAt(c, x, z) {
            var t = smooth(CREST_Z - WALL_BAND, CREST_Z + WALL_BAND, z);
            var edge = channelEdge(x);
            if (t < 0.15) {
                // tepui summit: flat rock with sparse highland scrub
                c.setHex(edge > 0.4 ? 0x5f7a52 : 0x8f8a6e);
                return;
            }
            if (t > 0.85) {
                // valley floor far below: dense jungle, with a blue
                // plunge-pool/river channel where the falls lands
                var d = z - CREST_Z;
                if (edge > 0.35 && d < 6.5) { c.setHex(0x2f6f95); return; } // plunge pool + river
                c.setHex(0x2f5a34); // rainforest canopy
                return;
            }
            // sheer wall: wet dark rock in the notch, dry tan sandstone elsewhere
            c.setHex(edge > 0.3 ? 0x565a52 : 0xb08a5e);
        }

        var terrain = makeTerrain(20, 30, shell.low ? 130 : 180, shell.low ? 150 : 210, height, function (c, h, x, z) { colorAt(c, x, z); });
        scene.add(terrain);

        // Falls water column: an upper gradient of stacked cylinder
        // segments for the longest single free-fall drop (about 807 m of
        // the 979 m total), then below the break line either a
        // continuing solid column (mistOn=false, idealized) or a
        // widening particle mist cloud (mistOn=true, realistic - much of
        // the water atomizes before it ever reaches the base pool).
        var TOTAL_DROP = Y_TOP - Y_VALLEY;
        var BREAK_FRAC = 807 / 979;
        var breakY = Y_TOP - BREAK_FRAC * TOTAL_DROP;
        var streamGroup = new THREE.Group();

        function gradientColumn(y0, y1, r0, r1, hex0, hex1, segs) {
            var g = new THREE.Group();
            var c0 = new THREE.Color(hex0), c1 = new THREE.Color(hex1);
            for (var i = 0; i < segs; i++) {
                var f0 = i / segs, f1 = (i + 1) / segs;
                var segY0 = y0 + (y1 - y0) * f0, segY1 = y0 + (y1 - y0) * f1;
                var segR0 = r0 + (r1 - r0) * f0, segR1 = r0 + (r1 - r0) * f1;
                var col = c0.clone().lerp(c1, (f0 + f1) / 2);
                var geo = new THREE.CylinderGeometry(segR1, segR0, Math.abs(segY1 - segY0), 10, 1, true);
                var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, roughness: 0.35, transparent: true, opacity: 0.88 }));
                mesh.position.set(0, (segY0 + segY1) / 2, CREST_Z);
                g.add(mesh);
            }
            return g;
        }

        var upperStream = gradientColumn(Y_TOP - 0.1, breakY, 0.55, 0.42, 0x3a6ea5, 0xe8f0f5, 5);
        streamGroup.add(upperStream);

        var solidLowerStream = gradientColumn(breakY, Y_VALLEY + 0.4, 0.42, 0.32, 0xe8f0f5, 0xd7e6ee, 4);
        streamGroup.add(solidLowerStream);

        // Mist cloud: widening particle spray below the break line - the
        // dry-season fact ("the flow can drop to a fine mist") is the
        // same physical effect this represents at full flow.
        var MIST_COUNT = shell.low ? 220 : 420;
        var mistGeo = new THREE.BufferGeometry();
        var mistPos = new Float32Array(MIST_COUNT * 3);
        for (var mi = 0; mi < MIST_COUNT; mi++) {
            var f = Math.random();
            var y = breakY - f * (breakY - (Y_VALLEY + 0.3));
            var spread = 0.5 + f * 2.6;
            var ang = Math.random() * Math.PI * 2;
            var r = Math.random() * spread;
            mistPos[mi * 3] = Math.cos(ang) * r;
            mistPos[mi * 3 + 1] = y + (Math.random() - 0.5) * 0.4;
            mistPos[mi * 3 + 2] = CREST_Z + Math.sin(ang) * r * 0.6;
        }
        mistGeo.setAttribute('position', new THREE.BufferAttribute(mistPos, 3));
        var mistCloud = new THREE.Points(mistGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.32, transparent: true, opacity: 0.55, sizeAttenuation: true }));
        streamGroup.add(mistCloud);
        scene.add(streamGroup);

        // Break-line marker: a flat gold ring at the boundary between the
        // 807 m longest single drop and the remaining lower cascades.
        var marker = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.05, 8, 40), new THREE.MeshStandardMaterial({ color: 0xffe08a }));
        marker.rotation.x = Math.PI / 2;
        marker.position.set(0, breakY, CREST_Z);
        scene.add(marker);

        var mistOn = true, markerOn = true;

        function panelHtml() {
            return '<h3>Angel Falls: the world\'s tallest waterfall</h3>' +
                '<p>The Churun River plunges off the edge of Auyan-tepui in one long free-fall, then continues down through lower cascades to the valley floor.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Total height</td><td>about 979 m (3,212 ft)</td></tr>' +
                '<tr><td>Longest single drop</td><td>about 807 m (2,648 ft)</td></tr>' +
                '<tr><td>Source river</td><td>Churun River</td></tr>' +
                '<tr><td>Tepui summit elevation</td><td>about 2,535 m (8,320 ft)</td></tr>' +
                '<tr><td>Location</td><td>Canaima National Park, Bolivar State, Venezuela</td></tr>' +
                '<tr><td>Indigenous name</td><td>Kerepakupai Vena</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the tepui shape, wall profile, and water column are procedural teaching cues, not a survey-grade hydrological model.</p>';
        }

        function apply() {
            mistCloud.visible = mistOn;
            solidLowerStream.visible = !mistOn;
            marker.visible = markerOn;
            var mb = document.getElementById('t3dAngMistBtn');
            if (mb) mb.textContent = 'Mist dispersal: ' + (mistOn ? 'On' : 'Off');
            var kb = document.getElementById('t3dAngMarkerBtn');
            if (kb) kb.textContent = 'Free-fall marker: ' + (markerOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ mistOn: mistOn, markerOn: markerOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.mistOn === 'boolean') mistOn = store.mistOn;
        if (typeof store.markerOn === 'boolean') markerOn = store.markerOn;
        apply();

        var mistBtn = document.getElementById('t3dAngMistBtn');
        if (mistBtn) mistBtn.addEventListener('click', function () { mistOn = !mistOn; apply(); });
        var markerBtn = document.getElementById('t3dAngMarkerBtn');
        if (markerBtn) markerBtn.addEventListener('click', function () { markerOn = !markerOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the mist dispersal or the free-fall segment marker.');
        return function animate(dt) {
            mistCloud.rotation.y += dt * 0.00012;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesangelfalls: 't3dAngControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesangelfalls: { radius: 42, maxR: 90, minR: 12, phi: 0.85, theta: 0.5, targetY: -2.2 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

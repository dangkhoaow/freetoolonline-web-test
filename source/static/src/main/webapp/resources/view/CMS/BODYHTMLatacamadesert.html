<div class="w3-container page-section">
  <div id="t3dCanvasHost" role="img" aria-label="Interactive 3D relief view of the Atacama Desert. Drag to orbit the terrain, scroll or pinch to zoom. Toggle the salt-flat and heat-zone overlays with the buttons below." style="width: 100%; height: 600px; border-radius: 8px; overflow: hidden; margin: 16px 0;"></div>
  <div id="t3dP00Controls" class="w3-bar w3-light-gray" role="group" aria-label="Atacama Desert 3D overlay controls" style="margin-top: 12px; gap: 12px; padding: 8px;">
    <button id="t3dToggleSalt" class="w3-button w3-white w3-border" aria-label="Toggle the salt-flat overlay on the 3D map" style="margin-right: 8px;"><b>Salt Flats:</b> <span id="t3dStatusSalt">ON</span></button>
    <button id="t3dToggleTemp" class="w3-button w3-white w3-border;" aria-label="Toggle the heat-zone overlay on the 3D map"><b>Heat Zones:</b> <span id="t3dStatusTemp">ON</span></button>
  </div>
</div>

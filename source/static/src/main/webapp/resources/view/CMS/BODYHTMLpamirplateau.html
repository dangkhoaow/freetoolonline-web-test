<div id="t3dCanvasHost" style="position: relative; width: 100%; height: 500px; background: #1a1a2e; border-radius: 8px; overflow: hidden;">
  <canvas id="t3dCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
  <div id="t3dStatus" style="position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.7); color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-family: monospace; z-index: 10;">Loading 3D scene...</div>
  <div id="t3dInfoPanel" style="position: absolute; bottom: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px 15px; border-radius: 4px; font-size: 13px; max-width: 250px; z-index: 10;"></div>
  <button id="t3dFullscreenBtn" style="position: absolute; bottom: 10px; right: 10px; padding: 6px 12px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; z-index: 10;">Fullscreen</button>
</div>

<div id="t3dPampControls" style="margin-top: 15px; display: flex; gap: 15px; flex-wrap: wrap;">
  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px;">
    <input type="checkbox" id="t3dToggle1Pamp" style="cursor: pointer;" />
    Valley elevation bands
  </label>
  <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px;">
    <input type="checkbox" id="t3dToggle2Pamp" style="cursor: pointer;" />
    Peak range highlights
  </label>
</div>

<p style="margin-top: 20px; font-size: 13px; color: #666;">
  <strong>How to interact:</strong> Use your mouse or trackpad to rotate the 3D view. Scroll to zoom in/out. Toggle the options above to switch between different data visualization modes.
</p>

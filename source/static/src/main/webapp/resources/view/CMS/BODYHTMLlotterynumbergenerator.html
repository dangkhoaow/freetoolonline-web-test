<div class="w3-container step1">
    <div class="w3-row w3-margin-bottom">
        <label class="w3-text-grey w3-small" for="lotteryType"><b>Lottery type</b></label>
        <select id="lotteryType" class="w3-input w3-border w3-round">
            <option value="powerball">Powerball (US) - pick 5 from 1-69 + 1 from 1-26</option>
            <option value="megamillions">Mega Millions (US) - pick 5 from 1-70 + 1 from 1-25</option>
            <option value="euromillions">EuroMillions - pick 5 from 1-50 + 2 from 1-12</option>
            <option value="uk49s">UK 49s - pick 6 from 1-49</option>
            <option value="canada649">Lotto 6/49 (Canada) - pick 6 from 1-49</option>
            <option value="ozlotto">Oz Lotto (Australia) - pick 7 from 1-47</option>
            <option value="custom">Custom range...</option>
        </select>
    </div>
    <div id="customGroup" style="display:none">
        <div class="w3-row w3-margin-bottom">
            <div class="w3-col s4" style="padding-right:8px">
                <label class="w3-text-grey w3-small" for="customMin"><b>Min number</b></label>
                <input id="customMin" type="number" class="w3-input w3-border w3-round" value="1" min="1" max="999">
            </div>
            <div class="w3-col s4" style="padding-right:8px">
                <label class="w3-text-grey w3-small" for="customMax"><b>Max number</b></label>
                <input id="customMax" type="number" class="w3-input w3-border w3-round" value="49" min="1" max="999">
            </div>
            <div class="w3-col s4">
                <label class="w3-text-grey w3-small" for="customCount"><b>How many to pick</b></label>
                <input id="customCount" type="number" class="w3-input w3-border w3-round" value="6" min="1" max="50">
            </div>
        </div>
    </div>
    <div class="w3-row w3-margin-bottom">
        <label class="w3-text-grey w3-small" for="ticketCount"><b>Number of tickets</b></label>
        <select id="ticketCount" class="w3-input w3-border w3-round">
            <option value="1">1 ticket</option>
            <option value="2">2 tickets</option>
            <option value="3">3 tickets</option>
            <option value="5">5 tickets</option>
            <option value="10">10 tickets</option>
        </select>
    </div>
    <button id="generateBtn" class="w3-button w3-green w3-round">Generate Lucky Numbers</button>
</div>

<div class="w3-container" style="margin-top:12px">
    <div class="outputImgs"></div>
</div>

<div class="w3-container w3-padding-small" style="margin-top:8px">
    <p>Numbers are picked using your browser's <code>crypto.getRandomValues</code> - the same cryptographically secure source used for password generation. Each number is equally likely; no number is "due" or "overdue".</p>
</div>

<div class="w3-container">
    <p>Pick a sound below, then click Play - the sleep timer is optional.</p>
</div>

<style>
    #whiteNoiseTool .wn-row { margin-bottom: 14px; }
    #whiteNoiseTool select.w3-select,
    #whiteNoiseTool input[type="range"] { max-width: 320px; margin: 0 auto; }
    #whiteNoiseTool .wn-viz {
        display: flex; align-items: flex-end; justify-content: center; gap: 4px;
        height: 64px; margin: 14px auto; max-width: 260px;
    }
    #whiteNoiseTool .wn-bar {
        width: 10px; height: 18px; background: #90a4ae; border-radius: 3px 3px 0 0;
        animation: wn-pulse 1s ease-in-out infinite;
    }
    #whiteNoiseTool .wn-viz.wn-viz-active .wn-bar { background: #1565c0; }
    @keyframes wn-pulse {
        0%, 100% { height: 10px; }
        50% { height: 56px; }
    }
    #whiteNoiseTool .wn-status {
        font-family: monospace; min-height: 1.4em; margin-top: 8px;
    }
    #whiteNoiseTool .wn-timer-readout {
        font-family: monospace; min-height: 1.2em; margin-top: 4px; color: #555;
    }
</style>

<div id="whiteNoiseTool" class="w3-container outputImgs" style="text-align:center; visibility:visible !important; min-height:220px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>

    <div id="wnViz" class="wn-viz" aria-hidden="true"></div>

    <div class="wn-row">
        <label class="w3-label" for="wnType"><b>Sound</b></label>
        <select id="wnType" class="w3-select w3-border" style="display:inline-block;">
            <option value="white" selected>White noise</option>
            <option value="pink">Pink noise</option>
            <option value="brown">Brown noise (deep)</option>
            <option value="ocean">Ocean waves (synthesized)</option>
        </select>
    </div>

    <div class="wn-row">
        <label class="w3-label" for="wnVolume"><b>Volume</b></label>
        <input type="range" id="wnVolume" class="w3-input" min="0" max="100" step="1" value="60"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" style="display:inline-block;">
    </div>

    <div class="wn-row">
        <label class="w3-label" for="wnTimer"><b>Sleep timer</b></label>
        <select id="wnTimer" class="w3-select w3-border" style="display:inline-block;">
            <option value="0" selected>Off</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">60 minutes</option>
            <option value="120">120 minutes</option>
        </select>
        <div id="wnTimerReadout" class="wn-timer-readout" aria-live="polite"></div>
    </div>

    <div class="wn-row">
        <button type="button" id="wnPlay" class="w3-button w3-green">Play</button>
        <button type="button" id="wnStop" class="w3-button w3-light-grey" style="margin-left:8px;">Stop</button>
    </div>

    <p id="wnStatus" class="wn-status" aria-live="polite">Ready. Pick a sound and click Play (audio needs a click to start in your browser).</p>
</div>

<script>
    // 3D scene archetype skeleton (Olympus Mons Mars Volcano) - vendored
    // three.js (ESM, dynamic import from /vendor/three/, NO CDN), fully
    // client-side. Built LEAN, forked from the kp-index-geomagnetic-storm-scale
    // single-scene shape. All geometry is procedural (a math height function on
    // a displaced plane) - no CDN heightmap asset is used or required.
    //
    // EDUCATIONAL APPROXIMATION, not a survey-grade digital elevation model.
    // The shield shape and caldera dip are a mathematical profile tuned to
    // match the real, published proportions (base diameter, summit height,
    // caldera width/depth) - not a point-cloud reconstruction of the actual
    // surface. A "vertical exaggeration" slider is provided (default 4x) and
    // explicitly disclosed, because at true 1x scale the real slope is so
    // gentle the shield looks almost flat from this camera distance.
    //
    // Published figures (cross-checked via WebSearch 2026-07-24/25):
    //   - Base diameter: NASA Mars Atlas (mars.nasa.gov) cites 624 km; NASA
    //     Science's Viking-1-Orbiter page cites "more than 600 km". This page
    //     uses 624 km as the primary cited figure.
    //   - Summit height above the surrounding plains: NASA sources differ by
    //     reference frame - mars.nasa.gov cites 25 km, NASA Science (Viking
    //     page) cites 27 km, and the planetary-science literature figure
    //     measured relative to the Mars areoid/datum is approximately 21.9 km.
    //     This page uses "approximately 25 km above the surrounding plains
    //     (NASA)" as its primary cited figure and discloses the reference-
    //     frame variance rather than presenting one unqualified number.
    //   - Caldera complex: mars.nasa.gov cites an 80 km wide caldera; NASA
    //     Science's Viking page cites a caldera up to approximately 85 km
    //     wide and nearly 3 km deep. This page uses "approximately 80 km
    //     wide, approximately 3 km deep" as its primary cited figures.
    //   - Why so big: Mars has no plate tectonics, so a volcanic hot spot
    //     stays fixed under the same spot on the crust instead of drifting
    //     away (as Hawaii's hot spot does under the moving Pacific Plate) -
    //     lava keeps building the same shield for hundreds of millions of
    //     years. Mars's surface gravity is also only about 38% of Earth's
    //     (3.71 m/s^2 vs 9.81 m/s^2, NASA) - a taller, wider shield can form
    //     and persist without collapsing under its own weight. Both points
    //     are standard planetary-geology consensus.
    //   - Comparison figures (same "local base to summit" framing as Olympus
    //     Mons's "above the surrounding plains" figure):
    //       Mount Everest: 8,848.86 m above sea level (2020 Nepal/China joint
    //       survey, announced 2020-12-08).
    //       Mauna Loa (Earth's largest active shield volcano): U.S. National
    //       Park Service cites a summit approximately 4,169-4,211 m above sea
    //       level, with the volcano's true base on the ocean floor about
    //       6,000 m below sea level - a base-to-summit height of about
    //       10,211 m (33,500 ft). Above-sea-level footprint approximately
    //       120 km long by 103 km wide (Britannica); the submarine base
    //       extends to about 160 km wide (NPS).
    //   - Distinct from mars-terrain.html (a generic whole-planet MOLA
    //     heightmap explorer, real-asset-driven) - this page is a dedicated,
    //     procedurally-modeled single-feature explorer of ONE specific
    //     landmark with an explicit scale comparison against Mount Everest
    //     and Mauna Loa.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'olympusmonsmarsvolcano';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'olympusmonsmarsvolcano'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 50, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.05, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published figures (see header comment for sources).
    var T3D_OM_BASE_DIAMETER_KM = 624;
    var T3D_OM_HEIGHT_KM = 25;
    var T3D_OM_CALDERA_WIDTH_KM = 80;
    var T3D_OM_CALDERA_DEPTH_KM = 3;
    var T3D_OM_EVEREST_KM = 8.849;
    var T3D_OM_MAUNALOA_KM = 10.211;

    var T3D_OM_BASE_R = 22; // scene units for the 312 km base radius
    var T3D_OM_KM_TO_UNIT = T3D_OM_BASE_R / (T3D_OM_BASE_DIAMETER_KM / 2);
    var T3D_OM_HEIGHT_TRUE = T3D_OM_HEIGHT_KM * T3D_OM_KM_TO_UNIT;
    var T3D_OM_CALDERA_R = (T3D_OM_CALDERA_WIDTH_KM / 2) * T3D_OM_KM_TO_UNIT;
    var T3D_OM_CALDERA_DEPTH_TRUE = T3D_OM_CALDERA_DEPTH_KM * T3D_OM_KM_TO_UNIT;
    var T3D_OM_EVEREST_TRUE = T3D_OM_EVEREST_KM * T3D_OM_KM_TO_UNIT;
    var T3D_OM_MAUNALOA_TRUE = T3D_OM_MAUNALOA_KM * T3D_OM_KM_TO_UNIT;

    function t3dOmHeightAt(x, z) {
        var r = Math.sqrt(x * x + z * z);
        if (r >= T3D_OM_BASE_R) return 0;
        var t = 1 - (r / T3D_OM_BASE_R) * (r / T3D_OM_BASE_R);
        var h = T3D_OM_HEIGHT_TRUE * Math.pow(Math.max(t, 0), 1.3);
        if (r < T3D_OM_CALDERA_R) {
            var ct = 1 - (r / T3D_OM_CALDERA_R) * (r / T3D_OM_CALDERA_R);
            h -= T3D_OM_CALDERA_DEPTH_TRUE * Math.max(ct, 0);
        }
        return Math.max(h, -T3D_OM_CALDERA_DEPTH_TRUE * 0.35);
    }

    function t3dOlympusMonsMarsVolcano(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0c0705, 1);
        scene.add(new THREE.AmbientLight(0xffe0c8, 0.6));
        var sunLight = new THREE.DirectionalLight(0xfff0d8, 1.25);
        sunLight.position.set(24, 30, 14);
        scene.add(sunLight);

        var starN = shell.low ? 220 : 460;
        var starPos = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r = 90 + Math.random() * 110;
            var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r * Math.sin(ph) * Math.cos(th);
            starPos[s * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.6 + 10;
            starPos[s * 3 + 2] = r * Math.sin(ph) * Math.sin(th) - 20;
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffd7c2, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.55 }));
        scene.add(stars);

        // Volcano + surrounding plain (procedural height-displaced plane).
        var planeSize = T3D_OM_BASE_R * 2.6;
        var segs = shell.low ? 60 : 110;
        var geo = new THREE.PlaneGeometry(planeSize, planeSize, segs, segs);
        var pos = geo.attributes.position;
        var colors = new Float32Array(pos.count * 3);
        var lowC = new THREE.Color(0xb5573a), midC = new THREE.Color(0x8c3f28), highC = new THREE.Color(0x5a2418);
        for (var i = 0; i < pos.count; i++) {
            var x = pos.getX(i), y = pos.getY(i);
            var h = t3dOmHeightAt(x, y);
            pos.setZ(i, h);
            var frac = Math.max(0, Math.min(1, h / T3D_OM_HEIGHT_TRUE));
            var col = frac > 0.55 ? midC.clone().lerp(highC, (frac - 0.55) / 0.45) : lowC.clone().lerp(midC, frac / 0.55);
            colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        var volcanoMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0.02, flatShading: false }));
        volcanoMesh.rotation.x = -Math.PI / 2;

        var exagGroup = new THREE.Group();
        exagGroup.add(volcanoMesh);

        // Reference columns (Everest + Mauna Loa), same true-scale + same
        // exaggeration factor as the volcano so the comparison stays honest.
        var compareGroup = new THREE.Group();
        function addColumn(heightTrue, radius, color, xOffset) {
            var col = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius * 1.15, heightTrue, 14),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.7, metalness: 0.05 })
            );
            col.position.set(xOffset, heightTrue / 2, 0);
            compareGroup.add(col);
            var pad = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.6, radius * 1.6, 0.12, 16), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }));
            pad.position.set(xOffset, 0.06, 0);
            compareGroup.add(pad);
            return col;
        }
        addColumn(T3D_OM_EVEREST_TRUE, 0.85, 0x8fa3b0, T3D_OM_BASE_R + 7);
        addColumn(T3D_OM_MAUNALOA_TRUE, 0.85, 0x2f6fb0, T3D_OM_BASE_R + 13);
        exagGroup.add(compareGroup);
        scene.add(exagGroup);

        var exaggeration = 4;
        var compareVisible = true;

        function fmt1(n) { return (Math.round(n * 10) / 10).toString(); }

        function panelHtml() {
            return '<h3>Olympus Mons (Mars)</h3>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Base diameter</td><td>~' + T3D_OM_BASE_DIAMETER_KM + ' km (NASA Mars Atlas)</td></tr>' +
                '<tr><td>Height above surrounding plains</td><td>~' + T3D_OM_HEIGHT_KM + ' km (NASA; other reference frames cite 21.9-27 km)</td></tr>' +
                '<tr><td>Caldera complex</td><td>~' + T3D_OM_CALDERA_WIDTH_KM + ' km wide, ~' + T3D_OM_CALDERA_DEPTH_KM + ' km deep</td></tr>' +
                '<tr><td>Vertical exaggeration shown</td><td>' + exaggeration + 'x (real slope is far gentler than it looks here)</td></tr>' +
                '<tr><td>Mount Everest, for scale</td><td>' + T3D_OM_EVEREST_KM + ' km above sea level</td></tr>' +
                '<tr><td>Mauna Loa, for scale</td><td>~' + T3D_OM_MAUNALOA_KM + ' km, ocean floor to summit</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational approximation - the shield and caldera are a mathematical profile matched to the real published diameter/height/caldera figures above, not a survey-grade elevation scan. Mars has no plate tectonics and only about 38% of Earth\'s surface gravity, which is why the same hot spot could build a shield this large without collapsing.</p>';
        }

        var exagSlider = document.getElementById('t3dOmExagSlider');
        var exagLabel = document.getElementById('t3dOmExagLabel');
        var compareToggle = document.getElementById('t3dOmCompareToggle');
        var topViewBtn = document.getElementById('t3dOmTopViewBtn');

        function apply() {
            exagGroup.scale.y = exaggeration;
            compareGroup.visible = compareVisible;
            if (exagLabel) exagLabel.textContent = exaggeration + 'x vertical exaggeration';
            t3dInfo(panelHtml());
            try { t3dSaveStore({ exaggeration: exaggeration, compareVisible: compareVisible }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.exaggeration === 'number' && store.exaggeration >= 1 && store.exaggeration <= 8) exaggeration = store.exaggeration;
        if (typeof store.compareVisible === 'boolean') compareVisible = store.compareVisible;
        if (exagSlider) exagSlider.value = String(exaggeration);
        if (compareToggle) compareToggle.checked = compareVisible;
        apply();

        if (exagSlider) exagSlider.addEventListener('input', function () {
            exaggeration = Math.max(1, Math.min(8, parseInt(exagSlider.value || '4', 10)));
            apply();
        });
        if (compareToggle) compareToggle.addEventListener('change', function () {
            compareVisible = !!compareToggle.checked;
            apply();
        });
        if (topViewBtn) topViewBtn.addEventListener('click', function () {
            shell.orbit.goalPhi = 0.12;
            shell.orbit.goalRadius = Math.max(shell.orbit.minR, T3D_OM_BASE_R * 1.6);
        });

        t3dStatus('Drag to orbit, scroll to zoom. Drag the exaggeration slider or toggle the scale comparison.');
        return function animate(dt) {
            stars.rotation.y += dt * 0.00001;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { olympusmonsmarsvolcano: 't3dOmControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { olympusmonsmarsvolcano: { radius: 68, maxR: 220, minR: 12, phi: 1.05, theta: 0.6, targetY: 4, fov: 48 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dOlympusMonsMarsVolcano(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

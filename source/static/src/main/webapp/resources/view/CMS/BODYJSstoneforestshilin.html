<script>
    // 3D scene archetype skeleton (stone-forest-shilin) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (stone-forest-shilin). places-3d cluster, authored 2026-07-28.
    // DETAILED-TERRAIN migration 2026-08-30
    // (prompts/places-3d-detailed-terrain-runbook.md, karst-pinnacle class
    // per guard 8/2b): the pinnacle-field scene below is the ORIGINAL
    // procedural schematic, unchanged, and stays the first-paint default
    // view (needs no network, so it can never render blank). A NEW Surface
    // view fetches real Terrarium DEM elevation + Sentinel-2 true-color
    // imagery of the surrounding karst plateau from the ftol-vm-assets CDN,
    // IndexedDB-caches it, and becomes selectable via the View button once
    // ready. A CDN failure leaves the View button on "Pinnacle field" and
    // the page works exactly as before - it never blocks on the network.
    // The individual limestone towers (20-40 m tall, meter-scale spacing)
    // are far finer than the DEM's ~17 m/px sample and do NOT resolve as
    // separate pinnacles in the real surface - that close-up detail stays
    // schematic; only the surrounding plateau relief + imagery are real.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (UNESCO South China Karst nomination / encyclopedic
    // consensus, cross-checked 2026-07-28):
    //   - Shilin Yi Autonomous County, Yunnan, China, about 120 km southeast
    //     of Kunming
    //   - Core scenic area about 350 sq km
    //   - Limestone deposited about 270 million years ago (Permian period)
    //   - Pinnacle landform sculpted over roughly the last 2.7 million years
    //   - Many towers stand 20-30 m tall, tallest approaching about 40 m
    //   - Plateau elevation about 1,750-2,000 m above sea level
    //   - Part of the South China Karst UNESCO World Heritage Site,
    //     inscribed 2007
    //   - Ashima Rock: a tall named pinnacle tied to a Yi ethnic folk legend
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'stone-forest-shilin';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesstoneforestshilin'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    // ---- Real-terrain CDN + IndexedDB cache (mirrors BODYJSsondoongcave.html's
    // t3dPlaces* pattern) - heights.bin (Int16 LE meters) + texture.jpg
    // (Sentinel-2 true-color), sha256-verified, cached once per manifest
    // version.
    var T3D_PLACES_CDN = 'https://gh-static.freetool.online/places-3d';
    var T3D_PLACES_DB = 'ftol-places3d-assets';
    function t3dPlacesIdbOpen() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(T3D_PLACES_DB, 1);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('assets')) {
                    req.result.createObjectStore('assets', { keyPath: 'key' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        });
    }
    function t3dPlacesIdbGet(key) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readonly');
                var rq = tx.objectStore('assets').get(key);
                rq.onsuccess = function () { resolve(rq.result ? rq.result.blob : null); };
                rq.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }
    function t3dPlacesIdbPut(key, blob) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put({ key: key, blob: blob });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function () { resolve(false); };
            });
        }).catch(function () { return false; });
    }
    function t3dPlacesSha256Hex(buf) {
        return crypto.subtle.digest('SHA-256', buf).then(function (hash) {
            var b = new Uint8Array(hash), hex = '';
            for (var i = 0; i < b.length; i++) hex += b[i].toString(16).padStart(2, '0');
            return hex;
        });
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0d1410, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xfff2da, 1.05);
        key.position.set(-10, 18, -7);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return { mesh: new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.94, metalness: 0 })), geo: geo, pos: pos };
        }

        // Pinnacle field: a dense cellular (Worley-style) field of narrow rock
        // towers rising from a grassy plateau floor. 1 unit = about 15 m
        // vertical, so the tallest towers (peak amplitude up to about 2.6)
        // read as roughly 40 m against the real "up to about 40 m" figure.
        // CELL sets the average spacing between pinnacle footprints; PRESENCE
        // leaves open ground/paths between towers rather than a solid wall.
        var CELL = 1.05, PRESENCE = 0.42;
        function height(x, z) {
            var cellX = Math.floor(x / CELL), cellZ = Math.floor(z / CELL);
            var maxH = 0;
            for (var dx = -1; dx <= 1; dx++) {
                for (var dz = -1; dz <= 1; dz++) {
                    var gx = cellX + dx, gz = cellZ + dz;
                    var presence = hash2(gx * 3.1 + 0.7, gz * 5.7 + 1.3);
                    if (presence < PRESENCE) continue;
                    var jx = hash2(gx + 0.11, gz + 7.77) - 0.5;
                    var jz = hash2(gx + 9.31, gz + 2.02) - 0.5;
                    var cx = (gx + 0.5 + jx * 0.55) * CELL;
                    var cz = (gz + 0.5 + jz * 0.55) * CELL;
                    var dist = Math.sqrt((x - cx) * (x - cx) + (z - cz) * (z - cz));
                    var footprint = 0.24 + 0.16 * hash2(gx + 21.4, gz + 13.9);
                    var peak = 1.1 + 1.5 * hash2(gx + 51.2, gz + 31.6);
                    var reach = footprint * 2.6;
                    if (dist < reach) {
                        var t = 1 - dist / reach;
                        var shaped = Math.pow(Math.max(0, t), 1.35);
                        var h = peak * shaped;
                        if (h > maxH) maxH = h;
                    }
                }
            }
            if (maxH > 0.02) return maxH;
            return 0.04 * fbm(x * 0.6 + 3, z * 0.6 + 9, 3);
        }

        var col = {
            ground: new THREE.Color(0x8fae74), rockLow: new THREE.Color(0xb9b09a),
            rockMid: new THREE.Color(0x9a9488), rockHigh: new THREE.Color(0xe4ded0),
            bandHi: new THREE.Color(0xffd27a)
        };
        var highlightOn = true, ashimaOn = true;
        function color(c, h, x, z) {
            var n = 0.9 + 0.16 * fbm(x * 1.4 + 5, z * 1.4 + 2, 3);
            if (h < 0.06) { c.copy(col.ground).multiplyScalar(n); return; }
            var t = smooth(0.06, 2.4, h);
            if (highlightOn) {
                if (t < 0.4) { c.copy(col.rockLow).lerp(col.rockMid, t / 0.4); }
                else if (t < 0.75) { c.copy(col.rockMid).lerp(col.bandHi, (t - 0.4) / 0.35); }
                else { c.copy(col.bandHi).lerp(col.rockHigh, (t - 0.75) / 0.25); }
            } else {
                c.copy(col.rockLow).lerp(col.rockHigh, t);
            }
            c.multiplyScalar(n);
        }
        // Pinnacle-field scene lives in its own group so the Surface view
        // (real terrain, added below) can hide it without tearing it down -
        // it is the CDN-independent fallback per the render-quality contract.
        var fieldGroup = new THREE.Group();
        scene.add(fieldGroup);

        var terrainInfo = makeTerrain(22, 15, shell.low ? 130 : 170, shell.low ? 78 : 104, height, color);
        fieldGroup.add(terrainInfo.mesh);

        // Ashima marker: found by sampling the field for its tallest pinnacle
        // near the scene center, so the marker always sits on a real peak
        // regardless of parameter tuning.
        var markerX = 0, markerZ = 0, markerY = 0;
        (function findAshima() {
            var best = -1;
            for (var sx = -6; sx <= 6; sx += 0.5) {
                for (var sz = -4; sz <= 4; sz += 0.5) {
                    var hh = height(sx, sz);
                    if (hh > best) { best = hh; markerX = sx; markerZ = sz; }
                }
            }
            markerY = best;
        })();

        var ashimaMarker = new THREE.Mesh(
            new THREE.ConeGeometry(0.22, 0.7, 14),
            new THREE.MeshStandardMaterial({ color: 0x5b73ae, emissive: 0x0e1530, roughness: 0.35 })
        );
        ashimaMarker.position.set(markerX, markerY + 0.55, markerZ);
        fieldGroup.add(ashimaMarker);
        var ashimaRing = new THREE.Mesh(
            new THREE.RingGeometry(0.38, 0.55, 32),
            new THREE.MeshBasicMaterial({ color: 0x8ea0d0, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
        );
        ashimaRing.rotation.x = -Math.PI / 2;
        ashimaRing.position.set(markerX, markerY + 0.03, markerZ);
        fieldGroup.add(ashimaRing);

        function recolor() {
            var pos = terrainInfo.pos, geo = terrainInfo.geo, colors = geo.attributes.color, col2 = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                color(col2, pos.getY(i), pos.getX(i), pos.getZ(i));
                colors.setXYZ(i, col2.r, col2.g, col2.b);
            }
            colors.needsUpdate = true;
        }

        function fieldPanelHtml() {
            return '<h3>Shilin: China\'s karst pinnacle forest</h3>' +
                '<p>Hundreds of limestone towers rise from a plateau grassland - many stand 20-30 m tall, with the tallest approaching about 40 m. The field formed as water dissolved the rock along cracks over roughly the last 2.7 million years.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Location</td><td>Yunnan, China - about 120 km SE of Kunming</td></tr>' +
                '<tr><td>Core scenic area</td><td>about 350 sq km</td></tr>' +
                '<tr><td>Limestone age</td><td>about 270 million years (Permian)</td></tr>' +
                '<tr><td>Pinnacle landform age</td><td>roughly the last 2.7 million years</td></tr>' +
                '<tr><td>Pinnacle height</td><td>20-30 m, tallest about 40 m</td></tr>' +
                '<tr><td>UNESCO status</td><td>South China Karst, inscribed 2007</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the pinnacle field, spacing, and vertical scale are schematic teaching cues, not survey terrain. Switch to the Surface view for real measured plateau terrain.</p>';
        }

        // ---- Surface view (real terrain, the karst plateau around the field) ----
        var surfaceGroup = new THREE.Group();
        surfaceGroup.visible = false;
        scene.add(surfaceGroup);
        var view = 'field'; // default first paint - CDN-independent
        var surfaceReady = false, surfaceLoading = false;
        var surfaceMinH = 0, surfaceMaxH = 0;
        var VIEW_CAMERA = {
            field: { radius: 30, phi: 0.92, theta: 0.85, targetY: 0.9, minR: 7, maxR: 65 },
            surface: { radius: 16, phi: 1.05, theta: 0.7, targetY: 0, minR: 4, maxR: 45 }
        };
        function setCamera(preset) {
            shell.orbit.goalRadius = preset.radius; shell.orbit.goalPhi = preset.phi; shell.orbit.goalTheta = preset.theta;
            shell.orbit.target.y = preset.targetY; shell.orbit.minR = preset.minR; shell.orbit.maxR = preset.maxR;
        }

        function surfacePanelHtml() {
            if (!surfaceReady) {
                return '<h3>Shilin: karst plateau surface</h3>' +
                    '<p>' + (surfaceLoading ? 'Loading real elevation and satellite imagery of the karst plateau around the pinnacle field now (one time, then cached).' : 'Real terrain not loaded yet.') + '</p>';
            }
            return '<h3>Shilin: karst plateau surface (real terrain)</h3>' +
                '<p>This is the plateau around Shilin Yi Autonomous County, Yunnan - real measured elevation and satellite imagery, not a procedural surface. The individual limestone pinnacles are too fine to resolve at this scale; switch to the Pinnacle field view for the schematic close-up towers.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Elevation in this view</td><td>' + Math.round(surfaceMinH) + ' m to ' + Math.round(surfaceMaxH) + ' m</td></tr>' +
                '<tr><td>Published plateau elevation</td><td>about 1,750-2,000 m above sea level</td></tr>' +
                '<tr><td>Location</td><td>Shilin Yi Autonomous County, Yunnan, China</td></tr>' +
                '<tr><td>Status</td><td>South China Karst UNESCO World Heritage Site</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Terrain: Mapzen/AWS Open Data terrain tiles (NASA/USGS DEMs). Imagery: contains modified Copernicus Sentinel data 2026. Relief is shown at true 1:1 scale relative to the mapped width - no vertical exaggeration. Educational approximation - not survey-grade geodesy; the pinnacles themselves are below this DEM\'s resolution.</p>';
        }

        function panelHtml() { return view === 'surface' ? surfacePanelHtml() : fieldPanelHtml(); }

        function apply() {
            ashimaMarker.visible = ashimaOn; ashimaRing.visible = ashimaOn;
            var hb = document.getElementById('t3dSfsHighlightBtn');
            if (hb) hb.textContent = 'Pinnacle height highlight: ' + (highlightOn ? 'On' : 'Off');
            var ab = document.getElementById('t3dSfsAshimaBtn');
            if (ab) ab.textContent = 'Ashima rock marker: ' + (ashimaOn ? 'On' : 'Off');
            var vb = document.getElementById('t3dSfsViewBtn');
            if (vb) vb.textContent = 'View: ' + (view === 'surface' ? 'Surface (real terrain)' : (surfaceLoading ? 'Pinnacle field (loading surface...)' : 'Pinnacle field (schematic)'));
            fieldGroup.visible = (view === 'field');
            surfaceGroup.visible = (view === 'surface');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ highlightOn: highlightOn, ashimaOn: ashimaOn, view: view }); } catch (e) {}
        }

        function setView(next) {
            if (next === 'surface' && !surfaceReady) return; // ignore clicks before real terrain has loaded
            view = next;
            setCamera(VIEW_CAMERA[view]);
            apply();
        }

        // Decimate a row-major Int16 grid to at most maxDim x maxDim cells,
        // keeping the MAX value per cell (per the runbook: preserve relief
        // detail, never average it flat).
        function decimateMax(view2, w, h, maxDim) {
            var stepX = Math.max(1, Math.ceil(w / maxDim));
            var stepZ = Math.max(1, Math.ceil(h / maxDim));
            var ow = Math.floor((w - 1) / stepX) + 1;
            var oh = Math.floor((h - 1) / stepZ) + 1;
            var out = new Int16Array(ow * oh);
            for (var oz = 0; oz < oh; oz++) {
                var z0 = oz * stepZ;
                for (var ox = 0; ox < ow; ox++) {
                    var x0 = ox * stepX, best = -32768;
                    for (var dz2 = 0; dz2 < stepZ && z0 + dz2 < h; dz2++) {
                        var rowBase = (z0 + dz2) * w;
                        for (var dx2 = 0; dx2 < stepX && x0 + dx2 < w; dx2++) {
                            var v = view2[rowBase + x0 + dx2];
                            if (v > best) best = v;
                        }
                    }
                    out[oz * ow + ox] = best;
                }
            }
            return { data: out, w: ow, h: oh };
        }

        function buildSurfaceMesh(heightsView, grid, texBlob) {
            var dec = decimateMax(heightsView, grid.width_px, grid.height_px, 220);
            var W = 20, D = 20;
            var geo = new THREE.PlaneGeometry(W, D, dec.w - 1, dec.h - 1);
            geo.rotateX(-Math.PI / 2);
            // Isotropic meters -> scene-unit scale so relief keeps TRUE 1:1
            // vertical proportion relative to the mapped width (no exaggeration).
            var vertScale = W / (grid.width_px * grid.meters_per_px);
            var minH = grid.min_h_m, maxH = grid.max_h_m;
            var pos = geo.attributes.position;
            var colors = new Float32Array(pos.count * 3), c = new THREE.Color();
            var valley = new THREE.Color(0x7a8a5a), slope = new THREE.Color(0x9a9270), peak = new THREE.Color(0xc8beA0);
            for (var i = 0; i < pos.count; i++) {
                var ix = i % dec.w, iz = Math.floor(i / dec.w);
                var hRaw = dec.data[iz * dec.w + ix];
                pos.setY(i, (hRaw - minH) * vertScale);
                var t2 = (hRaw - minH) / Math.max(1, maxH - minH);
                if (t2 < 0.4) { c.copy(valley).lerp(slope, t2 / 0.4); } else { c.copy(slope).lerp(peak, (t2 - 0.4) / 0.6); }
                colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            var mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });
            var mesh = new THREE.Mesh(geo, mat);
            surfaceGroup.add(mesh);
            surfaceMinH = minH; surfaceMaxH = maxH;
            surfaceLoading = false; surfaceReady = true;
            setView('surface');
            t3dStatus('Real surface terrain loaded (Terrarium DEM + Sentinel-2 imagery). Drag to orbit, scroll to zoom.');
            if (texBlob) {
                var texUrl = URL.createObjectURL(texBlob);
                new THREE.TextureLoader().load(texUrl, function (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    // MeshStandardMaterial MULTIPLIES vertexColors by map -
                    // must turn vertexColors off once real imagery is the
                    // colour source (2026-08-29 defect fix, see runbook).
                    mat.map = tex;
                    mat.vertexColors = false;
                    mat.color.setScalar(1);
                    mat.needsUpdate = true;
                    URL.revokeObjectURL(texUrl);
                }, undefined, function () { URL.revokeObjectURL(texUrl); });
            }
        }

        function fetchPlacesAsset(file, mimeType, verKey) {
            var key = verKey + ':' + file.file;
            return t3dPlacesIdbGet(key).then(function (cached) {
                if (cached) return cached;
                return fetch(T3D_PLACES_CDN + '/' + file.file).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + file.file);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    return t3dPlacesSha256Hex(buf).then(function (hex) {
                        if (file.sha256 && hex !== file.sha256) { throw new Error('sha256 mismatch on ' + file.file); }
                        var blob = new Blob([buf], { type: mimeType });
                        t3dPlacesIdbPut(key, blob);
                        return blob;
                    });
                });
            });
        }

        function loadRealSurface() {
            surfaceLoading = true;
            apply();
            fetch(T3D_PLACES_CDN + '/manifest.json').then(function (r) { return r.json(); })
                .then(function (manifest) {
                    var asset = manifest && manifest.assets && manifest.assets['stone-forest-shilin'];
                    if (!asset) throw new Error('manifest missing the stone-forest-shilin asset');
                    var heightsFile = null, texFile = null;
                    (asset.files || []).forEach(function (f) {
                        if (f.role === 'heightfield') heightsFile = f;
                        if (f.role === 'satellite-texture') texFile = f;
                    });
                    if (!heightsFile) throw new Error('manifest missing the heightfield file');
                    var verKey = 'stone-forest-shilin@' + manifest.version;
                    var jobs = [fetchPlacesAsset(heightsFile, 'application/octet-stream', verKey)];
                    if (texFile) jobs.push(fetchPlacesAsset(texFile, 'image/jpeg', verKey));
                    return Promise.all(jobs).then(function (blobs) {
                        return blobs[0].arrayBuffer().then(function (buf) {
                            buildSurfaceMesh(new Int16Array(buf), asset.grid, blobs[1] || null);
                        });
                    });
                })
                .catch(function (err) {
                    surfaceLoading = false;
                    apply();
                    t3dStatus('Could not load real surface terrain (' + (err && err.message ? err.message : err) + ') - showing the pinnacle field view instead.');
                });
        }

        var store = t3dLoadStore();
        if (typeof store.highlightOn === 'boolean') highlightOn = store.highlightOn;
        if (typeof store.ashimaOn === 'boolean') ashimaOn = store.ashimaOn;
        recolor();
        setCamera(VIEW_CAMERA.field);
        apply();

        var highlightBtn = document.getElementById('t3dSfsHighlightBtn');
        if (highlightBtn) highlightBtn.addEventListener('click', function () { highlightOn = !highlightOn; recolor(); apply(); });
        var ashimaBtn = document.getElementById('t3dSfsAshimaBtn');
        if (ashimaBtn) ashimaBtn.addEventListener('click', function () { ashimaOn = !ashimaOn; apply(); });
        var viewBtn = document.getElementById('t3dSfsViewBtn');
        if (viewBtn) viewBtn.addEventListener('click', function () { setView(view === 'surface' ? 'field' : 'surface'); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the pinnacle height highlight or the Ashima marker.');
        if ('requestIdleCallback' in window) { requestIdleCallback(loadRealSurface, { timeout: 4000 }); }
        else { setTimeout(loadRealSurface, 800); }
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesstoneforestshilin: 't3dSfsControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesstoneforestshilin: { radius: 30, maxR: 65, minR: 7, phi: 0.92, theta: 0.85, targetY: 0.9 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

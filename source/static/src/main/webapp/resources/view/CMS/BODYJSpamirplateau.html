<script type="module">
import * as THREE from '../../../vendor/three/build/three.module.js';

const canvas = document.getElementById('t3dCanvas');
const statusEl = document.getElementById('t3dStatus');
let scene, camera, renderer, terrain, rangeMarkers, peakLabels;

const STATE = {
  showRangeMarkers: localStorage.getItem('ftol-game-pamir-plateau-range-markers') !== 'false',
  showPeakLabels: localStorage.getItem('ftol-game-pamir-plateau-peak-labels') !== 'false',
};

// Noise helpers (from space-3d examples)
function hash2(p) {
  const x = Math.sin(p.x * 43758.5453) * 0.5 + 0.5;
  const y = Math.sin(p.y * 43758.5453) * 0.5 + 0.5;
  return new THREE.Vector2(x, y);
}

function vnoise(p) {
  const pi = new THREE.Vector2(Math.floor(p.x), Math.floor(p.y));
  const pf = new THREE.Vector2(p.x - pi.x, p.y - pi.y);
  const u = new THREE.Vector2(pf.x * pf.x * (3.0 - 2.0 * pf.x), pf.y * pf.y * (3.0 - 2.0 * pf.y));
  
  const h00 = hash2(new THREE.Vector2(pi.x, pi.y));
  const h10 = hash2(new THREE.Vector2(pi.x + 1, pi.y));
  const h01 = hash2(new THREE.Vector2(pi.x, pi.y + 1));
  const h11 = hash2(new THREE.Vector2(pi.x + 1, pi.y + 1));
  
  const n00 = Math.cos(h00.x * 6.283) * (pf.x - 0) + Math.sin(h00.y * 6.283) * (pf.y - 0);
  const n10 = Math.cos(h10.x * 6.283) * (pf.x - 1) + Math.sin(h10.y * 6.283) * (pf.y - 0);
  const n01 = Math.cos(h01.x * 6.283) * (pf.x - 0) + Math.sin(h01.y * 6.283) * (pf.y - 1);
  const n11 = Math.cos(h11.x * 6.283) * (pf.x - 1) + Math.sin(h11.y * 6.283) * (pf.y - 1);
  
  const nx0 = n00 * (1 - u.x) + n10 * u.x;
  const nx1 = n01 * (1 - u.x) + n11 * u.x;
  return nx0 * (1 - u.y) + nx1 * u.y;
}

function fbm(p, octaves = 4, freq = 2.5) {
  let val = 0, amp = 1, maxVal = 0, f = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * vnoise(new THREE.Vector2(p.x * f, p.y * f));
    maxVal += amp;
    amp *= 0.5;
    f *= freq;
  }
  return val / maxVal;
}

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  
  camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 10000);
  camera.position.set(35, 45, 50);
  camera.lookAt(0, 0, 0);
  
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.shadowMap.enabled = true;
  
  const light = new THREE.DirectionalLight(0xffffff, 0.9);
  light.position.set(50, 80, 40);
  light.castShadow = true;
  light.shadow.mapSize.width = 2048;
  light.shadow.mapSize.height = 2048;
  scene.add(light);
  
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  
  // Create Pamir terrain: multi-peak knot using Worley-style cell grid
  const geom = new THREE.PlaneGeometry(200, 200, 120, 120);
  const positions = geom.attributes.position;
  const colors = new Float32Array(positions.count * 3);
  
  const peaks = [
    { x: 0, y: 0, h: 74.95, color: [1.0, 0.95, 0.85] }, // Ismail Samani (center)
    { x: -25, y: 30, h: 71.05, color: [0.9, 0.85, 0.8] }, // Korzhenevskaya
    { x: 40, y: 25, h: 65.95, color: [0.85, 0.8, 0.75] }, // Garmo
    { x: -35, y: -20, h: 62.5, color: [0.8, 0.75, 0.7] }, // Peak 4
    { x: 30, y: -35, h: 58.0, color: [0.75, 0.7, 0.65] }, // Peak 5
    { x: 0, y: -50, h: 50.0, color: [0.7, 0.65, 0.6] }, // Peak 6
  ];
  
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    let z = 15.0; // Base plateau elevation
    
    // Add height from each peak (Gaussian falloff)
    for (const peak of peaks) {
      const dx = x - peak.x;
      const dy = y - peak.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const drop = Math.exp(-dist * dist / (2 * 20 * 20));
      z += peak.h * drop;
    }
    
    // Add noise for irregularity
    z += fbm(new THREE.Vector2(x * 0.1, y * 0.1), 3, 2.0) * 5;
    
    // Shore taper (smooth transition at edges)
    const edgeDist = 100 - Math.max(Math.abs(x), Math.abs(y));
    if (edgeDist < 20) {
      z *= Math.max(0, edgeDist / 20);
    }
    
    positions.setZ(i, z);
    
    // Color banding based on altitude
    let r, g, b;
    if (z > 60) {
      r = 0.95; g = 0.95; b = 0.95; // Snow
    } else if (z > 45) {
      r = 0.8; g = 0.75; b = 0.85; // Alpine
    } else if (z > 25) {
      r = 0.6; g = 0.5; b = 0.4; // High plateau
    } else {
      r = 0.5; g = 0.4; b = 0.3; // Base plateau
    }
    
    colors[i * 3] = r;
    colors[i * 3 + 1] = g;
    colors[i * 3 + 2] = b;
  }
  
  positions.needsUpdate = true;
  geom.computeVertexNormals();
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.8,
    metalness: 0.1,
  });
  
  terrain = new THREE.Mesh(geom, mat);
  terrain.castShadow = true;
  terrain.receiveShadow = true;
  scene.add(terrain);
  
  // Range confluence markers
  rangeMarkers = new THREE.Group();
  const markers = [
    { pos: [-50, 50, 25], label: 'Tian Shan', color: 0x4da8da },
    { pos: [-60, -40, 25], label: 'Hindu Kush', color: 0xffa500 },
    { pos: [60, -30, 25], label: 'Karakoram', color: 0xff6b6b },
  ];
  
  markers.forEach(m => {
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(2, 8, 8),
      new THREE.MeshStandardMaterial({ color: m.color })
    );
    cone.position.set(m.pos[0], m.pos[1], m.pos[2]);
    rangeMarkers.add(cone);
    
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(3, 0.3, 8, 12),
      new THREE.MeshStandardMaterial({ color: m.color, emissive: m.color, emissiveIntensity: 0.4 })
    );
    ring.position.copy(cone.position);
    ring.position.z += 1;
    rangeMarkers.add(ring);
  });
  
  rangeMarkers.visible = STATE.showRangeMarkers;
  scene.add(rangeMarkers);
  
  // Peak labels (simple)
  peakLabels = new THREE.Group();
  peaks.slice(0, 4).forEach((peak, i) => {
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(1.5, 3, 6),
      new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.3 })
    );
    cone.position.set(peak.x, peak.y, peak.h + 5);
    peakLabels.add(cone);
  });
  
  peakLabels.visible = STATE.showPeakLabels;
  scene.add(peakLabels);
  
  statusEl.textContent = 'Pamir Plateau loaded';
}

function setupToggleHandlers() {
  document.getElementById('toggleRangeMarkers').checked = STATE.showRangeMarkers;
  document.getElementById('togglePeakLabels').checked = STATE.showPeakLabels;
  
  document.getElementById('toggleRangeMarkers').addEventListener('change', (e) => {
    STATE.showRangeMarkers = e.target.checked;
    localStorage.setItem('ftol-game-pamir-plateau-range-markers', STATE.showRangeMarkers);
    rangeMarkers.visible = STATE.showRangeMarkers;
  });
  
  document.getElementById('togglePeakLabels').addEventListener('change', (e) => {
    STATE.showPeakLabels = e.target.checked;
    localStorage.setItem('ftol-game-pamir-plateau-peak-labels', STATE.showPeakLabels);
    peakLabels.visible = STATE.showPeakLabels;
  });
}

let theta = 1.2, phi = 0.9, radius = 120;

function animate() {
  requestAnimationFrame(animate);
  
  theta += 0.0005;
  const x = radius * Math.sin(phi) * Math.cos(theta);
  const y = radius * Math.cos(phi);
  const z = radius * Math.sin(phi) * Math.sin(theta);
  camera.position.set(x, y, z);
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
}

function setupResizeObserver() {
  const observer = new ResizeObserver(() => {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w > 0 && h > 0) {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
  });
  observer.observe(canvas);
}

initScene();
setupToggleHandlers();
setupResizeObserver();
animate();
</script>

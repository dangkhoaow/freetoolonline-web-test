<div id="threeSceneTool" class="page-section">
    <div id="t3dCanvasHost" style="position: relative; background: #0a1220; border-radius: 6px; overflow: hidden; min-height: 380px; margin-bottom: 0.5rem;"></div>
    <div id="t3dStatus" style="font-size: 0.9em; color: #666; padding: 8px; text-align: center; background: #f5f5f5; border-radius: 4px; margin-bottom: 1rem;">Loading the 3D engine...</div>
    <div style="display: none;" id="t3dPtpControls">
        <div style="margin-bottom: 0.5rem; padding: 0.5rem; background: #f9f9f9; border-left: 4px solid #7DAFA3; border-radius: 4px;">
            <button id="t3dPtpElevationBtn" style="padding: 8px 14px; margin-right: 8px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 0.95em;">Elevation Bands: On</button>
            <button id="t3dPtpRiversBtn" style="padding: 8px 14px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 0.95em;">River Headwaters: On</button>
        </div>
    </div>
    <button id="t3dFullscreenBtn" style="padding: 8px 12px; font-size: 0.9em; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; margin-bottom: 1rem;">Fullscreen</button>
    <div id="t3dInfoPanel" style="border: 1px solid #ddd; padding: 1rem; background: #fafafa; border-radius: 6px; font-size: 0.95em; line-height: 1.6;"></div>
</div>

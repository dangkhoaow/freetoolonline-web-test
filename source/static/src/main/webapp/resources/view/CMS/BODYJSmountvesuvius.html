<script>
    // 3D scene archetype skeleton (mount-vesuvius) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (mount-vesuvius). All geometry is procedural. places-3d cluster.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus):
    //   - Mount Vesuvius, Italy - stratovolcano about 9 km east of Naples
    //   - Current summit height about 1,281 m
    //   - Monte Somma - the horseshoe-shaped ridge north of the modern cone,
    //     remnant of an older, larger volcano; highest point (Punta Nasone)
    //     about 1,132 m
    //   - Famous for the 79 AD eruption that buried Pompeii and Herculaneum
    //   - Last erupted in March 1944
    //   - Only volcano on the European mainland to have erupted in the
    //     last hundred years
    //   - The modern "Red Zone" evacuation plan covers about 600,000 people
    //     living around its base
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'mount-vesuvius';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesmountvesuvius'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract: window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x87ceeb, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.58));
        var key = new THREE.DirectionalLight(0xfff3d6, 1.08);
        key.position.set(-12, 20, 12);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }

        // Vertical scale: 1 unit is about 250 m. Modern-cone summit
        // 1,281 m -> about 5.1 units. Monte Somma's Punta Nasone
        // 1,132 m -> about 4.5 units. The modern cone grew inside the older
        // caldera and sits offset toward the south, so Monte Somma survives
        // only as a horseshoe ridge open on the south side (the collapsed
        // arc) - the signature silhouette seen from Naples.
        var CONE_R = 6.0, CONE_H = 5.1, CRATER_R = 0.55, CRATER_DEPTH = 0.4;
        var CONE_OFFSET_Z = 1.6;
        var SOMMA_R = 8.6, SOMMA_W = 1.9, SOMMA_H = 4.5;
        var HAZARD_R = 9.5, HAZARD_W = 1.4;

        var sommaOn = true, hazardOn = false;

        function height(x, z) {
            var dx = x, dz = z - CONE_OFFSET_Z;
            var rc = Math.sqrt(dx * dx + dz * dz);
            var tCone = Math.max(0, 1 - rc / CONE_R);
            var cone = CONE_H * Math.pow(tCone, 1.6);
            var crater = -CRATER_DEPTH * (1 - smooth(0, CRATER_R, rc));
            var coneHeight = Math.max(0, cone + crater);

            var r = Math.sqrt(x * x + z * z);
            var angleFromNorth = Math.atan2(x, -z);
            var ringDist = Math.abs(r - SOMMA_R);
            var ringProfile = Math.max(0, 1 - ringDist / SOMMA_W);
            var presenceMask = Math.max(0, Math.cos(angleFromNorth * 0.72));
            var somma = SOMMA_H * ringProfile * presenceMask * ringProfile;

            var relief = (fbm(x * 0.22 + 3, z * 0.22 + 7, 4) - 0.5) * 0.32;
            var plain = (fbm(x * 0.4 + 9, z * 0.4 + 2, 3) - 0.5) * 0.12;

            return Math.max(coneHeight, somma) + relief * smooth(0.05, 1.2, Math.max(coneHeight, somma)) + plain * (1 - smooth(0.05, 1.0, Math.max(coneHeight, somma)));
        }

        // Colour bands: Mediterranean vineyard/scrub plain at the base,
        // volcanic ash/rock on the modern cone, a distinct greenish-grey
        // tone for the ancient Monte Somma rim when highlighted, dark
        // crater interior, and an optional red hazard-zone tint ringing
        // the base (today's evacuation "Red Zone").
        var col = {
            plain: new THREE.Color(0x7a9b52), scrub: new THREE.Color(0x9a8b56),
            rockLower: new THREE.Color(0x8a7a63), rockUpper: new THREE.Color(0x6e5a4e),
            crater: new THREE.Color(0x3a3230), somma: new THREE.Color(0x5b6b4a),
            hazard: new THREE.Color(0xb23a2a)
        };
        function color(c, h, x, z) {
            var n = 0.9 + 0.16 * fbm(x * 1.1 + 6, z * 1.1 + 3, 3);
            var dx = x, dz = z - CONE_OFFSET_Z;
            var rc = Math.sqrt(dx * dx + dz * dz);
            var r = Math.sqrt(x * x + z * z);
            var angleFromNorth = Math.atan2(x, -z);
            var ringDist = Math.abs(r - SOMMA_R);
            var isSomma = sommaOn && ringDist < SOMMA_W * 0.85 && Math.cos(angleFromNorth * 0.72) > 0.12 && h > 1.0;

            if (isSomma) {
                c.copy(col.somma);
            } else if (rc < CRATER_R * 1.3 && h < 0.15) {
                c.copy(col.crater);
            } else if (h >= 3.6) {
                c.copy(col.rockUpper);
            } else if (h >= 1.6) {
                c.copy(col.rockLower).lerp(col.rockUpper, smooth(1.6, 3.6, h));
            } else if (h >= 0.4) {
                c.copy(col.scrub).lerp(col.rockLower, smooth(0.4, 1.6, h));
            } else {
                c.copy(col.plain);
            }

            if (hazardOn && h < 0.5 && r < HAZARD_R + HAZARD_W) {
                var hazardT = 1 - smooth(HAZARD_R - HAZARD_W, HAZARD_R + HAZARD_W, r);
                c.lerp(col.hazard, Math.max(0, Math.min(0.65, hazardT * 0.7)));
            }
            c.multiplyScalar(n);
        }

        var segs = shell.low ? 130 : 170;
        var SPAN = SOMMA_R * 2.5;
        var geo = new THREE.PlaneGeometry(SPAN, SPAN, segs, segs);
        geo.rotateX(-Math.PI / 2);
        var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), cTmp = new THREE.Color();
        for (var i = 0; i < pos.count; i++) {
            var x = pos.getX(i), z = pos.getZ(i);
            var h = height(x, z);
            pos.setY(i, h);
            color(cTmp, h, x, z);
            colors[i * 3] = cTmp.r; colors[i * 3 + 1] = cTmp.g; colors[i * 3 + 2] = cTmp.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        var terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.94, metalness: 0 }));
        scene.add(terrain);

        function recolor() {
            var cols = geo.attributes.color, c2 = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                color(c2, pos.getY(i), pos.getX(i), pos.getZ(i));
                cols.setXYZ(i, c2.r, c2.g, c2.b);
            }
            cols.needsUpdate = true;
        }

        function panelHtml() {
            return '<h3>Mount Vesuvius: the volcano that buried Pompeii</h3>' +
                '<p>A stratovolcano near Naples, Italy, with a modern cone rising inside the horseshoe-shaped remnant of an older, larger volcano - Monte Somma.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Height (modern cone)</td><td>about 1,281 m</td></tr>' +
                '<tr><td>Monte Somma ridge</td><td>about 1,132 m at Punta Nasone</td></tr>' +
                '<tr><td>Famous eruption</td><td>79 AD - buried Pompeii and Herculaneum</td></tr>' +
                '<tr><td>Last eruption</td><td>March 1944</td></tr>' +
                '<tr><td>Distance to Naples</td><td>about 9 km</td></tr>' +
                '<tr><td>Red Zone population</td><td>about 600,000 people</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the cone profile, Monte Somma ridge, and hazard ring are schematic teaching cues, not survey terrain.</p>';
        }

        function apply() {
            var sb = document.getElementById('t3dVesSommaBtn');
            if (sb) sb.textContent = 'Monte Somma ridge: ' + (sommaOn ? 'On' : 'Off');
            var hb = document.getElementById('t3dVesHazardBtn');
            if (hb) hb.textContent = 'Hazard zone: ' + (hazardOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ sommaOn: sommaOn, hazardOn: hazardOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.sommaOn === 'boolean') sommaOn = store.sommaOn;
        if (typeof store.hazardOn === 'boolean') hazardOn = store.hazardOn;
        recolor();
        apply();

        var sommaBtn = document.getElementById('t3dVesSommaBtn');
        if (sommaBtn) sommaBtn.addEventListener('click', function () { sommaOn = !sommaOn; recolor(); apply(); });
        var hazardBtn = document.getElementById('t3dVesHazardBtn');
        if (hazardBtn) hazardBtn.addEventListener('click', function () { hazardOn = !hazardOn; recolor(); apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the Monte Somma ridge or the hazard zone.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesmountvesuvius: 't3dVesControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesmountvesuvius: { radius: 60, maxR: 130, minR: 10, phi: 1.05, theta: 0.75, targetY: 1.8, fov: 50 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

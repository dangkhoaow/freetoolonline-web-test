<div id="threeSceneTool" class="page-section">
  <div id="t3dWrapper">
    <div id="t3dCanvasHost" style="position: relative; width: 100%; background: linear-gradient(180deg, #8ab4d8 0%, #c7e0f4 100%); border-radius: 8px; overflow: hidden;"></div>
    <p id="t3dStatus" style="margin: 12px 0 4px; font-size: 0.9em; color: #666; text-align: center;">Loading...</p>
    <div id="t3dPmsControls" style="display: none; margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
      <button id="t3dPmsWaterfallBtn" class="w3-button w3-border w3-small" style="padding: 6px 12px;">Waterfalls: On</button>
      <button id="t3dPmsAccentBtn" class="w3-button w3-border w3-small" style="padding: 6px 12px;">Accent: Off</button>
      <button id="t3dFullscreenBtn" class="w3-button w3-border w3-small" style="padding: 6px 12px;">Fullscreen</button>
    </div>
    <div id="t3dInfoPanel" style="margin-top: 16px; padding: 12px; background: #f9f9f9; border-left: 4px solid #1a9dbf; border-radius: 4px;">
      <p>Loading scene...</p>
    </div>
  </div>
</div>

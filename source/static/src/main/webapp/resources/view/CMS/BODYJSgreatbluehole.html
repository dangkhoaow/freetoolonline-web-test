<script>
    // 3D scene archetype (great-blue-hole) - vendored three.js (ESM,
    // dynamic import from /vendor/three/, NO CDN engine), fully client-side.
    // places-3d cluster, places-3d-discovery-loop-runbook, 2026-08-01.
    //
    // EDUCATIONAL APPROXIMATION, not a survey-grade bathymetric model.
    // Published figures (cross-checked 2026-08-01):
    //   - Diameter about 300 m (984 ft), near-perfect circle
    //   - Depth about 124 m (407 ft)
    //   - Lighthouse Reef atoll, Belize, Caribbean Sea - Belize Barrier Reef
    //     Reserve System, UNESCO World Heritage Site since 1996
    //   - Formed as a limestone cave during the last ice age (lower sea
    //     level), roof collapsed and flooded as the sea rose
    //   - Limestone stalactites documented on overhangs around 40-50 m depth
    //   - Surveyed by Jacques Cousteau in 1971
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'great-blue-hole';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesgreatbluehole'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x8fd8d0, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        var key = new THREE.DirectionalLight(0xffffff, 1.0);
        key.position.set(-8, 18, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.6, metalness: 0 }));
        }

        // Circular sinkhole relief. R (radial distance from center) drives
        // everything: shallow reef flat outside the rim, a narrow near-vertical
        // wall band at the rim, and a deep floor inside - the signature "hole
        // punched in the reef" shape.
        var R_OUTER = 11, R_HOLE = 4.2, WALL_BAND = 0.55;
        var REEF_Y = 0.15, FLOOR_Y = -7.6, LEDGE_FRAC = 0.4; // ledge at ~40-50m of 124m
        function radialR(x, z) {
            var r = Math.sqrt(x * x + z * z);
            var ang = Math.atan2(z, x);
            r *= 1 + 0.035 * Math.sin(ang * 5.0 + 1.3) + 0.02 * (fbm(x * 0.25 + 40, z * 0.25 + 40, 2) - 0.5);
            return r;
        }
        function height(x, z) {
            var r = radialR(x, z);
            var reef = REEF_Y + 0.16 * (fbm(x * 1.1 + 3, z * 1.1 + 7, 3) - 0.5);
            var floor = FLOOR_Y + 0.35 * (fbm(x * 0.6 + 60, z * 0.6 + 60, 3) - 0.5);
            var t = smooth(R_HOLE - WALL_BAND, R_HOLE + WALL_BAND, r); // 0 inside hole, 1 out on reef
            var h = floor + (reef - floor) * t;
            if (t > 0.85 && t < 0.98) { h += (1 - Math.abs(t - 0.915) / 0.065) * 0.18; } // coral rim lip
            return h;
        }
        var normColors = null, bandedColors = null, terrain;
        function depthColor(c, h, banded) {
            var frac = Math.max(0, Math.min(1, (REEF_Y - h) / (REEF_Y - FLOOR_Y))); // 0 at surface, 1 at floor
            if (banded) { frac = Math.floor(frac * 6) / 6; }
            var reefCol = new THREE.Color(0x2fd6c8);
            var midCol = new THREE.Color(0x1a7fa0);
            var deepCol = new THREE.Color(0x081f3f);
            var col2 = frac < 0.5 ? reefCol.clone().lerp(midCol, frac / 0.5) : midCol.clone().lerp(deepCol, (frac - 0.5) / 0.5);
            c.copy(col2);
            if (banded) { c.multiplyScalar(0.94 + 0.06 * Math.sin(frac * 30)); }
        }
        function bandColor(c, h, x, z, banded) {
            var r = radialR(x, z);
            var t = smooth(R_HOLE - WALL_BAND, R_HOLE + WALL_BAND, r);
            if (t > 0.97) {
                var g = fbm(x * 1.4 + 12, z * 1.4 + 8, 3);
                c.setHex(g > 0.55 ? 0x22c2ad : 0x3fd9c0); // coral/reef patches
                c.multiplyScalar(0.85 + 0.2 * g);
                return;
            }
            depthColor(c, h, banded);
        }
        function build(banded) {
            var pos = terrain.geometry.attributes.position, col = new THREE.Color();
            var arr = new Float32Array(pos.count * 3);
            for (var i = 0; i < pos.count; i++) {
                bandColor(col, pos.getY(i), pos.getX(i), pos.getZ(i), banded);
                arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b;
            }
            return arr;
        }
        terrain = makeTerrain(24, 24, shell.low ? 130 : 190, shell.low ? 130 : 190, height, function (c, h, x, z) { bandColor(c, h, x, z, false); });
        scene.add(terrain);
        normColors = terrain.geometry.attributes.color.array.slice();
        bandedColors = build(true);

        // Stalactite-ledge marker: overhang around 40-50 m depth (of 124 m
        // total) where divers document limestone stalactites - proof the hole
        // was once a dry, air-filled cave.
        var ledgeY = FLOOR_Y + (REEF_Y - FLOOR_Y) * (1 - LEDGE_FRAC);
        var ledgeR = R_HOLE - WALL_BAND * 0.7;
        var ledgeGroup = new THREE.Group();
        var ledgeRing = new THREE.Mesh(new THREE.TorusGeometry(ledgeR, 0.08, 8, 48), new THREE.MeshStandardMaterial({ color: 0xd9c27a }));
        ledgeRing.rotation.x = Math.PI / 2;
        ledgeRing.position.set(0, ledgeY, 0);
        ledgeGroup.add(ledgeRing);
        var NSTAL = 10;
        for (var si = 0; si < NSTAL; si++) {
            var a = (si / NSTAL) * Math.PI * 2;
            var stal = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.42, 8), new THREE.MeshStandardMaterial({ color: 0xe8dcb8 }));
            stal.position.set(Math.cos(a) * ledgeR, ledgeY - 0.2, Math.sin(a) * ledgeR);
            stal.rotation.x = Math.PI;
            ledgeGroup.add(stal);
        }
        scene.add(ledgeGroup);

        var bandsOn = true, ledgeOn = true;

        function panelHtml() {
            return '<h3>Great Blue Hole: the perfect circle</h3>' +
                '<p>A cross-section of the sinkhole: shallow turquoise reef around the rim, a near-vertical wall, and the deep navy floor at the center.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Diameter</td><td>about 300 m (984 ft)</td></tr>' +
                '<tr><td>Depth</td><td>about 124 m (407 ft)</td></tr>' +
                '<tr><td>Shape</td><td>near-perfect circle</td></tr>' +
                '<tr><td>Stalactite ledges</td><td>documented around 40-50 m depth</td></tr>' +
                '<tr><td>Formation</td><td>collapsed limestone cave, flooded after the last ice age</td></tr>' +
                '<tr><td>Location</td><td>Lighthouse Reef atoll, Belize - UNESCO 1996</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the reef texture, wall profile, and stalactite placement are procedural teaching cues, not a survey-grade bathymetric model.</p>';
        }

        function apply() {
            terrain.geometry.attributes.color.array.set(bandsOn ? bandedColors : normColors);
            terrain.geometry.attributes.color.needsUpdate = true;
            ledgeGroup.visible = ledgeOn;
            var bb = document.getElementById('t3dGbhBandsBtn');
            if (bb) bb.textContent = 'Depth bands: ' + (bandsOn ? 'On' : 'Off');
            var lb = document.getElementById('t3dGbhLedgeBtn');
            if (lb) lb.textContent = 'Stalactite ledge: ' + (ledgeOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ bandsOn: bandsOn, ledgeOn: ledgeOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.bandsOn === 'boolean') bandsOn = store.bandsOn;
        if (typeof store.ledgeOn === 'boolean') ledgeOn = store.ledgeOn;
        apply();

        var bandsBtn = document.getElementById('t3dGbhBandsBtn');
        if (bandsBtn) bandsBtn.addEventListener('click', function () { bandsOn = !bandsOn; apply(); });
        var ledgeBtn = document.getElementById('t3dGbhLedgeBtn');
        if (ledgeBtn) ledgeBtn.addEventListener('click', function () { ledgeOn = !ledgeOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle depth bands or the stalactite ledge.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesgreatbluehole: 't3dGbhControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesgreatbluehole: { radius: 20, maxR: 46, minR: 6, phi: 0.95, theta: 0.6, targetY: -1.5 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

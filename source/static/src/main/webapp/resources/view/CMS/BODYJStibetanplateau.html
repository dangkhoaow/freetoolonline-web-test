<script type="module">
import * as THREE from '/vendor/three/build/three.module.js';

const PREFS_KEY = 'ftol-game-tibetan-plateau';
const canvas = document.getElementById('t3dCanvas');
if (!canvas) { console.error('Canvas not found'); process.exit(1); }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e27);
scene.fog = new THREE.Fog(0x0a0e27, 200, 500);

const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
camera.position.set(40, 60, 50);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowShadowMap;

window.addEventListener('resize', () => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

// Lights
const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(100, 120, 80);
dirLight.castShadow = true;
dirLight.shadow.camera.left = -200;
dirLight.shadow.camera.right = 200;
dirLight.shadow.camera.top = 200;
dirLight.shadow.camera.bottom = -200;
dirLight.shadow.camera.far = 500;
scene.add(dirLight);

// Hash-based random + fbm helpers (from seed)
function hash2(x, y) {
  const h = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return h - Math.floor(h);
}
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y);
  const f = x - i, g = y - j;
  const u = f * f * (3.0 - 2.0 * f);
  const v = g * g * (3.0 - 2.0 * g);
  const p00 = hash2(i, j), p10 = hash2(i + 1, j), p01 = hash2(i, j + 1), p11 = hash2(i + 1, j + 1);
  const p0 = p00 * (1.0 - u) + p10 * u;
  const p1 = p01 * (1.0 - u) + p11 * u;
  return p0 * (1.0 - v) + p1 * v;
}
function fbm(x, y, octaves = 5, persistence = 0.5, lacunarity = 2.0) {
  let value = 0, amplitude = 1, frequency = 1, maxValue = 0;
  for (let i = 0; i < octaves; i++) {
    value += amplitude * vnoise(x * frequency, y * frequency);
    maxValue += amplitude;
    amplitude *= persistence;
    frequency *= lacunarity;
  }
  return value / maxValue;
}

// Make terrain
const geo = new THREE.PlaneGeometry(150, 150, 200, 200);
const posAttr = geo.attributes.position;
const elevData = [];
const colorData = new Float32Array(posAttr.count * 3);

for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i), y = posAttr.getY(i);
  // Plateau base: 45 units (representing 4,500m); fbm perturbation adds detail
  let elev = 45 + fbm(x / 40, y / 40, 5, 0.55, 2.0) * 12;
  // Gentle radial tapering at edges to avoid hard cliff
  const dist = Math.sqrt(x*x + y*y);
  if (dist > 65) {
    const fade = Math.pow(Math.max(0, 1 - (dist - 65) / 20), 2);
    elev = elev * fade + (fbm(x/50, y/50, 3, 0.6, 1.8) * 5) * (1 - fade);
  }
  posAttr.setZ(i, elev);
  elevData.push(elev);
  
  // Elevation band color: altitude-driven
  let color = new THREE.Color();
  if (elev < 35) color.setHSL(0.55, 0.7, 0.35); // low: cyan-green
  else if (elev < 45) color.setHSL(0.45, 0.6, 0.45); // mid-low: green
  else if (elev < 55) color.setHSL(0.1, 0.8, 0.5); // mid: tan
  else if (elev < 65) color.setHSL(0.05, 0.7, 0.6); // mid-high: light tan
  else color.setHSL(0, 0, 0.85); // high: white
  
  colorData[i*3] = color.r;
  colorData[i*3+1] = color.g;
  colorData[i*3+2] = color.b;
}
posAttr.needsUpdate = true;
geo.computeVertexNormals();

const colorAttr = new THREE.BufferAttribute(colorData, 3);
geo.setAttribute('color', colorAttr);

// Create material + mesh
const mat = new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 5 });
const terrainMesh = new THREE.Mesh(geo, mat);
terrainMesh.castShadow = true;
terrainMesh.receiveShadow = true;
scene.add(terrainMesh);

// Peak markers (cones)
const peakMarkers = [];
const peaks = [
  { pos: [-8, 50, 8], label: 'Everest\n8,848m', color: 0xff6b6b },  // Everest simulation (south edge)
  { pos: [15, 45, -12], label: 'K2\n8,611m', color: 0xff8c42 },      // K2 simulation (west)
  { pos: [-5, 48, -20], label: 'Kangchenjunga\n8,586m', color: 0xf542 }, // Other major peak
];

peaks.forEach(peak => {
  const coneGeo = new THREE.ConeGeometry(3, 12, 16);
  const coneMat = new THREE.MeshPhongMaterial({ color: peak.color, emissive: peak.color, emissiveIntensity: 0.3 });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.position.copy(new THREE.Vector3(...peak.pos));
  cone.castShadow = true;
  scene.add(cone);
  peakMarkers.push({ mesh: cone, label: peak.label, pos: peak.pos });
});

// River source markers
const riverMarkers = [];
const rivers = [
  { pos: [20, 48, 5], label: 'Yangtze\nSource', color: 0x4a90ff },
  { pos: [-15, 46, 8], label: 'Brahmaputra\nSource', color: 0x7cb9ff },
  { pos: [5, 47, 18], label: 'Mekong\nSource', color: 0x2d5aa0 },
];

rivers.forEach(river => {
  const ringGeo = new THREE.RingGeometry(2, 3, 8);
  const ringMat = new THREE.MeshPhongMaterial({ color: river.color, side: THREE.DoubleSide, emissive: river.color, emissiveIntensity: 0.4 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(new THREE.Vector3(...river.pos));
  ring.rotation.x = Math.PI / 2;
  ring.castShadow = true;
  scene.add(ring);
  riverMarkers.push({ mesh: ring, label: river.label, pos: river.pos, visible: true });
});

// Load prefs
const prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{"elevBands":true,"rivers":true}');

// Toggles
document.getElementById('t3dElevationBandsToggle').checked = prefs.elevBands;
document.getElementById('t3dRiverSourcesToggle').checked = prefs.rivers;

document.getElementById('t3dElevationBandsToggle').addEventListener('change', e => {
  prefs.elevBands = e.target.checked;
  localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  mat.color.set(e.target.checked ? 0xffffff : 0x888888);
});

document.getElementById('t3dRiverSourcesToggle').addEventListener('change', e => {
  prefs.rivers = e.target.checked;
  localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  riverMarkers.forEach(r => r.mesh.visible = e.target.checked);
});

// Fullscreen
document.getElementById('t3dFullscreenBtn').addEventListener('click', () => {
  canvas.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
});

// Info panel
const infoPanel = document.getElementById('t3dInfoPanel');
infoPanel.innerHTML = `
<strong>Tibetan Plateau</strong><br>
Avg Elevation: 4,500+ m<br>
Area: 2.5M km²<br>
<br>
<strong>Major Peaks:</strong><br>
- Everest: 8,848 m<br>
- K2: 8,611 m<br>
<br>
<strong>River Sources:</strong><br>
- Yangtze<br>
- Brahmaputra<br>
- Mekong
`;

// Orbit camera
let theta = 1.1, phi = 0.75;
function animate() {
  requestAnimationFrame(animate);
  
  theta += 0.0003;
  const radius = 46;
  camera.position.x = Math.sin(theta) * Math.cos(phi) * radius;
  camera.position.y = Math.sin(phi) * radius;
  camera.position.z = Math.cos(theta) * Math.cos(phi) * radius;
  camera.lookAt(0, 15, 0);
  
  renderer.render(scene, camera);
}
animate();
</script>

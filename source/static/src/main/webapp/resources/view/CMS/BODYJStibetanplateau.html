<script>
    // 3D scene archetype skeleton (tibetan-plateau) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side.
    // Procedural heightfield terrain + sacred peak cone markers.
    // places-3d cluster member 2026-07-29.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures: average elevation ~4,500 m; total area ~2.5M sq km;
    // Mount Kailas ~6,638 m (sacred); Mount Everest ~8,848.86 m (southern edge).
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;
    var T3D_SLUG = 'tibetan-plateau';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placestibetanplateau'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.5, phi: opts.phi || 0.8,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.5, goalPhi: opts.phi || 0.8,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x87ceeb, 1);  // Sky blue
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xfff8dc, 1.0);
        key.position.set(15, 20, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }

        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0 }));
        }

        // High-altitude plateau terrain. Gentle undulation with interior basins
        // and surrounding mountain ranges. ~4,500m average.
        function height(x, z) {
            var base = 4.5 + 0.8 * fbm(x * 0.3, z * 0.3, 3);  // ~4.5 units = ~4,500m
            var undulation = 0.6 * fbm(x * 0.7 + 10, z * 0.7 + 10, 4) - 0.3;
            var h = base + undulation;
            // Basin cutouts (sparse, subtle)
            var basin = 0.4 * Math.sin(x * 0.2) * Math.cos(z * 0.15);
            return Math.max(3.5, h + 0.2 * basin);  // Floor: 3.5 units
        }

        var storeData = t3dLoadStore();
        var elevationBandsOn = storeData.elevationBands !== false;
        var peaksOn = storeData.peaks !== false;

        var colByElevation = {
            low: new THREE.Color(0x6b5d44),      // Deep brown ~4000m
            mid: new THREE.Color(0x8b8055),      // Olive ~4500m
            high: new THREE.Color(0xd4a894),     // Tan ~5500m+
            grass: new THREE.Color(0x9aaa77),    // Light sage (grass accent)
        };

        var colorBuffers = {};  // Store precomputed color buffers for toggle

        function color(c, h, x, z, elevationMode) {
            var n = 0.85 + 0.15 * fbm(x * 0.8 + 5, z * 0.8 + 5, 2);
            var elevNorm = (h - 3.5) / 2.0;  // 0=floor, 1=max

            if (!elevationMode) {
                // Unified grassland color
                c.copy(colByElevation.grass).multiplyScalar(0.8 + 0.2 * n);
            } else {
                // Elevation bands
                if (elevNorm < 0.3) c.copy(colByElevation.low);
                else if (elevNorm < 0.6) c.lerpColors(colByElevation.low, colByElevation.mid, (elevNorm - 0.3) / 0.3);
                else c.lerpColors(colByElevation.mid, colByElevation.high, (elevNorm - 0.6) / 0.4);
                c.multiplyScalar(n);
            }
        }

        // Generate terrain with elevation bands
        var terrain = makeTerrain(20, 20, shell.low ? 70 : 120, shell.low ? 70 : 120, height, function (c, h, x, z) {
            color(c, h, x, z, true);  // elevation bands
        });
        scene.add(terrain);

        // Store both color modes for toggle
        var terrainGeo = terrain.geometry;
        var terrainColors = terrainGeo.attributes.color.array.slice();

        // Recompute unified grass colors
        var grassColors = new Float32Array(terrainColors.length);
        var pos = terrainGeo.attributes.position;
        var col = new THREE.Color();
        for (var i = 0; i < pos.count; i++) {
            var x = pos.getX(i), z = pos.getZ(i), h = pos.getY(i);
            color(col, h, x, z, false);  // grass
            grassColors[i * 3] = col.r; grassColors[i * 3 + 1] = col.g; grassColors[i * 3 + 2] = col.b;
        }
        colorBuffers.elevation = terrainColors;
        colorBuffers.grass = grassColors;

        // Sacred peaks: Kailas and Everest
        var peaksGroup = new THREE.Group();
        var peaks = [
            { name: 'Mount Kailas', x: -6, z: -8, h: 2.6, color: 0xe8d4a8 },
            { name: 'Mount Everest', x: 5, z: -9, h: 3.5, color: 0xf5f5f5 }
        ];
        peaks.forEach(function (p) {
            var coneGeo = new THREE.ConeGeometry(0.3, 0.8, 16);
            var coneMat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.7, metalness: 0 });
            var cone = new THREE.Mesh(coneGeo, coneMat);
            cone.position.set(p.x, p.h, p.z);
            peaksGroup.add(cone);

            // Ring marker
            var ringGeo = new THREE.TorusGeometry(0.5, 0.08, 8, 24);
            var ringMat = new THREE.MeshStandardMaterial({ color: 0xff9500, roughness: 0.5, metalness: 0.2 });
            var ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.set(p.x, p.h + 0.5, p.z);
            ring.rotation.x = Math.PI / 6;
            peaksGroup.add(ring);
        });
        scene.add(peaksGroup);

        t3dInfo('<h3>Tibetan Plateau</h3><p><strong>Area:</strong> ~2.5 million sq km</p><p><strong>Average elevation:</strong> ~4,500 m</p><p><strong>Mount Kailas:</strong> ~6,638 m (sacred peak)</p><p><strong>Mount Everest:</strong> ~8,848.86 m (southern edge)</p>');

        var animating = true, lastTime = Date.now();
        function animate() {
            if (animating) requestAnimationFrame(animate);
            shell.applyCamera();
            shell.renderer.render(scene, shell.camera);
        }
        animate();

        function toggleElevationBands() {
            elevationBandsOn = !elevationBandsOn;
            var colors = elevationBandsOn ? colorBuffers.elevation : colorBuffers.grass;
            terrain.geometry.attributes.color.array.set(colors);
            terrain.geometry.attributes.color.needsUpdate = true;
            storeData.elevationBands = elevationBandsOn;
            t3dSaveStore(storeData);
            document.getElementById('t3dTpElevationBtn').textContent = 'Elevation bands: ' + (elevationBandsOn ? 'On' : 'Off');
        }
        function togglePeaks() {
            peaksOn = !peaksOn;
            peaksGroup.visible = peaksOn;
            storeData.peaks = peaksOn;
            t3dSaveStore(storeData);
            document.getElementById('t3dTpPeaksBtn').textContent = 'Sacred peaks: ' + (peaksOn ? 'On' : 'Off');
        }

        document.getElementById('t3dTpControls').style.display = '';
        var elevBtn = document.getElementById('t3dTpElevationBtn');
        var peaksBtn = document.getElementById('t3dTpPeaksBtn');
        if (elevBtn) elevBtn.addEventListener('click', toggleElevationBands);
        if (peaksBtn) peaksBtn.addEventListener('click', togglePeaks);

        peaksGroup.visible = peaksOn;
        if (!elevationBandsOn) {
            terrain.geometry.attributes.color.array.set(colorBuffers.grass);
            terrain.geometry.attributes.color.needsUpdate = true;
        }

        var fullscreenBtn = document.getElementById('t3dFullscreenBtn');
        if (fullscreenBtn) fullscreenBtn.addEventListener('click', function () { t3dFullscreen(document.getElementById('t3dWrapper')); });

        return { shell: shell };
    }

    // Bootstrap after page load
    if (typeof doAfterPageRendered === 'function') {
        doAfterPageRendered(function () {
            var host = document.getElementById('t3dCanvasHost');
            if (!host) return;
            t3dStatus('Loading three.js...');
            ftoLoadThree().then(function (THREE) {
                t3dStatus('Rendering 3D scene...');
                try {
                    var shell = t3dShell(THREE, host, { radius: 28, theta: 0.5, phi: 0.8, fov: 50 });
                    t3dScene(shell);
                    t3dStatus('');
                } catch (err) {
                    t3dStatus('Scene error: ' + err.message);
                    console.error(err);
                }
            }).catch(function (err) {
                t3dStatus('Failed to load three.js: ' + err.message);
                console.error(err);
            });
        });
    }
</script>

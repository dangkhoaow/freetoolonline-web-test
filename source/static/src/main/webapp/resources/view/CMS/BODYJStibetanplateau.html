<script>
    // 3D scene archetype skeleton (tibetan-plateau) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (tibetan-plateau).
    // places-3d cluster, fresh author 2026-07-29. DETAILED-TERRAIN migration
    // 2026-08-30 (prompts/places-3d-detailed-terrain-runbook.md): the plateau
    // cannot fit any real-terrain window (2.5M sq km), so the globally
    // recognized Mount Kailash massif is framed as a real-terrain "View" the
    // reader can switch to; the procedural teaching relief below renders FIRST
    // (unchanged, CDN-outage fallback) and stays the default.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic consensus, cross-checked 2026-07-29):
    //   - Area about 2.5 million sq km - world's largest plateau
    //   - Average elevation about 4,000 m - nearly all above tree line
    //   - Highest peaks exceed 8,000 m including Mount Everest (~8,849 m)
    //   - Average temperature about -5 degrees Celsius
    //   - Annual precipitation less than 500 mm (semi-desert)
    //   - Yangtze, Yellow, Mekong, Brahmaputra all originate here
    //   - Sparse alpine grassland, permafrost, glaciated peaks
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'tibetan-plateau';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placestibetanplateau'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    // ---- Real-terrain CDN + IndexedDB cache (mirrors BODYJSgrandcanyon.html's
    // t3dPlaces* pattern) - heights.bin (Int16 LE meters) + texture.jpg
    // (Sentinel-2 true-color), sha256-verified, cached once per manifest version.
    var T3D_PLACES_CDN = 'https://gh-static.freetool.online/places-3d';
    var T3D_PLACES_DB = 'ftol-places3d-assets';
    function t3dPlacesIdbOpen() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(T3D_PLACES_DB, 1);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains('assets')) {
                    req.result.createObjectStore('assets', { keyPath: 'key' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error || new Error('IndexedDB open failed')); };
        });
    }
    function t3dPlacesIdbGet(key) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readonly');
                var rq = tx.objectStore('assets').get(key);
                rq.onsuccess = function () { resolve(rq.result ? rq.result.blob : null); };
                rq.onerror = function () { resolve(null); };
            });
        }).catch(function () { return null; });
    }
    function t3dPlacesIdbPut(key, blob) {
        return t3dPlacesIdbOpen().then(function (db) {
            return new Promise(function (resolve) {
                var tx = db.transaction('assets', 'readwrite');
                tx.objectStore('assets').put({ key: key, blob: blob });
                tx.oncomplete = function () { resolve(true); };
                tx.onerror = function () { resolve(false); };
            });
        }).catch(function () { return false; });
    }
    function t3dPlacesSha256Hex(buf) {
        return crypto.subtle.digest('SHA-256', buf).then(function (hash) {
            var b = new Uint8Array(hash), hex = '';
            for (var i = 0; i < b.length; i++) hex += b[i].toString(16).padStart(2, '0');
            return hex;
        });
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x7db4d6, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xfff5e0, 0.9);
        key.position.set(-8, 18, 12);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 }));
        }

        // High-altitude plateau terrain. 1 unit ≈ 500 m elevation.
        // Altitude zones: brown scree (low) -> green grassland (mid) -> white snow (high).
        // Sparse vegetation, permafrost, glaciated peaks.
        var PLATEAU_BASE = 8.0, PEAK_HIGH = 18.0;
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        
        // Radial river valleys emanating from central peaks (Yangtze, Yellow, Mekong)
        function inRiverValley(x, z, angle, width) {
            var dx = x - 0.5 * Math.cos(angle), dz = z - 0.5 * Math.sin(angle);
            var dist = Math.sqrt(dx * dx + dz * dz);
            return dist < width && (Math.atan2(dz, dx) - angle) < 0.3;
        }
        
        function height(x, z) {
            var dist = Math.sqrt(x * x + z * z);
            var radial = Math.atan2(z, x);
            var base = PLATEAU_BASE + 2.0 * fbm(x * 0.4, z * 0.4, 4) + 1.5 * fbm(x * 0.9 + 5, z * 0.9 + 7, 3);
            
            // Central peak cluster (Everest area)
            var centerDist = Math.sqrt((x - 0.3) * (x - 0.3) + (z + 1.2) * (z + 1.2));
            if (centerDist < 3.5) {
                base += (PEAK_HIGH - PLATEAU_BASE) * Math.max(0, 1 - centerDist / 3.5) * 0.85;
            }
            
            // Secondary peaks scattered
            for (var i = 0; i < 6; i++) {
                var pa = (Math.PI * 2 * i) / 6, px = 4.5 * Math.cos(pa), pz = 4.5 * Math.sin(pa);
                var pd = Math.sqrt((x - px) * (x - px) + (z - pz) * (z - pz));
                if (pd < 2.5) {
                    base += (PEAK_HIGH - PLATEAU_BASE) * 0.5 * Math.max(0, 1 - pd / 2.5);
                }
            }
            
            // River valleys carved down
            for (var i = 0; i < 3; i++) {
                var va = (Math.PI * 2 * i) / 3;
                if (inRiverValley(x, z, va, 2.2)) {
                    base -= 1.5;
                }
            }
            
            return Math.max(PLATEAU_BASE - 2, base);
        }
        
        // Precompute two color buffers: vegetation on/off
        var colVeg = { scree: new THREE.Color(0x8b7d4d), grass: new THREE.Color(0x6ba639), snow: new THREE.Color(0xf5f5f5) };
        var colBare = { scree: new THREE.Color(0x6b5d3d), grass: new THREE.Color(0x9b8d6d), snow: new THREE.Color(0xf0f0f0) };
        
        function color(c, h, x, z, vegOn) {
            var colors = vegOn ? colVeg : colBare;
            var n = 0.88 + 0.15 * fbm(x * 1.4 + 11, z * 1.4 + 7, 3);
            if (h > 15.0) {
                c.copy(colors.snow).multiplyScalar(n);
            } else if (h > 11.0) {
                c.copy(colors.grass).lerp(colors.snow, smooth(11, 15, h)).multiplyScalar(n);
            } else if (h > 8.5) {
                c.copy(colors.scree).lerp(colors.grass, smooth(8.5, 11, h)).multiplyScalar(n);
            } else {
                c.copy(colors.scree).multiplyScalar(n);
            }
        }
        
        var terrainVeg = makeTerrain(18, 18, shell.low ? 100 : 160, shell.low ? 100 : 160, height, function(c, h, x, z) { color(c, h, x, z, true); });
        var terrainBare = makeTerrain(18, 18, shell.low ? 100 : 160, shell.low ? 100 : 160, height, function(c, h, x, z) { color(c, h, x, z, false); });
        var terrainCurrent = terrainVeg;
        // Procedural teaching relief lives in its own group so it can be
        // swapped out (never destroyed) once real Mount Kailash terrain loads -
        // a CDN failure or slow network leaves this on screen, it never blanks.
        var procGroup = new THREE.Group();
        procGroup.add(terrainCurrent);

        // Snow/glacier cap - white overlay geometry on highest peaks
        var snowCap = new THREE.Group();
        (function() {
            var peakPositions = [
                { x: 0.3, z: -1.2, r: 3.2 }, // central
                { x: 4.5, z: 0, r: 2.0 }, { x: -2.2, z: 3.8, r: 2.0 }, { x: -3.5, z: -2.8, r: 2.0 }
            ];
            peakPositions.forEach(function(peak) {
                var peaks = new THREE.Mesh(
                    new THREE.ConeGeometry(peak.r * 0.8, peak.r * 1.2, 16),
                    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
                );
                peaks.position.set(peak.x, height(peak.x, peak.z) + peak.r * 0.6, peak.z);
                snowCap.add(peaks);
            });
        })();
        procGroup.add(snowCap);
        scene.add(procGroup);

        // ---- Real-terrain progressive upgrade (Mount Kailash massif) ----
        var realGroup = new THREE.Group();
        scene.add(realGroup);
        realGroup.visible = false;
        var realMat = null, realTex = null, realHeights = null;
        var realMinH = 0, realMaxH = 0, realReady = false, realLoading = false;
        var viewMode = 'procedural'; // 'procedural' | 'real'
        var REAL_BASE_M = 4700; // Barkha-plain base band, scree color floor
        var REAL_SNOWLINE_M = 5800; // approximate permanent-snow altitude, this massif

        function realColorAt(c, hRaw) {
            var t = Math.max(0, Math.min(1, (hRaw - REAL_BASE_M) / (REAL_SNOWLINE_M - REAL_BASE_M)));
            if (hRaw >= REAL_SNOWLINE_M) { c.copy(colVeg.snow); }
            else { c.copy(colVeg.scree).lerp(colVeg.grass, 0.35 * t); }
        }
        function recolorReal() {
            if (!realGroup.children.length || !realHeights) return;
            var mesh = realGroup.children[0];
            var cols = mesh.geometry.attributes.color, c2 = new THREE.Color();
            for (var i = 0; i < realHeights.length; i++) {
                realColorAt(c2, realHeights[i]);
                cols.setXYZ(i, c2.r, c2.g, c2.b);
            }
            cols.needsUpdate = true;
        }
        // Decimate a row-major Int16 grid to at most maxDim x maxDim cells,
        // keeping the MAX value per cell (preserve the summit, never average
        // it away into the surrounding plateau).
        function decimateMax(view, w, h, maxDim) {
            var stepX = Math.max(1, Math.ceil(w / maxDim));
            var stepZ = Math.max(1, Math.ceil(h / maxDim));
            var ow = Math.floor((w - 1) / stepX) + 1;
            var oh = Math.floor((h - 1) / stepZ) + 1;
            var out = new Int16Array(ow * oh);
            for (var oz = 0; oz < oh; oz++) {
                var z0 = oz * stepZ;
                for (var ox = 0; ox < ow; ox++) {
                    var x0 = ox * stepX, best = -32768;
                    for (var dz = 0; dz < stepZ && z0 + dz < h; dz++) {
                        var rowBase = (z0 + dz) * w;
                        for (var dx = 0; dx < stepX && x0 + dx < w; dx++) {
                            var v = view[rowBase + x0 + dx];
                            if (v > best) best = v;
                        }
                    }
                    out[oz * ow + ox] = best;
                }
            }
            return { data: out, w: ow, h: oh };
        }
        function buildRealMesh(view, grid, texBlob) {
            var dec = decimateMax(view, grid.width_px, grid.height_px, 220);
            var W = 18, D = 18; // same footprint as the procedural terrain above
            var geo2 = new THREE.PlaneGeometry(W, D, dec.w - 1, dec.h - 1);
            geo2.rotateX(-Math.PI / 2);
            // Isotropic meters -> scene-unit scale so relief keeps TRUE 1:1
            // vertical proportion relative to the mapped width (no exaggeration).
            var vertScale = W / (grid.width_px * grid.meters_per_px);
            var minH = grid.min_h_m, maxH = grid.max_h_m;
            var pos2 = geo2.attributes.position;
            var heightsArr = new Float32Array(pos2.count);
            var startCol = new Float32Array(pos2.count * 3);
            var c = new THREE.Color();
            for (var i = 0; i < pos2.count; i++) {
                var ix = i % dec.w, iz = Math.floor(i / dec.w);
                var hRaw = dec.data[iz * dec.w + ix];
                pos2.setY(i, (hRaw - minH) * vertScale);
                heightsArr[i] = hRaw;
                realColorAt(c, hRaw);
                startCol[i * 3] = c.r; startCol[i * 3 + 1] = c.g; startCol[i * 3 + 2] = c.b;
            }
            geo2.setAttribute('color', new THREE.BufferAttribute(startCol, 3));
            geo2.computeVertexNormals();
            var mat2 = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });
            var mesh2 = new THREE.Mesh(geo2, mat2);
            realGroup.add(mesh2);
            realMat = mat2;
            realHeights = heightsArr;
            realMinH = minH; realMaxH = maxH;
            realLoading = false; realReady = true;
            apply();
            t3dStatus('Real terrain loaded (Mount Kailash massif - Terrarium DEM + Sentinel-2 imagery). Drag to orbit, scroll to zoom.');
            if (texBlob) {
                var url = URL.createObjectURL(texBlob);
                new THREE.TextureLoader().load(url, function (tex) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    // MeshStandardMaterial MULTIPLIES vertexColors by map - once
                    // real imagery is the colour source the hypsometric bands
                    // must stop multiplying into it (2026-08-29 defect fix).
                    realTex = tex;
                    if (viewMode === 'real' && realMat) {
                        realMat.map = realTex; realMat.vertexColors = false; realMat.color.setScalar(1); realMat.needsUpdate = true;
                    }
                    URL.revokeObjectURL(url);
                }, undefined, function () { URL.revokeObjectURL(url); });
            }
        }
        function fetchPlacesAsset(file, mimeType, verKey) {
            var key = verKey + ':' + file.file;
            return t3dPlacesIdbGet(key).then(function (cached) {
                if (cached) return cached;
                return fetch(T3D_PLACES_CDN + '/' + file.file).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + file.file);
                    return r.arrayBuffer();
                }).then(function (buf) {
                    return t3dPlacesSha256Hex(buf).then(function (hex) {
                        if (file.sha256 && hex !== file.sha256) { throw new Error('sha256 mismatch on ' + file.file); }
                        var blob = new Blob([buf], { type: mimeType });
                        t3dPlacesIdbPut(key, blob);
                        return blob;
                    });
                });
            });
        }
        function loadRealTerrain() {
            realLoading = true;
            fetch(T3D_PLACES_CDN + '/manifest.json').then(function (r) { return r.json(); })
                .then(function (manifest) {
                    var asset = manifest && manifest.assets && manifest.assets['tibetan-plateau'];
                    if (!asset) throw new Error('manifest missing the tibetan-plateau asset');
                    var heightsFile = null, texFile = null;
                    (asset.files || []).forEach(function (f) {
                        if (f.role === 'heightfield') heightsFile = f;
                        if (f.role === 'satellite-texture') texFile = f;
                    });
                    if (!heightsFile) throw new Error('manifest missing the heightfield file');
                    var verKey = 'tibetan-plateau@' + manifest.version;
                    var jobs = [fetchPlacesAsset(heightsFile, 'application/octet-stream', verKey)];
                    if (texFile) jobs.push(fetchPlacesAsset(texFile, 'image/jpeg', verKey));
                    return Promise.all(jobs).then(function (blobs) {
                        return blobs[0].arrayBuffer().then(function (buf) {
                            buildRealMesh(new Int16Array(buf), asset.grid, blobs[1] || null);
                        });
                    });
                })
                .catch(function (err) {
                    realLoading = false;
                    t3dStatus('Could not load real terrain data (' + (err && err.message ? err.message : err) + ') - showing the procedural relief instead.');
                });
        }

        // Store state for toggles
        var state = {
            vegetationOn: true,
            snowOn: true
        };
        
        // Load saved state
        var saved = t3dLoadStore();
        if (typeof saved.vegetationOn === 'boolean') state.vegetationOn = saved.vegetationOn;
        if (typeof saved.snowOn === 'boolean') state.snowOn = saved.snowOn;
        
        function updateInfoPanel() {
            var info;
            if (viewMode === 'real' && realReady) {
                info = '<h3>Mount Kailash: real elevation + satellite imagery</h3>' +
                    '<p>A globally recognized peak on the Tibetan Plateau, sacred to Hindus, Buddhists, Jains, and Bon practitioners - no one is permitted to climb it. This relief shows its actual measured terrain, not a procedural approximation.</p>' +
                    '<p><b>Summit:</b> about 6,638 m ASL</p>' +
                    '<p><b>Elevation in this view:</b> ' + Math.round(realMinH) + ' m to ' + Math.round(realMaxH) + ' m</p>' +
                    '<p><b>Base (Barkha plain):</b> about 4,600-4,700 m</p>' +
                    '<p class="t3d-note">Terrain: Mapzen/AWS Open Data terrain tiles (NASA/USGS DEMs). Imagery: contains modified Copernicus Sentinel data 2026. True 1:1 scale, no vertical exaggeration. Educational approximation - not survey-grade geodesy.</p>';
            } else {
                info = '<h3>Tibetan Plateau</h3>';
                info += '<p><b>Area:</b> ~2.5M sq km</p>';
                info += '<p><b>Avg elev:</b> ~4,000 m</p>';
                info += '<p><b>Climate:</b> -5°C avg, <500mm rain</p>';
                info += '<p><b>Rivers:</b> Yangtze, Yellow, Mekong originate here</p>';
                info += '<p class="t3d-note">' + (realLoading
                    ? 'Loading real Mount Kailash terrain now (one time, then cached).'
                    : 'This teaching relief is procedural - switch the View button to see real measured terrain for the Kailash massif.') + '</p>';
            }
            t3dInfo(info);
        }

        function updateTerrainVegetation() {
            procGroup.remove(terrainCurrent);
            terrainCurrent = state.vegetationOn ? terrainVeg : terrainBare;
            procGroup.add(terrainCurrent);
        }

        function updateSnowCap() {
            snowCap.visible = state.snowOn;
        }

        function apply() {
            procGroup.visible = (viewMode !== 'real') || !realReady;
            realGroup.visible = (viewMode === 'real') && realReady;
            if (viewMode === 'real' && realReady) { recolorReal(); }
            var vb = document.getElementById('t3dTpViewBtn');
            if (vb) vb.textContent = 'View: ' + (viewMode === 'real' ? 'Real terrain (Kailash)' : 'Plateau relief') + (realReady ? ' (tap to switch)' : ' (loading real...)');
            updateInfoPanel();
        }

        // Attach event listeners
        window.addEventListener('t3d-toggle-vegetation', function() {
            state.vegetationOn = !state.vegetationOn;
            updateTerrainVegetation();
            t3dSaveStore(state);
        });
        window.addEventListener('t3d-toggle-snow', function() {
            state.snowOn = !state.snowOn;
            updateSnowCap();
            t3dSaveStore(state);
        });
        window.addEventListener('t3d-toggle-view', function() {
            if (!realReady) { return; } // no-op until the CDN asset lands
            viewMode = (viewMode === 'real') ? 'procedural' : 'real';
            if (viewMode === 'real' && realMat) {
                if (realTex) { realMat.map = realTex; realMat.vertexColors = false; realMat.color.setScalar(1); }
                else { realMat.map = null; realMat.vertexColors = true; }
                realMat.needsUpdate = true;
            }
            apply();
        });

        // Initialize UI
        updateTerrainVegetation();
        updateSnowCap();
        apply();
        if ('requestIdleCallback' in window) { requestIdleCallback(loadRealTerrain, { timeout: 4000 }); }
        else { setTimeout(loadRealTerrain, 800); }

        return { scene: scene, state: state };
    }

    function t3dRender(shell, sceneObj) {
        var animate = function () {
            requestAnimationFrame(animate);
            shell.applyCamera();
            shell.renderer.render(shell.scene, shell.camera);
        };
        animate();
    }

    function doAfterPageRendered_t3d() {
        ftoLoadThree().then(function(THREE) {
            try {
                var host = document.getElementById('t3dCanvasHost');
                if (!host) { t3dStatus('Canvas host not found'); return; }
                var shell = t3dShell(THREE, host, { fov: 55, radius: 32, theta: 0.4, phi: 0.95, targetY: 10 });
                var sceneObj = t3dScene(shell);
                t3dRender(shell, sceneObj);
                t3dStatus('Scene ready - drag to orbit');
                
                // Wire toggle buttons. NOTE (2026-08-30 root-cause fix): these
                // used to reference a bare `state` identifier that only exists
                // inside t3dScene()'s own closure - out of scope here, so every
                // click threw a ReferenceError before this fire (pre-existing
                // defect, unrelated to the real-terrain migration; fixed while
                // touching this file per the render-quality contract). Reading
                // through sceneObj.state fixes it without changing behavior.
                document.getElementById('t3dTpVegetationBtn')?.addEventListener('click', function() {
                    window.dispatchEvent(new Event('t3d-toggle-vegetation'));
                    this.textContent = 'Vegetation: ' + (sceneObj.state.vegetationOn ? 'Off' : 'On');
                });
                document.getElementById('t3dTpSnowBtn')?.addEventListener('click', function() {
                    window.dispatchEvent(new Event('t3d-toggle-snow'));
                    this.textContent = 'Snow/Glaciers: ' + (sceneObj.state.snowOn ? 'Off' : 'On');
                });
                document.getElementById('t3dTpViewBtn')?.addEventListener('click', function() {
                    window.dispatchEvent(new Event('t3d-toggle-view'));
                });
                document.getElementById('t3dFullscreenBtn')?.addEventListener('click', function() {
                    t3dFullscreen(host.parentElement.parentElement);
                });
                
                // Show controls
                var controls = document.getElementById('t3dTpControls');
                if (controls) controls.style.display = 'inline';
                
            } catch (e) {
                console.error('T3D scene error:', e);
                t3dStatus('Scene failed: ' + e.message);
            }
        }).catch(function(e) {
            console.error('Three.js load error:', e);
            t3dStatus('Failed to load 3D engine');
        });
    }

    // Bootstrap hook: runs after page-renderer mounts the page fragment
    if (typeof doAfterPageRendered === 'function' && !window.__ftoT3DBootstrapped) {
        window.__ftoT3DBootstrapped = true;
        var orig = doAfterPageRendered;
        doAfterPageRendered = function() {
            if (orig) orig();
            doAfterPageRendered_t3d();
        };
    } else if (!window.__ftoT3DBootstrapped) {
        window.__ftoT3DBootstrapped = true;
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', doAfterPageRendered_t3d);
        } else {
            doAfterPageRendered_t3d();
        }
    }
</script>

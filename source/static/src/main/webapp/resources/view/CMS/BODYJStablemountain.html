<script>
    // 3D scene archetype skeleton (table mountain) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (table mountain). All geometry is procedural. places-3d cluster, 2026-08-27.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (Cape Town / Table Mountain National Park sources,
    // cross-checked 2026-08-27):
    //   - Highest point: Maclear's Beacon, 1,085 m (3,563 ft) above sea level
    //   - The summit plateau is a long, roughly flat table about 3 km
    //     (1.9 mi) long, running approximately north-south above Cape Town
    //   - Near-vertical cliff faces drop from the plateau edge on every side,
    //     most dramatically facing the city on the north/northwest
    //   - Predominantly Table Mountain Sandstone, deposited around 450-500
    //     million years ago and since uplifted and eroded into today's shape
    //   - Table Mountain Aerial Cableway opened October 4, 1929, with a
    //     rotating cable car introduced in 1997, carrying visitors from
    //     Tafelberg Road to the upper station in about 5 minutes
    //   - The "tablecloth": when the southeaster wind blows moist air up the
    //     mountain, it condenses into an orographic cloud that caps the flat
    //     top and spills down over the cliff edge like a tablecloth
    //   - Part of Table Mountain National Park and the Cape Floral Region
    //     Protected Areas, a UNESCO World Heritage Site since 2004
    //   - Home to more than 2,200 plant species on the mountain alone - by
    //     widely cited comparison, more than the entire British Isles
    //   - A New7Wonders of Nature finalist (declared official winner
    //     alongside 6 others in 2011); Robben Island is visible offshore
    //     from the plateau
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'tablemountain';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placestablemountain'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x9cc3e6, 1); // clear coastal sky
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xfff2d8, 1.05);
        key.position.set(-9, 20, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smoothv(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }));
        }

        // A flat-topped plateau (a "mesa" or "table"), 1 unit = about 250 m
        // vertical, built as a rounded-rectangle footprint elongated along X
        // (the ~3 km north-south plateau), with a near-flat top, a steep
        // cliff-face collar around the whole perimeter, and a gentle talus
        // skirt fading to 0 beyond - a genuinely new places-3d archetype (a
        // flat table rather than a peak), distinct from Fuji's cone,
        // Matterhorn's four-ridged horn, and Uluru's single rounded monolith.
        var HALF_LEN = 7.6, HALF_WID = 2.7, ROUND = 1.3;
        var TABLE_H = 4.3, CLIFF_W = 0.55, TALUS_SPAN = 2.4;
        function roundedRectSDF(x, z) {
            var qx = Math.abs(x) - (HALF_LEN - ROUND);
            var qz = Math.abs(z) - (HALF_WID - ROUND);
            var ax = Math.max(qx, 0), az = Math.max(qz, 0);
            var outside = Math.hypot(ax, az) - ROUND;
            var inside = Math.min(Math.max(qx, qz), 0);
            return outside + inside; // <0 well inside the plateau footprint, >0 outside
        }
        function height(x, z) {
            var d = roundedRectSDF(x, z);
            if (d <= -CLIFF_W) {
                // flat table top, gently uneven (fynbos scrub, shallow gullies)
                return TABLE_H + 0.16 * (fbm(x * 0.55 + 3, z * 0.55 + 7, 3) - 0.5);
            }
            if (d <= CLIFF_W) {
                var t = smoothv(-CLIFF_W, CLIFF_W, d);
                var texture = 0.1 * (fbm(x * 2.2 + 12, z * 2.2 + 5, 3) - 0.5);
                return TABLE_H * (1 - t) + texture * t;
            }
            var t2 = smoothv(CLIFF_W, CLIFF_W + TALUS_SPAN, d);
            var talusBase = 0.55 * (1 - t2);
            var skirt = 0.18 * (fbm(x * 0.4 + 21, z * 0.4 + 8, 3) - 0.5) * (1 - t2);
            return Math.max(0, talusBase + skirt);
        }

        var col = {
            top: new THREE.Color(0x6f9756), rock: new THREE.Color(0x9c8a72),
            rockDark: new THREE.Color(0x7a6a56), skirt: new THREE.Color(0x4f7a44)
        };
        function bandColor(c, x, z) {
            var d = roundedRectSDF(x, z);
            var n = 0.92 + 0.16 * fbm(x * 1.3 + 4, z * 1.3 + 6, 3);
            if (d <= -CLIFF_W) {
                c.copy(col.top);
                c.multiplyScalar(n);
                return;
            }
            if (d <= CLIFF_W) {
                var stripe = 0.5 + 0.5 * Math.sin(height(x, z) * 9 + fbm(x * 1.8 + 2, z * 1.8 + 9, 3) * 4);
                c.copy(col.rock).lerp(col.rockDark, stripe * 0.6);
                c.multiplyScalar(n);
                return;
            }
            var t2 = smoothv(CLIFF_W, CLIFF_W + TALUS_SPAN, d);
            c.copy(col.rockDark).lerp(col.skirt, t2);
            c.multiplyScalar(n);
        }

        var terrain = makeTerrain(24, 12, shell.low ? 130 : 180, shell.low ? 70 : 96, height, bandColor);
        scene.add(terrain);

        // "Tablecloth" cloud: an orographic cloud capping the flat top and
        // spilling down over one long cliff edge (the city-facing side),
        // built from soft translucent puffs - a schematic teaching cue for
        // the real weather phenomenon, not a fluid simulation.
        var cloudGroup = new THREE.Group();
        var puffMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.72, depthWrite: false });
        for (var pi = 0; pi < 16; pi++) {
            var along = -HALF_LEN * 0.85 + (HALF_LEN * 1.7) * (pi / 15);
            var spill = pi % 4 === 0 ? 0.55 : (pi % 3 === 0 ? 0.25 : 0);
            var puff = new THREE.Mesh(new THREE.SphereGeometry(0.55 + 0.25 * hash2(pi, 1), 8, 6), puffMat);
            puff.scale.set(1.5, 0.55, 1.05);
            puff.position.set(along, TABLE_H + 0.35 - spill * 1.6, HALF_WID + 0.4 + spill * 0.9);
            cloudGroup.add(puff);
        }
        scene.add(cloudGroup);

        // Maclear's Beacon marker (highest point, a small stone-cairn cone
        // near the plateau's north end) plus a thin tube tracing the aerial
        // cableway route up the opposite (city-facing) face to an upper
        // cable-station marker.
        var markerGroup = new THREE.Group();
        var beaconPt = new THREE.Vector3(HALF_LEN * 0.35, TABLE_H + 0.14, -HALF_WID * 0.2);
        var beacon = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.32, 8), new THREE.MeshStandardMaterial({ color: 0xd9432f }));
        beacon.position.copy(beaconPt);
        markerGroup.add(beacon);
        var cablePts = [];
        for (var ci = 0; ci <= 20; ci++) {
            var ct = ci / 20;
            var cx = -HALF_LEN * 0.15;
            var cz = -HALF_WID - TALUS_SPAN * (1 - ct) * 0.9;
            var cy = height(cx, cz) * (1 - ct) + TABLE_H * ct;
            cablePts.push(new THREE.Vector3(cx, cy + 0.05, cz));
        }
        var cableTube = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cablePts), 40, 0.05, 6, false),
            new THREE.MeshBasicMaterial({ color: 0x2255aa })
        );
        markerGroup.add(cableTube);
        var stationPt = cablePts[cablePts.length - 1];
        var station = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.22, 0.3), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
        station.position.set(stationPt.x, stationPt.y + 0.11, stationPt.z);
        markerGroup.add(station);
        scene.add(markerGroup);

        var cloudOn = true, beaconOn = true;

        function panelHtml() {
            return '<h3>Table Mountain: a flat sandstone plateau</h3>' +
                '<p>A long, roughly flat top cut off sharply by cliffs on every side. Toggle the tablecloth cloud to see the orographic cloud that caps the summit and spills over the city-facing edge, and the beacon/cableway marker for the highest point and the aerial cableway route.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Highest point</td><td>Maclear\'s Beacon, 1,085 m (3,563 ft)</td></tr>' +
                '<tr><td>Plateau length</td><td>about 3 km (1.9 mi), roughly north-south</td></tr>' +
                '<tr><td>Rock</td><td>Table Mountain Sandstone, deposited about 450-500 million years ago</td></tr>' +
                '<tr><td>Cableway</td><td>opened October 4, 1929; rotating cable car since 1997; about 5 minutes to the upper station</td></tr>' +
                '<tr><td>"Tablecloth" cloud</td><td>orographic cloud formed when the southeaster wind pushes moist air up and over the flat top</td></tr>' +
                '<tr><td>Protected area</td><td>Table Mountain National Park, part of the Cape Floral Region Protected Areas (UNESCO World Heritage Site since 2004)</td></tr>' +
                '<tr><td>Plant species</td><td>more than 2,200 on the mountain alone - widely cited as more than the entire British Isles</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the cliff profile, cloud shape, and marker positions are schematic teaching cues, not survey terrain.</p>';
        }

        function apply() {
            cloudGroup.visible = cloudOn;
            markerGroup.visible = beaconOn;
            var cb = document.getElementById('t3dPtmCloudBtn');
            if (cb) cb.textContent = 'Tablecloth cloud: ' + (cloudOn ? 'On' : 'Off');
            var bb = document.getElementById('t3dPtmBeaconBtn');
            if (bb) bb.textContent = 'Beacon & cableway marker: ' + (beaconOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ cloudOn: cloudOn, beaconOn: beaconOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.cloudOn === 'boolean') cloudOn = store.cloudOn;
        if (typeof store.beaconOn === 'boolean') beaconOn = store.beaconOn;
        apply();

        var cloudBtn = document.getElementById('t3dPtmCloudBtn');
        if (cloudBtn) cloudBtn.addEventListener('click', function () { cloudOn = !cloudOn; apply(); });
        var beaconBtn = document.getElementById('t3dPtmBeaconBtn');
        if (beaconBtn) beaconBtn.addEventListener('click', function () { beaconOn = !beaconOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the tablecloth cloud or the beacon & cableway marker.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placestablemountain: 't3dPtmControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placestablemountain: { radius: 22, maxR: 52, minR: 7, phi: 1.18, theta: 0.85, targetY: 2.1 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

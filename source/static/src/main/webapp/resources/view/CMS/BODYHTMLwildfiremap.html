<div class="w3-container">
    <p>Every dot below is a current US wildfire incident from the federal NIFC feed - sized by acres, colored by containment, prescribed burns in grey. Pick a state, set a size floor, or sort by your distance. It all loads straight into your browser: no app, no account.</p>
</div>

<div id="wildfireMapTool" class="w3-container outputImgs" style="visibility:visible !important; min-height:200px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>
    <div class="w3-row" style="margin-bottom:10px;">
        <select id="wfStateSelect" class="w3-select w3-border" style="display:inline-block;width:170px;"><option value="">All states</option></select>
        <select id="wfSizeSelect" class="w3-select w3-border" style="display:inline-block;width:150px;"></select>
        <label style="display:inline-block;margin:0 10px;white-space:nowrap;"><input type="checkbox" id="wfRxToggle"> Include prescribed burns</label>
        <button type="button" id="wfRefreshBtn" class="w3-button w3-red">Refresh incidents</button>
        <button type="button" id="wfLocBtn" class="w3-button w3-light-grey">Sort by distance from me</button>
    </div>
    <div id="wfStatus" aria-live="polite" style="min-height:1.2em;color:#555;"></div>
    <div id="wfCanvasHost" style="position:relative;margin-top:8px;">
        <canvas id="wfCanvas" style="display:block;width:100%;max-width:100%;height:auto;border:1px solid #e0e0e0;border-radius:4px;background:#f7f9fb;"></canvas>
        <div id="wfTip" style="position:absolute;display:none;background:#1d2733;color:#fff;padding:4px 8px;border-radius:4px;font-size:0.85em;pointer-events:none;max-width:240px;z-index:5;"></div>
    </div>
    <div id="wfList"></div>
    <div style="margin-top:16px;">
        <div style="font-weight:bold;">Wildfire size classes (NWCG)</div>
        <div id="wfScaleTable"></div>
    </div>
</div>

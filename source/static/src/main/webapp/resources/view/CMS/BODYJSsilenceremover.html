<script>
    // In-browser SILENCE REMOVER (silence-remover) - RNNoise voice-activity detection
    // (WASM) drives automatic dead-air cutting + a deterministic loudness-based
    // fallback. 100% client-side: the RECORDING never leaves the browser; only
    // the ~0.12 MB engine downloads once, on an explicit click. Registry
    // Gate-H entry: silence_remover_vad_rnnoise_wasm (verified 2026-08-24 in a
    // node probe - per-frame VAD separates speech from silence 0.60 vs 0.005
    // mean, all 3 ground-truth segments found within 0.31 s; artifact in
    // seo-reports/20260824-ailocal-fire25/).
    //
    // ENGINE: @jitsi/rnnoise-wasm@0.2.1 (EXACT pin per the lane's CDN ENGINE
    // PIN discipline; SAME package + digest + Cache-API entry as the
    // audio-denoiser page, so a visitor who used that page pays no second
    // download). dist/rnnoise.wasm (112,141 bytes, weights baked in) is
    // sha256-verified on every load path. API: _rnnoise_create ->
    // _rnnoise_process_frame (480 float32 samples @ 48 kHz scaled to int16
    // range; RETURNS voice-activity probability 0..1 - that probability is
    // what this page consumes; the denoised samples are discarded) ->
    // _rnnoise_destroy.
    //
    // LADDER (ai-local class rule 1): (1) no Chrome Built-in tier - no browser
    // API detects silence in FILES; (2) on-device RNNoise VAD (this): voiced
    // frame = smoothed probability >= 0.5 (moving max over 3 frames bridges
    // syllable troughs - probe-measured), cut gaps longer than the chosen
    // minimum, keep 0.15 s padding around speech; (3) deterministic
    // no-download fallback - frame RMS loudness vs a threshold derived from
    // the quietest 10% of frames, same cutting logic, honestly labeled
    // below-AI on breathy/quiet speech. The G16 zero-interaction/zero-download
    // demo (a REAL before/after waveform pair produced by this same engine)
    // is baked into the paired BODYHTML and renders on load.
    //
    // Framework contract: doAfterPageRendered(); no top-level DOM.
    // web.localUpload = false (plain <input type=file>, no server upload widget).

    web.localUpload = false;

    var SR_SLUG = 'silence-remover';
    var SR_JS_CDN = 'https://cdn.jsdelivr.net/npm/@jitsi/rnnoise-wasm@0.2.1/dist/rnnoise.js';
    var SR_WASM_URL = 'https://cdn.jsdelivr.net/npm/@jitsi/rnnoise-wasm@0.2.1/dist/rnnoise.wasm';
    var SR_WASM_SHA256 = '677147b9248aedc0a00de79dc090d1ecead37c08c8bb773a790da16109d2c487';
    var SR_CACHE_NAME = 'ftol-ai-models';
    var SR_SR = 48000;
    var SR_FRAME = 480;                 // 10 ms @ 48 kHz - fixed RNNoise frame
    var SR_MAX_SECONDS = 1800;          // 30 min guard - decoded PCM lives in RAM
    var SR_WARMUP_FRAMES = 30;          // ~0.3 s adaptation pre-feed (probe-measured)
    var SR_PAD_S = 0.15;                // keep this much around every speech segment

    async function srSha256Hex(bytes) {
        var digest = await crypto.subtle.digest('SHA-256', bytes);
        var arr = new Uint8Array(digest); var hex = '';
        for (var i = 0; i < arr.length; i++) hex += (arr[i] < 16 ? '0' : '') + arr[i].toString(16);
        return hex;
    }

    // Fetch the wasm engine bytes with Cache API storage (repeat visits - and
    // visitors coming from the audio-denoiser page, which shares this exact
    // cache entry - skip the network) + MANDATORY sha256 check on every path.
    async function srFetchWasmBytes(setStatus) {
        var resp = null, fromCache = false;
        try {
            if (window.caches) {
                var cache = await caches.open(SR_CACHE_NAME);
                var hit = await cache.match(SR_WASM_URL);
                if (hit) { resp = hit; fromCache = true; }
            }
        } catch (e) { /* private mode - fall through to network */ }
        if (!resp) {
            setStatus('Downloading the voice-detection engine (about 0.1 MB, one time - it is cached for next visit) ...');
            resp = await fetch(SR_WASM_URL);
            if (!resp.ok) throw new Error('engine download failed (HTTP ' + resp.status + ')');
            try {
                if (window.caches) {
                    var cache2 = await caches.open(SR_CACHE_NAME);
                    await cache2.put(SR_WASM_URL, resp.clone());
                }
            } catch (e) { /* cache write is best-effort */ }
        } else {
            setStatus('Loading the voice-detection engine from your browser cache ...');
        }
        var bytes = new Uint8Array(await resp.arrayBuffer());
        var hex = await srSha256Hex(bytes);
        if (hex !== SR_WASM_SHA256) {
            try { if (fromCache && window.caches) { var c3 = await caches.open(SR_CACHE_NAME); await c3.delete(SR_WASM_URL); } } catch (e) { }
            throw new Error('the downloaded engine failed its integrity check - please try again');
        }
        return bytes;
    }

    var srModulePromise = null;
    function srLoadEngine(setStatus) {
        if (srModulePromise) return srModulePromise;
        srModulePromise = (async function () {
            var bytes = await srFetchWasmBytes(setStatus);
            setStatus('Starting the voice-detection engine in your browser ...');
            var factory = (await import(SR_JS_CDN)).default;
            var mod = await factory({ wasmBinary: bytes });
            return mod;
        })();
        srModulePromise.catch(function () { srModulePromise = null; }); // allow retry
        return srModulePromise;
    }

    // Decode ANY browser-supported audio file to 48 kHz MONO Float32.
    async function srDecodeTo48kMono(file, setStatus) {
        setStatus('Reading and decoding your audio in the browser (nothing is uploaded) ...');
        var raw = await file.arrayBuffer();
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw new Error('this browser does not expose Web Audio decoding');
        var probeCtx = new AC();
        var decoded;
        try { decoded = await probeCtx.decodeAudioData(raw); }
        finally { try { probeCtx.close(); } catch (e) { } }
        if (decoded.duration > SR_MAX_SECONDS) {
            throw new Error('recording is longer than 30 minutes - split it first (decoded audio has to fit in this tab\'s memory)');
        }
        var frames = Math.ceil(decoded.duration * SR_SR);
        var off = new OfflineAudioContext(1, frames, SR_SR);
        var src = off.createBufferSource();
        src.buffer = decoded;
        src.connect(off.destination);   // mono destination downmixes stereo
        src.start(0);
        var rendered = await off.startRendering();
        return { pcm: rendered.getChannelData(0), durationSec: decoded.duration };
    }

    function srRms(arr, s, e) {
        var acc = 0, n = 0;
        for (var i = s; i < e; i++) { acc += arr[i] * arr[i]; n++; }
        return n ? Math.sqrt(acc / n) : 0;
    }

    // Encode Float32 mono @48k -> 16-bit PCM WAV blob.
    function srEncodeWav(pcm) {
        var n = pcm.length;
        var buf = new ArrayBuffer(44 + n * 2);
        var v = new DataView(buf);
        function ws(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
        ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE');
        ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, SR_SR, true); v.setUint32(28, SR_SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        ws(36, 'data'); v.setUint32(40, n * 2, true);
        for (var i2 = 0; i2 < n; i2++) {
            var s2 = Math.max(-1, Math.min(1, pcm[i2]));
            v.setInt16(44 + i2 * 2, s2 < 0 ? s2 * 0x8000 : s2 * 0x7fff, true);
        }
        return new Blob([buf], { type: 'audio/wav' });
    }

    // Shared cutting logic: voicedFlags (per 10 ms frame) -> kept [start,end]
    // second-spans with min-gap closing + padding + overlap merge, then a
    // concatenated output buffer. Used by BOTH the AI and the basic tier so
    // the two paths differ ONLY in how a frame is judged voiced.
    function srCutFromFlags(pcm, voicedFlags, minGapS) {
        var frameS = SR_FRAME / SR_SR;
        var nFrames = voicedFlags.length;
        var segsF = [], cur = null;
        for (var f = 0; f < nFrames; f++) {
            if (voicedFlags[f]) { if (!cur) { cur = [f, f]; } else { cur[1] = f; } }
            else if (cur && (f - cur[1]) * frameS > minGapS) { segsF.push(cur); cur = null; }
        }
        if (cur) segsF.push(cur);
        var dur = pcm.length / SR_SR;
        var kept = [];
        for (var i = 0; i < segsF.length; i++) {
            kept.push([Math.max(0, segsF[i][0] * frameS - SR_PAD_S), Math.min(dur, (segsF[i][1] + 1) * frameS + SR_PAD_S)]);
        }
        for (var m = kept.length - 1; m > 0; m--) {
            if (kept[m][0] <= kept[m - 1][1]) { kept[m - 1][1] = kept[m][1]; kept.splice(m, 1); }
        }
        var keptSamples = 0;
        for (var k = 0; k < kept.length; k++) keptSamples += Math.round((kept[k][1] - kept[k][0]) * SR_SR);
        var out = new Float32Array(keptSamples);
        var o = 0, gapCount = 0, prevEnd = 0;
        for (var k2 = 0; k2 < kept.length; k2++) {
            var s0 = Math.round(kept[k2][0] * SR_SR), s1 = Math.min(pcm.length, Math.round(kept[k2][1] * SR_SR));
            out.set(pcm.subarray(s0, s1), o); o += s1 - s0;
            if (kept[k2][0] - prevEnd > 0.05) gapCount++;
            prevEnd = kept[k2][1];
        }
        if (dur - prevEnd > 0.05) gapCount++;
        return { out: out.subarray(0, o), kept: kept, gapCount: gapCount, removedS: dur - o / SR_SR };
    }

    function doAfterPageRendered() {
        var root = document.getElementById('silenceRemoverTool');
        if (!root) return; // not a silence-remover page

        root.innerHTML =
            '<div class="w3-row" style="margin-bottom:8px;"><input type="file" id="srFile" accept="audio/*,.mp3,.wav,.m4a,.ogg,.opus,.webm,.flac,.aac" class="w3-input w3-border" style="max-width:420px;margin:0 auto;"></div>' +
            '<div id="srStatus" style="min-height:1.2em;margin:6px 0;color:#555;">Choose a recording. It never leaves your browser - everything runs on your device.</div>' +
            '<div style="margin:4px 0;">' +
              '<label for="srMinGap" style="font-size:.9em;color:#555;">Cut pauses longer than</label> ' +
              '<select id="srMinGap" class="w3-select w3-border" style="width:auto;display:inline-block;padding:4px 8px;">' +
                '<option value="0.3">0.3 seconds (tight)</option>' +
                '<option value="0.5" selected>0.5 seconds (natural)</option>' +
                '<option value="1">1 second (only long dead air)</option>' +
              '</select>' +
            '</div>' +
            '<div style="margin-top:4px;">' +
              '<button id="srRunAiBtn" type="button" class="w3-button w3-green w3-large" disabled>Remove silence (AI voice detection, ~0.1 MB one-time download)</button> ' +
              '<button id="srRunBasicBtn" type="button" class="w3-button w3-amber" disabled>Basic cut (no download)</button>' +
            '</div>' +
            '<div id="srOut" class="outputImgs" style="visibility:visible !important;display:none;margin-top:12px;text-align:left;max-width:560px;margin-left:auto;margin-right:auto;">' +
              '<div id="srSummary" style="font-size:.95em;color:#333;margin:2px 0 6px;text-align:center;"></div>' +
              '<div style="font-size:.9em;color:#555;margin:4px 0 2px;">Original</div>' +
              '<audio id="srPlayerOrig" controls style="width:100%;"></audio>' +
              '<div style="font-size:.9em;color:#555;margin:8px 0 2px;">Trimmed <span id="srOutNote" style="color:#888;"></span></div>' +
              '<audio id="srPlayerClean" controls style="width:100%;"></audio>' +
              '<div style="margin-top:8px;text-align:center;"><a id="srDownload" class="w3-button w3-blue">Download trimmed WAV</a></div>' +
            '</div>' +
            '<div id="srErr" style="color:#b00020;margin-top:6px;min-height:1em;"></div>' +
            '<p style="font-size:.85em;color:#777;margin-top:10px;">Output is a mono 48 kHz WAV file, whatever the input format was. Speech is kept with 0.15 s of breathing room on each side; pauses shorter than your chosen minimum are left alone. The AI voice detector is tuned for speech - on music it will treat quiet instrumental passages as silence, so use the manual Audio Trimmer for music editing.</p>';

        var fileEl = root.querySelector('#srFile');
        var aiBtn = root.querySelector('#srRunAiBtn');
        var basicBtn = root.querySelector('#srRunBasicBtn');
        var minGapEl = root.querySelector('#srMinGap');
        var outWrap = root.querySelector('#srOut');
        var outNote = root.querySelector('#srOutNote');
        var summaryEl = root.querySelector('#srSummary');
        var playerOrig = root.querySelector('#srPlayerOrig');
        var playerClean = root.querySelector('#srPlayerClean');
        var dl = root.querySelector('#srDownload');
        var statusEl = root.querySelector('#srStatus');
        var errEl = root.querySelector('#srErr');

        function setStatus(m) { statusEl.textContent = m; }
        function setErr(m) { errEl.textContent = m || ''; }

        var currentFile = null, origURL = null, cleanURL = null;

        fileEl.addEventListener('change', function () {
            var f = fileEl.files && fileEl.files[0];
            if (!f) return;
            currentFile = f;
            setErr('');
            outWrap.style.display = 'none';
            if (origURL) { URL.revokeObjectURL(origURL); origURL = null; }
            if (cleanURL) { URL.revokeObjectURL(cleanURL); cleanURL = null; }
            aiBtn.disabled = false; basicBtn.disabled = false;
            setStatus('Ready. "Remove silence (AI)" listens for your voice; "Basic cut" uses loudness only, with zero download.');
        });

        function showResult(res, noteText, fileName) {
            var wav = srEncodeWav(res.out);
            if (origURL) URL.revokeObjectURL(origURL);
            if (cleanURL) URL.revokeObjectURL(cleanURL);
            origURL = URL.createObjectURL(currentFile);
            cleanURL = URL.createObjectURL(wav);
            playerOrig.src = origURL;
            playerClean.src = cleanURL;
            dl.href = cleanURL; dl.download = fileName;
            outNote.textContent = noteText;
            var removedS = Math.max(0, res.removedS);
            summaryEl.textContent = res.gapCount > 0
                ? ('Removed ' + removedS.toFixed(1) + ' s of dead air across ' + res.gapCount + ' gap' + (res.gapCount === 1 ? '' : 's') + ' - on your device, nothing uploaded.')
                : 'No gaps longer than the chosen minimum were found - the output matches the original length.';
            outWrap.style.display = 'block';
        }

        // TIER 2: on-device RNNoise VAD over 480-sample frames @48k. The
        // engine's denoised output samples are DISCARDED - only the per-frame
        // voice probability drives the cut, so the kept audio is your
        // original, untouched.
        aiBtn.addEventListener('click', async function () {
            if (!currentFile) { setErr('Choose a recording first.'); return; }
            setErr(''); aiBtn.disabled = true; basicBtn.disabled = true;
            try {
                var mod = await srLoadEngine(setStatus);
                var dec = await srDecodeTo48kMono(currentFile, setStatus);
                var pcm = dec.pcm;
                setStatus('Listening for your voice on your device (nothing is uploaded) ...');
                await new Promise(function (r) { setTimeout(r, 30); }); // let the status paint
                var state = mod._rnnoise_create(0);
                if (!state) throw new Error('could not initialise the engine');
                var inPtr = mod._malloc(SR_FRAME * 4);
                var outPtr = mod._malloc(SR_FRAME * 4);
                var nFrames = Math.floor(pcm.length / SR_FRAME);
                var vad = new Float32Array(nFrames);
                var frame = new Float32Array(SR_FRAME);
                var k;
                try {
                    // Warm-up: pre-feed ~0.3 s once so the noise estimate has
                    // adapted before the real pass (probe-measured).
                    var warmN = Math.min(SR_WARMUP_FRAMES * SR_FRAME, pcm.length - (pcm.length % SR_FRAME));
                    for (var w = 0; w + SR_FRAME <= warmN; w += SR_FRAME) {
                        for (k = 0; k < SR_FRAME; k++) frame[k] = pcm[w + k] * 32768;
                        mod.HEAPF32.set(frame, inPtr >> 2);
                        mod._rnnoise_process_frame(state, outPtr, inPtr);
                    }
                    var lastYield = Date.now();
                    for (var f = 0; f < nFrames; f++) {
                        var off = f * SR_FRAME;
                        for (k = 0; k < SR_FRAME; k++) frame[k] = pcm[off + k] * 32768;
                        mod.HEAPF32.set(frame, inPtr >> 2);
                        vad[f] = mod._rnnoise_process_frame(state, outPtr, inPtr);
                        if (Date.now() - lastYield > 250) {   // keep the tab responsive
                            setStatus('Listening for your voice ... ' + Math.round(100 * f / nFrames) + '%');
                            await new Promise(function (r) { setTimeout(r, 0); });
                            lastYield = Date.now();
                        }
                    }
                } finally {
                    mod._free(inPtr); mod._free(outPtr); mod._rnnoise_destroy(state);
                }
                // Hang-over smoothing (moving max over 3 frames) bridges the
                // syllable troughs inside continuous speech - probe-measured.
                var voiced = new Array(nFrames);
                for (var f2 = 0; f2 < nFrames; f2++) {
                    var v = vad[f2];
                    if (f2 >= 1 && vad[f2 - 1] > v) v = vad[f2 - 1];
                    if (f2 >= 2 && vad[f2 - 2] > v) v = vad[f2 - 2];
                    voiced[f2] = v >= 0.5;
                }
                var res = srCutFromFlags(pcm, voiced, parseFloat(minGapEl.value) || 0.5);
                if (res.out.length === 0) {
                    setErr('No speech was detected in this recording - nothing to keep. If this is music or very quiet speech, try the "Basic cut" button instead.');
                    setStatus('');
                } else {
                    showResult(res, '(AI voice detection)', 'silence-removed.wav');
                    setStatus('Done - compare the two players, then download. Everything ran in your browser; nothing was uploaded.');
                }
            } catch (err) {
                setErr('Could not run the AI pass: ' + (err && err.message ? err.message : String(err)) + '. The "Basic cut (no download)" path still works.');
                setStatus('');
            } finally { aiBtn.disabled = false; basicBtn.disabled = false; }
        });

        // TIER 3 (deterministic, zero network): frame RMS loudness vs a
        // threshold derived from the quietest 10% of frames; same cutting
        // logic as the AI tier.
        basicBtn.addEventListener('click', async function () {
            if (!currentFile) { setErr('Choose a recording first.'); return; }
            setErr(''); aiBtn.disabled = true; basicBtn.disabled = true;
            try {
                var dec = await srDecodeTo48kMono(currentFile, setStatus);
                var pcm = dec.pcm;
                setStatus('Finding quiet stretches by loudness (no download) ...');
                var nFrames = Math.floor(pcm.length / SR_FRAME);
                var rmsArr = new Float32Array(nFrames);
                for (var i = 0; i < nFrames; i++) rmsArr[i] = srRms(pcm, i * SR_FRAME, (i + 1) * SR_FRAME);
                var sorted = Array.prototype.slice.call(rmsArr).sort(function (a, b) { return a - b; });
                var floorRms = sorted[Math.max(0, Math.floor(sorted.length * 0.1) - 1)] || 0;
                var thresh = Math.max(floorRms * 3, 1e-4);
                var voiced = new Array(nFrames);
                for (var f = 0; f < nFrames; f++) voiced[f] = rmsArr[f] >= thresh;
                var res = srCutFromFlags(pcm, voiced, parseFloat(minGapEl.value) || 0.5);
                if (res.out.length === 0) {
                    setErr('The whole recording sits at one loudness level - nothing stood out as a pause to cut.');
                    setStatus('');
                } else {
                    showResult(res, '(basic loudness cut - the AI button hears breathy or quiet speech that this path may clip)', 'silence-removed-basic.wav');
                    setStatus('Basic cut done - instant, no download, nothing uploaded. Try the AI button for voice-aware detection.');
                }
            } catch (err) {
                setErr('Could not process that file: ' + (err && err.message ? err.message : String(err)));
                setStatus('');
            } finally { aiBtn.disabled = false; basicBtn.disabled = false; }
        });
    }
</script>

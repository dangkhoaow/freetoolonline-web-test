<script>
    // 3D scene archetype skeleton (Psyche Metal Asteroid) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side.
    // Forked from the hayabusa2-ryugu-sample-return mission-milestone shape -
    // ONE scene only. All geometry is procedural (a noise-displaced ellipsoid
    // standing in for metal-rich asteroid 16 Psyche + a small winged spacecraft
    // marker + a Mars marker + concentric orbit-tier rings).
    //
    // EDUCATIONAL APPROXIMATION, not a shape-accurate reconstruction of Psyche
    // or a physically simulated trajectory/orbit. A teaching scene: NASA's real
    // Psyche mission-milestone sequence, replayed as discrete waypoints; once
    // the spacecraft is shown as arrived, it circles Psyche on a stylized ring
    // whose radius shrinks with each later milestone (representing the real
    // multi-orbit science campaign) - never a physically simulated orbit.
    //
    // Published figures (cross-checked via WebSearch/WebFetch 2026-08-01;
    // sources: NASA (nasa.gov/missions/psyche-mission), NASA Science mission
    // blog (science.nasa.gov/blogs/psyche), JPL press kit
    // (jpl.nasa.gov/press-kits/psyche/mission), Wikipedia "16 Psyche" citing
    // Ferrais et al. 2020, Vernazza et al. 2021, Shepard et al. 2017/2021,
    // Elkins-Tanton et al. 2020, and JPL Small-Body Database):
    //   - Launched 2023-10-13 14:19 UTC on a Falcon Heavy from NASA's Kennedy
    //     Space Center, LC-39A. Solar-electric propulsion: four SPT-140
    //     Hall-effect thrusters, up to 4.5 kW, about 922 kg of xenon propellant.
    //   - Mars gravity-assist flyby 2026-05-15: closest approach about 4,609 km
    //     (2,864 mi) above the Martian surface; the flyby added about 1,000 mph
    //     to the spacecraft's speed and bent its orbital plane about 1 degree
    //     relative to the Sun, without spending propellant.
    //   - Asteroid gravity capture expected late July 2029; science operations
    //     begin August 2029, after a roughly six-year, about 2.2-billion-mile
    //     (3.6-billion-km) cruise.
    //   - Asteroid 16 Psyche: triaxial dimensions about 278 x 232 x 164 km
    //     (Ferrais et al. 2020); NASA/JPL describes it as about 173 miles
    //     (280 km) across at its widest point; mean diameter about 222 +/- 3 km
    //     (Vernazza et al. 2021; Shepard et al. 2021; Ferrais et al. 2020);
    //     bulk density about 3.98 g/cm3 (Vernazza et al. 2021; Elkins-Tanton et
    //     al. 2020) - well below solid iron-nickel metal (about 8 g/cm3), one
    //     reason scientists think Psyche is a porous mix of metal and rock, not
    //     one solid metal ball; orbits the Sun at about 2.92 AU (437 million km)
    //     on average, orbital period about 4.998 years (1825.6 days); rotation
    //     period about 4.196 hours (Shepard et al. 2017, 2021).
    //   - Science campaign: at least 26 months of progressively different
    //     orbits, using the ion thrusters to change altitude while the imager,
    //     magnetometer, and gamma-ray/neutron spectrometer map the asteroid's
    //     shape, gravity field, and surface composition.
    //   - Planned mission end: 2031-10-31 (JPL press kit).
    //   - Distinct from dart-asteroid-deflection.html (a kinetic-impact
    //     deflection test on Dimorphos, no orbit), hayabusa2-ryugu-sample-return.html
    //     (a sample-RETURN mission at a C-type carbon asteroid, not an orbiter),
    //     and vesta-rheasilvia.html (a surface feature on a different, rocky
    //     asteroid) - THIS page is specifically the real Psyche orbiter mission
    //     at a metal-rich asteroid, from launch through its planned 2031 end.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'psychemetalasteroid';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'psychemetalasteroid'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published Psyche mission-milestone figures (NASA / NASA Science /
    // JPL press kit / Wikipedia "16 Psyche" citing Ferrais et al. 2020,
    // Vernazza et al. 2021, Shepard et al. 2017/2021, Elkins-Tanton et al.
    // 2020, JPL Small-Body Database - cross-checked via WebSearch/WebFetch
    // 2026-08-01). Each waypoint is a discrete, citable milestone - never an
    // interpolated "current position" claim. orbiting:true milestones circle
    // Psyche on a stylized ring at orbitRadius (shrinking with each later
    // milestone) rather than sitting at one fixed point - a stand-in for the
    // real multi-orbit science campaign, not a simulated orbit.
    var T3D_PSYCHE_WAYPOINTS = [
        { date: '2023-10-13', name: 'Launch from Kennedy Space Center', orbiting: false,
          fact: 'Psyche launched on a Falcon Heavy from NASA\'s Kennedy Space Center (LC-39A), beginning its cruise to metal-rich asteroid 16 Psyche on a solar-electric propulsion system - four SPT-140 Hall-effect thrusters drawing up to 4.5 kW, carrying about 922 kg of xenon propellant.' },
        { date: '2026-05-15', name: 'Mars Gravity-Assist Flyby', orbiting: false,
          fact: 'Psyche flew past Mars at a closest approach of about 4,609 km (2,864 mi) above the surface. The flyby\'s gravity assist added about 1,000 mph to the spacecraft\'s speed and bent its orbital plane about 1 degree relative to the Sun - without spending any propellant.' },
        { date: '2029-08', name: 'Arrival - Orbit Capture at Psyche', orbiting: true, orbitRadius: 9.5,
          fact: 'After a roughly six-year, about 2.2-billion-mile (3.6-billion-km) cruise, Psyche\'s gravity is expected to capture the spacecraft in late July 2029, with science operations beginning in August 2029. Asteroid 16 Psyche measures about 278 by 232 by 164 km (mean diameter about 222 km) and rotates once roughly every 4.2 hours.' },
        { date: '2029-2031', name: 'Orbital Science Campaign', orbiting: true, orbitRadius: 6.5,
          fact: 'Over at least 26 months, the spacecraft moves through a series of progressively different science orbits, using its ion thrusters to change altitude while its imager, magnetometer, and gamma-ray/neutron spectrometer map the asteroid\'s shape, gravity field, and surface composition.' },
        { date: '2031-10-31', name: 'Planned Mission End', orbiting: true, orbitRadius: 4.5,
          fact: 'NASA\'s mission plan calls for the science campaign around Psyche to conclude on 2031-10-31. Psyche\'s bulk density, about 3.98 g/cm3, is far below solid iron-nickel metal (about 8 g/cm3) - one reason scientists think Psyche is a porous mix of metal and rock, not one solid metal ball.' }
    ];

    function t3dPsycheAsteroid(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x05060a, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var sunLight = new THREE.DirectionalLight(0xfff2df, 1.2);
        sunLight.position.set(14, 9, 7);
        scene.add(sunLight);

        // Deep-space starfield backdrop.
        var starN = shell.low ? 200 : 420;
        var starPos = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r = 70 + Math.random() * 60;
            var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r * Math.sin(ph) * Math.cos(th);
            starPos[s * 3 + 1] = r * Math.cos(ph);
            starPos[s * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xdfe6ff, size: 0.3, sizeAttenuation: true, transparent: true, opacity: 0.55 })));

        // Psyche - a noise-displaced ellipsoid ("potato" asteroid shape). The
        // x:y:z extents (5.0 : 2.95 : 4.18 scene units) keep the real triaxial
        // ratio of about 278:164:232 km; per-vertex jitter breaks up the
        // perfect ellipsoid into an irregular body. Never a precise shape
        // model of 16 Psyche - an illustrative "metal-rich irregular asteroid"
        // approximation. Rotates about its short (164 km) axis.
        var psycheGeo = new THREE.IcosahedronGeometry(5, 2);
        psycheGeo.scale(1.0, 0.59, 0.835);
        var posAttr = psycheGeo.attributes.position;
        for (var vi = 0; vi < posAttr.count; vi++) {
            var vx = posAttr.getX(vi), vy = posAttr.getY(vi), vz = posAttr.getZ(vi);
            var jitter = 0.88 + Math.random() * 0.24;
            posAttr.setXYZ(vi, vx * jitter, vy * jitter, vz * jitter);
        }
        posAttr.needsUpdate = true;
        psycheGeo.computeVertexNormals();
        var psycheGroup = new THREE.Group();
        var psyche = new THREE.Mesh(psycheGeo, new THREE.MeshStandardMaterial({ color: 0x9a9a9e, roughness: 0.55, metalness: 0.55, flatShading: true }));
        psycheGroup.add(psyche);
        scene.add(psycheGroup);

        // Mars marker along the cruise route (small, not-to-scale reference
        // point for the flyby milestone - never a to-scale Mars).
        var marsMarker = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 12), new THREE.MeshStandardMaterial({ color: 0xb1543a, roughness: 0.85, metalness: 0.05 }));
        marsMarker.position.set(-16, 10, -20);
        scene.add(marsMarker);

        // Cruise route: launch -> Mars flyby -> hover above Psyche before
        // orbit capture. A continuous procedural path; fixed waypoint markers
        // sit at the two pre-arrival stops.
        var routePoints = [
            new THREE.Vector3(-42, 20, -30),  // launch / cruise
            new THREE.Vector3(-16, 10, -20),  // Mars flyby (co-located with marsMarker)
            new THREE.Vector3(0, 11, 9)       // approach, hovering above Psyche before capture
        ];
        var routeCurve = new THREE.CatmullRomCurve3(routePoints);
        var routeGeo = new THREE.BufferGeometry().setFromPoints(routeCurve.getPoints(120));
        scene.add(new THREE.Line(routeGeo, new THREE.LineBasicMaterial({ color: 0x64b5f6, transparent: true, opacity: 0.75 })));

        var waypointMarkers = [];
        for (var w = 0; w < routePoints.length; w++) {
            var m = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), new THREE.MeshBasicMaterial({ color: 0x546e7a }));
            m.position.copy(routePoints[w]);
            scene.add(m);
            waypointMarkers.push(m);
        }

        // Concentric orbit-tier rings around Psyche - a stylized stand-in for
        // the real multi-orbit science campaign (shrinking altitude), never a
        // simulated orbital path. The active tier's ring is brighter.
        var orbitTierRadii = [9.5, 6.5, 4.5];
        var orbitRings = [];
        for (var ot = 0; ot < orbitTierRadii.length; ot++) {
            var ringPts = [];
            var rr = orbitTierRadii[ot];
            for (var rp = 0; rp <= 64; rp++) {
                var ang = (rp / 64) * Math.PI * 2;
                ringPts.push(new THREE.Vector3(rr * Math.cos(ang), 1.6 * Math.sin(ang * 0.5 + 0.6), rr * Math.sin(ang)));
            }
            var ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
            var ringLine = new THREE.LineLoop(ringGeo, new THREE.LineBasicMaterial({ color: 0x64b5f6, transparent: true, opacity: 0.18 }));
            scene.add(ringLine);
            orbitRings.push(ringLine);
        }

        // Spacecraft marker (small procedural body: bus + two solar-panel
        // wings, standing in for the Psyche spacecraft's large solar arrays).
        var craftGroup = new THREE.Group();
        var bus = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0.4, metalness: 0.35 }));
        craftGroup.add(bus);
        var panelMat = new THREE.MeshStandardMaterial({ color: 0x1a237e, roughness: 0.5, metalness: 0.2 });
        var panelL = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.05, 0.55), panelMat);
        panelL.position.x = -1.3;
        craftGroup.add(panelL);
        var panelR = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.05, 0.55), panelMat);
        panelR.position.x = 1.3;
        craftGroup.add(panelR);
        scene.add(craftGroup);

        var beacon = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 12), new THREE.MeshBasicMaterial({ color: 0x64b5f6, transparent: true, opacity: 0.22 }));
        scene.add(beacon);

        var waypointIndex = 0; // 0..T3D_PSYCHE_WAYPOINTS.length-1
        var craftOrbitAngle = 0.6;

        function panelHtml() {
            var wp = T3D_PSYCHE_WAYPOINTS[waypointIndex];
            var rows = '';
            for (var i = 0; i < T3D_PSYCHE_WAYPOINTS.length; i++) {
                var w2 = T3D_PSYCHE_WAYPOINTS[i];
                rows += '<tr' + (i === waypointIndex ? ' style="background:#fff3cd;"' : '') + '>' +
                    '<td>' + w2.date + '</td>' +
                    '<td>' + w2.name + '</td>' +
                    '</tr>';
            }
            return '<h3>Mission milestone ' + (waypointIndex + 1) + ' of ' + T3D_PSYCHE_WAYPOINTS.length + '</h3>' +
                '<p><b>' + wp.name + '</b> (' + wp.date + ')</p>' +
                '<p>' + wp.fact + '</p>' +
                '<div class="w3-responsive"><table class="w3-table w3-bordered w3-small">' +
                '<tr><th>Date</th><th>Milestone</th></tr>' + rows + '</table></div>' +
                '<p class="t3d-note">Educational approximation - Psyche\'s body shape and the spacecraft\'s route/orbit rings are procedural, not a precise shape model or a physically simulated flight path or orbit. Every date and figure cited is real and independently published (NASA / NASA Science / JPL press kit / Vernazza et al. 2021 / Ferrais et al. 2020 / Shepard et al. 2017,2021); this scene never claims a live or real-time spacecraft position.</p>';
        }

        var idxEl = document.getElementById('t3dPsycheScrub');
        var idxLab = document.getElementById('t3dPsycheLabel');

        function apply() {
            var wp = T3D_PSYCHE_WAYPOINTS[waypointIndex];
            if (!wp.orbiting) {
                var pos = routePoints[waypointIndex];
                craftGroup.position.copy(pos);
                beacon.position.copy(pos);
            }
            for (var i = 0; i < waypointMarkers.length; i++) {
                waypointMarkers[i].material.color.setHex(i <= Math.min(waypointIndex, waypointMarkers.length - 1) ? 0x64b5f6 : 0x546e7a);
            }
            for (var r = 0; r < orbitRings.length; r++) {
                var isActive = wp.orbiting && Math.abs(orbitTierRadii[r] - wp.orbitRadius) < 0.01;
                orbitRings[r].material.opacity = isActive ? 0.65 : 0.14;
            }
            if (idxLab) idxLab.textContent = wp.name + ' (' + wp.date + ')';
            t3dInfo(panelHtml());
            try { t3dSaveStore({ waypointIndex: waypointIndex }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.waypointIndex === 'number' && store.waypointIndex >= 0 && store.waypointIndex < T3D_PSYCHE_WAYPOINTS.length) {
            waypointIndex = store.waypointIndex;
        }
        if (idxEl) idxEl.value = String(waypointIndex);
        apply();

        if (idxEl) idxEl.addEventListener('input', function () {
            waypointIndex = Math.max(0, Math.min(T3D_PSYCHE_WAYPOINTS.length - 1, parseInt(idxEl.value || '0', 10)));
            apply();
        });

        t3dStatus('Drag to orbit, scroll to zoom. Scrub the mission-milestone slider to move the spacecraft along its real trajectory.');
        return function animate(dt) {
            psycheGroup.rotation.y += dt * 0.00022; // stands in for Psyche's ~4.2h rotation, sped up for a visible spin
            beacon.scale.setScalar(1 + 0.08 * Math.sin(performance.now() * 0.0025));
            var wp = T3D_PSYCHE_WAYPOINTS[waypointIndex];
            if (wp.orbiting) {
                craftOrbitAngle += dt * 0.00055;
                var rad = wp.orbitRadius;
                var cx = rad * Math.cos(craftOrbitAngle), cz = rad * Math.sin(craftOrbitAngle);
                var cy = 1.6 * Math.sin(craftOrbitAngle * 0.5 + 0.6);
                craftGroup.position.set(cx, cy, cz);
                craftGroup.rotation.y = -craftOrbitAngle;
                beacon.position.copy(craftGroup.position);
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { psychemetalasteroid: 't3dPsycheControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { psychemetalasteroid: { radius: 32, maxR: 120, minR: 6, phi: 1.05, theta: 0.6, targetY: 3 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dPsycheAsteroid(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

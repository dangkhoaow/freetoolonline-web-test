<script>
    // 3D scene archetype skeleton (serengeti-plains) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (serengeti-plains).
    // All geometry is procedural. places-3d-discovery-loop-runbook, 2026-08-28.
    //
    // EDUCATIONAL APPROXIMATION, not survey geography. The plain, kopjes,
    // grass-color seasonality, and migration trail are exaggerated schematic
    // teaching cues. Published figures (encyclopedic / UNESCO consensus,
    // cross-checked 2026-08-28):
    //   - Serengeti National Park covers about 14,750 sq km
    //   - The greater Serengeti ecosystem spans roughly 30,000 sq km across
    //     Tanzania and Kenya (into the Maasai Mara)
    //   - Plains sit at an average elevation of roughly 1,500-1,850 m
    //   - The Great Migration moves about 1.5 million wildebeest plus
    //     hundreds of thousands of zebra and gazelle in a roughly circular
    //     annual route following the rains
    //   - Designated a national park in 1951; a UNESCO World Heritage Site
    //     (natural) since 1981
    //   - The granite kopjes scattered across the plains are ancient
    //     Precambrian rock outcrops, among the oldest exposed rock in the
    //     region
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'serengeti-plains';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesserengetiplains'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0e1420, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        var key = new THREE.DirectionalLight(0xfff3d6, 1.05);
        key.position.set(-10, 18, 9);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }

        // The signature figure: an almost-flat plain (very low-amplitude
        // rolling grass, no valley/crater/ridge dominating the frame) with a
        // handful of ancient granite kopjes - rounded rock domes - rising
        // abruptly from the grass at fixed positions, each with its own
        // radius/height so the field reads as scattered outcrops rather than
        // one dominant peak. A new places-3d terrain archetype: near-zero
        // relief grassland punctuated by isolated domes, distinct from every
        // valley/crater/cliff/dune/chamber shipped so far. 1 unit ~= 220 m;
        // W = east-west, D = north-south.
        var W = 26, D = 22;
        var KOPJES = [
            { x: -6.2, z: -4.0, r: 1.9, h: 1.55 },
            { x: 3.4, z: -6.5, r: 1.3, h: 1.05 },
            { x: 7.8, z: 1.8, r: 2.2, h: 1.85 },
            { x: -1.5, z: 5.5, r: 1.6, h: 1.35 },
            { x: -8.5, z: 3.2, r: 1.05, h: 0.85 },
            { x: 2.0, z: 7.6, r: 0.95, h: 0.75 }
        ];
        function kopjeBump(x, z) {
            var s = 0;
            for (var i = 0; i < KOPJES.length; i++) {
                var k = KOPJES[i];
                var dx = x - k.x, dz = z - k.z;
                var d2 = dx * dx + dz * dz;
                var rr = k.r * k.r;
                s += k.h * Math.exp(-d2 / (rr * 0.9));
            }
            return s;
        }
        function kopjeMask(x, z) {
            // 1 where a kopje dominates the surface (rock), 0 on open grass -
            // sharper falloff than the bump itself so the rock reads as a
            // distinct dome rather than a smooth hill blending into grass.
            var m = 0;
            for (var i = 0; i < KOPJES.length; i++) {
                var k = KOPJES[i];
                var dx = x - k.x, dz = z - k.z;
                var d = Math.sqrt(dx * dx + dz * dz);
                var t = smooth(k.r * 1.05, k.r * 0.6, d);
                if (t > m) m = t;
            }
            return m;
        }
        function height(x, z) {
            var grassRoll = 0.09 * fbm(x * 0.55 + 3, z * 0.55 + 6, 4);
            return grassRoll + kopjeBump(x, z);
        }
        var colGrassDry = new THREE.Color(0xc7a94f), colGrassDry2 = new THREE.Color(0xa8862f);
        var colGrassWet = new THREE.Color(0x6f9c3e), colGrassWet2 = new THREE.Color(0x4d7a2a);
        var colRock = new THREE.Color(0x9c9186), colRockShade = new THREE.Color(0x6d6459), colRockLichen = new THREE.Color(0x8a8f6a);
        function colorSeason(c, h, x, z, wet) {
            var n = 0.9 + 0.2 * fbm(x * 1.6 + 20, z * 1.6 + 14, 3);
            var mask = kopjeMask(x, z);
            if (mask > 0.5) {
                var shade = smooth(0.3, 1.7, h);
                c.copy(colRock).lerp(colRockShade, shade);
                var lichen = Math.max(0, fbm(x * 2.2 + 40, z * 2.2 + 33, 3) - 0.35) * 1.4;
                c.lerp(colRockLichen, Math.min(0.5, lichen));
                c.multiplyScalar(n);
                return;
            }
            var patch = 0.5 + 0.5 * fbm(x * 0.35 + 8, z * 0.35 + 5, 3);
            if (wet) { c.copy(colGrassWet).lerp(colGrassWet2, 1 - patch); }
            else { c.copy(colGrassDry).lerp(colGrassDry2, 1 - patch); }
            c.multiplyScalar(n);
        }

        var segW = shell.low ? 100 : 150, segD = shell.low ? 84 : 128;
        var geo = new THREE.PlaneGeometry(W, D, segW, segD);
        geo.rotateX(-Math.PI / 2);
        var pos = geo.attributes.position;
        var count = pos.count;
        var colorsDry = new Float32Array(count * 3);
        var colorsWet = new Float32Array(count * 3);
        var col = new THREE.Color();
        for (var i = 0; i < count; i++) {
            var x = pos.getX(i), z = pos.getZ(i);
            var h = height(x, z);
            pos.setY(i, h);
            colorSeason(col, h, x, z, false);
            colorsDry[i * 3] = col.r; colorsDry[i * 3 + 1] = col.g; colorsDry[i * 3 + 2] = col.b;
            colorSeason(col, h, x, z, true);
            colorsWet[i * 3] = col.r; colorsWet[i * 3 + 1] = col.g; colorsWet[i * 3 + 2] = col.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colorsDry.slice(), 3));
        geo.computeVertexNormals();
        var terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 }));
        scene.add(terrain);

        // Scattered acacia markers near a couple of kopjes - simple
        // cone-canopy + cylinder-trunk decor, static (not a toggle), giving
        // the plain a recognizable savanna silhouette without adding
        // geometry-rebuild cost.
        var acaciaGroup = new THREE.Group();
        var trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.95 });
        var canopyMat = new THREE.MeshStandardMaterial({ color: 0x4f6a2c, roughness: 0.85 });
        var ACACIA = [{ x: -4.0, z: -1.5 }, { x: 5.5, z: 3.5 }, { x: -3.0, z: 2.6 }];
        for (var a = 0; a < ACACIA.length; a++) {
            var ax = ACACIA[a].x, az = ACACIA[a].z;
            var ay = height(ax, az);
            var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, 0.5, 6), trunkMat);
            trunk.position.set(ax, ay + 0.25, az);
            acaciaGroup.add(trunk);
            var canopy = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.16, 8), canopyMat);
            canopy.position.set(ax, ay + 0.55, az);
            acaciaGroup.add(canopy);
        }
        scene.add(acaciaGroup);

        // Migration trail marker: a curving tube path looping across the
        // plain between two kopje clusters, echoing the roughly circular
        // annual route the wildebeest migration follows across the wider
        // ecosystem (schematic, not a literal GPS track).
        var trailGroup = new THREE.Group();
        var trailMat = new THREE.MeshBasicMaterial({ color: 0xf2e2a8, transparent: true, opacity: 0.85 });
        var trailPts = [];
        var TN = 28;
        for (var tI = 0; tI <= TN; tI++) {
            var tt = (tI / TN) * Math.PI * 2;
            var tx = Math.cos(tt) * 9.5 + Math.sin(tt * 2) * 1.1;
            var tz = Math.sin(tt) * 7.4 - Math.cos(tt * 3) * 0.8;
            trailPts.push(new THREE.Vector3(tx, height(tx, tz) + 0.04, tz));
        }
        var trailCurve = new THREE.CatmullRomCurve3(trailPts, true);
        var trailMesh = new THREE.Mesh(new THREE.TubeGeometry(trailCurve, 90, 0.06, 6, true), trailMat);
        trailGroup.add(trailMesh);
        scene.add(trailGroup);

        var wetSeason = false, trailOn = true;

        function panelHtml() {
            return '<h3>Serengeti Plains: endless savanna</h3>' +
                '<p>Flat grassland broken by ancient granite kopjes, home to the wildebeest Great Migration - toggle the dry/wet season grass color and the migration trail marker.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Park area</td><td>about 14,750 sq km (Serengeti National Park)</td></tr>' +
                '<tr><td>Ecosystem area</td><td>roughly 30,000 sq km across Tanzania and Kenya</td></tr>' +
                '<tr><td>Great Migration</td><td>about 1.5 million wildebeest plus hundreds of thousands of zebra and gazelle</td></tr>' +
                '<tr><td>Elevation</td><td>plains average roughly 1,500-1,850 m</td></tr>' +
                '<tr><td>National park since</td><td>1951</td></tr>' +
                '<tr><td>Heritage status</td><td>UNESCO World Heritage Site (natural) since 1981</td></tr>' +
                '<tr><td>Kopjes</td><td>ancient Precambrian granite outcrops, among the oldest exposed rock in the region</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the plain, kopjes, grass-color seasonality, and migration trail are schematic teaching cues, not survey data.</p>';
        }

        function apply() {
            geo.attributes.color.array.set(wetSeason ? colorsWet : colorsDry);
            geo.attributes.color.needsUpdate = true;
            var sb = document.getElementById('t3dSerSeasonBtn');
            if (sb) sb.textContent = 'Season: ' + (wetSeason ? 'Wet (green)' : 'Dry (golden)');
            key.color.set(wetSeason ? 0xeaf3ff : 0xfff3d6);
            key.intensity = wetSeason ? 0.95 : 1.05;
            trailGroup.visible = trailOn;
            var tb = document.getElementById('t3dSerTrailBtn');
            if (tb) tb.textContent = 'Migration trail: ' + (trailOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ wetSeason: wetSeason, trailOn: trailOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.wetSeason === 'boolean') wetSeason = store.wetSeason;
        if (typeof store.trailOn === 'boolean') trailOn = store.trailOn;
        apply();

        var seasonBtn = document.getElementById('t3dSerSeasonBtn');
        if (seasonBtn) seasonBtn.addEventListener('click', function () { wetSeason = !wetSeason; apply(); });
        var trailBtn = document.getElementById('t3dSerTrailBtn');
        if (trailBtn) trailBtn.addEventListener('click', function () { trailOn = !trailOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the season grass color or the migration trail marker.');
        var t = 0;
        return function animate(dt) {
            t += dt * 0.001;
            scene.rotation.y += dt * 0.00003;
            if (trailGroup.visible) {
                trailMat.opacity = 0.65 + 0.2 * Math.sin(t * 2.2);
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesserengetiplains: 't3dSerControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesserengetiplains: { radius: 22, maxR: 60, minR: 5, phi: 1.02, theta: 0.7, targetY: 0.3 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

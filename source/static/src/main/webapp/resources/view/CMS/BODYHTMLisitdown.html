<div class="w3-container">
    <p>Type a website address and this page probes it directly from your own browser - no third-party service - so you can tell in seconds whether the site is down or something on your side blocks it.</p>
</div>

<div id="isItDownTool" class="w3-container outputImgs" style="visibility:visible !important; min-height:200px; padding:16px 0;">
    <noscript>This tool runs in your browser and needs JavaScript enabled.</noscript>
    <div style="font-weight:bold;">Check any website from your device</div>
    <div class="w3-row" style="margin:8px 0 10px;">
        <input id="iidInput" class="w3-input w3-border" style="display:inline-block;width:280px;" placeholder="Website address (e.g. example.com)" aria-label="Website address to check">
        <button type="button" id="iidBtn" class="w3-button w3-red">Check</button>
    </div>
    <div id="iidStatus" aria-live="polite" style="min-height:1.2em;color:#555;"></div>
    <div id="iidResult"></div>
    <div style="font-weight:bold;margin-top:16px;">Popular sites - quick check from your device</div>
    <div id="iidPresets" class="w3-row" style="margin:8px 0 14px;"></div>
    <div style="margin-top:16px;">
        <div style="font-weight:bold;">How to read the results</div>
        <div id="iidExplainer"></div>
    </div>
</div>

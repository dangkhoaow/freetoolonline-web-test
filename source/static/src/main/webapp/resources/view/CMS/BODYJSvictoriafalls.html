<script>
    // 3D scene archetype skeleton (victoria-falls) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (victoria-falls).
    // All geometry is procedural. places-3d-discovery-loop-runbook, 2026-08-27.
    //
    // EDUCATIONAL APPROXIMATION, not survey hydrology. Vertical relief and the
    // gorge zigzag are exaggerated for visibility.
    // Published figures (encyclopedic / UNESCO consensus, cross-checked 2026-08-27):
    //   - Width about 1,708 m - one of the widest continuous curtains of
    //     falling water in the world
    //   - Height about 108 m - roughly twice Niagara Falls' height
    //   - On the Zambezi River, border of Zambia and Zimbabwe
    //   - Local name Mosi-oa-Tunya, "The Smoke That Thunders"
    //   - Spray visible up to about 30 km away at peak flood (around April)
    //   - Plunges into the Batoka Gorge, a zigzagging basalt canyon carved by
    //     the river cutting backward over geologic time
    //   - Flow is strongly seasonal: peak flood can exceed about 500 million
    //     litres per minute; in the dry season (Sept-Dec) some channels on the
    //     basalt lip nearly stop flowing, exposing rock islands
    //   - Mosi-oa-Tunya / Victoria Falls National Parks: UNESCO World
    //     Heritage Site since 1989
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'victoria-falls';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesvictoriafalls'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0a1220, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        var key = new THREE.DirectionalLight(0xfff2d0, 1.0);
        key.position.set(-10, 16, 8);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function triWave(t) { return (2 / Math.PI) * Math.asin(Math.sin(t)); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }));
        }

        // Basalt plateau, wide Zambezi channel above (z<0), the falls lip at
        // z=0, and the zigzagging Batoka Gorge below (z>0). 1 unit ~= 100 m
        // vertical (exaggerated for visibility); x = across-river, z = downstream.
        var PLATEAU = 0.15, GORGE_FLOOR = -1.05;
        function centerlineX(x, z) {
            if (z <= 0) return 0.4 * Math.sin(z * 0.4) + 0.5 * (fbm(z * 0.3 + 2, 1, 3) - 0.5);
            var amp = 2.6 * smooth(0, 3.5, z);
            return amp * triWave(z * 0.85 + 0.3);
        }
        function channelHalfWidth(z) {
            if (z <= -0.3) return 3.1;                                  // wide Zambezi above the lip
            if (z <= 0.15) return 3.1 - 2.1 * smooth(-0.3, 0.15, z);    // narrows sharply at the falls
            return 1.0 - 0.35 * smooth(0.15, 4.2, z);                   // Batoka Gorge stays narrow
        }
        function height(x, z) {
            var plateau = PLATEAU + 0.05 * (fbm(x * 0.55 + 4, z * 0.55 + 2, 4) - 0.5);
            var cx = centerlineX(x, z);
            var hw = channelHalfWidth(z);
            var d = Math.abs(x - cx) - hw;
            var insideAmt = Math.max(0, Math.min(1, 1 - smooth(0, 0.5, d)));
            if (z < -0.05) {
                return plateau - 0.16 * insideAmt; // shallow river bed groove above the lip
            }
            var floorNoise = GORGE_FLOOR + 0.08 * (fbm(x * 0.8 + 7, z * 0.8 + 9, 3) - 0.5);
            return plateau * (1 - insideAmt) + floorNoise * insideAmt;
        }
        var col = { rock: new THREE.Color(0x5b5147), plateau: new THREE.Color(0x8a7a5c), gorge: new THREE.Color(0x3a3630), water: new THREE.Color(0x27536b) };
        function color(c, h, x, z) {
            var n = 0.9 + 0.2 * fbm(x * 1.3 + 11, z * 1.3 + 7, 3);
            var cx = centerlineX(x, z), hw = channelHalfWidth(z);
            var d = Math.abs(x - cx) - hw;
            if (z > 0 && d < 0) c.copy(col.gorge).multiplyScalar(n);
            else if (z < 0 && d < 0.1) c.copy(col.water).multiplyScalar(n);
            else if (h > PLATEAU + 0.02) c.copy(col.rock).lerp(col.plateau, 0.5).multiplyScalar(n);
            else c.copy(col.plateau).multiplyScalar(n);
        }
        var terrain = makeTerrain(14, 20, shell.low ? 100 : 160, shell.low ? 150 : 230, height, color);
        scene.add(terrain);

        // The falls curtain: named sections across the ~1,708 m width, so the
        // dry/flood toggle can swap PRECOMPUTED visibility/opacity per section
        // instead of rebuilding geometry (render-quality contract).
        var SECTIONS = [
            { name: 'Devils Cataract', x: -2.55, w: 0.9 },
            { name: 'Main Falls', x: -1.35, w: 1.5 },
            { name: 'Horseshoe Falls', x: 0.05, w: 1.35 },
            { name: 'Rainbow Falls', x: 1.35, w: 1.55 },
            { name: 'Armchair / Danger Point', x: 2.55, w: 0.95 },
            { name: 'Eastern Cataract', x: 3.35, w: 0.8 },
        ];
        var curtainGroup = new THREE.Group();
        var curtainMeshes = [];
        for (var s = 0; s < SECTIONS.length; s++) {
            var sec = SECTIONS[s];
            var geo = new THREE.PlaneGeometry(sec.w * 0.94, 1.2, 1, 12);
            var mat = new THREE.MeshStandardMaterial({ color: 0xeaf4ff, transparent: true, opacity: 0.82, roughness: 0.25, metalness: 0.05, side: THREE.DoubleSide });
            var mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(sec.x, PLATEAU - 0.6, 0.02);
            curtainGroup.add(mesh);
            curtainMeshes.push({ mesh: mesh, sec: sec });
        }
        scene.add(curtainGroup);

        // Mist plume: several soft, semi-transparent discs stacked and offset
        // above the falls line - the "smoke" the local name describes.
        var mistGroup = new THREE.Group();
        for (var m = 0; m < 10; m++) {
            var mm = new THREE.Mesh(
                new THREE.SphereGeometry(0.55 + m * 0.14, 10, 8),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 - m * 0.006, depthWrite: false })
            );
            mm.position.set(0.3 * Math.sin(m * 1.3), PLATEAU + 0.3 + m * 0.28, -0.1 + 0.05 * Math.cos(m));
            mistGroup.add(mm);
        }
        scene.add(mistGroup);

        var mistOn = true, season = 'flood';

        function applySeason() {
            for (var i = 0; i < curtainMeshes.length; i++) {
                var dry = (season === 'dry') && (i === 0 || i === 5); // outer cataracts run low/dry first
                curtainMeshes[i].mesh.visible = !dry;
                curtainMeshes[i].mesh.material.opacity = dry ? 0 : (season === 'flood' ? 0.9 : 0.55);
                curtainMeshes[i].mesh.scale.y = season === 'flood' ? 1.0 : 0.6;
            }
        }

        function panelHtml() {
            return '<h3>Victoria Falls: the smoke that thunders</h3>' +
                '<p>The Zambezi River plunges over a basalt lip roughly 1,708 m wide into the zigzagging Batoka Gorge below - toggle the mist plume and the seasonal flow.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Width</td><td>about 1,708 m - one of the widest continuous curtains of falling water in the world</td></tr>' +
                '<tr><td>Height</td><td>about 108 m - roughly twice Niagara Falls</td></tr>' +
                '<tr><td>River / border</td><td>Zambezi River, between Zambia and Zimbabwe</td></tr>' +
                '<tr><td>Local name</td><td>Mosi-oa-Tunya, "The Smoke That Thunders"</td></tr>' +
                '<tr><td>Spray</td><td>visible up to about 30 km away at peak flood (around April)</td></tr>' +
                '<tr><td>Landform</td><td>plunges into the Batoka Gorge, a zigzag basalt canyon cut backward by the river over geologic time</td></tr>' +
                '<tr><td>Seasonality</td><td>peak flood can exceed about 500 million litres per minute; some dry-season channels nearly stop flowing</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the plateau, gorge zigzag, and curtain sections are schematic teaching cues, not survey data.</p>';
        }

        function apply() {
            mistGroup.visible = mistOn;
            var mb = document.getElementById('t3dVfaMistBtn');
            if (mb) mb.textContent = 'Mist plume: ' + (mistOn ? 'On' : 'Off');
            var sb = document.getElementById('t3dVfaSeasonBtn');
            if (sb) sb.textContent = 'Season: ' + (season === 'flood' ? 'Flood' : 'Dry');
            applySeason();
            t3dInfo(panelHtml());
            try { t3dSaveStore({ mistOn: mistOn, season: season }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.mistOn === 'boolean') mistOn = store.mistOn;
        if (typeof store.season === 'string') season = store.season;
        apply();

        var mistBtn = document.getElementById('t3dVfaMistBtn');
        if (mistBtn) mistBtn.addEventListener('click', function () { mistOn = !mistOn; apply(); });
        var seasonBtn = document.getElementById('t3dVfaSeasonBtn');
        if (seasonBtn) seasonBtn.addEventListener('click', function () { season = (season === 'flood') ? 'dry' : 'flood'; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the mist plume or the seasonal flow.');
        var t = 0;
        return function animate(dt) {
            t += dt * 0.001;
            scene.rotation.y += dt * 0.00004;
            if (mistGroup.visible) {
                for (var i = 0; i < mistGroup.children.length; i++) {
                    mistGroup.children[i].position.y += Math.sin(t + i) * 0.0006;
                }
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesvictoriafalls: 't3dVfaControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesvictoriafalls: { radius: 20, maxR: 55, minR: 6, phi: 0.62, theta: 0.35, targetY: -0.6 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

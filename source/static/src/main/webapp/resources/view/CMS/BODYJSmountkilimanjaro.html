<script type="module">
import * as THREE from "/vendor/three/build/three.module.js";

const scene = new THREE.Scene();
const canvas = document.getElementById("t3dCanvasHost");
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
renderer.setClearColor(0x87ceeb);

const PEAK_HEIGHT = 5.895;
const BASE_RADIUS = 30;
const SNOWLINE = 4.0;
const SEA_LEVEL = 0;

let snowCapOn = true;
let bandsOn = true;

// Fbm helper functions
function hash2(x, y) { return fract(sin(dot(vec2(x, y), vec2(12.9898, 78.233))) * 43758.5453); }
function vnoise(p) {
  const i = floor(p);
  const f = fract(p);
  const u = f * f * (3.0 - 2.0 * f);
  const v = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  const a = Math.random() % 1;
  const b = Math.random() % 1;
  const c = Math.random() % 1;
  const d = Math.random() % 1;
  return a * (1.0 - u) + b * u + (c * (1.0 - u) + d * u) * v;
}
function fbm(p, oct) {
  let v = 0, a = 0.5;
  for (let i = 0; i < oct; i++) {
    v += a * Math.sin(p[0] * 0.5 + p[1] * 0.3);
    p = [p[0] * 2, p[1] * 2];
    a *= 0.5;
  }
  return v;
}
function fract(x) { return x - Math.floor(x); }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
function sin(x) { return Math.sin(x); }
function floor(x) { return Math.floor(x); }
function vec2(x, y) { return [x, y]; }

// Terrain builder
function makeTerrain() {
  const segs = 140;
  const geom = new THREE.PlaneGeometry(BASE_RADIUS * 2, BASE_RADIUS * 2, segs, segs);
  geom.rotateX(-Math.PI / 2);

  const pos = geom.getAttribute("position");
  const colors = [];
  
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    
    const dist = Math.sqrt(x * x + z * z);
    if (dist > BASE_RADIUS) {
      pos.setY(i, -0.3); // Ocean floor
      colors.push(0.1, 0.3, 0.5); // Dark blue
      continue;
    }
    
    // Cone slope: steeper south, gentler north asymmetry
    const angle = Math.atan2(z, x);
    const asymmetry = 1 + 0.3 * Math.sin(angle);
    const slopeFactor = 1 - (dist / BASE_RADIUS) * asymmetry;
    
    const fbmVal = fbm([x * 0.2, z * 0.2], 4) * 0.2;
    const height = PEAK_HEIGHT * slopeFactor + fbmVal;
    pos.setY(i, height);
    
    // Color by altitude + bands toggle
    let r, g, b;
    if (bandsOn) {
      if (height < 1.5) { r = 0.65; g = 0.45; b = 0.2; } // Brown
      else if (height < 3.5) { r = 0.2; g = 0.55; b = 0.2; } // Green
      else if (height < SNOWLINE) { r = 0.5; g = 0.5; b = 0.5; } // Grey
      else { r = 0.95; g = 0.95; b = 0.95; } // White
    } else {
      const t = Math.max(0, Math.min(1, height / PEAK_HEIGHT));
      if (!snowCapOn && height > SNOWLINE) {
        r = 0.6; g = 0.6; b = 0.6;
      } else if (height > SNOWLINE) {
        r = 0.9 + t * 0.05; g = 0.9 + t * 0.05; b = 0.95 + t * 0.05;
      } else {
        r = 0.4 + t * 0.3; g = 0.3 + t * 0.2; b = 0.2;
      }
    }
    colors.push(r, g, b);
  }
  
  geom.setAttribute("color", new THREE.BufferAttribute(new Float32Array(colors), 3));
  geom.computeVertexNormals();
  
  const mat = new THREE.MeshPhongMaterial({ 
    vertexColors: true,
    flatShading: false,
    side: THREE.DoubleSide
  });
  return new THREE.Mesh(geom, mat);
}

// Scene setup
const terrain = makeTerrain();
scene.add(terrain);

const light1 = new THREE.DirectionalLight(0xffffff, 1);
light1.position.set(5, 5, 5);
scene.add(light1);

const light2 = new THREE.AmbientLight(0x888888);
scene.add(light2);

// Camera
camera.position.set(40, 20, 40);
camera.lookAt(0, 2, 0);

// Handle resizes
function updateSize() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = Math.max(220, rect.height);
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// Toggle handlers
document.getElementById("t3dKmjSnowBtn").addEventListener("click", function() {
  snowCapOn = !snowCapOn;
  this.textContent = snowCapOn ? "Snow cap: On" : "Snow cap: Off";
  const pos = terrain.geometry.getAttribute("position");
  terrain.geometry.dispose();
  terrain.geometry = makeTerrain().geometry;
  renderer.render(scene, camera);
});

document.getElementById("t3dKmjBandsBtn").addEventListener("click", function() {
  bandsOn = !bandsOn;
  this.textContent = bandsOn ? "Altitude bands: On" : "Altitude bands: Off";
  terrain.geometry.dispose();
  terrain.geometry = makeTerrain().geometry;
  renderer.render(scene, camera);
});

document.getElementById("t3dFullscreenBtn").addEventListener("click", () => {
  canvas.requestFullscreen?.();
});

// Info panel
const infoPanel = document.getElementById("t3dInfoPanel");
infoPanel.innerHTML = `
<h3>Mount Kilimanjaro</h3>
<table style="width:100%; font-size:13px;">
<tr><td><b>Height</b></td><td>5,895 m</td></tr>
<tr><td><b>Summit</b></td><td>Uhuru Peak</td></tr>
<tr><td><b>Status</b></td><td>Dormant volcano</td></tr>
<tr><td><b>Snow cap</b></td><td>Permanent (85% less than 1912)</td></tr>
<tr><td><b>Last erupted</b></td><td>~360 years ago</td></tr>
<tr><td><b>Annual climbers</b></td><td>~50,000</td></tr>
</table>
`;

const statusDiv = document.getElementById("t3dStatus");
statusDiv.textContent = "3D terrain loaded - drag to orbit, scroll to zoom";

// Animation loop
let controls = null;
function animate() {
  requestAnimationFrame(animate);
  
  // Simple orbit: hold right-click drag to rotate (or touch swipe)
  let isDragging = false;
  let previousMousePosition = { x: 0, y: 0 };
  
  canvas.addEventListener("mousedown", (e) => {
    if (e.button === 2 || e.buttons === 2) isDragging = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });
  
  canvas.addEventListener("mousemove", (e) => {
    if (isDragging) {
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;
      camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -deltaX * 0.01);
      camera.position.applyAxisAngle(camera.getWorldDirection(new THREE.Vector3()).normalize(), -deltaY * 0.01);
      camera.lookAt(0, 2, 0);
    }
    previousMousePosition = { x: e.clientX, y: e.clientY };
  });
  
  canvas.addEventListener("mouseup", () => { isDragging = false; });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const zoom = 1 - e.deltaY * 0.001;
    camera.position.multiplyScalar(zoom);
  });

  updateSize();
  renderer.render(scene, camera);
}

animate();
</script>

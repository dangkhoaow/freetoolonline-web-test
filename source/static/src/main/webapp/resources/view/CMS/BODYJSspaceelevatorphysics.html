<script>
    // 3D scene archetype skeleton (Space Elevator Physics Explorer) - vendored
    // three.js (ESM, dynamic import from /vendor/three/, NO CDN), fully
    // client-side. Lean single-scene fork of the atmosphere-escape-mars /
    // lunar-south-pole-ice shape - ONE scene only. All geometry is procedural:
    // an Earth sphere, a fixed geostationary-orbit ring at the real ratio to
    // Earth's radius, a tether cylinder whose length a slider controls, a
    // counterweight mesh that only appears once the tether passes the
    // geostationary ring, and a climber capsule a second slider drives along
    // whatever length of tether currently exists.
    //
    // EDUCATIONAL APPROXIMATION, not a physics or structural simulation. This
    // scene does not solve tether elasticity, sag, vibration, orbital
    // perturbation, or materials-engineering physics - it is a visualization
    // tuned to teach the real published figures and the real force-balance
    // concept honestly. The Earth-to-geostationary-orbit ratio rendered here
    // (about 6.6 Earth radii) IS the real ratio, not compressed; the
    // reference tether length used for the "extended" toggle position
    // (100,000 km) is also rendered at its real ratio to Earth's radius
    // (about 15.7 Earth radii) - unlike several of this cluster's other
    // scenes, no distance compression was needed for this concept to stay
    // readable on screen. No space elevator has ever been built - this is a
    // 100% theoretical concept, limited by materials science (no manufactured
    // cable material yet reaches the required strength-to-weight ratio at the
    // needed scale), not by orbital mechanics.
    //
    // Published figures (cross-checked via WebSearch 2026-08-11; primary
    // sources: Bradley C. Edwards, "The NIAC Space Elevator Program," NASA
    // Institute for Advanced Concepts (NIAC) final feasibility study, 2003;
    // standard IAU/NASA geostationary-orbit figures):
    //   - Geostationary orbit: 35,786 km altitude above Earth's equator;
    //     42,164 km radius from Earth's center (Earth's equatorial radius is
    //     6,378 km). A satellite there orbits once per sidereal day, so it
    //     stays over the same point on the ground.
    //   - Concept history: Konstantin Tsiolkovsky first described a
    //     compression tower reaching geostationary altitude in 1895; Yuri
    //     Artsutanov proposed the tension-cable ("hanging") version in 1960;
    //     Jerome Pearson published a tapered-cable engineering design with a
    //     counterweight in 1975; Arthur C. Clarke's 1979 novel "The Fountains
    //     of Paradise" popularized the idea.
    //   - NASA NIAC's Bradley C. Edwards feasibility study (completed 2003)
    //     concluded a space elevator "could be built in the near future with
    //     acceptable risk and lower cost than a number of existing space
    //     programs," naming a carbon-nanotube composite cable as the key
    //     enabling technology, running about 100,000 km from an ocean-anchor
    //     platform to beyond geostationary orbit (some published designs
    //     extend the counterweight end to about 144,000 km instead of using a
    //     heavier counterweight mass).
    //   - Edwards' conservative estimate put the minimum required cable
    //     specific tensile strength at about 48.5 to 62.5 GPa; a commonly
    //     cited real-world safety-margin target is about 100 GPa or higher.
    //   - For comparison: high-strength steel is under about 5 GPa tensile
    //     strength; Kevlar is about 3.6 GPa. Carbon nanotubes have been
    //     simulated at up to about 130 GPa for a single defect-free fiber,
    //     but realistic multi-walled macroscale cables (accounting for real
    //     manufacturing defects) top out around 10 GPa in current models -
    //     short of what a real cable needs at the necessary scale.
    //   - Edwards' reference design climber: about a 20-tonne climber
    //     carrying about 13 tonnes of payload, with follow-on payloads
    //     proposed to launch roughly every 4 days once an initial
    //     multi-year cable-thickening phase is complete.
    //   - No material manufactured today meets the required strength-to-
    //     density ratio at the scale a real cable would need, and no space
    //     elevator has been built.
    //   - Distinct from escape-velocity.html (the speed needed to leave a
    //     body's gravity outright, unrelated to a tethered structure) and
    //     orbital-velocity.html (the speed a free orbit needs at a given
    //     altitude, not a structure fixed to the ground) and
    //     geocentric-vs-heliocentric.html (reference frames, not tether
    //     engineering). THIS page is specifically the force-balance physics
    //     of a tethered structure anchored to Earth's surface and extending
    //     past geostationary orbit.
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'spaceelevatorphysics';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'spaceelevatorphysics'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 50, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        if (typeof ResizeObserver === 'function') {
            try { new ResizeObserver(resize).observe(host); } catch (e) {}
        }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    // Real published figures (Bradley C. Edwards, NASA NIAC space elevator
    // feasibility study, completed 2003; standard IAU/NASA geostationary
    // figures; cross-checked via WebSearch 2026-08-11).
    var T3D_EARTH_R_KM = 6378;
    var T3D_GEO_ALT_KM = 35786;
    var T3D_GEO_RADIUS_KM = 42164; // 6378 + 35786
    var T3D_REF_CABLE_KM = 100000; // Edwards reference design, ocean anchor to beyond GEO
    var T3D_ALT_CABLE_KM = 144000; // alternative counterweight-extension design
    var T3D_MIN_STRENGTH_GPA_LOW = 48.5;
    var T3D_MIN_STRENGTH_GPA_HIGH = 62.5;
    var T3D_SAFETY_TARGET_GPA = 100;
    var T3D_STEEL_GPA = 5;
    var T3D_KEVLAR_GPA = 3.6;
    var T3D_CNT_THEORETICAL_GPA = 130;
    var T3D_CNT_MACRO_GPA = 10;
    var T3D_CLIMBER_TONNES = 20;
    var T3D_PAYLOAD_TONNES = 13;
    var T3D_LAUNCH_CADENCE_DAYS = 4;
    var T3D_LEO_CEILING_KM = 2000;

    var T3D_EARTH_R = 6; // scene units - real ratios preserved (no compression needed)
    var T3D_KM_PER_UNIT = T3D_EARTH_R_KM / T3D_EARTH_R; // 1063 km/unit
    var T3D_GEO_R_UNITS = T3D_EARTH_R * (T3D_GEO_RADIUS_KM / T3D_EARTH_R_KM); // ~39.67
    var T3D_EXT_R_UNITS = T3D_EARTH_R + (T3D_REF_CABLE_KM / T3D_KM_PER_UNIT); // ~100.1

    function t3dSpaceElevatorPhysics(shell) {
        var THREE = shell.THREE, scene = shell.scene, renderer = shell.renderer;
        renderer.setClearColor(0x03040a, 1);

        scene.add(new THREE.AmbientLight(0x404050, 0.6));

        var starN = shell.low ? 220 : 460;
        var starPos = new Float32Array(starN * 3);
        for (var s = 0; s < starN; s++) {
            var r = 160 + Math.random() * 90;
            var th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
            starPos[s * 3] = r * Math.sin(ph) * Math.cos(th);
            starPos[s * 3 + 1] = r * Math.cos(ph);
            starPos[s * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
        }
        var starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xdfe6ff, size: 0.3, sizeAttenuation: true, transparent: true, opacity: 0.55 })));

        var sunDir = new THREE.Vector3(0.6, 0.5, 1).normalize();
        var sunLight = new THREE.DirectionalLight(0xfff2d8, 1.5);
        sunLight.position.copy(sunDir).multiplyScalar(60);
        scene.add(sunLight);

        // Earth: procedural sphere, blue ocean base + green/brown continent
        // blotches via a low-frequency per-vertex noise tint (not a
        // photographic texture). Spin axis is +Y; the equatorial plane is XZ.
        var earthGeo = new THREE.SphereGeometry(T3D_EARTH_R, 48, 32);
        var posAttr = earthGeo.getAttribute('position');
        var colors = new Float32Array(posAttr.count * 3);
        for (var vi = 0; vi < posAttr.count; vi++) {
            var vx = posAttr.getX(vi), vy = posAttr.getY(vi), vz = posAttr.getZ(vi);
            var land = 0.5 + 0.5 * Math.sin(vx * 1.6 + vy * 1.1) * Math.cos(vz * 1.3 - vx * 0.6);
            var isLand = land > 0.62;
            colors[vi * 3] = isLand ? 0.30 : 0.10;
            colors[vi * 3 + 1] = isLand ? 0.46 : 0.32;
            colors[vi * 3 + 2] = isLand ? 0.22 : 0.62;
        }
        earthGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        var earth = new THREE.Mesh(earthGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
        scene.add(earth);

        // Geostationary-orbit ring - fixed, real ratio (~6.6 Earth radii).
        var geoRing = new THREE.Mesh(
            new THREE.TorusGeometry(T3D_GEO_R_UNITS, 0.14, 8, 96),
            new THREE.MeshBasicMaterial({ color: 0x6fb6ff, transparent: true, opacity: 0.55 })
        );
        geoRing.rotation.x = Math.PI / 2;
        scene.add(geoRing);

        // Tether: a cylinder from Earth's surface (equator, +X) out to a
        // length the "cable state" slider controls. Rebuilt on slider input,
        // not per animate frame.
        var tetherMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 1, 8, 1),
            new THREE.MeshBasicMaterial({ color: 0xffb020 })
        );
        scene.add(tetherMesh);

        var climber = new THREE.Mesh(
            new THREE.BoxGeometry(0.55, 0.4, 0.4),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        scene.add(climber);

        var counterweight = new THREE.Mesh(
            new THREE.IcosahedronGeometry(0.7, 0),
            new THREE.MeshBasicMaterial({ color: 0x9be564 })
        );
        counterweight.visible = false;
        scene.add(counterweight);

        function fmtKm(km) { return Math.round(km).toLocaleString() + ' km'; }

        function tipRadiusUnitsForCableState(cableState) {
            // 0 = ends exactly at GEO (not stable enough); 100 = extends to
            // the reference 100,000 km design tip (stable, counterweight visible).
            return T3D_GEO_R_UNITS + (T3D_EXT_R_UNITS - T3D_GEO_R_UNITS) * (cableState / 100);
        }

        function panelHtml(cableState, tipRadiusUnits, climberAltKm, climberZone) {
            var tipAltKm = (tipRadiusUnits - T3D_EARTH_R) * T3D_KM_PER_UNIT;
            var stable = cableState >= 99.5;
            var stateLine = stable
                ? '<p><b>Cable state:</b> extended to about ' + fmtKm(tipAltKm) + ' with a counterweight - beyond geostationary orbit, so the outward pull from spinning faster than a circular orbit up there overcomes the inward pull from the lower part. This is the taut, stable case.</p>'
                : (cableState <= 0.5
                    ? '<p><b>Cable state:</b> ends right at geostationary orbit (' + fmtKm(T3D_GEO_ALT_KM) + ' altitude), with no extra cable or counterweight beyond it. A cable built only this far has its combined weight sitting below geostationary orbit, so it would not stay in tension on its own - it needs to extend further out, or carry a counterweight, to stay taut.</p>'
                    : '<p><b>Cable state:</b> partway between ending at geostationary orbit and the full 100,000 km reference design - drag to 100% to see the stable, counterweighted case.</p>');
            var climberLine = '<p><b>Climber altitude:</b> about ' + fmtKm(climberAltKm) + ' - ' + climberZone + '</p>';
            return '<h3>Space Elevator Physics</h3>' + stateLine + climberLine +
                '<p class="t3d-note">Geostationary orbit sits at ' + fmtKm(T3D_GEO_ALT_KM) + ' altitude (' + fmtKm(T3D_GEO_RADIUS_KM) + ' from Earth\'s center) - the blue ring. NASA\'s NIAC-funded feasibility study (Edwards, 2003) put the minimum required cable strength at about ' + T3D_MIN_STRENGTH_GPA_LOW + ' to ' + T3D_MIN_STRENGTH_GPA_HIGH + ' GPa, with a safety-margin target nearer ' + T3D_SAFETY_TARGET_GPA + ' GPa - no manufactured material reaches that at the scale a real cable needs today. This is an educational approximation of a real, published concept, not a structural or orbital-dynamics simulation.</p>';
        }

        var cableSliderEl = document.getElementById('t3dCableSlider');
        var cableLabelEl = document.getElementById('t3dCableLabel');
        var climberSliderEl = document.getElementById('t3dClimberSlider');
        var climberLabelEl = document.getElementById('t3dClimberLabel');

        var cableState = 0;
        var climberFrac = 0;

        function zoneLabel(km) {
            if (km < T3D_LEO_CEILING_KM) return 'within the low-Earth-orbit altitude range (up to about ' + fmtKm(T3D_LEO_CEILING_KM) + ')';
            if (km < T3D_GEO_ALT_KM * 0.97) return 'above low-Earth-orbit altitudes, still below geostationary orbit';
            if (km <= T3D_GEO_ALT_KM * 1.03) return 'at geostationary orbit (' + fmtKm(T3D_GEO_ALT_KM) + ') - this altitude matches Earth\'s rotation';
            return 'beyond geostationary orbit, in the zone where extra cable or a counterweight keeps the structure in tension';
        }

        function apply() {
            var tipRadiusUnits = tipRadiusUnitsForCableState(cableState);
            var tetherLen = tipRadiusUnits - T3D_EARTH_R;
            tetherMesh.geometry.dispose();
            tetherMesh.geometry = new THREE.CylinderGeometry(0.1, 0.1, tetherLen, 8, 1);
            tetherMesh.rotation.z = Math.PI / 2;
            tetherMesh.position.set(T3D_EARTH_R + tetherLen / 2, 0, 0);
            var stableColor = cableState >= 99.5 ? 0x9be564 : (cableState <= 0.5 ? 0xff5a3c : 0xffb020);
            tetherMesh.material.color.setHex(stableColor);

            counterweight.visible = cableState >= 60;
            counterweight.position.set(tipRadiusUnits, 0, 0);

            var climberRadiusUnits = T3D_EARTH_R + (tipRadiusUnits - T3D_EARTH_R) * (climberFrac / 100);
            climber.position.set(climberRadiusUnits, 0, 0);
            var climberAltKm = (climberRadiusUnits - T3D_EARTH_R) * T3D_KM_PER_UNIT;
            var zone = zoneLabel(climberAltKm);

            if (cableLabelEl) cableLabelEl.textContent = cableState >= 99.5 ? 'Extended past GEO (stable)' : (cableState <= 0.5 ? 'Ends at GEO (not stable)' : 'Partway');
            if (climberLabelEl) climberLabelEl.textContent = fmtKm(climberAltKm);
            t3dInfo(panelHtml(cableState, tipRadiusUnits, climberAltKm, zone));
            try { t3dSaveStore({ cableState: cableState, climberFrac: climberFrac }); } catch (e) {}
            return { tipRadiusUnits: tipRadiusUnits };
        }

        var store = t3dLoadStore();
        if (typeof store.cableState === 'number' && store.cableState >= 0 && store.cableState <= 100) { cableState = store.cableState; }
        if (typeof store.climberFrac === 'number' && store.climberFrac >= 0 && store.climberFrac <= 100) { climberFrac = store.climberFrac; }
        if (cableSliderEl) cableSliderEl.value = String(cableState);
        if (climberSliderEl) climberSliderEl.value = String(climberFrac);
        apply();

        if (cableSliderEl) cableSliderEl.addEventListener('input', function () {
            cableState = Math.max(0, Math.min(100, parseFloat(cableSliderEl.value || '0')));
            apply();
        });
        if (climberSliderEl) climberSliderEl.addEventListener('input', function () {
            climberFrac = Math.max(0, Math.min(100, parseFloat(climberSliderEl.value || '0')));
            apply();
        });

        t3dStatus('Drag to orbit, scroll to zoom. Slide the cable length past the blue geostationary ring, then move the climber.');
        return function animate(dt) {
            earth.rotation.y += 0.0006 * dt;
            geoRing.rotation.z += 0.00015 * dt;
            counterweight.rotation.y += 0.002 * dt;
            counterweight.rotation.x += 0.0013 * dt;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { spaceelevatorphysics: 't3dElevatorControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { spaceelevatorphysics: { radius: 150, maxR: 320, minR: 12, phi: 1.1, theta: 0.5, targetY: 0, fov: 50 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dSpaceElevatorPhysics(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

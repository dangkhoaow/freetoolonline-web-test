            h += '<div class="w3-light-grey w3-round awc-ml-prog"><div id="awcVidMlBar" class="w3-container w3-teal w3-round" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="awcVidMlTxt" style="width:0%;height:18px;font-size:11px">0%</div></div>' +
                '<p id="awcVidMlTxt" class="w3-small" aria-live="polite"></p><button type="button" class="w3-button w3-light-grey w3-small" data-awc-ml="stop">' + awcEsc(awcT('vid.ml.stop')) + '</button>';
        } else if (S.state === 'done') {
            var X = S.result, li = [];
            if (!X.boxesTotal) li.push(awcEsc(awcT('vid.ml.none', { k: awcNum(X.stills) })));
            else {
                li.push(awcEsc(awcT(X.lo === X.hi ? 'vid.ml.count_one' : 'vid.ml.count', { n: awcNum(X.median), lo: awcNum(X.lo), hi: awcNum(X.hi), k: awcNum(X.stills), _n: X.median })));
                li.push(awcEsc(awcT(X.tankFound ? 'vid.ml.tiers_tank' : 'vid.ml.tiers_pic', { top: awcPct(X.tiers.top), mid: awcPct(X.tiers.mid), bottom: awcPct(X.tiers.bottom) })));
                if (X.movingShare != null) li.push(awcEsc(awcT('vid.ml.moving', { share: awcPct(X.movingShare) })));
                if (X.cmp) li.push(awcBi('vid.ml.' + X.cmp));
            }
            h += '<ul class="w3-small">' + li.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
            if (X.boxesTotal && X.preview) h += '<canvas id="awcVidMlCanvas" class="awc-vid-canvas awc-vid-mlcanvas" role="img" aria-label="' + awcEsc(awcT('vid.ml.img_alt')) + '" title="' + awcEsc(awcT('vid.ml.img_alt')) + '"></canvas>';
            h += '<p class="w3-small w3-text-grey">' + awcBi('vid.ml.note') + '</p>';
        }
        box.innerHTML = h + '</div>';
        if (S.state === 'loading' || S.state === 'running') awcRenderMlProgress();
        if (S.state === 'done' && S.result.boxesTotal && S.result.preview) awcMlDrawPreview(S.result.preview);
    }
    function awcMlDrawPreview(pv) {
        var cv = awcEl('awcVidMlCanvas');
        if (!cv || !cv.getContext) return;
        var src = pv.canvas, k = Math.min(1, 960 / src.width), w = Math.round(src.width * k), h = Math.round(src.height * k);
        cv.width = w; cv.height = h;
        var g = cv.getContext('2d');
        g.drawImage(src, 0, 0, w, h);
        g.lineWidth = Math.max(1.5, w / 400);
        if (pv.roi) { g.strokeStyle = 'rgba(128,222,234,0.9)'; if (g.setLineDash) g.setLineDash([6, 5]); g.strokeRect(pv.roi.x0 * w, pv.roi.y0 * h, (pv.roi.x1 - pv.roi.x0) * w, (pv.roi.y1 - pv.roi.y0) * h); if (g.setLineDash) g.setLineDash([]); }
        g.strokeStyle = 'rgba(255,235,59,0.95)';
        pv.boxes.forEach(function (b) { g.strokeRect(b.x0 * w, b.y0 * h, (b.x1 - b.x0) * w, (b.y1 - b.y0) * h); });
    }

    // Bundled sample clip -> the same path as an upload (File where possible,
    // so the WORKERFS fallback sees a real file name).
    function awcLoadSampleClip() {
        awcResetResult();
        var gen = awc.gen;
        awc.sampleLoading = true; awcMaybeEnable();   // no Compare click on the old slots meanwhile
        awcStatus('status.sample_loading', null, true);
        fetch(awcBase() + AWC_SAMPLE_CLIP).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.blob();
        }).then(function (blob) {
            if (gen !== awc.gen) return;
            awc.sampleLoading = false;
            var f = null, name = 'aquarium-sample-clip.mp4';
            try { f = new File([blob], name, { type: 'video/mp4', lastModified: Date.now() }); } catch (e) { f = blob; try { f.name = name; } catch (x) { void x; } }
            awcSetVideoFile(f, { demo: true, labelId: 'demo.clip_name', autoAnalyze: true });
        }).then(null, function (e) {
            if (gen !== awc.gen) return;
            awc.sampleLoading = false; awcMaybeEnable();
            // a raw browser message ("Failed to fetch") is not shown in the report language
            var em = String(e && e.message || '');
            awcStatus('status.sample_failed', { reason: /^HTTP \d+$/.test(em) ? em : { id: 'err.network' } });
        });
    }

    // ---------------------------------------------------------------- tier a (photos)
    // Chrome Built-in Prompt API - capability probe per rule 9: only
    // availability() === 'available' activates the tier (a 'downloadable'
    // state would trigger a silent model download, which is forbidden).
    function awcProbeBuiltin(cb) {
        try {
            if (typeof LanguageModel !== 'undefined' && LanguageModel && typeof LanguageModel.availability === 'function') {
                awcWithTimeout(LanguageModel.availability(), AWC_PROBE_MS, 'unavailable').then(function (a) { cb(a === 'available'); });
                return;
            }
        } catch (e) { void e; }
        cb(false);
    }

    // Prompt API output languages are limited per Chrome build: the rewrite is
    // written in the report language only when availability() says so for
    // that OUTPUT language; otherwise it is written in English and labelled.
    function awcPromptLangOk(lang) {
        try {
            return awcWithTimeout(LanguageModel.availability({ expectedInputs: [{ type: 'text', languages: ['en'] }], expectedOutputs: [{ type: 'text', languages: [lang] }] }), AWC_PROBE_MS, 'unavailable')
                .then(function (a) { return a === 'available'; });
        } catch (e) { return Promise.resolve(false); }
    }

    function awcBuiltinRewrite() {
        var A = awc.A, B = awc.B;
        if (!A || !A.metrics || !B || !B.metrics) return;
        var gen = awc.gen;
        var out = awcEl('awcAiProse');
        out.textContent = awcT('ai.builtin_writing');
        var mA = A.metrics, mB = B.metrics;
        var cmp = awcCompare(mA, mB);
        var facts = 'Facts measured from two photos of the same aquarium (before vs after): ' +
            'clarity score ' + mA.clarity + ' vs ' + mB.clarity + ' (0-100); ' +
            'haze ' + Math.round(mA.haze * 100) + '% vs ' + Math.round(mB.haze * 100) + '%; ' +
            'edge sharpness ' + mA.sharpness.toFixed(0) + ' vs ' + mB.sharpness.toFixed(0) + '; ' +
            'particle speckle ' + mA.speckle.toFixed(1) + ' vs ' + mB.speckle.toFixed(1) + '; ' +
            'tint ' + mA.tint + ' vs ' + mB.tint + '; optical pattern: ' + cmp.stateA + ' then ' + cmp.stateB + '.';
        var want = awcI18n.lang;
        awcPromptLangOk(want).then(function (ok) {
            if (gen !== awc.gen) return null;
            var lang = ok ? want : 'en';
            return LanguageModel.create({ expectedInputs: [{ type: 'text', languages: ['en'] }], expectedOutputs: [{ type: 'text', languages: [lang] }] })
                .then(function (session) {
                    function done() { try { if (session && typeof session.destroy === 'function') session.destroy(); } catch (e) { void e; } }   // one prompt per session: free it
                    return session.prompt('You are an experienced freshwater aquarist. Rewrite these measurements as a short, calm 3-4 sentence assessment for the tank owner, written in ' + AWC_LANG_EN[lang] + '. Use ONLY the facts given and keep every number exactly as given; do not invent chemistry readings (no ammonia/pH numbers). ' + facts)
                        .then(function (t) { done(); return t; }, function (e) { done(); throw e; });
                }).then(function (text) {
                    if (gen !== awc.gen) return;
                    awc.aiProse = { lang: lang, wanted: want, text: String(text) }; awcRenderProse();
                });
        }).then(null, function (e) { if (gen === awc.gen) out.textContent = awcT('ai.builtin_err', { msg: (e && e.message) || e }); });
    }

    // Free-text prose from the Prompt API is NOT a template: it is shown in the
    // language it was written in, and labelled when that differs.
    function awcRenderProse() {
        var out = awcEl('awcAiProse'), p = awc.aiProse;
        if (!out || !p) return;
        var note = '';
        if (p.lang !== awcI18n.lang) note = p.wanted === awcI18n.lang ? awcT('ai.prose_lang_unsupported', { lang: awcLangName(awcI18n.lang) }) : awcT('ai.prose_stale', { lang: awcLangName(p.lang) });
        out.textContent = p.text + (note ? '\n\n' + note : '');
    }

    function awcRenderAiPanel() {
        var el = awcEl('awcBuiltinRow');
        if (!el) return;
        if (awc.builtin) el.classList.remove('w3-hide'); else el.classList.add('w3-hide');
    }

    // ---------------------------------------------------------------- tier b (photos)
    function awcLoadClip() {
        if (awc.clip) return Promise.resolve(awc.clip);
        if (awc.clipLoading) return awc.clipLoading;
        var bar = awcEl('awcClipBar');
        var base = awcBase();
        awc.clipLoading = import(base + '/vendor/transformers/transformers.min.js').then(function (tf) {
            tf.env.allowLocalModels = false;
            tf.env.backends.onnx.wasm.wasmPaths = base + '/vendor/transformers/';
            tf.env.backends.onnx.wasm.numThreads = 1; // GitHub Pages: no COOP/COEP
            var seen = {};
            return tf.pipeline('zero-shot-image-classification', AWC_CLIP_MODEL, {
                device: 'wasm', dtype: 'q8',
                progress_callback: function (info) {
                    if (!bar || !info || !info.file) return;
                    if (info.status === 'progress' && info.total) {
                        seen[info.file] = info.loaded / info.total;
                        var files = Object.keys(seen); var sum = 0;
                        files.forEach(function (f) { sum += seen[f]; });
                        var pct = Math.round(100 * sum / Math.max(files.length, 1));
                        bar.style.width = Math.min(99, pct) + '%';
                        bar.textContent = Math.min(99, pct) + '%';
                        bar.setAttribute('aria-valuenow', String(Math.min(99, pct)));
                    }
                }
            });
        }).then(function (pipe) {
            awc.clip = pipe;
            if (bar) { bar.style.width = '100%'; bar.textContent = awcT('clip.ready'); bar.setAttribute('aria-valuenow', '100'); }
            return pipe;
        }).then(null, function (e) { awc.clipLoading = null; throw e; });
        return awc.clipLoading;
    }

    function awcRunClip() {
        if (!awc.A || !awc.B) { awcStatus('status.clip_need_both'); return; }
        var gen = awc.gen, A = awc.A, B = awc.B;
        var box = awcEl('awcClipOut');
        awcShow('awcClipProgress', true);
        box.innerHTML = '<span class="w3-text-grey">' + awcEsc(awcT('clip.downloading', { mb: awcNum(AWC_CLIP_MB) })) + '</span>';
        awcStdReplaceAll(true); // transformers.js tokenizer needs the standard replaceAll (see awcStdReplaceAll)
        awcLoadClip().then(function (clf) {
            var waterLabels = AWC_WATER_LABELS.map(function (l) { return l[0]; });
            var speciesLabels = AWC_SPECIES_LABELS.map(function (l) { return l[0]; });
            return clf(A.url, waterLabels).then(function (wA) {
                return clf(B.url, waterLabels).then(function (wB) {
                    return clf(B.url, speciesLabels).then(function (sp) { return { wA: wA, wB: wB, sp: sp }; });
                });
            });
        }).then(function (r) { awcStdReplaceAll(false); return r; }, function (e) { awcStdReplaceAll(false); throw e; }).then(function (r) {
            if (gen !== awc.gen) return; // pair changed while the model was running
            function mapLabel(txt, set) { for (var i = 0; i < set.length; i++) if (set[i][0] === txt) return set[i][1]; return null; }
            var aKey = mapLabel(r.wA[0].label, AWC_WATER_LABELS), bKey = mapLabel(r.wB[0].label, AWC_WATER_LABELS);
            var det = awcCompare(A.metrics || awcMetricsFallback(), B.metrics || awcMetricsFallback());
            var agree = B.metrics ? (bKey === det.stateB || (bKey === 'clear' && det.stateB === 'light_haze') || (bKey === 'biological_haze' && det.stateB === 'light_haze')) : null;
            var picks = r.sp.filter(function (x) { return x.score > 0.18 && mapLabel(x.label, AWC_SPECIES_LABELS); }).slice(0, 3)
                .map(function (x) { return { id: mapLabel(x.label, AWC_SPECIES_LABELS), score: x.score }; });
            awc.clipResult = { aKey: aKey, aScore: r.wA[0].score, bKey: bKey, bScore: r.wB[0].score, agree: agree, picks: picks };
            awcRenderClip();
        }).then(null, function (e) {
            if (gen !== awc.gen) return;
            awc.clipResult = { error: (e && e.message) || String(e) };
            awcRenderClip();
        });
    }
    function awcMetricsFallback() { return { meanLuma: 0.5, clarity: 0, haze: 0, sharpness: 0, speckle: 0, tint: 'neutral', contrast: 0 }; }

    // CLIP output is stored as keys + scores, rendered here in any language.
    function awcRenderClip() {
        var box = awcEl('awcClipOut'), r = awc.clipResult;
        if (!box || !r) return;
        if (r.error) { box.innerHTML = '<span class="w3-text-red">' + awcEsc(awcT('clip.err', { msg: r.error })) + '</span>'; return; }
        function lbl(k) { return k ? awcT('clipwater.' + k) : '-'; }
        var html = '<p><b>' + awcEsc(awcT('clip.sees_before')) + '</b> ' + awcEsc(lbl(r.aKey)) + ' (' + awcPct(r.aScore) + ')<br>' +
                   '<b>' + awcEsc(awcT('clip.sees_after')) + '</b> ' + awcEsc(lbl(r.bKey)) + ' (' + awcPct(r.bScore) + ')' +
                   (r.agree === true ? ' <span class="w3-text-green">' + awcEsc(awcT('clip.agrees')) + '</span>' : r.agree === false ? ' <span class="w3-text-orange">' + awcEsc(awcT('clip.differs')) + '</span>' : '') + '</p>';
        if (r.picks.length) {
            html += '<p><b>' + awcEsc(awcT('clip.thinks')) + '</b> ' + r.picks.map(function (x) { return awcEsc(awcT('species.' + x.id)) + ' (' + awcPct(x.score) + ')'; }).join(', ') +
                    '. ' + awcEsc(awcT('clip.guesses')) + '</p><p>' +
                    r.picks.map(function (x) { return '<button type="button" class="w3-button w3-small w3-light-grey awc-prefill" data-sp="' + x.id + '">+1 ' + awcEsc(awcT('species.' + x.id)) + '</button> '; }).join('') + '</p>';
        } else {
            html += '<p class="w3-text-grey">' + awcEsc(awcT('clip.none')) + '</p>';
        }
        box.innerHTML = html;
        var btns = box.getElementsByClassName('awc-prefill');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function () {
                var el = awcEl('awcN_' + this.getAttribute('data-sp'));
                if (el) el.value = (parseInt(el.value, 10) || 0) + 1;
            });
        }
    }

    // ---------------------------------------------------------------- language wiring
    // Static strings of the input area + the lang control itself.
    var AWC_STATIC_IDS = { awcThMetric: 'table.metric', awcThBefore: 'gauge.before', awcThAfter: 'gauge.after', awcThDelta: 'table.delta',
        awcActionsH: 'heading.actions', awcBuiltinBtn: 'btn.builtin', awcLangLbl: 'ui.lang_label',
        awcTitleA: 'drop.a_title', awcTitleB: 'drop.b_title', awcHintA: 'drop.photo_hint', awcHintB: 'drop.photo_hint',
        awcDropVTitle: 'drop.v_title', awcDropVHint: 'drop.v_hint', awcChooseBtn: 'btn.choose', awcDemoBtn: 'btn.demo_photos',
        awcDemoClipBtn: 'btn.demo_clip', awcAbortBtn: 'btn.stop', awcDeclineBtn: 'btn.not_now',
        awcVolLblB: 'ui.vol_label', awcVolOpt: 'ui.optional', awcFishLblB: 'ui.fish_label', awcFishOpt: 'ui.fish_hint', awcUnitL: 'ui.unit_l', awcUnitGal: 'ui.unit_gal' };
    // Attributes (screen-reader labels, alt text, placeholder) follow the language too.
    var AWC_STATIC_ATTRS = { awcDropA: ['aria-label', 'drop.a_aria'], awcDropB: ['aria-label', 'drop.b_aria'], awcDropV: ['aria-label', 'drop.v_aria'],
        awcThumbA: ['alt', 'drop.a_alt'], awcThumbB: ['alt', 'drop.b_alt'], awcFileAny: ['aria-label', 'drop.any_aria'],
        awcVolUnit: ['aria-label', 'ui.unit_aria'], awcVolume: ['placeholder', 'ui.vol_ph'] };
    function awcRenderStatic() {
        Object.keys(AWC_STATIC_IDS).forEach(function (elId) { var el = awcEl(elId); if (el) el.textContent = awcT(AWC_STATIC_IDS[elId]); });
        Object.keys(AWC_STATIC_ATTRS).forEach(function (elId) { var el = awcEl(elId), a = AWC_STATIC_ATTRS[elId]; if (el) el.setAttribute(a[0], awcT(a[1])); });
        AWC_SPECIES.forEach(function (sp) { var l = document.querySelector('label[for="awcN_' + sp.id + '"]'); if (l) l.textContent = awcT('species.' + sp.id); });
        var clipBtn = awcEl('awcClipBtn');
        if (clipBtn) clipBtn.textContent = awcT('btn.clip', { mb: awcNum(AWC_CLIP_MB) });
        var groups = document.querySelectorAll('#awcLang optgroup[data-i18n-label]');
        for (var i = 0; i < groups.length; i++) groups[i].label = awcT(groups[i].getAttribute('data-i18n-label'));
        var sel = awcEl('awcLang'); if (sel && sel.value !== awcI18n.lang && !awcI18n.pendingLang) sel.value = awcI18n.lang;
        awcMaybeEnable();
    }

    // Everything that is language-dependent, from stored state, zero analysis.
    function awcRerender() {
        awcRenderMachineLabel();
        if (awc.mode === 'photos') {
            awcRenderReport();
            awcRenderClip();
            awcRenderProse();
        } else if (awc.videoResult) {
            awcFillVideoReport();
        }
        if (awc.A) { awcWhenLabel('A', awc.A); var nA = awcEl('awcNameA'); if (nA && awc.A.labelId) nA.textContent = awcSlotLabel(awc.A); }
        if (awc.B) { awcWhenLabel('B', awc.B); var nB = awcEl('awcNameB'); if (nB && awc.B.labelId) nB.textContent = awcSlotLabel(awc.B); }
        awcVideoZoneLabel();
        if (awc.lastStatus) awcStatus(awc.lastStatus.id, awc.lastStatus.params, awc.lastStatus.spin);
        var bar = awcEl('awcClipBar'); if (bar && awc.clip) bar.textContent = awcT('clip.ready');
        awcMaybeEnable();
    }

    function awcWireLang() {
        var sel = awcEl('awcLang');
        if (!sel) return;
        sel.innerHTML = awcLangSelectHtml();
        var lang = awcDefaultLang();
        sel.value = lang;
        sel.addEventListener('change', function () { awcI18n.pendingLang = null; awcSetLang(sel.value); });
        awcSetLang(lang);
    }

    // ---------------------------------------------------------------- boot
    function doAfterPageRendered() {
        awcWireDrop('awcDropA', 'awcFileA', 'A');
        awcWireDrop('awcDropB', 'awcFileB', 'B');
        awcWireDrop('awcDropV', null, null);           // clip zone opens the multi-file picker
        var any = awcEl('awcFileAny');
        if (any) any.addEventListener('change', function () { if (any.files && any.files.length) awcRouteFiles(any.files, null); any.value = ''; });
        var choose = awcEl('awcChooseBtn');
        if (choose && any) choose.addEventListener('click', function () { any.click(); });
        var analyze = awcEl('awcAnalyze');
        if (analyze) analyze.addEventListener('click', function () { if (awc.mode === 'video') awcAnalyzeVideo(); else awcAnalyze(); });
        var abortBtn = awcEl('awcAbortBtn');
        if (abortBtn) abortBtn.addEventListener('click', function () { if (awc.abort) awc.abort.abort(); });
        var decline = awcEl('awcDeclineBtn');
        if (decline) decline.addEventListener('click', function () {
            if (!awc.video) return;
            awc.video.declined = true;
            awcStatus('status.vid_declined');
            awcMaybeEnable();
        });
        var clipBtn = awcEl('awcClipBtn');
        if (clipBtn) clipBtn.addEventListener('click', awcRunClip);
        var biBtn = awcEl('awcBuiltinBtn');
        if (biBtn) biBtn.addEventListener('click', awcBuiltinRewrite);
        var demoBtn = awcEl('awcDemoBtn');
        if (demoBtn) demoBtn.addEventListener('click', function () {
            var base = awcBase();
            awcSetSlot('A', { url: base + AWC_SAMPLE_A, name: 'sample day 1', labelId: 'demo.name_a', demo: true, when: null, file: null, metrics: null });
            awcSetSlot('B', { url: base + AWC_SAMPLE_B, name: 'sample day 4', labelId: 'demo.name_b', demo: true, when: null, file: null, metrics: null });
            awcAnalyze();
        });
        var demoClip = awcEl('awcDemoClipBtn');
        if (demoClip) demoClip.addEventListener('click', awcLoadSampleClip);
        // optional on-device fish marker: the video report is redrawn on every
        // language switch, so its buttons are handled here (delegated)
        var vrep = awcEl('awcVideoReport');
        if (vrep) vrep.addEventListener('click', function (ev) {
            var t = ev.target;
            while (t && t !== vrep && !(t.getAttribute && t.getAttribute('data-awc-ml'))) t = t.parentNode;
            if (!t || t === vrep) return;
            var act = t.getAttribute('data-awc-ml');
            if (act === 'run') awcRunMl();
            else if (act === 'stop' && awc.videoResult && awc.videoResult.ml) {
                var S0 = awc.videoResult.ml; S0.stop = true; t.disabled = true;
                // the download cannot be cancelled and its progress is no longer shown: back to the offer now
                if (S0.state === 'loading') { S0.state = 'stopped'; awcRenderMl(); }
            }
        });
        // stocking counts typed AFTER a clip was analyzed: verdict again from the
        // stored detections ('unseen_fish' needs the count), nothing re-decoded
        AWC_SPECIES.forEach(function (sp) {
            var el = awcEl('awcN_' + sp.id);
            if (el) el.addEventListener('input', function () { if (awc.mode === 'video' && awc.videoResult && !awc.busy) awcVideoRecompute(); });
        });
        window.addEventListener('resize', awcJuxtaFit);
        awcProbeBuiltin(function (ok) { awc.builtin = ok; awcRenderAiPanel(); });
        awcStatus('status.idle');
        awcWireLang();                                 // renders every label in the chosen language
        awcMaybeEnable();
    }
</script>

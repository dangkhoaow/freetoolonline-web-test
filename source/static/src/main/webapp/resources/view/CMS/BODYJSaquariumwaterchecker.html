    var AWC_STATIC_IDS = { awcThMetric: 'table.metric', awcThBefore: 'gauge.before', awcThAfter: 'gauge.after', awcThDelta: 'table.delta',
        awcActionsH: 'heading.actions', awcBuiltinBtn: 'btn.builtin', awcLangLbl: 'ui.lang_label',
        awcTitleA: 'drop.a_title', awcTitleB: 'drop.b_title', awcHintA: 'drop.photo_hint', awcHintB: 'drop.photo_hint',
        awcDropVTitle: 'drop.v_title', awcDropVHint: 'drop.v_hint', awcChooseBtn: 'btn.choose', awcDemoBtn: 'btn.demo_photos',
        awcDemoClipBtn: 'btn.demo_clip', awcAbortBtn: 'btn.stop', awcDeclineBtn: 'btn.not_now',
        awcVolLblB: 'ui.vol_label', awcVolOpt: 'ui.optional', awcFishLblB: 'ui.fish_label', awcFishOpt: 'ui.fish_hint', awcUnitL: 'ui.unit_l', awcUnitGal: 'ui.unit_gal' };
    // Attributes (screen-reader labels, alt text, placeholder) follow the language too.
    var AWC_STATIC_ATTRS = { awcDropA: ['aria-label', 'drop.a_aria'], awcDropB: ['aria-label', 'drop.b_aria'], awcDropV: ['aria-label', 'drop.v_aria'],
        awcThumbA: ['alt', 'drop.a_alt'], awcThumbB: ['alt', 'drop.b_alt'], awcFileAny: ['aria-label', 'drop.any_aria'],
        awcVolUnit: ['aria-label', 'ui.unit_aria'], awcVolume: ['placeholder', 'ui.vol_ph'] };
    function awcRenderStatic() {
        Object.keys(AWC_STATIC_IDS).forEach(function (elId) { var el = awcEl(elId); if (el) el.textContent = awcT(AWC_STATIC_IDS[elId]); });
        Object.keys(AWC_STATIC_ATTRS).forEach(function (elId) { var el = awcEl(elId), a = AWC_STATIC_ATTRS[elId]; if (el) el.setAttribute(a[0], awcT(a[1])); });
        AWC_SPECIES.forEach(function (sp) { var l = document.querySelector('label[for="awcN_' + sp.id + '"]'); if (l) l.textContent = awcT('species.' + sp.id); });
        var clipBtn = awcEl('awcClipBtn');
        if (clipBtn) clipBtn.textContent = awcT('btn.clip', { mb: awcNum(AWC_CLIP_MB) });
        var groups = document.querySelectorAll('#awcLang optgroup[data-i18n-label]');
        for (var i = 0; i < groups.length; i++) groups[i].label = awcT(groups[i].getAttribute('data-i18n-label'));
        var sel = awcEl('awcLang'); if (sel && sel.value !== awcI18n.lang && !awcI18n.pendingLang) sel.value = awcI18n.lang;
        awcMaybeEnable();
    }

    // Everything that is language-dependent, from stored state, zero analysis.
    function awcRerender() {
        awcRenderMachineLabel();
        if (awc.mode === 'photos') {
            awcRenderReport();
            awcRenderClip();
            awcRenderProse();
        } else if (awc.videoResult) {
            awcFillVideoReport();
        }
        if (awc.A) { awcWhenLabel('A', awc.A); var nA = awcEl('awcNameA'); if (nA && awc.A.labelId) nA.textContent = awcSlotLabel(awc.A); }
        if (awc.B) { awcWhenLabel('B', awc.B); var nB = awcEl('awcNameB'); if (nB && awc.B.labelId) nB.textContent = awcSlotLabel(awc.B); }
        awcVideoZoneLabel();
        if (awc.lastStatus) awcStatus(awc.lastStatus.id, awc.lastStatus.params, awc.lastStatus.spin);
        var bar = awcEl('awcClipBar'); if (bar && awc.clip) bar.textContent = awcT('clip.ready');
        awcMaybeEnable();
    }

    function awcWireLang() {
        var sel = awcEl('awcLang');
        if (!sel) return;
        sel.innerHTML = awcLangSelectHtml();
        var lang = awcDefaultLang();
        sel.value = lang;
        sel.addEventListener('change', function () { awcI18n.pendingLang = null; awcSetLang(sel.value); });
        awcSetLang(lang);
    }

    // ---------------------------------------------------------------- boot
    function doAfterPageRendered() {
        awcWireDrop('awcDropA', 'awcFileA', 'A');
        awcWireDrop('awcDropB', 'awcFileB', 'B');
        awcWireDrop('awcDropV', null, null);           // clip zone opens the multi-file picker
        var any = awcEl('awcFileAny');
        if (any) any.addEventListener('change', function () { if (any.files && any.files.length) awcRouteFiles(any.files, null); any.value = ''; });
        var choose = awcEl('awcChooseBtn');
        if (choose && any) choose.addEventListener('click', function () { any.click(); });
        var analyze = awcEl('awcAnalyze');
        if (analyze) analyze.addEventListener('click', function () { if (awc.mode === 'video') awcAnalyzeVideo(); else awcAnalyze(); });
        var abortBtn = awcEl('awcAbortBtn');
        if (abortBtn) abortBtn.addEventListener('click', function () { if (awc.abort) awc.abort.abort(); });
        var decline = awcEl('awcDeclineBtn');
        if (decline) decline.addEventListener('click', function () {
            if (!awc.video) return;
            awc.video.declined = true;
            awcStatus('status.vid_declined');
            awcMaybeEnable();
        });
        var clipBtn = awcEl('awcClipBtn');
        if (clipBtn) clipBtn.addEventListener('click', awcRunClip);
        var biBtn = awcEl('awcBuiltinBtn');
        if (biBtn) biBtn.addEventListener('click', awcBuiltinRewrite);
        var demoBtn = awcEl('awcDemoBtn');
        if (demoBtn) demoBtn.addEventListener('click', function () {
            var base = awcBase();
            awcSetSlot('A', { url: base + AWC_SAMPLE_A, name: 'sample day 1', labelId: 'demo.name_a', demo: true, when: null, file: null, metrics: null });
            awcSetSlot('B', { url: base + AWC_SAMPLE_B, name: 'sample day 4', labelId: 'demo.name_b', demo: true, when: null, file: null, metrics: null });
            awcAnalyze();
        });
        var demoClip = awcEl('awcDemoClipBtn');
        if (demoClip) demoClip.addEventListener('click', awcLoadSampleClip);
        // stocking counts typed AFTER a clip was analyzed: verdict again from the
        // stored detections ('unseen_fish' needs the count), nothing re-decoded
        AWC_SPECIES.forEach(function (sp) {
            var el = awcEl('awcN_' + sp.id);
            if (el) el.addEventListener('input', function () { if (awc.mode === 'video' && awc.videoResult && !awc.busy) awcVideoRecompute(); });
        });
        window.addEventListener('resize', awcJuxtaFit);
        awcProbeBuiltin(function (ok) { awc.builtin = ok; awcRenderAiPanel(); });
        awcStatus('status.idle');
        awcWireLang();                                 // renders every label in the chosen language
        awcMaybeEnable();
    }
</script>

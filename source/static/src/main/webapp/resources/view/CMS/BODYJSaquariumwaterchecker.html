        'bio.detail': { en: '({pressure} waste units per 10 L; rule-of-thumb minimum for the fish entered: ~{minL} L). This is an estimate from the counts you entered, not a measurement.', pt: '({pressure} unidades de resíduo por 10 L; mínimo prático para os peixes informados: ~{minL} L). É uma estimativa a partir das quantidades que você informou, não uma medição.', es: '({pressure} unidades de desecho por cada 10 L; mínimo orientativo para los peces indicados: ~{minL} L). Es una estimación a partir de las cantidades que indicaste, no una medición.', vi: '({pressure} đơn vị chất thải trên mỗi 10 L; thể tích tối thiểu theo quy tắc kinh nghiệm cho số cá đã nhập: ~{minL} L). Đây là ước tính từ số lượng bạn nhập, không phải kết quả đo.', id: '({pressure} satuan limbah per 10 L; patokan kasar volume minimum untuk ikan yang Anda isikan: ~{minL} L). Ini perkiraan dari jumlah yang Anda isikan, bukan hasil pengukuran.', de: '({pressure} Abfalleinheiten pro 10 L; Faustregel-Minimum für die eingetragenen Fische: ~{minL} L). Das ist eine Schätzung aus Ihren Angaben, keine Messung.' },
        'bio.empty': { en: 'Enter tank volume and fish counts above to add a stocking-pressure estimate to the report.', pt: 'Informe o volume do aquário e a quantidade de peixes acima para adicionar ao relatório uma estimativa da pressão de povoamento.', es: 'Introduce arriba el volumen del acuario y la cantidad de peces para añadir al informe una estimación de la densidad de población.', vi: 'Nhập thể tích bể và số lượng cá ở trên để thêm ước tính áp lực mật độ nuôi vào báo cáo.', id: 'Masukkan volume akuarium dan jumlah ikan di atas untuk menambahkan perkiraan tekanan kepadatan ikan ke laporan.', de: 'Tragen Sie oben Beckenvolumen und Fischanzahl ein, um dem Bericht eine Schätzung des Besatzdrucks hinzuzufügen.' },

        'heading.actions': { en: 'What to do next', pt: 'O que fazer agora', es: 'Qué hacer ahora', vi: 'Việc cần làm tiếp theo', id: 'Langkah selanjutnya', de: 'Was jetzt zu tun ist' },
        'act.retake': { en: 'Retake one photo first: the two shots differ too much in overall brightness for a fair comparison. Match the time of day and room light, then run the check again.', pt: 'Refaça uma das fotos primeiro: as duas diferem demais no brilho geral para uma comparação justa. Use o mesmo horário e a mesma luz ambiente e faça a verificação de novo.', es: 'Repite primero una de las fotos: las dos difieren demasiado en brillo general para una comparación justa. Usa la misma hora del día y la misma luz de la habitación y vuelve a hacer la comprobación.', vi: 'Hãy chụp lại một ảnh trước: hai ảnh chênh lệch độ sáng tổng thể quá nhiều để so sánh công bằng. Chụp cùng thời điểm trong ngày và cùng ánh sáng phòng, rồi kiểm tra lại.', id: 'Ambil ulang salah satu foto dulu: kecerahan keseluruhan kedua foto terlalu berbeda untuk perbandingan yang adil. Samakan jam pengambilan dan cahaya ruangan, lalu jalankan pemeriksaan lagi.', de: 'Nehmen Sie zuerst ein Foto neu auf: Die beiden Aufnahmen unterscheiden sich in der Gesamthelligkeit zu stark für einen fairen Vergleich. Wählen Sie dieselbe Tageszeit und dasselbe Raumlicht und starten Sie die Prüfung erneut.' },
        'act.bio_feeding': { en: 'Halt or halve feeding for 48 hours - a milky bloom feeds on dissolved organics.', pt: 'Suspenda ou reduza pela metade a alimentação por 48 horas - uma proliferação leitosa se alimenta de matéria orgânica dissolvida.', es: 'Suspende o reduce a la mitad la alimentación durante 48 horas - una proliferación lechosa se alimenta de materia orgánica disuelta.', vi: 'Ngừng cho ăn hoặc giảm một nửa lượng thức ăn trong 48 giờ - vi khuẩn gây đục sữa sống nhờ chất hữu cơ hòa tan.', id: 'Hentikan pemberian pakan atau kurangi setengahnya selama 48 jam - bakteri penyebab keruh putih susu hidup dari bahan organik terlarut.', de: 'Füttern Sie 48 Stunden lang gar nicht oder nur die Hälfte - eine milchige Blüte ernährt sich von gelösten organischen Stoffen.' },
        'act.bio_filter': { en: 'Do NOT deep-clean the filter right now; starve the bloom instead of removing the bacteria that will out-compete it.', pt: 'NÃO faça uma limpeza profunda do filtro agora; deixe a proliferação sem alimento em vez de remover as bactérias que vão vencê-la na competição.', es: 'NO hagas una limpieza a fondo del filtro ahora; deja sin alimento a la proliferación en lugar de eliminar las bacterias que acabarán desplazándola.', vi: 'KHÔNG vệ sinh kỹ bộ lọc lúc này; hãy bỏ đói đám vi khuẩn bùng phát thay vì loại bỏ lớp vi khuẩn có lợi sẽ lấn át chúng.', id: 'JANGAN bersihkan filter secara menyeluruh sekarang; buat ledakan bakteri kehabisan makanan, jangan malah membuang bakteri filter yang nantinya akan mengalahkannya.', de: 'Reinigen Sie den Filter jetzt NICHT gründlich; hungern Sie die Blüte aus, statt die Bakterien zu entfernen, die sie verdrängen werden.' },
        'act.bio_agitation': { en: 'Keep surface agitation high: a bloom can pull oxygen down overnight.', pt: 'Mantenha a agitação da superfície alta: uma proliferação pode baixar o oxigênio durante a noite.', es: 'Mantén alta la agitación de la superficie: una proliferación puede hacer bajar el oxígeno durante la noche.', vi: 'Giữ mặt nước luôn được khuấy động mạnh: vi khuẩn bùng phát có thể làm giảm oxy trong đêm.', id: 'Jaga agitasi permukaan tetap tinggi: ledakan bakteri bisa menurunkan kadar oksigen dalam semalam.', de: 'Halten Sie die Oberflächenbewegung hoch: Eine Blüte kann den Sauerstoffgehalt über Nacht senken.' },
        'act.part_floss': { en: 'Add fine filter floss or a polishing pad to the mechanical stage of the filter.', pt: 'Adicione perlon fino ou uma manta de polimento ao estágio mecânico do filtro.', es: 'Añade guata filtrante fina (perlón) o una almohadilla de pulido a la etapa mecánica del filtro.', vi: 'Thêm bông lọc mịn hoặc tấm lọc tinh vào ngăn lọc cơ học.', id: 'Tambahkan kapas filter halus atau busa halus (polishing pad) ke bagian filtrasi mekanis.', de: 'Legen Sie feine Filterwatte oder ein Feinfiltervlies in die mechanische Stufe des Filters.' },
        'act.part_stir': { en: 'Avoid stirring the substrate; siphon the settled dust in about 48 hours.', pt: 'Evite revolver o substrato; sifone a poeira assentada daqui a cerca de 48 horas.', es: 'Evita remover el sustrato; dentro de unas 48 horas, sifona el polvo que se haya asentado.', vi: 'Tránh khuấy nền; khoảng 48 giờ sau hãy hút (xi-phông) lớp bụi cặn đã lắng.', id: 'Hindari mengaduk substrat; sifon debu yang sudah mengendap sekitar 48 jam lagi.', de: 'Wühlen Sie den Bodengrund nicht auf; saugen Sie den abgesetzten Staub nach etwa 48 Stunden ab.' },
        'act.green_light': { en: 'Shorten the lighting period to about 6 hours and block direct sunlight on the tank.', pt: 'Reduza o fotoperíodo para cerca de 6 horas e bloqueie a luz solar direta no aquário.', es: 'Acorta el fotoperiodo a unas 6 horas y bloquea la luz solar directa sobre el acuario.', vi: 'Rút ngắn thời gian chiếu sáng còn khoảng 6 giờ và che ánh nắng trực tiếp chiếu vào bể.', id: 'Persingkat lama penyinaran menjadi sekitar 6 jam dan halangi sinar matahari langsung ke akuarium.', de: 'Verkürzen Sie die Beleuchtungsdauer auf etwa 6 Stunden und schirmen Sie direktes Sonnenlicht vom Becken ab.' },
        'act.green_feed': { en: 'Reduce feeding, and consider floating plants to compete for nutrients.', pt: 'Reduza a alimentação e considere colocar plantas flutuantes para competir pelos nutrientes.', es: 'Reduce la alimentación y considera añadir plantas flotantes que compitan por los nutrientes.', vi: 'Giảm lượng thức ăn và cân nhắc thả cây thủy sinh nổi để cạnh tranh dinh dưỡng.', id: 'Kurangi pakan, dan pertimbangkan tanaman apung untuk bersaing memperebutkan nutrisi.', de: 'Füttern Sie weniger und ziehen Sie Schwimmpflanzen in Betracht, die mit den Algen um Nährstoffe konkurrieren.' },
        'act.haze_reshoot': { en: 'No structural change yet - re-shoot the same angle in 24 hours and compare again; act only if the haze number climbs.', pt: 'Nenhuma mudança estrutural por enquanto - fotografe o mesmo ângulo daqui a 24 horas e compare de novo; aja apenas se o valor de turbidez subir.', es: 'No hagas cambios estructurales por ahora - vuelve a fotografiar desde el mismo ángulo dentro de 24 horas y compara de nuevo; actúa solo si sube el valor de turbidez.', vi: 'Chưa cần thay đổi gì - chụp lại cùng góc sau 24 giờ và so sánh lần nữa; chỉ hành động nếu chỉ số độ đục tăng lên.', id: 'Belum perlu perubahan besar - foto ulang dari sudut yang sama 24 jam lagi dan bandingkan lagi; bertindaklah hanya jika angka kekeruhan naik.', de: 'Noch keine grundlegende Änderung - fotografieren Sie in 24 Stunden erneut aus demselben Blickwinkel und vergleichen Sie noch einmal; handeln Sie nur, wenn der Trübungswert steigt.' },
        'act.overstocked': { en: 'The stocking estimate is high for this volume - increase water-change cadence and consider rehoming the heaviest-waste species.', pt: 'A estimativa de povoamento está alta para este volume - aumente a frequência das trocas de água e considere realocar as espécies que mais produzem resíduos.', es: 'La densidad de población estimada es alta para este volumen - aumenta la frecuencia de los cambios de agua y considera reubicar las especies que más desechos producen.', vi: 'Mật độ nuôi ước tính khá cao so với thể tích này - hãy thay nước thường xuyên hơn và cân nhắc chuyển bớt những loài thải nhiều nhất sang bể khác.', id: 'Perkiraan kepadatan tinggi untuk volume ini - tingkatkan frekuensi ganti air dan pertimbangkan untuk memindahkan spesies yang paling banyak menghasilkan limbah ke akuarium atau pemelihara lain.', de: 'Der geschätzte Besatz ist für dieses Volumen hoch - wechseln Sie das Wasser häufiger und erwägen Sie, die Arten mit der höchsten Abfallproduktion abzugeben.' },
        'act.heavy': { en: 'Stocking runs heavy for this volume - keep a weekly 25-30% water-change rhythm.', pt: 'O povoamento está alto para este volume - mantenha um ritmo semanal de trocas de 25-30% da água.', es: 'La densidad de población es alta para este volumen - mantén un ritmo semanal de cambios del 25-30% del agua.', vi: 'Mật độ nuôi khá dày so với thể tích này - hãy duy trì thay 25-30% nước mỗi tuần.', id: 'Kepadatan cukup tinggi untuk volume ini - pertahankan ritme ganti air 25-30% setiap minggu.', de: 'Der Besatz ist für dieses Volumen hoch - halten Sie einen wöchentlichen Wasserwechsel von 25-30 % ein.' },
        'act.none': { en: 'Nothing to fix from these two photos - keep the current maintenance cadence and save a comparison photo weekly.', pt: 'Nada a corrigir com base nestas duas fotos - mantenha a rotina de manutenção atual e salve uma foto de comparação toda semana.', es: 'Nada que corregir según estas dos fotos - mantén la rutina de mantenimiento actual y guarda una foto de comparación cada semana.', vi: 'Không có gì cần khắc phục từ hai ảnh này - hãy giữ nhịp bảo dưỡng hiện tại và lưu một ảnh so sánh mỗi tuần.', id: 'Tidak ada yang perlu diperbaiki dari dua foto ini - pertahankan jadwal perawatan saat ini dan simpan foto pembanding setiap minggu.', de: 'Nach diesen beiden Fotos gibt es nichts zu beheben - behalten Sie den aktuellen Pflegerhythmus bei und speichern Sie wöchentlich ein Vergleichsfoto.' },

        'status.vid_need_ff': { en: 'This browser cannot decode this clip itself (common with iPhone HEVC video). It can be decoded on this device instead: the decoder downloads about {mb} MB once, and the clip still never leaves this device.', pt: 'Este navegador não consegue decodificar este vídeo sozinho (comum com vídeo HEVC do iPhone). Ele pode ser decodificado neste dispositivo: o decodificador baixa cerca de {mb} MB uma vez, e o vídeo continua sem sair deste dispositivo.', es: 'Este navegador no puede decodificar este video por sí mismo (es habitual con video HEVC del iPhone). Se puede decodificar en este dispositivo: el decodificador descarga unos {mb} MB una vez y el video sigue sin salir de este dispositivo.', vi: 'Trình duyệt này không tự giải mã được video này (thường gặp với video HEVC từ iPhone). Có thể giải mã ngay trên thiết bị này: bộ giải mã tải khoảng {mb} MB một lần, và video vẫn không rời khỏi thiết bị.', id: 'Browser ini tidak bisa mendekode video ini sendiri (umum terjadi pada video HEVC dari iPhone). Video bisa didekode di perangkat ini: dekoder diunduh sekali sekitar {mb} MB, dan video tetap tidak keluar dari perangkat ini.', de: 'Dieser Browser kann diesen Clip nicht selbst dekodieren (häufig bei HEVC-Videos vom iPhone). Er kann stattdessen auf diesem Gerät dekodiert werden: Der Decoder lädt einmalig etwa {mb} MB, und der Clip verlässt dieses Gerät trotzdem nie.' },
        'status.vid_too_large': { en: 'This browser cannot decode this clip, and at {size} it is too large for the on-device decoder (limit 1 GB). Trim the clip or export a shorter one, then add it again.', pt: 'Este navegador não consegue decodificar este vídeo, e com {size} ele é grande demais para o decodificador no dispositivo (limite de 1 GB). Corte o vídeo ou exporte um trecho mais curto e adicione de novo.', es: 'Este navegador no puede decodificar este video y, con {size}, es demasiado grande para el decodificador en el dispositivo (límite de 1 GB). Recorta el video o exporta uno más corto y vuelve a añadirlo.', vi: 'Trình duyệt này không giải mã được video này, và với dung lượng {size} thì video quá lớn cho bộ giải mã trên thiết bị (giới hạn 1 GB). Hãy cắt ngắn video hoặc xuất một đoạn ngắn hơn rồi thêm lại.', id: 'Browser ini tidak bisa mendekode video ini, dan dengan ukuran {size} video terlalu besar untuk dekoder di perangkat (batas 1 GB). Potong video atau ekspor versi yang lebih pendek, lalu tambahkan lagi.', de: 'Dieser Browser kann diesen Clip nicht dekodieren, und mit {size} ist er zu groß für den Decoder auf dem Gerät (Grenze 1 GB). Kürzen Sie den Clip oder exportieren Sie einen kürzeren und fügen Sie ihn erneut hinzu.' },
        'status.vid_decoding': { en: 'Reading frames on this device... {done} of {total}', pt: 'Lendo os quadros neste dispositivo... {done} de {total}', es: 'Leyendo los fotogramas en este dispositivo... {done} de {total}', vi: 'Đang đọc khung hình trên thiết bị này... {done}/{total}', id: 'Membaca bingkai di perangkat ini... {done} dari {total}', de: 'Bilder werden auf diesem Gerät gelesen... {done} von {total}' },
        'status.ff_download': { en: 'Downloading the on-device decoder... {pct} of about {mb} MB', pt: 'Baixando o decodificador para o dispositivo... {pct} de cerca de {mb} MB', es: 'Descargando el decodificador en el dispositivo... {pct} de unos {mb} MB', vi: 'Đang tải bộ giải mã về thiết bị... {pct} / khoảng {mb} MB', id: 'Mengunduh dekoder untuk perangkat ini... {pct} dari sekitar {mb} MB', de: 'Der Decoder für dieses Gerät wird geladen... {pct} von etwa {mb} MB' },
        'status.ff_starting': { en: 'Starting the on-device decoder...', pt: 'Iniciando o decodificador no dispositivo...', es: 'Iniciando el decodificador en el dispositivo...', vi: 'Đang khởi động bộ giải mã trên thiết bị...', id: 'Memulai dekoder di perangkat...', de: 'Der Decoder auf dem Gerät wird gestartet...' },
        'status.ff_decoding': { en: 'Decoding on this device... {done} of {total} s', pt: 'Decodificando neste dispositivo... {done} de {total} s', es: 'Decodificando en este dispositivo... {done} de {total} s', vi: 'Đang giải mã trên thiết bị này... {done}/{total} giây', id: 'Mendekode di perangkat ini... {done} dari {total} detik', de: 'Dekodierung auf diesem Gerät... {done} von {total} s' },
        'status.vid_analyzing': { en: 'Analyzing fish movement on this device...', pt: 'Analisando o movimento dos peixes neste dispositivo...', es: 'Analizando el movimiento de los peces en este dispositivo...', vi: 'Đang phân tích chuyển động của cá trên thiết bị này...', id: 'Menganalisis gerakan ikan di perangkat ini...', de: 'Die Fischbewegung wird auf diesem Gerät analysiert...' },
        'status.vid_done': { en: { one: 'Done - {n} frame analyzed on this device, nothing uploaded.', other: 'Done - {n} frames analyzed on this device, nothing uploaded.' }, pt: { one: 'Pronto - {n} quadro analisado neste dispositivo, nada foi enviado.', other: 'Pronto - {n} quadros analisados neste dispositivo, nada foi enviado.' }, es: { one: 'Listo - {n} fotograma analizado en este dispositivo, no se subió nada.', other: 'Listo - {n} fotogramas analizados en este dispositivo, no se subió nada.' }, vi: 'Xong - đã phân tích {n} khung hình trên thiết bị này, không tải lên gì cả.', id: 'Selesai - {n} bingkai dianalisis di perangkat ini, tidak ada yang diunggah.', de: { one: 'Fertig - {n} Bild auf diesem Gerät analysiert, nichts hochgeladen.', other: 'Fertig - {n} Bilder auf diesem Gerät analysiert, nichts hochgeladen.' } },
        'status.vid_aborted': { en: 'Stopped - nothing was analyzed. Press the analyze button to start again.', pt: 'Interrompido - nada foi analisado. Toque no botão de analisar para começar de novo.', es: 'Detenido - no se analizó nada. Pulsa el botón de analizar para empezar de nuevo.', vi: 'Đã dừng - chưa phân tích gì. Bấm nút phân tích để bắt đầu lại.', id: 'Dihentikan - belum ada yang dianalisis. Tekan tombol analisis untuk memulai lagi.', de: 'Abgebrochen - es wurde nichts analysiert. Starten Sie die Analyse über die Schaltfläche erneut.' },
        'status.vid_native_failed': { en: 'This browser could not read the clip ({reason}). It can be decoded on this device instead: the decoder downloads about {mb} MB once.', pt: 'Este navegador não conseguiu ler o vídeo ({reason}). Ele pode ser decodificado neste dispositivo: o decodificador baixa cerca de {mb} MB uma vez.', es: 'Este navegador no pudo leer el video ({reason}). Se puede decodificar en este dispositivo: el decodificador descarga unos {mb} MB una vez.', vi: 'Trình duyệt này không đọc được video ({reason}). Có thể giải mã ngay trên thiết bị này: bộ giải mã tải khoảng {mb} MB một lần.', id: 'Browser ini tidak bisa membaca video ({reason}). Video bisa didekode di perangkat ini: dekoder diunduh sekali sekitar {mb} MB.', de: 'Dieser Browser konnte den Clip nicht lesen ({reason}). Er kann stattdessen auf diesem Gerät dekodiert werden: Der Decoder lädt einmalig etwa {mb} MB.' },
        'status.vid_ff_failed': { en: 'The on-device decoder could not read this clip ({reason}). Try exporting it again as MP4 from your phone or video app.', pt: 'O decodificador no dispositivo não conseguiu ler este vídeo ({reason}). Tente exportá-lo de novo como MP4 pelo celular ou pelo app de vídeo.', es: 'El decodificador en el dispositivo no pudo leer este video ({reason}). Intenta exportarlo de nuevo como MP4 desde el teléfono o la app de video.', vi: 'Bộ giải mã trên thiết bị không đọc được video này ({reason}). Hãy thử xuất lại video dưới dạng MP4 từ điện thoại hoặc ứng dụng video.', id: 'Dekoder di perangkat tidak bisa membaca video ini ({reason}). Coba ekspor ulang sebagai MP4 dari ponsel atau aplikasi video Anda.', de: 'Der Decoder auf dem Gerät konnte diesen Clip nicht lesen ({reason}). Versuchen Sie, ihn vom Handy oder aus der Video-App erneut als MP4 zu exportieren.' },
        'status.vid_analysis_failed': { en: 'The movement analysis could not finish on this device. Try a shorter or steadier clip.', pt: 'A análise de movimento não pôde ser concluída neste dispositivo. Tente um vídeo mais curto ou mais estável.', es: 'El análisis de movimiento no pudo terminar en este dispositivo. Intenta con un video más corto o más estable.', vi: 'Không thể hoàn tất phân tích chuyển động trên thiết bị này. Hãy thử một video ngắn hơn hoặc quay ổn định hơn.', id: 'Analisis gerakan tidak dapat diselesaikan di perangkat ini. Coba video yang lebih pendek atau lebih stabil.', de: 'Die Bewegungsanalyse konnte auf diesem Gerät nicht abgeschlossen werden. Versuchen Sie es mit einem kürzeren oder ruhigeren Clip.' },
        'status.vid_declined': { en: 'No download started. To check this clip without the decoder, open this page in a browser that plays this format (Safari plays iPhone HEVC), or convert the clip to H.264 MP4 first.', pt: 'Nenhum download foi iniciado. Para verificar este vídeo sem o decodificador, abra esta página em um navegador que reproduza este formato (o Safari reproduz HEVC do iPhone) ou converta o vídeo para MP4 H.264 antes.', es: 'No se inició ninguna descarga. Para revisar este video sin el decodificador, abre esta página en un navegador que reproduzca este formato (Safari reproduce HEVC del iPhone) o convierte antes el video a MP4 H.264.', vi: 'Chưa tải gì cả. Để kiểm tra video này mà không cần bộ giải mã, hãy mở trang này bằng một trình duyệt phát được định dạng này (Safari phát được HEVC từ iPhone), hoặc chuyển video sang MP4 H.264 trước.', id: 'Tidak ada unduhan yang dimulai. Untuk memeriksa video ini tanpa dekoder, buka halaman ini di browser yang bisa memutar format ini (Safari bisa memutar HEVC dari iPhone), atau ubah dulu video ke MP4 H.264.', de: 'Es wurde nichts heruntergeladen. Um diesen Clip ohne den Decoder zu prüfen, öffnen Sie diese Seite in einem Browser, der dieses Format abspielt (Safari spielt iPhone-HEVC ab), oder wandeln Sie den Clip vorher in H.264-MP4 um.' },

        'vid.v.camera_moved.title': { en: 'Camera moved - cannot analyze', pt: 'A câmera se mexeu - não dá para analisar', es: 'La cámara se movió - no se puede analizar', vi: 'Máy quay bị xê dịch - không phân tích được', id: 'Kamera bergerak - tidak bisa dianalisis', de: 'Kamera hat sich bewegt - keine Analyse möglich' },
        'vid.v.camera_moved.note': { en: 'The whole picture shifted or zoomed during the clip, so the movement of the fish cannot be separated from the movement of the camera.', pt: 'A imagem inteira se deslocou ou mudou de zoom durante o vídeo, então não dá para separar o movimento dos peixes do movimento da câmera.', es: 'Toda la imagen se desplazó o cambió de zoom durante el video, así que no se puede separar el movimiento de los peces del de la cámara.', vi: 'Toàn bộ khung hình bị dịch chuyển hoặc thay đổi độ phóng to trong video, nên không thể tách chuyển động của cá khỏi chuyển động của máy quay.', id: 'Seluruh gambar bergeser atau berubah zoom selama video, sehingga gerakan ikan tidak bisa dipisahkan dari gerakan kamera.', de: 'Das ganze Bild hat sich während des Clips verschoben oder gezoomt, deshalb lässt sich die Bewegung der Fische nicht von der Bewegung der Kamera trennen.' },
        'vid.v.no_motion.title': { en: 'No reliable fish movement detected', pt: 'Nenhum movimento confiável de peixes detectado', es: 'No se detectó un movimiento fiable de peces', vi: 'Không phát hiện được chuyển động đáng tin cậy của cá', id: 'Tidak terdeteksi gerakan ikan yang dapat diandalkan', de: 'Keine verlässliche Fischbewegung erkannt' },
        'vid.v.no_motion.note': { en: 'Too little movement was tracked to describe how the fish behave. This says nothing about water quality.', pt: 'O movimento rastreado foi pouco demais para descrever o comportamento dos peixes. Isso não diz nada sobre a qualidade da água.', es: 'Se pudo seguir muy poco movimiento para describir cómo se comportan los peces. Esto no dice nada sobre la calidad del agua.', vi: 'Ghi nhận được quá ít chuyển động để mô tả hành vi của cá. Điều này không nói lên gì về chất lượng nước.', id: 'Gerakan yang terlacak terlalu sedikit untuk menggambarkan perilaku ikan. Ini tidak menunjukkan apa pun tentang kualitas air.', de: 'Es wurde zu wenig Bewegung verfolgt, um das Verhalten der Fische zu beschreiben. Über die Wasserqualität sagt das nichts aus.' },
        'vid.v.surface_crowding.title': { en: 'Surface crowding pattern', pt: 'Padrão de aglomeração na superfície', es: 'Patrón de aglomeración en la superficie', vi: 'Dấu hiệu cá tụ tập sát mặt nước', id: 'Pola ikan berkumpul di permukaan', de: 'Muster: Gedränge an der Oberfläche' },
        'vid.v.surface_crowding.note': { en: 'Fish holding at the surface are often trying to reach oxygen-rich water - a common sign of low dissolved oxygen, warm water, or ammonia or nitrite irritating the gills. Normal for surface species (bettas, gouramis, hatchetfish) - judge against your stock.', pt: 'Peixes parados na superfície muitas vezes estão buscando água mais rica em oxigênio - um sinal comum de pouco oxigênio dissolvido, água quente, ou amônia ou nitrito irritando as brânquias. É normal em espécies de superfície (bettas, gouramis, peixes-machadinha) - compare com os peixes que você tem.', es: 'Los peces que se quedan en la superficie suelen buscar agua con más oxígeno - una señal común de poco oxígeno disuelto, agua caliente, o amoníaco o nitrito que irritan las branquias. Es normal en especies de superficie (bettas, guramis, peces hacha) - valóralo según las especies que tienes.', vi: 'Cá lởn vởn sát mặt nước thường là đang tìm vùng nước giàu oxy - dấu hiệu thường gặp khi oxy hòa tan thấp, nước quá ấm, hoặc amoniac hay nitrit gây kích ứng mang. Điều này bình thường với các loài sống ở tầng mặt (cá betta, cá sặc, cá rìu) - hãy đối chiếu với loài bạn nuôi.', id: 'Ikan yang bertahan di permukaan sering sedang mencari air yang kaya oksigen - tanda umum oksigen terlarut rendah, air hangat, atau amonia maupun nitrit yang mengiritasi insang. Wajar untuk spesies permukaan (cupang, sepat/gurami hias, ikan kapak) - bandingkan dengan ikan yang Anda pelihara.', de: 'Fische, die sich an der Oberfläche halten, suchen oft sauerstoffreicheres Wasser - ein häufiges Zeichen für einen niedrigen Sauerstoffgehalt, zu warmes Wasser oder Ammoniak bzw. Nitrit, das die Kiemen reizt. Normal bei Oberflächenarten (Kampffische, Guramis, Beilbauchsalmler) - beurteilen Sie es im Hinblick auf Ihren Besatz.' },
        'vid.v.restless.title': { en: 'Restless / darting', pt: 'Inquietos / arrancadas', es: 'Inquietud / arrancadas', vi: 'Bồn chồn / lao đi đột ngột', id: 'Gelisah / melesat tiba-tiba', de: 'Unruhig / plötzliches Davonschießen' },
        'vid.v.restless.note': { en: 'Frequent sudden bursts can follow irritation (ammonia, chlorine or chloramine after a water change, a pH swing), chasing by a tank mate, or simply being startled.', pt: 'Arrancadas súbitas frequentes podem vir de irritação (amônia, cloro ou cloramina depois de uma troca de água, uma oscilação de pH), de perseguição por outro peixe ou simplesmente de um susto.', es: 'Las arrancadas bruscas frecuentes pueden deberse a irritación (amoníaco, cloro o cloramina después de un cambio de agua, un cambio brusco de pH), a que otro pez lo persiga o simplemente a un susto.', vi: 'Cá thường xuyên lao đi đột ngột có thể do bị kích ứng (amoniac, clo hoặc cloramin sau khi thay nước, pH dao động), bị cá khác rượt đuổi, hoặc chỉ đơn giản là bị giật mình.', id: 'Sering melesat tiba-tiba bisa terjadi karena iritasi (amonia, klorin atau kloramin setelah ganti air, pH yang naik turun), dikejar ikan lain, atau sekadar kaget.', de: 'Häufiges plötzliches Davonschießen kann auf eine Reizung folgen (Ammoniak, Chlor oder Chloramin nach einem Wasserwechsel, eine pH-Schwankung), auf Verfolgung durch einen Beckengenossen oder einfach auf einen Schreck.' },
        'vid.v.low_bottom.title': { en: 'Low activity near the bottom', pt: 'Pouca atividade perto do fundo', es: 'Poca actividad cerca del fondo', vi: 'Ít hoạt động ở gần đáy', id: 'Aktivitas rendah di dekat dasar', de: 'Wenig Aktivität am Boden' },
        'vid.v.low_bottom.note': { en: 'Normal for bottom dwellers (corydoras, plecos, loaches) and for fish resting right after lights-on; for mid-water fish, lying low can follow cold water, poor water quality or illness.', pt: 'É normal em peixes de fundo (coridoras, cascudos, botias) e em peixes descansando logo depois que a luz acende; em peixes de meia-água, ficar no fundo pode vir de água fria, água de má qualidade ou doença.', es: 'Es normal en peces de fondo (corydoras, plecos, botias) y en peces que descansan justo después de encender la luz; en peces de media agua, quedarse abajo puede deberse a agua fría, mala calidad del agua o enfermedad.', vi: 'Bình thường với các loài sống ở tầng đáy (cá chuột, cá tỳ bà, cá heo) và với cá đang nghỉ ngay sau khi bật đèn; với cá tầng giữa, việc nằm sát đáy có thể do nước lạnh, chất lượng nước kém hoặc cá bị bệnh.', id: 'Wajar untuk ikan dasar (corydoras, sapu-sapu, botia) dan untuk ikan yang beristirahat tepat setelah lampu menyala; untuk ikan perenang tengah, diam di bawah bisa terjadi karena air dingin, kualitas air buruk, atau sakit.', de: 'Normal bei Bodenbewohnern (Panzerwelse, Harnischwelse, Schmerlen) und bei Fischen, die gleich nach dem Einschalten des Lichts ruhen; bei Fischen der mittleren Wasserschicht kann das Liegen am Boden auf kaltes Wasser, schlechte Wasserqualität oder Krankheit folgen.' },
        'vid.v.low_activity.title': { en: 'Low activity', pt: 'Pouca atividade', es: 'Poca actividad', vi: 'Ít hoạt động', id: 'Aktivitas rendah', de: 'Wenig Aktivität' },
        'vid.v.low_activity.note': { en: 'Most fish moved very little in this clip. That can be rest, cool water, or a water-quality issue.', pt: 'A maioria dos peixes se mexeu muito pouco neste vídeo. Pode ser descanso, água fria ou um problema na qualidade da água.', es: 'La mayoría de los peces se movió muy poco en este video. Puede ser descanso, agua fría o un problema de calidad del agua.', vi: 'Phần lớn cá di chuyển rất ít trong video này. Có thể do cá đang nghỉ, nước lạnh, hoặc chất lượng nước có vấn đề.', id: 'Sebagian besar ikan hanya sedikit bergerak di video ini. Bisa karena istirahat, air dingin, atau masalah kualitas air.', de: 'Die meisten Fische haben sich in diesem Clip kaum bewegt. Ursache kann Ruhe, kühles Wasser oder ein Problem mit der Wasserqualität sein.' },
        'vid.v.unseen_fish.title': { en: 'Fewer moving fish than stocked', pt: 'Menos peixes em movimento do que o informado', es: 'Menos peces en movimiento que los indicados', vi: 'Số cá chuyển động ít hơn số cá đang nuôi', id: 'Ikan yang bergerak lebih sedikit dari jumlah yang dipelihara', de: 'Weniger Fische in Bewegung als eingetragen' },
        'vid.v.unseen_fish.note': { en: 'Fish that do not move at all for the whole clip are invisible to this check. They may be hiding or resting - or too weak to swim.', pt: 'Peixes que não se mexem durante todo o vídeo ficam invisíveis para esta verificação. Eles podem estar escondidos ou descansando - ou fracos demais para nadar.', es: 'Los peces que no se mueven nada durante todo el video son invisibles para esta comprobación. Pueden estar escondidos o descansando - o demasiado débiles para nadar.', vi: 'Phép kiểm tra này không nhìn thấy những con cá đứng yên suốt cả video. Chúng có thể đang trốn hoặc nghỉ - hoặc quá yếu để bơi.', id: 'Ikan yang sama sekali tidak bergerak sepanjang video tidak terlihat oleh pemeriksaan ini. Ikan itu mungkin bersembunyi atau beristirahat - atau terlalu lemah untuk berenang.', de: 'Fische, die sich während des ganzen Clips gar nicht bewegen, sind für diese Prüfung unsichtbar. Sie verstecken sich vielleicht oder ruhen - oder sind zu schwach zum Schwimmen.' },
        'vid.v.calm_spread.title': { en: 'Calm, spread out', pt: 'Calmos e espalhados', es: 'Tranquilos y repartidos', vi: 'Bình thản, bơi tản ra', id: 'Tenang, menyebar', de: 'Ruhig, gut verteilt' },
        'vid.v.calm_group.title': { en: 'Calm, swimming as a group', pt: 'Calmos, nadando em grupo', es: 'Tranquilos, nadando en grupo', vi: 'Bình thản, bơi theo đàn', id: 'Tenang, berenang berkelompok', de: 'Ruhig, in der Gruppe schwimmend' },
        'vid.v.calm.note': { en: 'No behavior red flag in this clip. Fish can look normal while ammonia is rising - keep testing.', pt: 'Nenhum sinal de alerta no comportamento neste vídeo. Os peixes podem parecer normais enquanto a amônia sobe - continue testando.', es: 'No hay señales de alerta en el comportamiento en este video. Los peces pueden parecer normales mientras sube el amoníaco - sigue analizando el agua.', vi: 'Không có dấu hiệu bất thường trong hành vi ở video này. Cá vẫn có thể trông bình thường trong khi amoniac đang tăng - hãy tiếp tục kiểm tra nước.', id: 'Tidak ada tanda bahaya pada perilaku di video ini. Ikan bisa terlihat normal saat amonia sedang naik - tetap uji airnya.', de: 'In diesem Clip gibt es kein Warnzeichen im Verhalten. Fische können normal wirken, während der Ammoniakwert steigt - testen Sie das Wasser weiterhin.' },
        'vid.v.inconclusive.title': { en: 'Mixed / inconclusive', pt: 'Misto / inconclusivo', es: 'Mixto / no concluyente', vi: 'Lẫn lộn / chưa rõ ràng', id: 'Campuran / belum jelas', de: 'Gemischt / nicht eindeutig' },
        'vid.v.inconclusive.note': { en: 'The movement pattern did not match a clear profile.', pt: 'O padrão de movimento não correspondeu a um perfil claro.', es: 'El patrón de movimiento no coincidió con un perfil claro.', vi: 'Kiểu chuyển động không khớp với một dạng rõ ràng nào.', id: 'Pola gerakan tidak cocok dengan profil yang jelas.', de: 'Das Bewegungsmuster passte zu keinem klaren Profil.' },
        'vid.also': { en: 'Also seen in this clip:', pt: 'Também visto neste vídeo:', es: 'También se ve en este video:', vi: 'Cũng thấy trong video này:', id: 'Juga terlihat di video ini:', de: 'Außerdem in diesem Clip:' },
        'vid.ev_head': { en: 'Based on:', pt: 'Com base em:', es: 'Basado en:', vi: 'Dựa trên:', id: 'Berdasarkan:', de: 'Grundlage:' },
        'vid.ev.tracked': { en: { one: 'Fish movement tracked for {sec} second in total (at least {need} needed).', other: 'Fish movement tracked for {sec} seconds in total (at least {need} needed).' }, pt: { one: 'Movimento dos peixes rastreado por {sec} segundo no total (são necessários pelo menos {need}).', other: 'Movimento dos peixes rastreado por {sec} segundos no total (são necessários pelo menos {need}).' }, es: { one: 'Movimiento de los peces seguido durante {sec} segundo en total (se necesitan al menos {need}).', other: 'Movimiento de los peces seguido durante {sec} segundos en total (se necesitan al menos {need}).' }, vi: 'Đã theo dõi chuyển động của cá tổng cộng {sec} giây (cần ít nhất {need}).', id: 'Gerakan ikan terlacak total {sec} detik (perlu minimal {need}).', de: { one: 'Fischbewegung insgesamt {sec} Sekunde verfolgt (mindestens {need} nötig).', other: 'Fischbewegung insgesamt {sec} Sekunden verfolgt (mindestens {need} nötig).' } },
        'vid.ev.surface': { en: '{share} of fish sightings were in the top {band} of the water.', pt: '{share} das aparições de peixes foram nos {band} superiores da água.', es: 'El {share} de las apariciones de peces estuvo en el {band} superior del agua.', vi: 'Cá xuất hiện ở {band} trên cùng của cột nước trong {share} số lần ghi nhận.', id: '{share} kemunculan ikan berada di {band} bagian atas air.', de: '{share} der Fischsichtungen lagen in den oberen {band} des Wassers.' },
        'vid.ev.corners': { en: '{share} of fish sightings were in the upper corners of the water (top third, near the side walls).', pt: '{share} das aparições de peixes foram nos cantos superiores da água (terço superior, perto das laterais).', es: 'El {share} de las apariciones de peces estuvo en las esquinas superiores del agua (tercio superior, cerca de los laterales).', vi: 'Cá xuất hiện ở các góc trên của cột nước (một phần ba trên cùng, sát hai bên thành bể) trong {share} số lần ghi nhận.', id: '{share} kemunculan ikan berada di sudut atas air (sepertiga atas, dekat dinding samping).', de: '{share} der Fischsichtungen lagen in den oberen Ecken des Wassers (oberes Drittel, nahe den Seitenscheiben).' },
        'vid.ev.tiers': { en: 'Top / middle / bottom thirds: {top} / {mid} / {bottom}.', pt: 'Terços superior / médio / inferior: {top} / {mid} / {bottom}.', es: 'Tercios superior / medio / inferior: {top} / {mid} / {bottom}.', vi: 'Một phần ba trên / giữa / dưới: {top} / {mid} / {bottom}.', id: 'Sepertiga atas / tengah / bawah: {top} / {mid} / {bottom}.', de: 'Oberes / mittleres / unteres Drittel: {top} / {mid} / {bottom}.' },
        'vid.ev.speed': { en: 'Median speed {v} body lengths per second.', pt: 'Velocidade mediana de {v} comprimentos do corpo por segundo.', es: 'Velocidad mediana de {v} longitudes corporales por segundo.', vi: 'Tốc độ trung vị {v} lần chiều dài thân mỗi giây.', id: 'Kecepatan median {v} panjang tubuh per detik.', de: 'Mittlere Geschwindigkeit (Median): {v} Körperlängen pro Sekunde.' },
        'vid.ev.grouping': { en: 'Spacing index {r} (below 1 means the fish stay close together).', pt: 'Índice de espaçamento {r} (abaixo de 1 significa que os peixes ficam próximos).', es: 'Índice de separación {r} (por debajo de 1 significa que los peces se mantienen juntos).', vi: 'Chỉ số khoảng cách {r} (dưới 1 nghĩa là cá ở gần nhau).', id: 'Indeks jarak {r} (di bawah 1 berarti ikan saling berdekatan).', de: 'Abstandsindex {r} (unter 1 heißt, die Fische bleiben dicht beieinander).' },
        'vid.ev.bursts': { en: { one: '{n} sudden burst or sharp turn per fish per minute.', other: '{n} sudden bursts or sharp turns per fish per minute.' }, pt: { one: '{n} arrancada súbita ou curva fechada por peixe por minuto.', other: '{n} arrancadas súbitas ou curvas fechadas por peixe por minuto.' }, es: { one: '{n} arrancada brusca o giro cerrado por pez y minuto.', other: '{n} arrancadas bruscas o giros cerrados por pez y minuto.' }, vi: '{n} lần lao đi đột ngột hoặc quay ngoắt, tính trên mỗi con cá mỗi phút.', id: '{n} lesatan tiba-tiba atau belokan tajam per ikan per menit.', de: { one: '{n} plötzlicher Sprint oder scharfe Wendung pro Fisch und Minute.', other: '{n} plötzliche Sprints oder scharfe Wendungen pro Fisch und Minute.' } },
        'vid.ev.rest_bottom': { en: 'About {n} fish nearly still (under 0.3 body lengths per second) in the bottom third.', pt: { one: 'Cerca de {n} peixe quase parado (menos de 0,3 comprimento do corpo por segundo) no terço inferior.', other: 'Cerca de {n} peixes quase parados (menos de 0,3 comprimento do corpo por segundo) no terço inferior.' }, es: { one: 'Alrededor de {n} pez casi quieto (menos de 0,3 longitudes corporales por segundo) en el tercio inferior.', other: 'Unos {n} peces casi quietos (menos de 0,3 longitudes corporales por segundo) en el tercio inferior.' }, vi: 'Khoảng {n} con cá gần như đứng yên (dưới 0,3 lần chiều dài thân mỗi giây) ở một phần ba dưới cùng.', id: 'Sekitar {n} ikan hampir diam (di bawah 0,3 panjang tubuh per detik) di sepertiga bawah.', de: { one: 'Etwa {n} Fisch fast regungslos (unter 0,3 Körperlängen pro Sekunde) im unteren Drittel.', other: 'Etwa {n} Fische fast regungslos (unter 0,3 Körperlängen pro Sekunde) im unteren Drittel.' } },
        'vid.ev.stillness': { en: 'Nearly still in {share} of the 1-second windows.', pt: 'Quase parados em {share} das janelas de 1 segundo.', es: 'Casi quietos en el {share} de las ventanas de 1 segundo.', vi: 'Gần như đứng yên trong {share} số khoảng thời gian 1 giây.', id: 'Hampir diam pada {share} jendela waktu 1 detik.', de: 'In {share} der 1-Sekunden-Abschnitte fast regungslos.' },
        'vid.ev.unseen': { en: 'About {n} moving fish seen; listed in your stocking form: {expected}.', pt: { one: 'Cerca de {n} peixe em movimento visto; informados no seu formulário de povoamento: {expected}.', other: 'Cerca de {n} peixes em movimento vistos; informados no seu formulário de povoamento: {expected}.' }, es: { one: 'Se vio alrededor de {n} pez en movimiento; en el formulario de población: {expected}.', other: 'Se vieron unos {n} peces en movimiento; en el formulario de población: {expected}.' }, vi: 'Thấy khoảng {n} con cá chuyển động; số ghi trong biểu mẫu: {expected}.', id: 'Terlihat sekitar {n} ikan bergerak; tercatat di formulir kepadatan: {expected}.', de: { one: 'Etwa {n} Fisch in Bewegung gesehen; im Besatzformular eingetragen: {expected}.', other: 'Etwa {n} Fische in Bewegung gesehen; im Besatzformular eingetragen: {expected}.' } },
        'vid.act.steady': { en: 'Rest the phone on something stable and record again for 15 to 30 seconds.', pt: 'Apoie o celular em algo firme e grave de novo por 15 a 30 segundos.', es: 'Apoya el teléfono en algo estable y vuelve a grabar de 15 a 30 segundos.', vi: 'Đặt điện thoại lên vật cố định rồi quay lại trong 15 đến 30 giây.', id: 'Letakkan ponsel di tempat yang stabil dan rekam lagi selama 15 sampai 30 detik.', de: 'Stellen Sie das Handy auf eine stabile Unterlage und nehmen Sie erneut 15 bis 30 Sekunden auf.' },
        'vid.act.record_better': { en: 'Record 15 to 30 seconds with the camera still, the whole tank in view (water surface at the top edge) and good light.', pt: 'Grave de 15 a 30 segundos com a câmera parada, o aquário inteiro no quadro (superfície da água na borda de cima) e boa luz.', es: 'Graba de 15 a 30 segundos con la cámara quieta, todo el acuario en el encuadre (superficie del agua en el borde superior) y buena luz.', vi: 'Quay 15 đến 30 giây với máy quay giữ yên, cả bể nằm trong khung hình (mặt nước ở mép trên) và đủ ánh sáng.', id: 'Rekam 15 sampai 30 detik dengan kamera diam, seluruh akuarium terlihat (permukaan air di tepi atas) dan cahaya cukup.', de: 'Nehmen Sie 15 bis 30 Sekunden mit ruhiger Kamera auf, das ganze Becken im Bild (Wasseroberfläche am oberen Rand) und bei gutem Licht.' },
        'vid.act.test_usual': { en: 'This is not a statement about water quality - test the water as usual.', pt: 'Isso não é uma avaliação da qualidade da água - teste a água como de costume.', es: 'Esto no es una valoración de la calidad del agua - analiza el agua como siempre.', vi: 'Đây không phải là đánh giá chất lượng nước - hãy kiểm tra nước như thường lệ.', id: 'Ini bukan penilaian kualitas air - uji air seperti biasa.', de: 'Das ist keine Aussage über die Wasserqualität - testen Sie das Wasser wie gewohnt.' },
        'vid.act.aerate': { en: 'Increase surface agitation or aeration now (point the filter outlet at the surface or add an air stone).', pt: 'Aumente agora a agitação da superfície ou a aeração (aponte a saída do filtro para a superfície ou coloque uma pedra porosa).', es: 'Aumenta ya la agitación de la superficie o la aireación (dirige la salida del filtro hacia la superficie o añade un difusor de aire).', vi: 'Tăng khuấy động mặt nước hoặc sục khí ngay (hướng đầu ra của lọc lên mặt nước hoặc thêm sủi oxy).', id: 'Tingkatkan agitasi permukaan atau aerasi sekarang (arahkan aliran keluar filter ke permukaan atau tambahkan batu aerator).', de: 'Verstärken Sie jetzt die Oberflächenbewegung oder Belüftung (Filterauslass auf die Oberfläche richten oder einen Ausströmerstein einsetzen).' },
        'vid.act.test_amm_nit_now': { en: 'Test ammonia and nitrite now.', pt: 'Teste amônia e nitrito agora.', es: 'Mide el amoníaco y el nitrito ahora.', vi: 'Kiểm tra amoniac và nitrit ngay bây giờ.', id: 'Uji amonia dan nitrit sekarang.', de: 'Testen Sie jetzt Ammoniak und Nitrit.' },
        'vid.act.check_temp_warm': { en: 'Check the temperature - warm water holds less oxygen.', pt: 'Confira a temperatura - água quente retém menos oxigênio.', es: 'Revisa la temperatura - el agua caliente retiene menos oxígeno.', vi: 'Kiểm tra nhiệt độ - nước ấm giữ được ít oxy hơn.', id: 'Periksa suhu - air hangat mengandung lebih sedikit oksigen.', de: 'Prüfen Sie die Temperatur - warmes Wasser kann weniger Sauerstoff aufnehmen.' },
        'vid.act.change_water': { en: 'If ammonia or nitrite is above 0: change 25-30% of the water (dechlorinated, same temperature) and repeat daily until both read 0.', pt: 'Se a amônia ou o nitrito estiver acima de 0: troque 25-30% da água (sem cloro, na mesma temperatura) e repita todo dia até os dois marcarem 0.', es: 'Si el amoníaco o el nitrito están por encima de 0: cambia el 25-30% del agua (sin cloro, a la misma temperatura) y repite cada día hasta que ambos marquen 0.', vi: 'Nếu amoniac hoặc nitrit trên 0: thay 25-30% nước (đã khử clo, cùng nhiệt độ) và lặp lại mỗi ngày cho đến khi cả hai về 0.', id: 'Jika amonia atau nitrit di atas 0: ganti 25-30% air (sudah bebas klorin, suhu sama) dan ulangi setiap hari sampai keduanya 0.', de: 'Wenn Ammoniak oder Nitrit über 0 liegt: Wechseln Sie 25-30 % des Wassers (entchlort, gleiche Temperatur) und wiederholen Sie das täglich, bis beide Werte 0 sind.' },
        'vid.act.skip_feed': { en: 'Skip or reduce feeding until the readings are 0.', pt: 'Suspenda ou reduza a alimentação até as leituras chegarem a 0.', es: 'Suspende o reduce la alimentación hasta que las lecturas sean 0.', vi: 'Ngừng hoặc giảm cho ăn cho đến khi các chỉ số về 0.', id: 'Hentikan atau kurangi pakan sampai hasil ujinya 0.', de: 'Setzen Sie das Füttern aus oder reduzieren Sie es, bis die Werte 0 sind.' },
        'vid.act.test_amm_nit_ph': { en: 'Test ammonia, nitrite and pH.', pt: 'Teste amônia, nitrito e pH.', es: 'Mide el amoníaco, el nitrito y el pH.', vi: 'Kiểm tra amoniac, nitrit và pH.', id: 'Uji amonia, nitrit, dan pH.', de: 'Testen Sie Ammoniak, Nitrit und pH-Wert.' },
        'vid.act.conditioner': { en: 'Confirm water conditioner was dosed at the last water change.', pt: 'Confirme se o condicionador de água foi dosado na última troca de água.', es: 'Confirma que se dosificó el acondicionador de agua en el último cambio de agua.', vi: 'Kiểm tra lại xem ở lần thay nước gần nhất đã châm chất xử lý nước (khử clo) chưa.', id: 'Pastikan kondisioner air sudah diberikan saat ganti air terakhir.', de: 'Prüfen Sie, ob beim letzten Wasserwechsel Wasseraufbereiter dosiert wurde.' },
        'vid.act.check_heater': { en: 'Check the temperature and the heater.', pt: 'Confira a temperatura e o aquecedor.', es: 'Revisa la temperatura y el calentador.', vi: 'Kiểm tra nhiệt độ và cây sưởi.', id: 'Periksa suhu dan pemanas.', de: 'Prüfen Sie Temperatur und Heizstab.' },
        'vid.act.watch_chasing': { en: 'Watch for chasing, or fish rubbing on decor - this check cannot see either.', pt: 'Observe se há perseguição ou peixes se esfregando na decoração - esta verificação não consegue ver nenhum dos dois.', es: 'Observa si hay persecuciones o peces que se rozan con la decoración - esta comprobación no puede ver ninguna de las dos cosas.', vi: 'Quan sát xem có cá rượt đuổi nhau hay cá cọ mình vào đồ trang trí không - phép kiểm tra này không nhận ra được hiện tượng nào trong hai hiện tượng đó.', id: 'Perhatikan apakah ada ikan yang saling mengejar atau menggosokkan badan ke dekorasi - pemeriksaan ini tidak bisa melihat keduanya.', de: 'Achten Sie darauf, ob Fische einander jagen oder sich an der Einrichtung scheuern - beides kann diese Prüfung nicht erkennen.' },
        'vid.act.rerecord_quiet': { en: 'Record again after 15 minutes without people moving near the tank.', pt: 'Grave de novo depois de 15 minutos sem pessoas se mexendo perto do aquário.', es: 'Vuelve a grabar después de 15 minutos sin gente moviéndose cerca del acuario.', vi: 'Quay lại sau khi không có ai đi lại gần bể trong 15 phút.', id: 'Rekam lagi setelah 15 menit tanpa ada orang yang bergerak di dekat akuarium.', de: 'Nehmen Sie erneut auf, nachdem sich 15 Minuten lang niemand am Becken bewegt hat.' },
        'vid.act.check_temp': { en: 'Check the temperature.', pt: 'Confira a temperatura.', es: 'Revisa la temperatura.', vi: 'Kiểm tra nhiệt độ.', id: 'Periksa suhu.', de: 'Prüfen Sie die Temperatur.' },
        'vid.act.test_amm_nit_nat': { en: 'Test ammonia, nitrite and nitrate.', pt: 'Teste amônia, nitrito e nitrato.', es: 'Mide el amoníaco, el nitrito y el nitrato.', vi: 'Kiểm tra amoniac, nitrit và nitrat.', id: 'Uji amonia, nitrit, dan nitrat.', de: 'Testen Sie Ammoniak, Nitrit und Nitrat.' },
        'vid.act.offer_food': { en: 'Offer a small pinch of food and watch the response (remove leftovers after 2-3 minutes).', pt: 'Ofereça uma pitada de comida e observe a reação (retire as sobras depois de 2-3 minutos).', es: 'Ofrece una pizca de comida y observa la reacción (retira las sobras después de 2-3 minutos).', vi: 'Cho một nhúm thức ăn nhỏ và quan sát phản ứng (vớt phần thừa sau 2-3 phút).', id: 'Berikan sejumput kecil pakan dan amati responsnya (buang sisa pakan setelah 2-3 menit).', de: 'Geben Sie eine kleine Prise Futter und beobachten Sie die Reaktion (Reste nach 2-3 Minuten entfernen).' },
        'vid.act.rerecord_lights': { en: 'Record again after the lights have been on for 30 minutes.', pt: 'Grave de novo quando a luz já estiver acesa há 30 minutos.', es: 'Vuelve a grabar cuando la luz lleve 30 minutos encendida.', vi: 'Quay lại sau khi đèn đã bật được 30 phút.', id: 'Rekam lagi setelah lampu menyala selama 30 menit.', de: 'Nehmen Sie erneut auf, wenn das Licht seit 30 Minuten eingeschaltet ist.' },
        'vid.act.test_amm_nit': { en: 'Test ammonia and nitrite.', pt: 'Teste amônia e nitrito.', es: 'Mide el amoníaco y el nitrito.', vi: 'Kiểm tra amoniac và nitrit.', id: 'Uji amonia dan nitrit.', de: 'Testen Sie Ammoniak und Nitrit.' },
        'vid.act.rerecord_time': { en: 'Record again at a different time of day.', pt: 'Grave de novo em outro horário do dia.', es: 'Vuelve a grabar a otra hora del día.', vi: 'Quay lại vào một thời điểm khác trong ngày.', id: 'Rekam lagi pada waktu lain dalam sehari.', de: 'Nehmen Sie zu einer anderen Tageszeit erneut auf.' },
        'vid.act.look_missing': { en: 'Look for the missing fish directly (behind decor, in plants, on the bottom).', pt: 'Procure diretamente os peixes que faltam (atrás da decoração, nas plantas, no fundo).', es: 'Busca directamente los peces que faltan (detrás de la decoración, entre las plantas, en el fondo).', vi: 'Tự tìm những con cá còn thiếu (sau đồ trang trí, trong đám cây, dưới đáy).', id: 'Cari langsung ikan yang tidak terlihat (di balik dekorasi, di antara tanaman, di dasar).', de: 'Suchen Sie die fehlenden Fische direkt (hinter der Einrichtung, in den Pflanzen, am Boden).' },
        'vid.act.keep_testing': { en: 'Keep your routine weekly water tests.', pt: 'Continue com os testes de água semanais de rotina.', es: 'Sigue con tus análisis de agua semanales habituales.', vi: 'Duy trì việc kiểm tra nước định kỳ hằng tuần.', id: 'Pertahankan uji air rutin setiap minggu.', de: 'Führen Sie Ihre wöchentlichen Wassertests wie gewohnt weiter durch.' },
        'vid.act.test_amm_nit_temp': { en: 'Test ammonia and nitrite and check the temperature to be sure.', pt: 'Teste amônia e nitrito e confira a temperatura para ter certeza.', es: 'Mide el amoníaco y el nitrito y revisa la temperatura para salir de dudas.', vi: 'Kiểm tra amoniac, nitrit và nhiệt độ cho chắc chắn.', id: 'Uji amonia dan nitrit serta periksa suhu untuk memastikan.', de: 'Testen Sie zur Sicherheit Ammoniak und Nitrit und prüfen Sie die Temperatur.' },
        'vid.act.longer_clip': { en: 'Record a longer, steadier clip.', pt: 'Grave um vídeo mais longo e mais estável.', es: 'Graba un video más largo y más estable.', vi: 'Quay một video dài hơn và ổn định hơn.', id: 'Rekam video yang lebih panjang dan lebih stabil.', de: 'Nehmen Sie einen längeren, ruhigeren Clip auf.' },
        'vid.act.kit': { en: 'Confirm with a water test kit (ammonia, nitrite, nitrate, pH) and a thermometer before changing anything big - movement alone never shows the cause.', pt: 'Confirme com um kit de teste de água (amônia, nitrito, nitrato, pH) e um termômetro antes de qualquer mudança grande - o movimento sozinho nunca mostra a causa.', es: 'Confírmalo con un kit de análisis de agua (amoníaco, nitrito, nitrato, pH) y un termómetro antes de hacer cambios grandes - el movimiento por sí solo nunca muestra la causa.', vi: 'Hãy xác nhận bằng bộ test nước (amoniac, nitrit, nitrat, pH) và nhiệt kế trước khi thay đổi điều gì lớn - riêng chuyển động không bao giờ cho biết nguyên nhân.', id: 'Pastikan dengan kit uji air (amonia, nitrit, nitrat, pH) dan termometer sebelum melakukan perubahan besar - gerakan saja tidak pernah menunjukkan penyebabnya.', de: 'Überprüfen Sie das mit einem Wassertest-Set (Ammoniak, Nitrit, Nitrat, pH) und einem Thermometer, bevor Sie größere Änderungen vornehmen - die Bewegung allein zeigt nie die Ursache.' },
        'vid.h_caveats': { en: 'Limits of this check', pt: 'Limites desta verificação', es: 'Límites de esta comprobación', vi: 'Giới hạn của phép kiểm tra này', id: 'Batasan pemeriksaan ini', de: 'Grenzen dieser Prüfung' },
        'vid.cav.hint': { en: 'Movement is a hint, not a water test: only a test kit and a thermometer tell you what is in the water.', pt: 'O movimento é uma pista, não um teste de água: só um kit de teste e um termômetro dizem o que há na água.', es: 'El movimiento es una pista, no un análisis del agua: solo un kit de análisis y un termómetro te dicen qué hay en el agua.', vi: 'Chuyển động chỉ là gợi ý, không thay cho việc test nước: chỉ bộ test và nhiệt kế mới cho biết trong nước có gì.', id: 'Gerakan hanyalah petunjuk, bukan uji air: hanya kit uji dan termometer yang bisa memberi tahu kondisi air.', de: 'Bewegung ist ein Hinweis, kein Wassertest: Nur ein Wassertest-Set und ein Thermometer zeigen, was im Wasser ist.' },
        'vid.cav.still': { en: 'Fish that stay perfectly still for the whole clip blend into the background and are not counted.', pt: 'Peixes que ficam totalmente parados durante todo o vídeo se misturam ao fundo e não são contados.', es: 'Los peces que se quedan totalmente quietos durante todo el video se funden con el fondo y no se cuentan.', vi: 'Cá đứng yên hoàn toàn suốt cả video sẽ hòa vào nền và không được tính.', id: 'Ikan yang benar-benar diam sepanjang video menyatu dengan latar dan tidak terhitung.', de: 'Fische, die während des ganzen Clips völlig still bleiben, verschmelzen mit dem Hintergrund und werden nicht mitgezählt.' },
        'vid.cav.not_measured': { en: 'Fin condition, gasping mouth movement, color and species are not measured - only where moving shapes are and how they move.', pt: 'O estado das nadadeiras, a boca abrindo em busca de ar, a cor e a espécie não são medidos - apenas onde estão as formas em movimento e como elas se movem.', es: 'El estado de las aletas, el boqueo, el color y la especie no se miden - solo dónde están las formas en movimiento y cómo se mueven.', vi: 'Tình trạng vây, cử động đớp khí của miệng, màu sắc và loài cá không được đo - chỉ đo vị trí của các hình đang chuyển động và cách chúng di chuyển.', id: 'Kondisi sirip, gerakan mulut megap-megap, warna, dan spesies tidak diukur - hanya posisi bentuk yang bergerak dan cara geraknya.', de: 'Flossenzustand, Schnappen nach Luft, Farbe und Art werden nicht gemessen - nur, wo sich bewegende Formen befinden und wie sie sich bewegen.' },
        'vid.cav.bubbles': { en: 'A bubble or air-stone column was found between {from} and {to} of the frame width (from the left) and ignored.', pt: 'Uma coluna de bolhas (de pedra porosa ou similar) foi encontrada entre {from} e {to} da largura do quadro (a partir da esquerda) e ignorada.', es: 'Se encontró una columna de burbujas o de difusor entre el {from} y el {to} del ancho de la imagen (desde la izquierda) y se ignoró.', vi: 'Phát hiện một cột bọt khí hoặc sủi oxy ở khoảng {from} đến {to} chiều rộng khung hình (tính từ trái) và đã bỏ qua.', id: 'Kolom gelembung atau batu aerator ditemukan di antara {from} dan {to} dari lebar bingkai (dari kiri) dan diabaikan.', de: 'Eine Blasen- bzw. Ausströmersäule wurde zwischen {from} und {to} der Bildbreite (von links gemessen) erkannt und ignoriert.' },
        'vid.cav.waterline': { en: 'A shimmering water line was found {pct} from the top; the surface band is measured from it and the shimmer itself is ignored.', pt: 'Uma linha d\'água cintilante foi encontrada a {pct} do topo; a faixa da superfície é medida a partir dela e o brilho em si é ignorado.', es: 'Se encontró la línea de la superficie con reflejos al {pct} desde arriba; la franja de superficie se mide desde ella y los reflejos en sí se ignoran.', vi: 'Phát hiện một đường mặt nước lấp lánh cách mép trên {pct}; dải mặt nước được tính từ đường đó và phần lấp lánh được bỏ qua.', id: 'Garis permukaan air yang berkilau ditemukan {pct} dari atas; pita permukaan diukur dari garis itu dan kilauannya diabaikan.', de: 'Eine flimmernde Wasserlinie wurde {pct} unterhalb des oberen Randes gefunden; das Oberflächenband wird ab ihr gemessen, das Flimmern selbst wird ignoriert.' },
        'vid.cav.drift': { en: 'Camera drift of up to {pct} of the frame width was compensated (rotation and zoom are not); resting-fish detection is off for hand-held clips - use a stand for best results.', pt: 'Um deslocamento da câmera de até {pct} da largura do quadro foi compensado (rotação e zoom não); a detecção de peixes em repouso fica desligada em vídeos feitos na mão - use um apoio para ter resultados melhores.', es: 'Se compensó un desplazamiento de la cámara de hasta el {pct} del ancho de la imagen (la rotación y el zoom no); la detección de peces en reposo se desactiva en videos grabados a mano - usa un soporte para obtener mejores resultados.', vi: 'Đã bù độ xê dịch của máy quay lên đến {pct} chiều rộng khung hình (không bù được xoay và thu phóng); tính năng phát hiện cá đang nghỉ bị tắt với video quay cầm tay - hãy dùng giá đỡ để có kết quả tốt nhất.', id: 'Pergeseran kamera hingga {pct} lebar bingkai sudah dikompensasi (rotasi dan zoom tidak); deteksi ikan yang beristirahat dimatikan untuk video yang direkam sambil dipegang - gunakan penyangga untuk hasil terbaik.', de: 'Kamerabewegungen bis zu {pct} der Bildbreite wurden ausgeglichen (Drehung und Zoom nicht); die Erkennung ruhender Fische ist bei Freihand-Clips deaktiviert - nutzen Sie für beste Ergebnisse eine Halterung.' },
        'vid.cav.inverts': { en: 'Snails and shrimp from the stocking form are not counted as fish here.', pt: 'Caramujos e camarões do formulário de povoamento não são contados como peixes aqui.', es: 'Los caracoles y camarones del formulario de población no se cuentan aquí como peces.', vi: 'Ốc và tép trong biểu mẫu số cá không được tính là cá ở đây.', id: 'Siput dan udang dari formulir kepadatan tidak dihitung sebagai ikan di sini.', de: 'Schnecken und Garnelen aus dem Besatzformular zählen hier nicht als Fische.' },
        'vid.cav.demo': { en: 'This sample clip is computer-drawn: the shapes are not real fish, and its clarity score describes the drawn background, not real water.', pt: 'Este vídeo de exemplo foi desenhado por computador: as formas não são peixes de verdade, e a pontuação de transparência descreve o fundo desenhado, não água real.', es: 'Este video de ejemplo está dibujado por computadora: las formas no son peces reales y su puntuación de claridad describe el fondo dibujado, no agua real.', vi: 'Video mẫu này do máy tính vẽ: các hình dạng không phải cá thật, và điểm độ trong chỉ mô tả nền được vẽ, không phải nước thật.', id: 'Video contoh ini digambar komputer: bentuk-bentuknya bukan ikan sungguhan, dan skor kejernihannya menggambarkan latar yang digambar, bukan air sungguhan.', de: 'Dieser Beispielclip ist am Computer gezeichnet: Die Formen sind keine echten Fische, und der Klarheitswert beschreibt den gezeichneten Hintergrund, kein echtes Wasser.' },

        'vid.legend_heat': { en: 'Warm colors: where movement was seen most often.', pt: 'Cores quentes: onde o movimento apareceu com mais frequência.', es: 'Colores cálidos: donde se vio movimiento con más frecuencia.', vi: 'Màu nóng: nơi thấy chuyển động nhiều nhất.', id: 'Warna hangat: tempat gerakan paling sering terlihat.', de: 'Warme Farben: wo am häufigsten Bewegung zu sehen war.' },

        'vid.slider_hint': { en: 'Move the slider to match your tank - the report updates without reading the clip again.', pt: 'Mova o controle para ajustar ao seu aquário - o relatório se atualiza sem ler o vídeo de novo.', es: 'Mueve el control para ajustarlo a tu acuario - el informe se actualiza sin volver a leer el video.', vi: 'Kéo thanh trượt cho khớp với bể của bạn - báo cáo cập nhật mà không cần đọc lại video.', id: 'Geser slider agar sesuai dengan akuarium Anda - laporan diperbarui tanpa membaca ulang video.', de: 'Verschieben Sie den Regler passend zu Ihrem Becken - der Bericht aktualisiert sich, ohne den Clip neu zu lesen.' },

    function awcLoadToCanvas(src, cb) {
        var img = new Image();

            try {

                var scale = Math.min(1, AWC_ANALYSIS_SIZE / Math.max(w0, h0));
                var w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
                var c = document.createElement('canvas');

    function awcMetrics(d0) {
        awc.stats.pixelPasses++;
        var d = d0.data, w = d0.width, h = d0.height, n = w * h;
        var sumR = 0, sumG = 0, sumB = 0, sumL = 0, sumL2 = 0;
        var lum = new Float32Array(n);
        for (var i = 0, p = 0; i < n; i++, p += 4) {
            var r = d[p], g = d[p + 1], b = d[p + 2];
            sumR += r; sumG += g; sumB += b;
            var L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            lum[i] = L; sumL += L; sumL2 += L * L;
        }
        var meanR = sumR / n, meanG = sumG / n, meanB = sumB / n, meanL = sumL / n;
        var varL = Math.max(0, sumL2 / n - meanL * meanL);
        var contrast = Math.min(1, Math.sqrt(varL) / 64);

        // Laplacian variance = focus/edge energy; haze softens it.
        var lapSum = 0, lapSum2 = 0, m = 0, speckle = 0, sc = 0;
        for (var y = 1; y < h - 1; y++) {
            for (var x = 1; x < w - 1; x++) {
                var idx = y * w + x;
                var v = 4 * lum[idx] - lum[idx - 1] - lum[idx + 1] - lum[idx - w] - lum[idx + w];
                lapSum += v; lapSum2 += v * v; m++;
                var Lv = lum[idx];
                if (Lv > 40 && Lv < 215) {
                    var a = Math.abs(v);
                    if (a < 40) { speckle += a; sc++; }
                }
            }
        }
        var lapMean = lapSum / m;
        var sharpness = Math.max(0, lapSum2 / m - lapMean * lapMean);
        speckle = sc ? speckle / sc : 0;

        var sorted = Array.prototype.slice.call(lum).sort(function (a2, b2) { return a2 - b2; });
        var darkDecile = sorted[Math.floor(n * 0.1)] / 255;
        var brightDecile = sorted[Math.floor(n * 0.9)] / 255;
        var hazeRatio = darkDecile / Math.max(brightDecile, 0.15);
        var haze = Math.min(1, Math.max(0, (hazeRatio - 0.25) / 0.55));

        var maxC = Math.max(meanR, meanG, meanB, 1);
        var rn = meanR / maxC, gn = meanG / maxC, bn = meanB / maxC;
        var tint = 'neutral';
        if (Math.abs(rn - gn) < 0.08 && Math.abs(gn - bn) < 0.08 && hazeRatio > 0.6) tint = 'milky';
        else if (gn === 1 && gn - Math.max(rn, bn) > 0.10) tint = 'green';
        else if (rn === 1 && gn > bn + 0.06 && rn - bn > 0.15) tint = 'amber';
        else if (bn === 1 && bn - rn > 0.08) tint = 'blue';

        var sharpN = Math.min(1, Math.log10(1 + sharpness) / 3.2);
        var clarity = Math.round(100 * (0.45 * sharpN + 0.35 * (1 - haze) + 0.20 * contrast));

        return { meanLuma: meanL / 255, contrast: contrast, sharpness: sharpness, speckle: speckle,
                 haze: haze, darkDecile: darkDecile, brightDecile: brightDecile, tint: tint, clarity: clarity };
    }

    // Optical state of ONE image - phrased as observation, never chemistry.
    function awcStateOf(mx) {
        if (mx.haze > 0.45) {
            if (mx.tint === 'green') return 'green_bloom';
            if (mx.speckle > 6.5) return 'particulate';
            return 'biological_haze';

        if (mx.haze > 0.28) return 'light_haze';
        if (mx.tint === 'amber') return 'amber_tint';
        return 'clear';
    }

    // States carry message ids, never sentences (see AWC_I18N state.*).

        light_haze:      { badge: 'badge.stable',  cls: 'w3-amber' },
        particulate:     { badge: 'badge.warning', cls: 'w3-orange' },
        biological_haze: { badge: 'badge.warning', cls: 'w3-orange' },
        green_bloom:     { badge: 'badge.warning', cls: 'w3-orange' },
        amber_tint:      { badge: 'badge.stable',  cls: 'w3-amber' }

    function awcCompare(mA, mB) {

        var lowConfidence = exposureDelta >= 0.22;
        var deltaPts = mB.clarity - mA.clarity;
        var trend = !comparable ? 'not_comparable' : (deltaPts >= 4 ? 'improving' : (deltaPts <= -4 ? 'worsening' : 'stable'));

    function awcBioload(stock, liters) {
        var load = 0, minVol = 0, any = false;
        stock.forEach(function (s) {
            var sp = null;
            for (var i = 0; i < AWC_SPECIES.length; i++) if (AWC_SPECIES[i].id === s.id) sp = AWC_SPECIES[i];
            if (!sp || !s.count) return;
            any = true; load += sp.waste * s.count; minVol += sp.minL * s.count;
        });
        if (!any || !liters || liters <= 0) return null;
        var pressure = load / (liters / 10);
        var band = pressure < 1 ? 'light' : pressure < 2 ? 'balanced' : pressure < 3.5 ? 'heavy' : 'overstocked';
        return { pressure: Math.round(pressure * 100) / 100, band: band, minLiters: minVol };
    }

    // Returns message IDS, not sentences.
    function awcBlueprint(cmp, bio) {

        if (cmp.stateB === 'particulate') acts.push('act.part_floss', 'act.part_stir');
        if (cmp.stateB === 'green_bloom') acts.push('act.green_light', 'act.green_feed');
        if (cmp.stateB === 'light_haze') acts.push('act.haze_reshoot');
        if (bio && bio.band === 'overstocked') acts.push('act.overstocked');
        if (bio && bio.band === 'heavy') acts.push('act.heavy');

    }

    function awcReadStock() {

    // ---- input routing -----------------------------------------------------
    function awcIsVideoFile(f) {
        var t = String(f && f.type || ''), n = String(f && f.name || '').toLowerCase();
        if (/^video\//.test(t)) return true;
        return /\.(mov|m4v|mp4|webm|hevc|mkv|3gp)$/.test(n);
    }
    function awcIsImageFile(f) {
        var t = String(f && f.type || ''), n = String(f && f.name || '').toLowerCase();

    }
    // 1 video -> video mode; 2+ images -> before/after; 1 image -> the slot
    // it was dropped on, else the next empty slot (B when both are full).
    function awcRouteFiles(list, slotHint) {
        var files = Array.prototype.slice.call(list || []);
        if (!files.length) return;
        var vids = files.filter(awcIsVideoFile);
        var imgs = files.filter(function (f) { return !awcIsVideoFile(f) && awcIsImageFile(f); });
        if (vids.length) { awcSetVideoFile(vids[0]); return; }
        if (!imgs.length) { awcStatus('status.unsupported_file'); return; }
        if (imgs.length >= 2) { awcReadSlot('A', imgs[0]); awcReadSlot('B', imgs[1]); return; }
        var which = slotHint || (awc.mode !== 'photos' || !awc.A ? 'A' : 'B');
        awcReadSlot(which, imgs[0]);
    }

    // Single analyze button: its label follows the mode and the decode path.
    function awcMaybeEnable() {
        var btn = awcEl('awcAnalyze');

        if (awc.mode === 'video' && V) {
            if (V.nativeFailed) { label = awcT('btn.decode_ff', { mb: awcNum(AWC_FF_MB) }); ok = !V.tooLarge; }
            else { label = awcT('btn.analyze_clip'); ok = !!V.probe; }
        } else { label = awcT('btn.compare'); ok = !!(awc.A && awc.B); }
        btn.textContent = label;
        // while the bundled clip is being fetched the slots still hold the old
        // input; a click then would silently replace the clip it is waiting for
        btn.disabled = !ok || awc.busy || !!awc.sampleLoading;
        btn.setAttribute('data-mode', awc.mode === 'video' ? (V && V.nativeFailed ? 'video-ffmpeg' : 'video') : 'photos');
        awcShow('awcDeclineBtn', !!(awc.mode === 'video' && V && V.nativeFailed && !V.tooLarge && !V.declined && !awc.busy));
        awcShow('awcAbortBtn', !!awc.busy && awc.mode === 'video');

    function awcWireDrop(zoneId, inputId, which) {
        var zone = awcEl(zoneId), input = inputId ? awcEl(inputId) : null;
        if (!zone) return;
        function pick() { (input || awcEl('awcFileAny')).click(); }
        zone.addEventListener('click', pick);
        zone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); pick(); } });
        zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('awc-over'); });

    // ---------------------------------------------------------------- video: frame extraction

    // Result: { frames: [{width, height, data}], times, width, height,

    var AWC_FF_WASM_BYTES = 32129114;          // ffmpeg-core.wasm unpacked size (gzip on the wire ~10.3 MB)
    var AWC_FF_MB = 32;                        // stated on the button BEFORE any download

    // Bundled sample clip -> the same path as an upload (File where possible,

    // ---------------------------------------------------------------- tier a (photos)
    // Chrome Built-in Prompt API - capability probe per rule 9: only
    // availability() === 'available' activates the tier (a 'downloadable'
    // state would trigger a silent model download, which is forbidden).
    function awcProbeBuiltin(cb) {
        try {
            if (typeof LanguageModel !== 'undefined' && LanguageModel && typeof LanguageModel.availability === 'function') {
                awcWithTimeout(LanguageModel.availability(), AWC_PROBE_MS, 'unavailable').then(function (a) { cb(a === 'available'); });
                return;
            }
        } catch (e) { void e; }
        cb(false);
    }

    // Prompt API output languages are limited per Chrome build: the rewrite is
    // written in the report language only when availability() says so for
    // that OUTPUT language; otherwise it is written in English and labelled.
    function awcPromptLangOk(lang) {
        try {
            return awcWithTimeout(LanguageModel.availability({ expectedInputs: [{ type: 'text', languages: ['en'] }], expectedOutputs: [{ type: 'text', languages: [lang] }] }), AWC_PROBE_MS, 'unavailable')
                .then(function (a) { return a === 'available'; });
        } catch (e) { return Promise.resolve(false); }
    }

    function awcBuiltinRewrite() {
        var A = awc.A, B = awc.B;
        if (!A || !A.metrics || !B || !B.metrics) return;
        var gen = awc.gen;
        var out = awcEl('awcAiProse');
        out.textContent = awcT('ai.builtin_writing');
        var mA = A.metrics, mB = B.metrics;
        var cmp = awcCompare(mA, mB);
        var facts = 'Facts measured from two photos of the same aquarium (before vs after): ' +
            'clarity score ' + mA.clarity + ' vs ' + mB.clarity + ' (0-100); ' +
            'haze ' + Math.round(mA.haze * 100) + '% vs ' + Math.round(mB.haze * 100) + '%; ' +
            'edge sharpness ' + mA.sharpness.toFixed(0) + ' vs ' + mB.sharpness.toFixed(0) + '; ' +
            'particle speckle ' + mA.speckle.toFixed(1) + ' vs ' + mB.speckle.toFixed(1) + '; ' +
            'tint ' + mA.tint + ' vs ' + mB.tint + '; optical pattern: ' + cmp.stateA + ' then ' + cmp.stateB + '.';
        var want = awcI18n.lang;
        awcPromptLangOk(want).then(function (ok) {
            if (gen !== awc.gen) return null;
            var lang = ok ? want : 'en';
            return LanguageModel.create({ expectedInputs: [{ type: 'text', languages: ['en'] }], expectedOutputs: [{ type: 'text', languages: [lang] }] })
                .then(function (session) {
                    function done() { try { if (session && typeof session.destroy === 'function') session.destroy(); } catch (e) { void e; } }   // one prompt per session: free it
                    return session.prompt('You are an experienced freshwater aquarist. Rewrite these measurements as a short, calm 3-4 sentence assessment for the tank owner, written in ' + AWC_LANG_EN[lang] + '. Use ONLY the facts given and keep every number exactly as given; do not invent chemistry readings (no ammonia/pH numbers). ' + facts)
                        .then(function (t) { done(); return t; }, function (e) { done(); throw e; });
                }).then(function (text) {
                    if (gen !== awc.gen) return;
                    awc.aiProse = { lang: lang, wanted: want, text: String(text) }; awcRenderProse();
                });
        }).then(null, function (e) { if (gen === awc.gen) out.textContent = awcT('ai.builtin_err', { msg: (e && e.message) || e }); });
    }

    // Free-text prose from the Prompt API is NOT a template: it is shown in the

    // ---------------------------------------------------------------- tier b (photos)
    function awcLoadClip() {
        if (awc.clip) return Promise.resolve(awc.clip);
        if (awc.clipLoading) return awc.clipLoading;
        var bar = awcEl('awcClipBar');
        var base = awcBase();
        awc.clipLoading = import(base + '/vendor/transformers/transformers.min.js').then(function (tf) {
            tf.env.allowLocalModels = false;
            tf.env.backends.onnx.wasm.wasmPaths = base + '/vendor/transformers/';
            tf.env.backends.onnx.wasm.numThreads = 1; // GitHub Pages: no COOP/COEP
            var seen = {};
            return tf.pipeline('zero-shot-image-classification', AWC_CLIP_MODEL, {
                device: 'wasm', dtype: 'q8',
                progress_callback: function (info) {
                    if (!bar || !info || !info.file) return;
                    if (info.status === 'progress' && info.total) {
                        seen[info.file] = info.loaded / info.total;
                        var files = Object.keys(seen); var sum = 0;
                        files.forEach(function (f) { sum += seen[f]; });
                        var pct = Math.round(100 * sum / Math.max(files.length, 1));
                        bar.style.width = Math.min(99, pct) + '%';
                        bar.textContent = Math.min(99, pct) + '%';
                        bar.setAttribute('aria-valuenow', String(Math.min(99, pct)));
                    }
                }
            });
        }).then(function (pipe) {
            awc.clip = pipe;
            if (bar) { bar.style.width = '100%'; bar.textContent = awcT('clip.ready'); bar.setAttribute('aria-valuenow', '100'); }
            return pipe;
        }).then(null, function (e) { awc.clipLoading = null; throw e; });
        return awc.clipLoading;
    }

    function awcRunClip() {
        if (!awc.A || !awc.B) { awcStatus('status.clip_need_both'); return; }
        var gen = awc.gen, A = awc.A, B = awc.B;
        var box = awcEl('awcClipOut');
        awcShow('awcClipProgress', true);
        box.innerHTML = '<span class="w3-text-grey">' + awcEsc(awcT('clip.downloading', { mb: awcNum(AWC_CLIP_MB) })) + '</span>';
        awcLoadClip().then(function (clf) {
            var waterLabels = AWC_WATER_LABELS.map(function (l) { return l[0]; });
            var speciesLabels = AWC_SPECIES_LABELS.map(function (l) { return l[0]; });
            return clf(A.url, waterLabels).then(function (wA) {
                return clf(B.url, waterLabels).then(function (wB) {
                    return clf(B.url, speciesLabels).then(function (sp) { return { wA: wA, wB: wB, sp: sp }; });
                });
            });
        }).then(function (r) {
            if (gen !== awc.gen) return; // pair changed while the model was running
            function mapLabel(txt, set) { for (var i = 0; i < set.length; i++) if (set[i][0] === txt) return set[i][1]; return null; }
            var aKey = mapLabel(r.wA[0].label, AWC_WATER_LABELS), bKey = mapLabel(r.wB[0].label, AWC_WATER_LABELS);
            var det = awcCompare(A.metrics || awcMetricsFallback(), B.metrics || awcMetricsFallback());
            var agree = B.metrics ? (bKey === det.stateB || (bKey === 'clear' && det.stateB === 'light_haze') || (bKey === 'biological_haze' && det.stateB === 'light_haze')) : null;
            var picks = r.sp.filter(function (x) { return x.score > 0.18 && mapLabel(x.label, AWC_SPECIES_LABELS); }).slice(0, 3)
                .map(function (x) { return { id: mapLabel(x.label, AWC_SPECIES_LABELS), score: x.score }; });
            awc.clipResult = { aKey: aKey, aScore: r.wA[0].score, bKey: bKey, bScore: r.wB[0].score, agree: agree, picks: picks };
            awcRenderClip();
        }).then(null, function (e) {
            if (gen !== awc.gen) return;
            awc.clipResult = { error: (e && e.message) || String(e) };
            awcRenderClip();
        });
    }
    function awcMetricsFallback() { return { meanLuma: 0.5, clarity: 0, haze: 0, sharpness: 0, speckle: 0, tint: 'neutral', contrast: 0 }; }

    // CLIP output is stored as keys + scores, rendered here in any language.
    function awcRenderClip() {
        var box = awcEl('awcClipOut'), r = awc.clipResult;

        function lbl(k) { return k ? awcT('clipwater.' + k) : '-'; }
        var html = '<p><b>' + awcEsc(awcT('clip.sees_before')) + '</b> ' + awcEsc(lbl(r.aKey)) + ' (' + awcPct(r.aScore) + ')<br>' +
                   '<b>' + awcEsc(awcT('clip.sees_after')) + '</b> ' + awcEsc(lbl(r.bKey)) + ' (' + awcPct(r.bScore) + ')' +
                   (r.agree === true ? ' <span class="w3-text-green">' + awcEsc(awcT('clip.agrees')) + '</span>' : r.agree === false ? ' <span class="w3-text-orange">' + awcEsc(awcT('clip.differs')) + '</span>' : '') + '</p>';
        if (r.picks.length) {
            html += '<p><b>' + awcEsc(awcT('clip.thinks')) + '</b> ' + r.picks.map(function (x) { return awcEsc(awcT('species.' + x.id)) + ' (' + awcPct(x.score) + ')'; }).join(', ') +
                    '. ' + awcEsc(awcT('clip.guesses')) + '</p><p>' +
                    r.picks.map(function (x) { return '<button type="button" class="w3-button w3-small w3-light-grey awc-prefill" data-sp="' + x.id + '">+1 ' + awcEsc(awcT('species.' + x.id)) + '</button> '; }).join('') + '</p>';
        } else {
            html += '<p class="w3-text-grey">' + awcEsc(awcT('clip.none')) + '</p>';
        }
        box.innerHTML = html;
        var btns = box.getElementsByClassName('awc-prefill');
        for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener('click', function () {

    // ---------------------------------------------------------------- language wiring

        'vid.img_alt': { en: 'Still background of the clip with a heat overlay showing where movement was seen', pt: 'Fundo parado do vídeo com um mapa de calor sobreposto mostrando onde houve movimento', es: 'Fondo fijo del video con un mapa de calor superpuesto que muestra dónde hubo movimiento', vi: 'Nền tĩnh của video với lớp phủ bản đồ nhiệt cho thấy những nơi có chuyển động', id: 'Latar diam dari video dengan lapisan peta panas yang menunjukkan tempat gerakan terlihat', de: 'Ruhender Hintergrund des Clips mit einer Wärmekarte, die zeigt, wo Bewegung zu sehen war' },
        'vid.legend_heat': { en: 'Warm colors: where movement was seen most often.', pt: 'Cores quentes: onde o movimento apareceu com mais frequência.', es: 'Colores cálidos: donde se vio movimiento con más frecuencia.', vi: 'Màu nóng: nơi thấy chuyển động nhiều nhất.', id: 'Warna hangat: tempat gerakan paling sering terlihat.', de: 'Warme Farben: wo am häufigsten Bewegung zu sehen war.' },
        'vid.legend_line': { en: 'Dashed yellow line: lower edge of the surface band.', pt: 'Linha amarela tracejada: limite inferior da faixa da superfície.', es: 'Línea amarilla discontinua: borde inferior de la franja de superficie.', vi: 'Đường nét đứt màu vàng: mép dưới của dải mặt nước.', id: 'Garis kuning putus-putus: batas bawah pita permukaan.', de: 'Gestrichelte gelbe Linie: Unterkante des Oberflächenbands.' },
        'vid.legend_bubbles': { en: 'Grey stripe: bubble column ignored by the analysis.', pt: 'Faixa cinza: coluna de bolhas ignorada pela análise.', es: 'Franja gris: columna de burbujas ignorada por el análisis.', vi: 'Dải màu xám: cột bọt khí mà phần phân tích đã bỏ qua.', id: 'Pita abu-abu: kolom gelembung yang diabaikan analisis.', de: 'Grauer Streifen: Blasensäule, die von der Analyse ignoriert wird.' },
        'vid.slider_label': { en: 'Surface band: top {pct} of the water', pt: 'Faixa da superfície: {pct} superiores da água', es: 'Franja de superficie: {pct} superior del agua', vi: 'Dải mặt nước: {pct} trên cùng của cột nước', id: 'Pita permukaan: {pct} bagian atas air', de: 'Oberflächenband: obere {pct} des Wassers' },
        'vid.slider_hint': { en: 'Move the slider to match your tank - the report updates without reading the clip again.', pt: 'Mova o controle para ajustar ao seu aquário - o relatório se atualiza sem ler o vídeo de novo.', es: 'Mueve el control para ajustarlo a tu acuario - el informe se actualiza sin volver a leer el video.', vi: 'Kéo thanh trượt cho khớp với bể của bạn - báo cáo cập nhật mà không cần đọc lại video.', id: 'Geser slider agar sesuai dengan akuarium Anda - laporan diperbarui tanpa membaca ulang video.', de: 'Verschieben Sie den Regler passend zu Ihrem Becken - der Bericht aktualisiert sich, ohne den Clip neu zu lesen.' },
        'vid.clarity_label': { en: 'Water clarity in this clip', pt: 'Transparência da água neste vídeo', es: 'Claridad del agua en este video', vi: 'Độ trong của nước trong video này', id: 'Kejernihan air dalam video ini', de: 'Wasserklarheit in diesem Clip' },
        'vid.clarity_value': { en: '{score}/100 - {state}', pt: '{score}/100 - {state}', es: '{score}/100 - {state}', vi: '{score}/100 - {state}', id: '{score}/100 - {state}', de: '{score}/100 - {state}' },
        'vid.clarity_note': { en: 'Measured on the still background that remains once everything moving is removed - the same optical score as the photo comparison, not a chemistry reading.', pt: 'Medida no fundo parado que sobra quando tudo o que se mexe é removido - a mesma pontuação óptica da comparação de fotos, não uma leitura química.', es: 'Medida en el fondo fijo que queda al quitar todo lo que se mueve - la misma puntuación óptica que en la comparación de fotos, no una lectura química.', vi: 'Đo trên nền tĩnh còn lại sau khi loại bỏ mọi thứ chuyển động - cùng thang điểm quang học như phần so sánh ảnh, không phải số đo hóa học.', id: 'Diukur pada latar diam yang tersisa setelah semua yang bergerak dihapus - skor optik yang sama dengan perbandingan foto, bukan hasil uji kimia.', de: 'Gemessen am ruhenden Hintergrund, der übrig bleibt, wenn alles Bewegte entfernt ist - derselbe optische Wert wie beim Fotovergleich, kein chemischer Messwert.' },
        'vid.span_full': { en: 'Analyzed the whole {d} s clip (4 frames per second, {n} in total).', pt: 'O vídeo inteiro de {d} s foi analisado (4 quadros por segundo, {n} no total).', es: 'Se analizó el video completo de {d} s (4 fotogramas por segundo, {n} en total).', vi: 'Đã phân tích toàn bộ video dài {d} giây (4 khung hình mỗi giây, tổng cộng {n}).', id: 'Seluruh video {d} detik dianalisis (4 bingkai per detik, total {n}).', de: 'Der gesamte Clip ({d} s) wurde analysiert (4 Bilder pro Sekunde, insgesamt {n}).' },
        'vid.span_partial': { en: 'Analyzed the first {a} s of this {d} s clip (4 frames per second, {n} in total).', pt: 'Foram analisados os primeiros {a} s deste vídeo de {d} s (4 quadros por segundo, {n} no total).', es: 'Se analizaron los primeros {a} s de este video de {d} s (4 fotogramas por segundo, {n} en total).', vi: 'Đã phân tích {a} giây đầu của video dài {d} giây này (4 khung hình mỗi giây, tổng cộng {n}).', id: '{a} detik pertama dari video {d} detik ini dianalisis (4 bingkai per detik, total {n}).', de: 'Die ersten {a} s dieses {d}-s-Clips wurden analysiert (4 Bilder pro Sekunde, insgesamt {n}).' },
        'vid.span_budget': { en: 'Analyzed the first {a} s of this {d} s clip ({n} frames in total) - a shorter span keeps on-device decoding of this high-resolution video short (about 20 seconds on a fast computer, longer on a phone).', pt: 'Foram analisados os primeiros {a} s deste vídeo de {d} s ({n} quadros no total) - um trecho mais curto mantém rápida a decodificação deste vídeo de alta resolução no dispositivo (cerca de 20 segundos em um computador rápido, mais em um celular).', es: 'Se analizaron los primeros {a} s de este video de {d} s ({n} fotogramas en total) - con un tramo más corto, la decodificación en el dispositivo de este video de alta resolución es breve (unos 20 segundos en una computadora rápida, más en un teléfono).', vi: 'Đã phân tích {a} giây đầu của video dài {d} giây này (tổng cộng {n} khung hình) - đoạn ngắn hơn giúp việc giải mã video độ phân giải cao này trên thiết bị diễn ra nhanh (khoảng 20 giây trên máy tính mạnh, lâu hơn trên điện thoại).', id: '{a} detik pertama dari video {d} detik ini dianalisis (total {n} bingkai) - rentang yang lebih pendek membuat proses dekode video resolusi tinggi ini di perangkat tetap singkat (sekitar 20 detik di komputer yang cepat, lebih lama di ponsel).', de: 'Die ersten {a} s dieses {d}-s-Clips wurden analysiert (insgesamt {n} Bilder) - ein kürzerer Abschnitt hält das Dekodieren dieses hochauflösenden Videos auf dem Gerät kurz (etwa 20 Sekunden auf einem schnellen Computer, länger auf einem Handy).' },
        'vid.engine_native': { en: 'Frames were read by this browser.', pt: 'Os quadros foram lidos por este navegador.', es: 'Los fotogramas los leyó este navegador.', vi: 'Trình duyệt này đã tự đọc các khung hình.', id: 'Bingkai dibaca oleh browser ini.', de: 'Die Bilder wurden von diesem Browser gelesen.' },
        'vid.engine_ff': { en: 'Frames were decoded on this device with the downloaded decoder.', pt: 'Os quadros foram decodificados neste dispositivo com o decodificador baixado.', es: 'Los fotogramas se decodificaron en este dispositivo con el decodificador descargado.', vi: 'Các khung hình được giải mã trên thiết bị này bằng bộ giải mã đã tải về.', id: 'Bingkai didekode di perangkat ini dengan dekoder yang diunduh.', de: 'Die Bilder wurden auf diesem Gerät mit dem heruntergeladenen Decoder dekodiert.' },
        'vid.v.camera_moved.note_misreg': { en: 'The camera movement was corrected, but fixed edges (glass, decor, plants) still moved in most of the picture afterwards - this happens when the phone is very close to the glass or the view has a lot of depth. Here fish movement cannot be separated from camera movement.', pt: 'O movimento da câmera foi corrigido, mas as bordas fixas (vidro, decoração, plantas) continuaram se mexendo na maior parte da imagem - isso acontece quando o celular está muito perto do vidro ou quando a cena tem muita profundidade. Aqui o movimento dos peixes não pode ser separado do movimento da câmera.', es: 'Se corrigió el movimiento de la cámara, pero los bordes fijos (cristal, decoración, plantas) siguieron moviéndose en la mayor parte de la imagen - suele pasar cuando el teléfono está muy cerca del cristal o la escena tiene mucha profundidad. Aquí el movimiento de los peces no se puede separar del movimiento de la cámara.', vi: 'Chuyển động của máy quay đã được bù, nhưng các cạnh cố định (kính, đồ trang trí, cây thủy sinh) vẫn dịch chuyển ở phần lớn khung hình - điều này xảy ra khi điện thoại ở rất gần mặt kính hoặc cảnh có nhiều chiều sâu. Trong trường hợp này không thể tách chuyển động của cá khỏi chuyển động của máy quay.', id: 'Gerakan kamera sudah dikoreksi, tetapi tepi yang diam (kaca, dekorasi, tanaman) masih bergerak di sebagian besar gambar - ini terjadi bila ponsel sangat dekat dengan kaca atau pemandangannya punya banyak kedalaman. Di sini gerakan ikan tidak bisa dipisahkan dari gerakan kamera.', de: 'Die Kamerabewegung wurde ausgeglichen, aber feste Kanten (Glas, Deko, Pflanzen) bewegten sich danach in den meisten Bildbereichen weiter - das passiert, wenn das Handy sehr nah am Glas ist oder das Bild viel Tiefe hat. Hier lässt sich die Bewegung der Fische nicht von der Bewegung der Kamera trennen.' },
        'vid.ev.window_best': { en: 'The longest steady stretch was {sec} s; at least {need} s is needed.', pt: 'O trecho estável mais longo teve {sec} s; são necessários pelo menos {need} s.', es: 'El tramo estable más largo duró {sec} s; se necesitan al menos {need} s.', vi: 'Đoạn ổn định dài nhất là {sec} giây; cần ít nhất {need} giây.', id: 'Bagian stabil terpanjang {sec} detik; dibutuhkan minimal {need} detik.', de: 'Der längste ruhige Abschnitt dauerte {sec} s; nötig sind mindestens {need} s.' },
        'vid.ev.misreg': { en: 'After the camera correction, fixed edges still moved in {n} of 9 parts of the picture.', pt: 'Depois da correção da câmera, as bordas fixas ainda se mexiam em {n} de 9 partes da imagem.', es: 'Tras la corrección de la cámara, los bordes fijos seguían moviéndose en {n} de 9 partes de la imagen.', vi: 'Sau khi bù chuyển động máy quay, các cạnh cố định vẫn dịch chuyển ở {n} trên 9 vùng của khung hình.', id: 'Setelah koreksi kamera, tepi yang diam masih bergerak di {n} dari 9 bagian gambar.', de: 'Nach dem Kameraausgleich bewegten sich feste Kanten noch in {n} von 9 Bildbereichen.' },
        'vid.ev.crop_small': { en: 'During the steadiest {sec} s only {share} of the picture stayed in view the whole time; at least {need} is needed.', pt: 'Durante os {sec} s mais estáveis, só {share} da imagem ficou visível o tempo todo; é preciso pelo menos {need}.', es: 'Durante los {sec} s más estables, solo el {share} de la imagen se mantuvo a la vista todo el tiempo; se necesita al menos el {need}.', vi: 'Trong {sec} giây ổn định nhất, chỉ {share} khung hình luôn nằm trong tầm nhìn; cần ít nhất {need}.', id: 'Selama {sec} detik yang paling stabil, hanya {share} gambar yang tetap terlihat sepanjang waktu; dibutuhkan minimal {need}.', de: 'In den ruhigsten {sec} s blieb nur {share} des Bildes durchgehend im Blick; nötig sind mindestens {need}.' },
        'vid.act.prop': { en: 'Prop the phone against something solid (a stack of books, the tank stand) or use a small tripod - do not hold it in your hand.', pt: 'Apoie o celular em algo firme (uma pilha de livros, o móvel do aquário) ou use um tripé pequeno - não segure na mão.', es: 'Apoya el teléfono en algo firme (una pila de libros, el mueble del acuario) o usa un trípode pequeño - no lo sostengas con la mano.', vi: 'Tựa điện thoại vào vật gì chắc chắn (một chồng sách, kệ bể) hoặc dùng chân máy nhỏ - đừng cầm trên tay.', id: 'Sandarkan ponsel pada sesuatu yang kokoh (tumpukan buku, meja akuarium) atau gunakan tripod kecil - jangan dipegang dengan tangan.', de: 'Lehnen Sie das Handy an etwas Festes (einen Bücherstapel, den Aquarienschrank) oder nutzen Sie ein kleines Stativ - nicht in der Hand halten.' },
        'vid.act.lock': { en: 'Before recording, tap and hold on the tank to lock focus and exposure (AE/AF Lock on iPhone; most Android camera apps do the same with a long press).', pt: 'Antes de gravar, toque e segure sobre o aquário para travar o foco e a exposição (Bloqueio AE/AF no iPhone; a maioria dos apps de câmera do Android faz o mesmo com um toque longo).', es: 'Antes de grabar, mantén pulsado sobre el acuario para bloquear el enfoque y la exposición (Bloqueo AE/AF en el iPhone; la mayoría de las apps de cámara de Android hacen lo mismo con una pulsación larga).', vi: 'Trước khi quay, chạm và giữ vào bể để khóa lấy nét và phơi sáng (Khóa AE/AF trên iPhone; hầu hết ứng dụng camera Android cũng làm vậy khi nhấn giữ).', id: 'Sebelum merekam, ketuk dan tahan pada akuarium untuk mengunci fokus dan eksposur (Kunci AE/AF di iPhone; kebanyakan aplikasi kamera Android melakukan hal yang sama dengan tekan lama).', de: 'Tippen Sie vor der Aufnahme lange auf das Aquarium auf dem Bildschirm, um Fokus und Belichtung zu sperren (AE/AF-Sperre auf dem iPhone; die meisten Android-Kamera-Apps machen das mit langem Drücken).' },
        'vid.act.length': { en: 'Record 15 to 30 seconds without moving, panning or zooming.', pt: 'Grave de 15 a 30 segundos sem mexer o celular, sem girar e sem dar zoom.', es: 'Graba de 15 a 30 segundos sin mover la cámara, sin girarla y sin hacer zoom.', vi: 'Quay 15 đến 30 giây mà không di chuyển, lia máy hay thu phóng.', id: 'Rekam 15 sampai 30 detik tanpa menggerakkan, menggeser, atau memperbesar kamera.', de: 'Nehmen Sie 15 bis 30 Sekunden auf, ohne die Kamera zu bewegen, zu schwenken oder zu zoomen.' },
        'vid.act.frame': { en: 'Keep the whole water column in the picture, from the water surface down to the gravel, with the side glass in view.', pt: 'Mantenha toda a coluna de água na imagem, da superfície até o cascalho, com os vidros laterais visíveis.', es: 'Mantén toda la columna de agua en la imagen, desde la superficie hasta la grava, con los cristales laterales a la vista.', vi: 'Giữ toàn bộ cột nước trong khung hình, từ mặt nước xuống đến lớp sỏi, và thấy cả các vách kính bên.', id: 'Pastikan seluruh kolom air masuk ke gambar, dari permukaan air sampai kerikil, dengan kaca samping terlihat.', de: 'Halten Sie die ganze Wassersäule im Bild, von der Wasseroberfläche bis zum Kies, mit den Seitenscheiben im Blick.' },
        'vid.span_window': { en: 'Analyzed {from}-{to} s of this {d} s clip ({sec} s, {n} frames) - the rest was too shaky or pointed away from the tank.', pt: 'Foi analisado o trecho de {from} a {to} s deste vídeo de {d} s ({sec} s, {n} quadros) - o resto estava tremido demais ou não mostrava o aquário.', es: 'Se analizó el tramo de {from} a {to} s de este video de {d} s ({sec} s, {n} fotogramas) - el resto estaba demasiado movido o no apuntaba al acuario.', vi: 'Đã phân tích đoạn từ giây {from} đến giây {to} của video dài {d} giây này ({sec} giây, {n} khung hình) - phần còn lại bị rung quá nhiều hoặc không quay vào bể.', id: 'Yang dianalisis detik {from} sampai {to} dari video {d} detik ini ({sec} detik, {n} bingkai) - sisanya terlalu goyang atau tidak mengarah ke akuarium.', de: 'Analysiert wurden die Sekunden {from} bis {to} dieses {d}-s-Clips ({sec} s, {n} Bilder) - der Rest war zu verwackelt oder zeigte nicht das Aquarium.' },
        'vid.cav.busy': { en: 'Many moving shapes at once: fish overlap and pass each other, so the number is a rough range and quick darting is not measured.', pt: 'Muitas formas em movimento ao mesmo tempo: os peixes se sobrepõem e se cruzam, então o número é só uma faixa aproximada e as arrancadas rápidas não são medidas.', es: 'Muchas formas en movimiento a la vez: los peces se superponen y se cruzan, así que el número es solo un rango aproximado y no se miden las arrancadas rápidas.', vi: 'Nhiều hình đang chuyển động cùng lúc: cá chồng lên nhau và bơi lướt qua nhau, nên con số chỉ là khoảng ước lượng và các lần lao đi đột ngột không được đo.', id: 'Banyak bentuk bergerak sekaligus: ikan saling tumpang tindih dan berpapasan, jadi jumlahnya hanya kisaran kasar dan lesatan tiba-tiba tidak diukur.', de: 'Viele bewegte Formen gleichzeitig: Fische überlappen sich und schwimmen aneinander vorbei, deshalb ist die Zahl nur eine grobe Spanne, und schnelles Davonschießen wird nicht gemessen.' },
        'vid.cav.fragments': { en: 'Some moving shapes are much larger than others (fish close to the camera, or several fish overlapping): one fish can show up as several shapes, so the count above may be too high. Filming from a little further back with the whole tank in view helps.', pt: 'Algumas formas em movimento são bem maiores que outras (peixes perto da câmera ou vários peixes sobrepostos): um peixe pode aparecer como várias formas, então a contagem acima pode estar alta demais. Filmar um pouco mais de longe, com o aquário inteiro na imagem, ajuda.', es: 'Algunas formas en movimiento son mucho más grandes que otras (peces cerca de la cámara o varios peces superpuestos): un pez puede aparecer como varias formas, así que el recuento de arriba puede ser demasiado alto. Ayuda grabar un poco más lejos, con todo el acuario en la imagen.', vi: 'Một số hình chuyển động lớn hơn hẳn các hình khác (cá ở gần máy quay, hoặc nhiều con chồng lên nhau): một con cá có thể hiện ra thành nhiều hình, nên con số ở trên có thể quá cao. Lùi ra xa một chút để thấy toàn bộ bể sẽ giúp ích.', id: 'Beberapa bentuk bergerak jauh lebih besar dari yang lain (ikan dekat kamera, atau beberapa ikan tumpang tindih): satu ikan bisa muncul sebagai beberapa bentuk, jadi jumlah di atas mungkin terlalu tinggi. Merekam sedikit lebih jauh dengan seluruh akuarium terlihat akan membantu.', de: 'Einige bewegte Formen sind viel größer als andere (Fische nah an der Kamera oder mehrere Fische übereinander): Ein Fisch kann als mehrere Formen erscheinen, deshalb kann die Zahl oben zu hoch sein. Etwas mehr Abstand mit dem ganzen Aquarium im Bild hilft.' },
        'vid.cav.trans_only': { en: 'Little fixed detail in view, so only side-to-side and up-down camera drift (up to {pct} of the frame width) was corrected - hold the phone steadier or use a stand for a better reading.', pt: 'Há poucos detalhes fixos na imagem, então só o deslocamento lateral e vertical da câmera (até {pct} da largura do quadro) foi corrigido - segure o celular mais firme ou use um apoio para uma leitura melhor.', es: 'Hay pocos detalles fijos en la imagen, así que solo se corrigió el desplazamiento lateral y vertical de la cámara (hasta el {pct} del ancho de la imagen) - sujeta el teléfono con más firmeza o usa un soporte para una lectura mejor.', vi: 'Khung hình có ít chi tiết cố định, nên chỉ bù được độ trôi ngang dọc của máy quay (tối đa {pct} chiều rộng khung hình) - hãy giữ điện thoại chắc tay hơn hoặc dùng giá đỡ để có kết quả tốt hơn.', id: 'Hanya sedikit detail diam di gambar, jadi hanya pergeseran kamera ke samping dan atas-bawah (hingga {pct} lebar bingkai) yang dikoreksi - pegang ponsel lebih stabil atau gunakan penyangga untuk hasil yang lebih baik.', de: 'Im Bild gibt es wenig feste Details, deshalb wurde nur das seitliche und vertikale Verrutschen der Kamera (bis zu {pct} der Bildbreite) ausgeglichen - halten Sie das Handy ruhiger oder nutzen Sie eine Halterung für ein besseres Ergebnis.' },
        'vid.cav.exposure': { en: 'The brightness or color of the picture changed during the clip (automatic exposure); it was evened out before the analysis.', pt: 'O brilho ou a cor da imagem mudou durante o vídeo (exposição automática); isso foi compensado antes da análise.', es: 'El brillo o el color de la imagen cambió durante el video (exposición automática); se compensó antes del análisis.', vi: 'Độ sáng hoặc màu của hình đã thay đổi trong video (phơi sáng tự động); phần này đã được cân bằng lại trước khi phân tích.', id: 'Kecerahan atau warna gambar berubah selama video (eksposur otomatis); hal itu sudah diratakan sebelum analisis.', de: 'Helligkeit oder Farbe des Bildes haben sich während des Clips geändert (automatische Belichtung); das wurde vor der Analyse ausgeglichen.' },
        'vid.cav.tank': { en: 'The tank fills only part of the picture: top, middle and bottom are measured inside the tank (from {top} to {bottom} of the picture height), and the surface band starts at the tank top.', pt: 'O aquário ocupa só parte da imagem: superior, médio e inferior são medidos dentro do aquário (de {top} a {bottom} da altura da imagem), e a faixa da superfície começa no topo do aquário.', es: 'El acuario ocupa solo una parte de la imagen: superior, medio e inferior se miden dentro del acuario (del {top} al {bottom} de la altura de la imagen), y la franja de superficie empieza en la parte superior del acuario.', vi: 'Bể chỉ chiếm một phần khung hình: phần trên, giữa và dưới được đo bên trong bể (từ {top} đến {bottom} chiều cao khung hình), và dải mặt nước bắt đầu từ mép trên của bể.', id: 'Akuarium hanya mengisi sebagian gambar: bagian atas, tengah, dan bawah diukur di dalam akuarium (dari {top} sampai {bottom} tinggi gambar), dan pita permukaan dimulai dari bagian atas akuarium.', de: 'Das Aquarium füllt nur einen Teil des Bildes: oben, Mitte und unten werden innerhalb des Aquariums gemessen (von {top} bis {bottom} der Bildhöhe), und das Oberflächenband beginnt an der Oberkante des Aquariums.' },
        'vid.conf_why': { en: 'Why the confidence is low: {list}.', pt: 'Por que a confiança é baixa: {list}.', es: 'Por qué la confianza es baja: {list}.', vi: 'Lý do độ tin cậy thấp: {list}.', id: 'Alasan tingkat keyakinan rendah: {list}.', de: 'Warum die Verlässlichkeit gering ist: {list}.' },
        'vid.conf.r.handheld': { en: 'the camera moved a lot and had to be corrected', pt: 'a câmera se mexeu bastante e precisou ser corrigida', es: 'la cámara se movió bastante y hubo que corregirla', vi: 'máy quay rung nhiều và phải bù chuyển động', id: 'kamera banyak bergerak dan harus dikoreksi', de: 'die Kamera hat sich stark bewegt und musste ausgeglichen werden' },
        'vid.conf.r.texture': { en: 'the picture shows little fixed detail, so camera movement could not be checked', pt: 'a imagem mostra poucos detalhes fixos, então não foi possível conferir se a câmera se mexeu', es: 'la imagen muestra pocos detalles fijos, así que no se pudo comprobar si la cámara se movió', vi: 'khung hình có ít chi tiết cố định nên không thể kiểm tra máy quay có bị rung hay không', id: 'gambar hanya menunjukkan sedikit detail diam, jadi gerakan kamera tidak bisa diperiksa', de: 'das Bild zeigt wenig feste Details, daher ließ sich nicht prüfen, ob sich die Kamera bewegt hat' },
        'vid.conf.r.window': { en: 'only part of the clip was steady enough', pt: 'só parte do vídeo estava estável o suficiente', es: 'solo una parte del video era lo bastante estable', vi: 'chỉ một phần video đủ ổn định', id: 'hanya sebagian video yang cukup stabil', de: 'nur ein Teil des Clips war ruhig genug' },
        'vid.conf.r.short': { en: 'less than 15 s of steady footage', pt: 'menos de 15 s de imagem estável', es: 'menos de 15 s de imagen estable', vi: 'chưa đến 15 giây hình ổn định', id: 'kurang dari 15 detik rekaman stabil', de: 'weniger als 15 s ruhige Aufnahme' },
        'vid.conf.r.few': { en: 'moving shapes could be followed for less than one minute in total (all shapes added up)', pt: 'as formas em movimento puderam ser acompanhadas por menos de um minuto no total (somando todas)', es: 'las formas en movimiento se pudieron seguir menos de un minuto en total (sumando todas)', vi: 'tổng thời gian theo dõi được các hình chuyển động chưa đến một phút (cộng dồn tất cả các hình)', id: 'total waktu bentuk bergerak yang bisa diikuti kurang dari satu menit (semua bentuk dijumlahkan)', de: 'insgesamt ließen sich bewegte Formen weniger als eine Minute lang verfolgen (alle Formen zusammengerechnet)' },
        'vid.conf.r.dense': { en: 'many moving shapes overlap', pt: 'muitas formas em movimento se sobrepõem', es: 'muchas formas en movimiento se superponen', vi: 'nhiều hình chuyển động chồng lên nhau', id: 'banyak bentuk bergerak saling tumpang tindih', de: 'viele bewegte Formen überlappen sich' },
        'vid.conf.r.count': { en: 'the number of moving shapes changed a lot from frame to frame', pt: 'o número de formas em movimento variou muito de um quadro para outro', es: 'el número de formas en movimiento cambió mucho de un fotograma a otro', vi: 'số hình chuyển động thay đổi nhiều giữa các khung hình', id: 'jumlah bentuk bergerak sangat berubah dari bingkai ke bingkai', de: 'die Zahl der bewegten Formen schwankte stark von Bild zu Bild' },
        'vid.v.camera_moved.title_misreg': { en: 'Camera movement could not be separated', pt: 'Não foi possível separar o movimento da câmera', es: 'No se pudo separar el movimiento de la cámara', vi: 'Không thể tách riêng chuyển động của máy quay', id: 'Gerakan kamera tidak bisa dipisahkan', de: 'Die Kamerabewegung ließ sich nicht herausrechnen' },
        'vid.v.camera_moved.title_changed': { en: 'The picture changed during the clip', pt: 'A imagem mudou durante o vídeo', es: 'La imagen cambió durante el video', vi: 'Khung hình thay đổi giữa chừng trong video', id: 'Gambar berubah di tengah video', de: 'Das Bild hat sich während des Clips verändert' },
        'vid.v.camera_moved.note_changed': { en: 'This clip does not look like one continuous, steady view of the tank: the moving shapes came and went all at once, which happens with edited videos (cuts, text or subtitles over the picture) or a sudden change of light. Fish movement cannot be measured reliably from it.', pt: 'Este vídeo não parece uma visão contínua e estável do aquário: as formas em movimento apareceram e sumiram todas de uma vez, o que acontece em vídeos editados (cortes, texto ou legendas sobre a imagem) ou com uma mudança brusca de luz. Não é possível medir o movimento dos peixes de forma confiável a partir dele.', es: 'Este video no parece una vista continua y estable del acuario: las formas en movimiento aparecieron y desaparecieron todas a la vez, lo que ocurre en videos editados (cortes, texto o subtítulos sobre la imagen) o con un cambio brusco de luz. No se puede medir de forma fiable el movimiento de los peces a partir de él.', vi: 'Video này không giống một cảnh quay liên tục, ổn định của bể: các hình chuyển động xuất hiện rồi biến mất cùng lúc, điều thường gặp ở video đã chỉnh sửa (cắt cảnh, chữ hoặc phụ đề chèn lên hình) hoặc khi ánh sáng thay đổi đột ngột. Không thể đo chuyển động của cá một cách đáng tin cậy từ video này.', id: 'Video ini tidak terlihat seperti satu tampilan akuarium yang utuh dan stabil: bentuk-bentuk bergerak muncul dan hilang bersamaan, yang terjadi pada video yang sudah diedit (potongan adegan, teks atau subtitle di atas gambar) atau saat cahaya berubah mendadak. Gerakan ikan tidak bisa diukur dengan andal dari video ini.', de: 'Dieser Clip wirkt nicht wie eine durchgehende, ruhige Ansicht des Aquariums: Die bewegten Formen tauchten alle gleichzeitig auf und verschwanden wieder, wie bei geschnittenen Videos (Schnitte, eingeblendeter Text oder Untertitel) oder bei einem plötzlichen Lichtwechsel. Die Fischbewegung lässt sich daraus nicht verlässlich messen.' },
        'vid.ev.count_jumps': { en: 'The number of moving shapes jumped between {lo} and {hi} - the picture itself probably changed (a cut, text overlay or a sudden light change).', pt: 'O número de formas em movimento saltou entre {lo} e {hi} - provavelmente a própria imagem mudou (um corte, texto sobreposto ou uma mudança brusca de luz).', es: 'El número de formas en movimiento saltó entre {lo} y {hi} - probablemente cambió la propia imagen (un corte, texto superpuesto o un cambio brusco de luz).', vi: 'Số hình chuyển động nhảy giữa {lo} và {hi} - có thể chính khung hình đã thay đổi (cắt cảnh, chữ chèn lên hoặc ánh sáng thay đổi đột ngột).', id: 'Jumlah bentuk bergerak melonjak antara {lo} dan {hi} - kemungkinan gambarnya sendiri berubah (potongan adegan, teks tempelan, atau perubahan cahaya mendadak).', de: 'Die Zahl der bewegten Formen sprang zwischen {lo} und {hi} - vermutlich hat sich das Bild selbst verändert (Schnitt, eingeblendeter Text oder plötzlicher Lichtwechsel).' },
        'vid.ev.count_zero': { en: 'In most frames no moving shape stayed in view for 1 s or more.', pt: 'Na maioria dos quadros, nenhuma forma em movimento ficou visível por 1 s ou mais.', es: 'En la mayoría de los fotogramas ninguna forma en movimiento permaneció a la vista durante 1 s o más.', vi: 'Trong phần lớn các khung hình, không có hình chuyển động nào xuất hiện liên tục từ 1 giây trở lên.', id: 'Di sebagian besar bingkai, tidak ada bentuk bergerak yang terlihat selama 1 detik atau lebih.', de: 'In den meisten Bildern blieb keine bewegte Form 1 s oder länger im Blick.' },
        'vid.ev.reg_fail': { en: 'The camera position could be measured in only {share} of the frames: too little fixed detail (glass edges, decor, gravel) was visible, often because moving fish or plain water covered most of the picture.', pt: 'A posição da câmera só pôde ser medida em {share} dos quadros: havia poucos detalhes fixos visíveis (bordas do vidro, decoração, cascalho), muitas vezes porque peixes em movimento ou água lisa cobriam a maior parte da imagem.', es: 'La posición de la cámara solo se pudo medir en el {share} de los fotogramas: se veían muy pocos detalles fijos (bordes del cristal, decoración, grava), a menudo porque peces en movimiento o agua sin detalles cubrían la mayor parte de la imagen.', vi: 'Chỉ đo được vị trí máy quay ở {share} số khung hình: có quá ít chi tiết cố định (mép kính, đồ trang trí, sỏi) hiện ra, thường do cá đang bơi hoặc vùng nước trống che phần lớn khung hình.', id: 'Posisi kamera hanya bisa diukur pada {share} bingkai: terlalu sedikit detail diam (tepi kaca, dekorasi, kerikil) yang terlihat, sering karena ikan yang bergerak atau air polos menutupi sebagian besar gambar.', de: 'Die Kameraposition ließ sich nur in {share} der Bilder bestimmen: Zu wenig feste Details (Glaskanten, Deko, Kies) waren sichtbar, oft weil bewegte Fische oder freies Wasser den Großteil des Bildes bedeckten.' },
        'vid.conf.r.bursts': { en: 'many moving shapes overlap, so sudden darting was not measured', pt: 'muitas formas em movimento se sobrepõem, então as arrancadas súbitas não foram medidas', es: 'muchas formas en movimiento se superponen, así que no se midieron las arrancadas bruscas', vi: 'nhiều hình chuyển động chồng lên nhau nên không đo được các lần lao đi đột ngột', id: 'banyak bentuk bergerak saling tumpang tindih, jadi lesatan tiba-tiba tidak diukur', de: 'viele bewegte Formen überlappen sich, daher wurden plötzliche Sprints nicht gemessen' },
        'vid.sev.ok_low': { en: 'NO RED FLAG SEEN', pt: 'NENHUM ALERTA VISTO', es: 'NINGUNA ALERTA VISTA', vi: 'CHƯA THẤY DẤU HIỆU XẤU', id: 'TIDAK TERLIHAT TANDA BAHAYA', de: 'KEIN WARNZEICHEN ERKANNT' },
        'vid.v.calm_spread.title_low': { en: 'Calm, spread out - in what could be measured', pt: 'Calmos e espalhados - no que pôde ser medido', es: 'Tranquilos y repartidos - en lo que se pudo medir', vi: 'Bình thản, bơi tản ra - trong phạm vi đo được', id: 'Tenang, menyebar - sejauh yang bisa diukur', de: 'Ruhig, gut verteilt - soweit messbar' },
        'vid.v.calm_group.title_low': { en: 'Calm, swimming as a group - in what could be measured', pt: 'Calmos, nadando em grupo - no que pôde ser medido', es: 'Tranquilos, nadando en grupo - en lo que se pudo medir', vi: 'Bình thản, bơi theo đàn - trong phạm vi đo được', id: 'Tenang, berenang berkelompok - sejauh yang bisa diukur', de: 'Ruhig, in der Gruppe schwimmend - soweit messbar' },
        'vid.v.calm.note_low': { en: 'No behavior red flag was seen in what this clip allowed to measure. Fish can look normal while ammonia is rising - keep testing.', pt: 'Nenhum sinal de alerta no comportamento foi visto no que este vídeo permitiu medir. Os peixes podem parecer normais enquanto a amônia sobe - continue testando.', es: 'No se vieron señales de alerta en el comportamiento en lo que este video permitió medir. Los peces pueden parecer normales mientras sube el amoníaco - sigue analizando el agua.', vi: 'Không thấy dấu hiệu bất thường trong hành vi ở những gì video này cho phép đo. Cá vẫn có thể trông bình thường trong khi amoniac đang tăng - hãy tiếp tục kiểm tra nước.', id: 'Tidak terlihat tanda bahaya pada perilaku sejauh yang bisa diukur dari video ini. Ikan bisa terlihat normal saat amonia sedang naik - tetap uji airnya.', de: 'Im Verhalten war kein Warnzeichen zu sehen, soweit dieser Clip eine Messung erlaubte. Fische können normal wirken, während der Ammoniakwert steigt - testen Sie das Wasser weiterhin.' },
        'vid.cav.giant': { en: 'Very large moving shapes (a hand, a pet or a person outside the glass, or a fish right in front of the lens) were left out of the fish count and the top / middle / bottom shares.', pt: 'Formas em movimento muito grandes (uma mão, um animal de estimação ou uma pessoa do lado de fora do vidro, ou um peixe bem na frente da lente) ficaram fora da contagem de peixes e das parcelas superior / médio / inferior.', es: 'Las formas en movimiento muy grandes (una mano, una mascota o una persona al otro lado del cristal, o un pez justo delante del objetivo) quedaron fuera del recuento de peces y de las proporciones superior / medio / inferior.', vi: 'Các hình chuyển động rất lớn (bàn tay, thú cưng hoặc người ở bên ngoài kính, hoặc một con cá ở sát ống kính) đã được loại khỏi số cá ước tính và tỷ lệ ở phần trên / giữa / dưới.', id: 'Bentuk bergerak yang sangat besar (tangan, hewan peliharaan, atau orang di luar kaca, atau ikan tepat di depan lensa) tidak dimasukkan ke dalam hitungan ikan dan porsi atas / tengah / bawah.', de: 'Sehr große bewegte Formen (eine Hand, ein Haustier oder eine Person vor der Scheibe oder ein Fisch direkt vor der Linse) wurden bei der Fischzahl und den Anteilen oben / Mitte / unten nicht mitgezählt.' },
        'vid.val.bursts_na': { en: 'not measured (too many shapes overlap)', pt: 'não medido (formas demais se sobrepõem)', es: 'no medido (se superponen demasiadas formas)', vi: 'không đo (quá nhiều hình chồng lên nhau)', id: 'tidak diukur (terlalu banyak bentuk tumpang tindih)', de: 'nicht gemessen (zu viele Formen überlappen sich)' },
        'vid.val.count_unreliable': { en: '{n} (range {lo}-{hi}) - may be too high, see the limits below', pt: '{n} (faixa {lo}-{hi}) - pode estar alto demais, veja os limites abaixo', es: '{n} (rango {lo}-{hi}) - puede ser demasiado alto, consulta los límites abajo', vi: '{n} (khoảng {lo}-{hi}) - có thể quá cao, xem phần giới hạn bên dưới', id: '{n} (rentang {lo}-{hi}) - mungkin terlalu tinggi, lihat batasan di bawah', de: '{n} (Spanne {lo}-{hi}) - möglicherweise zu hoch, siehe Grenzen unten' },
        'vid.legend_tank': { en: 'Dotted lines: tank top and floor used for top / middle / bottom.', pt: 'Linhas pontilhadas: topo e fundo do aquário usados para dividir em superior / médio / inferior.', es: 'Líneas de puntos: parte superior y fondo del acuario que se usan para dividir en superior / medio / inferior.', vi: 'Đường chấm chấm: mép trên và đáy bể dùng để chia trên / giữa / dưới.', id: 'Garis titik-titik: bagian atas dan dasar akuarium yang dipakai untuk atas / tengah / bawah.', de: 'Gepunktete Linien: Ober- und Unterkante des Aquariums für oben / Mitte / unten.' },
        'vid.ml.h': { en: 'Optional: mark fish on still frames', pt: 'Opcional: marcar peixes em quadros estáticos', es: 'Opcional: marcar peces en fotogramas fijos', vi: 'Tùy chọn: đánh dấu cá trên khung hình tĩnh', id: 'Opsional: tandai ikan di bingkai diam', de: 'Optional: Fische auf Standbildern markieren' },
        'vid.ml.intro': { en: 'An on-device model can mark fish-like shapes on a few still frames of this clip. It does not need a steady camera, but it is a large one-time download (from the Hugging Face model hub - the clip itself is not uploaded) and slow, especially on phones.', pt: 'Um modelo no dispositivo pode marcar formas parecidas com peixes em alguns quadros estáticos deste vídeo. Ele não precisa de câmera estável, mas exige um download único grande (do repositório de modelos Hugging Face - o vídeo em si não é enviado) e é lento, principalmente no celular.', es: 'Un modelo en el dispositivo puede marcar formas parecidas a peces en algunos fotogramas fijos de este video. No necesita una cámara estable, pero es una descarga única grande (desde el repositorio de modelos Hugging Face - el video en sí no se sube) y es lento, sobre todo en el teléfono.', vi: 'Một mô hình chạy trên thiết bị có thể đánh dấu các hình giống cá trên vài khung hình tĩnh của video này. Mô hình không cần máy quay ổn định, nhưng phải tải một lần khá nặng (từ kho mô hình Hugging Face - bản thân video không bị tải lên) và chạy chậm, nhất là trên điện thoại.', id: 'Model di perangkat dapat menandai bentuk mirip ikan di beberapa bingkai diam dari video ini. Model ini tidak butuh kamera yang stabil, tetapi unduhannya besar (sekali saja, dari repositori model Hugging Face - videonya sendiri tidak diunggah) dan lambat, terutama di ponsel.', de: 'Ein Modell auf dem Gerät kann auf einigen Standbildern dieses Clips fischähnliche Formen markieren. Es braucht keine ruhige Kamera, ist aber ein großer einmaliger Download (aus dem Modell-Hub von Hugging Face - der Clip selbst wird nicht hochgeladen) und langsam, besonders auf dem Handy.' },
        'vid.ml.intro_low': { en: 'The motion check above is limited for this clip. An on-device model can mark fish-like shapes on a few still frames instead - each frame is read on its own, so a moving camera does not stop it (motion blur can still hide fish). It is a large one-time download (from the Hugging Face model hub - the clip itself is not uploaded) and slow, especially on phones.', pt: 'A verificação de movimento acima é limitada para este vídeo. Um modelo no dispositivo pode marcar formas parecidas com peixes em alguns quadros estáticos - cada quadro é lido separadamente, então uma câmera em movimento não o impede (o borrão de movimento ainda pode esconder peixes). Exige um download único grande (do repositório de modelos Hugging Face - o vídeo em si não é enviado) e é lento, principalmente no celular.', es: 'La comprobación de movimiento de arriba es limitada para este video. Un modelo en el dispositivo puede marcar formas parecidas a peces en algunos fotogramas fijos - cada fotograma se analiza por separado, así que una cámara en movimiento no lo impide (el desenfoque por movimiento todavía puede ocultar peces). Es una descarga única grande (desde el repositorio de modelos Hugging Face - el video en sí no se sube) y es lento, sobre todo en el teléfono.', vi: 'Phép kiểm tra chuyển động ở trên bị hạn chế với video này. Thay vào đó, một mô hình chạy trên thiết bị có thể đánh dấu các hình giống cá trên vài khung hình tĩnh - mỗi khung hình được đọc riêng, nên máy quay rung không cản trở việc này (nhưng hình bị nhòe do chuyển động vẫn có thể che mất cá). Mô hình phải tải một lần khá nặng (từ kho mô hình Hugging Face - bản thân video không bị tải lên) và chạy chậm, nhất là trên điện thoại.', id: 'Pemeriksaan gerakan di atas terbatas untuk video ini. Sebagai gantinya, model di perangkat dapat menandai bentuk mirip ikan di beberapa bingkai diam - setiap bingkai dibaca sendiri, jadi kamera yang bergerak tidak menghalanginya (gambar yang buram karena gerakan tetap bisa menyembunyikan ikan). Unduhannya besar (sekali saja, dari repositori model Hugging Face - videonya sendiri tidak diunggah) dan lambat, terutama di ponsel.', de: 'Die Bewegungsprüfung oben ist für diesen Clip eingeschränkt. Stattdessen kann ein Modell auf dem Gerät auf einigen Standbildern fischähnliche Formen markieren - jedes Bild wird einzeln gelesen, deshalb hindert eine bewegte Kamera es nicht daran (Bewegungsunschärfe kann Fische trotzdem verdecken). Es ist ein großer einmaliger Download (aus dem Modell-Hub von Hugging Face - der Clip selbst wird nicht hochgeladen) und langsam, besonders auf dem Handy.' },
        'vid.ml.btn': { en: 'Mark fish in {n} still frames - on-device, {size} one-time download, about {min} min', pt: 'Marcar peixes em {n} quadros estáticos - no dispositivo, download único de {size}, cerca de {min} min', es: 'Marcar peces en {n} fotogramas fijos - en el dispositivo, descarga única de {size}, unos {min} min', vi: 'Đánh dấu cá trong {n} khung hình tĩnh - chạy trên thiết bị, tải một lần {size}, khoảng {min} phút', id: 'Tandai ikan di {n} bingkai diam - di perangkat, unduhan sekali {size}, sekitar {min} menit', de: 'Fische in {n} Standbildern markieren - auf dem Gerät, einmaliger Download von {size}, etwa {min} Min.' },
        'vid.ml.unsupported': { en: 'Not offered on this device: the model needs more memory and speed than phones, tablets and this browser provide. On a desktop or laptop computer with at least 8 GB of memory, in Chrome or Edge, the same clip can be checked this way.', pt: 'Não disponível neste dispositivo: o modelo precisa de mais memória e velocidade do que celulares, tablets e este navegador oferecem. Em um computador de mesa ou notebook com pelo menos 8 GB de memória, no Chrome ou no Edge, o mesmo vídeo pode ser verificado assim.', es: 'No disponible en este dispositivo: el modelo necesita más memoria y velocidad de las que ofrecen los teléfonos, las tabletas y este navegador. En una computadora de escritorio o portátil con al menos 8 GB de memoria, en Chrome o Edge, se puede comprobar el mismo video de esta forma.', vi: 'Không khả dụng trên thiết bị này: mô hình cần nhiều bộ nhớ và tốc độ hơn mức mà điện thoại, máy tính bảng và trình duyệt này đáp ứng được. Trên máy tính để bàn hoặc máy tính xách tay có ít nhất 8 GB bộ nhớ, dùng Chrome hoặc Edge, có thể kiểm tra cùng video này theo cách đó.', id: 'Tidak tersedia di perangkat ini: model membutuhkan memori dan kecepatan lebih besar daripada yang disediakan ponsel, tablet, dan browser ini. Di komputer desktop atau laptop dengan memori minimal 8 GB, di Chrome atau Edge, video yang sama bisa diperiksa dengan cara ini.', de: 'Auf diesem Gerät nicht verfügbar: Das Modell braucht mehr Speicher und Rechenleistung, als Handys, Tablets und dieser Browser bieten. Auf einem Desktop-PC oder Laptop mit mindestens 8 GB Arbeitsspeicher lässt sich derselbe Clip in Chrome oder Edge so prüfen.' },

        'vid.ml.tiers_pic': { en: 'Marked fish in the top / middle / bottom third of the picture (the tank outline was not found): {top} / {mid} / {bottom}.', pt: 'Peixes marcados no terço superior / médio / inferior da imagem (o contorno do aquário não foi encontrado): {top} / {mid} / {bottom}.', es: 'Peces marcados en el tercio superior / medio / inferior de la imagen (no se encontró el contorno del acuario): {top} / {mid} / {bottom}.', vi: 'Cá được đánh dấu ở một phần ba trên / giữa / dưới của khung hình (không tìm thấy đường viền của bể): {top} / {mid} / {bottom}.', id: 'Ikan yang ditandai di sepertiga atas / tengah / bawah gambar (garis tepi akuarium tidak ditemukan): {top} / {mid} / {bottom}.', de: 'Markierte Fische im oberen / mittleren / unteren Drittel des Bildes (der Umriss des Aquariums wurde nicht gefunden): {top} / {mid} / {bottom}.' },
        'vid.ml.moving': { en: '{share} of the marked fish were also moving shapes in the motion check at that moment.', pt: '{share} dos peixes marcados também eram formas em movimento na verificação de movimento naquele momento.', es: 'El {share} de los peces marcados también eran formas en movimiento en la comprobación de movimiento en ese momento.', vi: '{share} số cá được đánh dấu cũng là hình đang chuyển động trong phép kiểm tra chuyển động tại thời điểm đó.', id: '{share} dari ikan yang ditandai juga merupakan bentuk bergerak dalam pemeriksaan gerakan pada saat itu.', de: '{share} der markierten Fische waren in diesem Moment auch bewegte Formen in der Bewegungsprüfung.' },
        'vid.ml.more': { en: 'The model marked clearly more fish than moving shapes were counted: some fish may have been still, hidden behind others, or blended into the background.', pt: 'O modelo marcou bem mais peixes do que as formas em movimento contadas: alguns peixes podem ter ficado parados, escondidos atrás de outros ou confundidos com o fundo.', es: 'El modelo marcó bastantes más peces que formas en movimiento contadas: algunos peces pudieron quedarse quietos, ocultos detrás de otros o confundirse con el fondo.', vi: 'Mô hình đánh dấu nhiều cá hơn hẳn số hình chuyển động đếm được: một số con có thể đứng yên, bị con khác che khuất hoặc lẫn vào nền.', id: 'Model menandai jauh lebih banyak ikan daripada jumlah bentuk bergerak yang dihitung: beberapa ikan mungkin diam, tersembunyi di balik ikan lain, atau menyatu dengan latar.', de: 'Das Modell hat deutlich mehr Fische markiert, als bewegte Formen gezählt wurden: Manche Fische waren vielleicht still, von anderen verdeckt oder kaum vom Hintergrund zu unterscheiden.' },
        'vid.ml.fewer': { en: 'The model marked clearly fewer fish than moving shapes were counted: one fish can show up as several moving shapes, so the lower number is likely closer.', pt: 'O modelo marcou bem menos peixes do que as formas em movimento contadas: um peixe pode aparecer como várias formas em movimento, então o número menor provavelmente está mais perto do real.', es: 'El modelo marcó bastantes menos peces que formas en movimiento contadas: un pez puede aparecer como varias formas en movimiento, así que el número menor probablemente se acerca más a la realidad.', vi: 'Mô hình đánh dấu ít cá hơn hẳn số hình chuyển động đếm được: một con cá có thể hiện ra thành nhiều hình chuyển động, nên con số nhỏ hơn có lẽ sát thực tế hơn.', id: 'Model menandai jauh lebih sedikit ikan daripada jumlah bentuk bergerak yang dihitung: satu ikan bisa muncul sebagai beberapa bentuk bergerak, jadi angka yang lebih kecil kemungkinan lebih mendekati kenyataan.', de: 'Das Modell hat deutlich weniger Fische markiert, als bewegte Formen gezählt wurden: Ein Fisch kann als mehrere bewegte Formen erscheinen, deshalb liegt die kleinere Zahl wahrscheinlich näher an der Wirklichkeit.' },
        'vid.val.fused_range': { en: 'about {lo}-{hi}', pt: 'cerca de {lo}-{hi}', es: 'unos {lo}-{hi}', vi: 'khoảng {lo}-{hi}', id: 'sekitar {lo}-{hi}', de: 'etwa {lo}-{hi}' },
        'vid.ml.between': { en: 'The model marked clearly fewer fish than moving shapes were counted: the model can miss fish inside a dense group, and one fish can show up as several moving shapes, so the true number is likely in between.', pt: 'O modelo marcou bem menos peixes do que as formas em movimento contadas: o modelo pode deixar de marcar peixes dentro de um grupo denso, e um peixe pode aparecer como várias formas em movimento, então o número real provavelmente fica entre os dois.', es: 'El modelo marcó bastantes menos peces que formas en movimiento contadas: el modelo puede pasar por alto peces dentro de un grupo denso, y un pez puede aparecer como varias formas en movimiento, así que el número real probablemente está entre ambos.', vi: 'Mô hình đánh dấu ít cá hơn hẳn số hình chuyển động đếm được: mô hình có thể bỏ sót cá trong đàn dày, còn một con cá có thể hiện ra thành nhiều hình chuyển động, nên con số thực có lẽ nằm ở khoảng giữa.', id: 'Model menandai jauh lebih sedikit ikan daripada jumlah bentuk bergerak yang dihitung: model bisa melewatkan ikan di dalam kelompok yang rapat, dan satu ikan bisa muncul sebagai beberapa bentuk bergerak, jadi jumlah sebenarnya kemungkinan ada di antara keduanya.', de: 'Das Modell hat deutlich weniger Fische markiert, als bewegte Formen gezählt wurden: Das Modell kann Fische in einer dichten Gruppe übersehen, und ein Fisch kann als mehrere bewegte Formen erscheinen, deshalb liegt die tatsächliche Zahl wahrscheinlich dazwischen.' },
        'vid.ml.note': { en: 'The model marks fish-like shapes on single frames: it can miss fish behind plants or inside a dense group and can mark a reflection. Numbers are approximate; it does not identify species and says nothing about water quality.', pt: 'O modelo marca formas parecidas com peixes em quadros isolados: pode deixar de marcar peixes atrás de plantas ou dentro de um grupo denso e pode marcar um reflexo. Os números são aproximados; ele não identifica espécies e não diz nada sobre a qualidade da água.', es: 'El modelo marca formas parecidas a peces en fotogramas sueltos: puede pasar por alto peces detrás de plantas o dentro de un grupo denso y puede marcar un reflejo. Los números son aproximados; no identifica especies y no dice nada sobre la calidad del agua.', vi: 'Mô hình đánh dấu các hình giống cá trên từng khung hình riêng lẻ: có thể bỏ sót cá sau cây thủy sinh hoặc trong đàn dày và có thể đánh dấu nhầm hình phản chiếu. Các con số chỉ là ước lượng; mô hình không nhận diện loài và không cho biết gì về chất lượng nước.', id: 'Model menandai bentuk mirip ikan pada satu bingkai saja: model bisa melewatkan ikan di balik tanaman atau di dalam kelompok yang rapat dan bisa menandai pantulan. Angkanya perkiraan; model tidak mengenali spesies dan tidak memberi tahu apa pun tentang kualitas air.', de: 'Das Modell markiert fischähnliche Formen auf einzelnen Bildern: Es kann Fische hinter Pflanzen oder in einer dichten Gruppe übersehen und eine Spiegelung markieren. Die Zahlen sind ungefähr; es bestimmt keine Arten und sagt nichts über die Wasserqualität aus.' },

        'ai.prose_lang_unsupported': { en: 'Written in English: the browser built-in AI cannot write {lang} on this device.', pt: 'Escrito em inglês: a IA integrada do navegador não consegue escrever em {lang} neste dispositivo.', es: 'Escrito en inglés: la IA integrada del navegador no puede escribir en {lang} en este dispositivo.', vi: 'Được viết bằng tiếng Anh: AI tích hợp của trình duyệt không viết được {lang} trên thiết bị này.', id: 'Ditulis dalam bahasa Inggris: AI bawaan browser tidak bisa menulis dalam bahasa {lang} di perangkat ini.', de: 'Auf Englisch verfasst: Die integrierte KI des Browsers kann auf diesem Gerät nicht auf {lang} schreiben.' },

        // AI-tier status lines: they only ever show while a language OUTSIDE
        // the hand-written table is selected, so they are English by design.
        'i18n.translating_builtin': { en: 'Translating the report into {lang} with the browser built-in translator (on-device)...' },
        'i18n.done_builtin': { en: 'Translated into {lang} by the browser built-in translator (on-device). Numbers come straight from the measurements.' },

        'i18n.btn_pack': { en: 'Get the {lang} language pack (Chrome may download it)' },
        'i18n.pack_progress': { en: 'Chrome is fetching the {lang} language pack... {pct}%' },
        'i18n.webllm_offer': { en: 'Translate into {lang} with an on-device AI model ({model}: about {dl} download, about {vram} of GPU memory, needs WebGPU)' },
        'i18n.webllm_progress': { en: 'Loading the on-device model... {pct}%' },
        'i18n.webllm_translating': { en: 'Translating the report into {lang} on this device... {done} of {total}' },
        'i18n.done_webllm': { en: 'Machine-translated into {lang} by a small on-device model. Numbers are inserted by the page, not by the model; wording may be imperfect.' },
        'i18n.no_engine': { en: 'This browser has no on-device translator for {lang} (no built-in translator, no usable WebGPU). The report stays in English.' },
        'i18n.partial': { en: '{n} phrases stayed in English because the translation dropped or changed a number or placeholder.' },
        'i18n.failed': { en: 'Translation failed: {msg}. The report stays in English.' },
        'i18n.showing_en': { en: 'Showing English until the {lang} translation is ready.' }
    };

    var awcI18n = { lang: 'en', ai: {}, aiKeptEn: {}, pendingLang: null };

    // Language NAME inside message text: localized into the active report
    // language via Intl.DisplayNames ('alemão', 'tiếng Đức'); English for the
    // EN-only AI status lines. The dropdown itself always shows autonyms.
    function awcLangName(code, inLang) {
        try { return new Intl.DisplayNames([inLang || (AWC_LANGS_TABLE.indexOf(awcI18n.lang) >= 0 ? awcLocale() : 'en')], { type: 'language' }).of(code === 'zh' ? 'zh-Hans' : code); }
        catch (e) { return AWC_LANG_EN[code] || code; }
    }
    function awcLocale() { return awcI18n.lang === 'zh' ? 'zh-CN' : awcI18n.lang; }

    function awcPluralCat(n) {
        try { return new Intl.PluralRules(awcLocale()).select(Math.abs(n)); }
        catch (e) { return Math.abs(n) === 1 ? 'one' : 'other'; }
    }

    // t(id, params): AI runtime map for the active language -> hand table ->
    // English -> the id itself (a missing id is visible, never silent). A
    // param may itself be a message reference { id, p } (resolved here, so a
    // stored status like "could not read the clip ({reason})" re-renders in
    // the new language after a switch).
    function awcT(id, params) {
        var lang = awcI18n.lang, row = AWC_I18N[id], v = null;
        var ai = awcI18n.ai[lang];
        if (ai && ai[id] != null) v = ai[id];
        else if (row) v = (row[lang] != null) ? row[lang] : row.en;
        if (v == null) v = id;
        if (typeof v === 'object') {
            // params._n carries the RAW number (formatted strings like '1.234'
            // cannot be parsed back safely in every locale).
            var cat = awcPluralCat(params && params._n != null ? params._n : 0);
            v = v[cat] != null ? v[cat] : (v.other != null ? v.other : v.one);
        }
        return String(v).replace(/\{(\w+)\}/g, function (m, k) {

    function awcMetrics(d0) {

    };
    function awcStateTitle(k) { return awcT('state.' + k + '.title'); }

    function awcCompare(mA, mB) {
        var exposureDelta = Math.abs(mA.meanLuma - mB.meanLuma);
        var comparable = exposureDelta < 0.40;
        var lowConfidence = exposureDelta >= 0.22;
        var deltaPts = mB.clarity - mA.clarity;
        var trend = !comparable ? 'not_comparable' : (deltaPts >= 4 ? 'improving' : (deltaPts <= -4 ? 'worsening' : 'stable'));
        return { comparable: comparable, lowConfidence: lowConfidence, exposureDelta: exposureDelta,
                 deltaPts: deltaPts, trend: trend, stateA: awcStateOf(mA), stateB: awcStateOf(mB) };
    }

    function awcBioload(stock, liters) {
        var load = 0, minVol = 0, any = false;
        stock.forEach(function (s) {
            var sp = null;
            for (var i = 0; i < AWC_SPECIES.length; i++) if (AWC_SPECIES[i].id === s.id) sp = AWC_SPECIES[i];
            if (!sp || !s.count) return;
            any = true; load += sp.waste * s.count; minVol += sp.minL * s.count;
        });
        if (!any || !liters || liters <= 0) return null;
        var pressure = load / (liters / 10);
        var band = pressure < 1 ? 'light' : pressure < 2 ? 'balanced' : pressure < 3.5 ? 'heavy' : 'overstocked';
        return { pressure: Math.round(pressure * 100) / 100, band: band, minLiters: minVol };
    }

    // Returns message IDS, not sentences.
    function awcBlueprint(cmp, bio) {
        var acts = [];
        if (!cmp.comparable) acts.push('act.retake');
        if (cmp.stateB === 'biological_haze') acts.push('act.bio_feeding', 'act.bio_filter', 'act.bio_agitation');
        if (cmp.stateB === 'particulate') acts.push('act.part_floss', 'act.part_stir');
        if (cmp.stateB === 'green_bloom') acts.push('act.green_light', 'act.green_feed');
        if (cmp.stateB === 'light_haze') acts.push('act.haze_reshoot');
        if (bio && bio.band === 'overstocked') acts.push('act.overstocked');
        if (bio && bio.band === 'heavy') acts.push('act.heavy');
        if (!acts.length) acts.push('act.none');
        return acts;
    }

    function awcReadStock() {
        var stock = [];
        AWC_SPECIES.forEach(function (sp) {
            var el = awcEl('awcN_' + sp.id);
            var c = el ? parseInt(el.value, 10) : 0;
            if (c > 0) stock.push({ id: sp.id, count: c });
        });
        return stock;
    }
    function awcReadStockForm() {
        var liters = parseFloat((awcEl('awcVolume') || {}).value || '');
        var unit = (awcEl('awcVolUnit') || {}).value || 'l';
        if (unit === 'gal' && liters) liters = liters * 3.785;
        return awcBioload(awcReadStock(), liters);
    }
    // Video 'unseen_fish' input: fish only (snails / shrimp excluded, noted).
    function awcStockFishCounts() {
        var fish = 0, inv = 0;
        awcReadStock().forEach(function (s) { if (AWC_INVERTS[s.id]) inv += s.count; else fish += s.count; });
        return { fish: fish, inverts: inv };
    }

    // ---------------------------------------------------------------- state
    // gen = run token: bumped whenever an input changes or a new analysis
    // starts, so every async result (pixels, slider, CLIP, built-in AI, EXIF,
    // frame decode) from an older input is dropped instead of painting over
    // the latest one. run = completed analyses (mirrored to data-run on the
    // single .awc-report root). stats = call counters (switching language or
    // moving the surface slider must not move the analysis counters).
    var awc = { mode: 'photos', A: null, B: null, video: null, videoResult: null, last: null,
                exifr: null, clip: null, clipLoading: null, builtin: null, clipResult: null, aiProse: null,
                juxtaLoaded: false, juxtaCss: false, juxtaPending: null, jx: null,
                gen: 0, run: 0, busy: false, abort: null, lastStatus: null, surfacePct: 12, sampleLoading: false,
                stats: { photoAnalyses: 0, pixelPasses: 0, videoDecodes: 0, behaviourRuns: 0, recomputes: 0, renders: 0 } };

    function awcIsBlob(u) { return typeof u === 'string' && u.indexOf('blob:') === 0; }

    // Status line: stores the id so a language switch re-renders it too.
    function awcStatus(id, params, spin) {
        awc.lastStatus = { id: id, params: params || null, spin: !!spin };
        var el = awcEl('awcStatus');
        if (el) el.innerHTML = (spin ? '<i class="fa fa-spinner fa-spin"></i> ' : '') + awcEsc(awcT(id, params));
    }

    // EXIF capture time via vendored exifr (rule: metadata read on-device).
    function awcExifr() {
        if (window.exifr && typeof window.exifr.parse === 'function') return Promise.resolve(window.exifr);
        if (awc.exifr) return awc.exifr;
        awc.exifr = new Promise(function (res, rej) {
            loadScript(awcBase() + '/vendor/exifr/exifr-lite.umd.js', function () {
                if (window.exifr) res(window.exifr); else rej(new Error('exifr failed to load'));
            });
        });
        return awc.exifr;
    }

    // Detach the previous before/after slider. JXSlider() - unlike the lib's own
    // scanPage()/makeSlider() - never empties its target and resolves its
    // selector lazily inside Image.onload, so an old instance must be disarmed
    // here or it re-attaches into the newest wrapper. The lib also adds an
    // anonymous window 'resize' listener per slider that can never be
    // removed: neutralise what it calls and drop the instance's DOM/image
    // references, so an old slider neither reacts nor keeps its images alive.
    function awcJuxtaTeardown() {
        var inst = awc.jx; awc.jx = null;
        if (inst) {
            [inst.imgBefore, inst.imgAfter].forEach(function (g) { if (g && g.image) g.image.onload = null; });
            var list = window.juxtapose && window.juxtapose.sliders;
            if (list) { var i = list.indexOf(inst); if (i !== -1) list.splice(i, 1); }
            inst.setWrapperDimensions = function () { };
            inst.wrapper = inst.slider = inst.handle = inst.leftImage = inst.rightImage = inst.imgBefore = inst.imgAfter = null;
        }
        var jx = awcEl('awcJuxta');
        if (jx) jx.innerHTML = '';
    }

    // JuxtaposeJS writes a fixed pixel width on its wrapper and reads that same
    // width back on resize, so on its own it never shrinks when the screen gets
    // narrower (phone turned to portrait) or grows back. Re-fit the CURRENT
    // slider to its box (max 640 px) on every resize; registered once.
    function awcJuxtaFit() {
        var J = awc.jx, box = awcEl('awcJuxta');
        if (!J || !J.wrapper || !box || !box.contains(J.wrapper) || !box.clientWidth) return;
        try {
            J.wrapper.style.width = Math.min(640, box.clientWidth) + 'px';
            J.setWrapperDimensions();
        } catch (e) { void e; }
    }

    // Clear everything derived from the previous input (slider, both reports,
    // AI output). The .awc-report root itself stays: it is the one and only
    // report root, its data-run counter keeps counting.
    function awcClearOutputs() {
        awcJuxtaTeardown();
        ['awcBadge', 'awcGauges', 'awcTable', 'awcBio', 'awcActions', 'awcClipOut'].forEach(function (id) { var e = awcEl(id); if (e) e.innerHTML = ''; });
        ['awcElapsed', 'awcNote', 'awcAiProse'].forEach(function (id) { var e = awcEl(id); if (e) e.textContent = ''; });
        awcShow('awcClipProgress', false);
        var bar = awcEl('awcClipBar');
        if (bar) { bar.style.width = awc.clip ? '100%' : '0%'; bar.textContent = awc.clip ? awcT('clip.ready') : '0%'; bar.setAttribute('aria-valuenow', awc.clip ? '100' : '0'); }
        var vr = awcEl('awcVideoReport');
        if (vr) vr.innerHTML = '';
        awcShow('awcVideoReport', false);
        awcShow('awcPhotoReport', false);
    }

    // An input changed: the old report no longer matches it.
    function awcResetResult() {
        awc.sampleLoading = false;
        awc.gen++;
        if (awc.abort) { try { awc.abort.abort(); } catch (e) { void e; } awc.abort = null; }
        awc.busy = false;
        awc.last = null; awc.videoResult = null; awc.clipResult = null; awc.aiProse = null;
        awcClearOutputs();
        awcVidProgressShow(false);
        awcShow('awcResult', false);
    }

    function awcSlotLabel(slot) { return slot.labelId ? awcT(slot.labelId) : (slot.name || ''); }

    // Put ONE photo (upload or bundled sample) into slot A or B. Leaves video
    // mode, revokes the slot's previous blob URL and resets its labels.
    function awcSetSlot(which, slot) {
        if (awc.mode !== 'photos') awcLeaveVideo();
        var prev = awc[which];
        awc[which] = slot;
        awcResetResult();
        var img = awcEl(which === 'A' ? 'awcThumbA' : 'awcThumbB');
        if (img) { img.src = slot.url; img.style.display = 'block'; }
        var lbl = awcEl(which === 'A' ? 'awcNameA' : 'awcNameB');
        if (lbl) lbl.textContent = awcSlotLabel(slot);
        var when = awcEl(which === 'A' ? 'awcWhenA' : 'awcWhenB');
        if (when) when.textContent = '';
        if (prev && prev !== slot && awcIsBlob(prev.url) && prev.url !== slot.url) URL.revokeObjectURL(prev.url);
        awcMaybeEnable();
        awcStatus(awc.A && awc.B ? 'status.photos_ready' : 'status.need_second');
    }

    function awcReadSlot(which, file) {
        var slot = { file: file, url: URL.createObjectURL(file), name: file.name, when: null, whenReady: false, metrics: null };
        awcSetSlot(which, slot);
        awcExifr().then(function (ex) { return ex.parse(file, ['DateTimeOriginal', 'CreateDate']); })
            .then(function (meta) {
                if (awc[which] !== slot) return; // a newer photo replaced this slot meanwhile
                var t = meta && (meta.DateTimeOriginal || meta.CreateDate);
                slot.when = t ? new Date(t) : null; slot.whenReady = true;
                awcWhenLabel(which, slot);
            })
            .then(null, function () { if (awc[which] !== slot) return; slot.when = null; slot.whenReady = true; awcWhenLabel(which, slot); });
    }

    function awcWhenLabel(which, slot) {
        var el = awcEl(which === 'A' ? 'awcWhenA' : 'awcWhenB');
        if (!el || !slot || !slot.whenReady) return;
        if (slot.when) el.textContent = awcT('when.taken', { when: awcDateTime(slot.when) });
        else if (slot.file && slot.file.lastModified) el.textContent = awcT('when.file_date', { date: awcDate(new Date(slot.file.lastModified)) });
        else if (slot.file) el.textContent = awcT('when.none');
    }

    function awcClearPhotoSlot(which) {
        var s = awc[which];
        if (s && awcIsBlob(s.url)) URL.revokeObjectURL(s.url);
        awc[which] = null;
        var img = awcEl(which === 'A' ? 'awcThumbA' : 'awcThumbB');
        if (img) { img.removeAttribute('src'); img.style.display = 'none'; }
        ['awcName', 'awcWhen'].forEach(function (p) { var e = awcEl(p + which); if (e) e.textContent = ''; });
    }

    // ---- video slot --------------------------------------------------------
    function awcVideoZoneLabel() {
        var V = awc.video, n = awcEl('awcNameV'), info = awcEl('awcInfoV');
        if (n) n.textContent = V ? (V.labelId ? awcT(V.labelId) : V.name) : '';
        if (info) {
            if (!V) info.textContent = '';
            else if (V.probe) info.textContent = awcT('drop.v_info_meta', { size: awcSizeStr(V.size), dur: awcNumMax(V.probe.dur, 1), w: V.probe.w, h: V.probe.h });
            else info.textContent = awcT('drop.v_info', { size: awcSizeStr(V.size) });
        }
        var z = awcEl('awcDropV');
        if (z) { if (V) z.classList.add('awc-has'); else z.classList.remove('awc-has'); }
    }

    function awcLeaveVideo() {
        awc.video = null; awc.videoResult = null;
        awc.mode = 'photos';
        awcVideoZoneLabel();
    }

    // Put ONE clip into the video slot: switches to video mode, empties both
    // photo slots, then probes the browser's own decoder (metadata, width,
    // one frame) so the analyze button can say BEFORE the click whether the
    // ~32 MB on-device decoder would be needed.
    function awcSetVideoFile(file, opts) {
        opts = opts || {};
        awcResetResult();
        awcClearPhotoSlot('A'); awcClearPhotoSlot('B');
        awc.mode = 'video';
        var V = { file: file, name: file.name || 'video', size: file.size || 0, labelId: opts.labelId || null, demo: !!opts.demo,
                  probe: null, checking: true, nativeFailed: false, nativeReason: null, tooLarge: false, declined: false };
        awc.video = V;
        awcVideoZoneLabel();
        awcMaybeEnable();
        awcStatus('status.vid_checking', null, true);
        var gen = awc.gen;
        awcProbeNative(file).then(function (pr) {
            if (gen !== awc.gen || awc.video !== V) return;
            V.checking = false;
            if (pr.ok) {
                V.probe = pr;
                awcStatus(pr.dur > AWC_VID.maxSec + 0.05 ? 'status.vid_ready_long' : 'status.vid_ready', { dur: awcNumMax(pr.dur, 1), max: awcNum(AWC_VID.maxSec) });
            } else {
                awcVideoNativeFailed(V, pr.code, true);
            }
            awcVideoZoneLabel();
            awcMaybeEnable();
            if (opts.autoAnalyze && pr.ok) awcAnalyzeVideo();
        });
    }

    function awcReasonId(code) {
        return code === 'timeout' ? 'err.vid_timeout' : code === 'black' ? 'err.vid_black' : code === 'unsupported' ? 'err.vid_codec' : 'err.vid_generic';
    }
    // The browser cannot decode this clip: offer the on-device decoder (size
    // on the button), or refuse it outright above 1 GB. 'unsupported' at the
    // probe = no decodable video track (typical: HEVC without a decoder); a
    // black-frame or timeout result says what actually went wrong instead.
    function awcVideoNativeFailed(V, code, atProbe) {
        V.nativeFailed = true; V.nativeReason = code;
        V.tooLarge = V.size > AWC_FF_MAX_BYTES;
        if (V.tooLarge) awcStatus('status.vid_too_large', { size: awcSizeStr(V.size) });
        else if (atProbe && code === 'unsupported') awcStatus('status.vid_need_ff', { mb: awcNum(AWC_FF_MB) });
        else awcStatus('status.vid_native_failed', { reason: { id: awcReasonId(code) }, mb: awcNum(AWC_FF_MB) });
    }

    // ---- input routing -----------------------------------------------------
    function awcIsVideoFile(f) {
        var t = String(f && f.type || ''), n = String(f && f.name || '').toLowerCase();
        if (/^video\//.test(t)) return true;
        return /\.(mov|m4v|mp4|webm|hevc|mkv|3gp)$/.test(n);
    }
    function awcIsImageFile(f) {
        var t = String(f && f.type || ''), n = String(f && f.name || '').toLowerCase();
        if (/^image\//.test(t)) return true;
        return /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif|svg)$/.test(n);
    }
    // 1 video -> video mode; 2+ images -> before/after; 1 image -> the slot
    // it was dropped on, else the next empty slot (B when both are full).
    function awcRouteFiles(list, slotHint) {
        var files = Array.prototype.slice.call(list || []);
        if (!files.length) return;
        var vids = files.filter(awcIsVideoFile);
        var imgs = files.filter(function (f) { return !awcIsVideoFile(f) && awcIsImageFile(f); });
        if (vids.length) { awcSetVideoFile(vids[0]); return; }
        if (!imgs.length) { awcStatus('status.unsupported_file'); return; }
        if (imgs.length >= 2) { awcReadSlot('A', imgs[0]); awcReadSlot('B', imgs[1]); return; }
        var which = slotHint || (awc.mode !== 'photos' || !awc.A ? 'A' : 'B');
        awcReadSlot(which, imgs[0]);
    }

    // Single analyze button: its label follows the mode and the decode path.
    function awcMaybeEnable() {
        var btn = awcEl('awcAnalyze');
        if (!btn) return;
        var V = awc.video, label, ok;
        if (awc.mode === 'video' && V) {
            if (V.nativeFailed) { label = awcT('btn.decode_ff', { mb: awcNum(AWC_FF_MB) }); ok = !V.tooLarge; }
            else { label = awcT('btn.analyze_clip'); ok = !!V.probe; }
        } else { label = awcT('btn.compare'); ok = !!(awc.A && awc.B); }
        btn.textContent = label;
        // while the bundled clip is being fetched the slots still hold the old
        // input; a click then would silently replace the clip it is waiting for
        btn.disabled = !ok || awc.busy || !!awc.sampleLoading;
        btn.setAttribute('data-mode', awc.mode === 'video' ? (V && V.nativeFailed ? 'video-ffmpeg' : 'video') : 'photos');
        awcShow('awcDeclineBtn', !!(awc.mode === 'video' && V && V.nativeFailed && !V.tooLarge && !V.declined && !awc.busy));
        awcShow('awcAbortBtn', !!awc.busy && awc.mode === 'video');
    }

    function awcWireDrop(zoneId, inputId, which) {
        var zone = awcEl(zoneId), input = inputId ? awcEl(inputId) : null;
        if (!zone) return;
        function pick() { (input || awcEl('awcFileAny')).click(); }
        zone.addEventListener('click', pick);
        zone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) { e.preventDefault(); pick(); } });
        zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('awc-over'); });
        zone.addEventListener('dragleave', function () { zone.classList.remove('awc-over'); });
        zone.addEventListener('drop', function (e) {
            e.preventDefault(); zone.classList.remove('awc-over');
            var fl = e.dataTransfer && e.dataTransfer.files;
            if (fl && fl.length) awcRouteFiles(fl, which);
        });
        // reset value so picking the SAME file again still fires change
        if (input) input.addEventListener('change', function () { if (input.files && input.files.length) awcRouteFiles(input.files, which); input.value = ''; });
    }

    // ---------------------------------------------------------------- photos: analyze + render
    function awcAnalyze() {
        var A = awc.A, B = awc.B;
        if (!A || !B || awc.mode !== 'photos') return;
        var gen = ++awc.gen;
        awc.stats.photoAnalyses++;
        awcStatus('status.reading', null, true);
        awcLoadToCanvas(A.url, function (eA, idA) {
            if (gen !== awc.gen) return; // superseded by a newer pair / click
            if (eA) { awcStatus('status.err_left', { msg: eA.awcId ? { id: eA.awcId } : eA.message }); return; }
            awcLoadToCanvas(B.url, function (eB, idB) {
                if (gen !== awc.gen) return;
                if (eB) { awcStatus('status.err_right', { msg: eB.awcId ? { id: eB.awcId } : eB.message }); return; }
                A.metrics = awcMetrics(idA);
                B.metrics = awcMetrics(idB);
                var cmp = awcCompare(A.metrics, B.metrics);
                var bio = awcReadStockForm();
                awcRender(cmp, bio);
                awcStatus('status.done');
            });
        });
    }

    function awcGaugeHtml(clarity) {
        var deg = Math.round(360 * Math.max(0, Math.min(100, clarity)) / 100);
        var col = clarity >= 70 ? '#2e7d32' : clarity >= 45 ? '#f59f00' : '#e03131';
        return '<div class="awc-ring" style="background:conic-gradient(' + col + ' ' + deg + 'deg,#e7e7e7 0deg)"><span>' + awcNum(clarity) + '</span></div>';
    }

    // The single report root: mode + language live on it; data-run counts
    // completed analyses (bumped AFTER the report is written, e2e waits on it).
    function awcReportRoot(mode) {
        var root = awcEl('awcReport');
        if (!root) return;
        root.setAttribute('data-mode', mode);
        root.setAttribute('lang', awcI18n.lang);
        root.setAttribute('dir', AWC_RTL[awcI18n.lang] ? 'rtl' : 'ltr');
        awcShow('awcPhotoReport', mode === 'photos');
        awcShow('awcVideoReport', mode === 'video');
    }
    function awcBumpRun() {
        awc.run++;
        var root = awcEl('awcReport');
        if (root) root.setAttribute('data-run', String(awc.run));
    }
    function awcRenderMachineLabel() {
        var el = awcEl('awcMachine');
        if (!el) return;
        if (awcIsMachine()) { el.innerHTML = awcBi('report.machine'); el.classList.remove('w3-hide'); }
        else { el.innerHTML = ''; el.classList.add('w3-hide'); }
    }

    // A new photo analysis: store structure, render, mount the slider.
    function awcRender(cmp, bio) {
        var wrap = awcEl('awcResult');
        if (!wrap) return;
        awcClearOutputs(); // nothing from an earlier run survives a new render
        awc.last = { cmp: cmp, bio: bio };
        awc.clipResult = null; awc.aiProse = null;          // new analysis -> old AI output is stale
        awcReportRoot('photos');
        wrap.classList.remove('w3-hide');
        awcRenderReport();
        awcMountJuxta();
        awcRenderAiPanel();
        awcBumpRun();
        if (wrap.scrollIntoView) wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Everything language-dependent in the photo report, from stored state.
    function awcRenderReport() {
        if (!awc.last || !awc.A || !awc.A.metrics || !awc.B || !awc.B.metrics) return;
        awc.stats.renders++;
        var cmp = awc.last.cmp, bio = awc.last.bio, mA = awc.A.metrics, mB = awc.B.metrics;
        var st = AWC_STATES[cmp.stateB];
        var badge = !cmp.comparable ? { badge: 'badge.retake', cls: 'w3-grey', key: 'not_comparable' } : { badge: st.badge, cls: st.cls, key: cmp.stateB };
        awcEl('awcBadge').innerHTML =
            '<span class="w3-tag w3-round ' + badge.cls + '">' + awcEsc(awcT(badge.badge)) + '</span> <b>' + awcEsc(awcStateTitle(badge.key)) + '</b>' +
            (cmp.comparable && cmp.lowConfidence ? ' <span class="w3-text-grey">' + awcEsc(awcT('badge.low_conf')) + '</span>' : '');

        var d = awcSigned(cmp.deltaPts);
        var trendTxt = cmp.trend === 'not_comparable' ? awcT('trend.not_comparable') : awcT('trend.' + cmp.trend, { d: d, _n: cmp.deltaPts });
        awcEl('awcGauges').innerHTML =
            '<div class="awc-gcol"><div class="awc-glabel">' + awcEsc(awcT('gauge.before')) + '</div>' + awcGaugeHtml(mA.clarity) + '</div>' +
            '<div class="awc-gcol awc-trend"><b>' + awcEsc(trendTxt) + '</b><br><span class="w3-text-grey">' + awcEsc(awcT('gauge.caption')) + '</span></div>' +
            '<div class="awc-gcol"><div class="awc-glabel">' + awcEsc(awcT('gauge.after')) + '</div>' + awcGaugeHtml(mB.clarity) + '</div>';

        var elapsed = '';
        if (awc.A.when && awc.B.when) {
            var hrs = Math.abs(awc.B.when - awc.A.when) / 3600000;
            elapsed = hrs >= 48 ? awcT('elapsed.days', { n: awcNum(Math.round(hrs / 24)), _n: Math.round(hrs / 24) })
                                : awcT('elapsed.hours', { n: awcNum(Math.round(hrs)), _n: Math.round(hrs) });
        }
        awcEl('awcElapsed').textContent = elapsed;

        function row(k, a, b, dd) { return '<tr><td>' + k + '</td><td>' + awcEsc(a) + '</td><td>' + awcEsc(b) + '</td><td>' + awcEsc(dd) + '</td></tr>'; }
        var dash = '-';

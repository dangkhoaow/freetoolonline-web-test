<script>
    // 3D scene archetype skeleton (huacachina-oasis) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (huacachina-oasis). All geometry is procedural. places-3d cluster,
    // authored 2026-07-28.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (encyclopedic / travel-agency consensus, cross-checked
    // 2026-07-28):
    //   - Huacachina, Ica Region, Peru, about 300 km south of Lima
    //   - A small natural desert lagoon ringed by towering sand dunes
    //   - Village population commonly cited around 200 residents
    //   - Surrounding dunes commonly cited up to about 100 m above the
    //     oasis floor
    //   - Nicknamed the "Oasis of America"
    //   - Popular for sandboarding and dune-buggy tourism
    //   - Local legend ties the lagoon to a mermaid/water-spirit story
    //   - The lagoon's water level has fluctuated historically; it is
    //     partially maintained today by pumping, a documented local concern
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'huacachina-oasis';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placeshuacachinaoasis'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x1c1a13, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.62));
        var key = new THREE.DirectionalLight(0xffe6b0, 1.1);
        key.position.set(-11, 17, -8);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return { mesh: new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 })), geo: geo, pos: pos };
        }

        // Radial dune-ring around a central lagoon: a smooth basin dip near
        // the origin (the oasis water), tapering with a continuous shore
        // curve (no hard pit walls - the lake-victoria lesson) into a ring
        // of wind-rippled sand dunes that rises all the way around. Ridge
        // waviness (a sine term keyed on angle, modulated by fbm) reads as
        // crescent-shaped barchan dune chains rather than a plain cone hill.
        // 1 unit = about 12 m vertical, so a dune amplitude of about 1.4-1.9
        // reads as roughly the commonly cited "up to about 100 m" figure.
        var OASIS_R = 2.1, DUNE_START = 1.75, DUNE_FULL = 3.1, BASIN_DEPTH = 0.5;
        function height(x, z) {
            var R = Math.sqrt(x * x + z * z);
            var theta = Math.atan2(z, x);
            var basin = -BASIN_DEPTH * (1 - smooth(0, OASIS_R * 1.25, R));
            var duneAmt = smooth(DUNE_START, DUNE_FULL, R);
            var ridge = 0.5 + 0.5 * Math.sin(theta * 6 + fbm(x * 0.35 + 4, z * 0.35 + 4, 3) * 3.0);
            var duneNoise = fbm(x * 0.55 + 11, z * 0.55 + 7, 4);
            var farRise = Math.max(0, R - DUNE_FULL) * 0.06;
            var dune = duneAmt * (0.35 + 0.85 * duneNoise + 0.55 * ridge) + farRise;
            return basin + dune;
        }

        var col = {
            water: new THREE.Color(0x2f7a70), shore: new THREE.Color(0xd8c78f),
            duneLow: new THREE.Color(0xcaa257), duneMid: new THREE.Color(0xe0bd6e),
            duneCrest: new THREE.Color(0xffe7a3), palm: new THREE.Color(0x4c7a3a)
        };
        var crestOn = true, palmOn = true;
        function color(c, h, x, z) {
            var n = 0.92 + 0.14 * fbm(x * 1.3 + 6, z * 1.3 + 3, 3);
            if (h < -0.06) { c.copy(col.water).multiplyScalar(n); return; }
            if (h < 0.06) { c.copy(col.shore).multiplyScalar(n); return; }
            var t = smooth(0.06, 1.9, h);
            if (crestOn) {
                if (t < 0.55) { c.copy(col.duneLow).lerp(col.duneMid, t / 0.55); }
                else { c.copy(col.duneMid).lerp(col.duneCrest, (t - 0.55) / 0.45); }
            } else {
                c.copy(col.duneLow).lerp(col.duneMid, t);
            }
            c.multiplyScalar(n);
        }
        var terrainInfo = makeTerrain(20, 16, shell.low ? 130 : 168, shell.low ? 104 : 134, height, color);
        scene.add(terrainInfo.mesh);

        // Palm oasis ring: a fixed set of small palm markers placed around
        // the lagoon's shoreline radius, each sampled against the real
        // height field so they sit on the terrain regardless of tuning.
        var PALM_COUNT = 10, PALM_R = OASIS_R * 0.92;
        var palmGroup = new THREE.Group();
        for (var i = 0; i < PALM_COUNT; i++) {
            var ang = (i / PALM_COUNT) * Math.PI * 2 + 0.15;
            var px = Math.cos(ang) * PALM_R, pz = Math.sin(ang) * PALM_R;
            var py = height(px, pz);
            var trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.045, 0.32, 6),
                new THREE.MeshStandardMaterial({ color: 0x6b5233, roughness: 0.85 })
            );
            trunk.position.set(px, py + 0.16, pz);
            var crown = new THREE.Mesh(
                new THREE.ConeGeometry(0.18, 0.22, 7),
                new THREE.MeshStandardMaterial({ color: col.palm, roughness: 0.7 })
            );
            crown.position.set(px, py + 0.36, pz);
            palmGroup.add(trunk); palmGroup.add(crown);
        }
        scene.add(palmGroup);

        function recolor() {
            var pos = terrainInfo.pos, geo = terrainInfo.geo, colors = geo.attributes.color, col2 = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                color(col2, pos.getY(i), pos.getX(i), pos.getZ(i));
                colors.setXYZ(i, col2.r, col2.g, col2.b);
            }
            colors.needsUpdate = true;
        }

        function panelHtml() {
            return '<h3>Huacachina: an oasis ringed by dunes</h3>' +
                '<p>A small natural lagoon surrounded by towering sand dunes in the Peruvian desert - nicknamed the "Oasis of America." The village that grew around the lagoon is a base for sandboarding and dune-buggy tours.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Location</td><td>Ica Region, Peru - about 300 km south of Lima</td></tr>' +
                '<tr><td>Landform</td><td>natural desert lagoon ringed by sand dunes</td></tr>' +
                '<tr><td>Village population</td><td>commonly cited around 200 residents</td></tr>' +
                '<tr><td>Surrounding dune height</td><td>commonly cited up to about 100 m above the oasis floor</td></tr>' +
                '<tr><td>Known for</td><td>sandboarding, dune-buggy tours</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the dune ring, ripple pattern, and vertical scale are schematic teaching cues, not survey terrain.</p>';
        }

        function apply() {
            palmGroup.visible = palmOn;
            var hb = document.getElementById('t3dHoaCrestBtn');
            if (hb) hb.textContent = 'Dune crest highlight: ' + (crestOn ? 'On' : 'Off');
            var pb = document.getElementById('t3dHoaPalmBtn');
            if (pb) pb.textContent = 'Palm oasis ring: ' + (palmOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ crestOn: crestOn, palmOn: palmOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.crestOn === 'boolean') crestOn = store.crestOn;
        if (typeof store.palmOn === 'boolean') palmOn = store.palmOn;
        recolor();
        apply();

        var crestBtn = document.getElementById('t3dHoaCrestBtn');
        if (crestBtn) crestBtn.addEventListener('click', function () { crestOn = !crestOn; recolor(); apply(); });
        var palmBtn = document.getElementById('t3dHoaPalmBtn');
        if (palmBtn) palmBtn.addEventListener('click', function () { palmOn = !palmOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the dune crest highlight or the palm oasis ring.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placeshuacachinaoasis: 't3dHoaControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placeshuacachinaoasis: { radius: 27, maxR: 60, minR: 6, phi: 0.88, theta: 0.7, targetY: 0.2 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

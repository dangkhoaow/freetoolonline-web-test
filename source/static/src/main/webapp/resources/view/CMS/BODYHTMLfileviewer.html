<div class="w3-container">
    <p>Paste or upload the input; click a node to expand or collapse it.</p>
</div>

<style>
    #fvTool .fv-row { margin-bottom: 12px; }
    #fvTool .fv-image {
        max-width: 100%; display: block; margin: 10px 0;
        border: 1px solid #cccccc; border-radius: 4px; background: #fafafa;
    }
    #fvTool .fv-pdf-page {
        max-width: 100%; display: block; margin: 10px 0;
        border: 1px solid #cccccc; border-radius: 4px; background: #ffffff;
    }
    #fvTool .fv-media { max-width: 100%; display: block; margin: 10px 0; }
    #fvTool .fv-text {
        max-height: 480px; overflow: auto; padding: 12px; margin: 10px 0;
        border: 1px solid #dddddd; border-radius: 4px; background: #f8f8f8;
        font-size: 13px; white-space: pre-wrap; word-break: break-word;
    }
    #fvTool .fv-hex { white-space: pre; word-break: normal; font-family: monospace; }
    #fvTool table.fv-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0; }
    #fvTool table.fv-table th, #fvTool table.fv-table td {
        border: 1px solid #dddddd; padding: 6px 8px; text-align: left; vertical-align: top;
    }
    #fvTool table.fv-table th { width: 30%; background: #f5f5f5; }
    #fvTool .fv-status { font-family: monospace; min-height: 1.4em; margin-top: 8px; }
</style>

<div id="fvTool" class="w3-container">
    <div class="fv-row">
        <label class="w3-label" for="fvFile"><b>File to view</b></label>
        <input type="file" id="fvFile" class="w3-input w3-border">
    </div>
    <div class="fv-row">
        <button type="button" id="fvClear" class="w3-button w3-light-grey">Clear</button>
    </div>
    <p id="fvStatus" class="fv-status" aria-live="polite">Choose a file to preview it right here. Nothing is uploaded.</p>
    <div id="fvMeta"></div>
    <div id="fvOutput" class="outputImgs"></div>
</div>

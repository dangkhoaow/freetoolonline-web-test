<script>
    // 3D scene archetype skeleton (carlsbad-caverns) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (carlsbad-caverns).
    // All geometry is procedural. places-3d cluster member, 2026-08-28.
    //
    // EDUCATIONAL APPROXIMATION, not survey cave geology.
    // Published figures (NPS / UNESCO consensus, cross-checked 2026-08-28):
    //   - Carlsbad Caverns National Park, Guadalupe Mountains, near Carlsbad,
    //     New Mexico, USA
    //   - The Big Room (Rock of Ages Chamber): floor area about 8.2 acres
    //     (roughly 33,000 sq m) - one of the largest known cave chambers in
    //     North America
    //   - About 230 m (roughly 750 ft) below the surface at its deepest point
    //   - Carved by sulfuric-acid dissolution in Permian-age limestone -
    //     unlike the more common carbonic-acid karst process seen elsewhere
    //   - UNESCO World Heritage Site since 1995
    //   - Big Room Trail: a roughly level, self-guided loop about 1.25 miles
    //     (2 km)
    //   - Giant Dome: one of the cave's largest single formations, about 19 m
    //     (62 ft) tall
    //   - Explored in the early 1900s by local cowboy Jim White; declared a
    //     national monument in 1923 and a national park in 1930
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'carlsbad-caverns';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placescarlsbadcaverns'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x07080a, 1);
        var ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        var key = new THREE.DirectionalLight(0xffcf8a, 1.0);
        key.position.set(-9, 14, 7);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 91.7 + z * 173.3) * 39217.234; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.05; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.94, metalness: 0, side: THREE.DoubleSide }));
        }

        // Signature figure: the Big Room read as an underground CHAMBER, not a
        // winding passage or open-air cutaway - a new archetype in this
        // cluster (Postojna = chain of halls, Mammoth = layer-stack maze,
        // Waitomo/Son Doong = single carved passage). An elliptical basin
        // floor rises to a rock wall at its rim; a separate domed CEILING
        // mesh closes over the far half of the ellipse while the near half is
        // pushed out of view, so the camera looks straight into an enclosed
        // void the way a visitor on the Big Room Trail actually experiences
        // it. Dozens of stalagmite/stalactite/column formations are scattered
        // across the chamber floor with a seeded deterministic placement
        // (built once, never rebuilt per frame). 1 unit is a schematic scale,
        // not a survey measurement.
        var A = 9.2, B = 12.6;               // ellipse half-width / half-length
        var FLOOR_Y = -0.2, WALL_TOP = 6.2;  // floor baseline, wall rim height
        var CEIL_WALL = WALL_TOP + 0.6, DOME_RISE = 3.0; // ceiling meets wall, domes up at centre
        var CUTAWAY_Z = -2.4;                // near-camera half is pushed out of view
        function edist(x, z) { var ex = x / A, ez = z / B; return Math.sqrt(ex * ex + ez * ez); }
        function floorHeight(x, z) {
            var e = edist(x, z);
            var h = FLOOR_Y + 0.32 * fbm(x * 0.42 + 2, z * 0.4 + 5, 4);
            // Two shallow side-alcove dips - schematic stand-ins for the
            // smaller side passages that branch off the Big Room loop.
            var dip1 = Math.exp(-(((x + 4.3) * (x + 4.3)) + ((z - 3.2) * (z - 3.2))) / 16) * -1.1;
            var dip2 = Math.exp(-(((x - 3.6) * (x - 3.6)) + ((z + 6.4) * (z + 6.4))) / 13) * -0.85;
            h += dip1 + dip2;
            if (e > 0.76) {
                var t = smooth(0.76, 1.04, e);
                h = h * (1 - t) + (WALL_TOP + 1.1 * fbm(x * 0.55 + 9, z * 0.55 + 3, 3)) * t;
            }
            if (e > 1.04) { h = WALL_TOP + 2.0 + 3.2 * (e - 1.04); }
            return h;
        }
        function ceilHeight(x, z) {
            var e = edist(x, z);
            var dome = CEIL_WALL + DOME_RISE * (1 - Math.min(1, e * e)) - 0.55 * fbm(x * 0.5 + 7, z * 0.5 + 2, 4);
            if (e > 1.02) { dome += 9.0; }
            if (z < CUTAWAY_Z) { dome += (CUTAWAY_Z - z) * 2.6; }
            return dome;
        }

        var headlampOn = false;
        function floorColor(c, h, x, z, headlamp) {
            var localTop = WALL_TOP + 2.0;
            var u = smooth(FLOOR_Y - 1.6, localTop, h);
            if (!headlamp) {
                var shadow = new THREE.Color(0x1c140f), rock = new THREE.Color(0x8a6a45), lit = new THREE.Color(0xe3c68a);
                if (u < 0.55) { c.copy(shadow).lerp(rock, smooth(0, 0.55, u)); }
                else { c.copy(rock).lerp(lit, smooth(0.55, 1.0, u)); }
                var n1 = 0.9 + 0.18 * fbm(x * 1.2 + 3, z * 1.2 + 6, 3);
                c.multiplyScalar(n1);
            } else {
                var dark = new THREE.Color(0x05070a), midc = new THREE.Color(0x3a4650), beam = new THREE.Color(0x9fb6c2);
                if (u < 0.55) { c.copy(dark).lerp(midc, smooth(0, 0.55, u)); }
                else { c.copy(midc).lerp(beam, smooth(0.55, 1.0, u)); }
                var n2 = 0.85 + 0.12 * fbm(x * 1.2 + 3, z * 1.2 + 6, 3);
                c.multiplyScalar(n2);
            }
        }
        function ceilColor(c, h, x, z, headlamp) {
            var e = edist(x, z);
            var near = 1 - Math.min(1, e);
            if (!headlamp) {
                var deep = new THREE.Color(0x150f0a), rim = new THREE.Color(0x6b4f30);
                c.copy(deep).lerp(rim, 0.35 + 0.4 * near);
                c.multiplyScalar(0.85 + 0.15 * fbm(x * 0.8 + 4, z * 0.8 + 1, 3));
            } else {
                var d2 = new THREE.Color(0x030405), r2 = new THREE.Color(0x232b31);
                c.copy(d2).lerp(r2, 0.3 + 0.35 * near);
            }
        }

        var terrain, ceiling;
        var floorColorsAmber = null, floorColorsLamp = null, ceilColorsAmber = null, ceilColorsLamp = null;
        function buildColors(mesh, colorFn, headlamp) {
            var pos = mesh.geometry.attributes.position, col = new THREE.Color();
            var arr = new Float32Array(pos.count * 3);
            for (var i = 0; i < pos.count; i++) {
                colorFn(col, pos.getY(i), pos.getX(i), pos.getZ(i), headlamp);
                arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b;
            }
            return arr;
        }

        var SEGW = shell.low ? 100 : 160, SEGD = shell.low ? 130 : 200;
        terrain = makeTerrain(2 * A + 5, 2 * B + 5, SEGW, SEGD, floorHeight, function (c, h, x, z) { floorColor(c, h, x, z, false); });
        scene.add(terrain);
        ceiling = makeTerrain(2 * A + 5, 2 * B + 5, SEGW, SEGD, ceilHeight, function (c, h, x, z) { ceilColor(c, h, x, z, false); });
        scene.add(ceiling);
        floorColorsAmber = terrain.geometry.attributes.color.array.slice();
        ceilColorsAmber = ceiling.geometry.attributes.color.array.slice();
        floorColorsLamp = buildColors(terrain, floorColor, true);
        ceilColorsLamp = buildColors(ceiling, ceilColor, true);

        // Dripstone forest: stalagmites (floor, point up), stalactites
        // (ceiling, point down), and columns (both meeting) scattered with a
        // deterministic seeded placement across the chamber floor.
        var dripMat = new THREE.MeshStandardMaterial({ color: 0xcdbd98, roughness: 0.86 });
        var dripGroup = new THREE.Group();
        var FORMATION_COUNT = 68;
        for (var fi = 0; fi < FORMATION_COUNT; fi++) {
            var rx = (hash2(fi * 2.31, 4.7) * 2 - 1) * A * 0.92;
            var rz = (hash2(fi * 1.77, 9.3) * 2 - 1) * B * 0.92;
            if (edist(rx, rz) > 0.72) { continue; }
            var fy = floorHeight(rx, rz), cy = ceilHeight(rx, rz);
            var gap = cy - fy;
            var roleR = hash2(fi * 3.13, 1.9);
            var scale = 0.55 + 0.9 * hash2(fi * 4.01, 6.2);
            if (gap < 2.6 && roleR > 0.45) {
                var colH = Math.max(0.6, gap - 0.15);
                var col1 = new THREE.Mesh(new THREE.CylinderGeometry(0.09 * scale, 0.13 * scale, colH, 7), dripMat);
                col1.position.set(rx, fy + colH / 2, rz);
                dripGroup.add(col1);
            } else if (roleR > 0.4) {
                var stalag = new THREE.Mesh(new THREE.ConeGeometry(0.14 * scale, 0.6 * scale, 7), dripMat);
                stalag.position.set(rx, fy + 0.3 * scale, rz);
                dripGroup.add(stalag);
            } else {
                var stalac = new THREE.Mesh(new THREE.ConeGeometry(0.12 * scale, 0.55 * scale, 7), dripMat);
                stalac.rotation.x = Math.PI;
                stalac.position.set(rx, cy - 0.28 * scale, rz);
                dripGroup.add(stalac);
            }
        }
        scene.add(dripGroup);

        // Giant Dome marker: a distinct, taller column standing in for the
        // real Giant Dome formation (about 19 m / 62 ft tall, one of the
        // cave's largest), plus a ring the "formation labels" toggle can
        // highlight without touching any geometry.
        var GD_X = 1.6, GD_Z = 5.8;
        var gdFloorY = floorHeight(GD_X, GD_Z), gdCeilY = ceilHeight(GD_X, GD_Z);
        var giantDomeMat = new THREE.MeshStandardMaterial({ color: 0xf1e2b8, roughness: 0.55, emissive: 0x2a2010, emissiveIntensity: 0.12 });
        var giantDome = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.5, Math.max(1.4, gdCeilY - gdFloorY - 0.1), 9), giantDomeMat);
        giantDome.position.set(GD_X, gdFloorY + (gdCeilY - gdFloorY - 0.1) / 2, GD_Z);
        scene.add(giantDome);
        var markerRing = new THREE.Mesh(
            new THREE.TorusGeometry(0.85, 0.06, 8, 40),
            new THREE.MeshBasicMaterial({ color: 0xffdca0 })
        );
        markerRing.rotation.x = Math.PI / 2;
        markerRing.position.set(GD_X, gdFloorY + 0.05, GD_Z);
        scene.add(markerRing);

        var formationsOn = true;

        function panelHtml() {
            return '<h3>Carlsbad Caverns: the Big Room chamber</h3>' +
                '<p>An underground chamber in cross-section: a domed limestone void forested with stalagmite, stalactite, and column formations, with a marker ring on the tall Giant Dome column.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Location</td><td>Guadalupe Mountains, near Carlsbad, New Mexico, USA</td></tr>' +
                '<tr><td>Big Room floor area</td><td>about 8.2 acres (roughly 33,000 sq m) - one of the largest known cave chambers in North America</td></tr>' +
                '<tr><td>Depth below surface</td><td>about 230 m (roughly 750 ft) at its deepest point</td></tr>' +
                '<tr><td>How it formed</td><td>sulfuric-acid dissolution in Permian-age limestone - unlike the more common carbonic-acid karst process</td></tr>' +
                '<tr><td>World Heritage status</td><td>UNESCO World Heritage Site since 1995</td></tr>' +
                '<tr><td>Big Room Trail</td><td>a roughly level, self-guided loop about 1.25 miles (2 km)</td></tr>' +
                '<tr><td>Giant Dome</td><td>about 19 m (62 ft) tall - one of the cave\'s largest single formations</td></tr>' +
                '<tr><td>History</td><td>explored in the early 1900s by local cowboy Jim White; national monument 1923, national park 1930</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the chamber shape, dripstone placement, and Giant Dome marker are procedural teaching cues, not survey cave geology.</p>';
        }

        function apply() {
            terrain.geometry.attributes.color.array.set(headlampOn ? floorColorsLamp : floorColorsAmber);
            terrain.geometry.attributes.color.needsUpdate = true;
            ceiling.geometry.attributes.color.array.set(headlampOn ? ceilColorsLamp : ceilColorsAmber);
            ceiling.geometry.attributes.color.needsUpdate = true;
            if (headlampOn) { key.color.set(0x9fc4e0); key.intensity = 0.55; ambient.intensity = 0.22; }
            else { key.color.set(0xffcf8a); key.intensity = 1.0; ambient.intensity = 0.5; }
            markerRing.visible = formationsOn;
            var lb = document.getElementById('t3dPccLightBtn');
            if (lb) lb.textContent = 'Cave lighting: ' + (headlampOn ? 'Headlamp' : 'Amber show lights');
            var fb = document.getElementById('t3dPccFormationBtn');
            if (fb) fb.textContent = 'Giant Dome marker: ' + (formationsOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ headlampOn: headlampOn, formationsOn: formationsOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.headlampOn === 'boolean') headlampOn = store.headlampOn;
        if (typeof store.formationsOn === 'boolean') formationsOn = store.formationsOn;
        apply();

        var lightBtn = document.getElementById('t3dPccLightBtn');
        if (lightBtn) lightBtn.addEventListener('click', function () { headlampOn = !headlampOn; apply(); });
        var formationBtn = document.getElementById('t3dPccFormationBtn');
        if (formationBtn) formationBtn.addEventListener('click', function () { formationsOn = !formationsOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the cave lighting or the Giant Dome marker.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placescarlsbadcaverns: 't3dPccControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placescarlsbadcaverns: { radius: 30, maxR: 65, minR: 8, phi: 0.7, theta: 3.6, targetY: 3.5 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

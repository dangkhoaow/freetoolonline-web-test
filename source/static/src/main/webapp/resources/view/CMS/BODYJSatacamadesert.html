<script id="t3d-place-atacama-desert">
'use strict';
const STATE = {
  scene: null, camera: null, renderer: null, terrain: null,
  camTheta: 1.2, camPhi: 0.85, camRadius: 32, saltVisible: true, tempVisible: true,
};

function fbm(x, y, octaves = 4, persistence = 0.5, scale = 1.0) {
  let value = 0, amplitude = 1, frequency = 1, maxValue = 0;
  for (let i = 0; i < octaves; i++) {
    value += amplitude * Math.sin((x * frequency) * 0.1) * Math.cos((y * frequency) * 0.1);
    maxValue += amplitude; amplitude *= persistence; frequency *= 2;
  }
  return (value / maxValue) * scale;
}

function makeTerrain() {
  const geom = new THREE.PlaneGeometry(140, 140, 160, 160);
  geom.rotateX(-Math.PI / 2);
  const positions = geom.attributes.position.array;
  const colors = new Float32Array(positions.length);

  for (let i = 0; i < positions.length; i += 3) {
    const x = positions[i], z = positions[i + 2];
    let h = fbm(x, z, 5, 0.55, 8);
    const riverDist = Math.abs(z * 0.3 - 5);
    if (riverDist < 8) h -= 2 * Math.exp(-riverDist * riverDist / 20);
    const isSalt = h < -1.5 && Math.random() < 0.15;
    positions[i + 1] = Math.max(-0.5, h * 0.35);
    const temp = (h + 8) / 16;
    const r = isSalt ? 1.0 : (0.7 + temp * 0.2);
    const g = isSalt ? 0.9 : (0.4 - temp * 0.1);
    const b = isSalt ? 0.8 : (0.2 - temp * 0.15);
    colors[i] = r; colors[i + 1] = g; colors[i + 2] = b;
  }

  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const material = new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.6, roughness: 0.8 });
  const mesh = new THREE.Mesh(geom, material);
  STATE.scene.add(mesh);
  return mesh;
}

function initScene() {
  STATE.scene = new THREE.Scene();
  STATE.scene.background = new THREE.Color(0x191919);
  STATE.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  STATE.renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById('t3dCanvasHost') });
  STATE.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  STATE.renderer.setSize(window.innerWidth, window.innerHeight);
  const light = new THREE.DirectionalLight(0xffd89b, 1.2);
  light.position.set(40, 60, 30);
  STATE.scene.add(light);
  STATE.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  STATE.terrain = makeTerrain();
  renderFrame();
}

function updateCamera() {
  const x = STATE.camRadius * Math.sin(STATE.camTheta) * Math.cos(STATE.camPhi);
  const y = STATE.camRadius * Math.sin(STATE.camPhi);
  const z = STATE.camRadius * Math.cos(STATE.camTheta) * Math.cos(STATE.camPhi);
  STATE.camera.position.set(x, y + 8, z);
  STATE.camera.lookAt(0, 0, 0);
}

function renderFrame() {
  updateCamera();
  STATE.renderer.render(STATE.scene, STATE.camera);
  requestAnimationFrame(renderFrame);
}

document.addEventListener('DOMContentLoaded', () => {
  initScene();
  new ResizeObserver(() => {
    const w = document.getElementById('t3dCanvasHost').parentElement.clientWidth;
    const h = window.innerHeight;
    STATE.renderer.setSize(w, h);
    STATE.camera.aspect = w / h;
    STATE.camera.updateProjectionMatrix();
  }).observe(document.getElementById('t3dCanvasHost'));
});
</script>

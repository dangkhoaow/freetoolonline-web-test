<script>
    // 3D scene archetype skeleton (vatnajokull) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (vatnajokull).
    // All geometry is procedural. places-3d-discovery-loop-runbook, 2026-08-27.
    //
    // EDUCATIONAL APPROXIMATION, not survey glaciology. The ice-dome relief,
    // subglacial terrain, and lagoon geometry are exaggerated schematic cues.
    // Published figures (encyclopedic / UNESCO consensus, cross-checked 2026-08-27):
    //   - Area about 7,700 sq km - roughly 8% of Iceland's land area, the
    //     largest ice cap in Europe by volume
    //   - Ice thickness up to about 950 m at its deepest
    //   - Two active subglacial volcanoes: Grimsvotn (Iceland's most
    //     frequently erupting volcano, triggers periodic glacial floods) and
    //     Bardarbunga (fed the 2014-2015 Holuhraun fissure eruption)
    //   - About 30 named outlet glaciers radiate from the main ice dome
    //   - The Jokulsarlon iceberg lagoon has grown since the 1930s-40s as the
    //     Breidamerkurjokull outlet glacier retreated; one of Iceland's
    //     deepest lakes, still growing
    //   - Hvannadalshnukur, on the Oraefajokull outlet at the ice cap's
    //     southern rim, is about 2,110 m - Iceland's highest point
    //   - Vatnajokull National Park: UNESCO World Heritage Site since 2019
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'vatnajokull';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesvatnajokull'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x0a1220, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xeaf2ff, 1.0);
        key.position.set(-10, 16, 8);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smooth(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0 }));
        }

        // A broad, low-relief ice-dome shield centered at the origin (unlike a
        // steep volcanic cone), with a calving front notched into the south
        // edge (z>0) feeding the Jokulsarlon lagoon. Grimsvotn and Bardarbunga
        // sit HIDDEN beneath the ice - no terrain bump, only toggleable
        // marker glows. 1 unit ~= 700 m; x = east-west, z = north-south.
        var DOME_R = 6.2, DOME_PEAK = 1.15, LOWLAND = -0.05;
        var LAGOON_X = 0.3, LAGOON_Z = 7.6, LAGOON_R = 2.0, LAGOON_FLOOR = -0.55;
        function domeShape(r) {
            var t = Math.max(0, 1 - (r / DOME_R) * (r / DOME_R));
            return DOME_PEAK * Math.pow(t, 1.35); // broad shield, not a sharp peak
        }
        function height(x, z) {
            var r = Math.sqrt(x * x + z * z);
            var crevasse = 0.05 * (fbm(x * 0.9 + 3, z * 0.9 + 5, 4) - 0.5);
            // Six outlet-glacier tongues: subtle radial streaks that dip the
            // surface slightly lower along six directions, visible as gentle
            // grooves flowing down and away from the dome.
            var ang = Math.atan2(z, x);
            var tongue = 0.10 * Math.pow(Math.max(0, Math.cos(ang * 3)), 6) * smooth(1.5, DOME_R + 1, r) * (1 - smooth(DOME_R, DOME_R + 3, r));
            var base = (r < DOME_R + 1) ? domeShape(Math.min(r, DOME_R)) : LOWLAND;
            var h = base - tongue + crevasse * smooth(0, DOME_R, r);
            var dLag = Math.sqrt((x - LAGOON_X) * (x - LAGOON_X) + (z - LAGOON_Z) * (z - LAGOON_Z));
            var lagAmt = 1 - smooth(0, LAGOON_R, dLag);
            h = h * (1 - lagAmt) + LAGOON_FLOOR * lagAmt;
            return h;
        }
        var col = { ice: new THREE.Color(0xdde7ee), iceShadow: new THREE.Color(0xaebfcb), moraine: new THREE.Color(0x7d7767), water: new THREE.Color(0x274a6b) };
        function color(c, h, x, z) {
            var n = 0.92 + 0.16 * fbm(x * 1.4 + 11, z * 1.4 + 7, 3);
            var r = Math.sqrt(x * x + z * z);
            var dLag = Math.sqrt((x - LAGOON_X) * (x - LAGOON_X) + (z - LAGOON_Z) * (z - LAGOON_Z));
            if (dLag < LAGOON_R * 0.92) { c.copy(col.water).multiplyScalar(n); return; }
            if (r > DOME_R + 0.3) { c.copy(col.moraine).multiplyScalar(n); return; }
            var shade = smooth(DOME_R * 0.55, DOME_R, r);
            c.copy(col.ice).lerp(col.iceShadow, shade).multiplyScalar(n);
        }
        var terrain = makeTerrain(20, 20, shell.low ? 110 : 170, shell.low ? 110 : 170, height, color);
        scene.add(terrain);

        // Icebergs: small tumbled chunks floating in the Jokulsarlon lagoon.
        var icebergGroup = new THREE.Group();
        var icebergMat = new THREE.MeshStandardMaterial({ color: 0xeaf6ff, roughness: 0.3, metalness: 0.05 });
        for (var i = 0; i < 9; i++) {
            var ia = (i / 9) * Math.PI * 2 + hash2(i, 1) * 0.6;
            var ir = LAGOON_R * (0.25 + 0.55 * hash2(i, 2));
            var size = 0.16 + 0.22 * hash2(i, 3);
            var geo = new THREE.IcosahedronGeometry(size, 0);
            var berg = new THREE.Mesh(geo, icebergMat);
            berg.position.set(LAGOON_X + ir * Math.cos(ia), LAGOON_FLOOR + size * 0.5, LAGOON_Z + ir * Math.sin(ia));
            berg.rotation.set(hash2(i, 4) * 6, hash2(i, 5) * 6, hash2(i, 6) * 6);
            icebergGroup.add(berg);
        }
        scene.add(icebergGroup);

        // Subglacial volcano markers: Grimsvotn (nearer the dome center-south)
        // and Bardarbunga (nearer the dome center-north), sitting just above
        // the surface with a pulsing heat-glow when toggled ON.
        var VOLCS = [
            { name: 'Grimsvotn', x: 0.6, z: 1.4 },
            { name: 'Bardarbunga', x: -1.3, z: -1.6 },
        ];
        var volcGroup = new THREE.Group();
        var volcMeshes = [];
        for (var v = 0; v < VOLCS.length; v++) {
            var vh = height(VOLCS[v].x, VOLCS[v].z);
            var glow = new THREE.Mesh(
                new THREE.CircleGeometry(0.42, 20),
                new THREE.MeshBasicMaterial({ color: 0xff7a3d, transparent: true, opacity: 0.75 })
            );
            glow.rotation.x = -Math.PI / 2;
            glow.position.set(VOLCS[v].x, vh + 0.05, VOLCS[v].z);
            var ring = new THREE.Mesh(
                new THREE.RingGeometry(0.44, 0.58, 20),
                new THREE.MeshBasicMaterial({ color: 0xffb073, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.copy(glow.position);
            volcGroup.add(glow); volcGroup.add(ring);
            volcMeshes.push({ glow: glow, ring: ring });
        }
        scene.add(volcGroup);

        var lagoonOn = true, volcOn = false;

        function panelHtml() {
            return '<h3>Vatnajokull: the great ice cap</h3>' +
                '<p>A broad ice dome about 7,700 sq km wide over south-east Iceland, hiding two active volcanoes and feeding the Jokulsarlon iceberg lagoon at its southern edge - toggle the lagoon and the volcano markers.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Area</td><td>about 7,700 sq km - roughly 8% of Iceland, the largest ice cap in Europe by volume</td></tr>' +
                '<tr><td>Ice thickness</td><td>up to about 950 m at its deepest</td></tr>' +
                '<tr><td>Subglacial volcanoes</td><td>Grimsvotn and Bardarbunga, hidden beneath the ice</td></tr>' +
                '<tr><td>Outlet glaciers</td><td>about 30 named outlet glaciers radiate from the dome</td></tr>' +
                '<tr><td>Jokulsarlon lagoon</td><td>formed since the 1930s-40s as the terminus retreated; still growing</td></tr>' +
                '<tr><td>Highest edge peak</td><td>Hvannadalshnukur, about 2,110 m - Iceland\'s highest point</td></tr>' +
                '<tr><td>Heritage status</td><td>Vatnajokull National Park - UNESCO World Heritage Site since 2019</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the ice-dome shape, subglacial terrain, and lagoon geometry are schematic teaching cues, not survey data.</p>';
        }

        function apply() {
            icebergGroup.visible = lagoonOn;
            var lb = document.getElementById('t3dVtjLagoonBtn');
            if (lb) lb.textContent = 'Iceberg lagoon: ' + (lagoonOn ? 'On' : 'Off');
            for (var i = 0; i < volcMeshes.length; i++) {
                volcMeshes[i].glow.visible = volcOn;
                volcMeshes[i].ring.visible = volcOn;
            }
            var vb = document.getElementById('t3dVtjVolcanoBtn');
            if (vb) vb.textContent = 'Subglacial volcanoes: ' + (volcOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ lagoonOn: lagoonOn, volcOn: volcOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.lagoonOn === 'boolean') lagoonOn = store.lagoonOn;
        if (typeof store.volcOn === 'boolean') volcOn = store.volcOn;
        apply();

        var lagoonBtn = document.getElementById('t3dVtjLagoonBtn');
        if (lagoonBtn) lagoonBtn.addEventListener('click', function () { lagoonOn = !lagoonOn; apply(); });
        var volcanoBtn = document.getElementById('t3dVtjVolcanoBtn');
        if (volcanoBtn) volcanoBtn.addEventListener('click', function () { volcOn = !volcOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the iceberg lagoon or the subglacial volcano markers.');
        var t = 0;
        return function animate(dt) {
            t += dt * 0.001;
            scene.rotation.y += dt * 0.00004;
            if (volcGroup.visible !== false) {
                var pulse = 0.55 + 0.2 * Math.sin(t * 2.2);
                for (var i = 0; i < volcMeshes.length; i++) {
                    volcMeshes[i].glow.material.opacity = volcOn ? pulse : 0;
                    volcMeshes[i].ring.material.opacity = volcOn ? pulse * 0.75 : 0;
                }
            }
            if (icebergGroup.visible) {
                for (var j = 0; j < icebergGroup.children.length; j++) {
                    icebergGroup.children[j].position.y += Math.sin(t + j) * 0.00025;
                }
            }
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesvatnajokull: 't3dVtjControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesvatnajokull: { radius: 22, maxR: 60, minR: 6, phi: 0.72, theta: 0.5, targetY: 0.3 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

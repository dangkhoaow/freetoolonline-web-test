<script>
    // 3D scene archetype skeleton (galactic-year-sun-orbit) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton (see BODYJSsolarsystem.html / the more
    // recent single-scene BODYJSnewhorizonsplutoflyby.html) - this file
    // implements ONE scene only (galacticyear), not the full accumulated scene set.
    // All geometry is procedural - no model files, no textures fetched.
    //
    // This is an EDUCATIONAL APPROXIMATION, not a physics engine and not a
    // precomputed dynamical simulation of the Milky Way. The spiral-arm disk is
    // a parametric teaching shape, not a mapped structure; the Sun's circular
    // orbit path and vertical bobbing motion are simplified from real published
    // figures (below) - the info panel discloses this. On-screen sizes,
    // distances, and the vertical-bob amplitude are compressed/exaggerated for
    // visibility.
    //
    // Published figures cited (NRAO "How Long Does it Take the Sun to Orbit the
    // Center of our Galaxy?"; ESA Gaia mission results; Wikipedia "Galactic year"
    // cross-referenced against multiple sources; Bahcall & Bahcall 1985, Nature,
    // for the vertical-oscillation range; cross-checked 2026-07-26):
    //   - Distance from the Sun to the galactic center: ~26,000-28,000 light-years
    //     (~8 kiloparsecs)
    //   - Orbital speed: commonly cited ~220-230 km/s; Gaia-era measurements run
    //     up to ~234-240 km/s
    //   - Galactic year (one full orbit): commonly cited ~225-250 million years
    //     (this scene uses 230 million years, the most frequently cited figure)
    //   - Orbits completed since the Sun/Solar System formed ~4.6 billion years
    //     ago: about 20
    //   - Vertical oscillation through the galactic disk plane: published
    //     full-cycle estimates disagree widely across studies, roughly 30 to 74
    //     million years (this scene's animation uses 60 million years, a value
    //     inside that published range, purely to keep the bobbing motion visible
    //     - it is not presented as a settled figure)
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'galactic-year-sun-orbit';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) {
        return 'galacticyear';
    }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        function size() {
            var w = Math.max(260, host.clientWidth);
            var h = Math.round(w * 0.62);
            var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (fsEl && fsEl.contains(host)) { h = Math.max(240, (window.innerHeight || h) - 150); }
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        host.appendChild(renderer.domElement);
        renderer.domElement.style.touchAction = 'none';
        renderer.domElement.style.borderRadius = '6px';
        var drag = null, pinch = null, moved = 0;
        host.addEventListener('pointerdown', function (e) {
            drag = { x: e.clientX, y: e.clientY }; moved = 0;
            host.setPointerCapture && host.setPointerCapture(e.pointerId);
        });
        host.addEventListener('pointermove', function (e) {
            if (!drag) return;
            var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            moved += Math.abs(dx) + Math.abs(dy);
            drag = { x: e.clientX, y: e.clientY };
            orbit.goalTheta -= dx * 0.006;
            orbit.goalPhi = Math.min(Math.max(orbit.goalPhi - dy * 0.005, 0.05), Math.PI - 0.2);
        });
        host.addEventListener('pointerup', function (e) {
            var wasClick = moved < 8;
            drag = null;
            if (wasClick && shell.onClick) { shell.onClick(e); }
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.min(Math.max(orbit.goalRadius * (e.deltaY > 0 ? 1.12 : 0.9), orbit.minR), orbit.maxR);
        }, { passive: false });
        host.addEventListener('touchstart', function (e) {
            if (e.touches.length === 2) {
                pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        }, { passive: true });
        host.addEventListener('touchmove', function (e) {
            if (e.touches.length === 2 && pinch) {
                var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                orbit.goalRadius = Math.min(Math.max(orbit.goalRadius * (pinch / d), orbit.minR), orbit.maxR);
                pinch = d;
            }
        }, { passive: true });
        window.addEventListener('resize', size);
        document.addEventListener('fullscreenchange', size);
        document.addEventListener('webkitfullscreenchange', size);
        size();
        var shell = {
            THREE: THREE, renderer: renderer, scene: scene, camera: camera,
            orbit: orbit, low: low, applyCamera: applyCamera, size: size, onClick: null,
            ndc: function (e) {
                var r = renderer.domElement.getBoundingClientRect();
                return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
            },
        };
        return shell;
    }

    var T3D_GY_ORBIT_R = 22;
    var T3D_GY_DISK_OUTER = 34;
    var T3D_GY_BULGE_R = 3.2;
    var T3D_GY_AMPLITUDE = 2.6;
    var T3D_GY_PERIOD_MYR = 230;
    var T3D_GY_OSC_PERIOD_MYR = 60;
    var T3D_GY_MAX_ELAPSED_MYR = 4600;
    var T3D_GY_DIST_LY = '26,000-28,000';
    var T3D_GY_DIST_KPC = 8;
    var T3D_GY_SPEED_KMS = '220-230';
    var T3D_GY_SPEED_GAIA_KMS = '234-240';
    var T3D_GY_PERIOD_RANGE_MYR = '225-250';
    var T3D_GY_ORBITS_SINCE_FORMATION = 20;
    var T3D_GY_OSC_RANGE_MYR = '30-74';

    function t3dGalacticYear(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x03020a, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.35));
        var core = new THREE.PointLight(0xfff3c4, 1.4, 120);
        core.position.set(0, 2, 0);
        scene.add(core);

        var SCOUNT = shell.low ? 350 : 700;
        var spos = new Float32Array(SCOUNT * 3);
        for (var s = 0; s < SCOUNT; s++) {
            var v = new THREE.Vector3().randomDirection().multiplyScalar(60 + Math.random() * 120);
            spos[s * 3] = v.x; spos[s * 3 + 1] = v.y; spos[s * 3 + 2] = v.z;
        }
        var sgeo = new THREE.BufferGeometry();
        sgeo.setAttribute('position', new THREE.BufferAttribute(spos, 3));
        scene.add(new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xcfd8dc, size: 0.5, sizeAttenuation: false })));

        // Procedural two-arm logarithmic-spiral disk - a teaching shape, not a
        // mapped structure of the real Milky Way.
        var ARMS = 2;
        var PTS_PER_ARM = shell.low ? 500 : 1100;
        var diskCount = ARMS * PTS_PER_ARM;
        var dpos = new Float32Array(diskCount * 3);
        var dcol = new Float32Array(diskCount * 3);
        var warmColor = new THREE.Color(0xffd9a0);
        var coolColor = new THREE.Color(0x9fb8ff);
        var idx = 0;
        for (var a = 0; a < ARMS; a++) {
            var armOffset = a * Math.PI;
            for (var p = 0; p < PTS_PER_ARM; p++) {
                var t = p / PTS_PER_ARM;
                var radius = 1.4 + t * T3D_GY_DISK_OUTER;
                var angle = armOffset + t * Math.PI * 2.6 + (Math.random() - 0.5) * 0.5;
                var jitterR = radius * (1 + (Math.random() - 0.5) * 0.18);
                var x = jitterR * Math.cos(angle);
                var z = jitterR * Math.sin(angle);
                var y = (Math.random() - 0.5) * (0.5 + t * 0.9);
                dpos[idx * 3] = x; dpos[idx * 3 + 1] = y; dpos[idx * 3 + 2] = z;
                var mix = Math.min(1, t * 1.2);
                var c = warmColor.clone().lerp(coolColor, mix);
                dcol[idx * 3] = c.r; dcol[idx * 3 + 1] = c.g; dcol[idx * 3 + 2] = c.b;
                idx++;
            }
        }
        var dgeo = new THREE.BufferGeometry();
        dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
        dgeo.setAttribute('color', new THREE.BufferAttribute(dcol, 3));
        scene.add(new THREE.Points(dgeo, new THREE.PointsMaterial({ size: shell.low ? 0.55 : 0.42, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.9 })));

        var bulge = new THREE.Mesh(
            new THREE.SphereGeometry(T3D_GY_BULGE_R, 24, 16),
            new THREE.MeshBasicMaterial({ color: 0xfff3c4 })
        );
        scene.add(bulge);
        var bulgeGlow = new THREE.Mesh(
            new THREE.SphereGeometry(T3D_GY_BULGE_R * 1.8, 20, 14),
            new THREE.MeshBasicMaterial({ color: 0xffe0a3, transparent: true, opacity: 0.18 })
        );
        scene.add(bulgeGlow);

        // Galactic-plane reference ring at y=0, and the Sun's circular orbit path.
        var planeRingPts = [];
        var ringN = shell.low ? 64 : 96;
        for (var r = 0; r <= ringN; r++) {
            var ra = (r / ringN) * Math.PI * 2;
            planeRingPts.push(new THREE.Vector3(T3D_GY_DISK_OUTER * 0.98 * Math.cos(ra), 0, T3D_GY_DISK_OUTER * 0.98 * Math.sin(ra)));
        }
        var planeRing = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(planeRingPts),
            new THREE.LineBasicMaterial({ color: 0x37474f, transparent: true, opacity: 0.35 })
        );
        scene.add(planeRing);

        var orbitPts = [];
        for (var o = 0; o <= ringN; o++) {
            var oa = (o / ringN) * Math.PI * 2;
            orbitPts.push(new THREE.Vector3(T3D_GY_ORBIT_R * Math.cos(oa), 0, T3D_GY_ORBIT_R * Math.sin(oa)));
        }
        var orbitRing = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(orbitPts),
            new THREE.LineBasicMaterial({ color: 0xffd54f, transparent: true, opacity: 0.75 })
        );
        scene.add(orbitRing);

        var sun = new THREE.Mesh(
            new THREE.SphereGeometry(0.7, 18, 12),
            new THREE.MeshBasicMaterial({ color: 0xffee58 })
        );
        scene.add(sun);
        var sunGlow = new THREE.Mesh(
            new THREE.SphereGeometry(1.3, 14, 10),
            new THREE.MeshBasicMaterial({ color: 0xfff59d, transparent: true, opacity: 0.35 })
        );
        scene.add(sunGlow);

        var elapsedMyr = 40;
        var playing = true;
        var view = 'oblique';

        function panelHtml() {
            var orbits = Math.floor(elapsedMyr / T3D_GY_PERIOD_MYR);
            var phaseInOrbit = (elapsedMyr % T3D_GY_PERIOD_MYR) / T3D_GY_PERIOD_MYR;
            return '<h3>The Sun\'s galactic year</h3>' +
                '<p>' + Math.round(elapsedMyr).toLocaleString() + ' million years elapsed (' + (elapsedMyr / 1000).toFixed(2) + ' billion years) - ' +
                orbits.toLocaleString() + ' full galactic orbit' + (orbits === 1 ? '' : 's') + ' completed, now ' + Math.round(phaseInOrbit * 100) + '% through the current lap.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Distance to galactic center</td><td>~' + T3D_GY_DIST_LY + ' light-years (~' + T3D_GY_DIST_KPC + ' kpc)</td></tr>' +
                '<tr><td>Orbital speed</td><td>~' + T3D_GY_SPEED_KMS + ' km/s commonly cited; Gaia-era measurements ~' + T3D_GY_SPEED_GAIA_KMS + ' km/s</td></tr>' +
                '<tr><td>One galactic year (orbital period)</td><td>~' + T3D_GY_PERIOD_RANGE_MYR + ' million years (this scene uses ' + T3D_GY_PERIOD_MYR + ')</td></tr>' +
                '<tr><td>Orbits since the Sun formed (~4.6 Gyr ago)</td><td>about ' + T3D_GY_ORBITS_SINCE_FORMATION + '</td></tr>' +
                '<tr><td>Vertical oscillation through the disk plane</td><td>published full-cycle estimates span ~' + T3D_GY_OSC_RANGE_MYR + ' million years (this animation uses ' + T3D_GY_OSC_PERIOD_MYR + ')</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational approximation, not a dynamical simulation of the Milky Way. The spiral disk is a teaching shape, not a mapped structure; the vertical bobbing motion is compressed and exaggerated so it stays visible on screen.</p>';
        }

        function applyElapsed(myr) {
            elapsedMyr = Math.max(0, Math.min(T3D_GY_MAX_ELAPSED_MYR, myr));
            var angle = (elapsedMyr / T3D_GY_PERIOD_MYR) * Math.PI * 2;
            var y = T3D_GY_AMPLITUDE * Math.sin((elapsedMyr / T3D_GY_OSC_PERIOD_MYR) * Math.PI * 2);
            sun.position.set(T3D_GY_ORBIT_R * Math.cos(angle), y, T3D_GY_ORBIT_R * Math.sin(angle));
            sunGlow.position.copy(sun.position);
            var slider = document.getElementById('t3dGyElapsed');
            var label = document.getElementById('t3dGyElapsedLabel');
            if (slider && Math.round(parseFloat(slider.value || '0')) !== Math.round(elapsedMyr)) {
                slider.value = String(Math.round(elapsedMyr));
            }
            if (label) label.textContent = Math.round(elapsedMyr).toLocaleString() + ' Myr';
            t3dInfo(panelHtml());
        }

        function setView(next) {
            view = next;
            var topBtn = document.getElementById('t3dGyViewBtn-top');
            var edgeBtn = document.getElementById('t3dGyViewBtn-edge');
            if (topBtn) topBtn.className = 'w3-button ' + (view === 'top' ? 'w3-amber' : 'w3-light-grey');
            if (edgeBtn) edgeBtn.className = 'w3-button ' + (view === 'edge' ? 'w3-amber' : 'w3-light-grey');
            if (view === 'top') { shell.orbit.goalPhi = 0.22; }
            else if (view === 'edge') { shell.orbit.goalPhi = 1.52; }
            else { shell.orbit.goalPhi = 0.85; }
            try { t3dSaveStore({ elapsedMyr: elapsedMyr, view: view }); } catch (e) {}
        }

        var ray = new THREE.Raycaster();
        shell.onClick = function (e) {
            ray.setFromCamera(shell.ndc(e), shell.camera);
            var hits = ray.intersectObjects([sun, bulge], false);
            if (!hits.length) return;
            t3dInfo(panelHtml());
        };

        var store = t3dLoadStore();
        if (typeof store.elapsedMyr === 'number') elapsedMyr = store.elapsedMyr;
        if (store.view === 'top' || store.view === 'edge') view = store.view;
        setView(view === 'oblique' ? 'oblique' : view);
        applyElapsed(elapsedMyr);

        var topBtn = document.getElementById('t3dGyViewBtn-top');
        var edgeBtn = document.getElementById('t3dGyViewBtn-edge');
        if (topBtn) topBtn.addEventListener('click', function () { setView('top'); });
        if (edgeBtn) edgeBtn.addEventListener('click', function () { setView('edge'); });
        var playBtn = document.getElementById('t3dGyPlayBtn');
        if (playBtn) playBtn.addEventListener('click', function () {
            playing = !playing;
            playBtn.textContent = playing ? 'Pause' : 'Play';
        });
        var slider = document.getElementById('t3dGyElapsed');
        if (slider) slider.addEventListener('input', function () {
            playing = false;
            if (playBtn) playBtn.textContent = 'Play';
            applyElapsed(parseFloat(slider.value || '0'));
        });

        t3dStatus('Drag to orbit, scroll to zoom. Switch top-down vs edge-on view, or scrub cosmic time to count galactic years.');
        return function animate(dt) {
            if (!playing) return;
            var next = elapsedMyr + (dt / 1000) * 46;
            if (next >= T3D_GY_MAX_ELAPSED_MYR) next = 0;
            applyElapsed(next);
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { galacticyear: 't3dGyControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = {
                        galacticyear: { radius: 62, maxR: 220, minR: 15, phi: 0.85, theta: 0.55, targetY: 0 }
                    };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dGalacticYear(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

<script>
    // 3D scene archetype skeleton (k2) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN engine), fully
    // client-side. Built LEAN from the shared t3d* skeleton - ONE scene only
    // (k2). All geometry is procedural. places-3d cluster, 2026-08-28.
    //
    // EDUCATIONAL APPROXIMATION, not survey terrain.
    // Published figures (Karakoram / mountaineering sources, cross-checked 2026-08-28):
    //   - Summit elevation 8,611 m (28,251 ft) - Earth's second-highest peak
    //     after Mount Everest (8,849 m)
    //   - Karakoram range, on the China (Xinjiang) / Pakistan (Gilgit-Baltistan)
    //     border, at the head of the Godwin-Austen and Baltoro Glaciers
    //   - Nicknamed the "Savage Mountain" for a historically very high
    //     fatality-to-summit ratio - roughly one death for every four
    //     successful summits over the mountain's climbing history, though
    //     the ratio has improved with modern equipment and forecasting
    //   - A single steep, near-symmetric pyramid rather than a broad ridged
    //     massif - K2 rises about 3,500 m above its own glacier base in a
    //     short horizontal distance, making it steeper and technically
    //     harder than the taller Everest
    //   - First ascent July 31, 1954, by Lino Lacedelli and Achille
    //     Compagnoni, an Italian expedition led by Ardito Desio, via the
    //     Abruzzi Spur (also called the Abruzzi Ridge) on the southeast side
    //   - The "Bottleneck": a narrow couloir at about 8,200 m directly under
    //     a huge overhanging ice serac - one of the most dangerous single
    //     sections on the route; the 2008 K2 disaster (11 climbers died in
    //     one incident) happened here
    //   - First winter ascent January 16, 2021 - a team of ten Nepali
    //     climbers (led by Nirmal Purja and Mingma Gyalje Sherpa) reached
    //     the summit together, the last of the world's 8,000 m peaks to
    //     fall to a winter ascent
    //   - Named "K2" because it was the second peak surveyed in the
    //     Karakoram range by T.G. Montgomerie in 1856 - unlike most major
    //     peaks it never acquired a widely used local name recognized
    //     internationally
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'k2';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesk2'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x7c93ad, 1); // clear high-altitude sky
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        var key = new THREE.DirectionalLight(0xfff2d8, 1.15);
        key.position.set(-8, 22, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function smoothv(a, b, t) { t = Math.max(0, Math.min(1, (t - a) / (b - a))); return t * t * (3 - 2 * t); }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, metalness: 0 }));
        }

        // A single, near-symmetric STEEP PYRAMID rising abruptly from a FLAT
        // GLACIER PLATEAU at its base (the Godwin-Austen / Baltoro Glaciers),
        // with ONE dominant spur ridge (the Abruzzi Spur, southeast) instead
        // of Matterhorn's four radial ridges, and NO ridged multi-summit
        // massif or carved glacial valleys like Everest's - a genuinely new
        // places-3d archetype: a lone steep cone standing on a flat ice
        // apron, distinct from Matterhorn's 4-armed horn and Everest's
        // 3-summit ridged massif.
        var BASE_R = 4.6, PEAK_H = 8.4, EXP_FACE = 1.9;
        var ABRUZZI = { angle: Math.PI * 0.32, exp: 0.58, len: 1.22, halfw: Math.PI / 7 };
        function angWrap(a) { a = a % (Math.PI * 2); if (a > Math.PI) a -= Math.PI * 2; if (a < -Math.PI) a += Math.PI * 2; return a; }
        function abruzziLobe(theta) {
            var d = Math.abs(angWrap(theta - ABRUZZI.angle));
            var t = Math.max(0, 1 - d / ABRUZZI.halfw);
            return t * t * (3 - 2 * t);
        }
        function ridgeFactor(theta) {
            var lobe = abruzziLobe(theta);
            return { lenScale: 1 + lobe * (ABRUZZI.len - 1), exp: EXP_FACE - lobe * (EXP_FACE - ABRUZZI.exp), prom: lobe };
        }
        function height(x, z) {
            var R = Math.hypot(x, z), theta = Math.atan2(z, x);
            var f = ridgeFactor(theta);
            var rn = R / (BASE_R * f.lenScale);
            if (rn < 1) {
                var peak = PEAK_H * Math.pow(Math.max(0, 1 - rn), f.exp);
                var texture = 0.14 * rn * (fbm(x * 1.5 + 7, z * 1.5 + 3, 4) - 0.5);
                return Math.max(0, peak) + texture;
            }
            // Flat glacier plateau at the base - near-zero relief with a
            // faint crevasse-crack texture, NOT talus mounds or meadow like
            // the Alpine sibling pages.
            var crackT = smoothv(1, 1.2, rn);
            var crevasse = 0.08 * (1 - crackT) * (fbm(x * 0.9 + 21, z * 0.9 + 5, 4) - 0.5);
            return crevasse;
        }

        var col = {
            ice: new THREE.Color(0xd7e2ea), crevasseDark: new THREE.Color(0xa9bdcb),
            rock: new THREE.Color(0x4d443d), rockLight: new THREE.Color(0x746657),
            snowFull: new THREE.Color(0xf6f9fb), serac: new THREE.Color(0xbfe0ea)
        };
        var SNOW_LINE = PEAK_H * 0.56;
        // Bottleneck serac band: a narrow overhang zone at about h/PEAK_H
        // 0.86-0.94, localized to the climbing (Abruzzi) face only - the
        // real Bottleneck couloir sits directly under a huge hanging ice
        // shelf near the summit on that side of the mountain.
        var SERAC_LO = PEAK_H * 0.86, SERAC_HI = PEAK_H * 0.94;
        function bandColor(c, x, z) {
            var R = Math.hypot(x, z), theta = Math.atan2(z, x);
            var f = ridgeFactor(theta);
            var rn = R / (BASE_R * f.lenScale);
            if (rn >= 1) {
                var crackT = smoothv(1, 1.2, rn);
                c.copy(col.crevasseDark).lerp(col.ice, crackT);
                var streak = fbm(x * 1.8 + 40, z * 1.8 + 12, 3);
                if (streak < 0.32) c.multiplyScalar(0.82);
                return;
            }
            var h = PEAK_H * Math.pow(Math.max(0, 1 - rn), f.exp);
            c.copy(col.rock).lerp(col.rockLight, Math.min(1, f.prom * 1.3));
            if (h > SNOW_LINE) {
                var edge = SNOW_LINE + (fbm(x * 1.2 + 18, z * 1.2 + 9, 3) - 0.5) * 0.6;
                var st = smoothv(edge, edge + 0.5, h);
                c.lerp(col.snowFull, st);
            }
            if (f.prom > 0.45 && h > SERAC_LO && h < SERAC_HI) {
                c.lerp(col.serac, 0.7);
            }
            var n = 0.9 + 0.16 * fbm(x * 1.3 + 4, z * 1.3 + 6, 3);
            c.multiplyScalar(n);
        }
        var terrain = makeTerrain(24, 24, shell.low ? 150 : 200, shell.low ? 150 : 200, height, bandColor);
        scene.add(terrain);

        // Abruzzi Spur route marker: a thin tube traced up the real ridge
        // surface (runtime-sampled from height()), same technique used for
        // the Matterhorn Hoernli ridge and the Mount St. Helens crater
        // markers - group-visibility toggle only, no geometry rebuild.
        var routePts = [];
        for (var ri = 0; ri <= 30; ri++) {
            var rr = BASE_R * ABRUZZI.len * (0.16 + 0.82 * (ri / 30));
            var rx = rr * Math.cos(ABRUZZI.angle), rz = rr * Math.sin(ABRUZZI.angle);
            routePts.push(new THREE.Vector3(rx, height(rx, rz) + 0.06, rz));
        }
        var routeGroup = new THREE.Group();
        var routeTube = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(routePts), 44, 0.06, 6, false),
            new THREE.MeshBasicMaterial({ color: 0xff8a3d })
        );
        routeGroup.add(routeTube);
        var campPt = routePts[10];
        var camp = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.24, 6), new THREE.MeshStandardMaterial({ color: 0xd9432f }));
        camp.position.set(campPt.x, campPt.y + 0.15, campPt.z);
        routeGroup.add(camp);
        scene.add(routeGroup);

        // Bottleneck serac overhang: a flattened, semi-transparent icy shelf
        // mesh fixed at the real serac's height and angular position on the
        // Abruzzi face - a mesh-visibility toggle only (Render-quality
        // contract: toggle color/visibility changes swap precomputed
        // buffers or mesh visibility, never rebuild geometry per click).
        var serMidH = (SERAC_LO + SERAC_HI) / 2;
        var serAngle = ABRUZZI.angle - ABRUZZI.halfw * 0.15;
        var serR = BASE_R * (1 - serMidH / PEAK_H);
        var serX = serR * Math.cos(serAngle), serZ = serR * Math.sin(serAngle);
        var seracGroup = new THREE.Group();
        var serac = new THREE.Mesh(
            new THREE.SphereGeometry(0.85, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2.4),
            new THREE.MeshStandardMaterial({ color: 0xcfeaf2, transparent: true, opacity: 0.72, roughness: 0.3 })
        );
        serac.scale.set(1.5, 0.5, 1.1);
        serac.position.set(serX, serMidH + 0.1, serZ);
        seracGroup.add(serac);
        scene.add(seracGroup);

        var routeOn = true, seracOn = true;

        function panelHtml() {
            return '<h3>K2: a single steep pyramid, not a broad massif</h3>' +
                '<p>The orange marker traces the Abruzzi Spur - the first-ascent and most-climbed route - up the southeast side. The pale overhang near the top marks the Bottleneck, the couloir beneath K2\'s notorious hanging serac.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Summit elevation</td><td>8,611 m (28,251 ft) - Earth\'s 2nd-highest peak</td></tr>' +
                '<tr><td>Location</td><td>Karakoram range, on the China / Pakistan border, above the Godwin-Austen and Baltoro Glaciers</td></tr>' +
                '<tr><td>Nickname</td><td>"Savage Mountain" - a historically very high fatality-to-summit ratio</td></tr>' +
                '<tr><td>First ascent</td><td>July 31, 1954, Lino Lacedelli and Achille Compagnoni, via the Abruzzi Spur</td></tr>' +
                '<tr><td>The Bottleneck</td><td>a narrow couloir at about 8,200 m directly under a huge overhanging ice serac</td></tr>' +
                '<tr><td>2008 K2 disaster</td><td>11 climbers died in a single incident at the Bottleneck</td></tr>' +
                '<tr><td>First winter ascent</td><td>January 16, 2021 - a team of ten Nepali climbers, the last 8,000 m peak to fall in winter</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - the pyramid shape, route line, and serac position are schematic teaching cues, not survey terrain.</p>';
        }

        function apply() {
            routeGroup.visible = routeOn;
            seracGroup.visible = seracOn;
            var rb = document.getElementById('t3dPk2RouteBtn');
            if (rb) rb.textContent = 'Abruzzi Spur route marker: ' + (routeOn ? 'On' : 'Off');
            var sb = document.getElementById('t3dPk2SeracBtn');
            if (sb) sb.textContent = 'Bottleneck serac overhang: ' + (seracOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ routeOn: routeOn, seracOn: seracOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.routeOn === 'boolean') routeOn = store.routeOn;
        if (typeof store.seracOn === 'boolean') seracOn = store.seracOn;
        apply();

        var routeBtn = document.getElementById('t3dPk2RouteBtn');
        if (routeBtn) routeBtn.addEventListener('click', function () { routeOn = !routeOn; apply(); });
        var seracBtn = document.getElementById('t3dPk2SeracBtn');
        if (seracBtn) seracBtn.addEventListener('click', function () { seracOn = !seracOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle the Abruzzi Spur route marker or the Bottleneck serac overhang.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesk2: 't3dPk2Controls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesk2: { radius: 21, maxR: 52, minR: 7, phi: 1.28, theta: 0.9, targetY: 3 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

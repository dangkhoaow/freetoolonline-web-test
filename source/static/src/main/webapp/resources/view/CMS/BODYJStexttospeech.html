<script>
    // Speech skeleton (text-to-speech) - Web Speech API + optional in-browser
    // audio-file generation. No backend, nothing uploaded.
    // Registry Gate-H entries: text_to_speech_speechsynthesis / speech_to_text_speechrecognition.
    //
    // 2026-08-23 operator-requested extension:
    //   - Transcript upload: .srt / .vtt / .sbv / .txt files parsed locally; timed
    //     cues (time ranges) are listed and can be spoken one-by-one or in sequence.
    //   - Language auto-detect: script + common-word heuristics (pure JS, offline)
    //     pick a matching device voice automatically.
    //   - Audio download: speechSynthesis output CANNOT be captured by design, so
    //     WAV/MP3 files are generated by the meSpeak (eSpeak) engine running in the
    //     browser (/vendor/mespeak/, GPL) + lamejs MP3 encoder (/vendor/lamejs/).
    //     Downloaded audio uses the compact eSpeak voice (more synthetic than the
    //     device voices used for playback) - stated honestly in the UI.
    //
    // Framework contract: doAfterPageRendered() (fires once jQuery + base script
    // load); no top-level DOM. Visible controls + status satisfy e2e G16.

    web.localUpload = false;

    var SP_SLUG = 'text-to-speech';

    function spMode(slug) {
        var s = String(slug || '').toLowerCase();
        if (/speech-to-text|\btranscribe|\bdictation|voice-to-text|\bstt\b/.test(s)) return 'stt';
        if (/text-to-speech|text-to-voice|\bspeak\b|\btts\b|\bnarrat/.test(s)) return 'tts';
        return 'both';
    }

    function spEsc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

    // ---------- transcript parsing (.srt / .vtt / .sbv / plain text) ----------
    function spParseTimestamp(t) {
        // "00:00:01,000" | "00:00:01.000" | "00:01.000" | "0:00:01.000"
        var m = String(t).trim().match(/^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[,.](\d{1,3})$/);
        if (!m) return null;
        return (parseInt(m[1] || 0, 10) * 3600) + (parseInt(m[2], 10) * 60) + parseInt(m[3], 10) + (parseInt(m[4], 10) / Math.pow(10, m[4].length));
    }

    function spFmtTime(sec) {
        if (sec == null) return '--:--';
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
        return (h ? h + ':' + ('0' + m).slice(-2) : m) + ':' + ('0' + s).slice(-2);
    }

    function spStripCueTags(t) {
        return String(t).replace(/<[^>]+>/g, '').replace(/\{\\[^}]*\}/g, '').trim();
    }

    function spParseTranscript(name, raw) {
        var text = String(raw || '').replace(/^\uFEFF/, '');
        var ext = (String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
        var cues = [];
        var arrow = /(\S+)\s+-->\s+(\S+)/;
        if (ext === 'srt' || ext === 'vtt' || /^WEBVTT/.test(text)) {
            var blocks = text.split(/\r?\n\r?\n+/);
            for (var i = 0; i < blocks.length; i++) {
                var lines = blocks[i].split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
                if (!lines.length) continue;
                if (/^WEBVTT|^NOTE|^STYLE|^REGION/.test(lines[0])) continue;
                var ti = arrow.test(lines[0]) ? 0 : (lines[1] && arrow.test(lines[1]) ? 1 : -1);
                if (ti < 0) continue;
                var tm = lines[ti].match(arrow);
                var body = spStripCueTags(lines.slice(ti + 1).join(' '));
                if (body) cues.push({ start: spParseTimestamp(tm[1]), end: spParseTimestamp(tm[2]), text: body });
            }
        } else if (ext === 'sbv') {
            var sb = text.split(/\r?\n\r?\n+/);
            for (var j = 0; j < sb.length; j++) {
                var ls = sb[j].split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
                var hm = ls.length && ls[0].match(/^(\S+)\s*,\s*(\S+)$/);
                if (!hm) continue;
                var bd = spStripCueTags(ls.slice(1).join(' '));
                if (bd) cues.push({ start: spParseTimestamp(hm[1]), end: spParseTimestamp(hm[2]), text: bd });
            }
        }
        var plain = cues.length ? cues.map(function (c) { return c.text; }).join('\n') : text.trim();
        return { plain: plain, cues: cues };
    }

    // ---------- offline language auto-detect (script + common-word heuristics) ----------
    var SP_STOPWORDS = {
        en: ['the', 'and', 'is', 'of', 'to', 'you', 'that', 'with', 'this', 'for'],
        es: ['que', 'los', 'las', 'una', 'por', 'con', 'para', 'como', 'esta', 'pero'],
        pt: ['que', 'nao', 'uma', 'com', 'por', 'para', 'mais', 'como', 'isso', 'voce'],
        fr: ['les', 'des', 'est', 'vous', 'que', 'pour', 'dans', 'une', 'avec', 'pas'],
        de: ['und', 'die', 'der', 'das', 'ist', 'nicht', 'ein', 'mit', 'sie', 'auf'],
        it: ['che', 'per', 'una', 'del', 'con', 'non', 'sono', 'della', 'questo', 'come'],
        nl: ['het', 'een', 'van', 'dat', 'niet', 'met', 'voor', 'zijn', 'maar', 'ook'],
        tr: ['bir', 'bu', 'icin', 've', 'ile', 'ama', 'gibi', 'daha', 'olarak', 'var'],
        pl: ['nie', 'jest', 'sie', 'jak', 'ale', 'czy', 'tak', 'tego', 'przez', 'jego'],
        id: ['yang', 'dan', 'ini', 'itu', 'untuk', 'dengan', 'tidak', 'dari', 'akan', 'kami'],
        cs: ['je', 'na', 'se', 'to', 'ale', 'jako', 'nebo', 'tak', 'pro', 'jsou'],
        ro: ['este', 'care', 'pentru', 'din', 'mai', 'sau', 'sunt', 'dar', 'fost', 'unei'],
        sv: ['och', 'att', 'det', 'som', 'en', 'inte', 'med', 'har', 'den', 'jag'],
        fi: ['ja', 'on', 'ei', 'joka', 'mutta', 'kun', 'niin', 'mika', 'olla', 'sen'],
        hu: ['hogy', 'nem', 'egy', 'az', 'is', 'meg', 'csak', 'volt', 'mint', 'ezt']
    };

    var SP_LANG_LABELS = { en: 'English', es: 'Spanish', pt: 'Portuguese', fr: 'French', de: 'German', it: 'Italian', nl: 'Dutch', tr: 'Turkish', pl: 'Polish', id: 'Indonesian', cs: 'Czech', ro: 'Romanian', sv: 'Swedish', fi: 'Finnish', hu: 'Hungarian', vi: 'Vietnamese', zh: 'Chinese', ja: 'Japanese', ko: 'Korean', ru: 'Russian', ar: 'Arabic', hi: 'Hindi', th: 'Thai', el: 'Greek', he: 'Hebrew' };

    function spDetectLang(text) {
        var t = String(text || '');
        if (!t.trim()) return null;
        if (/[\u3040-\u30FF]/.test(t)) return 'ja';
        if (/[\uAC00-\uD7AF]/.test(t)) return 'ko';
        if (/[\u4E00-\u9FFF]/.test(t)) return 'zh';
        if (/[\u0E00-\u0E7F]/.test(t)) return 'th';
        if (/[\u0600-\u06FF]/.test(t)) return 'ar';
        if (/[\u0400-\u04FF]/.test(t)) return 'ru';
        if (/[\u0900-\u097F]/.test(t)) return 'hi';
        if (/[\u0370-\u03FF]/.test(t)) return 'el';
        if (/[\u0590-\u05FF]/.test(t)) return 'he';
        if (/[\u0103\u00E2\u0111\u00EA\u00F4\u01A1\u01B0\u1EA0-\u1EF9]/i.test(t)) return 'vi';
        // Latin languages: score common short words
        var words = t.toLowerCase().replace(/[^a-z\u00C0-\u024F\s]/g, ' ').split(/\s+/).slice(0, 400);
        var best = 'en', bestScore = 0;
        for (var code in SP_STOPWORDS) {
            if (!SP_STOPWORDS.hasOwnProperty(code)) continue;
            var list = SP_STOPWORDS[code], score = 0;
            for (var i = 0; i < words.length; i++) { if (list.indexOf(words[i]) !== -1) score++; }
            if (score > bestScore) { bestScore = score; best = code; }
        }
        return bestScore > 0 ? best : 'en';
    }

    // ---------- in-browser audio-file engine (meSpeak / eSpeak, GPL) ----------
    // Voices vendored under /vendor/mespeak/voices/. Languages without an eSpeak
    // voice file (vi, ja, ko, ru, ar, hi, th, he, id) can still be PLAYED via a
    // matching device voice; the downloadable-file engine skips them.
    var SP_MESPEAK_VOICES = { en: 'en/en-us', es: 'es', pt: 'pt', fr: 'fr', de: 'de', it: 'it', nl: 'nl', tr: 'tr', pl: 'pl', cs: 'cs', ro: 'ro', sv: 'sv', fi: 'fi', hu: 'hu', el: 'el', zh: 'zh' };
    var spEngineState = { loading: false, ready: false, voices: {} };
    function spBase() { return (typeof BASE_PATH === 'string' ? BASE_PATH : ''); }

    function spLoadScript(src, cb) {
        var s = document.createElement('script');
        s.src = src; s.onload = function () { cb(true); }; s.onerror = function () { cb(false); };
        document.head.appendChild(s);
    }

    function spEnsureEngine(cb) {
        if (spEngineState.ready) return cb(true);
        if (spEngineState.loading) { setTimeout(function () { spEnsureEngine(cb); }, 300); return; }
        spEngineState.loading = true;
        spLoadScript(spBase() + '/vendor/mespeak/mespeak.js', function (ok) {
            if (!ok || !window.meSpeak) { spEngineState.loading = false; return cb(false); }
            window.meSpeak.loadConfig(spBase() + '/vendor/mespeak/mespeak_config.json');
            spEngineState.ready = true; spEngineState.loading = false;
            cb(true);
        });
    }

    function spEnsureVoice(langCode, cb) {
        var vid = SP_MESPEAK_VOICES[langCode];
        if (!vid) return cb(false, null);
        if (spEngineState.voices[vid]) return cb(true, vid);
        window.meSpeak.loadVoice('voices/' + vid + '.json', function (ok) {
            if (ok) spEngineState.voices[vid] = true;
            cb(!!ok, vid);
        });
    }

    // Parse a WAV ArrayBuffer -> { rate, samples: Int16Array } (16-bit mono PCM from eSpeak)
    function spWavToPcm(buf) {
        var dv = new DataView(buf);
        var rate = dv.getUint32(24, true);
        var off = 12;
        while (off < buf.byteLength - 8) {
            var id = String.fromCharCode(dv.getUint8(off), dv.getUint8(off + 1), dv.getUint8(off + 2), dv.getUint8(off + 3));
            var size = dv.getUint32(off + 4, true);
            if (id === 'data') return { rate: rate, samples: new Int16Array(buf, off + 8, Math.floor(size / 2)) };
            off += 8 + size + (size % 2);
        }
        return null;
    }

    function spEncodeMp3(pcm) {
        var enc = new lamejs.Mp3Encoder(1, pcm.rate, 96);
        var parts = [], block = 1152;
        for (var i = 0; i < pcm.samples.length; i += block) {
            var chunk = pcm.samples.subarray(i, i + block);
            var d = enc.encodeBuffer(chunk);
            if (d.length) parts.push(d);
        }
        var end = enc.flush();
        if (end.length) parts.push(end);
        return new Blob(parts, { type: 'audio/mpeg' });
    }

    // ---------- TTS panel ----------
    function spBuildTts(root) {
        var wrap = document.createElement('div');
        wrap.className = 'w3-container';
        wrap.innerHTML =
            '<h3 class="w3-text-blue-grey">Text to speech</h3>' +
            '<div style="margin:6px 0;"><label class="w3-button w3-light-grey" style="padding:6px 12px;">Upload transcript (.srt .vtt .sbv .txt)' +
            '<input id="spFile" type="file" accept=".srt,.vtt,.sbv,.txt,.text,.md" style="display:none;"></label> ' +
            '<span id="spFileInfo" style="color:#555;"></span></div>' +
            '<textarea id="spText" class="w3-input w3-border" rows="4" style="width:100%;" placeholder="Type or paste the text to read aloud, or upload a transcript file...">Your text is read aloud in your browser. Nothing is uploaded.</textarea>' +
            '<div class="w3-row" style="margin:8px 0;">' +
            'Voice <select id="spVoice" class="w3-select w3-border" style="width:auto;display:inline-block;max-width:52%;"></select> ' +
            '<label><input id="spAutoVoice" type="checkbox" checked> Auto voice by detected language</label> ' +
            '<span id="spLangInfo" style="color:#555;"></span>' +
            '</div>' +
            '<div class="w3-row" style="margin:8px 0;">' +
            'Rate <input id="spRate" type="range" min="0.5" max="2" step="0.1" value="1" style="vertical-align:middle;"> ' +
            'Pitch <input id="spPitch" type="range" min="0" max="2" step="0.1" value="1" style="vertical-align:middle;">' +
            '</div>' +
            '<div style="margin-bottom:8px;"><button id="spSpeak" type="button" class="w3-button w3-green">Speak</button> ' +
            '<button id="spStopTts" type="button" class="w3-button w3-red">Stop</button> ' +
            '<select id="spDlFmt" class="w3-select w3-border" style="width:auto;display:inline-block;"><option value="mp3">MP3</option><option value="wav">WAV</option></select> ' +
            '<button id="spMakeFile" type="button" class="w3-button w3-blue">Generate audio file</button> ' +
            '<a id="spDlAudio" class="w3-button w3-teal" style="display:none;">Download</a></div>' +
            '<div id="spTtsStatus" class="outputImgs" style="visibility:visible !important;min-height:1.2em;color:#555;">Ready. Click Speak to hear the text, or Generate audio file to create an MP3/WAV in your browser.</div>' +
            '<div id="spCueWrap" style="display:none;margin-top:10px;">' +
            '<b>Timed cues from the uploaded file</b> ' +
            '<button id="spSpeakCues" type="button" class="w3-button w3-green w3-small">Speak all cues</button>' +
            '<ol id="spCueList" style="max-height:260px;overflow:auto;margin-top:6px;"></ol></div>';
        root.appendChild(wrap);
        var synth = window.speechSynthesis;
        var status = wrap.querySelector('#spTtsStatus');
        var voiceSel = wrap.querySelector('#spVoice');
        var cues = [];
        var detected = null;

        function setStatus(m) { status.textContent = m; }

        function loadVoices() {
            if (!synth) return;
            var vs = synth.getVoices() || [];
            voiceSel.innerHTML = vs.map(function (v, i) { return '<option value="' + i + '">' + spEsc(v.name + ' (' + v.lang + ')') + '</option>'; }).join('') || '<option value="">(default voice)</option>';
        }
        if (synth) {
            loadVoices();
            if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = loadVoices;
        }

        function pickVoiceForLang(code) {
            if (!synth || !code) return;
            var vs = synth.getVoices() || [];
            for (var i = 0; i < vs.length; i++) {
                if (String(vs[i].lang).toLowerCase().indexOf(code) === 0) { voiceSel.value = String(i); return true; }
            }
            return false;
        }

        function refreshLang() {
            var text = wrap.querySelector('#spText').value || '';
            detected = spDetectLang(text);
            var info = wrap.querySelector('#spLangInfo');
            if (!detected) { info.textContent = ''; return; }
            info.textContent = 'detected: ' + (SP_LANG_LABELS[detected] || detected);
            if (wrap.querySelector('#spAutoVoice').checked) {
                var okv = pickVoiceForLang(detected);
                if (!okv) info.textContent += ' (no matching device voice; using selected voice)';
            }
        }
        wrap.querySelector('#spText').addEventListener('input', function () { refreshLang(); });

        // ----- transcript upload -----
        wrap.querySelector('#spFile').addEventListener('change', function () {
            var f = this.files && this.files[0];
            if (!f) return;
            var rd = new FileReader();
            rd.onload = function () {
                var parsed = spParseTranscript(f.name, rd.result);
                wrap.querySelector('#spText').value = parsed.plain;
                cues = parsed.cues;
                var cueWrap = wrap.querySelector('#spCueWrap');
                var list = wrap.querySelector('#spCueList');
                if (cues.length) {
                    list.innerHTML = cues.map(function (c, i) {
                        return '<li style="margin:3px 0;"><button type="button" class="w3-button w3-small w3-light-grey sp-cue-play" data-i="' + i + '">&#9654;</button> ' +
                            '<span style="font-family:monospace;color:#777;">[' + spFmtTime(c.start) + ' - ' + spFmtTime(c.end) + ']</span> ' + spEsc(c.text) + '</li>';
                    }).join('');
                    cueWrap.style.display = '';
                } else {
                    list.innerHTML = ''; cueWrap.style.display = 'none';
                }
                wrap.querySelector('#spFileInfo').textContent = f.name + ' - ' + (cues.length ? cues.length + ' timed cues parsed.' : 'plain text loaded.');
                refreshLang();
                setStatus('File parsed locally - nothing was uploaded. ' + (cues.length ? 'Play a cue, Speak all cues, or generate an audio file.' : 'Press Speak or Generate audio file.'));
            };
            rd.readAsText(f);
        });

        // ----- playback -----
        function speakText(text, onEnd) {
            if (!synth) { setStatus('This browser does not support in-browser speech (speechSynthesis API).'); return; }
            var u = new SpeechSynthesisUtterance(text);
            var vs = synth.getVoices() || [];
            var idx = parseInt(voiceSel.value, 10);
            if (vs[idx]) u.voice = vs[idx];
            u.rate = parseFloat(wrap.querySelector('#spRate').value) || 1;
            u.pitch = parseFloat(wrap.querySelector('#spPitch').value) || 1;
            if (onEnd) u.onend = onEnd;
            synth.speak(u);
            return u;
        }

        wrap.querySelector('#spSpeak').addEventListener('click', function () {
            var text = wrap.querySelector('#spText').value || '';
            if (!text.trim()) { setStatus('Type some text or upload a transcript first.'); return; }
            if (!synth) { setStatus('This browser does not support in-browser speech (speechSynthesis API).'); return; }
            synth.cancel();
            setStatus('Speaking...');
            speakText(text, function () { setStatus('Done speaking.'); });
        });
        wrap.querySelector('#spStopTts').addEventListener('click', function () { if (synth) synth.cancel(); setStatus('Stopped.'); });

        wrap.querySelector('#spCueList').addEventListener('click', function (ev) {
            var b = ev.target.closest ? ev.target.closest('.sp-cue-play') : null;
            if (!b) return;
            var c = cues[parseInt(b.getAttribute('data-i'), 10)];
            if (!c || !synth) return;
            synth.cancel();
            setStatus('Speaking cue [' + spFmtTime(c.start) + ' - ' + spFmtTime(c.end) + ']...');
            speakText(c.text, function () { setStatus('Cue done.'); });
        });

        wrap.querySelector('#spSpeakCues').addEventListener('click', function () {
            if (!cues.length || !synth) return;
            synth.cancel();
            var i = 0;
            function next() {
                if (i >= cues.length) { setStatus('All ' + cues.length + ' cues spoken.'); return; }
                var c = cues[i++];
                setStatus('Speaking cue ' + i + '/' + cues.length + ' [' + spFmtTime(c.start) + ' - ' + spFmtTime(c.end) + ']...');
                speakText(c.text, next);
            }
            next();
        });

        // ----- audio file generation (meSpeak + lamejs, all in-browser) -----
        wrap.querySelector('#spMakeFile').addEventListener('click', function () {
            var text = (wrap.querySelector('#spText').value || '').trim();
            if (!text) { setStatus('Type some text or upload a transcript first.'); return; }
            if (text.length > 20000) { setStatus('Text is too long for file generation (limit 20,000 characters). Split it into parts.'); return; }
            var fmt = wrap.querySelector('#spDlFmt').value;
            var lang = detected || spDetectLang(text) || 'en';
            if (!SP_MESPEAK_VOICES[lang]) {
                setStatus('The file engine has no ' + (SP_LANG_LABELS[lang] || lang) + ' voice yet - playback still works with your device voice. Generating with the English voice instead.');
                lang = 'en';
            } else {
                setStatus('Loading the in-browser audio engine...');
            }
            var btn = this; btn.disabled = true;
            spEnsureEngine(function (ok) {
                if (!ok) { setStatus('Could not load the audio engine script. Reload the page and try again.'); btn.disabled = false; return; }
                spEnsureVoice(lang, function (vok, vid) {
                    if (!vok) { setStatus('Could not load the ' + lang + ' voice file.'); btn.disabled = false; return; }
                    setStatus('Generating audio (' + fmt.toUpperCase() + ', ' + (SP_LANG_LABELS[lang] || lang) + ' eSpeak voice)...');
                    var rate = parseFloat(wrap.querySelector('#spRate').value) || 1;
                    var pitch = parseFloat(wrap.querySelector('#spPitch').value) || 1;
                    window.meSpeak.speak(text, { voice: vid, rawdata: 'arraybuffer', speed: Math.round(175 * rate), pitch: Math.round(50 * pitch) }, function (success, id, stream) {
                        try {
                            if (!success || !stream) { setStatus('Audio generation failed in this browser.'); btn.disabled = false; return; }
                            function finish(blob, ext) {
                                var a = wrap.querySelector('#spDlAudio');
                                a.href = URL.createObjectURL(blob);
                                a.download = 'text-to-speech.' + ext;
                                a.style.display = '';
                                a.textContent = 'Download ' + ext.toUpperCase() + ' (' + Math.round(blob.size / 1024) + ' KB)';
                                setStatus('Audio file ready - generated entirely in your browser with the compact eSpeak voice. Device voices used by Speak cannot be recorded to a file; that is a browser privacy rule, not a bug.');
                                btn.disabled = false;
                            }
                            if (fmt === 'wav') { finish(new Blob([stream], { type: 'audio/wav' }), 'wav'); return; }
                            spLoadScript(spBase() + '/vendor/lamejs/lame.min.js', function (lok) {
                                if (!lok || !window.lamejs) { setStatus('MP3 encoder failed to load - use WAV instead.'); btn.disabled = false; return; }
                                var pcm = spWavToPcm(stream);
                                if (!pcm) { setStatus('Could not parse generated audio - use WAV instead.'); btn.disabled = false; return; }
                                finish(spEncodeMp3(pcm), 'mp3');
                            });
                        } catch (e) { setStatus('Audio generation error: ' + e.message); btn.disabled = false; }
                    });
                });
            });
        });

        if (!synth) setStatus('This browser does not support in-browser speech playback (speechSynthesis API). Audio file generation may still work.');
    }

    function spBuildStt(root) {
        var wrap = document.createElement('div');
        wrap.className = 'w3-container';
        wrap.innerHTML =
            '<h3 class="w3-text-blue-grey">Speech to text</h3>' +
            '<div style="margin-bottom:8px;"><button id="spRec" type="button" class="w3-button w3-green">Start listening</button> ' +
            '<button id="spStopStt" type="button" class="w3-button w3-red" disabled>Stop</button> ' +
            '<a id="spDl" class="w3-button w3-blue" style="display:none;">Download .txt</a></div>' +
            '<textarea id="spTranscript" class="w3-input w3-border outputImgs" rows="5" style="width:100%;visibility:visible !important;" placeholder="Your speech appears here as text. It is transcribed locally - nothing is uploaded." readonly></textarea>' +
            '<div id="spSttStatus" style="min-height:1.2em;color:#555;margin-top:6px;">Click Start listening and allow microphone access. Transcription runs in your browser.</div>';
        root.appendChild(wrap);
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        var status = wrap.querySelector('#spSttStatus'), ta = wrap.querySelector('#spTranscript');
        if (!SR) { status.textContent = 'This browser does not support in-browser transcription (SpeechRecognition API). Try Chrome or Safari.'; wrap.querySelector('#spRec').disabled = true; return; }
        var rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
        var finalText = '';
        rec.onresult = function (ev) {
            var interim = '';
            for (var i = ev.resultIndex; i < ev.results.length; i++) {
                var tr = ev.results[i][0].transcript;
                if (ev.results[i].isFinal) finalText += tr + ' '; else interim += tr;
            }
            ta.value = (finalText + interim).trim();
            var dl = wrap.querySelector('#spDl');
            if (ta.value) { dl.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain' })); dl.download = 'transcript.txt'; dl.style.display = ''; }
        };
        rec.onerror = function (e) { status.textContent = 'Microphone/transcription error: ' + (e && e.error ? e.error : 'unknown') + '.'; };
        rec.onend = function () { wrap.querySelector('#spRec').disabled = false; wrap.querySelector('#spStopStt').disabled = true; status.textContent = 'Stopped.'; };
        wrap.querySelector('#spRec').addEventListener('click', function () { finalText = ta.value ? ta.value + ' ' : ''; try { rec.start(); } catch (e) {} this.disabled = true; wrap.querySelector('#spStopStt').disabled = false; status.textContent = 'Listening... speak now.'; });
        wrap.querySelector('#spStopStt').addEventListener('click', function () { rec.stop(); });
    }

    function doAfterPageRendered() {
        var root = document.getElementById('speechTool');
        if (!root) return; // not a speech page
        root.innerHTML = '';
        var mode = spMode(SP_SLUG);
        if (mode === 'tts' || mode === 'both') spBuildTts(root);
        if (mode === 'stt' || mode === 'both') spBuildStt(root);
    }
</script>

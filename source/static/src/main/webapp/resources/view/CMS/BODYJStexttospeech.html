<script>
    // Text to speech - Supertonic 3 neural voices running fully in the browser.
    //
    // 2026-08-29 operator-requested engine switch:
    //   The page used to speak with the device's built-in speechSynthesis voices
    //   and generate downloadable files with the compact eSpeak/meSpeak engine.
    //   Both are now the FALLBACK. The primary engine is Supertonic 3
    //   (Supertone, https://huggingface.co/Supertone/supertonic-3): a 99M-parameter
    //   ONNX model set - duration predictor, text encoder, flow-matching vector
    //   estimator, vocoder - executed by ONNX Runtime Web (WebGPU, WASM fallback)
    //   inside the reader's tab. Same voice on every device, 44.1 kHz output that
    //   can be downloaded, 31 languages, 10 voice styles (M1-M5 / F1-F5).
    //
    //   Model data (~380 MB) is NOT in this repo. It is fetched once from the
    //   asset CDN (gh-static.freetool.online/supertonic/v3/, pinned upstream
    //   revision, checksummed at publish time) and kept in the browser's Cache
    //   Storage, so a returning reader synthesizes offline. Weights are
    //   OpenRAIL-M; the licence + use restrictions are linked in the UI.
    //   Engine runtime is vendored at /vendor/onnxruntime-web/ (MIT).
    //
    //   Kept from the previous build: transcript upload (.srt/.vtt/.sbv/.txt) with
    //   timed cues, offline language auto-detect, MP3/WAV download (lamejs), and
    //   the device-voice + meSpeak path for browsers that cannot run the model.
    //
    // Framework contract: doAfterPageRendered() (fires once jQuery + base script
    // load); no top-level DOM. Visible controls + status satisfy e2e G16.

    web.localUpload = false;

    var SP_SLUG = 'text-to-speech';

    // ---------- Supertonic asset locations ----------
    var ST_CDN = 'https://gh-static.freetool.online/supertonic/v3';
    var ST_CACHE = 'ftol-supertonic-v3';
    var ST_LICENSE_URL = ST_CDN + '/LICENSE';
    var ST_CREDITS_URL = ST_CDN + '/CREDITS.txt';
    var ST_MODEL_FILES = [
        { key: 'dp', file: 'onnx/duration_predictor.onnx', label: 'duration predictor' },
        { key: 'te', file: 'onnx/text_encoder.onnx', label: 'text encoder' },
        { key: 'vo', file: 'onnx/vocoder.onnx', label: 'vocoder' },
        { key: 've', file: 'onnx/vector_estimator.onnx', label: 'voice generator' }
    ];
    var ST_VOICES = [
        { id: 'M1', label: 'Male 1 (warm)' }, { id: 'M2', label: 'Male 2 (bright)' },
        { id: 'M3', label: 'Male 3' }, { id: 'M4', label: 'Male 4' }, { id: 'M5', label: 'Male 5' },
        { id: 'F1', label: 'Female 1 (warm)' }, { id: 'F2', label: 'Female 2 (bright)' },
        { id: 'F3', label: 'Female 3' }, { id: 'F4', label: 'Female 4' }, { id: 'F5', label: 'Female 5' }
    ];
    // The 31 languages the model was trained on, plus "na" (no language tag).
    var ST_LANGS = [
        ['en', 'English'], ['ar', 'Arabic'], ['bg', 'Bulgarian'], ['hr', 'Croatian'], ['cs', 'Czech'],
        ['da', 'Danish'], ['nl', 'Dutch'], ['et', 'Estonian'], ['fi', 'Finnish'], ['fr', 'French'],
        ['de', 'German'], ['el', 'Greek'], ['hi', 'Hindi'], ['hu', 'Hungarian'], ['id', 'Indonesian'],
        ['it', 'Italian'], ['ja', 'Japanese'], ['ko', 'Korean'], ['lv', 'Latvian'], ['lt', 'Lithuanian'],
        ['pl', 'Polish'], ['pt', 'Portuguese'], ['ro', 'Romanian'], ['ru', 'Russian'], ['sk', 'Slovak'],
        ['sl', 'Slovenian'], ['es', 'Spanish'], ['sv', 'Swedish'], ['tr', 'Turkish'], ['uk', 'Ukrainian'],
        ['vi', 'Vietnamese'], ['na', 'Other / no language tag']
    ];

    function spEsc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
    function spBase() { return (typeof BASE_PATH === 'string' ? BASE_PATH : ''); }
    function spMB(b) { return (b / 1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB'; }

    function spMode(slug) {
        var s = String(slug || '').toLowerCase();
        if (/speech-to-text|\btranscribe|\bdictation|voice-to-text|\bstt\b/.test(s)) return 'stt';
        if (/text-to-speech|text-to-voice|\bspeak\b|\btts\b|\bnarrat/.test(s)) return 'tts';
        return 'both';
    }

    // ---------- transcript parsing (.srt / .vtt / .sbv / plain text) ----------
    function spParseTimestamp(t) {
        // "00:00:01,000" | "00:00:01.000" | "00:01.000" | "0:00:01.000"
        var m = String(t).trim().match(/^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[,.](\d{1,3})$/);
        if (!m) return null;
        return (parseInt(m[1] || 0, 10) * 3600) + (parseInt(m[2], 10) * 60) + parseInt(m[3], 10) + (parseInt(m[4], 10) / Math.pow(10, m[4].length));
    }

    function spFmtTime(sec) {
        if (sec == null) return '--:--';
        var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
        return (h ? h + ':' + ('0' + m).slice(-2) : m) + ':' + ('0' + s).slice(-2);
    }

    function spStripCueTags(t) {
        return String(t).replace(/<[^>]+>/g, '').replace(/\{\\[^}]*\}/g, '').trim();
    }

    function spParseTranscript(name, raw) {
        var text = String(raw || '').replace(/^\ufeff/, '');
        var ext = (String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
        var cues = [];
        var arrow = /(\S+)\s+-->\s+(\S+)/;
        if (ext === 'srt' || ext === 'vtt' || /^WEBVTT/.test(text)) {
            var blocks = text.split(/\r?\n\r?\n+/);
            for (var i = 0; i < blocks.length; i++) {
                var lines = blocks[i].split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
                if (!lines.length) continue;
                if (/^WEBVTT|^NOTE|^STYLE|^REGION/.test(lines[0])) continue;
                var ti = arrow.test(lines[0]) ? 0 : (lines[1] && arrow.test(lines[1]) ? 1 : -1);
                if (ti < 0) continue;
                var tm = lines[ti].match(arrow);
                var body = spStripCueTags(lines.slice(ti + 1).join(' '));
                if (body) cues.push({ start: spParseTimestamp(tm[1]), end: spParseTimestamp(tm[2]), text: body });
            }
        } else if (ext === 'sbv') {
            var sb = text.split(/\r?\n\r?\n+/);
            for (var j = 0; j < sb.length; j++) {
                var ls = sb[j].split(/\r?\n/).filter(function (l) { return l.trim() !== ''; });
                var hm = ls.length && ls[0].match(/^(\S+)\s*,\s*(\S+)$/);
                if (!hm) continue;
                var bd = spStripCueTags(ls.slice(1).join(' '));
                if (bd) cues.push({ start: spParseTimestamp(hm[1]), end: spParseTimestamp(hm[2]), text: bd });
            }
        }
        var plain = cues.length ? cues.map(function (c) { return c.text; }).join('\n') : text.trim();
        return { plain: plain, cues: cues };
    }

    // ---------- offline language auto-detect (script + common-word heuristics) ----------
    var SP_STOPWORDS = {
        en: ['the', 'and', 'is', 'of', 'to', 'you', 'that', 'with', 'this', 'for'],
        es: ['que', 'los', 'las', 'una', 'por', 'con', 'para', 'como', 'esta', 'pero'],
        pt: ['que', 'nao', 'uma', 'com', 'por', 'para', 'mais', 'como', 'isso', 'voce'],
        fr: ['les', 'des', 'est', 'vous', 'que', 'pour', 'dans', 'une', 'avec', 'pas'],
        de: ['und', 'die', 'der', 'das', 'ist', 'nicht', 'ein', 'mit', 'sie', 'auf'],
        it: ['che', 'per', 'una', 'del', 'con', 'non', 'sono', 'della', 'questo', 'come'],
        nl: ['het', 'een', 'van', 'dat', 'niet', 'met', 'voor', 'zijn', 'maar', 'ook'],
        tr: ['bir', 'bu', 'icin', 've', 'ile', 'ama', 'gibi', 'daha', 'olarak', 'var'],
        pl: ['nie', 'jest', 'sie', 'jak', 'ale', 'czy', 'tak', 'tego', 'przez', 'jego'],
        id: ['yang', 'dan', 'ini', 'itu', 'untuk', 'dengan', 'tidak', 'dari', 'akan', 'kami'],
        cs: ['je', 'na', 'se', 'to', 'ale', 'jako', 'nebo', 'tak', 'pro', 'jsou'],
        ro: ['este', 'care', 'pentru', 'din', 'mai', 'sau', 'sunt', 'dar', 'fost', 'unei'],
        sv: ['och', 'att', 'det', 'som', 'en', 'inte', 'med', 'har', 'den', 'jag'],
        fi: ['ja', 'on', 'ei', 'joka', 'mutta', 'kun', 'niin', 'mika', 'olla', 'sen'],
        hu: ['hogy', 'nem', 'egy', 'az', 'is', 'meg', 'csak', 'volt', 'mint', 'ezt'],
        da: ['og', 'at', 'det', 'en', 'til', 'er', 'ikke', 'med', 'har', 'jeg'],
        sk: ['je', 'na', 'sa', 'to', 'ale', 'ako', 'alebo', 'pre', 'su', 'aby'],
        sl: ['je', 'in', 'za', 'na', 'se', 'ki', 'pa', 'ali', 'kot', 'bo'],
        hr: ['je', 'se', 'na', 'za', 'da', 'sto', 'ali', 'kao', 'ili', 'su'],
        lt: ['ir', 'yra', 'bet', 'kad', 'kaip', 'arba', 'tai', 'buvo', 'nes', 'jis'],
        lv: ['un', 'ir', 'bet', 'ka', 'vai', 'tas', 'no', 'uz', 'ar', 'par'],
        et: ['ja', 'on', 'ei', 'aga', 'kui', 'see', 'oli', 'kes', 'mis', 'ka']
    };

    var SP_LANG_LABELS = {};
    for (var li = 0; li < ST_LANGS.length; li++) SP_LANG_LABELS[ST_LANGS[li][0]] = ST_LANGS[li][1];
    SP_LANG_LABELS.zh = 'Chinese'; SP_LANG_LABELS.th = 'Thai'; SP_LANG_LABELS.he = 'Hebrew';

    function spDetectLang(text) {
        var t = String(text || '');
        if (!t.trim()) return null;
        if (/[\u3040-\u30ff]/.test(t)) return 'ja';
        if (/[\uac00-\ud7af]/.test(t)) return 'ko';
        if (/[\u4e00-\u9fff]/.test(t)) return 'zh';
        if (/[\u0e00-\u0e7f]/.test(t)) return 'th';
        if (/[\u0600-\u06ff]/.test(t)) return 'ar';
        if (/[\u0400-\u04ff]/.test(t)) return /[\u0454\u0456\u0457\u0491]/.test(t) ? 'uk' : 'ru';
        if (/[\u0900-\u097f]/.test(t)) return 'hi';
        if (/[\u0370-\u03ff]/.test(t)) return 'el';
        if (/[\u0590-\u05ff]/.test(t)) return 'he';
        if (/[\u0103\u00e2\u0111\u00ea\u00f4\u01a1\u01b0\u1ea0-\u1ef9]/i.test(t)) return 'vi';
        // Latin languages: score common short words
        var words = t.toLowerCase().replace(/[^a-z\u00c0-\u024f\s]/g, ' ').split(/\s+/).slice(0, 400);
        var best = 'en', bestScore = 0;
        for (var code in SP_STOPWORDS) {
            if (!SP_STOPWORDS.hasOwnProperty(code)) continue;
            var list = SP_STOPWORDS[code], score = 0;
            for (var i = 0; i < words.length; i++) { if (list.indexOf(words[i]) !== -1) score++; }
            if (score > bestScore) { bestScore = score; best = code; }
        }
        return bestScore > 0 ? best : 'en';
    }

    // A detected language the model has no tag for still gets spoken; it is sent
    // with the neutral "na" tag instead of being refused.
    function stLangTag(code) {
        for (var i = 0; i < ST_LANGS.length; i++) if (ST_LANGS[i][0] === code) return code;
        return 'na';
    }

    // ---------- audio helpers ----------
    function stWavBlob(samples, rate) {
        var n = samples.length, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
        function str(off, s) { for (var i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); }
        str(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
        str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
        dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
        str(36, 'data'); dv.setUint32(40, n * 2, true);
        var out = new Int16Array(buf, 44, n);
        for (var i = 0; i < n; i++) {
            var v = samples[i]; if (v > 1) v = 1; if (v < -1) v = -1;
            out[i] = Math.round(v * 32767);
        }
        return new Blob([buf], { type: 'audio/wav' });
    }

    function stPcm16(samples) {
        var out = new Int16Array(samples.length);
        for (var i = 0; i < samples.length; i++) {
            var v = samples[i]; if (v > 1) v = 1; if (v < -1) v = -1;
            out[i] = Math.round(v * 32767);
        }
        return out;
    }

    function spEncodeMp3(pcm16, rate) {
        var enc = new lamejs.Mp3Encoder(1, rate, 128);
        var parts = [], block = 1152;
        for (var i = 0; i < pcm16.length; i += block) {
            var d = enc.encodeBuffer(pcm16.subarray(i, i + block));
            if (d.length) parts.push(new Uint8Array(d));
        }
        var end = enc.flush();
        if (end.length) parts.push(new Uint8Array(end));
        return new Blob(parts, { type: 'audio/mpeg' });
    }

    function spLoadScript(src, cb) {
        var s = document.createElement('script');
        s.src = src; s.onload = function () { cb(true); }; s.onerror = function () { cb(false); };
        document.head.appendChild(s);
    }

    // ---------- Supertonic engine ----------
    var stEngine = {
        ort: null, ready: false, loading: false, provider: '', manifest: null,
        cfg: null, indexer: null, sessions: {}, styles: {}, sampleRate: 44100
    };

    function stSupported() {
        return typeof WebAssembly === 'object' && typeof fetch === 'function' && typeof Blob === 'function';
    }

    function stLoadOrt(cb) {
        if (stEngine.ort) return cb(true);
        spLoadScript(spBase() + '/vendor/onnxruntime-web/ort.webgpu.min.js', function (ok) {
            if (!ok || !window.ort) return cb(false);
            try {
                window.ort.env.wasm.wasmPaths = spBase() + '/vendor/onnxruntime-web/';
                // Multi-threaded WASM needs COOP/COEP headers the CDN cannot send.
                window.ort.env.wasm.numThreads = 1;
                window.ort.env.wasm.simd = true;
                window.ort.env.logLevel = 'error';
            } catch (e) { }
            stEngine.ort = window.ort;
            cb(true);
        });
    }

    // Fetch with progress + Cache Storage. Returns an ArrayBuffer.
    function stFetchAsset(rel, expectBytes, onProgress) {
        var url = ST_CDN + '/' + rel;
        function fromNetwork(cache) {
            return fetch(url, { mode: 'cors' }).then(function (res) {
                if (!res.ok) throw new Error('download failed (' + res.status + ') for ' + rel);
                if (cache) { try { cache.put(url, res.clone()); } catch (e) { } }
                var total = expectBytes || parseInt(res.headers.get('content-length') || '0', 10);
                if (!res.body || !res.body.getReader) return res.arrayBuffer();
                var reader = res.body.getReader(), chunks = [], got = 0;
                return (function pump() {
                    return reader.read().then(function (r) {
                        if (r.done) {
                            var buf = new Uint8Array(got), at = 0;
                            for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], at); at += chunks[i].length; }
                            chunks = null;
                            return buf.buffer;
                        }
                        chunks.push(r.value); got += r.value.length;
                        if (onProgress) onProgress(got, total);
                        return pump();
                    });
                })();
            });
        }
        if (typeof caches === 'undefined') return fromNetwork(null);
        return caches.open(ST_CACHE).then(function (cache) {
            return cache.match(url).then(function (hit) {
                if (hit) {
                    if (onProgress) onProgress(expectBytes || 0, expectBytes || 0);
                    return hit.arrayBuffer();
                }
                return fromNetwork(cache);
            });
        }).catch(function () { return fromNetwork(null); });
    }

    function stFetchJson(rel) {
        return stFetchAsset(rel, 0, null).then(function (buf) {
            return JSON.parse(new TextDecoder('utf-8').decode(new Uint8Array(buf)));
        });
    }

    function stManifest() {
        if (stEngine.manifest) return Promise.resolve(stEngine.manifest);
        return fetch(ST_CDN + '/manifest.json', { mode: 'cors' }).then(function (r) {
            if (!r.ok) throw new Error('the voice-model index is unreachable (' + r.status + ')');
            return r.json();
        }).then(function (m) { stEngine.manifest = m; return m; });
    }

    function stAssetBytes(manifest, file) {
        var a = (manifest && manifest.assets) || [];
        for (var i = 0; i < a.length; i++) if (a[i].file === file) return a[i].bytes;
        return 0;
    }

    // Loads every model file, then creates the four ORT sessions.
    function stLoad(onStatus) {
        if (stEngine.ready) return Promise.resolve(stEngine);
        if (stEngine.loading) return stEngine.loading;
        onStatus = onStatus || function () { };
        stEngine.loading = new Promise(function (resolve, reject) {
            if (!stSupported()) return reject(new Error('this browser cannot run WebAssembly models'));
            stLoadOrt(function (ok) {
                if (!ok) return reject(new Error('the inference engine script failed to load'));
                var ort = stEngine.ort, manifest = null;
                onStatus('Reading the voice-model index...');
                stManifest().then(function (m) {
                    manifest = m;
                    if (m && m.sample_rate) stEngine.sampleRate = m.sample_rate;
                    onStatus('Downloading the model files (' + spMB(m.core_bytes || 0) + ', one time per browser)...');
                    return stFetchJson('onnx/tts.json');
                }).then(function (cfg) {
                    stEngine.cfg = cfg;
                    return stFetchJson('onnx/unicode_indexer.json');
                }).then(function (idx) {
                    stEngine.indexer = idx;
                    var chain = Promise.resolve();
                    var doneBytes = 0;
                    var totalBytes = 0;
                    for (var i = 0; i < ST_MODEL_FILES.length; i++) totalBytes += stAssetBytes(manifest, ST_MODEL_FILES[i].file);
                    ST_MODEL_FILES.forEach(function (mf) {
                        chain = chain.then(function () {
                            var bytes = stAssetBytes(manifest, mf.file);
                            return stFetchAsset(mf.file, bytes, function (got, total) {
                                var pct = totalBytes ? Math.min(100, Math.round(((doneBytes + got) / totalBytes) * 100)) : 0;
                                onStatus('Downloading ' + mf.label + ' - ' + pct + '% of ' + spMB(totalBytes) + ' (kept in this browser afterwards)');
                            }).then(function (buf) {
                                doneBytes += bytes || buf.byteLength;
                                onStatus('Preparing the ' + mf.label + '...');
                                var opts = { graphOptimizationLevel: 'all' };
                                var tryEps = stEngine.provider ? [stEngine.provider] : ['webgpu', 'wasm'];
                                function attempt(k) {
                                    opts.executionProviders = [tryEps[k]];
                                    return ort.InferenceSession.create(buf, opts).then(function (sess) {
                                        stEngine.provider = tryEps[k];
                                        stEngine.sessions[mf.key] = sess;
                                    }, function (err) {
                                        if (k + 1 < tryEps.length) return attempt(k + 1);
                                        throw err;
                                    });
                                }
                                return attempt(0);
                            });
                        });
                    });
                    return chain;
                }).then(function () {
                    stEngine.ready = true;
                    resolve(stEngine);
                }).catch(function (err) {
                    stEngine.loading = null;
                    reject(err);
                });
            });
        });
        return stEngine.loading;
    }

    function stLoadVoice(voiceId) {
        if (stEngine.styles[voiceId]) return Promise.resolve(stEngine.styles[voiceId]);
        return stFetchJson('voice_styles/' + voiceId + '.json').then(function (js) {
            var ort = stEngine.ort;
            function tensor(node) {
                var flat = [];
                (function flatten(a) {
                    for (var i = 0; i < a.length; i++) { if (Array.isArray(a[i])) flatten(a[i]); else flat.push(a[i]); }
                })(node.data);
                return new ort.Tensor('float32', new Float32Array(flat), node.dims);
            }
            var style = { ttl: tensor(js.style_ttl), dp: tensor(js.style_dp) };
            stEngine.styles[voiceId] = style;
            return style;
        });
    }

    // ---------- text processing (mirrors the published model contract) ----------
    var ST_REPLACEMENTS = [
        ['\u2013', '-'], ['\u2011', '-'], ['\u2014', '-'], ['_', ' '],
        ['\u201c', '"'], ['\u201d', '"'], ['\u2018', "'"], ['\u2019', "'"],
        ['\u00b4', "'"], ['`', "'"], ['[', ' '], [']', ' '], ['|', ' '], ['/', ' '],
        ['#', ' '], ['\u2192', ' '], ['\u2190', ' ']
    ];

    function stNormalize(text, lang) {
        var t = String(text).normalize('NFKD');
        t = t.replace(/[\u{1F300}-\u{1FAFF}\u{1F1E6}-\u{1F1FF}\u{2600}-\u{27BF}]+/gu, '');
        for (var i = 0; i < ST_REPLACEMENTS.length; i++) t = t.split(ST_REPLACEMENTS[i][0]).join(ST_REPLACEMENTS[i][1]);
        t = t.replace(/[\u2665\u2606\u2661\u00a9\\]/g, '');
        t = t.split('@').join(' at ').split('e.g.,').join('for example, ').split('i.e.,').join('that is, ');
        t = t.replace(/ ,/g, ',').replace(/ \./g, '.').replace(/ !/g, '!').replace(/ \?/g, '?')
            .replace(/ ;/g, ';').replace(/ :/g, ':').replace(/ '/g, "'");
        while (t.indexOf('""') !== -1) t = t.replace('""', '"');
        while (t.indexOf("''") !== -1) t = t.replace("''", "'");
        t = t.replace(/\s+/g, ' ').trim();
        if (!t) return '';
        if (!/[.!?;:,'")\]}\u2026\u3002\u300d\u300f\u3011\u3009\u300b\u203a\u00bb]$/.test(t)) t += '.';
        return '<' + lang + '>' + t + '</' + lang + '>';
    }

    function stTextIds(text, lang) {
        var wrapped = stNormalize(text, lang);
        var idx = stEngine.indexer, n = wrapped.length;
        var ids = new BigInt64Array(n);
        for (var i = 0; i < n; i++) {
            var cp = wrapped.codePointAt(i);
            ids[i] = BigInt(cp < idx.length ? idx[cp] : -1);
        }
        return { ids: ids, len: n };
    }

    // Sentence-aware chunking so long input is spoken in natural pieces.
    var ST_ABBREV = ['mr.', 'mrs.', 'ms.', 'dr.', 'prof.', 'sr.', 'jr.', 'etc.', 'e.g.', 'i.e.', 'vs.', 'inc.', 'ltd.', 'co.', 'corp.', 'st.', 'ave.'];
    function stSplitSentences(paragraph) {
        var out = [], buf = '';
        var parts = paragraph.split(/([.!?\u3002])\s+/);
        for (var i = 0; i < parts.length; i += 2) {
            var piece = parts[i] + (parts[i + 1] || '');
            buf += (buf ? ' ' : '') + piece;
            var tail = buf.toLowerCase().split(/\s+/).pop();
            var isAbbrev = ST_ABBREV.indexOf(tail) !== -1 || /(^|\s)[a-z]\.$/i.test(buf);
            if (!isAbbrev) { out.push(buf.trim()); buf = ''; }
        }
        if (buf.trim()) out.push(buf.trim());
        return out.filter(function (s) { return s; });
    }

    function stChunkText(text, maxLen) {
        var chunks = [];
        var paragraphs = String(text).trim().split(/\n\s*\n+|\n/).filter(function (p) { return p.trim(); });
        for (var p = 0; p < paragraphs.length; p++) {
            var sentences = stSplitSentences(paragraphs[p].trim());
            var cur = '';
            for (var s = 0; s < sentences.length; s++) {
                var sent = sentences[s];
                if (sent.length > maxLen) {
                    if (cur) { chunks.push(cur); cur = ''; }
                    var words = sent.split(/\s+/), line = '';
                    for (var w = 0; w < words.length; w++) {
                        if ((line + ' ' + words[w]).length > maxLen && line) { chunks.push(line); line = words[w]; }
                        else line += (line ? ' ' : '') + words[w];
                    }
                    if (line) cur = line;
                    continue;
                }
                if ((cur + ' ' + sent).length <= maxLen) cur += (cur ? ' ' : '') + sent;
                else { if (cur) chunks.push(cur); cur = sent; }
            }
            if (cur) chunks.push(cur);
        }
        return chunks.length ? chunks : [String(text).trim()];
    }

    function stGaussian(n) {
        var out = new Float32Array(n);
        for (var i = 0; i < n; i++) {
            var u1 = Math.max(1e-4, Math.random()), u2 = Math.random();
            out[i] = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
        }
        return out;
    }

    // One inference pass for one chunk. Returns { wav: Float32Array, seconds }.
    function stInferChunk(text, lang, style, steps, speed, onStep) {
        var ort = stEngine.ort, cfg = stEngine.cfg, S = stEngine.sessions;
        var t = stTextIds(text, lang);
        var idsTensor = new ort.Tensor('int64', t.ids, [1, t.len]);
        var mask = new Float32Array(t.len); mask.fill(1);
        var maskTensor = new ort.Tensor('float32', mask, [1, 1, t.len]);
        var textEmb = null, seconds = 0;
        return S.dp.run({ text_ids: idsTensor, style_dp: style.dp, text_mask: maskTensor }).then(function (o) {
            seconds = Number(o.duration.data[0]) / speed;
            if (!(seconds > 0)) throw new Error('the model returned an empty duration for this text');
            return S.te.run({ text_ids: idsTensor, style_ttl: style.ttl, text_mask: maskTensor });
        }).then(function (o) {
            textEmb = o.text_emb;
            var sr = stEngine.sampleRate;
            var chunkSize = cfg.ae.base_chunk_size * cfg.ttl.chunk_compress_factor;
            var latentLen = Math.floor((Math.floor(seconds * sr) + chunkSize - 1) / chunkSize);
            var latentDim = cfg.ttl.latent_dim * cfg.ttl.chunk_compress_factor;
            var xt = stGaussian(latentDim * latentLen);
            var lMask = new Float32Array(latentLen); lMask.fill(1);
            var lMaskTensor = new ort.Tensor('float32', lMask, [1, 1, latentLen]);
            var totalTensor = new ort.Tensor('float32', new Float32Array([steps]), [1]);
            var step = 0;
            function denoise() {
                if (step >= steps) return Promise.resolve(xt);
                if (onStep) onStep(step + 1, steps);
                var cur = new ort.Tensor('float32', new Float32Array([step]), [1]);
                return S.ve.run({
                    noisy_latent: new ort.Tensor('float32', xt, [1, latentDim, latentLen]),
                    text_emb: textEmb, style_ttl: style.ttl,
                    latent_mask: lMaskTensor, text_mask: maskTensor,
                    current_step: cur, total_step: totalTensor
                }).then(function (out) {
                    xt = out.denoised_latent.data;
                    step++;
                    return denoise();
                });
            }
            return denoise().then(function (latent) {
                return S.vo.run({ latent: new ort.Tensor('float32', latent, [1, latentDim, latentLen]) });
            });
        }).then(function (o) {
            var wav = o.wav_tts.data;
            var keep = Math.min(wav.length, Math.floor(seconds * stEngine.sampleRate));
            return { wav: wav.subarray ? wav.subarray(0, keep) : wav.slice(0, keep), seconds: seconds };
        });
    }

    // Speaks a whole text: chunk -> infer -> join with a short pause.
    function stSynthesize(text, lang, voiceId, steps, speed, gapSeconds, onProgress) {
        var maxLen = (lang === 'ko' || lang === 'ja') ? 120 : 300;
        var chunks = stChunkText(text, maxLen);
        var rate = stEngine.sampleRate;
        var pieces = [], total = 0;
        return stLoadVoice(voiceId).then(function (style) {
            var chain = Promise.resolve();
            chunks.forEach(function (chunk, i) {
                chain = chain.then(function () {
                    return stInferChunk(chunk, lang, style, steps, speed, function (s, n) {
                        if (onProgress) onProgress(i + 1, chunks.length, s, n);
                    }).then(function (r) {
                        if (i > 0 && gapSeconds > 0) {
                            var sil = new Float32Array(Math.floor(gapSeconds * rate));
                            pieces.push(sil); total += sil.length;
                        }
                        pieces.push(r.wav); total += r.wav.length;
                    });
                });
            });
            return chain;
        }).then(function () {
            var out = new Float32Array(total), at = 0;
            for (var i = 0; i < pieces.length; i++) { out.set(pieces[i], at); at += pieces[i].length; }
            return { wav: out, rate: rate, chunks: chunks.length };
        });
    }

    // Builds one timeline from parsed cues: every line starts at its own timecode.
    function stSynthesizeCues(cues, lang, voiceId, steps, speed, onProgress) {
        var rate = stEngine.sampleRate;
        var rendered = [];
        return stLoadVoice(voiceId).then(function (style) {
            var chain = Promise.resolve();
            cues.forEach(function (cue, i) {
                chain = chain.then(function () {
                    return stInferChunk(cue.text, lang, style, steps, speed, function (s, n) {
                        if (onProgress) onProgress(i + 1, cues.length, s, n);
                    }).then(function (r) { rendered.push({ start: cue.start, wav: r.wav }); });
                });
            });
            return chain;
        }).then(function () {
            var end = 0;
            for (var i = 0; i < rendered.length; i++) {
                var st = Math.max(0, Math.floor((rendered[i].start || 0) * rate));
                end = Math.max(end, st + rendered[i].wav.length);
            }
            var out = new Float32Array(end);
            for (var j = 0; j < rendered.length; j++) {
                var off = Math.max(0, Math.floor((rendered[j].start || 0) * rate));
                var w = rendered[j].wav;
                for (var k = 0; k < w.length; k++) {
                    var v = out[off + k] + w[k];
                    out[off + k] = v > 1 ? 1 : (v < -1 ? -1 : v);
                }
            }
            return { wav: out, rate: rate, chunks: rendered.length };
        });
    }

    // ---------- fallback engine (device voices + meSpeak files) ----------
    var SP_MESPEAK_VOICES = { en: 'en/en-us', es: 'es', pt: 'pt', fr: 'fr', de: 'de', it: 'it', nl: 'nl', tr: 'tr', pl: 'pl', cs: 'cs', ro: 'ro', sv: 'sv', fi: 'fi', hu: 'hu', el: 'el', zh: 'zh' };
    var spEngineState = { loading: false, ready: false, voices: {} };

    function spEnsureEngine(cb) {
        if (spEngineState.ready) return cb(true);
        if (spEngineState.loading) { setTimeout(function () { spEnsureEngine(cb); }, 300); return; }
        spEngineState.loading = true;
        spLoadScript(spBase() + '/vendor/mespeak/mespeak.js', function (ok) {
            if (!ok || !window.meSpeak) { spEngineState.loading = false; return cb(false); }
            window.meSpeak.loadConfig(spBase() + '/vendor/mespeak/mespeak_config.json');
            spEngineState.ready = true; spEngineState.loading = false;
            cb(true);
        });
    }

    function spEnsureVoice(langCode, cb) {
        var vid = SP_MESPEAK_VOICES[langCode];
        if (!vid) return cb(false, null);
        if (spEngineState.voices[vid]) return cb(true, vid);
        window.meSpeak.loadVoice('voices/' + vid + '.json', function (ok) {
            if (ok) spEngineState.voices[vid] = true;
            cb(!!ok, vid);
        });
    }

    function spWavToPcm(buf) {
        var dv = new DataView(buf), rate = dv.getUint32(24, true), off = 12;
        while (off < buf.byteLength - 8) {
            var id = String.fromCharCode(dv.getUint8(off), dv.getUint8(off + 1), dv.getUint8(off + 2), dv.getUint8(off + 3));
            var size = dv.getUint32(off + 4, true);
            if (id === 'data') return { rate: rate, samples: new Int16Array(buf, off + 8, Math.floor(size / 2)) };
            off += 8 + size + (size % 2);
        }
        return null;
    }

        }

        function ensureEngine() {
            if (stEngine.ready) return Promise.resolve();

            }, function (err) {

        q('#stLoad').addEventListener('click', function () { ensureEngine().catch(function () { }); });

        function finishAudio(wav, rate, label) {
            var fmt = q('#spDlFmt').value;
            var dl = q('#spDlAudio');
            if (lastBlobUrl) { try { URL.revokeObjectURL(lastBlobUrl); } catch (e) { } }
            function publish(blob, ext) {
                lastBlobUrl = URL.createObjectURL(blob);
                player.src = lastBlobUrl; player.style.display = '';
                dl.href = lastBlobUrl; dl.download = 'text-to-speech.' + ext; dl.style.display = '';
                dl.textContent = 'Download ' + ext.toUpperCase() + ' (' + Math.round(blob.size / 1024) + ' KB)';

                try { player.play(); } catch (e) { }

            if (fmt === 'wav') { publish(stWavBlob(wav, rate), 'wav'); return; }

    function spBuildStt(root) {

            '<div id="spSttStatus" style="min-height:1.2em;color:#555;margin-top:6px;">Click Start listening and allow microphone access. Transcription runs in your browser.</div>';

        if (!SR) { status.textContent = 'This browser does not support in-browser transcription (SpeechRecognition API). Try Chrome or Safari.'; wrap.querySelector('#spRec').disabled = true; return; }
        var rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
        var finalText = '';
        rec.onresult = function (ev) {
            var interim = '';
            for (var i = ev.resultIndex; i < ev.results.length; i++) {
                var tr = ev.results[i][0].transcript;
                if (ev.results[i].isFinal) finalText += tr + ' '; else interim += tr;
            }
            ta.value = (finalText + interim).trim();
            var dl = wrap.querySelector('#spDl');
            if (ta.value) { dl.href = URL.createObjectURL(new Blob([ta.value], { type: 'text/plain' })); dl.download = 'transcript.txt'; dl.style.display = ''; }
        };
        rec.onerror = function (e) { status.textContent = 'Microphone/transcription error: ' + (e && e.error ? e.error : 'unknown') + '.'; };
        rec.onend = function () { wrap.querySelector('#spRec').disabled = false; wrap.querySelector('#spStopStt').disabled = true; status.textContent = 'Stopped.'; };
        wrap.querySelector('#spRec').addEventListener('click', function () { finalText = ta.value ? ta.value + ' ' : ''; try { rec.start(); } catch (e) { } this.disabled = true; wrap.querySelector('#spStopStt').disabled = false; status.textContent = 'Listening... speak now.'; });
        wrap.querySelector('#spStopStt').addEventListener('click', function () { rec.stop(); });
    }

    function doAfterPageRendered() {
        var root = document.getElementById('speechTool');
        if (!root) return; // not a speech page
        root.innerHTML = '';
        var mode = spMode(SP_SLUG);
        if (mode === 'tts' || mode === 'both') spBuildTts(root);
        if (mode === 'stt' || mode === 'both') spBuildStt(root);
    }
</script>

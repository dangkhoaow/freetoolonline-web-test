<script>
    // 3D scene archetype skeleton (bryce-canyon) - vendored three.js
    // (ESM, dynamic import from /vendor/three/, NO CDN), fully client-side. Built
    // LEAN from the shared t3d* skeleton - ONE scene only (bryce-canyon).
    // All geometry is procedural. places-3d cluster member, 2026-08-05.
    //
    // EDUCATIONAL APPROXIMATION, not survey geology.
    // Published figures (NPS consensus, cross-checked 2026-08-05):
    //   - Bryce Canyon National Park, southwestern Utah, USA - established 1928
    //   - Not a true canyon: a series of horseshoe-shaped amphitheaters carved
    //     into the eastern edge of the Paunsaugunt Plateau by frost-wedging and
    //     rain, not by a river
    //   - Rim elevation about 2,400-2,778 m (7,900-9,115 ft)
    //   - Thousands of hoodoos (irregular rock spires), typically 1.5-45 m tall
    //   - Carved from the Claron Formation - pink, orange, and white limestone
    //     and siltstone, deposited about 30-40 million years ago
    //   - Thor's Hammer is the park's most famous single hoodoo (a boulder
    //     capstone balanced on a narrower spire)
    //
    // Framework contract: bootstrap in doAfterPageRendered(). No top-level DOM.

    web.localUpload = false;

    var T3D_SLUG = 'bryce-canyon';
    var T3D_STORE_KEY = 'ftol-game-' + T3D_SLUG;

    function t3dDetectScene(slug) { return 'placesbrycecanyon'; }

    function ftoLoadThree() {
        if (window.__ftoThreePromise) { return window.__ftoThreePromise; }
        var base = (typeof BASE_PATH === 'string' ? BASE_PATH : '') + '/vendor/three';
        window.__ftoThreePromise = import(base + '/three.module.min.js').then(function (mod) {
            if (!mod || !mod.WebGLRenderer) { throw new Error('three.js loaded but WebGLRenderer is missing'); }
            return mod;
        });
        return window.__ftoThreePromise;
    }

    function t3dStatus(text) {
        var el = document.getElementById('t3dStatus');
        if (el) el.textContent = text;
    }
    function t3dInfo(html) {
        var el = document.getElementById('t3dInfoPanel');
        if (el) el.innerHTML = html;
    }
    function t3dLoadStore() {
        try { return JSON.parse(localStorage.getItem(T3D_STORE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function t3dSaveStore(obj) {
        try { localStorage.setItem(T3D_STORE_KEY, JSON.stringify(obj)); }
        catch (e) { t3dStatus('Could not save to browser storage (quota or private mode) - explorer still works.'); }
    }
    function t3dFullscreen(el) {
        if (el.requestFullscreen) { el.requestFullscreen(); }
        else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
        else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
        else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
    }

    function t3dShell(THREE, host, opts) {
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var low = coarse || ((navigator.hardwareConcurrency || 4) <= 4);
        var renderer = new THREE.WebGLRenderer({ antialias: !low, powerPreference: 'default' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(opts.fov || 55, 1, 0.1, 4000);
        var orbit = {
            target: new THREE.Vector3(0, opts.targetY || 0, 0),
            radius: opts.radius, theta: opts.theta || 0.6, phi: opts.phi || 1.15,
            goalRadius: opts.radius, goalTheta: opts.theta || 0.6, goalPhi: opts.phi || 1.15,
            minR: opts.minR || 4, maxR: opts.maxR || 400,
        };
        function applyCamera() {
            orbit.theta += (orbit.goalTheta - orbit.theta) * 0.14;
            orbit.phi += (orbit.goalPhi - orbit.phi) * 0.14;
            orbit.radius += (orbit.goalRadius - orbit.radius) * 0.14;
            var sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
            camera.position.set(
                orbit.target.x + orbit.radius * sp * Math.sin(orbit.theta),
                orbit.target.y + orbit.radius * cp,
                orbit.target.z + orbit.radius * sp * Math.cos(orbit.theta)
            );
            camera.lookAt(orbit.target);
        }
        host.innerHTML = '';
        host.appendChild(renderer.domElement);
        function resize() {
            var w = host.clientWidth || 320, h = Math.max(220, Math.round(w * 0.62));
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);
        // Render-quality contract (2026-07-22): window.resize alone misses late
        // CSS/ad-rail layout shifts - observe the host itself.
        if (typeof ResizeObserver === 'function') { new ResizeObserver(resize).observe(host); }
        var dragging = false, lastX = 0, lastY = 0;
        host.addEventListener('pointerdown', function (e) {
            dragging = true; lastX = e.clientX; lastY = e.clientY;
            try { host.setPointerCapture(e.pointerId); } catch (err) {}
        });
        host.addEventListener('pointerup', function () { dragging = false; });
        host.addEventListener('pointercancel', function () { dragging = false; });
        host.addEventListener('pointermove', function (e) {
            if (!dragging) return;
            var dx = e.clientX - lastX, dy = e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            orbit.goalTheta -= dx * 0.005;
            orbit.goalPhi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.goalPhi + dy * 0.005));
        });
        host.addEventListener('wheel', function (e) {
            e.preventDefault();
            orbit.goalRadius = Math.max(orbit.minR, Math.min(orbit.maxR, orbit.goalRadius * (e.deltaY > 0 ? 1.08 : 0.92)));
        }, { passive: false });
        return { THREE: THREE, scene: scene, camera: camera, renderer: renderer, orbit: orbit, applyCamera: applyCamera, low: low, resize: resize };
    }

    function t3dScene(shell) {
        var THREE = shell.THREE, scene = shell.scene;
        shell.renderer.setClearColor(0x1a1210, 1);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        var key = new THREE.DirectionalLight(0xffe0c0, 1.0);
        key.position.set(-10, 20, 10);
        scene.add(key);

        function hash2(x, z) { var s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
        function vnoise(x, z) {
            var xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
            var u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
            var a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
            return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, z, oct) { var s = 0, amp = 0.5, f = 1; for (var i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; } return s; }
        function makeTerrain(W, D, segW, segD, heightFn, colorFn) {
            var geo = new THREE.PlaneGeometry(W, D, segW, segD);
            geo.rotateX(-Math.PI / 2);
            var pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), col = new THREE.Color();
            for (var i = 0; i < pos.count; i++) {
                var x = pos.getX(i), z = pos.getZ(i);
                var h = heightFn(x, z);
                pos.setY(i, h);
                colorFn(col, h, x, z);
                colors[i * 3] = col.r; colors[i * 3 + 1] = col.g; colors[i * 3 + 2] = col.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 }));
        }

        // Amphitheater relief, 1 unit = ~250 m vertical. A horseshoe bowl carved
        // into the plateau rim, densely packed with hoodoo spires that fade out
        // toward the rim wall and toward the open (south) mouth of the bowl.
        var RIM = 2.2, DEPTH = 1.15;
        var BCX = 0, BCZ = 0, RX = 6.2, RZ = 5.6;
        function bowlR(x, z) { return Math.hypot((x - BCX) / RX, (z - BCZ) / RZ); }
        function basinFactor(x, z) {
            var b = Math.max(0, 1 - bowlR(x, z));
            return Math.pow(b, 1.1);
        }
        var HOODOO_CELL = 0.85;
        function hoodooBump(x, z) {
            var maxB = 0;
            var cx0 = Math.floor(x / HOODOO_CELL), cz0 = Math.floor(z / HOODOO_CELL);
            for (var i = -1; i <= 1; i++) {
                for (var j = -1; j <= 1; j++) {
                    var cx = cx0 + i, cz = cz0 + j;
                    var pres = hash2(cx * 5.5 + 1.3, cz * 4.4 + 2.1);
                    if (pres < 0.08) continue; // dense field - skip only ~8% of cells
                    var px = (cx + 0.15 + 0.7 * hash2(cx * 3.1, cz * 7.7)) * HOODOO_CELL;
                    var pz = (cz + 0.15 + 0.7 * hash2(cx * 9.3, cz * 2.1)) * HOODOO_CELL;
                    var footprint = 0.16 + 0.14 * hash2(cx * 2.2, cz * 6.6);
                    var peak = 0.45 + 0.55 * hash2(cx * 8.8, cz * 1.3);
                    var d = Math.hypot(x - px, z - pz);
                    var t = 1 - d / footprint;
                    if (t <= 0) continue;
                    var b = peak * Math.pow(t, 1.5);
                    if (b > maxB) maxB = b;
                }
            }
            return maxB;
        }
        function height(x, z) {
            var basin = basinFactor(x, z);
            var floor = RIM - DEPTH * basin;
            var hoodoo = hoodooBump(x, z) * basin;
            var h = floor + hoodoo;
            h += 0.05 * (fbm(x * 0.5 + 3, z * 0.5 + 9, 3) - 0.5);
            return Math.min(h, RIM + 0.04);
        }
        // Claron Formation banding: rose-pink near the bowl floor grading up
        // through orange and pale pink to cream/white near the rim. Mapped to
        // the FULL floor-to-rim range so hoodoo tips read as distinct pale caps
        // instead of washing into the same band as the surrounding plateau.
        var BANDS = [
            [0.00, 0xb85c52], // deep rose (bowl floor)
            [0.18, 0xc9714f], // burnt orange
            [0.34, 0xd98a4f], // orange
            [0.52, 0xe0ac83], // salmon-pink
            [0.70, 0xe8d3ad], // pale cream
            [0.85, 0xefe6d0]  // near-white hoodoo caps / rim
        ];
        var normColors = null, accentColors = null, terrain;
        function bandColor(c, h, x, z, accent) {
            var n = 0.9 + 0.2 * fbm(x * 1.5 + 6, z * 1.5 + 4, 3);
            var u = Math.max(0, Math.min(1, (h - (RIM - DEPTH)) / DEPTH));
            var hex = BANDS[BANDS.length - 1][1];
            for (var i = BANDS.length - 1; i >= 0; i--) { if (u >= BANDS[i][0]) { hex = BANDS[i][1]; break; } }
            c.setHex(hex);
            if (accent) c.offsetHSL(0.01, 0.22, 0.05);
            c.multiplyScalar(n);
        }
        function build(accent) {
            var pos = terrain.geometry.attributes.position, col = new THREE.Color();
            var arr = new Float32Array(pos.count * 3);
            for (var i = 0; i < pos.count; i++) {
                bandColor(col, pos.getY(i), pos.getX(i), pos.getZ(i), accent);
                arr[i * 3] = col.r; arr[i * 3 + 1] = col.g; arr[i * 3 + 2] = col.b;
            }
            return arr;
        }
        terrain = makeTerrain(15, 14, shell.low ? 130 : 190, shell.low ? 122 : 178, height, function (c, h, x, z) { bandColor(c, h, x, z, false); });
        scene.add(terrain);
        normColors = terrain.geometry.attributes.color.array.slice();
        accentColors = build(true);

        // Thor's Hammer marker: sample the built terrain for the tallest hoodoo
        // near the bowl center and mark it - the park's most famous single spire.
        var hammerX = 0, hammerZ = 0, hammerH = -999;
        for (var sx = -4; sx <= 4; sx += 0.2) {
            for (var sz = -4; sz <= 4; sz += 0.2) {
                if (basinFactor(sx, sz) < 0.35) continue;
                var hh = height(sx, sz);
                if (hh > hammerH) { hammerH = hh; hammerX = sx; hammerZ = sz; }
            }
        }
        var hammer = new THREE.Group();
        var hammerBase = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.5, 10), new THREE.MeshStandardMaterial({ color: 0xd98a4f, roughness: 0.85 }));
        hammerBase.position.set(hammerX, hammerH + 0.25, hammerZ);
        var hammerCap = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshStandardMaterial({ color: 0xefe6d0, roughness: 0.7 }));
        hammerCap.position.set(hammerX, hammerH + 0.52, hammerZ);
        var hammerRing = new THREE.Mesh(new THREE.RingGeometry(0.24, 0.32, 24), new THREE.MeshStandardMaterial({ color: 0xe8c5c9, side: THREE.DoubleSide }));
        hammerRing.rotation.x = -Math.PI / 2;
        hammerRing.position.set(hammerX, hammerH + 0.02, hammerZ);
        hammer.add(hammerBase, hammerCap, hammerRing);
        scene.add(hammer);

        var accentOn = false, hammerOn = true;

        function panelHtml() {
            return '<h3>Bryce Canyon: an amphitheater of hoodoos</h3>' +
                '<p>A relief of one Bryce Canyon amphitheater: a horseshoe bowl carved into the Paunsaugunt Plateau rim, densely packed with hoodoo spires banded from rose-pink at the floor to cream near the rim.</p>' +
                '<table class="w3-table w3-bordered">' +
                '<tr><td>Established</td><td>1928, as Bryce Canyon National Park, Utah, USA</td></tr>' +
                '<tr><td>Rim elevation</td><td>about 2,400-2,778 m (7,900-9,115 ft)</td></tr>' +
                '<tr><td>Hoodoo height</td><td>typically 1.5-45 m tall</td></tr>' +
                '<tr><td>Rock</td><td>Claron Formation - pink, orange, and white limestone, about 30-40 million years old</td></tr>' +
                '<tr><td>Carved by</td><td>frost-wedging and rain, not a river - it is not a true canyon</td></tr>' +
                '<tr><td>Famous hoodoo</td><td>Thor\'s Hammer - a capstone boulder balanced on a narrower spire</td></tr>' +
                '</table>' +
                '<p class="t3d-note">Educational relief approximation - hoodoo placement, spacing, and color bands are procedural teaching cues, not a survey of the actual formations.</p>';
        }

        function apply() {
            terrain.geometry.attributes.color.array.set(accentOn ? accentColors : normColors);
            terrain.geometry.attributes.color.needsUpdate = true;
            hammer.visible = hammerOn;
            var bb = document.getElementById('t3dPbcBandingBtn');
            if (bb) bb.textContent = 'Color banding: ' + (accentOn ? 'Vivid' : 'Natural');
            var hb = document.getElementById('t3dPbcHammerBtn');
            if (hb) hb.textContent = "Thor's Hammer marker: " + (hammerOn ? 'On' : 'Off');
            t3dInfo(panelHtml());
            try { t3dSaveStore({ accentOn: accentOn, hammerOn: hammerOn }); } catch (e) {}
        }

        var store = t3dLoadStore();
        if (typeof store.accentOn === 'boolean') accentOn = store.accentOn;
        if (typeof store.hammerOn === 'boolean') hammerOn = store.hammerOn;
        apply();

        var bandingBtn = document.getElementById('t3dPbcBandingBtn');
        if (bandingBtn) bandingBtn.addEventListener('click', function () { accentOn = !accentOn; apply(); });
        var hammerBtn = document.getElementById('t3dPbcHammerBtn');
        if (hammerBtn) hammerBtn.addEventListener('click', function () { hammerOn = !hammerOn; apply(); });

        t3dStatus('Drag to orbit, scroll to zoom. Toggle color banding or the Thor\'s Hammer marker.');
        return function animate(dt) {
            scene.rotation.y += dt * 0.00004;
        };
    }

    function doAfterPageRendered() {
        var host = document.getElementById('t3dCanvasHost');
        var root = document.getElementById('threeSceneTool');
        if (!host || !root) return;
        var wrapper = document.getElementById('t3dWrapper') || root;
        var kind = t3dDetectScene(T3D_SLUG);
        var rows = { placesbrycecanyon: 't3dPbcControls' };
        for (var k in rows) {
            var el = document.getElementById(rows[k]);
            if (el) el.style.display = (k === kind) ? '' : 'none';
        }
        var fsBtn = document.getElementById('t3dFullscreenBtn');
        if (fsBtn) fsBtn.addEventListener('click', function () { t3dFullscreen(wrapper); });
        t3dStatus('Loading the 3D engine (about 0.7 MB, one time - then cached)...');
        function boot() {
            ftoLoadThree().then(function (THREE) {
                try {
                    var presets = { placesbrycecanyon: { radius: 12, maxR: 35, minR: 5, phi: 0.85, theta: 0.5, targetY: 0.7 } };
                    var shell = t3dShell(THREE, host, presets[kind]);
                    var animate = t3dScene(shell);
                    var last = performance.now();
                    shell.renderer.setAnimationLoop(function () {
                        var now = performance.now();
                        var dt = Math.min(now - last, 100);
                        last = now;
                        animate(dt);
                        shell.applyCamera();
                        shell.renderer.render(shell.scene, shell.camera);
                    });
                } catch (err) {
                    t3dStatus('This page needs WebGL to render the 3D scene. Your browser or device has it disabled - the facts panel below still works. (' + (err && err.message ? err.message : err) + ')');
                }
            }).catch(function (err) {
                t3dStatus('Could not load the 3D engine: ' + (err && err.message ? err.message : err));
            });
        }
        if ('requestIdleCallback' in window) { requestIdleCallback(boot, { timeout: 2500 }); }
        else { setTimeout(boot, 300); }
    }
</script>

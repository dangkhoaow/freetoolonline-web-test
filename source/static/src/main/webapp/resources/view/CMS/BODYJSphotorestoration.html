<script>
    // In-browser AI photo restoration - Transformers.js v4 + ONNX Runtime Web.
    // RESTORATION ONLY: Xenova/swin2SR image-to-image denoise/deblock/upscale of a
    // compressed or blurry photo (2x and 4x variants in AI_SCALE_MODELS below).
    // The archetype's background-remover mode branch was DEAD CODE on this page
    // (the slug is fixed at photo-restoration, so the mode dispatch could never
    // pick it) and was removed 2026-09-03 together with the briaai/RMBG-1.4
    // reference it carried (BRIA non-commercial weight licence - not usable on an
    // ad-supported site; ai-local DEBT 4). Background removal lives at
    // /image-tools/background-remover.html (Xenova/modnet, Apache-2.0).
    // 100% client-side: the IMAGE never leaves the browser; only the model weights
    // download once from the Hugging Face hub and are cached in IndexedDB (offline
    // afterwards). WebGPU is used when available, else the WASM CPU backend.
    // Registry Gate-H entry: ai_image_restoration_transformersjs.
    //
    // RESTORATION MODE - verified in a real headless-Chromium browser (WASM path;
    // new-tool-discovery-loop, 2026-07-17) before this skeleton was authored, per
    // CLAUDE.md root-cause-discipline (isolation test before claiming a fix):
    // Xenova/swin2SR-compressed-sr-x4-48 genuinely denoises/deblocks + 4x-upscales a
    // JPEG-compression-degraded synthetic photo (crisp text/edges, no blocking
    // artifacts in the output) - confirms the model is NOT a no-op/garbage output.
    // 2X UPSCALE MODE (ai-local fire22, 2026-08-23) - Gate-H probe-verified in
    // headless Chromium under the EXACT pin @huggingface/transformers@4.2.0
    // (artifact seo-reports/20260823-ailocal-fire22/qa/): Xenova/swin2SR-lightweight-
    // x2-64 (8.1 MB fp32) 2x-upscales a 120x90 input in ~4s WASM; the 4x model was
    // RE-verified under the same pin (~24s WASM on the same input). PROBE FINDING,
    // both scales: swin2SR pads the input to a multiple of its 8px window and
    // returns the upscaled PADDED frame - the output MUST be cropped to exactly
    // scale*input, otherwise non-multiple-of-8 photos show junk padding rows
    // (live defect on the previous 4x-only build, fixed by aiCropDims below).
    // TRUTHFULNESS SCOPE (load-bearing - do not widen without re-verifying): these
    // are FIXED 2x/4x super-resolution networks. They do NOT remove scratches,
    // tears, stains, or repair physical damage, and they do NOT colorize. The
    // tool-skill claim catalogue + all reader copy MUST describe the 4x model as
    // "sharpens, denoises, and upscales 4x a blurry or compressed photo" and the
    // 2x model as "a quick 2x upscale" - never "repairs damage" or "fixes
    // scratches". Inference is SLOW on WASM (measured ~55-70s for a 256x192 input
    // on a software-rendered CPU path with no WebGPU; the 2x model is roughly 6x
    // faster on the same input; real end-user GPUs with WebGPU should be
    // substantially faster) - the input is capped to a 512px long edge before
    // inference (AI_RESTORE_MAX_EDGE) specifically so a full-resolution real photo
    // does not push WASM inference past a couple of minutes; the status text sets
    // that expectation honestly instead of guessing.
    //
    // HONEST NOTES (operator): (1) first run downloads the swin2SR model weights
    // once (real sizes stated in the UI before the download starts; cached
    // afterwards); (2) Transformers.js is loaded via ESM dynamic import from a CDN -
    // if the site CSP blocks it, self-host @huggingface/transformers under
    // /vendor/transformers/ and point TF_CDN at it; (3) headless e2e may not exercise
    // the full model run (the input preview still renders visible output for G16).
    // Framework contract: doAfterPageRendered(); no top-level DOM. Plain
    // <input type=file>, no upload widget.

    web.localUpload = false;

    var AI_RESTORE_MAX_EDGE = 512;

    // ESM entry for Transformers.js, pinned to the EXACT probed version (HARD
    // GUARD 5: a floating specifier breaks shipped pages with no commit and no
    // deploy). Bumping this pin requires re-running the fire22 Gate-H probe for
    // BOTH swin2SR scales. Self-host + repoint here to remove the CDN dependency:
    // '/vendor/transformers/transformers.min.js'.
    var TF_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

    // Per-scale swin2SR models, both Gate-H probe-verified (fire22). Sizes are the
    // real fp32 onnx bytes from the HF hub, stated in the UI BEFORE any download.
    var AI_SCALE_MODELS = {
        2: { id: 'Xenova/swin2SR-lightweight-x2-64', mb: 8, label: 'Quick upscale 2x' },
        4: { id: 'Xenova/swin2SR-compressed-sr-x4-48', mb: 55, label: 'Restore & upscale 4x' }
    };

    var aiModelPromises = {};
    function aiLoadModel(setStatus, scale) {
        var key = 'restore:' + scale;
        if (aiModelPromises[key]) return aiModelPromises[key];
        aiModelPromises[key] = (async function () {
            var tf = await import(/* webpackIgnore: true */ TF_CDN);
            // Prefer WebGPU; fall back to WASM automatically inside ORT.
            var device = ('gpu' in navigator) ? 'webgpu' : 'wasm';
            var spec = AI_SCALE_MODELS[scale] || AI_SCALE_MODELS[4];
            setStatus('Downloading the ~' + spec.mb + ' MB ' + spec.label + ' model (first run only, cached offline afterwards) ...');
            var restorer = await tf.pipeline('image-to-image', spec.id, { device: device, dtype: 'fp32' });
            return { tf: tf, restorer: restorer, RawImage: tf.RawImage, device: device };
        })();
        return aiModelPromises[key];
    }

    function doAfterPageRendered() {
        var root = document.getElementById('aiImageTool');
        if (!root) return; // not an ai-image page
        var runLabel = 'Restore & upscale 4x';
        var introText = 'Choose a blurry or compressed photo. Your image never leaves your browser - it is processed locally.';
        var scalePicker =
            '<div class="w3-row" style="margin:6px 0;text-align:center;">' +
            '<label style="margin-right:16px;"><input type="radio" name="aiScale" value="4" checked> Restore &amp; upscale 4x - deblurs and removes JPEG artifacts (~55 MB model, slower)</label>' +
            '<label><input type="radio" name="aiScale" value="2"> Quick upscale 2x (~8 MB model, much faster)</label></div>';
        root.innerHTML =
            '<div class="w3-row" style="margin-bottom:8px;"><input type="file" id="aiFile" accept="image/*" class="w3-input w3-border" style="max-width:420px;margin:0 auto;"></div>' +
            scalePicker +
            '<div id="aiStatus" style="min-height:1.2em;margin:6px 0;color:#555;">' + introText + '</div>' +
            '<div class="w3-row"><canvas id="aiCanvas" class="outputImgs" style="visibility:visible !important;max-width:90vw;border:1px solid #ddd;background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 50%/20px 20px;"></canvas></div>' +
            '<div style="margin-top:8px;"><button id="aiRun" type="button" class="w3-button w3-green w3-large" disabled>' + runLabel + '</button> ' +
            '<a id="aiDownload" class="w3-button w3-blue" style="display:none;">Download PNG</a></div>' +
            '<div id="aiErr" style="color:#b00020;margin-top:6px;min-height:1em;"></div>';
        var fileEl = root.querySelector('#aiFile'), canvas = root.querySelector('#aiCanvas'), ctx = canvas.getContext('2d');
        var runBtn = root.querySelector('#aiRun'), dl = root.querySelector('#aiDownload');
        var statusEl = root.querySelector('#aiStatus'), errEl = root.querySelector('#aiErr');
        var currentURL = null;
        function setStatus(m) { statusEl.textContent = m; }
        function setErr(m) { errEl.textContent = m || ''; }
        function aiPickedScale() {
            var el = root.querySelector('input[name=aiScale]:checked');
            return el ? parseInt(el.value, 10) : 4;
        }
        root.querySelectorAll('input[name=aiScale]').forEach(function (r) {
            r.addEventListener('change', function () {
                runBtn.textContent = AI_SCALE_MODELS[aiPickedScale()].label;
            });
        });

        // Preview on select (immediate visible output; no model needed yet -> G16).
        fileEl.addEventListener('change', function () {
            setErr(''); if (dl) { dl.style.display = 'none'; }
            var f = fileEl.files && fileEl.files[0]; if (!f) return;
            if (currentURL) URL.revokeObjectURL(currentURL);
            currentURL = URL.createObjectURL(f);
            var img = new Image();
            img.onload = function () {
                canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0);
                runBtn.disabled = false;
                setStatus('Preview ready. Click "' + runBtn.textContent + '" to process it locally (can take up to a minute on the first run while the model warms up).');
            };
            img.onerror = function () { setErr('Could not read that image.'); };
            img.src = currentURL;
        });

        // Downscale the source image so its longest edge <= maxEdge, returning a
        // data URL. Keeps WASM restoration inference bounded for large real photos
        // (the model itself always outputs 4x the INPUT it is given).
        function aiResizeToDataUrl(sourceImg, maxEdge) {
            var w = sourceImg.naturalWidth || sourceImg.width, h = sourceImg.naturalHeight || sourceImg.height;
            var scale = Math.min(1, maxEdge / Math.max(w, h));
            var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
            var tmpCanvas = document.createElement('canvas');
            tmpCanvas.width = tw; tmpCanvas.height = th;
            tmpCanvas.getContext('2d').drawImage(sourceImg, 0, 0, tw, th);
            return { dataUrl: tmpCanvas.toDataURL('image/png'), resized: scale < 1 };
        }

        runBtn.addEventListener('click', async function () {
            if (!currentURL) { setErr('Choose an image first.'); return; }
            setErr(''); runBtn.disabled = true;
            try {
                var scale = aiPickedScale();
                var m = await aiLoadModel(setStatus, scale);
                var srcImg = new Image(); srcImg.src = currentURL;
                await new Promise(function (r) { srcImg.onload = r; });
                var resizeInfo = aiResizeToDataUrl(srcImg, AI_RESTORE_MAX_EDGE);
                setStatus((scale === 2 ? 'Upscaling 2x in your browser' : 'Restoring and upscaling 4x in your browser') + (m.device === 'wasm' ? ' (no WebGPU here, so this can take up to a minute)' : '') + ' ...' + (resizeInfo.resized ? ' (large photo resized before processing)' : ''));
                var inputImage = await m.RawImage.fromURL(resizeInfo.dataUrl);
                var output = await m.restorer(inputImage);
                var resultImg = Array.isArray(output) ? output[0] : output;
                // swin2SR pads the input to a multiple of its 8px window and
                // returns the upscaled PADDED frame - crop to exactly
                // scale*input so no junk padding rows/columns are shown
                // (fire22 Gate-H probe finding).
                var wantW = Math.min(resultImg.width, inputImage.width * scale);
                var wantH = Math.min(resultImg.height, inputImage.height * scale);
                var full = document.createElement('canvas');
                full.width = resultImg.width; full.height = resultImg.height;
                var n = resultImg.width * resultImg.height;
                var rgba = new Uint8ClampedArray(n * 4);
                for (var i = 0; i < n; i++) {
                    for (var c = 0; c < resultImg.channels; c++) rgba[i * 4 + Math.min(c, 2)] = resultImg.data[i * resultImg.channels + c];
                    if (resultImg.channels < 3) { rgba[i * 4 + 1] = rgba[i * 4]; rgba[i * 4 + 2] = rgba[i * 4]; }
                    rgba[i * 4 + 3] = 255;
                }
                full.getContext('2d').putImageData(new ImageData(rgba, resultImg.width, resultImg.height), 0, 0);
                canvas.width = wantW; canvas.height = wantH;
                ctx.clearRect(0, 0, wantW, wantH);
                ctx.drawImage(full, 0, 0, wantW, wantH, 0, 0, wantW, wantH);
                canvas.toBlob(function (blob) {
                    var u = URL.createObjectURL(blob);
                    dl.href = u; dl.download = scale === 2 ? 'upscaled-photo-2x.png' : 'restored-photo.png'; dl.style.display = '';
                }, 'image/png');
                setStatus(scale === 2 ? 'Done - upscaled 2x locally, no upload.' : 'Done - sharpened, denoised, and upscaled 4x locally, no upload.');
            } catch (e) {
                setErr('Could not run the AI model: ' + (e && e.message ? e.message : String(e)) + '. (If the model failed to load, the site may need Transformers.js self-hosted under /vendor/transformers/.)');
            } finally { runBtn.disabled = false; }
        });
    }
</script>

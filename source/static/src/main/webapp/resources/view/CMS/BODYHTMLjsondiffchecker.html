<div class="w3-container">
    <p>Paste two JSON texts below and click Compare to see every added, removed, or changed key highlighted - all in your browser with no upload.</p>
</div>

<div id="jsonDiffApp" class="w3-container" style="opacity:1">
    <div class="w3-row" style="margin-bottom:8px">
        <div class="w3-col m6" style="padding-right:6px">
            <label class="w3-text-grey" style="font-weight:600;font-size:0.95em">Original JSON</label>
            <textarea id="jdLeftInput" class="w3-input w3-border" spellcheck="false"
                style="width:100%;height:220px;font-family:monospace;font-size:0.85em;resize:vertical;margin-top:4px"
                placeholder='{"key": "value"}'></textarea>
        </div>
        <div class="w3-col m6" style="padding-left:6px">
            <label class="w3-text-grey" style="font-weight:600;font-size:0.95em">Modified JSON</label>
            <textarea id="jdRightInput" class="w3-input w3-border" spellcheck="false"
                style="width:100%;height:220px;font-family:monospace;font-size:0.85em;resize:vertical;margin-top:4px"
                placeholder='{"key": "updated"}'></textarea>
        </div>
    </div>
    <div style="margin-bottom:12px">
        <button id="jdCompareBtn" type="button" class="w3-button w3-red" style="margin-right:8px">Compare</button>
        <button id="jdClearBtn" type="button" class="w3-button w3-light-grey">Clear</button>
        <button id="jdCopyBtn" type="button" class="w3-button w3-light-grey" style="margin-left:8px;display:none">Copy Diff</button>
    </div>
    <div id="jdOutput" style="display:none">
        <div id="jdSummary" class="w3-panel w3-pale-green" style="padding:8px 12px;margin-bottom:8px;border-radius:4px;display:none"></div>
        <div id="jdError" class="w3-panel w3-pale-red" style="padding:8px 12px;margin-bottom:8px;border-radius:4px;display:none"></div>
        <div id="jdTable" style="overflow-x:auto"></div>
    </div>
</div>

<style>
	/* In-content banner slot. Sizes mirror the top banner's so that any page that
	 * opts this slot in gets the same 970/728/320 responsive widths, with the
	 * height reserved before fill so a filled slot causes no layout shift.
	 * The slot is hidden by default (see the .in-content-ad rule below). */
	.adslot_2 {
	    max-width: 100%;
	    width: 970px;
	    height: 90px;
	}

	@media(max-width: 970px) {
	    .adslot_2 {
			width: 728px;
	    }
	}

	@media(max-width: 728px) {
	    .adslot_2 {
			width: 320px;
			height: 100px;
	    }
	}

	@media(max-width: 1000px) {
		.adslot_2 {
		    display: none;
		}
	}

	/* Default: this slot does not render. Hidden here rather than via the
	 * container's former inline attribute so that per-page stylesheets can still
	 * opt in with a higher-specificity rule. Rationale and measurements are kept
	 * out of this file because everything in this block is served to readers on
	 * every page - see the commit message and the rpm-sprint ledger instead. */
	.ad-section.in-content-ad {
		display: none !important;
		margin: 18px 0 6px;
	}

	/* Collapse when ads are disabled (staging, ad blocker, `disableAd` cookie or
	 * `?noads=1`) so no empty band is reserved - mirrors the top-ad rule. The
	 * server emits `html.ads-disabled` initially and
	 * extended-body-content.html:71 removes it for opted-in visitors before the
	 * `.adsbygoogle:visible` gate at :132 runs. */
	html.ads-disabled .ad-section.in-content-ad,
	.qa-noads .ad-section.in-content-ad {
		display: none !important;
	}
</style>
<div class='w3-row ad-section in-content-ad' align="center">
	<!-- Responsive-ad-unit-in-content (desktop >= 1001px) -->
	<!-- 2026-08-30 fill-rate fix (open item B5, safe half) - same rationale and
	 * same CLS guarantee as the top banner: .adslot_2 above reserves width and
	 * height per breakpoint before fill, and full-width-responsive is pinned
	 * FALSE. Note this slot is display:none by default and only renders where a
	 * per-page stylesheet opts in, so the attribute has no effect until then.
	 -->
	<ins class="adsbygoogle adslot_2"
	     data-ad-client="ca-pub-2317460280557760"
	     data-ad-slot="2306818547"
	     data-ad-format="auto"
	     data-full-width-responsive="false"></ins>
</div>

<style>
	footer.page-footer .footer-inner {
	    max-width: 1240px!important;
	}

	/* QA mode (`?noads=1`): keep layout deterministic and footer aligned to content column. */
	.qa-noads .ad-section {
		display: none !important;
	}

	.ad-panel {
		margin-bottom: 0;
		width: 160px;
		min-height: 600px;
		box-shadow: none;
		-webkit-box-shadow: none;
		background-color: rgba(255,255,255,0);
	}

	/* cycle-14e ROOT-CAUSE fix - when ads are disabled (ad blocker, staging,
	 * or AdSense fails to fill the slot), the empty 160 x 600 reservation of
	 * .ad-panel inside the .w3-row that also contains <main.page-main-content>
	 * causes the main content to render 600 px below the top nav (block-level
	 * children of main effectively "wrap around" the right-floated empty
	 * slot). Forcing example: cycle-14d on /md5-converter.html and
	 * /camera-test.html - main content y = 624; removing the empty .ad-panel
	 * via DevTools moves main content y -> 24. The cycle-14a..d PAGESTYLE
	 * margin-top overrides were workarounds for this same defect.
	 *
	 * The fix: hide the empty ad-panel when html.ads-disabled is set
	 * (server-emitted in page-renderer.mjs:1111 and JS-toggled by
	 * module-loader.js based on whether AdSense fills any visible slot).
	 */
	html.ads-disabled .ad-panel {
		display: none !important;
	}

	.w3-right.ad-section.ad-panel {
		margin-right: 10px;
	}

	.w3-left.ad-section.ad-panel {
		margin-left: 10px;
	}

	@media (min-width: 1001px) {
		#content.w3-content {
			overflow: unset;
		}

		.w3-left.ad-section.ad-panel, .w3-right.ad-section.ad-panel {
			position: sticky;
			top: 50px;
		}
	}

	.ad-panel .adslot_1 {
		height: 600px;
		width: 160px
	}
	@media(max-width: 1365px) {
		.w3-left.ad-section.ad-panel {
		    display: none !important;
		}
	}
	@media(max-width: 1000px) {
		.ad-panel {
		    display: none;
		}
	}
</style>
<div class="w3-col w3-left ad-section ad-panel w3-hide-small" align="right">
	<!-- Responsive-ad-left -->
	<!-- 2026-08-30 fill-rate fix (open item B5, safe half). Without data-ad-format
	 * the slot only ever requests its ONE configured size (160x600). When no
	 * 160x600 creative is available the request returns unfilled, which is the
	 * measured shape of this rail: match rate ad_requests -> impressions sat at
	 * 1.71% post-adsfix and impr/pv ex-China is 2.30 while the site-wide ratio
	 * reads 26%, i.e. requests are being made and NOT filled.
	 * data-ad-format="auto" lets AdSense serve ANY creative that fits the 160px
	 * column (160x600, 120x600, 160x300, ...) instead of exactly one.
	 * full-width-responsive is pinned FALSE on purpose: this is a fixed 160px
	 * skyscraper rail, and letting AdSense widen it would re-open the CLS defect
	 * that .adslot_1's fixed 600px height exists to prevent (cycle-14e).
	 * 2026-09-14 rail-breakpoint measurement (ad-rail-breakpoint-measurement-runbook,
	 * RUN_DATE seo-reports/20260914-adrail). Measured .page-main-content rendered
	 * width at 1280/1366/1440/1550/1600px on the 3 top-money pages (heic-to-jpg,
	 * zip-file, lcd-test) with BOTH rails forced visible via a local Playwright
	 * override (getBoundingClientRect, not eyeballed): at 1280px heic-to-jpg and
	 * zip-file's main content is capped at 660px by a PRE-EXISTING upload-tool
	 * template rule unrelated to rail count (identical 660px whether 1 or 2 rails
	 * show) - below the runbook's >=940px pass bar, so 1280 is rejected per the
	 * runbook's own tie-break rule ("if 1366 passes but 1280 does not, the answer
	 * is 1366"). At 1366/1440/1550/1600 all three pages pass (main content
	 * 1000-1260px, matching or exceeding the container-math prediction of
	 * viewport-2x170px-rails), zero horizontal overflow, no tool-UI clipping.
	 * 1280px renders were byte-identical before/after (sha256), confirming zero
	 * regression below the new threshold. Breakpoint lowered 1550 -> 1365
	 * (max-width:1365px hides at/below 1365, matching this file's own N-hides-
	 * at-or-below-N convention, so both rails show starting AT 1366 inclusive -
	 * the decided value). Evidence: seo-reports/20260914-adrail/ad-rail/.
	 -->
	<ins class="adsbygoogle adslot_1"
	     data-ad-client="ca-pub-2317460280557760"
	     data-ad-slot="6433735850"
	     data-ad-format="auto"
	     data-full-width-responsive="false"></ins>
</div>

	<!-- Responsive-ad-unit -->

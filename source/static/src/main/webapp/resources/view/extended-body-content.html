<script>
    var darkTgl = document.getElementById('dark-tgl');
    var htmlRoot = document.getElementsByTagName('html')[0];
    var mainNav = document.getElementById('mainNavBar');
    var isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    function minifyPageName(pName) {
        if (pName) {
            if (pName.length > 13) {
                return pName.replaceAll(/-/g, '').substr(0, 10) + '... ';
            } else {
                return pName.replaceAll(/-/g, '').substr(0, 13) + ' ';
            }
        } else {
            return '';
        }
    };

    function getCookie(cname) {
        var name = cname + "=";
        var decodedCookie = decodeURIComponent(document.cookie);
        var ca = decodedCookie.split(';');
        for(var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) == ' ') {
            c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
            }
        }
        return "";
    };

    isLoadAds = isLoadAds && (getCookie('disableAd') === '' || getCookie('disableAd') === 'false');

    if (isLoadAds) {
        try {
            document.querySelector('html.main-html').classList.remove('ads-disabled');
        } catch (e) {}
    } else {
        document.querySelector('html.main-html').classList.add('ads-disabled');
    }

    if (isDarkMode) {
        try {
            ga('send', {
                hitType: 'event',
                eventCategory: 'Explore',
                eventAction: minifyPageName(pageName) + 'sys DM on',
                eventLabel: pageName
            });
        } catch (e) {}
    }

    if ((isDarkMode && typeof localStorage['dark'] === 'undefined') || localStorage['dark'] == true || localStorage['dark'] === 'true') {
        htmlRoot.className += ' dark';
        darkTgl ? (darkTgl.checked = true) : '';
    }

    if (darkTgl.checked) {
        try {
            ga('send', {
                hitType: 'event',
                eventCategory: 'Explore',
                eventAction: minifyPageName(pageName) + 'DM onload',
                eventLabel: pageName
            });
        } catch (e) {}
    }

    darkTgl ? darkTgl.addEventListener('change', (event) => {
        if (event.currentTarget.checked) {
            document.getElementsByTagName('html')[0].className += ' dark';
            mainNav.classList.add('w3-white');
            localStorage['dark'] = true;
        } else {
            document.getElementsByTagName('html')[0].classList.remove('dark');
            mainNav.classList.remove('w3-white');
            localStorage['dark'] = false;
        }
    }) : '';

    const MAX_DUR_SEC_ULD_EACH_FILE = 30;
    const AVG_FILE_PRC_DUR_SEC = 8;
    const DOWN_AND_UP_RATIO = 1.5;
    const AVG_FILE_SIZE_MB = 3;
    const TEST_ULD_SIZE_MB = 1;
    const DEFAULT_ULD_PARALLEL = 4;
    var IS_ADS_INIT = false;
    /* Identity of the no-op `loadAds` stub declared in the page bootstrap, captured
     * HERE because this script runs before module-loader.js can reassign it.
     * module-loader.js is fetched ASYNCHRONOUSLY (loadScript() inside startScripts()),
     * so `loadAds` can still be the stub when an ad trigger fires. Comparing identity
     * is how we tell "the real loader is ready" from "still the stub" without depending
     * on anything inside the minified bundle. See initAdsOnce() below. */
    var ADS_LOADER_STUB = (typeof loadAds === 'function') ? loadAds : null;
</script>

<script>
    /* -- AD INITIALISATION (one-shot) ---------------------------------------------
     * Extracted from the first-user-interaction handler on 2026-08-14. The BODY of
     * this function is byte-for-byte the previous logic; what changed is only WHEN
     * it can run, plus one new bail-out. Two measured defects motivated it:
     *
     * DEFECT 1 - no trigger without interaction (render-rate 63%).
     *   Ad init was reachable ONLY from the interaction handler below (click /
     *   mousemove / keydown / touch...). No timer, no DOMContentLoaded, no scroll.
     *   A visitor who landed, read and left without moving the mouse or tapping
     *   NEVER requested an ad. Measured over 2026-07-16..08-13: AdSense served on
     *   44,940 pageviews vs 71,301 GA4 human pageviews = 63.0%; the 37% shortfall
     *   reproduced at 58-71% on every top-earning page, all correctly ad-enabled.
     *   At $3.03 page-RPM that is ~$86/30d gross. Fixed by the retry timer below.
     *
     * DEFECT 2 - a trigger that fires TOO EARLY permanently killed the pageview.
     *   module-loader.js (which assigns the real `loadAds`) is fetched async from
     *   startScripts(), while the interaction handler is bound immediately. An early
     *   mousemove therefore set IS_ADS_INIT = true and called the no-op STUB: no ad
     *   request, no retry, and because isLoadAds was true the slots were not even
     *   stripped - so the reader got empty reserved ad boxes for the whole pageview.
     *   Fixed by the ADS_LOADER_STUB identity check, which bails WITHOUT consuming
     *   the one-shot guard so a later trigger still succeeds.
     *
     * PRESERVED DELIBERATELY (do not "simplify" these away):
     *   - the `disableAd` cookie path (:67) and the top-nav disable-ads button: when
     *     ads are off, isLoadAds is false, so this function still takes the else
     *     branch and strips .ad-section exactly as before. $("#disableAds").show()
     *     stays inside the real loadAds in module-loader.js, untouched.
     *   - the `?noads=1` escape hatch.
     *   - the one-shot IS_ADS_INIT guard: adsbygoogle.push({}) must never run twice
     *     for one slot.
     * @returns {boolean} true when the one-shot decision was made (no retry needed).
     */
    function initAdsOnce() {
        try {
            if (IS_ADS_INIT) { return true; }
            var slotsVisible = $('.ad-section > .adsbygoogle:visible').length > 0;
            var adsWanted = isLoadAds && slotsVisible && getParamValue('noads') == null;
            /* DEFECT 2 guard: the real loader has not been assigned yet. Do NOT set
             * IS_ADS_INIT - return false so the retry timer / next interaction tries
             * again once module-loader.js has parsed. */
            if (adsWanted && ADS_LOADER_STUB !== null && loadAds === ADS_LOADER_STUB) {
                return false;
            }
            IS_ADS_INIT = true;
            isLoadAds = isLoadAds && slotsVisible;
            if (isLoadAds && getParamValue('noads') == null) {
                loadAds();
            } else {
                document.querySelectorAll('.ad-section' + (w_winds < 1000 ? ':not(.top-ad)' : '')).forEach(function(element) {
                    element.remove();
                });
            }
            return true;
        } catch (e){}
        return false;
    }

    $(document).ready(function() {
        startScripts();
        /* Fast path, unchanged: the first real interaction initialises ads. `scroll`
         * is added because a scroll-only reader is exactly the cohort DEFECT 1
         * describes and it costs nothing to catch them immediately. */
        $(document).on("scroll click dblclick mousedown mouseup mousemove mouseenter mouseleave keydown keyup touchstart touchmove touchend", function(event) {
            initAdsOnce();
        });

        /* DEFECT 1 + 2 fix: an interaction-independent retry. Runs until the decision
         * is actually made, so it also covers the window where module-loader.js has
         * not finished loading. Bounded (25 x 400ms = 10s) so it can never spin.
         * No CLS risk: every slot's box is size-reserved before fill (.adslot_0 90px,
         * .ad-panel 600px), and `ads-disabled` - the class that collapses those boxes -
         * was already removed at :71 for opted-in visitors, so filling a reserved box
         * shifts nothing. Kill switch: ?noads=1 still short-circuits inside
         * initAdsOnce(). */
        var adsRetryCount = 0;
        var adsRetryTimer = setInterval(function() {
            adsRetryCount += 1;
            if (initAdsOnce() || adsRetryCount >= 25) {
                clearInterval(adsRetryTimer);
            }
        }, 400);

        if (!isLoadAds || getParamValue('noads') == null) {
            $('html.main-html').removeClass('ads-init');
        }
    });
</script>

<script>
    /* ==========================================================================
     * FTOL in-browser tool dropzone - shared behaviour (2026-08-15)
     *
     * Companion to the .ftol-ct-drop rules in tags/style-all-default.tag. The
     * CSS alone already gives click, keyboard and native drag-and-drop (the
     * real <input type=file> is stretched over the drop area at opacity 0), so
     * this file only owns the two things CSS cannot express:
     *
     *   1. WHICH FILES ARE PICKED. Covering the input hides the UA's own
     *      "3 files" text, so without this the reader would get no feedback on
     *      a selection. Delegated on capture so page code that stops
     *      propagation cannot suppress it.
     *   2. DRAG-OVER STATE. There is no :drag-over pseudo-class.
     *
     * Plus the UPGRADE path, which is the actual root-cause fix for the wider
     * defect: 26 of the pages with an in-browser picker build their whole tool
     * UI from a BODYJS innerHTML template, so there is no server-rendered
     * markup to give a class to. Rather than hand-patch 26 innerHTML strings
     * (and require every future client tool to remember), any raw file input on
     * a fully-client-side page is wrapped in the shared drop area here, once.
     *
     * ELIGIBILITY is deliberately narrow - a bare file input elsewhere on the
     * site (a game save import, a hidden trigger behind a custom button) must
     * NOT sprout a 104px drop area:
     *   - inside .ftol-client-tool                      (the 9 opt-in panels)
     *   - OR web.localUpload === false AND the input carries w3-input
     *     (the client-tool archetype signature: every JS-built input is
     *     `class="w3-input w3-border"` with an inline max-width, i.e. authored
     *     to be a visible bordered control. localUpload === false is the
     *     codebase's own declaration that the page never uses the upload
     *     pipeline, which is what licenses the "nothing is uploaded" hint)
     *   - OR an explicit data-ftol-drop attribute            (opt-in escape)
     *   - NEVER inside [data-ftol-no-drop]                  (opt-out escape)
     *   - NEVER an input that is not rendered (display:none / hidden)
     * Verified by DOM census with a 23-page control set: 0 dropzones appeared
     * on any page that should not have one (code-editor, note-taking-app,
     * linux-online, retro-fps-online, the trackers, places-3d, gpu-test).
     *
     * CLS: the observer callback is a microtask, so an input written by
     * innerHTML is upgraded in the same task, BEFORE the browser paints it -
     * the reader never sees the raw control get replaced. The drop area's
     * height is fixed in CSS, and the selected-file line is height-reserved.
     * Zero extra requests, zero new dependencies, no jQuery.
     * ========================================================================== */
    (function () {
        var READY = 'data-ftol-drop-ready';

        function describe(input) {
            var acc = String(input.getAttribute('accept') || '').toLowerCase();
            var kind = 'file';
            if (/heic|heif/.test(acc)) { kind = 'HEIC photo'; }
            else if (/pdf/.test(acc)) { kind = 'PDF'; }
            else if (/gif/.test(acc)) { kind = 'GIF'; }
            else if (/video|\.mp4|\.mov|\.webm/.test(acc)) { kind = 'video'; }
            else if (/audio|\.mp3|\.wav|\.m4a|\.ogg/.test(acc)) { kind = 'audio file'; }
            else if (/image|\.png|\.jpg|\.jpeg|\.webp|\.avif/.test(acc)) { kind = 'image'; }
            var multi = !!input.multiple;
            var article = /^[aeiou]/.test(kind) ? 'an ' : 'a ';
            return {
                cta: 'Drag and drop ' + (multi ? (kind + 's') : (article + kind)) + ' or click to select',
                hint: (multi ? 'One or many - processed' : 'Processed') + ' on your device, nothing is uploaded'
            };
        }

        function rendered(el) {
            if (el.hidden) { return false; }
            if (el.style && el.style.display === 'none') { return false; }
            if (!window.getComputedStyle) { return true; }
            var cs = window.getComputedStyle(el);
            return !(cs.display === 'none' || cs.visibility === 'hidden');
        }

        function eligible(el) {
            if (!el || el.type !== 'file') { return false; }
            if (el.hasAttribute(READY)) { return false; }
            if (!el.closest) { return false; }
            if (el.closest('.ftol-ct-drop')) { return false; }
            if (el.closest('[data-ftol-no-drop]')) { return false; }
            var wanted = el.hasAttribute('data-ftol-drop')
                || !!el.closest('.ftol-client-tool')
                || (window.web && window.web.localUpload === false && el.classList.contains('w3-input'));
            return wanted ? rendered(el) : false;
        }

        function upgrade(el) {
            var parent = el.parentNode;
            if (!parent) { return; }
            el.setAttribute(READY, '1');   /* set BEFORE the move so the observer's own record is a no-op */
            var text = describe(el);
            var label = document.createElement('label');
            label.className = 'ftol-ct-drop';
            /* carry the author's width / centering intent to the new outer box */
            if (el.style.maxWidth) { label.style.maxWidth = el.style.maxWidth; el.style.maxWidth = ''; }
            if (el.style.margin) { label.style.margin = el.style.margin; el.style.margin = ''; }
            el.classList.remove('w3-input', 'w3-border');
            parent.insertBefore(label, el);
            label.appendChild(el);   /* a DOM move - listeners, id and .files all survive */
            /* insertAdjacentHTML appends without re-serialising the input above */
            label.insertAdjacentHTML('beforeend',
                '<span class="ftol-ct-drop-cta"></span>'
                + '<span class="ftol-ct-drop-hint"></span>'
                + '<span class="ftol-ct-drop-files" data-ftol-drop-empty="No file selected"></span>');
            label.querySelector('.ftol-ct-drop-cta').textContent = text.cta;
            label.querySelector('.ftol-ct-drop-hint').textContent = text.hint;
        }

        function scan(root) {
            if (!root || !root.querySelectorAll) { return; }
            var list = root.querySelectorAll('input[type="file"]:not([' + READY + '])');
            for (var i = 0; i < list.length; i++) {
                if (eligible(list[i])) { upgrade(list[i]); }
            }
        }

        function showPicked(el) {
            var drop = el.closest ? el.closest('.ftol-ct-drop') : null;
            var out = drop ? drop.querySelector('.ftol-ct-drop-files') : null;
            if (!out) { return; }
            var files = el.files;
            if (!files || !files.length) { out.textContent = ''; return; }
            if (files.length === 1) { out.textContent = files[0].name; return; }
            var head = [];
            for (var i = 0; i < files.length && i < 3; i++) { head.push(files[i].name); }
            out.textContent = files.length + ' files: ' + head.join(', ')
                + (files.length > 3 ? ' and ' + (files.length - 3) + ' more' : '');
        }

        function dragState(e, on) {
            var t = e.target;
            var drop = (t && t.closest) ? t.closest('.ftol-ct-drop') : null;
            if (drop) { drop.classList.toggle('is-dragover', on); }
        }

        try {
            document.addEventListener('change', function (e) {
                if (e.target && e.target.type === 'file') { showPicked(e.target); }
            }, true);
            document.addEventListener('dragenter', function (e) { dragState(e, true); }, true);
            document.addEventListener('dragover', function (e) { dragState(e, true); }, true);
            document.addEventListener('dragleave', function (e) { dragState(e, false); }, true);
            document.addEventListener('drop', function (e) { dragState(e, false); }, true);

            scan(document);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () { scan(document); });
            }
            if (window.MutationObserver) {
                new MutationObserver(function (records) {
                    for (var i = 0; i < records.length; i++) {
                        var added = records[i].addedNodes;
                        for (var j = 0; j < added.length; j++) {
                            var node = added[j];
                            if (!node || node.nodeType !== 1) { continue; }
                            if (node.tagName === 'INPUT') {
                                if (eligible(node)) { upgrade(node); }
                            } else {
                                scan(node);
                            }
                        }
                    }
                }).observe(document.documentElement, { childList: true, subtree: true });
            }
        } catch (e) { /* never break a page over picker chrome */ }
    })();
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title-amazor desc-amazor">
  <title id="title-amazor">Amazon River 3D Explorer - Meandering river with tributaries</title>
  <desc id="desc-amazor">A schematic depiction of the Amazon River system: a meandering teal river path flowing through the landscape, with tributaries branching inward, and a sediment plume at the mouth</desc>

  <!-- Background -->
  <rect width="64" height="64" fill="#3C3C3E"/>

  <!-- River meandering path (teal - approved palette) -->
  <path d="M 8 8 Q 16 12, 20 16 T 28 28 T 32 40 T 40 48"
        stroke="#7DAFA3" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Tributary 1 (ultramarine - darker) -->
  <path d="M 20 16 Q 12 18, 8 22"
        stroke="#5B73AE" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Tributary 2 (ultramarine) -->
  <path d="M 28 28 Q 36 26, 40 24"
        stroke="#5B73AE" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Sediment plume at mouth (champagne) -->
  <circle cx="40" cy="56" r="6" fill="#D9C7A3" opacity="0.8"/>
  <circle cx="44" cy="58" r="4" fill="#D9C7A3" opacity="0.5"/>
</svg>

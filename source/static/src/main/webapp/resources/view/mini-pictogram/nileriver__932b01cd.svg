<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-nileriver desc-nileriver">
  <title id="title-nileriver">Nile River 3D Explorer</title>
  <desc id="desc-nileriver">The world's longest river flowing from south to north through Africa, with delta at the top and source at the bottom</desc>

  <!-- Background: light gray -->
  <rect width="64" height="64" fill="#F0F0F2"/>

  <!-- Bottom: river source (Lake Victoria area) - teal dot -->
  <circle cx="32" cy="56" r="3" fill="#7DAFA3"/>

  <!-- River: meandering blue ribbon from south to north -->
  <path d="M 32 56 Q 24 48, 28 40 Q 36 32, 28 24 Q 20 16, 32 8"
        stroke="#5B73AE" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Delta fan at top: widened water shape -->
  <ellipse cx="28" cy="4" rx="8" ry="2" fill="#5B73AE" opacity="0.8"/>
  <ellipse cx="36" cy="4" rx="6" ry="2" fill="#5B73AE" opacity="0.6"/>

  <!-- Marker for Aswan/dam region (middle) -->
  <circle cx="29" cy="24" r="2" fill="#FF4D00" opacity="0.7"/>

  <!-- Marker for delta cities (top) -->
  <circle cx="30" cy="6" r="1.5" fill="#FF4D00" opacity="0.7"/>
</svg>
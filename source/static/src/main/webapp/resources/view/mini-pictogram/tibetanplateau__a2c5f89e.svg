<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tp-title tp-desc">
  <defs>
    <style>
      .tp-bg { fill: #1C1C1E; }
      .tp-plateau { fill: #D9C7A3; }
      .tp-peak { fill: #FFFFFF; }
      .tp-accent { fill: #B3C5B0; }
    </style>
  </defs>
  <title id="tp-title">Tibetan Plateau</title>
  <desc id="tp-desc">High-altitude plateau with mountain peaks</desc>
  
  <!-- Background -->
  <rect width="96" height="96" class="tp-bg"/>
  
  <!-- Plateau base -->
  <rect x="8" y="56" width="80" height="32" class="tp-plateau"/>
  
  <!-- Mountain peaks -->
  <polygon points="32,56 20,24 44,56" class="tp-accent"/>
  <polygon points="64,56 48,8 80,56" class="tp-peak"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="atacama-title atacama-desc">
  <defs>
    <style>
      .atacama-bg { fill: #1C1C1E; }
      .atacama-salt { fill: #D9C7A3; }
      .atacama-peak { fill: #3C3C3E; }
      .atacama-star { fill: #FFFFFF; }
    </style>
  </defs>
  <title id="atacama-title">Atacama Desert 3D Explorer</title>
  <desc id="atacama-desc">Atacama Desert: salt flats beneath volcanic peaks under a starry night sky</desc>

  <!-- Night sky background -->
  <rect class="atacama-bg" width="100" height="100"/>

  <!-- Salt flat base -->
  <ellipse class="atacama-salt" cx="50" cy="70" rx="45" ry="20"/>

  <!-- Volcanic peaks -->
  <polygon class="atacama-peak" points="25,70 15,35 35,70"/>
  <polygon class="atacama-peak" points="75,70 65,40 85,70"/>

  <!-- Stars (astronomical clarity) -->
  <circle class="atacama-star" cx="20" cy="15" r="1.5"/>
  <circle class="atacama-star" cx="35" cy="12" r="1"/>
  <circle class="atacama-star" cx="50" cy="10" r="1.2"/>
  <circle class="atacama-star" cx="70" cy="15" r="1"/>
  <circle class="atacama-star" cx="85" cy="18" r="1.5"/>
  <circle class="atacama-star" cx="15" cy="30" r="0.8"/>
  <circle class="atacama-star" cx="90" cy="35" r="1"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cavern-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A89968;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B7355;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Ceiling -->
  <ellipse cx="64" cy="32" rx="48" ry="20" fill="url(#cavern-grad)" opacity="0.9"/>
  <!-- Stalactites -->
  <polygon points="40,32 37,50 43,50" fill="#9A8B6B"/>
  <polygon points="88,32 85,48 91,48" fill="#9A8B6B"/>
  <polygon points="64,32 61,46 67,46" fill="#8B7355"/>
  <!-- Cavern walls -->
  <path d="M 20 32 Q 20 80 64 95 Q 108 80 108 32" fill="#A89968" opacity="0.7"/>
  <!-- Underground river -->
  <path d="M 30 75 Q 64 82 98 75" stroke="#1A8FB8" stroke-width="6" fill="none" opacity="0.8" stroke-linecap="round"/>
  <!-- Jungle accent (green vegetation) -->
  <g opacity="0.7">
    <polygon points="50,65 45,75 55,75" fill="#2D5016"/>
    <polygon points="75,65 70,75 80,75" fill="#3A6B1A"/>
    <polygon points="62,70 59,80 65,80" fill="#4A8C2A"/>
  </g>
  <!-- Stalagmites -->
  <polygon points="35,95 32,75 38,95" fill="#9A8B6B"/>
  <polygon points="90,95 87,77 93,95" fill="#9A8B6B"/>
  <!-- Label -->
  <text x="64" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">Son Doong</text>
</svg>

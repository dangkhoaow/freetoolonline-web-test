<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pamirTitle pamirDesc">
  <title id="pamirTitle">Pamir Plateau</title>
  <desc id="pamirDesc">Converging mountain ranges forming the world's highest plateau</desc>
  <defs>
    <style>
      .pamir-bg { fill: #1C1C1E; }
      .pamir-ridge { fill: #7DAFA3; }
      .pamir-peak { fill: #FFFFFF; stroke: none; }
      .pamir-valley { fill: #3C3C3E; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="200" height="160" class="pamir-bg"/>
  <!-- Central plateau base -->
  <polygon points="100,80 50,120 150,120" class="pamir-valley"/>
  <!-- Converging ridges forming the knot -->
  <polygon points="100,50 70,85 100,80 130,85" class="pamir-ridge"/>
  <polygon points="80,70 60,95 85,90 95,75" class="pamir-valley"/>
  <polygon points="120,70 105,75 115,90 140,95" class="pamir-valley"/>
  <!-- Major peaks -->
  <polygon points="100,30 85,65 115,65" class="pamir-peak"/>
  <polygon points="70,60 60,80 80,75" class="pamir-ridge"/>
  <polygon points="130,60 120,75 140,80" class="pamir-ridge"/>
  <!-- Valley depth accent -->
  <polygon points="95,100 105,100 103,115 97,115" class="pamir-ridge" opacity="0.6"/>
</svg>

<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="#1C1C1E" rx="4"/>
  
  <!-- Sky/clouds reference -->
  <circle cx="64" cy="50" r="35" fill="#7DAFA3" opacity="0.3" />
  
  <!-- Mountain cone: snow peak (upper triangle) -->
  <polygon points="64,20 95,65 33,65" fill="url(#snowGrad)" stroke="#E0E0E0" stroke-width="0.5"/>
  
  <!-- Mountain cone: rock base (lower section) -->
  <polygon points="95,65 110,95 18,95 33,65" fill="url(#rockGrad)" stroke="#3C3C3E" stroke-width="0.5"/>
  
  <!-- Cloud band detail -->
  <ellipse cx="64" cy="68" rx="50" ry="8" fill="#CCCCDD" opacity="0.6"/>
  
  <!-- Accent: peak highlight -->
  <circle cx="64" cy="28" r="3" fill="#FFCC00" opacity="0.8"/>
  
  <!-- Border -->
  <rect width="128" height="128" fill="none" stroke="#3C3C3E" stroke-width="1" rx="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title-ar desc-ar">
  <defs>
    <title id="title-ar">Amazon River meandering with discharge plume</title>
    <desc id="desc-ar">Top-down view showing the Amazon's meandering channels through a lowland basin with silt plume extending into the Atlantic</desc>
  </defs>
  <style>
    .bg { fill: #3C3C3E; }
    .river { fill: none; stroke: #7DAFA3; stroke-width: 3; stroke-linecap: round; }
    .land { fill: #B3C5B0; }
    .plume { fill: #D9C7A3; opacity: 0.7; }
  </style>
  <rect class="bg" width="100" height="100"/>
  <ellipse class="land" cx="50" cy="45" rx="32" ry="28"/>
  <path class="river" d="M 30 25 Q 38 32 35 40 Q 32 48 42 52 Q 52 56 48 65 Q 45 72 56 76 Q 68 80 70 88"/>
  <ellipse class="plume" cx="72" cy="82" rx="9" ry="16"/>
</svg>

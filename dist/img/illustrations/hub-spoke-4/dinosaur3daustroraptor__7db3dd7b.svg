  <rect x="465" y="16" width="159" height="64" rx="12" fill="#3C3C3E" aria-hidden="true"/>
  <circle cx="485" cy="48" r="8" fill="#7DAFA3" aria-hidden="true"/>
  <text x="499" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="500" fill="#FFFFFF"><tspan x="499" dy="0">Weight: about</tspan><tspan x="499" dy="19">300-520 kg</tspan></text>

<svg viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-featurebadge-bb1845-title svg-featurebadge-bb1845-desc">
  <title id="svg-featurebadge-bb1845-title">Máy đo nồng độ cồn chạy trong trình duyệt, không gửi dữ liệu lên máy chủ</title>

  <title id="svg-minipictogram-blacksea-title">Black Sea - a thin oxygen-rich layer over a dark anoxic basin</title>
  <desc id="svg-minipictogram-blacksea-desc">A rounded basin shape with a light teal band near the top and a near-black band filling most of the body below it, showing a shallow oxic layer over a deep anoxic zone.</desc>
